<title>Словарь денди</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: справочник — шапка с полосой тканого узора, липкий алфавит, одна колонка чтения ~68ch, статьи как карточки словаря без лишних рамок */
:root {
  --bg: #f5f6f9;          /* небелёный хлопок с холодным индиго-оттенком */
  --paper: #ffffff;
  --ink: #1b2145;         /* индиго-чернила */
  --muted: #5d6384;
  --line: #dde0ea;
  --accent: #2c3f9b;      /* индиго */
  --accent-soft: #e7eaf7;
  --ochre: #a2621b;       /* пометки: мало примеров, написание не установлено */
  --ochre-soft: #f6ecdc;
  --weave-a: #2c3f9b;
  --weave-b: #f5f6f9;
  --f-display: "Alegreya", "PT Serif", Georgia, serif;
  --f-body: "Alegreya Sans", "PT Sans", "Segoe UI", system-ui, sans-serif;
  --f-dendi: "Gentium Book Plus", "Gentium Plus", "Noto Serif", "Charis SIL", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12152a; --paper: #1a1e38; --ink: #e6e8f4; --muted: #a2a7c6; --line: #2d3254;
    --accent: #9fb0ff; --accent-soft: #252c55; --ochre: #e0a65e; --ochre-soft: #3a2d1c;
    --weave-a: #6f82e0; --weave-b: #12152a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12152a; --paper: #1a1e38; --ink: #e6e8f4; --muted: #a2a7c6; --line: #2d3254;
  --accent: #9fb0ff; --accent-soft: #252c55; --ochre: #e0a65e; --ochre-soft: #3a2d1c;
  --weave-a: #6f82e0; --weave-b: #12152a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.dn { font-family: var(--f-dendi); }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; }

header.top { background: var(--paper); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 18px 14px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand a { color: var(--ink); }
.brand .name { font-family: var(--f-display); font-weight: 700; font-size: 2rem; line-height: 1; letter-spacing: .01em; }

nav.main { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .98rem; margin-left: auto; }

.weave { height: 8px; background:
  repeating-linear-gradient(90deg, var(--weave-a) 0 6px, var(--weave-b) 6px 9px, var(--weave-a) 9px 11px, var(--weave-b) 11px 18px); opacity: .85; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-direction: column; gap: 8px; padding-block: 10px; }
.search { display: flex; gap: 8px; align-items: center; }
.search input[type=search] { flex: 1; min-width: 0; font: inherit; font-family: var(--f-dendi); font-size: 1.05rem; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.search input[type=search]:focus { outline: 2px solid var(--accent); border-color: transparent; }

.chars { display: flex; gap: 4px; }
.chars button { font-family: var(--f-dendi); font-size: 1rem; width: 32px; height: 34px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 6px; cursor: pointer; }

.abc { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.abc a, .abc span { flex: 0 0 auto; min-width: 30px; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; padding: 3px 4px; border-radius: 5px; }
.abc a { color: var(--accent); }
.abc a:hover { background: var(--accent-soft); text-decoration: none; }
.abc a.on { background: var(--accent); color: var(--paper); }
.abc span { color: var(--line); }

main { padding-block: 24px 64px; }
.page { max-width: 760px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: 2.3rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.lead { font-size: 1.1rem; color: var(--ink); }
.muted { color: var(--muted); }

.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.code { font-family: var(--f-mono); font-size: .82em; }
.statline { display: flex; flex-wrap: wrap; gap: 6px 18px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; }
.statline b { color: var(--ink); font-weight: 700; }

/* словник */
.letters { display: flex; flex-direction: column; gap: 22px; margin-top: 8px; }
.lgroup { display: grid; grid-template-columns: 52px 1fr; gap: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.lgroup .L { font-family: var(--f-display); font-weight: 700; font-size: 2rem; line-height: 1; color: var(--accent); }
.wl { list-style: none; margin: 0; padding: 0; columns: 3 200px; column-gap: 24px; }
.wl li { break-inside: avoid; padding: 2px 0; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.wl .f { font-family: var(--f-dendi); color: var(--muted); font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.tag { display: inline-block; font-size: .72rem; letter-spacing: .04em; padding: 1px 7px; border-radius: 99px; white-space: nowrap; font-weight: 500; vertical-align: 2px; }
.tag.warn { background: var(--ochre-soft); color: var(--ochre); }
.tag.info { background: var(--accent-soft); color: var(--accent); }

/* статья */
.crumbs { font-size: .9rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.entry-head { display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.entry-head .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; }
.forms { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
.forms li { display: grid; grid-template-columns: minmax(0, 13rem) 1fr; gap: 4px 16px; align-items: baseline; }
.forms .fw { font-family: var(--f-dendi); font-weight: 700; font-size: 1.45rem; line-height: 1.2; overflow-wrap: anywhere; }
.forms .fs { font-size: .9rem; color: var(--muted); min-width: 0; }
.forms .fn { grid-column: 2; font-size: .95rem; min-width: 0; }
.box { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.box.warn { background: var(--ochre-soft); border-color: transparent; }
.box .label { display: block; margin-bottom: 4px; }
.ex { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ex li { display: grid; grid-template-columns: 2.2rem 1fr; gap: 2px 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.ex li:first-child { border-top: 0; }
.ex .k { font-variant-numeric: tabular-nums; color: var(--muted); font-family: var(--f-mono); font-size: .85rem; padding-top: 4px; }
.ex .body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ex .dt { font-family: var(--f-dendi); font-size: 1.15rem; font-style: italic; overflow-wrap: anywhere; }
.ex .gl { font-size: 1rem; }
.ex .gl .gt { color: var(--muted); font-size: .82rem; margin-right: 6px; }
.ex .src { font-size: .85rem; color: var(--muted); }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; font-style: normal; }
.related { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.pager { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; font-size: .98rem; }
.pager a { display: flex; flex-direction: column; min-width: 0; }
.pager a.next { text-align: right; margin-left: auto; }
.pager small { color: var(--muted); font-size: .8rem; }

/* поиск */
.res { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.res li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.res .rt { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.res .rf { font-family: var(--f-dendi); color: var(--muted); overflow-wrap: anywhere; }
.res .rx { font-size: .92rem; color: var(--muted); overflow-wrap: anywhere; }
.res .rx .dn { font-style: italic; color: var(--ink); }

/* денди → русский */
.rev { display: flex; flex-direction: column; gap: 18px; }
.rev .grp { display: grid; grid-template-columns: 52px 1fr; gap: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.rev .grp .L { font-family: var(--f-dendi); font-weight: 700; font-size: 1.8rem; line-height: 1; color: var(--accent); }
.rev dl { margin: 0; display: grid; grid-template-columns: minmax(0, max-content) 1fr; gap: 3px 16px; }
.rev dt { font-family: var(--f-dendi); font-weight: 700; overflow-wrap: anywhere; }
.rev dd { margin: 0; min-width: 0; }

/* грамматика */
.rules { counter-reset: r; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.rules li { display: grid; grid-template-columns: 2rem 1fr; gap: 8px; }
.rules .n { font-family: var(--f-display); font-weight: 700; color: var(--accent); font-size: 1.15rem; }
.gex { display: flex; flex-direction: column; gap: 12px; }
.gex .box { display: flex; flex-direction: column; gap: 4px; }
.gex .id { font-family: var(--f-mono); font-size: .8rem; color: var(--accent); }
.gex .d { font-family: var(--f-dendi); font-size: 1.3rem; font-style: italic; }
.gex .r { font-weight: 500; }
.gloss { display: flex; flex-wrap: wrap; gap: 6px 4px; margin-top: 4px; }
.gloss span { display: inline-flex; flex-direction: column; align-items: flex-start; padding: 3px 8px; background: var(--bg); border-radius: 6px; }
.gloss .gw { font-family: var(--f-dendi); font-style: italic; }
.gloss .gw a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.gloss .gg { font-size: .78rem; color: var(--muted); }

/* источники */
.bars { display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums; }
.brow { display: grid; grid-template-columns: 4.2rem 1fr 6.5rem; gap: 10px; align-items: center; font-size: .92rem; }
.brow .track { height: 14px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
.brow .fill { height: 100%; background: var(--accent); }
.brow .v { text-align: right; color: var(--muted); }
.srcs { display: flex; flex-direction: column; gap: 16px; }
.srcs article { display: grid; grid-template-columns: 6rem 1fr; gap: 4px 14px; scroll-margin-top: 140px; }
.srcs .c { font-family: var(--f-mono); font-weight: 500; color: var(--accent); overflow-wrap: anywhere; }
.srcs .t { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.srcs .u { font-size: .85rem; overflow-wrap: anywhere; }
.srcs article.hl { background: var(--accent-soft); border-radius: 8px; }
footer { border-top: 1px solid var(--line); padding-block: 18px 28px; color: var(--muted); font-size: .88rem; }

@media (max-width: 560px) {
  body { font-size: 16px; }
  h1 { font-size: 1.9rem; }
  .brand .name { font-size: 1.7rem; }
  nav.main { margin-left: 0; }
  .forms li { grid-template-columns: 1fr; }
  .forms .fn { grid-column: 1; }
  .lgroup, .rev .grp { grid-template-columns: 1fr; gap: 4px; }
  .srcs article { grid-template-columns: 1fr; }
  .brow { grid-template-columns: 3.6rem 1fr 5.6rem; }
  .chk span.long { display: none; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
/* варианты и полные примеры */

.vh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.vl { font-family: var(--f-display); font-weight: 700; color: var(--accent); font-size: 1.05rem; min-width: 1.6rem; }

.exs { display: flex; flex-direction: column; gap: 12px; }
.exc { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.dsent { font-family: var(--f-dendi); font-size: 1.25rem; line-height: 1.4; overflow-wrap: anywhere; }

.md { display: flex; flex-direction: column; gap: 10px; }

/* разбор фразы */

}

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const E = D.entries;
const byN = {}; E.forEach(e => byN[e.n] = e);
const ALPHA = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ'.split('');
// заголовки на другую букву (например, латинскую: COVID-19) — отдельными группами в конце
ALPHA.push(...[...new Set(E.map(e => e.letter))].filter(l => !ALPHA.includes(l)).sort());
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const foldRu = s => s.toLowerCase().replace(/ё/g, 'е');
const foldDn = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/ɛ/g,'e').replace(/ɔ/g,'o').replace(/ŋ/g,'n').replace(/ɲ/g,'ny').replace(/[‹›«»"'’.,;:!?()\/]/g,'').replace(/[\s-]+/g,'');
const fold = s => foldDn(foldRu(s));
// свободный ключ: как foldDn, но ещё и без удвоений (gono = goono, bene = bɛɛnɛ)
const looseDn = s => foldDn(s).replace(/(.)\1+/g, '$1');
// близость написания: насколько форма словаря отличается от того, что набрал читатель
const SP_BASE = { 'ɛ': 'e', 'ɔ': 'o', 'ŋ': 'n' };
const spChars = s => [...s.normalize('NFD').replace(/[̀-ͯ]/g, '').normalize('NFC').toLowerCase().replace(/[\s\-‹›'’.,;:!?()«»"\/]/g, '')];
function spellDist(typed, form) {
  const a = spChars(typed), b = spChars(form), bc = c => SP_BASE[c] || c;
  const indel = (s, i) => (i > 0 && bc(s[i - 1]) === bc(s[i])) || (i + 1 < s.length && bc(s[i + 1]) === bc(s[i])) ? 0.5 : 1;
  let prev = [0]; for (let j = 1; j <= b.length; j++) prev[j] = prev[j - 1] + indel(b, j - 1);
  for (let i = 1; i <= a.length; i++) {
    const cur = [prev[0] + indel(a, i - 1)];
    for (let j = 1; j <= b.length; j++) {
      const sub = a[i - 1] === b[j - 1] ? 0 : bc(a[i - 1]) === bc(b[j - 1]) ? 0.4 : 1;
      cur[j] = Math.min(prev[j - 1] + sub, prev[j] + indel(a, i - 1), cur[j - 1] + indel(b, j - 1));
    }
    prev = cur;
  }
  const tone = typed.normalize('NFC').toLowerCase() === form.normalize('NFC').toLowerCase() ? 0 : 0.05;
  return prev[b.length] + tone;
}
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; }

// варианты, формы, примеры
const variantForms = v => v.form.split(/[;,]\s+/).map(f => f.replace(/\s*\(.*?\)\s*/g, ' ').trim()).filter(Boolean);
const allForms = e => [...new Set(e.variants.flatMap(variantForms))];
const examplesOf = e => [...e.variants.flatMap(v => v.examples), ...(e.linked || [])];
const PID = {};   // П → { ex, entries[] }
E.forEach(e => examplesOf(e).forEach(x => { (PID[x.pid] = PID[x.pid] || { ex: x, entries: [] }); if (!PID[x.pid].entries.includes(e)) PID[x.pid].entries.push(e); }));
const PIDS = Object.keys(PID).sort((a, b) => +a.slice(1) - +b.slice(1));
const ST = {
  all: E.length, sw: E.filter(e => e.kind === 'swadesh').length, extra: E.filter(e => e.kind === 'extra').length,
  ex: PIDS.length, withEx: E.filter(e => examplesOf(e).length).length, unest: E.filter(e => e.unestablished).length
};

// источники → якоря; коды из библиографии
const SRC_IDS = {};
const addCode = (c, id) => { if (c && /^[A-Z][A-Z0-9-]*$/.test(c) && !SRC_IDS[c]) SRC_IDS[c] = id; };
D.sources.forEach(s => {
  s.code.split(/\s+[—\/]\s+|\s*\/\s*|\s+/).forEach(c => addCode(c, s.id));
  if (s.code.startsWith('T68')) SRC_IDS['T68/72'] = s.id;
});
if (D.rst) SRC_IDS['RST'] = D.rst.id;
const CODE_RE = new RegExp('(?<![\\wА-Яа-яЁё-])(' + Object.keys(SRC_IDS).sort((a, b) => b.length - a.length).map(c => c.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&')).join('|') + ')(?![\\wА-Яа-яЁё-])', 'g');
const fmt = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g, '$1<i>$2</i>');
const plainRich = t => fmt(esc(t)
  .replace(CODE_RE, m => SRC_IDS[m] ? `<a class="code" href="#${SRC_IDS[m]}" title="Описание источника">${m}</a>` : m)
  .replace(/П(\d+)/g, (m, d) => PID['П' + d] ? `<a class="pid" href="#p${d}" title="Полный пример ${m}">${m}</a>` : m)
  .replace(/ПГ(\d+)/g, (m, d) => (D.pg || {})[m] ? `<a class="pid pgid" href="#pg${d}" title="Пример грамматики ${m}">${m}</a>` : m));
const MARK = /⟦([a-z]):([^|⟧]*)\|([^⟧]*)⟧/g;
function rich(s) {
  s = String(s ?? ''); let out = '', last = 0, m;
  MARK.lastIndex = 0;
  while ((m = MARK.exec(s))) {
    out += plainRich(s.slice(last, m.index)); last = MARK.lastIndex;
    const [, k, ref, text] = m, t = fmt(esc(text));
    if (k === 'w' && byN[+ref]) out += `<a href="#w${ref}" title="${esc(byN[+ref].title)}">${t}</a>`;
    else if (k === 'p' && PID['П' + ref]) out += `<a class="pid" href="#p${ref}">${t}</a>`;
    else if (k === 's') out += `<a href="#${esc(ref)}">${t}</a>`;
    else if (k === 'g') out += `<a href="#gr-${esc(ref)}">${t}</a>`;
    else if (k === 'a') out += `<a href="#about">${t}</a>`;
    else if (k === 'q' && (D.pg || {})['ПГ' + ref]) out += `<a class="pid pgid" href="#pg${ref}">${t}</a>`;
    else if (k === 'u') out += `<a href="${esc(ref)}" target="_blank" rel="noopener">${t}</a>`;
    else out += t;
  }
  return out + plainRich(s.slice(last));
}
const PG_SEEN = new Set();   // ПГ, уже показанные на странице (якорь — у первого)
function blocks(bs, pre) {
  let out = '', list = null, hk = 0;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  bs.forEach(b => {
    if (b.t === 'li' || b.t === 'oli') {
      const want = b.t === 'li' ? 'ul' : 'ol';
      if (list !== want) { close(); out += want === 'ul' ? '<ul class="mdl">' : `<ol class="mdl" start="${b.n || 1}">`; list = want; }
      out += `<li>${rich(b.x)}</li>`; return;
    }
    close();
    if (b.t === 'pg') { const g = (D.pg || {})[b.id]; const first = !PG_SEEN.has(b.id); PG_SEEN.add(b.id); if (g) out += `<aside class="pgex"${first ? ` id="pg${b.id.slice(2)}"` : ''}><div class="pgh"><span class="pidtag pgtag">${esc(b.id)}</span><span class="pgt">${rich(g.title)}</span></div><div class="md">${blocks(g.blocks)}</div></aside>`; return; }
    if (b.t === 'table') { out += `<div class="mdt"><table><thead><tr>${b.head.map(c => `<th>${rich(c)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${rich(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; return; }
    if (pre && (b.t === 'h2' || b.t === 'h3')) { out += `<${b.t} id="${pre}-h${++hk}">${rich(b.x)}</${b.t}>`; return; }
    out += b.t === 'p' ? `<p>${rich(b.x)}</p>` : `<${b.t}>${rich(b.x)}</${b.t}>`;
  });
  close();
  return out;
}
const extLink = (text, url) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);

const formIndex = {};
E.forEach(e => allForms(e).forEach(ff => { const k = foldDn(ff); (formIndex[k] = formIndex[k] || []).push({ e, form: ff }); }));
const lettersPresent = new Set(E.map(e => e.letter));
const tagsFor = e => {
  const t = [];
  if (e.kind === 'extra') t.push('<span class="tag info">доп.</span>');
  if (e.unestablished) t.push('<span class="tag warn">написание не установлено</span>');
  return t.join(' ');
};
const wordLink = e => `<a href="#w${e.n}">${esc(e.title)}</a>`;
const primaryForms = e => e.variants.slice(0, 2).map(v => v.form).join(', ');

function drawAbc(active) {
  document.getElementById('abc').innerHTML = ALPHA.map((L, i) =>
    lettersPresent.has(L) ? `<a href="#l${i}" class="${L === active ? 'on' : ''}">${L}</a>` : `<span aria-hidden="true">${L}</span>`).join('');
}
const inLetter = L => E.filter(e => e.letter === L);

function letterGroup(L) {
  const items = inLetter(L).map(e => `<li>${wordLink(e)}${e.unestablished && !e.variants.length ? '<span class="none">—</span>' : `<span class="f">${esc(primaryForms(e))}</span>`}${e.kind === 'extra' ? ' <span class="tag info">доп.</span>' : ''}</li>`).join('');
  return `<section class="lgroup" id="g${ALPHA.indexOf(L)}"><div class="L">${L}</div><ul class="wl">${items}</ul></section>`;
}

const V = document.getElementById('view');
function vHome() {
  return `<div class="stack">
    <h1 class="vh-only">Русско-дендийский словарь</h1>
    <p class="lead">Денди — южносонгайский язык, имеющий распространение в северной части Бенина (города Джугу, Параку, Канди, Каримама), а также в граничащих с Бенином областях Нигера и Нигерии. Словарь составлен любителем и не претендует на строгую научность. При наличии уточнений, претензий, рекомендаций и т. п. можно <a href="#contacts">обратиться к автору</a>. На сайте присутствуют словарные статьи, классифицированные по русскому алфавиту, содержащие слова на денди и отрывки из дендийских текстов, обозначенные как <a href="#examples">примеры употребления</a> тех или иных слов. Список текстов, из которых берутся примеры, указан в <a href="#sources">соответствующем разделе</a>. Тексты носят разный характер, из чего следует, что определенные выражения могут носить стилистические особенности, характерные конкретному тексту (в частности, библейские или учебные выражения). Описание грамматики языка составляется в <a href="#grammar">соответствующем разделе</a> по существующим научным описаниям, а также на основе анализа имеющегося корпуса. Также словарь содержит <a href="#parse">раздел для перевода фраз</a> с денди на русский и обратно, который пока находится на стадии разработки (подробнее — в <a href="#parse">самом разделе</a>).</p>
    <div class="statline"><span><b>${ST.all}</b> ${plural(ST.all, 'статья', 'статьи', 'статей')}</span><span><b>${ST.ex}</b> <a href="#examples">${plural(ST.ex, 'полный пример', 'полных примера', 'полных примеров')}</a></span></div>
    <p class="small muted"><a href="#about">Как пользоваться словарём</a></p>
    <div class="letters">${ALPHA.filter(L => lettersPresent.has(L)).map(letterGroup).join('')}</div>
  </div>`;
}

function vLetter(i) {
  const L = ALPHA[i];
  if (!lettersPresent.has(L)) return vHome();
  const list = inLetter(L);
  return `<div class="stack">
    <div class="crumbs"><a href="#home">Словник</a><span>›</span><span>${L}</span></div>
    <h1>${L}</h1>
    <p class="muted">${list.length} ${plural(list.length, 'статья', 'статьи', 'статей')}</p>
    <ul class="res">${list.map(e => `<li><span class="rt">${wordLink(e)} ${tagsFor(e)}</span>${e.variants.length ? `<span class="rf">${esc(e.variants.map(v => v.form).join(' · '))}</span>` : '<span class="rx">Практическое написание не установлено</span>'}</li>`).join('')}</ul>
  </div>`;
}

// пример
function parseItems(p) {
  const items = [];

    r.forms.forEach(f => {
      let s = 0;
      if (f.k === qk) s = 95; else if (ql && f.lk === ql) s = 90;
      else if (f.k.startsWith(qk)) s = 75; else if (ql && f.lk.startsWith(ql)) s = 72;

  return `<div class="stack"><h1>Поиск: «${esc(q)}»</h1><p class="muted">${out.length} ${plural(out.length, 'статья', 'статьи', 'статей')}</p>

async function adCheck() {
  if (!AD.token) return;
  const loud = location.hash === '#admin';
  if (loud) adMsg('Проверяю доступ…');
  try {
    const r = await gh('');
    AD.checked = true;
    if (r.status === 401) { AD.ok = false; AD.msg = 'GitHub не принял ключ: он неверный или истёк.'; ssDel('dn-gh'); AD.token = ''; }
    else if (!r.ok) { AD.ok = false; AD.msg = 'Нет доступа к хранилищу с этим ключом (GitHub ответил ' + r.status + '). Проверьте, что в ключе выбран репозиторий Dendi-dictionary.'; }
    else if (!(r.j.permissions && r.j.permissions.admin)) { AD.ok = false; AD.msg = 'Ключ работает, но у его владельца нет прав администратора репозитория.'; }
    else {
      AD.ok = true; AD.branch = r.j.default_branch || 'main'; AD.msg = '';
      const u = await fetch('https://api.github.com/user', { headers: { Authorization: 'Bearer ' + AD.token } }).then(x => x.ok ? x.json() : null).catch(() => null);
      AD.user = u && u.login || '';
    }
  } catch (err) { AD.ok = false; AD.msg = 'Не удалось связаться с GitHub. Проверьте интернет и попробуйте ещё раз.'; }
  adNav(); adRender();
}
async function adPut(path, text, sha, what) {
  const r = await gh('/contents/' + encPath(path), { method: 'PUT', body: JSON.stringify({ message: `${what}: ${path}`, content: b64enc(text), branch: AD.branch, ...(sha ? { sha } : {}) }) });
  if (r.ok) return r.j.content.sha;
  if (r.status === 403 || r.status === 404) throw new Error('GitHub не дал записать файл. У ключа должно быть разрешение Contents: Read and write.');
  if (r.status === 409 || r.status === 422) throw new Error('Файл изменился на GitHub после открытия. Откройте его заново.');
  throw new Error('GitHub ответил ' + r.status + (r.j && r.j.message ? ': ' + r.j.message : ''));
}
async function adDel(path, sha, what) {
  const r = await gh('/contents/' + encPath(path), { method: 'DELETE', body: JSON.stringify({ message: `${what}: ${path}`, sha, branch: AD.branch }) });
  if (!r.ok) throw new Error('Не удалось убрать файл ' + path + ' (' + r.status + ').');
}
async function adGet(path) { const r = await gh('/contents/' + encPath(path) + '?ref=' + encodeURIComponent(AD.branch)); return r.ok && !Array.isArray(r.j) ? { sha: r.j.sha, text: b64dec(r.j.content || '') } : null; }
async function adSha(path) { const f = await adGet(path); return f ? f.sha : ''; }
async function adNextP() {
  const r = await gh('/contents/' + encPath('Примеры') + '?ref=' + encodeURIComponent(AD.branch));
  if (r.ok && Array.isArray(r.j)) {
    AD.nextP = Math.max(0, ...r.j.map(f => (f.name.match(/^П(\d+)\.md$/) || [0, 0])[1] * 1), ...PIDS.map(p => +p.slice(1))) + 1;
    const el = document.getElementById('ad-x-num'); if (el && !EX.num) { el.value = AD.nextP; refreshEx(); }
  }
}
