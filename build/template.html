<style>
/* Layout: справочник — шапка с полосой тканого узора, липкий алфавит, одна колонка чтения ~68ch, статьи как карточки словаря без лишних рамок */
:root {
  --bg: #f5f6f9;          /* небелёный хлопок с холодным индиго-оттенком */
  --paper: #ffffff;
  --ink: #1b2145;         /* индиго-чернила */

  --line: #dde0ea;
  --accent: #2c3f9b;      /* индиго */
  --accent-soft: #e7eaf7;
  --ochre: #a2621b;       /* пометки: мало примеров, написание не установлено */
  --ochre-soft: #f6ecdc;
  --weave-a: #2c3f9b;
  --weave-b: #f5f6f9;
  --f-display: "Alegreya", "PT Serif", Georgia, serif;
  --f-body: "Alegreya Sans", "PT Sans", "Segoe UI", system-ui, sans-serif;
  --f-dendi: "Gentium Book Plus", "Gentium Plus", "Noto Serif", "Charis SIL", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {

    --bg: #12152a; --paper: #1a1e38; --ink: #e6e8f4; --muted: #a2a7c6; --line: #2d3254;
    --accent: #9fb0ff; --accent-soft: #252c55; --ochre: #e0a65e; --ochre-soft: #3a2d1c;
    --weave-a: #6f82e0; --weave-b: #12152a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12152a; --paper: #1a1e38; --ink: #e6e8f4; --muted: #a2a7c6; --line: #2d3254;
  --accent: #9fb0ff; --accent-soft: #252c55; --ochre: #e0a65e; --ochre-soft: #3a2d1c;
  --weave-a: #6f82e0; --weave-b: #12152a; color-scheme: dark;

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }

.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; }

.weave { height: 8px; background:
  repeating-linear-gradient(90deg, var(--weave-a) 0 6px, var(--weave-b) 6px 9px, var(--weave-a) 9px 11px, var(--weave-b) 11px 18px); opacity: .85; }

.abc a, .abc span { flex: 0 0 auto; min-width: 30px; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; padding: 3px 4px; border-radius: 5px; }
.abc a { color: var(--accent); }

.abc span { color: var(--line); }

main { padding-block: 24px 64px; }
.page { max-width: 760px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: 2.3rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* словник */
.letters { display: flex; flex-direction: column; gap: 22px; margin-top: 8px; }
.lgroup { display: grid; grid-template-columns: 52px 1fr; gap: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.lgroup .L { font-family: var(--f-display); font-weight: 700; font-size: 2rem; line-height: 1; color: var(--accent); }
.wl { list-style: none; margin: 0; padding: 0; columns: 3 200px; column-gap: 24px; }
.wl li { break-inside: avoid; padding: 2px 0; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.wl .f { font-family: var(--f-dendi); color: var(--muted); font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.tag.info { background: var(--accent-soft); color: var(--accent); }

/* статья */
.crumbs { font-size: .9rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.entry-head { display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.entry-head .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; }
.forms { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
.forms li { display: grid; grid-template-columns: minmax(0, 13rem) 1fr; gap: 4px 16px; align-items: baseline; }
.forms .fw { font-family: var(--f-dendi); font-weight: 700; font-size: 1.45rem; line-height: 1.2; overflow-wrap: anywhere; }
.forms .fs { font-size: .9rem; color: var(--muted); min-width: 0; }
.forms .fn { grid-column: 2; font-size: .95rem; min-width: 0; }
.box { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.box.warn { background: var(--ochre-soft); border-color: transparent; }
.box .label { display: block; margin-bottom: 4px; }
.ex { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ex li { display: grid; grid-template-columns: 2.2rem 1fr; gap: 2px 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.ex li:first-child { border-top: 0; }
.ex .k { font-variant-numeric: tabular-nums; color: var(--muted); font-family: var(--f-mono); font-size: .85rem; padding-top: 4px; }

.ex .src { font-size: .85rem; color: var(--muted); }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; font-style: normal; }

.pager a { display: flex; flex-direction: column; min-width: 0; }

/* поиск */
.res { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.res li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.res .rx { font-size: .92rem; color: var(--muted); overflow-wrap: anywhere; }
.res .rx .dn { font-style: italic; color: var(--ink); }

/* денди → русский */
.rev { display: flex; flex-direction: column; gap: 18px; }
.rev .grp { display: grid; grid-template-columns: 52px 1fr; gap: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.rev .grp .L { font-family: var(--f-dendi); font-weight: 700; font-size: 1.8rem; line-height: 1; color: var(--accent); }

.rev dt { font-family: var(--f-dendi); font-weight: 700; overflow-wrap: anywhere; }
.rev dd { margin: 0; min-width: 0; }

/* грамматика */
.rules { counter-reset: r; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.rules li { display: grid; grid-template-columns: 2rem 1fr; gap: 8px; }
.rules .n { font-family: var(--f-display); font-weight: 700; color: var(--accent); font-size: 1.15rem; }
.gex { display: flex; flex-direction: column; gap: 12px; }

.gex .r { font-weight: 500; }
.gloss { display: flex; flex-wrap: wrap; gap: 6px 4px; margin-top: 4px; }
.gloss span { display: inline-flex; flex-direction: column; align-items: flex-start; padding: 3px 8px; background: var(--bg); border-radius: 6px; }
.gloss .gw { font-family: var(--f-dendi); font-style: italic; }
.gloss .gw a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.gloss .gg { font-size: .78rem; color: var(--muted); }

/* источники */
.bars { display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums; }
.brow { display: grid; grid-template-columns: 4.2rem 1fr 6.5rem; gap: 10px; align-items: center; font-size: .92rem; }
.brow .track { height: 14px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
.brow .fill { height: 100%; background: var(--accent); }
.brow .v { text-align: right; color: var(--muted); }
.srcs { display: flex; flex-direction: column; gap: 16px; }
.srcs article { display: grid; grid-template-columns: 6rem 1fr; gap: 4px 14px; scroll-margin-top: 140px; }
.srcs .c { font-family: var(--f-mono); font-weight: 500; color: var(--accent); overflow-wrap: anywhere; }
.srcs .t { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.srcs .u { font-size: .85rem; overflow-wrap: anywhere; }
.srcs article.hl { background: var(--accent-soft); border-radius: 8px; }
footer { border-top: 1px solid var(--line); padding-block: 18px 28px; color: var(--muted); font-size: .88rem; }

}

<script type="application/json" id="data">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const E = D.entries;
const byN = {}; E.forEach(e => byN[e.n] = e);
const ALPHA = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ'.split('');
// заголовки на другую букву (например, латинскую: COVID-19) — отдельными группами в конце
ALPHA.push(...[...new Set(E.map(e => e.letter))].filter(l => !ALPHA.includes(l)).sort());
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const foldRu = s => s.toLowerCase().replace(/ё/g, 'е');
const foldDn = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/ɛ/g,'e').replace(/ɔ/g,'o').replace(/ŋ/g,'n').replace(/ɲ/g,'ny').replace(/[‹›«»"'’.,;:!?()\/]/g,'').replace(/[\s-]+/g,'');
const fold = s => foldDn(foldRu(s));
// свободный ключ: как foldDn, но ещё и без удвоений (gono = goono, bene = bɛɛnɛ)
const looseDn = s => foldDn(s).replace(/(.)\1+/g, '$1');
// близость написания: насколько форма словаря отличается от того, что набрал читатель
const SP_BASE = { 'ɛ': 'e', 'ɔ': 'o', 'ŋ': 'n' };
const spChars = s => [...s.normalize('NFD').replace(/[̀-ͯ]/g, '').normalize('NFC').toLowerCase().replace(/[\s\-‹›'’.,;:!?()«»"\/]/g, '')];
function spellDist(typed, form) {
  const a = spChars(typed), b = spChars(form), bc = c => SP_BASE[c] || c;
  const indel = (s, i) => (i > 0 && bc(s[i - 1]) === bc(s[i])) || (i + 1 < s.length && bc(s[i + 1]) === bc(s[i])) ? 0.5 : 1;
  let prev = [0]; for (let j = 1; j <= b.length; j++) prev[j] = prev[j - 1] + indel(b, j - 1);
  for (let i = 1; i <= a.length; i++) {
    const cur = [prev[0] + indel(a, i - 1)];
    for (let j = 1; j <= b.length; j++) {
      const sub = a[i - 1] === b[j - 1] ? 0 : bc(a[i - 1]) === bc(b[j - 1]) ? 0.4 : 1;
      cur[j] = Math.min(prev[j - 1] + sub, prev[j] + indel(a, i - 1), cur[j - 1] + indel(b, j - 1));
    }
    prev = cur;
  }
  const tone = typed.normalize('NFC').toLowerCase() === form.normalize('NFC').toLowerCase() ? 0 : 0.05;
  return prev[b.length] + tone;
}
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; }

// варианты, формы, примеры
const variantForms = v => v.form.split(/[;,]\s+/).map(f => f.replace(/\s*\(.*?\)\s*/g, ' ').trim()).filter(Boolean);
const allForms = e => [...new Set(e.variants.flatMap(variantForms))];
const examplesOf = e => [...e.variants.flatMap(v => v.examples), ...(e.linked || [])];
const PID = {};   // П → { ex, entries[] }
E.forEach(e => examplesOf(e).forEach(x => { (PID[x.pid] = PID[x.pid] || { ex: x, entries: [] }); if (!PID[x.pid].entries.includes(e)) PID[x.pid].entries.push(e); }));
const PIDS = Object.keys(PID).sort((a, b) => +a.slice(1) - +b.slice(1));
const ST = {
  all: E.length, sw: E.filter(e => e.kind === 'swadesh').length, extra: E.filter(e => e.kind === 'extra').length,
  ex: PIDS.length, withEx: E.filter(e => examplesOf(e).length).length, unest: E.filter(e => e.unestablished).length
};

// источники → якоря; коды из библиографии
const SRC_IDS = {};
const addCode = (c, id) => { if (c && /^[A-Z][A-Z0-9-]*$/.test(c) && !SRC_IDS[c]) SRC_IDS[c] = id; };
D.sources.forEach(s => {
  s.code.split(/\s+[—\/]\s+|\s*\/\s*|\s+/).forEach(c => addCode(c, s.id));
  if (s.code.startsWith('T68')) SRC_IDS['T68/72'] = s.id;
});
if (D.rst) SRC_IDS['RST'] = D.rst.id;
const CODE_RE = new RegExp('(?<![\\wА-Яа-яЁё-])(' + Object.keys(SRC_IDS).sort((a, b) => b.length - a.length).map(c => c.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&')).join('|') + ')(?![\\wА-Яа-яЁё-])', 'g');
const fmt = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g, '$1<i>$2</i>');
const plainRich = t => fmt(esc(t)
  .replace(CODE_RE, m => SRC_IDS[m] ? `<a class="code" href="#${SRC_IDS[m]}" title="Описание источника">${m}</a>` : m)
  .replace(/П(\d+)/g, (m, d) => PID['П' + d] ? `<a class="pid" href="#p${d}" title="Полный пример ${m}">${m}</a>` : m));
const MARK = /⟦([a-z]):([^|⟧]*)\|([^⟧]*)⟧/g;
function rich(s) {
  s = String(s ?? ''); let out = '', last = 0, m;
  MARK.lastIndex = 0;
  while ((m = MARK.exec(s))) {
    out += plainRich(s.slice(last, m.index)); last = MARK.lastIndex;
    const [, k, ref, text] = m, t = fmt(esc(text));
    if (k === 'w' && byN[+ref]) out += `<a href="#w${ref}" title="${esc(byN[+ref].title)}">${t}</a>`;
    else if (k === 'p' && PID['П' + ref]) out += `<a class="pid" href="#p${ref}">${t}</a>`;
    else if (k === 's') out += `<a href="#${esc(ref)}">${t}</a>`;
    else if (k === 'g') out += `<a href="#gr-${esc(ref)}">${t}</a>`;
    else if (k === 'a') out += `<a href="#about">${t}</a>`;
    else if (k === 'u') out += `<a href="${esc(ref)}" target="_blank" rel="noopener">${t}</a>`;
    else out += t;
  }
  return out + plainRich(s.slice(last));
}
function blocks(bs) {
  let out = '', ul = false;
  bs.forEach(b => {
    if (b.t === 'li') { if (!ul) { out += '<ul class="mdl">'; ul = true; } out += `<li>${rich(b.x)}</li>`; return; }
    if (ul) { out += '</ul>'; ul = false; }
    out += b.t === 'p' ? `<p>${rich(b.x)}</p>` : `<${b.t}>${rich(b.x)}</${b.t}>`;
  });
  return out + (ul ? '</ul>' : '');
}
const extLink = (text, url) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);

const formIndex = {};
E.forEach(e => allForms(e).forEach(ff => { const k = foldDn(ff); (formIndex[k] = formIndex[k] || []).push({ e, form: ff }); }));
const lettersPresent = new Set(E.map(e => e.letter));
const tagsFor = e => {
  const t = [];
  if (e.kind === 'extra') t.push('<span class="tag info">доп.</span>');
  if (e.unestablished) t.push('<span class="tag warn">написание не установлено</span>');
  return t.join(' ');
};
const wordLink = e => `<a href="#w${e.n}">${esc(e.title)}</a>`;
const primaryForms = e => e.variants.slice(0, 2).map(v => v.form).join(', ');

function drawAbc(active) {
  document.getElementById('abc').innerHTML = ALPHA.map((L, i) =>
    lettersPresent.has(L) ? `<a href="#l${i}" class="${L === active ? 'on' : ''}">${L}</a>` : `<span aria-hidden="true">${L}</span>`).join('');
}
const inLetter = L => E.filter(e => e.letter === L);

function letterGroup(L) {
  const items = inLetter(L).map(e => `<li>${wordLink(e)}${e.unestablished && !e.variants.length ? '<span class="none">—</span>' : `<span class="f">${esc(primaryForms(e))}</span>`}${e.kind === 'extra' ? ' <span class="tag info">доп.</span>' : ''}</li>`).join('');
  return `<section class="lgroup" id="g${ALPHA.indexOf(L)}"><div class="L">${L}</div><ul class="wl">${items}</ul></section>`;
}

const V = document.getElementById('view');
function vHome() {
  return `<div class="stack">
    <h1>Русско-дендийский словарь</h1>
    <p class="lead">Денди — сонгайский язык северного Бенина и приграничья с Нигером и Нигерией. Словарь объединяет базовую лексику списка Сводеша и слова, нужные для чтения дендийских текстов: варианты письма с источниками и полные примеры с двумя переводами и разбором по словам.</p>
    <div class="statline"><span><b>${ST.all}</b> ${plural(ST.all, 'статья', 'статьи', 'статей')}</span><span><b>${ST.sw}</b> из списка Сводеша</span><span><b>${ST.extra}</b> ${plural(ST.extra, 'дополнительная', 'дополнительные', 'дополнительных')}</span><span><b>${ST.ex}</b> <a href="#examples">${plural(ST.ex, 'полный пример', 'полных примера', 'полных примеров')}</a></span><span><b>${ST.unest}</b> без установленного написания</span></div>
    <p class="small muted"><a href="#about">Как пользоваться словарём</a></p>

  </div>`;
}

function vLetter(i) {
  const L = ALPHA[i];
  if (!lettersPresent.has(L)) return vHome();
  const list = inLetter(L);
  return `<div class="stack">
    <div class="crumbs"><a href="#home">Словник</a><span>›</span><span>${L}</span></div>

  </div>`;
}

// пример
function parseItems(p) {
  const items = [];
  p.replace(/\.$/, '').split(/;\s*/).forEach(seg => {
    const m = seg.match(/^(.+?) — (.+)$/);
    if (m) items.push({ w: m[1], g: m[2] }); else if (items.length) items[items.length - 1].g += '; ' + seg; else items.push({ w: '', g: seg });
  });
  return items;
}
function parseChips(p, pid) {
  const items = parseItems(p);
  const links = (D.plinks && D.plinks[pid]) || [];
  items.forEach(it => { const hit = links.find(([w, n]) => n && w === it.w); if (hit) it.n = hit[1]; });
  return `<div class="gloss">${items.map(i => `<span>${i.w ? `<span class="gw">${i.n && byN[i.n] ? `<a href="#w${i.n}" title="${esc(byN[i.n].title)}">${esc(i.w)}</a>` : esc(i.w)}</span>` : ''}<span class="gg">${esc(i.g)}</span></span>`).join('')}</div>`;
}
function exCard(x, here, num) {
  const others = (PID[x.pid]?.entries || []).filter(e => e !== here);
  return `${here && x.lead ? x.lead.map(t => `<p class="small">${rich(t)}</p>`).join('') : ''}<article class="exc">
    <div class="exh"><span class="pidtag">${num ? `Пример ${num} · ` : ''}${x.pid}</span><span class="src">${extLink(x.source, x.source_url)}</span></div>
    <p class="dsent">${esc(x.dendi)}</p>
    <dl class="exf">
      <dt>Опубликованный перевод${x.rst ? ' <span class="tag info">Синодальный</span>' : ''}</dt><dd>${x.pub ? esc(x.pub) + (x.pub_url ? ` <a class="small" href="${esc(x.pub_url)}" target="_blank" rel="noopener">${x.rst ? 'текст' : esc(x.pub_label || 'текст')}</a>` : '') : '<span class="muted">Опубликованного русского перевода нет.</span>'}</dd>
      <dt>Дословный перевод</dt><dd>${esc(x.lit)}</dd>
      <dt>Разбор по словам</dt><dd>${parseChips(x.parse, x.pid)}</dd>
      ${x.note ? `<dt>Примечание</dt><dd>${rich(x.note)}</dd>` : ''}
      ${(x.extra || []).length ? `<dt>Дополнительно</dt><dd>${x.extra.map(rich).join('<br>')}</dd>` : ''}
    </dl>
    ${others.length ? `<p class="small muted">Этот пример есть и в ${plural(others.length, 'статье', 'статьях', 'статьях')}: ${others.map(wordLink).join(', ')}</p>` : ''}
  </article>`;
}
const refList = refs => `<ul class="refs">${refs.map(r => `<li>${extLink(r.t, r.u)}</li>`).join('')}</ul>`;

function vWord(n) {
  const e = byN[n]; if (!e) return vHome();
  const idx = E.indexOf(e), prev = E[idx - 1], next = E[idx + 1];
  const nEx = new Set(examplesOf(e).map(x => x.pid)).size;
  const meta = `<span>№ ${e.n}</span>${e.kind === 'swadesh' ? `<span>Сводеш № ${e.swadesh}</span>` : '<span class="tag info">дополнительная лексика</span>'}`
    + (e.variants.length > 1 ? `<span>${e.variants.length} ${plural(e.variants.length, 'вариант', 'варианта', 'вариантов')}</span>` : '')
    + `<span>${nEx ? `${nEx} ${plural(nEx, 'полный пример', 'полных примера', 'полных примеров')}` : 'полных примеров пока нет'}</span>`;
  const vars = e.variants.map(v => `<section class="variant">
      <div class="vh">${v.label ? `<span class="vl">${v.label}</span>` : ''}<span class="vf">${esc(v.form)}</span></div>
      ${v.notes.map(p => `<p>${rich(p)}</p>`).join('')}
      ${v.examples.length ? `<div class="exs">${v.examples.map(x => exCard(x, e, x.k)).join('')}</div>` : `<p class="small muted">${esc(v.status || 'Полного примера с дословным разбором пока нет.')}</p>`}
      ${v.refs.length ? `<div class="stack" style="gap:4px"><span class="label">Источники формы и дополнительные контексты · ${v.refs.length}</span>${refList(v.refs)}</div>` : ''}
    </section>`).join('');
  const rel = new Map();
  allForms(e).forEach(ff => (formIndex[foldDn(ff)] || []).forEach(x => { if (x.e !== e) rel.set(x.e.n, x); }));
  const relHtml = rel.size ? `<section class="stack"><span class="label">То же написание в других статьях</span><div class="related">${[...rel.values()].map(x => `<span><span class="dn">${esc(x.form)}</span> → ${wordLink(x.e)}</span>`).join('')}</div></section>` : '';
  return `<article class="stack" style="gap:22px">
    <div class="crumbs"><a href="#home">Словник</a><span>›</span><a href="#l${ALPHA.indexOf(e.letter)}">${e.letter}</a></div>
    <div class="entry-head"><h1>${esc(e.title)}</h1><div class="meta">${meta}</div></div>
    ${e.unestablished ? `<div class="box warn"><span class="label">Написание не установлено</span>${esc(e.unestablished)}</div>` : ''}
    ${e.meaning ? `<div class="box"><span class="label">Значение и употребление</span>${rich(e.meaning)}</div>` : ''}
    ${(e.notes || []).map(t => `<p>${rich(t)}</p>`).join('')}
    ${vars}
    ${(e.linked || []).length ? `<section class="variant"><div class="vh"><span class="vf" style="font-family:var(--f-display);font-size:1.15rem">Другие полные примеры с этим словом</span></div><p class="small muted">Примеры, в разборе которых есть ссылка на эту статью.</p><div class="exs">${e.linked.map(x => exCard(x, e)).join('')}</div></section>` : ''}
    ${e.related ? `<p class="small"><span class="muted">Связанные примеры:</span> ${rich(e.related)}</p>` : ''}
    ${e.extra_refs.length ? `<section class="stack" style="gap:4px"><span class="label">Дополнительные источниковые привязки</span>${refList(e.extra_refs)}</section>` : ''}
    ${relHtml}
    ${e.sci ? `<section class="stack small"><span class="label">Для сверки</span><p><span class="muted">Научный указатель.</span> ${rich(e.sci)}</p></section>` : ''}
    <nav class="pager">${prev ? `<a href="#w${prev.n}"><small>← предыдущая</small>${esc(prev.title)}</a>` : ''}${next ? `<a class="next" href="#w${next.n}"><small>следующая →</small>${esc(next.title)}</a>` : ''}</nav>
  </article>`;
}

const exSrc = p => (PID[p].ex.source.match(CODE_RE) || ['—'])[0];
function vExamples(focus, src) {
  const cnt = {};
  PIDS.forEach(p => { const c = exSrc(p); cnt[c] = (cnt[c] || 0) + 1; });
  const codes = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || a.localeCompare(b));
  if (src && !cnt[src]) src = null;
  const list = src ? PIDS.filter(p => exSrc(p) === src) : PIDS;
  const chip = (c, label, n) => `<a class="fchip${(c || null) === (src || null) ? ' on' : ''}" href="#${c ? 'ex-' + encodeURIComponent(c) : 'examples'}"${(c || null) === (src || null) ? ' aria-current="true"' : ''}>${label} <span class="n">${n}</span></a>`;
  const srcInfo = src && SRC_IDS[src] ? ` <a class="small" href="#${SRC_IDS[src]}">Об источнике ${esc(src)}</a>` : '';
  return `<div class="stack" style="gap:22px">
    <h1>Полные примеры</h1>
    <p>${ST.ex} ${plural(ST.ex, 'уникальный пример', 'уникальных примера', 'уникальных примеров')}: полная фраза денди, опубликованный русский перевод (если он есть), авторский дословный перевод и разбор по словам. Один пример может приводиться в нескольких статьях; номер П остаётся тем же.</p>
    <div class="stack" style="gap:8px"><span class="label">Источник фразы</span>
      <nav class="fchips" aria-label="Фильтр по источнику">${chip(null, 'Все', PIDS.length)}${codes.map(c => chip(c, esc(c), cnt[c])).join('')}</nav>
      ${src ? `<p class="small muted">Показано ${list.length} ${plural(list.length, 'пример', 'примера', 'примеров')} из источника ${esc(src)}.${srcInfo}</p>` : ''}
    </div>
    <div class="exs">${list.map(p => { const x = PID[p].ex; return `<div id="p${p.slice(1)}" class="${'p' + p.slice(1) === focus ? 'focus' : ''}">${exCard(x, null)}<p class="small">Статьи: ${PID[p].entries.map(wordLink).join(', ')}</p></div>`; }).join('')}</div>
  </div>`;
}

function vDendi() {
  const map = new Map();
  E.forEach(e => allForms(e).forEach(ff => { if (!map.has(ff)) map.set(ff, { form: ff, k: foldDn(ff), es: [] }); const m = map.get(ff); if (!m.es.includes(e)) m.es.push(e); }));

  const groups = new Map();
  all.forEach(r => { const g = (r.k.replace(/^[^a-z]+/, '')[0] || '#').toUpperCase(); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(r); });
  return `<div class="stack">
    <h1>Денди → русский</h1>
    <p class="muted">Все ${all.length} письменных вариантов из статей, по алфавиту. Знаки тона и долготы не влияют на порядок; ɛ стоит при e, ɔ — при o, ŋ — при n.</p>
    <div class="rev">${[...groups].map(([g, rs]) => `<section class="grp"><div class="L">${g.toLowerCase()}</div><dl>${rs.map(r => `<dt>${esc(r.form)}</dt><dd>${r.es.map(wordLink).join(', ')}</dd>`).join('')}</dl></section>`).join('')}</div>
  </div>`;
}

function vGrammar() {
  const G = D.grammar, idx = G.find(g => g.index), rest = G.filter(g => !g.index);
  return `<div class="stack" style="gap:22px">
    <h1>${esc(idx ? idx.title : 'Грамматика')}</h1>

    ${rest.length > 1 ? `<nav class="box"><span class="label">Заметки</span><ul class="mdl">${rest.map(g => `<li><a href="#gr-${g.id}">${esc(g.title)}</a></li>`).join('')}</ul></nav>` : ''}
    ${rest.map(g => `<section class="stack gnote" id="gr-${g.id}"><h2>${esc(g.title)}</h2><div class="md">${blocks(g.blocks)}</div></section>`).join('')}
    <p class="small muted">Номера П ведут к полным примерам с переводами и разбором; все они собраны на странице <a href="#examples">«Примеры»</a>.</p>
  </div>`;
}

function vSources(hl) {
  const cnt = {};
  PIDS.forEach(p => { const c = (PID[p].ex.source.match(CODE_RE) || ['—'])[0]; cnt[c] = (cnt[c] || 0) + 1; });
  const dist = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  const max = Math.max(...dist.map(d => d[1]), 1);
  return `<div class="stack" style="gap:22px">
