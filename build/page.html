купке помидоров.","related":"П67."},{"n":355,"title":"Хвост","letter":"Х","variants":[{"label":"","form":"laace","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 173","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=173"},{"t":"NT18, Откр 9:10","u":"https://zeno.fm/bible/DDNBIV/REV/9/"},{"t":"NT18, Откр 12:4","u":"https://zeno.fm/bible/DDNBIV/REV/12/"},{"t":"NT18, Откр 9:19","u":"https://zeno.fm/bible/DDNBIV/REV/9/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":69,"sci":"H, §E №86, с. 36. Практическая орфография и контекст требуют сверки."},{"n":356,"title":"Ходить","letter":"Х","variants":[{"label":"I","form":"dira","notes":["В приведённом контексте метафорическое «ходить/жить»; буквальное употребление нужно проверить отдельно."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 128","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=128"},{"t":"NT18, Мф 10:11","u":"https://zeno.fm/bible/DDNBIV/MAT/10/"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"},{"t":"NT18, 2 Кор 5:7","u":"https://zeno.fm/bible/DDNBIV/2CO/5/"},{"t":"NT18, Деян 3:9","u":"https://zeno.fm/bible/DDNBIV/ACT/3/"}]},{"label":"II","form":"dìra","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 103","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=103"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":121,"sci":"H, §E №173, с. 41. Практическая орфография и контекст требуют сверки."},{"n":357,"title":"Холодный","letter":"Х","variants":[{"label":"","form":"yee","notes":["Остывание испаряющейся воды; глагольное употребление."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Откр 3:15","u":"https://zeno.fm/bible/DDNBIV/REV/3/"},{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL65, PDF с. 77","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=77"},{"t":"NT18, Откр 3:16","u":"https://zeno.fm/bible/DDNBIV/REV/3/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":181,"meaning":"yee — холодный/остывший; переносное употребление.","sci":"H, §E №139, с. 39. Практическая орфография и контекст требуют сверки."},{"n":358,"title":"Хороший","letter":"Х","variants":[{"label":"I","form":"boori","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мф 12:33","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"}]},{"label":"II","form":"hinno","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."}],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"}]},{"label":"III","form":"hinnɔ","notes":["В П59 субстантивированная форма ihinnɔ «хорошее» сохранена без подмены написания."],"full":1,"status":"","examples":[{"k":1,"pid":"П59","head":"NT18, 1 Фес 5:21","rst":true,"dendi":"Wa hɛ kulu yaase guna, ka ihinnɔ dii ka jɛ.","source":"NT18, 1 Фес 5:21","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Все испытывайте, хорошего держитесь.","lit":"Всё проверьте, а хорошее возьмите и удерживайте.","parse":"Wa — побуждение к адресатам; hɛ — вещь, нечто; kulu — всё; yaase — проверить, испытать в сочетании yaase guna; guna — смотреть, в сочетании «проверить»; ka — связь действий; ihinnɔ — хорошее; dii — взять, ухватить; ka — связь действий; jɛ — держать, сохранять.","note":"Взято всё предложение, а не его часть до запятой. yaase guna рассматривается совместно как «проверить»; отдельные оттенки yaase не объявляются исчерпывающе установленными. dii здесь не di «видеть» и не dii «гореть». ihinnɔ — субстантивированное «хорошее», без подстановки иной записи hinno."}],"refs":[{"t":"NT18, Мф 13:8","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, Мф 7:17","u":"https://zeno.fm/bible/DDNBIV/MAT/7/"}]},{"label":"IV","form":"hɛnnɔ","notes":["О чистой/доброкачественной воде и пище; не универсальная замена boori."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"AL65, PDF с. 99","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=99"},{"t":"AL65, PDF с. 93","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=93"},{"t":"AL65, PDF с. 91","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=91"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":185,"meaning":"boori — быть хорошим; hinnɔ — хороший, о плодах и почве. Различается грамматика."},{"n":359,"title":"Царапать","letter":"Ц","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":117,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":360,"title":"Цветок","letter":"Ц","variants":[{"label":"","form":"boosi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Иак 1:10","u":"https://zeno.fm/bible/DDNBIV/JAS/1/"},{"t":"NT18, 1 Пет 1:24","u":"https://zeno.fm/bible/DDNBIV/1PE/1/"},{"t":"NT18, Иак 1:11","u":"https://zeno.fm/bible/DDNBIV/JAS/1/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":59,"sci":"H, §E №58, с. 34. Практическая орфография и контекст требуют сверки."},{"n":361,"title":"Час","letter":"Ч","variants":[{"label":"","form":"guuru","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П72","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Iri ma guuru cau.","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Давайте будем определять время [по часам].","parse":"Iri — мы; ma — побудительный показатель; guuru — час, время на часах; cau — читать, здесь считывать показание.","note":"Полная вводная инструкция в уроке о времени перед описанием стрелок и циферблата. Буквально «давайте читать час». cau сохранено по CAL и отделено от написания cou в AL65; это сопоставление записей, а не доказанное правило звукового соответствия."},{"k":2,"pid":"П86","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Sana keena go guuru cabe no","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Маленькая стрелка показывает часы.","parse":"Sana — стрелка часов; keena — маленький; go — предглагольный показатель; guuru — час, единица времени; cabe — показывать; no — предикативно-выделительный элемент.","note":"Самостоятельная строка описания стрелок, без конечной точки в печати. Это часовая стрелка; слово «часовая» непосредственно не вставлено в цитату. keena не исправлено в cɛna или cɛɛnɛ."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Час, показание времени; в guuru cau «читать время по часам». Другие значения омографов не приписываются этой статье.","related":"П72."},{"n":362,"title":"Частица вопроса: ba","letter":"Ч","variants":[{"label":"","form":"ba","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке."],"full":null,"status":"","examples":[{"k":1,"pid":"П1","head":"NT18, 1CO 7:27","rst":true,"dendi":"N gunda wɛndɛ ba?","source":"NT18, 1CO 7:27","source_url":"https://zeno.fm/bible/DDNBIV/1CO/7/","pub":"Соединен ли ты с женою?","lit":"Ты имеешь жену?","parse":"N — ты; gunda — иметь; wɛndɛ — жена; ba — вопросительная частица."},{"k":2,"pid":"П2","head":"NT18, 1CO 7:27","rst":true,"dendi":"N sinda wɛndɛ ba?","source":"NT18, 1CO 7:27","source_url":"https://zeno.fm/bible/DDNBIV/1CO/7/","pub":"Остался ли без жены?","lit":"Ты не имеешь жены?","parse":"N — ты; sinda — не иметь; wɛndɛ — жена; ba — вопросительная частица."},{"k":3,"pid":"П3","head":"NT18, MRK 15:4","rst":true,"dendi":"N si tu ba?","source":"NT18, MRK 15:4","source_url":"https://zeno.fm/bible/DDNBIV/MRK/15/","pub":"Ты ничего не отвечаешь?","lit":"Ты не отвечаешь?","parse":"N — ты; si — отрицание; tu — отвечать; ba — вопросительная частица."},{"k":4,"pid":"П4","head":"NT18, 2CO 11:22","rst":true,"dendi":"Eburu yom no ba?","source":"NT18, 2CO 11:22","source_url":"https://zeno.fm/bible/DDNBIV/2CO/11/","pub":"Они Евреи?","lit":"[Они] евреи?","parse":"Eburu — еврей; yom — показатель множественности; no — предикативный элемент; ba — вопросительная частица.","note":"Отдельного подлежащего «они» в этой фразе нет; оно восстановлено в русском переводе по контексту."},{"k":5,"pid":"П5","head":"NT18, ROM 14:22","rst":true,"dendi":"N gunda naane ba?","source":"NT18, ROM 14:22","source_url":"https://zeno.fm/bible/DDNBIV/ROM/14/","pub":"Ты имеешь веру?","lit":"Ты имеешь веру?","parse":"N — ты; gunda — иметь; naane — вера; ba — вопросительная частица."},{"k":6,"pid":"П10","head":"NT18, ACT 21:37","rst":true,"dendi":"N ŋmaani Garɛku cine ba?","source":"NT18, ACT 21:37","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"ты знаешь по‐гречески?","lit":"Ты владеешь греческим языком?","parse":"N — ты; ŋmaani — владеть языком / говорить на языке в этом употреблении; Garɛku — греческий; cine — язык; ba — вопросительная частица.","note":"Омографическое ŋmaani «иной» в других местах не смешано с этим употреблением. В NT95, PDF с. 92, в том же вопросе напечатано cinɛ. Это два издания одного контекста."}],"refs":[{"t":"NT18, 1 Кор 7:27","u":"https://zeno.fm/bible/DDNBIV/1CO/7/"},{"t":"NT18, Мк 15:4","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"}]}],"extra_refs":[{"t":"NT18, 2 Кор 11:22","u":"https://zeno.fm/bible/DDNBIV/2CO/11/"},{"t":"NT18, Рим 14:22","u":"https://zeno.fm/bible/DDNBIV/ROM/14/"}],"linked":[],"stray":[],"kind":"extra","meaning":"Следует за основной предикацией в проверенных вопросах. Отличие от dee по ожиданию ответа не установлено."},{"n":363,"title":"Частица вопроса: dee","letter":"Ч","variants":[{"label":"","form":"dee","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке."],"full":4,"status":"","examples":[{"k":1,"pid":"П6","head":"NT95, JHN 11:26, PDF с. 68","rst":true,"dendi":"N go cimandi nga di gaa dee?","source":"NT95, JHN 11:26, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"Веришь ли сему?","lit":"Ты считаешь это истинным?","parse":"N — ты; go — предглагольный показатель; cimandi — признавать истинным / верить; nga — то / оно; di — указательный элемент; gaa — послелог объекта отношения; dee — вопросительная частица.","note":"Сочетание nga di gaa передаёт объект веры; послелог не имеет здесь отдельного русского «на»."},{"k":2,"pid":"П7","head":"NT95, JHN 4:29, PDF с. 62","rst":true,"dendi":"À mana ci Mɛsiya dee?","source":"NT95, JHN 4:29, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"не Он ли Христос?","lit":"Не является ли он Мессией?","parse":"À — он; mana — отрицательное предикативное употребление; ci — являться; Mɛsiya — Мессия; dee — вопросительная частица.","note":"Ожидание подтверждения возможно по контексту, но не объявляется значением dee во всех вопросах."},{"k":3,"pid":"П8","head":"NT95, MAT 12:23, PDF с. 12","rst":true,"dendi":"À na ci Dafidi ize di dee?","source":"NT95, MAT 12:23, PDF с. 12","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12","pub":"не это ли Христос, сын Давидов?","lit":"Не является ли он тем сыном Давида?","parse":"À — он; na — отрицательная функция в данном сочетании; не смешивать с показателем переходного действия; ci — являться; Dafidi — Давид; ize — сын / потомок; di — определительный элемент; dee — вопросительная частица.","note":"В опубликованном русском тексте добавлено именование «Христос»; в этой дендийской фразе слова Mɛsiya нет."},{"k":4,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."}],"refs":[{"t":"NT95, Ин 11:26, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"},{"t":"NT95, Мк 12:14, PDF с. 33","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=33"}]}],"extra_refs":[{"t":"NT95, Ин 4:29, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT95, Мф 12:23, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT95, Ин 1:46, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"},{"t":"NT95 — полный PDF","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf"},{"t":"AL64 — PDF, с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"}],"linked":[],"stray":[],"kind":"extra","meaning":"Может стоять перед продолжением и союзом альтернативы; не всегда последнее слово. Не переводится неизменно как «разве»."},{"n":364,"title":"Часть","letter":"Ч","variants":[{"label":"","form":"safu","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"В П15 — часть тела; другие значения не установлены."},{"n":365,"title":"Часы","letter":"Ч","variants":[{"label":"I","form":"agogo","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П73","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Lamba 12 ya goono agogo ga","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Двенадцать чисел находятся на часах [циферблате].","parse":"Lamba — число, номер; 12 — число 12, цифровая запись; ya — выделительный элемент; goono — находиться, быть в наличии; agogo — часы; ga — на, при; послелог.","note":"Самостоятельное утверждение в описании циферблата; в источнике строка без конечной точки. Значение lamba относится к числам/номерам на циферблате. ga здесь послелог после существительного, не предглагольный показатель ga. Чтение цифрового 12 не подставлено."}],"refs":[]},{"label":"II","form":"mɔnturu","notes":["Написание AL65 в задаче о покупке и продаже часов. Соответствие agogo по значению не доказывает одинакового происхождения или взаимозаменяемости во всех контекстах."],"full":2,"status":"","examples":[{"k":1,"pid":"П84","head":"AL65, PDF и печ. с. 106","rst":false,"dendi":"Ali nà mɔnturu fɔ́ dei F 8500 magazɛ̃ kuna.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али купил одни часы за 8500 франков в магазине.","parse":"Ali — Али, имя персонажа; nà — показатель переходного действия; mɔnturu — часы, прибор; fɔ́ — один; dei — покупать; F — обозначение франка в источнике; 8500 — цифровая запись числа 8500; magazɛ̃ — магазин; kuna — внутри, в.","note":"Полное первое предложение задачи о прибыли. mɔnturu соотносится по значению с agogo в CAL, сохраняя свою запись. Русское «одни часы» не означает множественное число слова денди. F — условное обозначение валюты, не реконструированное слово."},{"k":2,"pid":"П85","head":"AL65, PDF и печ. с. 106","rst":false,"dendi":"Ali nà mɔnturu di yeti ka nɛɛra F 9300.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али затем перепродал эти часы за 9300 франков.","parse":"Ali — Али; nà — показатель переходного действия; mɔnturu — часы; di — определительный элемент; yeti — снова, повторно в сочетании yeti ka; ka — связь действий; nɛɛra — продавать; F — обозначение франка; 9300 — цифровая запись числа 9300.","note":"Полное второе предложение той же задачи; П84 сообщает о покупке. yeti ka nɛɛra в этом контексте передано как «перепродать». Из одного примера не выводится самостоятельное значение yeti «возвращать» во всех контекстах."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Часы как прибор; в описании циферблата.","related":"П73."},{"n":366,"title":"Человек","letter":"Ч","variants":[{"label":"I","form":"bɔrɔ","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":2,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, PDF с. 22","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=22"},{"t":"NT18, Мф 3:5","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"AL65, PDF с. 108","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=108"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]},{"label":"II","form":"adam-ize","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Еф 6:12","u":"https://zeno.fm/bible/DDNBIV/EPH/6/"}]},{"label":"III","form":"bɔrɔ̀","notes":["Печатная с. 9, правая половина разворота: сохранён тоновый знак."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"CFA, PDF с. 8","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=8"}]},{"label":"IV","form":"boro","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]},{"label":"V","form":"bɔ̀rɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П33","head":"","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."},{"k":2,"pid":"П37","head":"","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."},{"k":3,"pid":"П89","head":"","rst":true,"dendi":"Ikpɛ na bɔrɔ fɔ dɔntɔm, à maa no Yohana.","source":"NT18, Ин 1:6","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Был человек, посланный от Бога; имя ему Иоанн.","lit":"Бог послал одного человека, его имя — Иоанн.","parse":"Ikpɛ — Бог; na — показатель переходного действия; bɔrɔ — человек; fɔ — один, некий; dɔntɔm — посылать; à — он, здесь его; maa — имя; no — связочный элемент; Yohana — Иоанн.","note":"Полное предложение, включая часть об имени. maa здесь «имя», не «слышать». Активная конструкция денди сохранена в авторском переводе, несмотря на страдательный оборот русского параллельного текста."}],"stray":[],"kind":"swadesh","swadesh":38,"meaning":"adam-ize — «человек; человеческое существо», буквально сложное наименование; не свободный вариант bɔrɔ во всех фразах.","sci":"H, §E №1, с. 30. Практическая орфография и контекст требуют сверки."},{"n":367,"title":"Червь","letter":"Ч","variants":[{"label":"I","form":"hanjeri","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 31","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=31"}]},{"label":"II","form":"nooni","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 12:23","u":"https://zeno.fm/bible/DDNBIV/ACT/12/"},{"t":"NT18, Мк 9:44","u":"https://zeno.fm/bible/DDNBIV/MRK/9/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":50,"meaning":"В санитарном AL65 nɔɔni относится также к микробам/возбудителям; это не дополнительное точное подтверждение общего «червь»."},{"n":368,"title":"Чёрный","letter":"Ч","variants":[{"label":"I","form":"bi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 171","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=171"}]},{"label":"II","form":"ibi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 5:36","u":"https://zeno.fm/bible/DDNBIV/MAT/5/"}]},{"label":"III","form":"bii","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Откр 6:5","u":"https://zeno.fm/bible/DDNBIV/REV/6/"},{"t":"AL64, PDF с. 11","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=11"},{"t":"AL64, PDF с. 12","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=12"}]},{"label":"IV","form":"harri bi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"SM19, § 2, печ. с. 1","u":"https://journals.openedition.org/ethnoecologie/4356"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":176,"meaning":"ibi, bii и bi — записи разных контекстов/изданий; не сведены к одному написанию. Отдельно приведено выражение из этнографической статьи SM19 в авторском написании; оно не считается установленной самостоятельной словарной формой.","sci":"H, §E №137, с. 39. Практическая орфография и контекст требуют сверки."},{"n":369,"title":"Четверг","letter":"Ч","variants":[{"label":"","form":"alamisi","notes":["Название дня в полном недельном перечне AL65. Тон в этой записи не обозначен."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":370,"title":"Четыре","letter":"Ч","variants":[{"label":"","form":"taaci","notes":["Четыре подхода в описании структуры пособия."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 171","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=171"},{"t":"NT18, Откр 4:8","u":"https://zeno.fm/bible/DDNBIV/REV/4/"},{"t":"AL65, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=5"},{"t":"AL64, PDF с. 10","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=10"},{"t":"AL65, PDF с. 83","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=83"},{"t":"AL64, PDF с. 11","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=11"},{"t":"AL65, PDF с. 74","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=74"},{"t":"AL65, PDF с. 72","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=72"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":25,"meaning":"Среди примеров встречаются сложные слова и числительные с данным компонентом; значение целого шире значения основы.","sci":"H, §E №214, с. 45. Практическая орфография и контекст требуют сверки."},{"n":371,"title":"Число; номер","letter":"Ч","variants":[{"label":"","form":"lamba, Lamba","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П73","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Lamba 12 ya goono agogo ga","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Двенадцать чисел находятся на часах [циферблате].","parse":"Lamba — число, номер; 12 — число 12, цифровая запись; ya — выделительный элемент; goono — находиться, быть в наличии; agogo — часы; ga — на, при; послелог.","note":"Самостоятельное утверждение в описании циферблата; в источнике строка без конечной точки. Значение lamba относится к числам/номерам на циферблате. ga здесь послелог после существительного, не предглагольный показатель ga. Чтение цифрового 12 не подставлено."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Число, номер; применительно к цифрам/числам на циферблате.","related":"П73."},{"n":372,"title":"Числовая запись","letter":"Ч","variants":[{"label":"","form":"1, 4, 7, 9, 12, 20, 52, 55, 65, 100, 365","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П68","head":"AL65, PDF и печ. с. 104","rst":false,"dendi":"Wiciri, à nɛɛra gunguriyo 65.","source":"AL65, PDF и печ. с. 104","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104","lit":"Вечером она продала 65 яиц.","parse":"Wiciri — вечером, контекстное время действия; à — она, Дама из предыдущего предложения; nɛɛra — продавать; gunguriyo — яйца, форма источника; 65 — число 65, цифровая запись.","note":"Полное предложение из задачи о торговке Даме (Dama). Значение wiciri уточняется как вечернее время в повествовании; не создаётся дублирующая статья к уже имеющемуся варианту wiciri. Число сохранено цифрами, его чтение на денди не реконструируется."},{"k":2,"pid":"П73","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Lamba 12 ya goono agogo ga","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Двенадцать чисел находятся на часах [циферблате].","parse":"Lamba — число, номер; 12 — число 12, цифровая запись; ya — выделительный элемент; goono — находиться, быть в наличии; agogo — часы; ga — на, при; послелог.","note":"Самостоятельное утверждение в описании циферблата; в источнике строка без конечной точки. Значение lamba относится к числам/номерам на циферблате. ga здесь послелог после существительного, не предглагольный показатель ga. Чтение цифрового 12 не подставлено."}],"refs":[]}],"extra_refs":[],"linked":[{"k":1,"pid":"П38","head":"","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":2,"pid":"П39","head":"","rst":false,"dendi":"Handu fɔ́ gonda azuma 4.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Один месяц имеет четыре недели.","parse":"Handu — месяц; fɔ́ — один; gonda — иметь; azuma — неделя; 4 — четыре; цифровая запись.","note":"Это приближённая учебная схема, а не утверждение, что каждый календарный месяц длится ровно четыре недели. Цифра не заменяется неподтверждённым дендийским названием числа."},{"k":3,"pid":"П40","head":"","rst":false,"dendi":"Azuma fɔ́ kuna, jibiri 7 ya goono.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"В одной неделе имеются семь дней.","parse":"Azuma — неделя; fɔ́ — один; kuna — внутри; в; jibiri — день в календарной строке; 7 — семь; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Jibiri сохранено как в пособии; не исправлено автоматически на jiribi из иных текстов. Другие варианты статьи «День» не объявлены взаимозаменяемыми во всех сочетаниях."},{"k":4,"pid":"П42","head":"","rst":false,"dendi":"Sooro fo ga, tuurinya 55 ya goono.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","lit":"В одном ряду имеются 55 деревянных элементов.","parse":"Sooro — ряд; fo — один; написание CAL; ga — в; пространственный элемент; tuurinya — деревянный элемент в строительной задаче; 55 — пятьдесят пять; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Печатная с. 41: задача о древесине для строительства. Здесь речь о строительных элементах, поэтому перевод «55 растущих деревьев» не используется. Форма tuurinya совпадает графически с вариантами растительного термина; значение устанавливается контекстом."},{"k":5,"pid":"П47","head":"","rst":false,"dendi":"Jiiri kubantɛ gonda jibiri 365.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Невисокосный год имеет 365 дней.","parse":"Jiiri — год; kubantɛ — невисокосный; значение в сочетании jiiri kubantɛ; gonda — иметь; jibiri — день; 365 — триста шестьдесят пять; цифровая запись источника.","note":"Предложение входит в противопоставление обычного и високосного года. Kubantɛ не объявляется универсальным переводом прилагательного «обычный» вне календарного сочетания. Цифра сохранена; дендийское словесное название числа не восстановлено по догадке."},{"k":6,"pid":"П51","head":"","rst":false,"dendi":"Kabu zǎ 1 ka kwei 9.","source":"AL65, PDF и печ. с. 31.","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=31","lit":"Считай начиная с 1, продвигаясь до 9.","parse":"Kabu — считай; побуждение без отдельного местоимения; zǎ — начиная с, от; 1 — число 1, записанное цифрой; ka — связывает действие с последующим kwei; kwei — идти, продвигаться; в данном задании обозначает достижение верхней границы счёта; 9 — число 9, записанное цифрой.","note":"Полная инструкция перед рядом 1–9. Естественный русский перевод: «Считай от одного до девяти». Цифры не заменены дендийскими словами: их произношение эта цитата не удостоверяет. Сочетание ka kwei передаёт здесь предел «до»; отдельное kwei не объявляется универсальным предлогом «до»."},{"k":7,"pid":"П52","head":"","rst":false,"dendi":"Kabu zǎ 20 nda 20, zǎ 20 ka kwei 100.","source":"AL65, PDF и печ. с. 32.","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=32","lit":"Считай по 20, начиная с 20 и продвигаясь до 100.","parse":"Kabu — считай; zǎ — от, начиная с; в первом сочетании zǎ 20 nda 20 участвует в указании шага; 20 — число 20 (три употребления); nda — связующий элемент в конструкции шага 20 nda 20; повторное zǎ — начало диапазона; ka — связь с kwei; kwei — идти, продвигаться, здесь до указанного предела; 100 — число 100.","note":"Полное задание на счёт с постоянным шагом. Сочетание zǎ 20 nda 20 в этом арифметическом контексте означает счёт двадцатками; это не сложение 20 + 20. Ожидаемый ряд: 20, 40, 60, 80, 100. Функция nda устанавливается для этой конструкции и не подменяется механически переводом «и» или «с»."},{"k":8,"pid":"П77","head":"","rst":false,"dendi":"Sambɔ kanda gunguriyo 224, Ruga kanda 144.","source":"AL65, PDF и печ. с. 51","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51","lit":"Самбо принёс 224 яйца, Руга принёс 144 [яйца].","parse":"Sambɔ — Самбо, имя персонажа; kanda — приносить; gunguriyo — яйца; 224 — цифровая запись числа 224; Ruga — Руга, имя персонажа; kanda — приносить; 144 — цифровая запись числа 144.","note":"Целое предложение с обеими частями. По соседней фразе персонажи пришли на рынок; предмет второго действия восстанавливается из первой части. kanda с одним a не исправлено в kaanda из П35. Чтение чисел не реконструируется."},{"k":9,"pid":"П78","head":"","rst":false,"dendi":"Handu wɔ̀ kuna, à nɛɛra 340.","source":"AL65, PDF и печ. с. 51","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51","lit":"В этом месяце он [комитет] продал 340 [килограммов хлопка].","parse":"Handu — месяц; wɔ̀ — этот; kuna — в, внутри; à — он, отсылка к комитету; nɛɛra — продавать; 340 — цифровая запись числа 340.","note":"Целое предложение из задачи о деревенском комитете Бирини-Лафиа. В предыдущем предложении названы хлопок и kg 250 за прошлый месяц. После 340 в цитате нет ни kg, ни слова «хлопок»: они добавлены только в квадратных скобках перевода."},{"k":10,"pid":"П79","head":"","rst":false,"dendi":"Susuba à nà 48 nɛɛra.","source":"AL65, PDF и печ. с. 55","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=55","lit":"Утром он продал 48 [книг].","parse":"Susuba — утром; à — он, продавец книг; nà — показатель переходного действия; 48 — цифровая запись числа 48; nɛɛra — продавать.","note":"Законченное предложение в задаче о магазине книг, где первоначально было 68 книг. «Книг» восстановлено из предыдущего предложения. Отсутствие пробела после точки в печати не меняет границу предложения."},{"k":11,"pid":"П82","head":"","rst":false,"dendi":"Jiiri nuusamtɛ cin kàà nɔ̀ jiiri 4 kulu nga à gonda jibiri 366.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Високосный год приходит каждые четыре года, и в нём 366 дней.","parse":"Jiiri — год; nuusamtɛ — високосный; cin — показатель обычного повторяющегося действия в этом контексте; kàà — приходить; nɔ̀ — предикативно-выделительный элемент; jiiri — год; 4 — цифровая запись числа 4; kulu — каждый, весь; nga — связь частей, здесь «и»; à — он, год; gonda — иметь; jibiri — день; 366 — цифровая запись числа 366.","note":"Полное утверждение из календарного урока. Это упрощённая формулировка учебника: исключения календарного правила цитата не описывает. На с. 76 в упражнении встречается перестановка подписей; она не используется для переопределения nuusamtɛ и kubantɛ. nga здесь связывает части, а à занимает позицию субъекта."},{"k":12,"pid":"П84","head":"","rst":false,"dendi":"Ali nà mɔnturu fɔ́ dei F 8500 magazɛ̃ kuna.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али купил одни часы за 8500 франков в магазине.","parse":"Ali — Али, имя персонажа; nà — показатель переходного действия; mɔnturu — часы, прибор; fɔ́ — один; dei — покупать; F — обозначение франка в источнике; 8500 — цифровая запись числа 8500; magazɛ̃ — магазин; kuna — внутри, в.","note":"Полное первое предложение задачи о прибыли. mɔnturu соотносится по значению с agogo в CAL, сохраняя свою запись. Русское «одни часы» не означает множественное число слова денди. F — условное обозначение валюты, не реконструированное слово."},{"k":13,"pid":"П85","head":"","rst":false,"dendi":"Ali nà mɔnturu di yeti ka nɛɛra F 9300.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али затем перепродал эти часы за 9300 франков.","parse":"Ali — Али; nà — показатель переходного действия; mɔnturu — часы; di — определительный элемент; yeti — снова, повторно в сочетании yeti ka; ka — связь действий; nɛɛra — продавать; F — обозначение франка; 9300 — цифровая запись числа 9300.","note":"Полное второе предложение той же задачи; П84 сообщает о покупке. yeti ka nɛɛra в этом контексте передано как «перепродать». Из одного примера не выводится самостоятельное значение yeti «возвращать» во всех контекстах."}],"stray":[],"kind":"extra","meaning":"Справочная статья о цифровой записи в цитатах. Это не словарные формы денди: цифры сохраняются как в оригиналах; произношение и морфология числительных по ним не восстанавливаются.","related":"П38, П39, П40, П42, П47, П51, П52, П68, П73."},{"n":373,"title":"Читать","letter":"Ч","variants":[{"label":"I","form":"cou","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П65","head":"AL65, PDF и печ. с. 62","rst":false,"dendi":"Couniji wɔ̀ cou.","source":"AL65, PDF и печ. с. 62","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=62","lit":"Прочитай этот текст.","parse":"Couniji — текст для чтения; wɔ̀ — этот; cou — читать, прочитай.","note":"Самостоятельная учебная инструкция перед текстом. Cou сохранено в написании страницы. Не следует смешивать эту инструкцию с повреждённой при извлечении PDF соседней строкой."},{"k":2,"pid":"П66","head":"AL65, PDF и печ. с. 66","rst":false,"dendi":"N mà nufi hantum ka cou.","source":"AL65, PDF и печ. с. 66","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=66","lit":"Запиши результат и прочитай [его].","parse":"N — ты; mà — побудительный показатель; nufi — результат; hantum — писать, записывать; ka — связь действий; cou — читать.","note":"Полная инструкция к арифметическому заданию. Дополнение «его» в русском восстановлено из контекста и заключено в скобки: отдельного местоимения после cou нет."}],"refs":[]},{"label":"II","form":"cau","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П72","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Iri ma guuru cau.","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Давайте будем определять время [по часам].","parse":"Iri — мы; ma — побудительный показатель; guuru — час, время на часах; cau — читать, здесь считывать показание.","note":"Полная вводная инструкция в уроке о времени перед описанием стрелок и циферблата. Буквально «давайте читать час». cau сохранено по CAL и отделено от написания cou в AL65; это сопоставление записей, а не доказанное правило звукового соответствия."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Читать. Письменный текст — cou в AL65; считывание времени — cau в CAL. Различие написаний сохраняется, не нормализуется без основания.","related":"П65, П66, П72."},{"n":374,"title":"Чихать","letter":"Ч","variants":[{"label":"","form":"tisã","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П71","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo mɛɛ nna noo nunɛ daabu, de noo go tɔkɔɔ au noo go tisã.","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Прикрывайте ваши рот и нос, если [когда] вы кашляете или чихаете.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь «ваши»; mɛɛ — рот; nna — и; noo — форма адресата, здесь «ваш»; nunɛ — нос; daabu — закрывать, прикрывать; de — если, в этом контексте также «когда»; noo — форма адресата, субъект придаточной части; go — предглагольный показатель; tɔkɔɔ — кашлять; au — или; noo — форма адресата, субъект; go — предглагольный показатель; tisã — чихать.","note":"Полная фраза с придаточной частью после запятой. Текст памятки сохраняет повтор noo. В переводе показаны условное и временное прочтения de; из этого примера не выводится тождество de и всех слов «когда»."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Чихать; носовой ã сохранён.","related":"П71."},{"n":375,"title":"Что","letter":"Ч","variants":[{"label":"","form":"ifɔ","notes":["Вопросительное слово."],"full":2,"status":"","examples":[{"k":1,"pid":"П11","head":"NT95, JHN 1:38, PDF с. 60","rst":true,"dendi":"Ifɔ wom go ceeci?","source":"NT95, JHN 1:38, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"что вам надобно?","lit":"Что вы ищете?","parse":"Ifɔ — что?; wom — вы; go — предглагольный показатель; ceeci — искать.","note":"Параллельный Синодальный перевод передаёт вопрос иначе; дословный дендийский перевод не подменён им."},{"k":2,"pid":"П16","head":"AL64, PDF с. 20","rst":false,"dendi":"Ifɔ nɔ noo dendeni?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","lit":"Что именно [адресат вопроса] изучил?","parse":"Ifɔ — что?; nɔ — выделительный/предикативный элемент; noo — форма адресата в пособии; лицо и число отдельно не установлены; dendeni — изучать / учиться.","note":"Дословная глосса намеренно содержит квадратные скобки: лицо и число адресата не подтверждены отдельным описанием местоименной системы. Это полный пример с незавершённой грамматической интерпретацией, а не образец для самостоятельного составления фраз."}],"refs":[{"t":"NT95, PDF с. 29","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=29"},{"t":"NT18, Мф 6:31","u":"https://zeno.fm/bible/DDNBIV/MAT/6/"},{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"},{"t":"AL65, PDF с. 89","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=89"},{"t":"NT18, Мк 9:16","u":"https://zeno.fm/bible/DDNBIV/MRK/9/"},{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 6:28","u":"https://zeno.fm/bible/DDNBIV/JHN/6/"},{"t":"NT18, Мк 10:36","u":"https://zeno.fm/bible/DDNBIV/MRK/10/"},{"t":"NT18, Ин 20:15","u":"https://zeno.fm/bible/DDNBIV/JHN/20/"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П19","head":"","rst":false,"dendi":"Ifɔ̀ ya ci KOFID-19?","source":"COV, PDF с. 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2","lit":"Что является COVID-19?","parse":"Ifɔ̀ — что?; ya — выделительный элемент; ci — являться; KOFID-19 — COVID-19.","note":"Форма названия сохранена по заголовку; в других местах памятки есть COFID-19. Историческая памятка здесь используется как языковой материал, не как медицинское руководство. Тон вопросительного слова сохранён."},{"k":2,"pid":"П20","head":"","rst":false,"dendi":"Ifɔ̀yo ya ci COFID-19 màanayo?","source":"COV, PDF с. 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2","lit":"Какие [вещи] являются признаками COVID-19?","parse":"Ifɔ̀yo — какие?; форма с -yo сохранена; ya — выделительный элемент; ci — являться; COFID-19 — COVID-19; màanayo — признаки / симптомы в данном контексте.","note":"Русский буквальный перевод сохраняет вопросительную именную конструкцию; естественный смысл — «Каковы симптомы COVID-19?». Морфологическая классификация -yo отдельно не завершена; не смешивать этот пример с нейтральной словарной основой."}],"stray":[],"kind":"swadesh","swadesh":12,"meaning":"Сочетание ifɔ sɛ спрашивает о причине («почему?»); ifɔ bɔm — о предмете речи («о чём?»). Это составные конструкции, не единое неизменное значение одного слова.","sci":"AZ, №7. Практическая орфография и контекст требуют сверки."},{"n":376,"title":"Шея","letter":"Ш","variants":[{"label":"","form":"jinde","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 18:6","u":"https://zeno.fm/bible/DDNBIV/MAT/18/"},{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"NT18, Деян 15:10","u":"https://zeno.fm/bible/DDNBIV/ACT/15/"},{"t":"NT18, Мк 9:42","u":"https://zeno.fm/bible/DDNBIV/MRK/9/"},{"t":"NT18, Лк 17:2","u":"https://zeno.fm/bible/DDNBIV/LUK/17/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":87,"meaning":"jinde имеет также значения «голос/звук»; здесь отобраны только употребления о шее.","sci":"H, §E №105, с. 37. Практическая орфография и контекст требуют сверки."},{"n":377,"title":"Широкий","letter":"Ш","variants":[{"label":"","form":"hɛantɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 7:13","u":"https://zeno.fm/bible/DDNBIV/MAT/7/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":29,"meaning":"hɛantɛ — «широкий», о входе; причастная форма."},{"n":378,"title":"Шить","letter":"Ш","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":138,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":379,"title":"Этот","letter":"Э","variants":[{"label":"I","form":"wɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:3","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"}]},{"label":"II","form":"wɔne","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT18, Мф 26:26","u":"https://zeno.fm/bible/DDNBIV/MAT/26/"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]},{"label":"III","form":"wɔ̀","notes":["Форма с низким тоном в письменном тексте."],"full":1,"status":"","examples":[{"k":1,"pid":"П49","head":"AL65, PDF с. 70","rst":false,"dendi":"Alaama wɔ̀ gùna.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Посмотри на это изображение.","parse":"Alaama — изображение; иллюстрация в учебнике; wɔ̀ — этот; gùna — посмотри; побудительное употребление.","note":"Буквальная именная группа — «это изображение». Полная инструкция перед заданием о календаре. Порядок: объект перед глаголом. Тоны wɔ̀ и gùna сохранены именно по этой странице; они не переносятся автоматически на нетонированное Guna в NT95."}],"refs":[{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]},{"label":"IV","form":"wo","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П43","head":"CAL, PDF с. 22","rst":false,"dendi":"Iri ma gweiyo wo te.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","lit":"Пусть мы выполним это упражнение.","parse":"Iri — мы; ma — побудительный показатель; gweiyo — упражнение; форма источника; wo — этот; te — делать; выполнить.","note":"Печатная с. 40: полная инструкция перед арифметическими действиями. Te оставлено в написании CAL, не превращено механически в tɛ. Цитата не реконструирована из словаря."}],"refs":[{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]},{"label":"V","form":"nga di","notes":["Указательное сочетание при hanu «день» в П93: «тот день». Не смешивается с местоименным nga и связующим nga из П82."],"full":1,"status":"","examples":[{"k":1,"pid":"П93","head":"NT18, Ин 11:53","rst":true,"dendi":"Za hanu nga di ǹ saawara ngei ma à wi.","source":"NT18, Ин 11:53","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"С этого дня положили убить Его.","lit":"С того дня они решили, чтобы они убили его.","parse":"Za — с, начиная с; hanu — день; nga — указательная отсылка в сочетании nga di; di — определительный элемент; ǹ — они; saawara — совещаться, принять решение в контексте; ngei — они, самостоятельная форма; ma — модально-побудительный показатель зависимого действия; à — он, здесь его; wi — убивать.","note":"Полное предложение после совещания, описанного в Ин 11:47–52. Решение — убить Иисуса — выражено зависимой частью. Saawara не получает отдельного значения «убивать». В отличие от русского параллельного текста, денди явно выражает субъект ngei зависимой части."}],"refs":[]}],"extra_refs":[],"linked":[{"k":1,"pid":"П45","head":"","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."},{"k":2,"pid":"П62","head":"","rst":false,"dendi":"Fotoo wɔ guna.","source":"AL65, PDF и печ. с. 56","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56","lit":"Посмотри на это изображение.","parse":"Fotoo — изображение, фотография; wɔ — этот; guna — смотри, посмотри.","note":"Полная инструкция к рисунку семьи. Нетонированное wɔ сохранено именно как на этой странице; не заменено wɔ̀ из других инструкций. Повелительный смысл задаётся учебной ситуацией."},{"k":3,"pid":"П65","head":"","rst":false,"dendi":"Couniji wɔ̀ cou.","source":"AL65, PDF и печ. с. 62","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=62","lit":"Прочитай этот текст.","parse":"Couniji — текст для чтения; wɔ̀ — этот; cou — читать, прочитай.","note":"Самостоятельная учебная инструкция перед текстом. Cou сохранено в написании страницы. Не следует смешивать эту инструкцию с повреждённой при извлечении PDF соседней строкой."},{"k":4,"pid":"П74","head":"","rst":false,"dendi":"N mà alaama wɔ̀ gùna.","source":"AL65, PDF и печ. с. 13","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=13","lit":"Посмотри на это изображение.","parse":"N — ты; mà — побудительный показатель; alaama — изображение; wɔ̀ — этот; gùna — смотреть, посмотри.","note":"Целая инструкция перед изображением приготовления пищи. В отличие от П49, здесь выражены N и mà. В печати màalaama слито: нормализован только пробел между показателем и существительным; буквы и тоны сохранены."},{"k":5,"pid":"П78","head":"","rst":false,"dendi":"Handu wɔ̀ kuna, à nɛɛra 340.","source":"AL65, PDF и печ. с. 51","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51","lit":"В этом месяце он [комитет] продал 340 [килограммов хлопка].","parse":"Handu — месяц; wɔ̀ — этот; kuna — в, внутри; à — он, отсылка к комитету; nɛɛra — продавать; 340 — цифровая запись числа 340.","note":"Целое предложение из задачи о деревенском комитете Бирини-Лафиа. В предыдущем предложении названы хлопок и kg 250 за прошлый месяц. После 340 в цитате нет ни kg, ни слова «хлопок»: они добавлены только в квадратных скобках перевода."}],"stray":[],"kind":"swadesh","swadesh":7,"meaning":"Дейктическое значение зависит от конструкции."},{"n":380,"title":"Я","letter":"Я","variants":[{"label":"I","form":"a","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П23","head":"NT95, Мф 24:25, PDF с. 20","rst":true,"dendi":"Guna, a jina ka cii wom sɛ kɔ.","source":"NT95, Мф 24:25, PDF с. 20","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20","pub":"Вот, Я наперед сказал вам.","lit":"Посмотри, я уже заранее сказал вам.","parse":"Guna — посмотри; a — я; jina — предшествовать; здесь заранее; ka — связующий элемент; cii — сказать; wom — вы; sɛ — адресат: кому; kɔ — уже.","note":"Jina ka cii передаёт предварительное предупреждение; jina здесь не переводится как отдельное физическое движение."},{"k":2,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."}],"refs":[{"t":"NT18, Мф 5:17","u":"https://zeno.fm/bible/DDNBIV/MAT/5/"},{"t":"NT18, Ин 10:30","u":"https://zeno.fm/bible/DDNBIV/JHN/10/"},{"t":"NT18, 2 Тим 4:12","u":"https://zeno.fm/bible/DDNBIV/2TI/4/"},{"t":"NT18, Гал 1:24","u":"https://zeno.fm/bible/DDNBIV/GAL/1/"},{"t":"NT18, 1 Ин 2:26","u":"https://zeno.fm/bible/DDNBIV/1JN/2/"},{"t":"NT95, Мф 24:25, PDF с. 20","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20"},{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"}]},{"label":"II","form":"Hɛɛ","notes":["Эмфатическое представление говорящего в Hɛɛ no. Не hɛ «вещь»; различается длина гласного."],"full":1,"status":"","examples":[{"k":1,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."}],"refs":[{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":1,"sci":"AT, №1. Практическая орфография и контекст требуют сверки."},{"n":381,"title":"Являться; быть кем-либо","letter":"Я","variants":[{"label":"","form":"ci","notes":["Глагольная / связочная функция."],"full":4,"status":"","examples":[{"k":1,"pid":"П7","head":"NT95, JHN 4:29, PDF с. 62","rst":true,"dendi":"À mana ci Mɛsiya dee?","source":"NT95, JHN 4:29, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"не Он ли Христос?","lit":"Не является ли он Мессией?","parse":"À — он; mana — отрицательное предикативное употребление; ci — являться; Mɛsiya — Мессия; dee — вопросительная частица.","note":"Ожидание подтверждения возможно по контексту, но не объявляется значением dee во всех вопросах."},{"k":2,"pid":"П8","head":"NT95, MAT 12:23, PDF с. 12","rst":true,"dendi":"À na ci Dafidi ize di dee?","source":"NT95, MAT 12:23, PDF с. 12","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12","pub":"не это ли Христос, сын Давидов?","lit":"Не является ли он тем сыном Давида?","parse":"À — он; na — отрицательная функция в данном сочетании; не смешивать с показателем переходного действия; ci — являться; Dafidi — Давид; ize — сын / потомок; di — определительный элемент; dee — вопросительная частица.","note":"В опубликованном русском тексте добавлено именование «Христос»; в этой дендийской фразе слова Mɛsiya нет."},{"k":3,"pid":"П19","head":"COV, PDF с. 2","rst":false,"dendi":"Ifɔ̀ ya ci KOFID-19?","source":"COV, PDF с. 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2","lit":"Что является COVID-19?","parse":"Ifɔ̀ — что?; ya — выделительный элемент; ci — являться; KOFID-19 — COVID-19.","note":"Форма названия сохранена по заголовку; в других местах памятки есть COFID-19. Историческая памятка здесь используется как языковой материал, не как медицинское руководство. Тон вопросительного слова сохранён."},{"k":4,"pid":"П20","head":"COV, PDF с. 2","rst":false,"dendi":"Ifɔ̀yo ya ci COFID-19 màanayo?","source":"COV, PDF с. 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2","lit":"Какие [вещи] являются признаками COVID-19?","parse":"Ifɔ̀yo — какие?; форма с -yo сохранена; ya — выделительный элемент; ci — являться; COFID-19 — COVID-19; màanayo — признаки / симптомы в данном контексте.","note":"Русский буквальный перевод сохраняет вопросительную именную конструкцию; естественный смысл — «Каковы симптомы COVID-19?». Морфологическая классификация -yo отдельно не завершена; не смешивать этот пример с нейтральной словарной основой."}],"refs":[{"t":"NT18, Ин 11:27","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Ин 6:48","u":"https://zeno.fm/bible/DDNBIV/JHN/6/"},{"t":"NT18, Лк 24:48","u":"https://zeno.fm/bible/DDNBIV/LUK/24/"},{"t":"NT18, Мф 12:8","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"},{"t":"NT18, Ин 1:20","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Отличается от cii «сказать» длиной гласной. Не является универсальным эквивалентом русского «быть»: пребывание и наличие могут выражаться иначе."},{"n":382,"title":"Являться; появляться","letter":"Я","variants":[{"label":"","form":"hunutɛrɛ","notes":["Появиться перед наблюдателем. Не связка ci «являться кем-либо»."],"full":1,"status":"","examples":[{"k":1,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."}],"refs":[{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":383,"title":"Язык (орган)","letter":"Я","variants":[{"label":"","form":"dɛɛnɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мк 7:33","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Рим 3:13","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, Деян 2:3","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Иак 3:8","u":"https://zeno.fm/bible/DDNBIV/JAS/3/"},{"t":"NT18, Откр 10:11","u":"https://zeno.fm/bible/DDNBIV/REV/10/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":78,"sci":"H, §E №101, с. 37. Практическая орфография и контекст требуют сверки."},{"n":384,"title":"Язык (речь, система общения)","letter":"Я","variants":[{"label":"I","form":"cine, cinɛ, ciineyo","notes":["Существительные и формы из опубликованных контекстов.","NT95 также содержит cinɛ; AL64 использует cinɛ и ciineyo. П30–П31 дают язык речевого действия, П41 — языки как учебную цель. Написания cine/cinɛ/ciineyo сохраняются источниково, -yo не отбрасывается автоматически."],"full":null,"status":"","examples":[{"k":1,"pid":"П10","head":"NT18, ACT 21:37","rst":true,"dendi":"N ŋmaani Garɛku cine ba?","source":"NT18, ACT 21:37","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"ты знаешь по‐гречески?","lit":"Ты владеешь греческим языком?","parse":"N — ты; ŋmaani — владеть языком / говорить на языке в этом употреблении; Garɛku — греческий; cine — язык; ba — вопросительная частица.","note":"Омографическое ŋmaani «иной» в других местах не смешано с этим употреблением. В NT95, PDF с. 92, в том же вопросе напечатано cinɛ. Это два издания одного контекста."},{"k":2,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":3,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":4,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":5,"pid":"П41","head":"AL64, PDF с. 3","rst":false,"dendi":"Gandà ciineyo ga nda bature cinɛ ga sènnìyom nda mɛɛ ;","source":"AL64, PDF с. 3","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3","lit":"Устное говорение на языках страны и на языке европейца.","parse":"Gandà — страна; местная языковая среда в этом пункте; ciineyo — языки; форма с -yo; ga — на; элемент конструкции сферы/языка; nda — и; далее посредством; bature — европеец; cinɛ — язык; sènnìyom — говорение; контекстная производная форма; mɛɛ — рот; здесь устный способ.","note":"Полный именной пункт списка учебных целей; личного сказуемого в нём нет. Слово bature не подменено без доказательства названием конкретного языка. Морфологическое разложение sènnìyom пока не установлено. Тоны и точка с запятой сохранены."},{"k":6,"pid":"П75","head":"AL65, PDF и печ. с. 33","rst":false,"lead":["В П75 засвидетельствовано Cìnɛ̀ с тоновыми знаками; это дополнительное источниковое написание того же значения «язык общения»."],"dendi":"Cìnɛ̀ kulu ga, kabuyom azansi zeenɔ fɔ́ goono.","source":"AL65, PDF и печ. с. 33","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=33","lit":"В каждом языке есть один старый [традиционный] способ счёта.","parse":"Cìnɛ̀ — язык общения; kulu — каждый, весь; ga — на, в; послелог; kabuyom — счёт, действие счёта; azansi — способ; zeenɔ — старый, здесь традиционный; fɔ́ — один, некий; goono — имеется.","note":"Полное утверждение из раздела о традиционном счёте. «Традиционный» уточняет контекст zeenɔ. Тоновое написание Cìnɛ̀ не подменено cinɛ; kabuyom — название действия, не глагол kabu."}],"refs":[{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"NT18, Деян 2:8","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Деян 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT18, Деян 22:2","u":"https://zeno.fm/bible/DDNBIV/ACT/22/"},{"t":"NT95, Деян. 21:37, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]},{"label":"II","form":"dɛɛnɛ","notes":["Существительные и формы из опубликованных контекстов."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Откр 5:9","u":"https://zeno.fm/bible/DDNBIV/REV/5/"},{"t":"NT18, Откр 17:15","u":"https://zeno.fm/bible/DDNBIV/REV/17/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Cine в NT18 обозначает язык в языковых сочетаниях; не все его омографы имеют это значение. Dɛɛnɛ — также орган речи; в перечислении народов и языков употреблено метонимически. Cinɛ и ciineyo — формы AL64, сохранённые как в источнике; форму с -yo нельзя выдавать за автоматически равнозначную словарную основу."},{"n":385,"title":"Яйцо","letter":"Я","variants":[{"label":"","form":"gunguri","notes":["Форма gunguriyo «яйца» в П68 сохраняется по пособию и соотносится с gunguri этой статьи."],"full":2,"status":"","examples":[{"k":1,"pid":"П68","head":"AL65, PDF и печ. с. 104","rst":false,"dendi":"Wiciri, à nɛɛra gunguriyo 65.","source":"AL65, PDF и печ. с. 104","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104","lit":"Вечером она продала 65 яиц.","parse":"Wiciri — вечером, контекстное время действия; à — она, Дама из предыдущего предложения; nɛɛra — продавать; gunguriyo — яйца, форма источника; 65 — число 65, цифровая запись.","note":"Полное предложение из задачи о торговке Даме (Dama). Значение wiciri уточняется как вечернее время в повествовании; не создаётся дублирующая статья к уже имеющемуся варианту wiciri. Число сохранено цифрами, его чтение на денди не реконструируется."},{"k":2,"pid":"П77","head":"AL65, PDF и печ. с. 51","rst":false,"dendi":"Sambɔ kanda gunguriyo 224, Ruga kanda 144.","source":"AL65, PDF и печ. с. 51","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51","lit":"Самбо принёс 224 яйца, Руга принёс 144 [яйца].","parse":"Sambɔ — Самбо, имя персонажа; kanda — приносить; gunguriyo — яйца; 224 — цифровая запись числа 224; Ruga — Руга, имя персонажа; kanda — приносить; 144 — цифровая запись числа 144.","note":"Целое предложение с обеими частями. По соседней фразе персонажи пришли на рынок; предмет второго действия восстанавливается из первой части. kanda с одним a не исправлено в kaanda из П35. Чтение чисел не реконструируется."}],"refs":[{"t":"NT18, Лк 11:12","u":"https://zeno.fm/bible/DDNBIV/LUK/11/"},{"t":"AL65, PDF с. 104","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104"},{"t":"AL65, PDF с. 51","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51"},{"t":"AL65, PDF с. 50","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=50"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":67,"sci":"H, §E №85, с. 36. Практическая орфография и контекст требуют сверки."}],"sources":[{"code":"AL65","desc":"Dendi cinɛ couyo nda à hantum dendenikɔ tila. Bugu 1, Waati 1. Manuel de l’apprenant en AEA, Niveau 1 du cycle 1, Bénin. Полный PDF, 114 с. Учебник грамотности для носителей языка: буквы, чтение, письмо, счёт, здоровье, быт и гражданская тематика. Это не русско-дендийский разговорник. Год выпуска на просмотренной обложке не указан. Даты внутри упражнений не приняты за дату издания. Главный новый источник практических написаний.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf"},{"code":"AL64","desc":"Пособие для преподавателя AEA, Бенин. Полный PDF, 60 с. Методика и планы занятий; просмотрено для уточнения функций учебных примеров и письменной системы. Во второй части извлечение текста имеет повреждённые глифы; такие автоматические записи не использованы как новые лексические варианты. Самостоятельных новых форм без проверки значения не добавлено.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf"},{"code":"COV","desc":"ACALAN–UA. COVID-19, Songhay-dendi. Перевод Roukéiyath Alaza Sani и Mama Yola Kpara. Полный PDF, 4 с. Практический санитарный текст с тоновыми знаками. Подтверждает варианты руки, носа, рта, глаза, мытья и названий дыхания. Сохранены расхождения внутри самого буклета: hinazebu / hinanzebu. Дата выпуска не устанавливается по одному упоминанию 2019 года в описании эпидемии.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf"},{"code":"ANT","desc":"Benin: дендийский перевод национального гимна. Traduction de Azaratou Sanny Alaza et Roukéiyath Alaza Sani Bassabitchire. Полный PDF, 1 с. Поэтический текст с элизиями и вариантами в скобках; автоматическое извлечение теряет часть букв. Поэтому ненадёжные фрагменты не использованы для заполнения базовой лексики.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_8.pdf"},{"code":"CAL","desc":"Kilee Dendeniyo Tila / Livret de Calcul en Dendi. DNAEA, C3A / Coop-Suisse. Июнь 2001, дата на обложке. Полный скан, 38 страниц PDF, с разворотами. Пособие по арифметике: операции, деньги, измерения, строительные задачи. Подтверждает gu «пять», hinka «два» по цифровым подписям и tuurinya в подсчёте древесины. Книжная орфография не уравнена автоматически с NT18.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf"},{"code":"CFA","desc":"Бенинский дендийский текст о девальвации франка CFA. На обложке: Cotonou, 23 janvier 1994; 10 страниц PDF с разворотами. Публицистический экономический материал, а не грамматика. Подтверждает тоновую запись kàmmɛ̀, bɔrɔ̀ и союз nna. Сложная финансовая лексика за пределами 207 значений не включена.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf"},{"code":"T68/72","desc":"Nicole Tersis. Le dendi (Niger): phonologie, lexique dendi-français, emprunts (arabe, hausa, français, anglais). Bulletin de la SELAF 10. Полный скан, 48 страниц PDF. Наружная обложка имеет 1972; внутренняя титульная страница — Décembre 1968, и раздел фонологии подписан Paris, décembre 1968. Поэтому это не следует безоговорочно считать другой работой, отличной от Tersis 1968. Научное описание и словарь нигерского денди; полезны для значения и частей речи, но запись не равна практической орфографии учебника Бенина. В словаре формы могут включать артикль, множественное число и тон; варианты не сведены механически к одной основе.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_15.pdf"},{"code":"N78","desc":"Robert Nicolaï. Les parlers dendi. African Languages 4, 1978, печ. с. 47–79. Полный скан, 17 страниц PDF; первая половина первого разворота относится к предыдущей статье. Описание прежде всего Канди, с сопоставлением Джугу и Параку, а также ссылкой на Гая–Маланвиль. Различает регистр полной формы и разговорные сокращения; это одна из причин, почему разные записи не обязательно противоречат друг другу. Примеры в научной транскрипции не выданы за нормативные слова современного учебника.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_16.pdf"},{"code":"SM19","desc":"Lucie Smolderen. Des graines, des fibres et des bobines. Mémoire d’une filière textile artisanale dans le Dendi (Nord Bénin). Re
