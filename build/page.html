— суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П69","head":"","rst":false,"dendi":"Sigiri barà nɔ̀ hanuyo beiyom azansi.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Календарь — средство узнавания дней.","parse":"Sigiri — календарь; barà — компонент связочной конструкции barà nɔ̀; nɔ̀ — компонент той же связочной конструкции; hanuyo — дни; beiyom — знание, узнавание; производное от bei; azansi — средство, способ.","note":"Полное определение из календарного урока. barà nɔ̀ здесь связывает тему с определением, а не вводит список, как в П48. beiyom — именное производное, не голая глагольная форма bei."},{"k":2,"pid":"П93","head":"","rst":true,"dendi":"Za hanu nga di ǹ saawara ngei ma à wi.","source":"NT18, Ин 11:53","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"С этого дня положили убить Его.","lit":"С того дня они решили, чтобы они убили его.","parse":"Za — с, начиная с; hanu — день; nga — указательная отсылка в сочетании nga di; di — определительный элемент; ǹ — они; saawara — совещаться, принять решение в контексте; ngei — они, самостоятельная форма; ma — модально-побудительный показатель зависимого действия; à — он, здесь его; wi — убивать.","note":"Полное предложение после совещания, описанного в Ин 11:47–52. Решение — убить Иисуса — выражено зависимой частью. Saawara не получает отдельного значения «убивать». В отличие от русского параллельного текста, денди явно выражает субъект ngei зависимой части."}],"stray":[],"kind":"swadesh","swadesh":178,"sci":"H, §E №120, с. 38. Практическая орфография и контекст требуют сверки."},{"n":58,"title":"Деньги","letter":"Д","variants":[{"label":"","form":"nɔɔru, Nɔɔru","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П80","head":"AL65, PDF и печ. с. 59","rst":false,"dendi":"Nɔɔru ka à cindi kɛ̀ɛsu kuna kabu.","source":"AL65, PDF и печ. с. 59","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=59","lit":"Посчитай деньги, которые остались в кассе.","parse":"Nɔɔru — деньги; ka — относительная связь; à — оно, отсылка к оставшейся сумме; cindi — оставаться; kɛ̀ɛsu — касса, денежный ящик; kuna — внутри, в; kabu — считать, посчитай.","note":"Целая инструкция в задаче о школьной кассе. Требуется остаток после покупки. Денди использует à, хотя естественный русский перевод «деньги» требует множественного числа."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Деньги; сумма, остающаяся в кассе. Долгота ɔɔ сохранена.","related":"П80."},{"n":59,"title":"Дерево","letter":"Д","variants":[{"label":"I","form":"tuuri","notes":["В корпусе встречаются простая и сложная формы; часть контекстов относится к растениям вообще."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 71","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=71"},{"t":"NT18, Мф 3:10","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"}]},{"label":"II","form":"tuurinya","notes":["В корпусе встречаются простая и сложная формы; часть контекстов относится к растениям вообще.","Печатная с. 41: подсчёт древесины для строительных работ. Слитное написание, подтверждающее вариант NT95.","В строительной задаче — деревянные элементы; не живые деревья. Совпадение графической формы не оправдывает один перевод во всех жанрах."],"full":1,"status":"","examples":[{"k":1,"pid":"П42","head":"CAL, PDF с. 22","rst":false,"dendi":"Sooro fo ga, tuurinya 55 ya goono.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","lit":"В одном ряду имеются 55 деревянных элементов.","parse":"Sooro — ряд; fo — один; написание CAL; ga — в; пространственный элемент; tuurinya — деревянный элемент в строительной задаче; 55 — пятьдесят пять; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Печатная с. 41: задача о древесине для строительства. Здесь речь о строительных элементах, поэтому перевод «55 растущих деревьев» не используется. Форма tuurinya совпадает графически с вариантами растительного термина; значение устанавливается контекстом."}],"refs":[{"t":"NT95, PDF с. 71","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=71"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]},{"label":"III","form":"tuuri-nya","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 13:32","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"}]},{"label":"IV","form":"tuuriyo","notes":["Форма с показателем -yo; основа tuuri независимо подтверждена NT."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL65, PDF с. 53","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=53"}]},{"label":"V","form":"tǔuri","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL64, PDF с. 12","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=12"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":51,"meaning":"Сохранены слитное написание NT95 и написание с дефисом NT18.","sci":"H, §E №53, с. 34. Практическая орфография и контекст требуют сверки."},{"n":60,"title":"Держать","letter":"Д","variants":[{"label":"","form":"jɛ","notes":["Контекст удерживания ветров; значение шире отдельных русских переводов."],"full":1,"status":"","examples":[{"k":1,"pid":"П59","head":"NT18, 1 Фес 5:21","rst":true,"dendi":"Wa hɛ kulu yaase guna, ka ihinnɔ dii ka jɛ.","source":"NT18, 1 Фес 5:21","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Все испытывайте, хорошего держитесь.","lit":"Всё проверьте, а хорошее возьмите и удерживайте.","parse":"Wa — побуждение к адресатам; hɛ — вещь, нечто; kulu — всё; yaase — проверить, испытать в сочетании yaase guna; guna — смотреть, в сочетании «проверить»; ka — связь действий; ihinnɔ — хорошее; dii — взять, ухватить; ka — связь действий; jɛ — держать, сохранять.","note":"Взято всё предложение, а не его часть до запятой. yaase guna рассматривается совместно как «проверить»; отдельные оттенки yaase не объявляются исчерпывающе установленными. dii здесь не di «видеть» и не dii «гореть». ihinnɔ — субстантивированное «хорошее», без подстановки иной записи hinno."}],"refs":[{"t":"NT95, PDF с. 172","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=172"},{"t":"NT18, Мк 9:10","u":"https://zeno.fm/bible/DDNBIV/MRK/9/"},{"t":"NT18, 1 Фес 5:21","u":"https://zeno.fm/bible/DDNBIV/1TH/5/"},{"t":"NT18, 1 Ин 5:21","u":"https://zeno.fm/bible/DDNBIV/1JN/5/"},{"t":"NT18, 1 Тим 3:9","u":"https://zeno.fm/bible/DDNBIV/1TI/3/"},{"t":"NT18, Откр 2:25","u":"https://zeno.fm/bible/DDNBIV/REV/2/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":129,"meaning":"jɛ — удерживать; также хранить сказанное.","sci":"H, §E №207, с. 44. Практическая орфография и контекст требуют сверки."},{"n":61,"title":"Длинный","letter":"Д","variants":[{"label":"","form":"kuuku","notes":["О длине 10-метрового отрезка."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 27:28","u":"https://zeno.fm/bible/DDNBIV/MAT/27/"},{"t":"AL65, PDF с. 34","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=34"},{"t":"AL64, PDF с. 23","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=23"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"},{"t":"AL65, PDF с. 15","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=15"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":28,"meaning":"kuuku относится к длинной одежде; значение и форма зависят от определяемого имени. AL64 использует kuuku также о долгом гласном.","sci":"H, §E №145, с. 39. Практическая орфография и контекст требуют сверки."},{"n":62,"title":"Дождь","letter":"Д","variants":[{"label":"I","form":"hari","notes":["Дождь и сезон дождей."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 16:2","u":"https://zeno.fm/bible/DDNBIV/MAT/16/"},{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"NT18, Иак 5:18","u":"https://zeno.fm/bible/DDNBIV/JAS/5/"},{"t":"NT18, Деян 28:2","u":"https://zeno.fm/bible/DDNBIV/ACT/28/"},{"t":"NT18, Евр 6:7","u":"https://zeno.fm/bible/DDNBIV/HEB/6/"},{"t":"NT18, Откр 11:6","u":"https://zeno.fm/bible/DDNBIV/REV/11/"}]},{"label":"II","form":"bɛɛnɛ-hari","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Иак 5:18","u":"https://zeno.fm/bible/DDNBIV/JAS/5/"}]},{"label":"III","form":"ciniji","notes":["Дождь как явление выпадения воды из облаков; засвидетельствовано в учебном объяснении круговорота воды. Полных примеров: 1."],"full":null,"status":"","examples":[{"k":1,"pid":"П53","head":"AL65, PDF и печ. с. 52","rst":false,"dendi":"Ciniji nɔ̀.","source":"AL65, PD "},{"t":"AL65, PDF с. 64","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=64"}]},{"label":"III","form":"hinanzebu","notes":["В том же COVID-буклете встречаются hinazebu и hinanzebu; сохранены обе записи."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":99,"meaning":"Подтверждены названия дыхания hinazebu / hinanzebu (COV) и hunanzebu (AL65). Это существительные в описаниях дыхательной функции и затруднения дыхания. Общий глагол «дышать» в практическом написании не установлен. Funsu относится к дуновению; см. статью «Дуть». Терсис отдельно различает дуть, дышать и опухать."},{"n":70,"title":"Еврейский; еврей","letter":"Е","variants":[{"label":"I","form":"Eburu","notes":["Название народа и языка в переводе NT."],"full":2,"status":"","examples":[{"k":1,"pid":"П4","head":"NT18, 2CO 11:22","rst":true,"dendi":"Eburu yom no ba?","source":"NT18, 2CO 11:22","source_url":"https://zeno.fm/bible/DDNBIV/2CO/11/","pub":"Они Евреи?","lit":"[Они] евреи?","parse":"Eburu — еврей; yom — показатель множественности; no — предикативный элемент; ba — вопросительная частица.","note":"Отдельного подлежащего «они» в этой фразе нет; оно восстановлено в русском переводе по контексту."},{"k":2,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."}],"refs":[{"t":"NT18, Деян 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT18, Деян 22:2","u":"https://zeno.fm/bible/DDNBIV/ACT/22/"},{"t":"NT18, Ин 20:16","u":"https://zeno.fm/bible/DDNBIV/JHN/20/"},{"t":"NT18, Откр 16:16","u":"https://zeno.fm/bible/DDNBIV/REV/16/"},{"t":"NT18, 2 Кор 11:22","u":"https://zeno.fm/bible/DDNBIV/2CO/11/"}]},{"label":"II","form":"Ebulu","notes":["Иное засвидетельствованное написание NT95. Не исправлено на Eburu и не объявлено свободно взаимозаменяемым с ним."],"full":1,"status":"","examples":[{"k":1,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Перед cine обозначает язык; с yom — людей. Это словоупотребление переводчика; оно само по себе не решает исторический вопрос об арамейском или древнееврейском в отдельных библейских сценах."},{"n":71,"title":"Европеец","letter":"Е","variants":[{"label":"","form":"bature","notes":["В сочетании bature cinɛ. Название конкретного европейского языка не приписано этому слову без дополнительных доказательств."],"full":1,"status":"","examples":[{"k":1,"pid":"П41","head":"AL64, PDF с. 3","rst":false,"dendi":"Gandà ciineyo ga nda bature cinɛ ga sènnìyom nda mɛɛ ;","source":"AL64, PDF с. 3","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3","lit":"Устное говорение на языках страны и на языке европейца.","parse":"Gandà — страна; местная языковая среда в этом пункте; ciineyo — языки; форма с -yo; ga — на; элемент конструкции сферы/языка; nda — и; далее посредством; bature — европеец; cinɛ — язык; sènnìyom — говорение; контекстная производная форма; mɛɛ — рот; здесь устный способ.","note":"Полный именной пункт списка учебных целей; личного сказуемого в нём нет. Слово bature не подменено без доказательства названием конкретного языка. Морфологическое разложение sènnìyom пока не установлено. Тоны и точка с запятой сохранены."}],"refs":[{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":72,"title":"Если","letter":"Е","variants":[{"label":"","form":"de","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П71","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo mɛɛ nna noo nunɛ daabu, de noo go tɔkɔɔ au noo go tisã.","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Прикрывайте ваши рот и нос, если [когда] вы кашляете или чихаете.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь «ваши»; mɛɛ — рот; nna — и; noo — форма адресата, здесь «ваш»; nunɛ — нос; daabu — закрывать, прикрывать; de — если, в этом контексте также «когда»; noo — форма адресата, субъект придаточной части; go — предглагольный показатель; tɔkɔɔ — кашлять; au — или; noo — форма адресата, субъект; go — предглагольный показатель; tisã — чихать.","note":"Полная фраза с придаточной частью после запятой. Текст памятки сохраняет повтор noo. В переводе показаны условное и временное прочтения de; из этого примера не выводится тождество de и всех слов «когда»."}],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мк 7:3","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL65, PDF с. 104","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"},{"t":"AL65, PDF с. 105","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=105"},{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"AL65, PDF с. 107","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=107"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":205,"meaning":"de — условный показатель; в Мк 7:3 конструкция «если не»."},{"n":73,"title":"Есть","letter":"Е","variants":[{"label":"I","form":"ŋmaa","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT18, Мк 7:2","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Лк 24:43","u":"https://zeno.fm/bible/DDNBIV/LUK/24/"},{"t":"NT18, 1 Кор 10:3","u":"https://zeno.fm/bible/DDNBIV/1CO/10/"},{"t":"NT18, Ин 6:49","u":"https://zeno.fm/bible/DDNBIV/JHN/6/"}]},{"label":"II","form":"ŋwaa","notes":["Употребляется о еде; форма ŋw- отличается от написаний NT."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL65, PDF с. 99","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=99"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":93,"sci":"H, §E №164, с. 41. Практическая орфография и контекст требуют сверки."},{"n":74,"title":"Ещё; снова (kpɛɛnɛ)","letter":"Е","variants":[{"label":"","form":"kpɛɛnɛ","notes":["Контекстное соответствие в фразе о большем молчании; полный набор значений не установлен."],"full":2,"status":"","examples":[{"k":1,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":2,"pid":"П88","head":"NT18, Ин 11:23","rst":true,"lead":["В П88 kpɛɛnɛ при tunu передаёт повторение «снова», а не только степень усиления."],"dendi":"Yesu cii à sɛ: «N harume di kaa tunu kpɛɛnɛ.»","source":"NT18, Ин 11:23","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус говорит ей: воскреснет брат твой.","lit":"Иисус сказал ей: «Твой брат снова встанет [воскреснет]».","parse":"Yesu — Иисус; cii — сказать; à — она, Марфа; sɛ — послелог адресата; N — ты, здесь твой; harume — брат; di — определительный элемент; kaa — показатель предстоящего действия в этом контексте; tunu — встать, здесь воскреснуть; kpɛɛnɛ — ещё, снова.","note":"Сохранены вводная часть и целая реплика. Речь о Лазаре, брате Марфы; отсюда контекстное «воскреснуть». kaa перед tunu не переводится вторым глаголом «приходить». harume добавлено к статье «Брат», без утверждения о полном тождестве cɛɛnɛ."}],"refs":[{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":75,"title":"Жажда","letter":"Ж","variants":[{"label":"","form":"jo","notes":["Состояние после питья; значение подтверждается противопоставлением в Ин 4:13–14. Полный пример — П50."],"full":1,"status":"","examples":[{"k":1,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":76,"title":"Жёлтый","letter":"Ж","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":174,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":77,"title":"Жена","letter":"Ж","variants":[{"label":"","form":"wɛndɛ","notes":["Существительное."],"full":2,"status":"","examples":[{"k":1,"pid":"П1","head":"NT18, 1CO 7:27","rst":true,"dendi":"N gunda wɛndɛ ba?","source":"NT18, 1CO 7:27","source_url":"https://zeno.fm/bible/DDNBIV/1CO/7/","pub":"Соединен ли ты с женою?","lit":"Ты имеешь жену?","parse":"N — ты; gunda — иметь; wɛndɛ — жена; ba — вопросительная частица."},{"k":2,"pid":"П2","head":"NT18, 1CO 7:27","rst":true,"dendi":"N sinda wɛndɛ ba?","source":"NT18, 1CO 7:27","source_url":"https://zeno.fm/bible/DDNBIV/1CO/7/","pub":"Остался ли без жены?","lit":"Ты не имеешь жены?","parse":"N — ты; sinda — не иметь; wɛndɛ — жена; ba — вопросительная частица."}],"refs":[{"t":"NT95, PDF с. 73","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=73"},{"t":"NT18, Мф 1:6","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"},{"t":"NT18, Лк 17:32","u":"https://zeno.fm/bible/DDNBIV/LUK/17/"},{"t":"NT18, Еф 5:22","u":"https://zeno.fm/bible/DDNBIV/EPH/5/"},{"t":"NT18, 1 Кор 7:3","u":"https://zeno.fm/bible/DDNBIV/1CO/7/"},{"t":"NT18, Деян 5:1","u":"https://zeno.fm/bible/DDNBIV/ACT/5/"},{"t":"NT18, 1 Кор 7:27","u":"https://zeno.fm/bible/DDNBIV/1CO/7/"},{"t":"NT18, Кол 3:19","u":"https://zeno.fm/bible/DDNBIV/COL/3/"},{"t":"NT18, Кол 3:1 сточниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 48","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=48"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"AL65, PDF с. 113","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=113"},{"t":"AL64, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=7"},{"t":"AL65, PDF с. 79","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=79"}]},{"label":"III","form":"gɔrɛ","notes":["Глагольное и отглагольное употребление.","Не смешивать автоматически с gɔrɔ и не превращать отглагольные сочетания о поведении в примеры проживания. Gɔrɛ-dɔ — производное сочетание о месте проживания."],"full":1,"status":"","examples":[{"k":1,"pid":"П12","head":"NT18, JHN 1:38","rst":true,"dendi":"Coobaaba, mani n goono nda gɔrɛ?","source":"NT18, JHN 1:38","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Равви́ (что значит: «учитель»), где живешь?","lit":"Учитель, где ты проживаешь?","parse":"Coobaaba — учитель; mani — где?; n — ты; goono — пребывать; nda — элемент глагольного сочетания; gɔrɛ — проживать.","note":"Goоno nda gɔrɛ разбирается как сочетание; nda не переводится механически русским «с». Синодальное «Равви» входит в опубликованный параллельный текст."}],"refs":[{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 1:39","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Деян 15:34","u":"https://zeno.fm/bible/DDNBIV/ACT/15/"},{"t":"NT18, 1 Пет 3:2","u":"https://zeno.fm/bible/DDNBIV/1PE/3/"},{"t":"NT18, 1 Пет 1:15","u":"https://zeno.fm/bible/DDNBIV/1PE/1/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":108,"meaning":"Учебные hunayom — названия жизни, не подтверждение глагола «жить». Не смешивать автоматически с gɔrɔ и не превращать отглагольные сочетания о поведении в примеры проживания. Gɔrɛ-dɔ — производное сочетание о месте проживания.","sci":"H, §E №113, с. 37. Практическая орфография и контекст требуют сверки."},{"n":83,"title":"Загрязнять","letter":"З","variants":[{"label":"","form":"ziibandi","notes":["Глагол изменения состояния воды; не прилагательное ziibi."],"full":1,"status":"","examples":[{"k":1,"pid":"П36","head":"AL65, PDF с. 17","rst":false,"dendi":"Iri ma sí hari ziibandi.","source":"AL65, PDF с. 17","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17","lit":"Пусть мы не загрязняем воду.","parse":"Iri — мы; ma — побудительный показатель; sí — отрицание; тон источника сохранён; hari — вода; ziibandi — загрязнять.","note":"Учебная фраза о сохранении чистоты воды. Ziibandi — глагол изменения состояния, а не прилагательное «грязный»."}],"refs":[{"t":"AL65, PDF с. 17","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":84,"title":"Замерзать","letter":"З","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":145,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":85,"title":"Заранее; предшествовать","letter":"З","variants":[{"label":"","form":"jina","notes":["В jina ka cii — заранее сказать. Общие значения за пределами этого сочетания требуют проверки."],"full":1,"status":"","examples":[{"k":1,"pid":"П23","head":"NT95, Мф 24:25, PDF с. 20","rst":true,"dendi":"Guna, a jina ka cii wom sɛ kɔ.","source":"NT95, Мф 24:25, PDF с. 20","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20","pub":"Вот, Я наперед сказал вам.","lit":"Посмотри, я уже заранее сказал вам.","parse":"Guna — посмотри; a — я; jina — предшествовать; здесь заранее; ka — связующий элемент; cii — сказать; wom — вы; sɛ — адресат: кому; kɔ — уже.","note":"Jina ka cii передаёт предварительное предупрежден
