а поверхности)","letter":"П","variants":[],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":143,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":187,"title":"Поворачивать","letter":"П","variants":[{"label":"","form":"bɛrɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 9:40","u":"https://zeno.fm/bible/DDNBIV/ACT/9/"},{"t":"AL65, PDF с. 109","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=109"},{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL65, PDF с. 19","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=19"},{"t":"NT18, Лк 2:45","u":"https://zeno.fm/bible/DDNBIV/LUK/2/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":126,"meaning":"bɛrɛ в учебных примерах также обозначает превращение/переработку."},{"n":188,"title":"Подобно; как (сравнение)","letter":"П","variants":[{"label":"","form":"zanga","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":2,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"В П15 вводит перечисление частей. Не вопросительное mɛtɛ."},{"n":189,"title":"Показатель множественности: yom","letter":"П","variants":[{"label":"","form":"yom","notes":["В Eburu yom и cɛɛnɛ yom. Не выводится механическое тождество отдельного yom всем окончаниям -yom."],"full":3,"status":"","examples":[{"k":1,"pid":"П4","head":"NT18, 2CO 11:22","rst":true,"dendi":"Eburu yom no ba?","source":"NT18, 2CO 11:22","source_url":"https://zeno.fm/bible/DDNBIV/2CO/11/","pub":"Они Евреи?","lit":"[Они] евреи?","parse":"Eburu — еврей; yom — показатель множественности; no — предикативный элемент; ba — вопросительная частица.","note":"Отдельного подлежащего «они» в этой фразе нет; оно восстановлено в русском переводе по контексту."},{"k":2,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."},{"k":3,"pid":"П45","head":"NT95, Мф 13:51, PDF с. 13","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."}],"refs":[{"t":"NT18, 2CO 11:22","u":"https://zeno.fm/bible/DDNBIV/2CO/11/"},{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT95, Мф 13:51, PDF с. 13","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":190,"title":"Показатель переходного действия: na","letter":"П","variants":[{"label":"","form":"na","notes":["Предглагольный показатель в переходной конструкции."],"full":2,"status":"","examples":[{"k":1,"pid":"П17","head":"AL64, PDF с. 20","rst":false,"dendi":"Mɛtɛ noo nà à dendeni nda?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Каким способом [адресат вопроса] изучил это?","parse":"Mɛtɛ — как?; noo — форма адресата; лицо и число не установлены; nà — показатель переходного действия; à — это, дополнение; dendeni — изучать; nda — элемент конструкции способа.","note":"Тон nà сохранён по источнику. Классификация конечного nda предварительная; это ограничение относится и к статье nda. Перевод не выдаётся за полностью завершённый разбор."},{"k":2,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT18, Ин 1:42","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 11:34","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Деян 2:8","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Мк 14:67","u":"https://zeno.fm/bible/DDNBIV/MRK/14/"},{"t":"NT18, Ин 1:12","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"}],"stray":[],"kind":"extra","meaning":"В выбранных местах порядок близок к «подлежащее + na + дополнение + глагол». Омографические отрицательные и связочные употребления не объединены с ним автоматически; na/nà сохраняются по источнику."},{"n":191,"title":"Показатель побуждения: ma","letter":"П","variants":[{"label":"","form":"ma","notes":[],"full":null,"status":"","examples":[{"k":1,"pid":"П18","head":"CAL, PDF с. 9, печ. с. 14–15","rst":false,"dendi":"Iri ma dendeni:","source":"CAL, PDF с. 9, печ. с. 14–15","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=9","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Пусть мы учимся:","parse":"Iri — мы; ma — побудительный/желательный показатель в данном сочетании; dendeni — учиться.","note":"Полная вводная фраза перед учебной таблицей; двоеточие сохранено. Таблица задаёт контекст обучения арифметике. Это не выдуманный разговорный вопрос."},{"k":2,"pid":"П29","head":"NT95, 1 Кор 14:29, PDF с. 114","rst":true,"dendi":"Andebi hinka wala ihinza mo ma sendi.","source":"NT95, 1 Кор 14:29, PDF с. 114","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114","pub":"И пророки пусть говорят двое или трое, а прочие пусть рассуждают.","lit":"Двое пророков или трое также пусть говорят.","parse":"Andebi — пророки; hinka — два; wala — или; ihinza — трое; форма при обозначении людей; mo — также; ma — побудительный/желательный показатель; sendi — говорить.","note":"Это полное первое предложение дендийского стиха. Русский параллельный стих также включает указание прочим слушателям; оно не добавлено в дословный перевод отсутствующей здесь второй фразы."},{"k":3,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":4,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."},{"k":5,"pid":"П36","head":"AL65, PDF с. 17","rst":false,"dendi":"Iri ma sí hari ziibandi.","source":"AL65, PDF с. 17","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Пусть мы не загрязняем воду.","parse":"Iri — мы; ma — побудительный показатель; sí — отрицание; тон источника сохранён; hari — вода; ziibandi — загрязнять.","note":"Учебная фраза о сохранении чистоты воды. Ziibandi — глагол изменения состояния, а не прилагательное «грязный»."},{"k":6,"pid":"П43","head":"CAL, PDF с. 22","rst":false,"dendi":"Iri ma gweiyo wo te.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Пусть мы выполним это упражнение.","parse":"Iri — мы; ma — побудительный показатель; gweiyo — упражнение; форма источника; wo — этот; te — делать; выполнить.","note":"Печатная с. 40: полная инструкция перед арифметическими действиями. Te оставлено в написании CAL, не превращено механически в tɛ. Цитата не реконструирована из словаря."}],"refs":[{"t":"CAL, PDF с. 9, печ. с. 14–15","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=9"},{"t":"NT95, 1 Кор 14:29, PDF с. 114","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"},{"t":"AL65, PDF с. 17","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"В П18 — побуждение к совместной учёбе; полная система значений не установлена."},{"n":192,"title":"Показатель побуждения: Wa","letter":"П","variants":[{"label":"","form":"Wa","notes":["Обращение к нескольким адресатам перед si hamburu. Не заменяет ma во всех конструкциях."],"full":1,"status":"","examples":[{"k":1,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."}],"refs":[{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":193,"title":"Показатель при глаголе: ga","letter":"П","variants":[{"label":"","form":"ga","notes":["В Biya ga ka ǹ no. Точная функция отдельно не завершена; не пространственное ga из П41–П42."],"full":1,"status":"","examples":[{"k":1,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":194,"title":"Показатель при глаголе: go","letter":"П","variants":[{"label":"","form":"go","notes":["Предглагольный показатель."],"full":null,"status":"","examples":[{"k":1,"pid":"П6","head":"NT95, JHN 11:26, PDF с. 68","rst":true,"dendi":"N go cimandi nga di gaa dee?","source":"NT95, JHN 11:26, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"Веришь ли сему?","lit":"Ты считаешь это истинным?","parse":"N — ты; go — предглагольный показатель; cimandi — признавать истинным / верить; nga — то / оно; di — указательный элемент; gaa — послелог объекта отношения; dee — вопросительная частица.","note":"Сочетание nga di gaa передаёт объект веры; послелог не имеет здесь отдельного русского «на»."},{"k":2,"pid":"П11","head":"NT95, JHN 1:38, PDF с. 60","rst":true,"dendi":"Ifɔ wom go ceeci?","source":"NT95, JHN 1:38, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"что вам надобно?","lit":"Что вы ищете?","parse":"Ifɔ — что?; wom — вы; go — предглагольный показатель; ceeci — искать.","note":"Параллельный Синодальный перевод передаёт вопрос иначе; дословный дендийский перевод не подменён им."},{"k":3,"pid":"П22","head":"AL65, PDF с. 29","rst":false,"dendi":"Cìi hɛika n go dia.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Скажи вещи, которые ты видишь.","parse":"Cìi — сказать, здесь побуждение; hɛika — вещи, которые; слитная запись в пособии; n — ты; go — предглагольный показатель; dia — видеть.","note":"Тон Cìi сохранён. Компактная запись hɛika не раздвинута пробелами под видом оригинальной цитаты; пословный разбор поясняет её функцию."},{"k":4,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."},{"k":5,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":6,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."}],"refs":[{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 11:26","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Мк 7:35","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Деян 2:6","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Ин 1:50","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"В этих местах связан с продолжающейся/актуальной предикацией. Не образует вопрос сам, не добавляется ко всем глаголам и не объявляется универсальным показателем русского настоящего времени."},{"n":195,"title":"Полный","letter":"П","variants":[{"label":"","form":"tɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 8:23","u":"https://zeno.fm/bible/DDNBIV/LUK/8/"},{"t":"NT18, Рим 3:14","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, Деян 13:52","u":"https://zeno.fm/bible/DDNBIV/ACT/13/"},{"t":"NT18, Ин 16:6","u":"https://zeno.fm/bible/DDNBIV/JHN/16/"},{"t":"NT18, Флп 1:11","u":"https://zeno.fm/bible/DDNBIV/PHP/1/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":182,"meaning":"tɔ — быть полным/наполненным, в конструкции.","sci":"AT, №95. Практическая орфография и контекст требуют сверки."},{"n":196,"title":"Понедельник","letter":"П","variants":[{"label":"","form":"atinni","notes":["Название дня в полном недельном перечне AL65. Тон в этой записи не обозначен."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":197,"title":"Понимать","letter":"П","variants":[{"label":"","form":"faham","notes":["Понимание содержания речи; отрицательная конструкция mana faham."],"full":2,"status":"","examples":[{"k":1,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":2,"pid":"П45","head":"NT95, Мф 13:51, PDF с. 13","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."}],"refs":[{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Мф 13:51, PDF с. 13","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":198,"title":"Послелог / связующий элемент: nda","letter":"П","variants":[{"label":"","form":"nda","notes":["Служебное слово с несколькими функциями."],"full":null,"status":"","examples":[{"k":1,"pid":"П12","head":"NT18, JHN 1:38","rst":true,"dendi":"Coobaaba, mani n goono nda gɔrɛ?","source":"NT18, JHN 1:38","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Равви́ (что значит: «учитель»), где живешь?","lit":"Учитель, где ты проживаешь?","parse":"Coobaaba — учитель; mani — где?; n — ты; goono — пребывать; nda — элемент глагольного сочетания; gɔrɛ — проживать.","note":"Goоno nda gɔrɛ разбирается как сочетание; nda не переводится механически русским «с». Синодальное «Равви» входит в опубликованный параллельный текст."},{"k":2,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":3,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":4,"pid":"П17","head":"AL64, PDF с. 20","rst":false,"dendi":"Mɛtɛ noo nà à dendeni nda?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Каким способом [адресат вопроса] изучил это?","parse":"Mɛtɛ — как?; noo — форма адресата; лицо и число не установлены; nà — показатель переходного действия; à — это, дополнение; dendeni — изучать; nda — элемент конструкции способа.","note":"Тон nà сохранён по источнику. Классификация конечного nda предварительная; это ограничение относится и к статье nda. Перевод не выдаётся за полностью завершённый разбор."},{"k":5,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":6,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":7,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":8,"pid":"П34","head":"NT95, Еф 4:5, PDF с. 127","rst":true,"dendi":"Kpe fɔlɔnku ya goono nda naane fɔlɔnku nda mirandiyom fɔlɔnku.","source":"NT95, Еф 4:5, PDF с. 127","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127","pub":"один Господь, одна вера, одно крещение,","lit":"Есть один Господь, одна вера и одно крещение.","parse":"Kpe — Господь; fɔlɔnku — один; единственный в данном перечислении; ya — выделительный элемент; goono — быть в наличии; nda — и; связь перечисления; naane — вера; mirandiyom — крещение; производная форма в религиозном контексте.","note":"Naane здесь существительное, как показывают параллельные именные группы. Mirandiyom не переведено как обычное мытьё. Fɔlɔnku не заменено редактором на fɔ."},{"k":9,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."},{"k":10,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":11,"pid":"П41","head":"AL64, PDF с. 3","rst":false,"dendi":"Gandà ciineyo ga nda bature cinɛ ga sènnìyom nda mɛɛ ;","source":"AL64, PDF с. 3","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Устное говорение на языках страны и на языке европейца.","parse":"Gandà — страна; местная языковая среда в этом пункте; ciineyo — языки; форма с -yo; ga — на; элемент конструкции сферы/языка; nda — и; далее посредством; bature — европеец; cinɛ — язык; sènnìyom — говорение; контекстная производная форма; mɛɛ — рот; здесь устный способ.","note":"Полный именной пункт списка учебных целей; личного сказуемого в нём нет. Слово bature не подменено без доказательства названием конкретного языка. Морфологическое разложение sènnìyom пока не установлено. Тоны и точка с запятой сохранены."}],"refs":[{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"},{"t":"NT18, Деян 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT18, Деян 2:4","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Деян 22:2","u":"https://zeno.fm/bible/DDNBIV/ACT/22/"},{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Мф 17:3","u":"https://zeno.fm/bible/DDNBIV/MAT/17/"},{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"},{"t":"NT95, Еф 4:5, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"},{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Может связывать участники («и / с»), обозначать средство, язык или участие в глагольной конструкции. Перевод определяется сочетанием, а не единым русским эквивалентом."},{"n":199,"title":"Послелог адресата: sɛ","letter":"П","variants":[{"label":"","form":"sɛ","notes":["Стоит после обозначения адресата: wom sɛ, à sɛ, ǹ sɛ, ngei sɛ. В П27 также обозначает тех, кому явились. Русское «кому» передаёт отношение, а не отдельное лексическое слово."],"full":null,"status":"","examples":[{"k":1,"pid":"П23","head":"NT95, Мф 24:25, PDF с. 20","rst":true,"dendi":"Guna, a jina ka cii wom sɛ kɔ.","source":"NT95, Мф 24:25, PDF с. 20","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20","pub":"Вот, Я наперед сказал вам.","lit":"Посмотри, я уже заранее сказал вам.","parse":"Guna — посмотри; a — я; jina — предшествовать; здесь заранее; ka — связующий элемент; cii — сказать; wom — вы; sɛ — адресат: кому; kɔ — уже.","note":"Jina ka cii передаёт предварительное предупреждение; jina здесь не переводится как отдельное физическое движение."},{"k":2,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."},{"k":3,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."},{"k":4,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."},{"k":5,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":6,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":7,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":8,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, Мф 24:25, PDF с. 20","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20"},{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"},{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"},{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":200,"title":"Послелог: gaa","letter":"П","variants":[{"label":"","form":"gaa","notes":["Послелог."],"full":3,"status":"","examples":[{"k":1,"pid":"П6","head":"NT95, JHN 11:26, PDF с. 68","rst":true,"dendi":"N go cimandi nga di gaa dee?","source":"NT95, JHN 11:26, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"Веришь ли сему?","lit":"Ты считаешь это истинным?","parse":"N — ты; go — предглагольный показатель; cimandi — признавать истинным / верить; nga — то / оно; di — указательный элемент; gaa — послелог объекта отношения; dee — вопросительная частица.","note":"Сочетание nga di gaa передаёт объект веры; послелог не имеет здесь отдельного русского «на»."},{"k":2,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."},{"k":3,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."}],"refs":[{"t":"NT18, Ин 7:5","u":"https://zeno.fm/bible/DDNBIV/JHN/7/"},{"t":"NT18, Ин 11:26","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Ин 5:47","u":"https://zeno.fm/bible/DDNBIV/JHN/5/"},{"t":"NT18, Ин 10:38","u":"https://zeno.fm/bible/DDNBIV/JHN/10/"},{"t":"NT18, Деян 2:3","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Следует за своим дополнением. В контекстах веры обозначает объект отношения («в / этому»), в других — пространственное или иное отношение. Не заменять все gaa русским «на»."},{"n":201,"title":"Потому что","letter":"П","variants":[{"label":"I","form":"zama","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 27","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=27"},{"t":"NT18, Мф 28:5","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"}]},{"label":"II","form":"domi","notes":["Причинное «потому что» в санитарном тексте."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 11","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=11"},{"t":"AL64, PDF с. 6","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=6"},{"t":"CFA, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=5"},{"t":"AL65, PDF с. 109","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=109"},{"t":"AL64, PDF с. 10","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=10"},{"t":"AL65, PDF с. 15","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=15"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":206},{"n":202,"title":"Правильный; верный","letter":"П","variants":[{"label":"","form":"cimi","notes":["Истинное утверждение в упражнении."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 10:29","u":"https://zeno.fm/bible/DDNBIV/MAT/10/"},{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"},{"t":"CFA, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=5"},{"t":"AL65, PDF с. 99","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=99"},{"t":"AL65, PDF с. 47","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=47"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":196,"meaning":"cimi — правда/истина, а не универсальное прилагательное «правильный»."},{"n":203,"title":"Правый (сторона)","letter":"П","variants":[{"label":"","form":"kambɛŋmaa","notes":["Сложная форма с kambɛ «рука»."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 21","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=21"},{"t":"NT18, Мф 25:33","u":"https://zeno.fm/bible/DDNBIV/MAT/25/"},{"t":"NT18, Откр 5:7","u":"https://zeno.fm/bible/DDNBIV/REV/5/"},{"t":"NT18, Лк 22:50","u":"https://zeno.fm/bible/DDNBIV/LUK/22/"},{"t":"NT18, 2 Кор 6:7","u":"https://zeno.fm/bible/DDNBIV/2CO/6/"},{"t":"NT18, Деян 5:31","u":"https://zeno.fm/bible/DDNBIV/ACT/5/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":199,"meaning":"kambɛŋmaa — правая сторона; проверено противопоставление с kambɛwo."},{"n":204,"title":"Представление перечня: barà nɔ̀","letter":"П","variants":[{"label":"","form":"barà nɔ̀","notes":["Контекстное сочетание перед перечнем: «таковы / вот». Функции компонентов вне этой конструкции не выведены по одному примеру."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":205,"title":"При","letter":"П","variants":[{"label":"I","form":"gaa","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 28:3","u":"https://zeno.fm/bible/DDNBIV/ACT/28/"}]},{"label":"II","form":"ga","notes":["Послелог: на/при; контекстное соответствие."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"AL65, PDF с. 102","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=102"}]},{"label":"III","form":"gà","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":201,"meaning":"gaa — на/при; постпозиционное употребление зависит от конструкции."},{"n":206,"title":"Признак; симптом","letter":"П","variants":[{"label":"","form":"màanayo","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П20","head":"COV, PDF с. 2","rst":false,"dendi":"Ifɔ̀yo ya ci COFID-19 màanayo?","source":"COV, PDF с. 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Какие [вещи] являются признаками COVID-19?","parse":"Ifɔ̀yo — какие?; форма с -yo сохранена; ya — выделительный элемент; ci — являться; COFID-19 — COVID-19; màanayo — признаки / симптомы в данном контексте.","note":"Русский буквальный перевод сохраняет вопросительную именную конструкцию; естественный смысл — «Каковы симптомы COVID-19?». Морфологическая классификация -yo отдельно не завершена; не смешивать этот пример с нейтральной словарной основой."}],"refs":[{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Контекстная форма с -yo из памятки. Самостоятельная нетонированная основа и разложение не восстановлены по догадке."},{"n":207,"title":"Приносить","letter":"П","variants":[{"label":"","form":"kaanda","notes":["Переносно: приносить терпение, давать результат. Не kaa «приходить»."],"full":1,"status":"","examples":[{"k":1,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."}],"refs":[{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":208,"title":"Приходить","letter":"П","variants":[{"label":"I","form":"kaa","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:1","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Ин 14:18","u":"https://zeno.fm/bible/DDNBIV/JHN/14/"},{"t":"NT18, Лк 23:52","u":"https://zeno.fm/bible/DDNBIV/LUK/23/"},{"t":"NT18, Мк 13:36","u":"https://zeno.fm/bible/DDNBIV/MRK/13/"}]},{"label":"II","form":"kàà","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=100"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":122,"sci":"H, §E №174, с. 41. Практическая орфография и контекст требуют сверки."},{"n":209,"title":"Пророк","letter":"П","variants":[{"label":"","form":"Andebi, andebi","notes":["В П29 Andebi hinka обозначает двух пророков; в П44 andebi di относится к одному ожидаемому пророку. Написание подтверждено обоими полными контекстами, а не реконструировано.","В П44 andebi di относится к одному ожидаемому пророку, в П29 Andebi hinka — к нескольким. Базовое написание andebi теперь подтверждено полным вопросом, а не восстановлено по догадке."],"full":2,"status":"","examples":[{"k":1,"pid":"П29","head":"NT95, 1 Кор 14:29, PDF с. 114","rst":true,"dendi":"Andebi hinka wala ihinza mo ma sendi.","source":"NT95, 1 Кор 14:29, PDF с. 114","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114","pub":"И пророки пусть говорят двое или трое, а прочие пусть рассуждают.","lit":"Двое пророков или трое также пусть говорят.","parse":"Andebi — пророки; hinka — два; wala — или; ihinza — трое; форма при обозначении людей; mo — также; ma — побудительный/желательный показатель; sendi — говорить.","note":"Это полное первое предложение дендийского стиха. Русский параллельный стих также включает указание прочим слушателям; оно не добавлено в дословный перевод отсутствующей здесь второй фразы."},{"k":2,"pid":"П44","head":"NT95, Ин 1:21, PDF с. 60","rst":true,"dendi":"Ǹ cii: Ni no andebi di? À tu ka cii. Awo.","source":"NT95, Ин 1:21, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"Пророк? Он отвечал: нет.","lit":"Они сказали: ты — тот пророк? Он ответил: нет.","parse":"Ǹ — они; cii — сказать; Ni — ты; no — предикативный элемент; andebi — пророк; di — определительный элемент; À — он; tu — ответить; ka — связь действий; Awo — нет.","note":"Вопрос без ba и dee; ответ Awo приведён вместе с вопросом. Перед Awo в издании напечатана точка после cii; она сохранена, хотя русский перевод оформляет ответ двоеточием. Cii во второй части также означает «сказать». Полный русский стих включает предшествующий вопрос об Илии; здесь приведена соответствующая часть."}],"refs":[{"t":"NT95, 1 Кор 14:29, PDF с. 114","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114"},{"t":"NT95, Ин 1:21, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":210,"title":"Проходить","letter":"П","variants":[{"label":"","form":"bisa","notes":["Движение мимо/через место; не приравнено ко всем значениям «ходить»."],"full":1,"status":"","examples":[{"k":1,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."}],"refs":[{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":211,"title":"Прямой","letter":"П","variants":[{"label":"","form":"cɛandi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 3:4","u":"https://zeno.fm/bible/DDNBIV/LUK/3/"},{"t":"NT18, Лк 3:5","u":"https://zeno.fm/bible/DDNBIV/LUK/3/"},{"t":"NT18, Мф 3:3","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Мк 1:3","u":"https://zeno.fm/bible/DDNBIV/MRK/1/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":189,"meaning":"cɛandi — сделать прямым; не самостоятельное прилагательное.","sci":"H, §E №160, с. 41. Практическая орфография и контекст требуют сверки."},{"n":212,"title":"Птица","letter":"П","variants":[{"label":"","form":"ciro","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 27","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=27"},{"t":"NT18, Мф 10:29","u":"https://zeno.fm/bible/DDNBIV/MAT/10/"},{"t":"NT18, Лк 12:7","u":"https://zeno.fm/bible/DDNBIV/LUK/12/"},{"t":"NT18, Рим 1:23","u":"https://zeno.fm/bible/DDNBIV/ROM/1/"},{"t":"NT18, Мк 4:4","u":"https://zeno.fm/bible/DDNBIV/MRK/4/"},{"t":"NT18, Деян 10:12","u":"https://zeno.fm/bible/DDNBIV/ACT/10/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":46,"sci":"H, §E №72, с. 35. Практическая орфография и контекст требуют сверки."},{"n":213,"title":"Пыль","letter":"П","variants":[{"label":"","form":"kuso","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 10:11","u":"https://zeno.fm/bible/DDNBIV/LUK/10/"}]}],"extra_
