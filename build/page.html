пы; amma — но; ǹ — они; mana — отрицание; à — он, здесь его; ta — принимать.","note":"Полное предложение. nga ŋmɔne yom — «свои» как группа людей; слово «люди» отдельно не выражено. kaa здесь глагол прихода, в отличие от предглагольного употребления в П88. dɔ разбирается как послелог этой конструкции."}],"stray":[],"kind":"extra"},{"n":217,"title":"Показатель переходного действия: na","letter":"П","variants":[{"label":"","form":"na","notes":["Предглагольный показатель в переходной конструкции."],"full":2,"status":"","examples":[{"k":1,"pid":"П17","head":"AL64, PDF с. 20","rst":false,"dendi":"Mɛtɛ noo nà à dendeni nda?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","lit":"Каким способом [адресат вопроса] изучил это?","parse":"Mɛtɛ — как?; noo — форма адресата; лицо и число не установлены; nà — показатель переходного действия; à — это, дополнение; dendeni — изучать; nda — элемент конструкции способа.","note":"Тон nà сохранён по источнику. Классификация конечного nda предварительная; это ограничение относится и к статье nda. Перевод не выдаётся за полностью завершённый разбор."},{"k":2,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT18, Ин 1:42","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 11:34","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Деян 2:8","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Мк 14:67","u":"https://zeno.fm/bible/DDNBIV/MRK/14/"},{"t":"NT18, Ин 1:12","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"}],"linked":[{"k":1,"pid":"П8","head":"","rst":true,"dendi":"À na ci Dafidi ize di dee?","source":"NT95, MAT 12:23, PDF с. 12","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12","pub":"не это ли Христос, сын Давидов?","lit":"Не является ли он тем сыном Давида?","parse":"À — он; na — отрицательная функция в данном сочетании; не смешивать с показателем переходного действия; ci — являться; Dafidi — Давид; ize — сын / потомок; di — определительный элемент; dee — вопросительная частица.","note":"В опубликованном русском тексте добавлено именование «Христос»; в этой дендийской фразе слова Mɛsiya нет."},{"k":2,"pid":"П79","head":"","rst":false,"dendi":"Susuba à nà 48 nɛɛra.","source":"AL65, PDF и печ. с. 55","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=55","lit":"Утром он продал 48 [книг].","parse":"Susuba — утром; à — он, продавец книг; nà — показатель переходного действия; 48 — цифровая запись числа 48; nɛɛra — продавать.","note":"Законченное предложение в задаче о магазине книг, где первоначально было 68 книг. «Книг» восстановлено из предыдущего предложения. Отсутствие пробела после точки в печати не меняет границу предложения."},{"k":3,"pid":"П84","head":"","rst":false,"dendi":"Ali nà mɔnturu fɔ́ dei F 8500 magazɛ̃ kuna.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али купил одни часы за 8500 франков в магазине.","parse":"Ali — Али, имя персонажа; nà — показатель переходного действия; mɔnturu — часы, прибор; fɔ́ — один; dei — покупать; F — обозначение франка в источнике; 8500 — цифровая запись числа 8500; magazɛ̃ — магазин; kuna — внутри, в.","note":"Полное первое предложение задачи о прибыли. mɔnturu соотносится по значению с agogo в CAL, сохраняя свою запись. Русское «одни часы» не означает множественное число слова денди. F — условное обозначение валюты, не реконструированное слово."},{"k":4,"pid":"П85","head":"","rst":false,"dendi":"Ali nà mɔnturu di yeti ka nɛɛra F 9300.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али затем перепродал эти часы за 9300 франков.","parse":"Ali — Али; nà — показатель переходного действия; mɔnturu — часы; di — определительный элемент; yeti — снова, повторно в сочетании yeti ka; ka — связь действий; nɛɛra — продавать; F — обозначение франка; 9300 — цифровая запись числа 9300.","note":"Полное второе предложение той же задачи; П84 сообщает о покупке. yeti ka nɛɛra в этом контексте передано как «перепродать». Из одного примера не выводится самостоятельное значение yeti «возвращать» во всех контекстах."},{"k":5,"pid":"П89","head":"","rst":true,"dendi":"Ikpɛ na bɔrɔ fɔ dɔntɔm, à maa no Yohana.","source":"NT18, Ин 1:6","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Был человек, посланный от Бога; имя ему Иоанн.","lit":"Бог послал одного человека, его имя — Иоанн.","parse":"Ikpɛ — Бог; na — показатель переходного действия; bɔrɔ — человек; fɔ — один, некий; dɔntɔm — посылать; à — он, здесь его; maa — имя; no — связочный элемент; Yohana — Иоанн.","note":"Полное предложение, включая часть об имени. maa здесь «имя», не «слышать». Активная конструкция денди сохранена в авторском переводе, несмотря на страдательный оборот русского параллельного текста."},{"k":6,"pid":"П90","head":"","rst":true,"dendi":"À goono handunya. Nga mo ya na handunya tɛ amma handunya mana à bei.","source":"NT18, Ин 1:10","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"В мире был, и мир чрез Него на́чал быть, и мир Его не познал.","lit":"Он был в мире. Он же сотворил мир, но мир его не знал.","parse":"À — он, отсылка к действующему лицу пролога; goono — находиться, быть; handunya — мир; Nga — он, самостоятельная форма; mo — также, же; ya — выделение; na — показатель переходного действия; handunya — мир; tɛ — делать, здесь сотворить; amma — но; handunya — мир; mana — отрицание; à — он, здесь его; bei — знать.","note":"Весь стих состоит из двух законченных предложений и приведён целиком. Отсылку À следует читать в контексте пролога о Слове и свете. «Мир не знал» — переносное обозначение людей мира. Прошедшее время перевода не объявлено значением goono."},{"k":7,"pid":"П92","head":"","rst":true,"dendi":"Coobaaba-ize hinka di maa Yohana go sendi ya di. Ǹ na Yesu gana.","source":"NT18, Ин 1:37","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Услышав от него сии слова, оба ученика пошли за Иисусом.","lit":"Те два ученика услышали, как Иоанн говорит так. Они последовали за Иисусом.","parse":"Coobaaba-ize — ученик, сложное слово; hinka — два; di — определительный элемент; maa — слышать; Yohana — Иоанн; go — предглагольный показатель; sendi — говорить; ya — компонент сочетания ya di «так»; di — компонент сочетания ya di; Ǹ — они; na — показатель переходного действия; Yesu — Иисус; gana — следовать за.","note":"Приведены оба предложения стиха. ya di после глагола речи передаёт «так»: его нельзя механически разобрать как выделительное ya из П19. Coobaaba-ize сохранено с дефисом. maa здесь «слышать», не «имя»."}],"stray":[],"kind":"extra","meaning":"В выбранных местах порядок близок к «подлежащее + na + дополнение + глагол». Омографические отрицательные и связочные употребления не объединены с ним автоматически; na/nà сохраняются по источнику."},{"n":218,"title":"Показатель побуждения: ma","letter":"П","variants":[{"label":"","form":"ma","notes":[],"full":null,"status":"","examples":[{"k":1,"pid":"П18","head":"CAL, PDF с. 9, печ. с. 14–15","rst":false,"dendi":"Iri ma dendeni:","source":"CAL, PDF с. 9, печ. с. 14–15","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=9","lit":"Пусть мы учимся:","parse":"Iri — мы; ma — побудительный/желательный показатель в данном сочетании; dendeni — учиться.","note":"Полная вводная фраза перед учебной таблицей; двоеточие сохранено. Таблица задаёт контекст обучения арифметике. Это не выдуманный разговорный вопрос."},{"k":2,"pid":"П29","head":"NT95, 1 Кор 14:29, PDF с. 114","rst":true,"dendi":"Andebi hinka wala ihinza mo ma sendi.","source":"NT95, 1 Кор 14:29, PDF с. 114","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114","pub":"И пророки пусть говорят двое или трое, а прочие пусть рассуждают.","lit":"Двое пророков или трое также пусть говорят.","parse":"Andebi — пророки; hinka — два; wala — или; ihinza — трое; форма при обозначении людей; mo — также; ma — побудительный/желательный показатель; sendi — говорить.","note":"Это полное первое предложение дендийского стиха. Русский параллельный стих также включает указание прочим слушателям; оно не добавлено в дословный перевод отсутствующей здесь второй фразы."},{"k":3,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":4,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."},{"k":5,"pid":"П36","head":"AL65, PDF с. 17","rst":false,"dendi":"Iri ma sí hari ziibandi.","source":"AL65, PDF с. 17","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17","lit":"Пусть мы не загрязняем воду.","parse":"Iri — мы; ma — побудительный показатель; sí — отрицание; тон источника сохранён; hari — вода; ziibandi — загрязнять.","note":"Учебная фраза о сохранении чистоты воды. Ziibandi — глагол изменения состояния, а не прилагательное «грязный»."},{"k":6,"pid":"П43","head":"CAL, PDF с. 22","rst":false,"dendi":"Iri ma gweiyo wo te.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","lit":"Пусть мы выполним это упражнение.","parse":"Iri — мы; ma — побудительный показатель; gweiyo — упражнение; форма источника; wo — этот; te — делать; выполнить.","note":"Печатная с. 40: полная инструкция перед арифметическими действиями. Te оставлено в написании CAL, не превращено механически в tɛ. Цитата не реконструирована из словаря."}],"refs":[{"t":"CAL, PDF с. 9, печ. с. 14–15","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=9"},{"t":"NT95, 1 Кор 14:29, PDF с. 114","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"},{"t":"AL65, PDF с. 17","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П64","head":"","rst":false,"dendi":"Iri mà iri ŋwaariyo banda daabu.","source":"AL65, PDF и печ. с. 13","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=13","lit":"Давайте прикроем нашу пищу.","parse":"Iri — мы; mà — побудительный показатель; iri — наш, буквально «мы» в определении; ŋwaariyo — пища, еда; banda — компонент сочетания banda daabu «прикрыть»; daabu — закрывать, прикрывать.","note":"Полное заглавие учебного занятия о защите пищи; оно имеет форму побуждения. banda daabu переведено как сочетание. Отдельное пространственное значение banda здесь не установлено и не подменено «спиной». Словоразделы нормализованы без изменения букв и тонов."},{"k":2,"pid":"П66","head":"","rst":false,"dendi":"N mà nufi hantum ka cou.","source":"AL65, PDF и печ. с. 66","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=66","lit":"Запиши результат и прочитай [его].","parse":"N — ты; mà — побудительный показатель; nufi — результат; hantum — писать, записывать; ka — связь действий; cou — читать.","note":"Полная инструкция к арифметическому заданию. Дополнение «его» в русском восстановлено из контекста и заключено в скобки: отдельного местоимения после cou нет."},{"k":3,"pid":"П72","head":"","rst":false,"dendi":"Iri ma guuru cau.","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Давайте будем определять время [по часам].","parse":"Iri — мы; ma — побудительный показатель; guuru — час, время на часах; cau — читать, здесь считывать показание.","note":"Полная вводная инструкция в уроке о времени перед описанием стрелок и циферблата. Буквально «давайте читать час». cau сохранено по CAL и отделено от написания cou в AL65; это сопоставление записей, а не доказанное правило звукового соответствия."},{"k":4,"pid":"П74","head":"","rst":false,"dendi":"N mà alaama wɔ̀ gùna.","source":"AL65, PDF и печ. с. 13","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=13","lit":"Посмотри на это изображение.","parse":"N — ты; mà — побудительный показатель; alaama — изображение; wɔ̀ — этот; gùna — смотреть, посмотри.","note":"Целая инструкция перед изображением приготовления пищи. В отличие от П49, здесь выражены N и mà. В печати màalaama слито: нормализован только пробел между показателем и существительным; буквы и тоны сохранены."},{"k":5,"pid":"П76","head":"","rst":false,"dendi":"N mà nn maayo hantum n tira kuna.","source":"AL65, PDF и печ. с. 43","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=43","lit":"Запиши их названия в своей тетради.","parse":"N — ты; mà — побудительный показатель; nn — они, здесь их; maayo — имена, названия; hantum — записывать; n — ты, здесь твоя; tira — тетрадь, письменная книга; kuna — внутри, в.","note":"Полное второе предложение учебного пункта. В предыдущем предложении названы известные учащемуся коммуны: nn отсылает к ним. В последней строке tirakuna напечатано слитно; пробел нормализован без изменения букв."},{"k":6,"pid":"П93","head":"","rst":true,"dendi":"Za hanu nga di ǹ saawara ngei ma à wi.","source":"NT18, Ин 11:53","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"С этого дня положили убить Его.","lit":"С того дня они решили, чтобы они убили его.","parse":"Za — с, начиная с; hanu — день; nga — указательная отсылка в сочетании nga di; di — определительный элемент; ǹ — они; saawara — совещаться, принять решение в контексте; ngei — они, самостоятельная форма; ma — модально-побудительный показатель зависимого действия; à — он, здесь его; wi — убивать.","note":"Полное предложение после совещания, описанного в Ин 11:47–52. Решение — убить Иисуса — выражено зависимой частью. Saawara не получает отдельного значения «убивать». В отличие от русского параллельного текста, денди явно выражает субъект ngei зависимой части."}],"stray":[],"kind":"extra","meaning":"В П18 — побуждение к совместной учёбе; полная система значений не установлена."},{"n":219,"title":"Показатель побуждения: Wa","letter":"П","variants":[{"label":"I","form":"Wa","notes":["Обращение к нескольким адресатам перед si hamburu. Не заменяет ma во всех конструкциях."],"full":3,"status":"","examples":[{"k":1,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."},{"k":2,"pid":"П58","head":"NT18, 1 Фес 5:20","rst":true,"dendi":"Wa si andebitɛrɛ fɛntɛ.","source":"NT18, 1 Фес 5:20","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Пророчества не уничижайте.","lit":"Не презирайте пророчество.","parse":"Wa — побуждение к адресатам; si — отрицание; andebitɛrɛ — пророчество, пророческое высказывание; fɛntɛ — презирать, пренебрегать.","note":"Целое отрицательное побуждение. andebitɛrɛ — отвлечённое/деятельностное название, не andebi «пророк». Множественное число русского параллельного текста не переносится на форму денди."},{"k":3,"pid":"П61","head":"NT18, 1 Фес 5:25","rst":true,"dendi":"Nya-izei, wa aduwa tɛ i sɛ.","source":"NT18, 1 Фес 5:25","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Братия! молитесь о нас.","lit":"Братья [по общине], совершайте молитву за нас.","parse":"Nya-izei — братья, обращение к членам общины; wa — побуждение к адресатам; aduwa — молитва; tɛ — делать, совершать; i — мы, здесь нас; sɛ — для, в пользу адресата молитвы.","note":"Обращение входит в полное предложение. Сложное Nya-izei сохранено с дефисом и не объявляется точным синонимом cɛɛnɛ во всех родственных отношениях. aduwa tɛ — «молиться»; i sɛ указывает, за кого просят."}],"refs":[{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"}]},{"label":"II","form":"Wo","notes":["Написание Wo в 1 Фес 5:16–17. Функция определяется побудительным контекстом; не смешивать с указательным wo «этот»."],"full":2,"status":"","examples":[{"k":1,"pid":"П56","head":"NT18, 1 Фес 5:16","rst":true,"dendi":"Wo farihã saa kulu.","source":"NT18, 1 Фес 5:16","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Всегда радуйтесь.","lit":"Радуйтесь во всякое время.","parse":"Wo — побуждение к адресатам, написание этого стиха; farihã — радоваться; saa — время; kulu — всё, всякое.","note":"Самостоятельное наставление среди заключительных призывов послания. saa kulu — «во всякое время, всегда». Wo сохранено по источнику, не исправлено в Wa и не смешивается с указательным wo из П43."},{"k":2,"pid":"П57","head":"NT18, 1 Фес 5:17","rst":true,"dendi":"Wo ka aduwa tɛ, cɛyom si.","source":"NT18, 1 Фес 5:17","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Непрестанно молитесь.","lit":"Совершайте молитву, прекращения нет.","parse":"Wo — побуждение к адресатам; ka — связующий элемент при действии; aduwa — молитва; tɛ — делать, совершать; cɛyom — прекращение, перерыв; si — отрицание наличия, здесь «нет».","note":"Полная фраза включает обе части, разделённые запятой. aduwa tɛ буквально «делать молитву», по-русски «молиться». Постпозиционное si в cɛyom si отличается от позиции si перед глаголом; здесь не следует восстанавливать несуществующее слово «непрестанно»."}],"refs":[]}],"extra_refs":[],"linked":[{"k":1,"pid":"П59","head":"","rst":true,"dendi":"Wa hɛ kulu yaase guna, ka ihinnɔ dii ka jɛ.","source":"NT18, 1 Фес 5:21","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Все испытывайте, хорошего держитесь.","lit":"Всё проверьте, а хорошее возьмите и удерживайте.","parse":"Wa — побуждение к адресатам; hɛ — вещь, нечто; kulu — всё; yaase — проверить, испытать в сочетании yaase guna; guna — смотреть, в сочетании «проверить»; ka — связь действий; ihinnɔ — хорошее; dii — взять, ухватить; ka — связь действий; jɛ — держать, сохранять.","note":"Взято всё предложение, а не его часть до запятой. yaase guna рассматривается совместно как «проверить»; отдельные оттенки yaase не объявляются исчерпывающе установленными. dii здесь не di «видеть» и не dii «гореть». ihinnɔ — субстантивированное «хорошее», без подстановки иной записи hinno."},{"k":2,"pid":"П60","head":"","rst":true,"dendi":"Wa fee nda hɛ laalɔ dimi kulu.","source":"NT18, 1 Фес 5:22","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Удерживайтесь от всякого рода зла.","lit":"Отдаляйтесь от всякого вида плохого.","parse":"Wa — побуждение к адресатам; fee — отдаляться, держаться в стороне; nda — связь с тем, от чего отдаляются; hɛ — вещь, нечто; laalɔ — плохой; dimi — вид, род; kulu — всякий, весь.","note":"Контекст наставления задаёт значение fee nda «держаться в стороне от». Нельзя переводить nda одним неизменным русским предлогом. dimi здесь «вид/род», не автоматически dimi «семя»."}],"stray":[],"kind":"extra"},{"n":220,"title":"Показатель повторяемости: cin","letter":"П","variants":[{"label":"","form":"cin","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П82","head":"AL65, PDF и печ. с. 70","rst":false,"dendi":"Jiiri nuusamtɛ cin kàà nɔ̀ jiiri 4 kulu nga à gonda jibiri 366.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Високосный год приходит каждые четыре года, и в нём 366 дней.","parse":"Jiiri — год; nuusamtɛ — високосный; cin — показатель обычного повторяющегося действия в этом контексте; kàà — приходить; nɔ̀ — предикативно-выделительный элемент; jiiri — год; 4 — цифровая запись числа 4; kulu — каждый, весь; nga — связь частей, здесь «и»; à — он, год; gonda — иметь; jibiri — день; 366 — цифровая запись числа 366.","note":"Полное утверждение из календарного урока. Это упрощённая формулировка учебника: исключения календарного правила цитата не описывает. На с. 76 в упражнении встречается перестановка подписей; она не используется для переопределения nuusamtɛ и kubantɛ. nga здесь связывает части, а à занимает позицию субъекта."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Предглагольный элемент при регулярно повторяющемся событии в П82. Здесь дана контекстная функция; общее грамматическое описание требует дополнительных примеров.","related":"П82."},{"n":221,"title":"Показатель при глаголе: ga","letter":"П","variants":[{"label":"","form":"ga","notes":["В Biya ga ka ǹ no. Точная функция отдельно не завершена; не пространственное ga из П41–П42."],"full":1,"status":"","examples":[{"k":1,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П41","head":"","rst":false,"dendi":"Gandà ciineyo ga nda bature cinɛ ga sènnìyom nda mɛɛ ;","source":"AL64, PDF с. 3","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3","lit":"Устное говорение на языках страны и на языке европейца.","parse":"Gandà — страна; местная языковая среда в этом пункте; ciineyo — языки; форма с -yo; ga — на; элемент конструкции сферы/языка; nda — и; далее посредством; bature — европеец; cinɛ — язык; sènnìyom — говорение; контекстная производная форма; mɛɛ — рот; здесь устный способ.","note":"Полный именной пункт списка учебных целей; личного сказуемого в нём нет. Слово bature не подменено без доказательства названием конкретного языка. Морфологическое разложение sènnìyom пока не установлено. Тоны и точка с запятой сохранены."},{"k":2,"pid":"П42","head":"","rst":false,"dendi":"Sooro fo ga, tuurinya 55 ya goono.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","lit":"В одном ряду имеются 55 деревянных элементов.","parse":"Sooro — ряд; fo — один; написание CAL; ga — в; пространственный элемент; tuurinya — деревянный элемент в строительной задаче; 55 — пятьдесят пять; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Печатная с. 41: задача о древесине для строительства. Здесь речь о строительных элементах, поэтому перевод «55 растущих деревьев» не используется. Форма tuurinya совпадает графически с вариантами растительного термина; значение устанавливается контекстом."}],"stray":[],"kind":"extra"},{"n":222,"title":"Показатель при глаголе: go","letter":"П","variants":[{"label":"","form":"go","notes":["Предглагольный показатель."],"full":null,"status":"","examples":[{"k":1,"pid":"П6","head":"NT95, JHN 11:26, PDF с. 68","rst":true,"dendi":"N go cimandi nga di gaa dee?","source":"NT95, JHN 11:26, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"Веришь ли сему?","lit":"Ты считаешь это истинным?","parse":"N — ты; go — предглагольный показатель; cimandi — признавать истинным / верить; nga — то / оно; di — указательный элемент; gaa — послелог объекта отношения; dee — вопросительная частица.","note":"Сочетание nga di gaa передаёт объект веры; послелог не имеет здесь отдельного русского «на»."},{"k":2,"pid":"П11","head":"NT95, JHN 1:38, PDF с. 60","rst":true,"dendi":"Ifɔ wom go ceeci?","source":"NT95, JHN 1:38, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"что вам надобно?","lit":"Что вы ищете?","parse":"Ifɔ — что?; wom — вы; go — предглагольный показатель; ceeci — искать.","note":"Параллельный Синодальный перевод передаёт вопрос иначе; дословный дендийский перевод не подменён им."},{"k":3,"pid":"П22","head":"AL65, PDF с. 29","rst":false,"dendi":"Cìi hɛika n go dia.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Скажи вещи, которые ты видишь.","parse":"Cìi — сказать, здесь побуждение; hɛika — вещи, которые; слитная запись в пособии; n — ты; go — предглагольный показатель; dia — видеть.","note":"Тон Cìi сохранён. Компактная запись hɛika не раздвинута пробелами под видом оригинальной цитаты; пословный разбор поясняет её функцию."},{"k":4,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."},{"k":5,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":6,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."}],"refs":[{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 11:26","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Мк 7:35","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Деян 2:6","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Ин 1:50","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П54","head":"","rst":true,"dendi":"Yesu go baa Marata nda à cɛɛnɛ nda Lazaa.","source":"NT18, Ин 11:5","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус же любил Марфу и сестру ее и Лазаря.","lit":"Иисус любит Марфу, её младшую сестру и Лазаря.","parse":"Yesu — Иисус; go — предглагольный показатель; baa — любить; Marata — Марфа; nda — и; à — она, здесь её; cɛɛnɛ — младшая сестра в этом контексте; nda — и; Lazaa — Лазарь.","note":"Полное повествовательное предложение. В Ин 11:1 и 11:28 сестра Марфы названа Mariyama. Слово cɛɛnɛ не ограничено мужским полом: сравните П32 в статье «Брат». Русское прошедшее время параллельного перевода не является отдельным значением go."},{"k":2,"pid":"П71","head":"","rst":false,"dendi":"Wɔ̀ noo mɛɛ nna noo nunɛ daabu, de noo go tɔkɔɔ au noo go tisã.","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Прикрывайте ваши рот и нос, если [когда] вы кашляете или чихаете.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь «ваши»; mɛɛ — рот; nna — и; noo — форма адресата, здесь «ваш»; nunɛ — нос; daabu — закрывать, прикрывать; de — если, в этом контексте также «когда»; noo — форма адресата, субъект придаточной части; go — предглагольный показатель; tɔkɔɔ — кашлять; au — или; noo — форма адресата, субъект; go — предглагольный показатель; tisã — чихать.","note":"Полная фраза с придаточной частью после запятой. Текст памятки сохраняет повтор noo. В переводе показаны условное и временное прочтения de; из этого примера не выводится тождество de и всех слов «когда»."},{"k":3,"pid":"П81","head":"","rst":false,"dendi":"Cìi gwei ka n go tɛɛ.","source":"AL65, PDF и печ. с. 61","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=61","lit":"Скажи, какую работу ты делаешь.","parse":"Cìi — сказать, скажи; gwei — работа, действие; ka — относительная связь; n — ты; go — предглагольный показатель; tɛɛ — делать.","note":"Полный самостоятельный пункт упражнения. Буквальная структура: «назови работу, которую ты делаешь». Относительное ka не становится вопросительной частицей от русского перевода «какую». Долгое ɛɛ сохранено."},{"k":4,"pid":"П86","head":"","rst":false,"dendi":"Sana keena go guuru cabe no","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Маленькая стрелка показывает часы.","parse":"Sana — стрелка часов; keena — маленький; go — предглагольный показатель; guuru — час, единица времени; cabe — показывать; no — предикативно-выделительный элемент.","note":"Самостоятельная строка описания стрелок, без конечной точки в печати. Это часовая стрелка; слово «часовая» непосредственно не вставлено в цитату. keena не исправлено в cɛna или cɛɛnɛ."},{"k":5,"pid":"П87","head":"","rst":false,"dendi":"Sana beeri go mintiyo cabe","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Большая стрелка показывает минуты.","parse":"Sana — стрелка часов; beeri — большой; go — предглагольный показатель; mintiyo — минуты, форма источника; cabe — показывать.","note":"Полная параллельная строка после П86, без конечной точки. no из предыдущей строки не дописано. mintiyo соотносится с minti на этой же печатной странице; различие формы сохранено."},{"k":6,"pid":"П92","head":"","rst":true,"dendi":"Coobaaba-ize hinka di maa Yohana go sendi ya di. Ǹ na Yesu gana.","source":"NT18, Ин 1:37","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Услышав от него сии слова, оба ученика пошли за Иисусом.","lit":"Те два ученика услышали, как Иоанн говорит так. Они последовали за Иисусом.","parse":"Coobaaba-ize — ученик, сложное слово; hinka — два; di — определительный элемент; maa — слышать; Yohana — Иоанн; go — предглагольный показатель; sendi — говорить; ya — компонент сочетания ya di «так»; di — компонент сочетания ya di; Ǹ — они; na — показатель переходного действия; Yesu — Иисус; gana — следовать за.","note":"Приведены оба предложения стиха. ya di после глагола речи передаёт «так»: его нельзя механически разобрать как выделительное ya из П19. Coobaaba-ize сохранено с дефисом. maa здесь «слышать», не «имя»."}],"stray":[],"kind":"extra","meaning":"В этих местах связан с продолжающейся/актуальной предикацией. Не образует вопрос сам, не добавляется ко всем глаголам и не объявляется универсальным показателем русского настоящего времени."},{"n":223,"title":"Показывать","letter":"П","variants":[{"label":"","form":"cabe","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П86","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Sana keena go guuru cabe no","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Маленькая стрелка показывает часы.","parse":"Sana — стрелка часов; keena — маленький; go — предглагольный показатель; guuru — час, единица времени; cabe — показывать; no — предикативно-выделительный элемент.","note":"Самостоятельная строка описания стрелок, без конечной точки в печати. Это часовая стрелка; слово «часовая» непосредственно не вставлено в цитату. keena не исправлено в cɛna или cɛɛnɛ."},{"k":2,"pid":"П87","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Sana beeri go mintiyo cabe","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Большая стрелка показывает минуты.","parse":"Sana — стрелка часов; beeri — большой; go — предглагольный показатель; mintiyo — минуты, форма источника; cabe — показывать.","note":"Полная параллельная строка после П86, без конечной точки. no из предыдущей строки не дописано. mintiyo соотносится с minti на этой же печатной странице; различие формы сохранено."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Показывать; в описании показаний часовых стрелок.","related":"П86, П87."},{"n":224,"title":"Покупать","letter":"П","variants":[{"label":"","form":"dei","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П84","head":"AL65, PDF и печ. с. 106","rst":false,"dendi":"Ali nà mɔnturu fɔ́ dei F 8500 magazɛ̃ kuna.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али купил одни часы за 8500 франков в магазине.","parse":"Ali — Али, имя персонажа; nà — показатель переходного действия; mɔnturu — часы, прибор; fɔ́ — один; dei — покупать; F — обозначение франка в источнике; 8500 — цифровая запись числа 8500; magazɛ̃ — магазин; kuna — внутри, в.","note":"Полное первое предложение задачи о прибыли. mɔnturu соотносится по значению с agogo в CAL, сохраняя свою запись. Русское «одни часы» не означает множественное число слова денди. F — условное обозначение валюты, не реконструированное слово."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Покупать; переходная конструкция nà … dei в П84.","related":"П84."},{"n":225,"title":"Полный","letter":"П","variants":[{"label":"","form":"tɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 8:23","u":"https://zeno.fm/bible/DDNBIV/LUK/8/"},{"t":"NT18, Рим 3:14","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, Деян 13:52","u":"https://zeno.fm/bible/DDNBIV/ACT/13/"},{"t":"NT18, Ин 16:6","u":"https://zeno.fm/bible/DDNBIV/JHN/16/"},{"t":"NT18, Флп 1:11","u":"https://zeno.fm/bible/DDNBIV/PHP/1/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":182,"meaning":"tɔ — быть полным/наполненным, в конструкции.","sci":"AT, №95. Практическая орфография и контекст требуют сверки."},{"n":226,"title":"Понедельник","letter":"П","variants":[{"label":"","form":"atinni","notes":["Название дня в полном недельном перечне AL65. Тон в этой записи не обозначен."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":227,"title":"Понимать","letter":"П","variants":[{"label":"","form":"faham","notes":["Понимание содержания речи; отрицательная конструкция mana faham."],"full":2,"status":"","examples":[{"k":1,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":2,"pid":"П45","head":"NT95, Мф 13:51, PDF с. 13","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."}],"refs":[{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Мф 13:51, PDF с. 13","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":228,"title":"Послелог / связующий элемент: nda","letter":"П","variants":[{"label":"","form":"nda","notes":["Служебное слово с несколькими функциями."],"full":null,"status":"","examples":[{"k":1,"pid":"П12","head":"NT18, JHN 1:38","rst":true,"dendi":"Coobaaba, mani n goono nda gɔrɛ?","source":"NT18, JHN 1:38","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Равви́ (что значит: «учитель»), где живешь?","lit":"Учитель, где ты проживаешь?","parse":"Coobaaba — учитель; mani — где?; n — ты; goono — пребывать; nda — элемент глагольного сочетания; gɔrɛ — проживать.","note":"Goоno nda gɔrɛ разбирается как сочетание; nda не переводится механически русским «с». Синодальное «Равви» входит в опубликованный параллельный текст."},{"k":2,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":3,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":4,"pid":"П17","head":"AL64, PDF с. 20","rst":false,"dendi":"Mɛtɛ noo nà à dendeni nda?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","lit":"Каким способом [адресат вопроса] изучил это?","parse":"Mɛtɛ — как?; noo — форма адресата; лицо и число не установлены; nà — показатель переходного действия; à — это, дополнение; dendeni — изучать; nda — элемент конструкции способа.","note":"Тон nà сохранён по источнику. Классификация конечного nda предварительная; это ограничение относится и к статье nda. Перевод не выдаётся за полностью завершённый разбор."},{"k":5,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":6,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":7,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":8,"pid":"П34","head":"NT95, Еф 4:5, PDF с. 127","rst":true,"dendi":"Kpe fɔlɔnku ya goono nda naane fɔlɔnku nda mirandiyom fɔlɔnku.","source":"NT95, Еф 4:5, PDF с. 127","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127","pub":"один Господь, одна вера, одно крещение,","lit":"Есть один Господь, одна вера и одно крещение.","parse":"Kpe — Господь; fɔlɔnku — один; единственный в данном перечислении; ya — выделительный элемент; goono — быть в наличии; nda — и; связь перечисления; naane — вера; mirandiyom — крещение; производная форма в религиозном контексте.","note":"Naane здесь существительное, как показывают параллельные именные группы. Mirandiyom не переведено как обычное мытьё. Fɔlɔnku не заменено редактором на fɔ."},{"k":9,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."},{"k":10,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":11,"pid":"П41","head":"AL64, PDF с. 3","rst":false,"dendi":"Gandà ciineyo ga nda bature cinɛ ga sènnìyom nda mɛɛ ;","source":"AL64, PDF с. 3","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3","lit":"Устное говорение на языках страны и на языке европейца.","parse":"Gandà — страна; местная языковая среда в этом пункте; ciineyo — языки; форма с -yo; ga — на; элемент конструкции сферы/языка; nda — и; далее посредством; bature — европеец; cinɛ — язык; sènnìyom — говорение; контекстная производная форма; mɛɛ — рот; здесь устный способ.","note":"Полный именной пункт списка учебных целей; личного сказуемого в нём нет. Слово bature не подменено без доказательства названием конкретного языка. Морфологическое разложение sènnìyom пока не установлено. Тоны и точка с запятой сохранены."},{"k":12,"pid":"П52","head":"AL65, PDF и печ. с. 32","rst":false,"lead":["В арифметическом задании П52 сочетание zǎ 20 nda 20 задаёт шаг счёта: по двадцать."],"dendi":"Kabu zǎ 20 nda 20, zǎ 20 ka kwei 100.","source":"AL65, PDF и печ. с. 32.","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=32","lit":"Считай по 20, начиная с 20 и продвигаясь до 100.","parse":"Kabu — считай; zǎ — от, начиная с; в первом сочетании zǎ 20 nda 20 участвует в указании шага; 20 — число 20 (три употребления); nda — связующий элемент в конструкции шага 20 nda 20; повторное zǎ — начало диапазона; ka — связь с kwei; kwei — идти, продвигаться, здесь до указанного предела; 100 — число 100.","note":"Полное задание на счёт с постоянным шагом. Сочетание zǎ 20 nda 20 в этом арифметическом контексте означает счёт двадцатками; это не сложение 20 + 20. Ожидаемый ряд: 20, 40, 60, 80, 100. Функция nda устанавливается для этой конструкции и не подменяется механически переводом «и» или «с»."}],"refs":[{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"},{"t":"NT18, Деян 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT18, Деян 2:4","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Деян 22:2","u":"https://zeno.fm/bible/DDNBIV/ACT/22/"},{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Мф 17:3","u":"https://zeno.fm/bible/DDNBIV/MAT/17/"},{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"},{"t":"NT95, Еф 4:5, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"},{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П45","head":"","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."},{"k":2,"pid":"П48","head":"","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."},{"k":3,"pid":"П60","head":"","rst":true,"dendi":"Wa fee nda hɛ laalɔ dimi kulu.","source":"NT18, 1 Фес 5:22","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Удерживайтесь от всякого рода зла.","lit":"Отдаляйтесь от всякого вида плохого.","parse":"Wa — побуждение к адресатам; fee — отдаляться, держаться в стороне; nda — связь с тем, от чего отдаляются; hɛ — вещь, нечто; laalɔ — плохой; dimi — вид, род; kulu — всякий, весь.","note":"Контекст наставления задаёт значение fee nda «держаться в стороне от». Нельзя переводить nda одним неизменным русским предлогом. dimi здесь «вид/род», не автоматически dimi «семя»."}],"stray":[],"kind":"extra","meaning":"Может связывать участники («и / с»), обозначать средство, язык или участие в глагольной конструкции. Перевод определяется сочетанием, а не единым русским эквивалентом."},{"n":229,"title":"Послелог адресата: sɛ","letter":"П","variants":[{"label":"","form":"sɛ","notes":["Стоит после обозначения адресата: wom sɛ, à sɛ, ǹ sɛ, ngei sɛ. В П27 также обозначает тех, кому явились. Русское «кому» передаёт отношение, а не отдельное лексическое слово."],"full":null,"status":"","examples":[{"k":1,"pid":"П23","head":"NT95, Мф 24:25, PDF с. 20","rst":true,"dendi":"Guna, a jina ka cii wom sɛ kɔ.","source":"NT95, Мф 24:25, PDF с. 20","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20","pub":"Вот, Я наперед сказал вам.","lit":"Посмотри, я уже заранее сказал вам.","parse":"Guna — посмотри; a — я; jina — предшествовать; здесь заранее; ka — связующий элемент; cii — сказать; wom — вы; sɛ — адресат: кому; kɔ — уже.","note":"Jina ka cii передаёт предварительное предупреждение; jina здесь не переводится как отдельное физическое движение."},{"k":2,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."},{"k":3,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."},{"k":4,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."},{"k":5,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":6,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":7,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":8,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, Мф 24:25, PDF с. 20","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20"},{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"},{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"},{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П13","head":"","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":2,"pid":"П45","head":"","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."},{"k":3,"pid":"П61","head":"","rst":true,"dendi":"Nya-izei, wa aduwa tɛ i sɛ.","source":"NT18, 1 Фес 5:25","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Братия! молитесь о нас.","lit":"Братья [по общине], совершайте молитву за нас.","parse":"Nya-izei — братья, обращение к членам общины; wa — побуждение к адресатам; aduwa — молитва; tɛ — делать, совершать; i — мы, здесь нас; sɛ — для, в пользу адресата молитвы.","note":"Обращение входит в полное предложение. Сложное Nya-izei сохранено с дефисом и не объявляется точным синонимом cɛɛnɛ во всех родственных отношениях. aduwa tɛ — «молиться»; i sɛ указывает, за кого просят."},{"k":4,"pid":"П88","head":"","rst":true,"dendi":"Yesu cii à sɛ: «N harume di kaa tunu kpɛɛnɛ.»","source":"NT18, Ин 11:23","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус говорит ей: воскреснет брат твой.","lit":"Иисус сказал ей: «Твой брат снова встанет [воскреснет]».","parse":"Yesu — Иисус; cii — сказать; à — она, Марфа; sɛ — послелог адресата; N — ты, здесь твой; harume — брат; di — определительный элемент; kaa — показатель предстоящего действия в этом контексте; tunu — встать, здесь воскреснуть; kpɛɛnɛ — ещё, снова.","note":"Сохранены вводная часть и целая реплика. Речь о Лазаре, брате Марфы; отсюда контекстное «воскреснуть». kaa перед tunu не переводится вторым глаголом «приходить». harume добавлено к статье «Брат», без утверждения о полном тождестве cɛɛnɛ."}],"stray":[],"kind":"extra"},{"n":230,"title":"Послелог: dɔ","letter":"П","variants":[{"label":"","form":"dɔ","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П91","head":"NT18, Ин 1:11","rst":true,"dendi":"À kaa nga ŋmɔne yom dɔ amma ǹ mana à ta.","source":"NT18, Ин 1:11","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Пришел к своим, и свои Его не приняли.","lit":"Он пришёл к своим, но они его не приняли.","parse":"À — он; kaa — приходить; nga — он, здесь притяжательная отсылка; ŋmɔne — собственный, свой; yom — показатель множественности; dɔ — к, в сфере указанного лица или группы; amma — но; ǹ — они; mana — отрицание; à — он, здесь его; ta — принимать.","note":"Полное предложение. nga ŋmɔne yom — «свои» как группа людей; слово «люди» отдельно не выражено. kaa здесь глагол прихода, в отличие от предглагольного употребления в П88. dɔ разбирается как послелог этой конструкции."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"В П91 после названия группы обозначает направление «к своим». Другие пространственные и абстрактные употребления требуют своих примеров.","related":"П91."},{"n":231,"title":"Послелог: gaa","letter":"П","variants":[{"label":"","form":"gaa","notes":["Послелог."],"full":3,"status":"","examples":[{"k":1,"pid":"П6","head":"NT95, JHN 11:26, PDF с. 68","rst":true,"dendi":"N go cimandi nga di gaa dee?","source":"NT95, JHN 11:26, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"Веришь ли сему?","lit":"Ты считаешь это истинным?","parse":"N — ты; go — предглагольный показатель; cimandi — признавать истинным / верить; nga — то / оно; di — указательный элемент; gaa — послелог объекта отношения; dee — вопросительная частица.","note":"Сочетание nga di gaa передаёт объект веры; послелог не имеет здесь отдельного русского «на»."},{"k":2,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."},{"k":3,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."}],"refs":[{"t":"NT18, Ин 7:5","u":"https://zeno.fm/bible/DDNBIV/JHN/7/"},{"t":"NT18, Ин 11:26","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Ин 5:47","u":"https://zeno.fm/bible/DDNBIV/JHN/5/"},{"t":"NT18, Ин 10:38","u":"https://zeno.fm/bible/DDNBIV/JHN/10/"},{"t":"NT18, Деян 2:3","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Следует за своим дополнением. В контекстах веры обозначает объект отношения («в / этому»), в других — пространственное или иное отношение. Не заменять все gaa русским «на»."},{"n":232,"title":"Посылать","letter":"П","variants":[{"label":"","form":"dɔntɔm","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П89","head":"NT18, Ин 1:6","rst":true,"dendi":"Ikpɛ na bɔrɔ fɔ dɔntɔm, à maa no Yohana.","source":"NT18, Ин 1:6","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Был человек, посланный от Бога; имя ему Иоанн.","lit":"Бог послал одного человека, его имя — Иоанн.","parse":"Ikpɛ — Бог; na — показатель переходного действия; bɔrɔ — человек; fɔ — один, некий; dɔntɔm — посылать; à — он, здесь его; maa — имя; no — связочный элемент; Yohana — Иоанн.","note":"Полное предложение, включая часть об имени. maa здесь «имя», не «слышать». Активная конструкция денди сохранена в авторском переводе, несмотря на страдательный оборот русского параллельного текста."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Посылать, отправлять человека; переходная конструкция в П89.","related":"П89."},{"n":233,"title":"Потому что","letter":"П","variants":[{"label":"I","form":"zama","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 27","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=27"},{"t":"NT18, Мф 28:5","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"}]},{"label":"II","form":"domi","notes":["Причинное «потому что» в санитарном тексте."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 11","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=11"},{"t":"AL64, PDF с. 6","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=6"},{"t":"CFA, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=5"},{"t":"AL65, PDF с. 109","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=109"},{"t":"AL64, PDF с. 10","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=10"},{"t":"AL65, PDF с. 15","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=15"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":206},{"n":234,"title":"Правильный; верный","letter":"П","variants":[{"label":"","form":"cimi","notes":["Истинное утверждение в упражнении."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 10:29","u":"https://zeno.fm/bible/DDNBIV/MAT/10/"},{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"},{"t":"CFA, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=5"},{"t":"AL65, PDF с. 99","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=99"},{"t":"AL65, PDF с. 47","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=47"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":196,"meaning":"cimi — правда/истина, а не универсальное прилагательное «правильный»."},{"n":235,"title":"Правый (сторона)","letter":"П","variants":[{"label":"","form":"kambɛŋmaa","notes":["Сложная форма с kambɛ «рука»."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 21","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=21"},{"t":"NT18, Мф 25:33","u":"https://zeno.fm/bible/DDNBIV/MAT/25/"},{"t":"NT18, Откр 5:7","u":"https://zeno.fm/bible/DDNBIV/REV/5/"},{"t":"NT18, Лк 22:50","u":"https://zeno.fm/bible/DDNBIV/LUK/22/"},{"t":"NT18, 2 Кор 6:7","u":"https://zeno.fm/bible/DDNBIV/2CO/6/"},{"t":"NT18, Деян 5:31","u":"https://zeno.fm/bible/DDNBIV/ACT/5/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":199,"meaning":"kambɛŋmaa — правая сторона; проверено противопоставление с kambɛwo."},{"n":236,"title":"Представление перечня: barà nɔ̀","letter":"П","variants":[{"label":"","form":"barà nɔ̀","notes":["Связочное сочетание: в П48 вводит перечень («таковы / вот»), в П63 и П69 — определение («это / является»). Варианты bara nɔ̀ и barà nɔ̀ сохранены по страницам. Самостоятельные функции компонентов вне этих конструкций не выводятся по одному примеру."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П63","head":"","rst":false,"dendi":"Iyaali fɔ́ bara nɔ̀ baabɛ, nyaa nda koo au kooyo.","source":"AL65, PDF и печ. с. 56","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56","lit":"Одна семья — это отец, мать и ребёнок или дети.","parse":"Iyaali — семья; fɔ́ — один, одна; bara — компонент связочной конструкции bara nɔ̀; nɔ̀ — компонент той же связочной конструкции; baabɛ — отец; nyaa — мать; nda — и; koo — ребёнок; au — или; kooyo — дети, форма источника.","note":"Полное определение из урока о семье; это учебное описание конкретного состава семьи, не универсальное этнографическое определение. Нетонированное bara сохранено. kooyo передано как форма множественного числа в этом контексте без самостоятельного обобщения правил суффиксации."},{"k":2,"pid":"П69","head":"","rst":false,"dendi":"Sigiri barà nɔ̀ hanuyo beiyom azansi.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Календарь — средство узнавания дней.","parse":"Sigiri — календарь; barà — компонент связочной конструкции barà nɔ̀; nɔ̀ — компонент той же связочной конструкции; hanuyo — дни; beiyom — знание, узнавание; производное от bei; azansi — средство, способ.","note":"Полное определение из календарного урока. barà nɔ̀ здесь связывает тему с определением, а не вводит список, как в П48. beiyom — именное производное, не голая глагольная форма bei."}],"stray":[],"kind":"extra"},{"n":237,"title":"Предстоящее действие: kaa","letter":"П","variants":[{"label":"","form":"kaa","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П88","head":"NT18, Ин 11:23","rst":true,"dendi":"Yesu cii à sɛ: «N harume di kaa tunu kpɛɛnɛ.»","source":"NT18, Ин 11:23","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус говорит ей: воскреснет брат твой.","lit":"Иисус сказал ей: «Твой брат снова встанет [воскреснет]».","parse":"Yesu — Иисус; cii — сказать; à — она, Марфа; sɛ — послелог адресата; N — ты, здесь твой; harume — брат; di — определительный элемент; kaa — показатель предстоящего действия в этом контексте; tunu — встать, здесь воскреснуть; kpɛɛnɛ — ещё, снова.","note":"Сохранены вводная часть и целая реплика. Речь о Лазаре, брате Марфы; отсюда контекстное «воскреснуть». kaa перед tunu не переводится вторым глаголом «приходить». harume добавлено к статье «Брат», без утверждения о полном тождестве cɛɛnɛ."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Предглагольное употребление в kaa tunu «встанет / воскреснет» в П88. Функция не переносится на всякое kaa; самостоятельный глагол «приходить» показан в П91.","rel
