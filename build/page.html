 в русском переводе следует анатомическому перечислению; оно не приписывается единому суффиксу у всех дендийских слов. Здесь mɔɔize названо в ряду органов головы; специальное различие «глаз / зрачок» этим предложением отдельно не устанавливается."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"AL65, PDF с. 93","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=93"},{"t":"COV, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=3"},{"t":"AL65, PDF с. 77","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=77"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":76,"sci":"H, §E №99, с. 37. Практическая орфография и контекст требуют сверки."},{"n":224,"title":"Рука","letter":"Р","variants":[{"label":"I","form":"kambɛ","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":2,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."}],"refs":[{"t":"NT95, PDF с. 22","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=22"},{"t":"NT18, Мф 3:12","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"AL65, PDF с. 102","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=102"},{"t":"AL65, PDF с. 87","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=87"},{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"}]},{"label":"II","form":"kammɛ̀","notes":["Тоновая запись «рука», отличается от kambɛ NT/AL65."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"}]},{"label":"III","form":"kàmmɛ̀","notes":["Печатная с. 8; рука в выражении о продажах. Тоновая запись и удвоенное m, отличающиеся от kambɛ."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"CFA, PDF с. 8","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=8"}]},{"label":"IV","form":"kammɛ","notes":["Рука, запись без тонового знака в этом предложении."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=3"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":83,"sci":"H, §E №102, с. 37. Практическая орфография и контекст требуют сверки."},{"n":225,"title":"Рыба","letter":"Р","variants":[{"label":"","form":"ciifi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мф 12:40","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"},{"t":"NT18, Лк 24:42","u":"https://zeno.fm/bible/DDNBIV/LUK/24/"},{"t":"NT18, Ин 21:13","u":"https://zeno.fm/bible/DDNBIV/JHN/21/"},{"t":"NT18, Мк 8:7","u":"https://zeno.fm/bible/DDNBIV/MRK/8/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":45,"sci":"H, §E №82, с. 36. Практическая орфография и контекст требуют сверки."},{"n":226,"title":"Ряд","letter":"Р","variants":[{"label":"","form":"Sooro","notes":["Ряд строительных деревянных элементов; иные значения не установлены."],"full":1,"status":"","examples":[{"k":1,"pid":"П42","head":"CAL, PDF с. 22","rst":false,"dendi":"Sooro fo ga, tuurinya 55 ya goono.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном ряду имеются 55 деревянных элементов.","parse":"Sooro — ряд; fo — один; написание CAL; ga — в; пространственный элемент; tuurinya — деревянный элемент в строительной задаче; 55 — пятьдесят пять; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Печатная с. 41: задача о древесине для строительства. Здесь речь о строительных элементах, поэтому перевод «55 растущих деревьев» не используется. Форма tuurinya совпадает графически с вариантами растительного термина; значение устанавливается контекстом."}],"refs":[{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":227,"title":"С","letter":"С","variants":[{"label":"","form":"nda","notes":["Также союз «и»."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 128","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=128"},{"t":"NT18, Мф 3:11","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=100"},{"t":"AL65, PDF с. 102","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=102"},{"t":"NT18, Мк 1:36","u":"https://zeno.fm/bible/DDNBIV/MRK/1/"},{"t":"NT18, Ин 14:25","u":"https://zeno.fm/bible/DDNBIV/JHN/14/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":203,"meaning":"nda — с/посредством, зависит от конструкции."},{"n":228,"title":"Связка и выделение: no / nɔ","letter":"С","variants":[{"label":"I","form":"no","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке."],"full":null,"status":"","examples":[{"k":1,"pid":"П4","head":"NT18, 2CO 11:22","rst":true,"dendi":"Eburu yom no ba?","source":"NT18, 2CO 11:22","source_url":"https://zeno.fm/bible/DDNBIV/2CO/11/","pub":"Они Евреи?","lit":"[Они] евреи?","parse":"Eburu — еврей; yom — показатель множественности; no — предикативный элемент; ba — вопросительная частица.","note":"Отдельного подлежащего «они» в этой фразе нет; оно восстановлено в русском переводе по контексту."},{"k":2,"pid":"П14","head":"NT18, JHN 1:21","rst":true,"dendi":"Ni no Eli?","source":"NT18, JHN 1:21","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"ты Илия?","lit":"Ты — Илия?","parse":"Ni — ты, самостоятельная форма; no — предикативный элемент; Eli — Илия.","note":"Вопрос без ba и dee: по письменному тексту нельзя установить точную вопросительную интонацию."},{"k":3,"pid":"П21","head":"NT95, JHN 21:12, PDF с. 75","rst":true,"dendi":"Ni no mee?","source":"NT95, JHN 21:12, PDF с. 75","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=75","pub":"кто Ты?","lit":"Ты — кто?","parse":"Ni — ты; no — предикативный элемент; mee — кто?.","note":"Полный вопрос, который ученики не решаются задать; это не вопрос на да/нет."},{"k":4,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."},{"k":5,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."}],"refs":[{"t":"NT18, 2 Кор 11:22","u":"https://zeno.fm/bible/DDNBIV/2CO/11/"},{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"}]},{"label":"II","form":"nɔ","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке."],"full":1,"status":"","examples":[{"k":1,"pid":"П16","head":"AL64, PDF с. 20","rst":false,"dendi":"Ifɔ nɔ noo dendeni?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Что именно [адресат вопроса] изучил?","parse":"Ifɔ — что?; nɔ — выделительный/предикативный элемент; noo — форма адресата в пособии; лицо и число отдельно не установлены; dendeni — изучать / учиться.","note":"Дословная глосса намеренно содержит квадратные скобки: лицо и число адресата не подтверждены отдельным описанием местоименной системы. Это полный пример с незавершённой грамматической интерпретацией, а не образец для самостоятельного составления фраз."}],"refs":[{"t":"NT18, 2 Кор 11:22","u":"https://zeno.fm/bible/DDNBIV/2CO/11/"},{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"}]}],"extra_refs":[{"t":"NT18, Ин 1:21","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 16:31","u":"https://zeno.fm/bible/DDNBIV/JHN/16/"},{"t":"NT18, Деян 22:27","u":"https://zeno.fm/bible/DDNBIV/ACT/22/"}],"stray":[],"kind":"extra","meaning":"Функции устанавливаются по конструкции; no/nɔ не объявляются взаимозаменяемыми написаниями или переводом «ли»."},{"n":229,"title":"Связующий элемент: ka / Ka","letter":"С","variants":[{"label":"I","form":"ka","notes":[],"full":null,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."},{"k":2,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":3,"pid":"П23","head":"NT95, Мф 24:25, PDF с. 20","rst":true,"dendi":"Guna, a jina ka cii wom sɛ kɔ.","source":"NT95, Мф 24:25, PDF с. 20","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20","pub":"Вот, Я наперед сказал вам.","lit":"Посмотри, я уже заранее сказал вам.","parse":"Guna — посмотри; a — я; jina — предшествовать; здесь заранее; ka — связующий элемент; cii — сказать; wom — вы; sɛ — адресат: кому; kɔ — уже.","note":"Jina ka cii передаёт предварительное предупреждение; jina здесь не переводится как отдельное физическое движение."},{"k":4,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."},{"k":5,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":6,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":7,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":8,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."},{"k":9,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."}],"refs":[{"t":"NT95, JHN 1:46, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"},{"t":"NT18, ACT 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT95, Мф 24:25, PDF с. 20","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20"},{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"},{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]},{"label":"II","form":"Ka","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."},{"k":2,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."}],"refs":[{"t":"NT95, JHN 1:46, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"},{"t":"NT18, ACT 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"В П9 связывает зависимый глагол; в П13 вводит обстоятельственную часть. Разные функции выделены отдельно."},{"n":230,"title":"Связующий элемент: ko","letter":"С","variants":[{"label":"","form":"ko","notes":["Вводит следующее действие. Точная аспектуальная/синтаксическая классификация здесь не установлена; перевод связи действий контекстный."],"full":2,"status":"","examples":[{"k":1,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":2,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":231,"title":"Связывать","letter":"С","variants":[{"label":"","form":"hɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 23","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=23"},{"t":"NT18, Ин 13:5","u":"https://zeno.fm/bible/DDNBIV/JHN/13/"},{"t":"NT18, Евр 11:36","u":"https://zeno.fm/bible/DDNBIV/HEB/11/"},{"t":"NT18, Мф 27:2","u":"https://zeno.fm/bible/DDNBIV/MAT/27/"},{"t":"NT18, Мк 5:3","u":"https://zeno.fm/bible/DDNBIV/MRK/5/"},{"t":"NT18, Рим 7:2","u":"https://zeno.fm/bible/DDNBIV/ROM/7/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":137,"sci":"H, §E №199, с. 43. Практическая орфография и контекст требуют сверки."},{"n":232,"title":"Святой Дух","letter":"С","variants":[{"label":"","form":"Biya Halaala","notes":["Полное составное именование; не выводится автоматически общее прилагательное «святой» для любой сочетаемости."],"full":1,"status":"","examples":[{"k":1,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":233,"title":"Семя","letter":"С","variants":[{"label":"I","form":"dimiize","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 27","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=27"}]},{"label":"II","form":"dimi-ize","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 13:4","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, Лк 8:11","u":"https://zeno.fm/bible/DDNBIV/LUK/8/"},{"t":"NT18, 1 Кор 15:38","u":"https://zeno.fm/bible/DDNBIV/1CO/15/"}]},{"label":"III","form":"dimi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 13:31","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":55,"meaning":"dimi — зерно/семя; dimi-ize — семя, в том числе в притче о сеятеле."},{"n":234,"title":"Сердце","letter":"С","variants":[{"label":"","form":"bine","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мф 15:19","u":"https://zeno.fm/bible/DDNBIV/MAT/15/"},{"t":"NT18, 2 Кор 6:12","u":"https://zeno.fm/bible/DDNBIV/2CO/6/"},{"t":"NT18, Лк 12:34","u":"https://zeno.fm/bible/DDNBIV/LUK/12/"},{"t":"NT18, Рим 9:2","u":"https://zeno.fm/bible/DDNBIV/ROM/9/"},{"t":"NT18, Деян 7:54","u":"https://zeno.fm/bible/DDNBIV/ACT/7/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":90,"sci":"H, §E №107, с. 37. Практическая орфография и контекст требуют сверки."},{"n":235,"title":"Сжимать","letter":"С","variants":[{"label":"","form":"kankam","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 6:38","u":"https://zeno.fm/bible/DDNBIV/LUK/6/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":130,"meaning":"kankam — утрамбовать/сжать, в описании меры."},{"n":236,"title":"Сидеть","letter":"С","variants":[{"label":"","form":"gɔrɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 28:2","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"},{"t":"AL65, PDF с. 87","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=87"},{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"AL65, PDF с. 47","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=47"},{"t":"NT18, Еф 3:17","u":"https://zeno.fm/bible/DDNBIV/EPH/3/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":124,"sci":"H, §E №191, с. 43. Практическая орфография и контекст требуют сверки."},{"n":237,"title":"Слышать","letter":"С","variants":[{"label":"","form":"maa","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Ин 3:8","u":"https://zeno.fm/bible/DDNBIV/JHN/3/"},{"t":"NT18, Откр 13:9","u":"https://zeno.fm/bible/DDNBIV/REV/13/"},{"t":"NT18, Мф 22:33","u":"https://zeno.fm/bible/DDNBIV/MAT/22/"},{"t":"NT18, Мк 4:18","u":"https://zeno.fm/bible/DDNBIV/MRK/4/"},{"t":"NT18, Лк 4:28","u":"https://zeno.fm/bible/DDNBIV/LUK/4/"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":102,"sci":"AT, №58. Практическая орфография и контекст требуют сверки."},{"n":238,"title":"Смеяться","letter":"С","variants":[{"label":"","form":"haaru","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 6:21","u":"https://zeno.fm/bible/DDNBIV/LUK/6/"},{"t":"NT18, Мф 9:24","u":"https://zeno.fm/bible/DDNBIV/MAT/9/"},{"t":"NT18, Деян 17:32","u":"https://zeno.fm/bible/DDNBIV/ACT/17/"},{"t":"NT18, Мк 15:20","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"},{"t":"NT18, Лк 23:11","u":"https://zeno.fm/bible/DDNBIV/LUK/23/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":100},{"n":239,"title":"Смотреть; посмотри","letter":"С","variants":[{"label":"I","form":"Guna","notes":["Побудительная форма «посмотри»; выделение самостоятельной основы и тоновой парадигмы не выполнено."],"full":1,"status":"","examples":[{"k":1,"pid":"П23","head":"NT95, Мф 24:25, PDF с. 20","rst":true,"dendi":"Guna, a jina ka cii wom sɛ kɔ.","source":"NT95, Мф 24:25, PDF с. 20","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20","pub":"Вот, Я наперед сказал вам.","lit":"Посмотри, я уже заранее сказал вам.","parse":"Guna — посмотри; a — я; jina — предшествовать; здесь заранее; ka — связующий элемент; cii — сказать; wom — вы; sɛ — адресат: кому; kɔ — уже.","note":"Jina ka cii передаёт предварительное предупреждение; jina здесь не переводится как отдельное физическое движение."}],"refs":[{"t":"NT95, Мф 24:25, PDF с. 20","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20"}]},{"label":"II","form":"gùna","notes":["Побудительное употребление после объекта; тон сохранён по AL65. Сопоставляйте с Guna в П23, не исправляя написание источника."],"full":1,"status":"","examples":[{"k":1,"pid":"П49","head":"AL65, PDF с. 70","rst":false,"dendi":"Alaama wɔ̀ gùna.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Посмотри на это изображение.","parse":"Alaama — изображение; иллюстрация в учебнике; wɔ̀ — этот; gùna — посмотри; побудительное употребление.","note":"Буквальная именная группа — «это изображение». Полная инструкция перед заданием о календаре. Порядок: объект перед глаголом. Тоны wɔ̀ и gùna сохранены именно по этой странице; они не переносятся автоматически на нетонированное Guna в NT95."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":240,"title":"Снег","letter":"С","variants":[{"label":"","form":"nɛzi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 28:3","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":164,"meaning":"nɛzi — снег в сравнении с белой одеждой."},{"n":241,"title":"Снова (в сочетании ye ka)","letter":"С","variants":[{"label":"","form":"ye ka","notes":["Повторность события в ye ka maa jo. Самостоятельные значения ye за пределами сочетания здесь не обобщены."],"full":1,"status":"","examples":[{"k":1,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":242,"title":"Собака","letter":"С","variants":[{"label":"","form":"hansi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 8","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=8"},{"t":"NT18, Мк 7:27","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Мф 15:27","u":"https://zeno.fm/bible/DDNBIV/MAT/15/"},{"t":"NT18, Откр 22:15","u":"https://zeno.fm/bible/DDNBIV/REV/22/"},{"t":"NT18, 2 Пет 2:22","u":"https://zeno.fm/bible/DDNBIV/2PE/2/"},{"t":"NT18, Лк 16:21","u":"https://zeno.fm/bible/DDNBIV/LUK/16/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":47,"sci":"H, §E №65, с. 35. Практическая орфография и контекст требуют сверки."},{"n":243,"title":"Собственный","letter":"С","variants":[{"label":"","form":"ŋmɔne","notes":["Значение ограничено a ŋmɔne Ikpɛ; не универсальный эквивалент «сам»."],"full":1,"status":"","examples":[{"k":1,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."}],"refs":[{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":244,"title":"Совершенно (в сочетании о молчании)","letter":"С","variants":[{"label":"","form":"sakai","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."}],"refs":[{"t":"NT18, ACT 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Перевод подтверждён только сочетанием в П13; универсальный русский эквивалент не установлен."},{"n":245,"title":"Солнце","letter":"С","variants":[{"label":"","form":"weenu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 27","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=27"},{"t":"NT18, Мф 13:6","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"A 250,"title":"Среда","letter":"С","variants":[{"label":"","form":"alaruba","notes":["Название дня в полном недельном перечне AL65. Тон в этой записи не обозначен."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":251,"title":"Старый","letter":"С","variants":[{"label":"I","form":"zeenɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"},{"t":"NT18, Мф 9:16","u":"https://zeno.fm/bible/DDNBIV/MAT/9/"},{"t":"AL64, PDF с. 18","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=18"},{"t":"AL65, PDF с. 33","u":"http ота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":256,"title":"Сухой","letter":"С","variants":[{"label":"I","form":"kɔgɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 57","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=57"}]},{"label":"II","form":"kɔɔgɔ","notes":["О сухом кашле; сочетание, не характеристика предмета."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 28:3","u":"https://zeno.fm/bible/DDNBIV/ACT/28/"},{"t":"AL65, PDF с. 98","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=98"}]},{"label":"III","form":"kɔɔgu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 21:19","u":"https://zeno.fm/bible/DDNBIV/MAT/21/"},{"t":"NT18, Лк 8:6","u":"https://zeno.fm/bible/DDNBIV/LUK/8/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":195,"meaning":"kɔɔgɔ — сухой; kɔɔgu — высохнуть. Варианты NT95 сохранены отдельн не добавлено в дословный перевод отсутствующей здесь второй фразы."}],"refs":[{"t":"NT95, 1 Кор 14:29, PDF с. 114","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":259,"title":"Там","letter":"Т","variants":[{"label":"","form":"noodi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 19:29","u":"https://zeno.fm/bible/DDNBIV/JHN/19/"},{"t":"NT18, Мф 19:15","u":"https://zeno.fm/bible/DDNBIV/MAT/19/"},{"t":"NT18, Лк 2:6","u":"https://zeno.fm/bible/DDNBIV/LUK/2/"},{"t":"NT18, 2 Кор 3:17","u":"https://zeno.fm/bible/DDNBIV/2CO/3/"},{"t":"NT18, Откр 21:25","u":"https://zeno.fm/bible/DDNBIV/REV/21/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":10},{"n":260,"title":"Тело","letter":"Т","variants":[{"label":"I","form":"gàà","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]},{"label":"II","form":"gaaham","notes":["Именное название тела в AL65. Отличается написанием от gàà в П15; точное отношение вариантов не реконструировано."],"full":1,"status":"","examples":[{"k":1,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."}],"refs":[{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Именное употребление в сочетании bɔrɔ gàà; не послелог gaa. Тоны сохранены по AL65."},{"n":261,"title":"Тёплый; горячий","letter":"Т","variants":[{"label":"","form":"dungu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 13:6","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, Откр 3:15","u":"https://zeno.fm/bible/DDNBIV/REV/3/"},{"t":"NT18, Откр 3:16","u":"https://zeno.fm/bible/DDNBIV/REV/3/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":180,"meaning":"dungu — горячий/нагретый; форма в NT18 также глагольная.","sci":"H, §E №138, с. 39. Практическая орфография и контекст требуют сверки."},{"n":262,"title":"Тереть","letter":"Т","variants":[{"label":"","form":"wɔɔrɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 6:1","u":"https://zeno.fm/bible/DDNBIV/LUK/6/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":131,"meaning":"wɔɔrɔ — тереть зерно руками."},{"n":263,"title":"Терпение","letter":"Т","variants":[{"label":"","form":"suuru","notes":["Качество, возникающее через испытание веры; иные оттенки отдельно не доказаны."],"full":1,"status":"","examples":[{"k":1,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."}],"refs":[{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":264,"title":"Течь","letter":"Т","variants":[{"label":"I","form":"dooru","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 13:5","u":"https://zeno.fm/bible/DDNBIV/JHN/13/"},{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL65, PDF с. 44","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=44"},{"t":"NT18, Мк 5:25","u":"https://zeno.fm/bible/DDNBIV/MRK/5/"}]},{"label":"II","form":"dòoru","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 11","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=11"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":144,"meaning":"dooru в учебных примерах встречается переходно: лить/доливать."},{"n":265,"title":"Тогда","letter":"Т","variants":[{"label":"","form":"Cɔfɔ, cɔfɔ","notes":["Связь событий; тон отсутствует в этих записях."],"full":3,"status":"","examples":[{"k":1,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":2,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":3,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":266,"title":"Толкать","letter":"Т","variants":[{"label":"","form":"jindo","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 4:29","u":"https://zeno.fm/bible/DDNBIV/LUK/4/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":135,"sci":"H, §E №192, с. 43. Практическая орфография и контекст требуют сверки."},{"n":267,"title":"Толпа","letter":"Т","variants":[{"label":"","form":"jama","notes":["Совокупность слушающих людей; не механическое тождество bɔrɔ «человек»."],"full":1,"status":"","examples":[{"k":1,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":268,"title":"Толстый","letter":"Т","variants":[],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":30,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфо иведены ниже.","examples":[],"refs":[{"t":"CFA, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=5"}]},{"label":"III","form":"ihinza","notes":["Форма для счёта людей в сочетании о пророках; не приведена под видом неизменяемой общей основы hinza."],"full":1,"status":"","examples":[{"k":1,"pid":"П29","head":"NT95, 1 Кор 14:29, PDF с. 114","rst":true,"dendi":"Andebi hinka wala ihinza mo ma sendi.","source":"NT95, 1 Кор 14:29, PDF с. 114","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114","pub":"И пророки пусть говорят двое или трое, а прочие пусть рассуждают.","lit":"Двое пророков или трое также пусть говорят.","parse":"Andebi — пророки; hinka — два; wala — или; ihinza — трое; форма при обозначении людей; mo — также; ma — побудительный/желательный показатель; sendi — говорить.","note":"Это полное первое предложение дендийского стиха. Русский параллельный стих также включает указание прочим слушателям; оно не добавлено в дословный перевод отсутствующей здесь второй фразы."}],"refs":[{"t":"NT95, 1 Кор 14:29, PDF с. 114","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":24,"sci":"H, §E №213, с. 44. Практическая орфография и контекст требуют сверки."},{"n":273,"title":"Туловище","letter":"Т","variants":[{"label":"I","form":"gaa bindi","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]},{"label":"II","form":"gaabindi","notes":["Слитное написание AL65, с. 30; на с. 29 приведено gaa bindi. Различие записи сохранено, значение устанавливается перечислением частей тела."],"full":1,"status":"","examples":[{"k":1,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."}],"refs":[{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Составное название средней части тела из AL65; не сведено к слову «живот»."},{"n":274,"title":"Туман","letter":"Т","variants":[],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":161,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":275,"title" просе напечатано cinɛ. Это два издания одного контекста."},{"k":7,"pid":"П12","head":"NT18, JHN 1:38","rst":true,"dendi":"Coobaaba, mani n goono nda gɔrɛ?","source":"NT18, JHN 1:38","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Равви́ (что значит: «учитель»), где живешь?","lit":"Учитель, где ты проживаешь?","parse":"Coobaaba — учитель; mani — где?; n — ты; goono — пребывать; nda — элемент глагольного сочетания; gɔrɛ — проживать.","note":"Goоno nda gɔrɛ разбирается как сочетание; nda не переводится механически русским «с». Синодальное «Равви» входит в опубликованный параллельный текст."},{"k":8,"pid":"П22","head":"AL65, PDF с. 29","rst":false,"dendi":"Cìi hɛika n go dia.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Скажи вещи, которые ты видишь.","parse":"Cìi — сказать, здесь побуждение; hɛika — вещи, которые; слитная запись в пособии; n — ты; go — предглагольный показатель; dia — видеть.","note":"Тон Cìi сохранён. Компактная запись hɛika не раздвинута пробелами под видом оригинальной цитаты; пословный разбор поясняет её функцию."}],"refs":[{"t":"NT18, Деян. 21:37","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT18, 1 Кор. 7:27","u":"https://zeno.fm/bible/DDNBIV/1CO/7/"}]}],"extra_refs":[{"t":"NT18, Рим 14:22","u":"https://zeno.fm/bible/DDNBIV/ROM/14/"},{"t":"NT18, Мк 15:4","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"},{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"}],"stray":[],"kind":"swadesh","swadesh":2,"sci":"AT, №2. Практическая орфография и контекст требуют сверки."},{"n":277,"title":"Тяжёлый","letter":"Т","variants":[{"label":"I","form":"tim","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 11:30","u":"https://zeno.fm/bible/DDNBIV/MAT/11/"},{"t": отношения; dee — вопросительная частица.","note":"Сочетание nga di gaa передаёт объект веры; послелог не имеет здесь отдельного русского «на»."},{"k":2,"pid":"П8","head":"NT95, MAT 12:23, PDF с. 12","rst":true,"dendi":"À na ci Dafidi ize di dee?","source":"NT95, MAT 12:23, PDF с. 12","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12","pub":"не это ли Христос, сын Давидов?","lit":"Не является ли он тем сыном Давида?","parse":"À — он; na — отрицательная функция в данном сочетании; не смешивать с показателем переходного действия; ci — являться; Dafidi — Давид; ize — сын / потомок; di — определительный элемент; dee — вопросительная частица.","note":"В опубликованном русском тексте добавлено именование «Христос»; в этой дендийской фразе слова Mɛsiya нет."},{"k":3,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."}],"refs":[{"t":"NT18, Ин 11:26","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Ин 1:21","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Мф 12:23","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"},{"t":"NT18, Ин 9:12","u":"https://zeno.fm/bible/DDNBIV/JHN/9/"},{"t":"NT18, Ин 18:7","u":"https://zeno.fm/bible/DDNBIV/JHN/18/"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Связан с уже обозначенным предметом: после имени или местоименного сочетания. Не смешивать с глагольным di «видеть», который уже есть в основной части."},{"n":284,"title":"Умирать","letter":"У","variants":[{"label":"","form":"bu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT18, Мф 9:18","u":"https://zeno.fm/bible/DDNBIV/MAT/9/"},{"t":"NT18, Лк 20:32","u":"https://zeno.fm/bible/DDNBIV/LUK/20/"},{"t":"NT18, Рим 6:7","u":"https://zeno.fm/bible/DDNBIV/ROM/6/"},{"t":"NT18, 1 Кор 15:18","u":"https://zeno.fm/bible/DDNBIV/1CO/15/"},{"t":"NT18, Ин 6:49","u":"https://zeno.fm/bible/DDNBIV/JHN/6/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":109,"sci":"AZ, №61. Практическая орфография и контекст требуют сверки."},{"n":285,"title":"Упражнение","letter":"У","variants":[{"label":"","form":"gweiyo","notes":["Контекстная форма из инструкции к арифметическим действиям; точное разложение -yo не завершено."],"full":1,"status":"","examples":[{"k":1,"pid":"П43","head":"CAL, PDF с. 22","rst":false,"dendi":"Iri ma gweiyo wo te.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Пусть мы выполним это упражнение.","parse":"Iri — мы; ma — побудительный показатель; gweiyo — упражнение; форма источника; wo — этот; te — делать; выполнить.","note":"Печатная с. 40: полная инструкция перед арифметическими действиями. Te оставлено в написании CAL, не превращено механически в tɛ. Цитата не реконструирована из словаря."}],"refs":[{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":286,"title":"Усиливать; увеличивать","letter":"У","variants":[{"label":"","form":"hinsa","notes":["Здесь усиление молчания: hinsa ka dɛnjɛ. Это не физическое увеличение размера."],"full":1,"status":"","examples":[{"k":1,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":287,"title":"Ухо","letter":"У","variants":[{"label":"I","form":"hanga","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 23","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=23"},{"t":"NT18, Мк 7:33","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Откр 13:9","u":"https://zeno.fm/bible/DDNBIV/REV/13/"},{"t":"NT18, Мф 13:18","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, 2 Тим 4:4","u":"https://zeno.fm/bible/DDNBIV/2TI/4/"}]},{"label":"II","form":"hangayo","notes":["В перечне органов головы; форма с -yo."],"full":1,"status":"","examples":[{"k":1,"pid":"П46","head":"AL65, PDF с. 29","rst":false,"dendi":"Bom gonda hangayo, mɔɔize, ninɛ, mɛɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Голова имеет уши, глаза, нос, рот.","parse":"Bom — голова; gonda — иметь; hangayo — уши; форма источника с -yo; mɔɔize — глаза в данном перечислении органов головы; ninɛ — нос; mɛɛ — рот.","note":"Полное предложение из учебного описания тела. Число органов в русском переводе следует анатомическому перечислению; оно не приписывается единому суффиксу у всех дендийских слов. Здесь mɔɔize названо в ряду органов головы; специальное различие «глаз / зрачок» этим предложением отдельно не устанавливается."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":73,"sci":"H, §E №97, с. 36. Практическая орфография и контекст требуют сверки."},{"n":288,"title":"Учитель","letter":"У","variants":[{"label":"","form":"Coobaaba","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П12","head":"NT18, JHN 1:38","rst":true,"dendi":"Coobaaba, mani n goono nda gɔrɛ?","source":"NT18, JHN 1:38","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Равви́ (что значит: «учитель»), где живешь?","lit":"Учитель, где ты проживаешь?","parse":"Coobaaba — учитель; mani — где?; n — ты; goono — пребывать; nda — элемент глагольного сочетания; gɔrɛ — проживать.","note":"Goоno nda gɔrɛ разбирается как сочетание; nda не переводится механически русским «с». Синодальное «Равви» входит в опубликованный параллельный текст."}],"refs":[{"t":"NT18, JHN 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Обращение из П12; значение подтверждено пояснением того же стиха."},{"n":289,"title":"Фома","letter":"Ф","variants":[{"label":"","form":"Toma","notes":["Имя собственное."],"full":1,"status":"","examples":[{"k":1,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."}],"refs":[{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":290,"title":"Форма адресата в пособии: noo","letter":"Ф","variants":[{"label":"","form":"noo","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П16","head":"AL64, PDF с. 20","rst":false,"dendi":"Ifɔ nɔ noo dendeni?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Что именно [адресат вопроса] изучил?","parse":"Ifɔ — что?; nɔ — выделительный/предикативный элемент; noo — форма адресата в пособии; лицо и число отдельно не установлены; dendeni — изучать / учиться.","note":"Дословная глосса намеренно содержит квадратные скобки: лицо и число адресата не подтверждены отдельным описанием местоименной системы. Это полный пример с незавершённой грамматической интерпретацией, а не образец для самостоятельного составления фраз."},{"k":2,"pid":"П17","head":"AL64, PDF с. 20","rst":false,"dendi":"Mɛtɛ noo nà à dendeni nda?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Каким способом [адресат вопроса] изучил это?","parse":"Mɛtɛ — как?; noo — форма адресата; лицо и число не установлены; nà — показатель переходного действия; à — это, дополнение; dendeni — изучать; nda — элемент конструкции способа.","note":"Тон nà сохранён по источнику. Классификация конечного nda предварительная; это ограничение относится и к статье nda. Перевод не выдаётся за полностью завершённый разбор."}],"refs":[{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"},{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Лицо и число не установлены отдельно; употребление не нормализовано в n или wom. Не использовать для самостоятельных фраз как подтверждённую форму «вы»."},{"n":291,"title":"Хвост","letter":"Х","variants":[{"label":"","form":"laace","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 173","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=173"},{"t":"NT18, Откр 9:10","u":"https://zeno.fm/bible/DDNBIV/REV/9/"},{"t":"NT18, Откр 12:4","u":"https://zeno.fm/bible/DDNBIV/REV/12/"},{"t":"NT18, Откр 9:19","u":"https://zeno.fm/bible/DDNBIV/REV/9/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":69,"sci":"H, §E №86, с. 36. Практическая орфография и контекст требуют сверки."},{"n":292,"title":"Ходить","letter":"Х","variants":[{"label":"I","form":"dira","notes":["В приведённом контексте метафорическое «ходить/жить»; буквальное употребление нужно проверить отдельно."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 128","u":"http
