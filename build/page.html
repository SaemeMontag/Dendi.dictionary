 замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."}],"refs":[{"t":"NT18, ACT 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Форма о людях в П13; морфологическое разложение и отношение к bɔrɔ здесь не установлены."},{"n":139,"title":"Магазин","letter":"М","variants":[{"label":"","form":"magazɛ̃","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П84","head":"AL65, PDF и печ. с. 106","rst":false,"dendi":"Ali nà mɔnturu fɔ́ dei F 8500 magazɛ̃ kuna.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али купил одни часы за 8500 франков в магазине.","parse":"Ali — Али, имя персонажа; nà — показатель переходного действия; mɔnturu — часы, прибор; fɔ́ — один; dei — покупать; F — обозначение франка в источнике; 8500 — цифровая запись числа 8500; magazɛ̃ — магазин; kuna — внутри, в.","note":"Полное первое предложение задачи о прибыли. mɔnturu соотносится по значению с agogo в CAL, сохраняя свою запись. Русское «одни часы» не означает множественное число слова денди. F — условное обозначение валюты, не реконструированное слово."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Магазин; конечный носовой ɛ̃ сохранён по источнику.","related":"П84."},{"n":140,"title":"Маленький","letter":"М","variants":[{"label":"I","form":"cɛna","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 13:32","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"}]},{"label":"II","form":"cɛɛnɛ","notes":["Маленький/мельчайший, о возбудителе болезни; отличать от cɛna NT."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 9","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=9"},{"t":"AL64, PDF с. 6","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=6"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"AL65, PDF с. 87","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=87"}]},{"label":"III","form":"keena","notes":["Запись CAL в описании часовой стрелки; не подменяется cɛna/cɛɛnɛ по догадке."],"full":1,"status":"","examples":[{"k":1,"pid":"П86","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Sana keena go guuru cabe no","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Маленькая стрелка показывает часы.","parse":"Sana — стрелка часов; keena — маленький; go — предглагольный показатель; guuru — час, единица времени; cabe — показывать; no — предикативно-выделительный элемент.","note":"Самостоятельная строка описания стрелок, без конечной точки в печати. Это часовая стрелка; слово «часовая» непосредственно не вставлено в цитату. keena не исправлено в cɛna или cɛɛnɛ."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":32,"sci":"H, §E №144, с. 39. Практическая орфография и контекст требуют сверки."},{"n":141,"title":"Мало","letter":"М","variants":[{"label":"I","form":"fɔ-fɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 7:14","u":"https://zeno.fm/bible/DDNBIV/MAT/7/"}]},{"label":"II","form":"fɔ́-fɔ́","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL64, PDF с. 21","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=21"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":20,"meaning":"fɔ-fɔ — контекстное «немногие/некоторые», не универсальный эквивалент «мало».","sci":"H, §E №210, с. 44. Практическая орфография и контекст требуют сверки."},{"n":142,"title":"Марфа","letter":"М","variants":[{"label":"","form":"Marata","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П54","head":"NT18, Ин 11:5","rst":true,"dendi":"Yesu go baa Marata nda à cɛɛnɛ nda Lazaa.","source":"NT18, Ин 11:5","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус же любил Марфу и сестру ее и Лазаря.","lit":"Иисус любит Марфу, её младшую сестру и Лазаря.","parse":"Yesu — Иисус; go — предглагольный показатель; baa — любить; Marata — Марфа; nda — и; à — она, здесь её; cɛɛnɛ — младшая сестра в этом контексте; nda — и; Lazaa — Лазарь.","note":"Полное повествовательное предложение. В Ин 11:1 и 11:28 сестра Марфы названа Mariyama. Слово cɛɛnɛ не ограничено мужским полом: сравните П32 в статье «Брат». Русское прошедшее время параллельного перевода не является отдельным значением go."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Собственное имя персонажа евангельского повествования; русское соответствие Марфа.","related":"П54."},{"n":143,"title":"Мать","letter":"М","variants":[{"label":"I","form":"nya","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мф 1:18","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"},{"t":"NT18, Мк 10:7","u":"https://zeno.fm/bible/DDNBIV/MRK/10/"}]},{"label":"II","form":"nyaa","notes":["В тексте о кормящей матери; различается длина гласного с nya из NT."],"full":1,"status":"","examples":[{"k":1,"pid":"П63","head":"AL65, PDF и печ. с. 56","rst":false,"dendi":"Iyaali fɔ́ bara nɔ̀ baabɛ, nyaa nda koo au kooyo.","source":"AL65, PDF и печ. с. 56","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56","lit":"Одна семья — это отец, мать и ребёнок или дети.","parse":"Iyaali — семья; fɔ́ — один, одна; bara — компонент связочной конструкции bara nɔ̀; nɔ̀ — компонент той же связочной конструкции; baabɛ — отец; nyaa — мать; nda — и; koo — ребёнок; au — или; kooyo — дети, форма источника.","note":"Полное определение из урока о семье; это учебное описание конкретного состава семьи, не универсальное этнографическое определение. Нетонированное bara сохранено. kooyo передано как форма множественного числа в этом контексте без самостоятельного обобщения правил суффиксации."}],"refs":[{"t":"AL65, PDF с. 95","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=95"},{"t":"AL65, PDF с. 57","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=57"},{"t":"AL65, PDF с. 56","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":42,"sci":"H, §E №7, с. 30. Практическая орфография и контекст требуют сверки."},{"n":144,"title":"Мессия; Христос","letter":"М","variants":[{"label":"","form":"Mɛsiya","notes":["Религиозное именование / титул."],"full":1,"status":"","examples":[{"k":1,"pid":"П7","head":"NT95, JHN 4:29, PDF с. 62","rst":true,"dendi":"À mana ci Mɛsiya dee?","source":"NT95, JHN 4:29, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"не Он ли Христос?","lit":"Не является ли он Мессией?","parse":"À — он; mana — отрицательное предикативное употребление; ci — являться; Mɛsiya — Мессия; dee — вопросительная частица.","note":"Ожидание подтверждения возможно по контексту, но не объявляется значением dee во всех вопросах."}],"refs":[{"t":"NT18, Ин 1:20","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 1:41","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 4:29","u":"https://zeno.fm/bible/DDNBIV/JHN/4/"},{"t":"NT18, Ин 11:27","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, 1 Кор 15:16","u":"https://zeno.fm/bible/DDNBIV/1CO/15/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Не вопросительная частица. Может занимать именную часть сказуемого после ci."},{"n":145,"title":"Место","letter":"М","variants":[{"label":"","form":"nungu","notes":["Местонахождение людей; сочетание nungu di «то/указанное место»."],"full":1,"status":"","examples":[{"k":1,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."}],"refs":[{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":146,"title":"Месяц","letter":"М","variants":[{"label":"","form":"handu","notes":["Календарная единица. Небесное тело handu представлено в статье «Луна»; общность написания не стирает разные значения."],"full":3,"status":"","examples":[{"k":1,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":2,"pid":"П39","head":"AL65, PDF с. 70","rst":false,"dendi":"Handu fɔ́ gonda azuma 4.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Один месяц имеет четыре недели.","parse":"Handu — месяц; fɔ́ — один; gonda — иметь; azuma — неделя; 4 — четыре; цифровая запись.","note":"Это приближённая учебная схема, а не утверждение, что каждый календарный месяц длится ровно четыре недели. Цифра не заменяется неподтверждённым дендийским названием числа."},{"k":3,"pid":"П78","head":"AL65, PDF и печ. с. 51","rst":false,"dendi":"Handu wɔ̀ kuna, à nɛɛra 340.","source":"AL65, PDF и печ. с. 51","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51","lit":"В этом месяце он [комитет] продал 340 [килограммов хлопка].","parse":"Handu — месяц; wɔ̀ — этот; kuna — в, внутри; à — он, отсылка к комитету; nɛɛra — продавать; 340 — цифровая запись числа 340.","note":"Целое предложение из задачи о деревенском комитете Бирини-Лафиа. В предыдущем предложении названы хлопок и kg 250 за прошлый месяц. После 340 в цитате нет ни kg, ни слова «хлопок»: они добавлены только в квадратных скобках перевода."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":147,"title":"Минута","letter":"М","variants":[{"label":"","form":"minti, mintiyo","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П87","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Sana beeri go mintiyo cabe","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Большая стрелка показывает минуты.","parse":"Sana — стрелка часов; beeri — большой; go — предглагольный показатель; mintiyo — минуты, форма источника; cabe — показывать.","note":"Полная параллельная строка после П86, без конечной точки. no из предыдущей строки не дописано. mintiyo соотносится с minti на этой же печатной странице; различие формы сохранено."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Минута; minti встречается в вопросах и арифметических строках того же урока CAL, mintiyo — «минуты» в П87. Это основа и контекстная форма одного слова.","related":"П87."},{"n":148,"title":"Мир","letter":"М","variants":[{"label":"","form":"handunya","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П90","head":"NT18, Ин 1:10","rst":true,"dendi":"À goono handunya. Nga mo ya na handunya tɛ amma handunya mana à bei.","source":"NT18, Ин 1:10","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"В мире был, и мир чрез Него на́чал быть, и мир Его не познал.","lit":"Он был в мире. Он же сотворил мир, но мир его не знал.","parse":"À — он, отсылка к действующему лицу пролога; goono — находиться, быть; handunya — мир; Nga — он, самостоятельная форма; mo — также, же; ya — выделение; na — показатель переходного действия; handunya — мир; tɛ — делать, здесь сотворить; amma — но; handunya — мир; mana — отрицание; à — он, здесь его; bei — знать.","note":"Весь стих состоит из двух законченных предложений и приведён целиком. Отсылку À следует читать в контексте пролога о Слове и свете. «Мир не знал» — переносное обозначение людей мира. Прошедшее время перевода не объявлено значением goono."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Мир; в прологе — мир и живущие в нём люди. Не смешивать с «мир, отсутствие войны».","related":"П90."},{"n":149,"title":"Много","letter":"М","variants":[{"label":"I","form":"boobo","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."}],"refs":[{"t":"NT95, PDF с. 22","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=22"},{"t":"NT18, Мф 3:7","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Мк 15:3","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"},{"t":"NT18, Лк 3:18","u":"https://zeno.fm/bible/DDNBIV/LUK/3/"},{"t":"NT18, 1 Кор 16:9","u":"https://zeno.fm/bible/DDNBIV/1CO/16/"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"}]},{"label":"II","form":"bayom","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 7:13","u":"https://zeno.fm/bible/DDNBIV/MAT/7/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":18,"meaning":"bayom дано в значении множества людей; словообразовательный вариант.","sci":"H, §E №209, с. 44. Практическая орфография и контекст требуют сверки."},{"n":150,"title":"Моисей","letter":"М","variants":[{"label":"","form":"Moisi","notes":["Имя собственное."],"full":1,"status":"","examples":[{"k":1,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."}],"refs":[{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":151,"title":"Мокрый","letter":"М","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":194,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":152,"title":"Молитва","letter":"М","variants":[{"label":"","form":"aduwa","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П57","head":"NT18, 1 Фес 5:17","rst":true,"dendi":"Wo ka aduwa tɛ, cɛyom si.","source":"NT18, 1 Фес 5:17","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Непрестанно молитесь.","lit":"Совершайте молитву, прекращения нет.","parse":"Wo — побуждение к адресатам; ka — связующий элемент при действии; aduwa — молитва; tɛ — делать, совершать; cɛyom — прекращение, перерыв; si — отрицание наличия, здесь «нет».","note":"Полная фраза включает обе части, разделённые запятой. aduwa tɛ буквально «делать молитву», по-русски «молиться». Постпозиционное si в cɛyom si отличается от позиции si перед глаголом; здесь не следует восстанавливать несуществующее слово «непрестанно»."},{"k":2,"pid":"П61","head":"NT18, 1 Фес 5:25","rst":true,"dendi":"Nya-izei, wa aduwa tɛ i sɛ.","source":"NT18, 1 Фес 5:25","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Братия! молитесь о нас.","lit":"Братья [по общине], совершайте молитву за нас.","parse":"Nya-izei — братья, обращение к членам общины; wa — побуждение к адресатам; aduwa — молитва; tɛ — делать, совершать; i — мы, здесь нас; sɛ — для, в пользу адресата молитвы.","note":"Обращение входит в полное предложение. Сложное Nya-izei сохранено с дефисом и не объявляется точным синонимом cɛɛnɛ во всех родственных отношениях. aduwa tɛ — «молиться»; i sɛ указывает, за кого просят."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Молитва; aduwa tɛ «совершать молитву, молиться». Обе фразы показывают сочетание существительного с tɛ, не один неделимый глагол.","related":"П57, П61."},{"n":153,"title":"Молчать; замолчать","letter":"М","variants":[{"label":"","form":"dɛnjɛ","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":2,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT18, ACT 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"В П13 — наступление молчания перед речью."},{"n":154,"title":"Море","letter":"М","variants":[{"label":"I","form":"tɛku","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 153","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=153"}]},{"label":"II","form":"tɛɛku","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 12:40","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"}]},{"label":"III","form":"buula","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 18:6","u":"https://zeno.fm/bible/DDNBIV/MAT/18/"}]},{"label":"IV","form":"tenku","notes":["Море в перечислении водоёмов, участвующих в круговороте воды."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL65, PDF с. 72","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=72"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":154,"meaning":"tɛɛku и buula — употреблены о море; buula также об озере."},{"n":155,"title":"Мочь; быть способным","letter":"М","variants":[{"label":"","form":"hini","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."}],"refs":[{"t":"NT95, JHN 1:46, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Модальное употребление перед зависимым глаголом."},{"n":156,"title":"Муж","letter":"М","variants":[{"label":"I","form":"kunye","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 1:16","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"},{"t":"NT18, Еф 5:22","u":"https://zeno.fm/bible/DDNBIV/EPH/5/"},{"t":"NT18, Кол 3:19","u":"https://zeno.fm/bible/DDNBIV/COL/3/"},{"t":"NT18, Тит 2:4","u":"https://zeno.fm/bible/DDNBIV/TIT/2/"}]},{"label":"II","form":"sɔgɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 1:19","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"}]}],"extr lpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=9","lit":"Пусть мы учимся:","parse":"Iri — мы; ma — побудительный/желательный показатель в данном сочетании; dendeni — учиться.","note":"Полная вводная фраза перед учебной таблицей; двоеточие сохранено. Таблица задаёт контекст обучения арифметике. Это не выдуманный разговорный вопрос."},{"k":2,"pid":"П36","head":"AL65, PDF с. 17","rst":false,"dendi":"Iri ma sí hari ziibandi.","source":"AL65, PDF с. 17","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17","lit":"Пусть мы не загрязняем воду.","parse":"Iri — мы; ma — побудительный показатель; sí — отрицание; тон источника сохранён; hari — вода; ziibandi — загрязнять.","note":"Учебная фраза о сохранении чистоты воды. Ziibandi — глагол изменения состояния, а не прилагательное «грязный»."},{"k":3,"pid":"П43","head":"CAL, PDF с. 22","rst":false,"dendi":"Iri ma gweiyo wo te.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","lit":"Пусть мы выполним это упражнение.","parse":"Iri — мы; ma — побудительный показатель; gweiyo — упражнение; форма источника; wo — этот; te — делать; выполнить.","note":"Печатная с. 40: полная инструкция перед арифметическими действиями. Te оставлено в написании CAL, не превращено механически в tɛ. Цитата не реконструирована из словаря."}],"refs":[{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"},{"t":"AL65, PDF с. 111","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=111"},{"t":"AL65, PDF с. 112","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=112"},{"t":"AL65, PDF с. 17","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17"}]},{"label":"III","form":"irì","notes":["Форма с низким тоном."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П61","head":"","rst":true,"dendi":"Nya-izei, wa aduwa tɛ i sɛ.","source":"NT18, 1 Фес 5:25","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Братия! молитесь о нас.","lit":"Братья [по общине], совершайте молитву за нас.","parse":"Nya-izei — братья, обращение к членам общины; wa — побуждение к адресатам; aduwa — молитва; tɛ — делать, совершать; i — мы, здесь нас; sɛ — для, в пользу адресата молитвы.","note":"Обращение входит в полное предложение. Сложное Nya-izei сохранено с дефисом и не объявляется точным синонимом cɛɛnɛ во всех родственных отношениях. aduwa tɛ — «молиться»; i sɛ указывает, за кого просят."},{"k":2,"pid":"П64","head":"","rst":false,"dendi":"Iri mà iri ŋwaariyo banda daabu.","source":"AL65, PDF и печ. с. 13","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=13","lit":"Давайте прикроем нашу пищу.","parse":"Iri — мы; mà — побудительный показатель; iri — наш, буквально «мы» в определении; ŋwaariyo — пища, еда; banda — компонент сочетания banda daabu «прикрыть»; daabu — закрывать, прикрывать.","note":"Полное заглавие учебного занятия о защите пищи; оно имеет форму побуждения. banda daabu переведено как сочетание. Отдельное пространственное значение banda здесь не установлено и не подменено «спиной». Словоразделы нормализованы без изменения букв и тонов."},{"k":3,"pid":"П72","head":"","rst":false,"dendi":"Iri ma guuru cau.","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Давайте будем определять время [по часам].","parse":"Iri — мы; ma — побудительный показатель; guuru — час, время на часах; cau — читать, здесь считывать показание.","note":"Полная вводная инструкция в уроке о времени перед описанием стрелок и циферблата. Буквально «давайте читать час». cau сохранено по CAL и отделено от написания cou в AL65; это сопоставление записей, а не доказанное правило звукового соответствия."}],"stray":[],"kind":"swadesh","swadesh":4,"sci":"AZ, №3. Практическая орфография и контекст требуют сверки."},{"n":159,"title":"Мыло","letter":"М","variants":[{"label":"","form":"saafunu","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П70","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Мыло; в сочетании hari nna saafunu «вода с мылом».","related":"П70."},{"n":160,"title":"Мыть","letter":"М","variants":[{"label":"I","form":"nyunu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 29","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=29"},{"t":"NT18, Мф 27:24","u":"https://ze "https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=77"},{"t":"AL65, PDF с. 65","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=65"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":132,"sci":"H, §E №190, с. 43. Практическая орфография и контекст требуют сверки."},{"n":161,"title":"Мясо","letter":"М","variants":[{"label":"I","form":"ham","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 105","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=105"}]},{"label":"II","form":"gaaham","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 24:39","u":"https://zeno.fm/bible/DDNBIV/LUK/24/"},{"t":"NT18, 1 Кор 12:20","u":"https://zeno.fm/bible/DDNBIV/1CO/12/"},{"t":"NT18, Евр 10:20","u":"https://zeno.fm/bible/DDNBIV/HEB/10/"},{"t":"NT18, Мф 19:5","u":"https://zeno.fm/bible/DDNBIV/MAT/19/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":63,"meaning":"gaaham — плоть/тело; ham в NT95 — мясо. Значения не полностью совпадают.","sci":"H, §E №87, с. 36. Практическая орфография и контекст требуют сверки."},{"n":162,"title":"Назарет","letter":"Н","variants":[{"label":"","form":"Nazarɛtu","notes":["Название населённого пункта."],"full":2,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."},{"k":2,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."}],"refs":[{"t":"NT18, Ин 1:46","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Лк 2:39","u":"https://zeno.fm/bible/DDNBIV/LUK/2/"},{"t":"NT18, Мф 21:11","u":"https://zeno.fm/bible/DDNBIV/MAT/21/"},{"t":"NT18, Мк 14:67","u":"https://zeno.fm/bible/DDNBIV/MRK/14/"},{"t":"NT18, Ин 18:7","u":"https://zeno.fm/bible/DDNBIV/JHN/18/"},{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Имя собственное. В сочетании с bɔrɔ может указывать на происхождение человека; не превращать имя места в отдельный глагол."},{"n":163,"title":"Наполняться","letter":"Н","variants":[{"label":"","form":"tɔ","notes":["Исполниться в религиозном контексте с nda Biya Halaala. Другие значения и переходность не обобщены по одному примеру."],"full":1,"status":"","examples":[{"k":1,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":164,"title":"Находиться; быть в наличии","letter":"Н","variants":[{"label":"I","form":"goono","notes":["Предикативное / глагольное употребление."],"full":null,"status":"","examples":[{"k":1,"pid":"П12","head":"NT18, JHN 1:38","rst":true,"dendi":"Coobaaba, mani n goono nda gɔrɛ?","source":"NT18, JHN 1:38","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Равви́ (что значит: «учитель»), где живешь?","lit":"Учитель, где ты проживаешь?","parse":"Coobaaba — учитель; mani — где?; n — ты; goono — пребывать; nda — элемент глагольного сочетания; gɔrɛ — проживать.","note":"Goоno nda gɔrɛ разбирается как сочетание; nda не переводится механически русским «с». Синодальное «Равви» входит в опубликованный параллельный текст."},{"k":2,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."},{"k":3,"pid":"П34","head":"NT95, Еф 4:5, PDF с. 127","rst":true,"dendi":"Kpe fɔlɔnku ya goono nda naane fɔlɔnku nda mirandiyom fɔlɔnku.","source":"NT95, Еф 4:5, PDF с. 127","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127","pub":"один Господь, одна вера, одно крещение,","lit":"Есть один Господь, одна вера и одно крещение.","parse":"Kpe — Господь; fɔlɔnku — один; единственный в данном перечислении; ya — выделительный элемент; goono — быть в наличии; nda — и; связь перечисления; naane — вера; mirandiyom — крещение; производная форма в религиозном контексте.","note":"Naane здесь существительное, как показывают параллельные именные группы. Mirandiyom не переведено как обычное мытьё. Fɔlɔnku не заменено редактором на fɔ."},{"k":4,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":5,"pid":"П40","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ kuna, jibiri 7 ya goono.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"В одной неделе имеются семь дней.","parse":"Azuma — неделя; fɔ́ — один; kuna — внутри; в; jibiri — день в календарной строке; 7 — семь; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Jibiri сохранено как в пособии; не исправлено автоматически на jiribi из иных текстов. Другие варианты статьи «День» не объявлены взаимозаменяемыми во всех сочетаниях."},{"k":6,"pid":"П42","head":"CAL, PDF с. 22","rst":false,"dendi":"Sooro fo ga, tuurinya 55 ya goono.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","lit":"В одном ряду имеются 55 деревянных элементов.","parse":"Sooro — ряд; fo — один; написание CAL; ga — в; пространственный элемент; tuurinya — деревянный элемент в строительной задаче; 55 — пятьдесят пять; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Печатная с. 41: задача о древесине для строительства. Здесь речь о строительных элементах, поэтому перевод «55 растущих деревьев» не используется. Форма tuurinya совпадает графически с вариантами растительного термина; значение устанавливается контекстом."},{"k":7,"pid":"П73","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Lamba 12 ya goono agogo ga","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Двенадцать чисел находятся на часах [циферблате].","parse":"Lamba — число, номер; 12 — число 12, цифровая запись; ya — выделительный элемент; goono — находиться, быть в наличии; agogo — часы; ga — на, при; послелог.","note":"Самостоятельное утверждение в описании циферблата; в источнике строка без конечной точки. Значение lamba относится к числам/номерам на циферблате. ga здесь послелог после существительного, не предглагольный показатель ga. Чтение цифрового 12 не подставлено."},{"k":8,"pid":"П75","head":"AL65, PDF и печ. с. 33","rst":false,"dendi":"Cìnɛ̀ kulu ga, kabuyom azansi zeenɔ fɔ́ goono.","source":"AL65, PDF и печ. с. 33","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=33","lit":"В каждом языке есть один старый [традиционный] способ счёта.","parse":"Cìnɛ̀ — язык общения; kulu — каждый, весь; ga — на, в; послелог; kabuyom — счёт, действие счёта; azansi — способ; zeenɔ — старый, здесь традиционный; fɔ́ — один, некий; goono — имеется.","note":"Полное утверждение из раздела о традиционном счёте. «Традиционный» уточняет контекст zeenɔ. Тоновое написание Cìnɛ̀ не подменено cinɛ; kabuyom — название действия, не глагол kabu."},{"k":9,"pid":"П90","head":"NT18, Ин 1:10","rst":true,"dendi":"À goono handunya. Nga mo ya na handunya tɛ amma handunya mana à bei.","source":"NT18, Ин 1:10","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"В мире был, и мир чрез Него на́чал быть, и мир Его не познал.","lit":"Он был в мире. Он же сотворил мир, но мир его не знал.","parse":"À — он, отсылка к действующему лицу пролога; goono — находиться, быть; handunya — мир; Nga — он, самостоятельная форма; mo — также, же; ya — выделение; na — показатель переходного действия; handunya — мир; tɛ — делать, здесь сотворить; amma — но; handunya — мир; mana — отрицание; à — он, здесь его; bei — знать.","note":"Весь стих состоит из двух законченных предложений и приведён целиком. Отсылку À следует читать в контексте пролога о Слове и свете. «Мир не знал» — переносное обозначение людей мира. Прошедшее время перевода не объявлено значением goono."}],"refs":[{"t":"NT18, Ин 1:2","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Рим 1:6","u":"https://zeno.fm/bible/DDNBIV/ROM/1/"},{"t":"NT18, Ин 10:42","u":"https://zeno.fm/bible/DDNBIV/JHN/10/"},{"t":"NT18, 1 Кор 16:23","u":"https://zeno.fm/bible/DDNBIV/1CO/16/"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"},{"t":"NT95, Еф 4:5, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]},{"label":"II","form":"gono","notes":["Написание COV с одним o после g сохранено; соответствие goono показано по контексту наличия, не объявлено правилом сокращения."],"full":1,"status":"","examples":[{"k":1,"pid":"П70","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Значение присутствия, пребывания или наличия устанавливается по окружению. Не объявляется простой полной формой go: это соотношение требует отдельного грамматического описания."},{"n":165,"title":"Начинать","letter":"Н","variants":[{"label":"","form":"sinti","notes":["Начать говорить: sinti ko sendi."],"full":1,"status":"","examples":[{"k":1,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":166,"title":"Не","letter":"Н","variants":[{"label":"I","form":"si","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 29","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=29"},{"t":"NT18, Мф 3:9","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL64, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=22"}]},{"label":"II","form":"mana","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 21:19","u":"https://zeno.fm/bible/DDNBIV/MAT/21/"},{"t":"AL64, PDF с. 10","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=10"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"}]},{"label":"III","form":"síi","notes":["Отрицательная форма; отличается от si/mana по конструкции."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 21","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=21"},{"t":"AL65, PDF с. 108","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=108"},{"t":"AL65, PDF с. 111","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=111"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":16,"meaning":"si и mana имеют разные грамматические функции; не свободные синонимы."},{"n":167,"title":"Не иметь; быть без","letter":"Н","variants":[{"label":"","form":"sinda","notes":["Отрицательный предикат обладания."],"full":1,"status":"","examples":[{"k":1,"pid":"П2","head":"NT18, 1CO 7:27","rst":true,"dendi":"N sinda wɛndɛ ba?","source":"NT18, 1CO 7:27","source_url":"https://zeno.fm/bible/DDNBIV/1CO/7/","pub":"Остался ли без жены?","lit":"Ты не имеешь жены?","parse":"N — ты; sinda — не иметь; wɛndɛ — жена; ba — вопросительная частица."}],"refs":[{"t":"NT18, 1 Кор 7:27","u":"https://zeno.fm/bible/DDNBIV/1CO/7/"},{"t":"NT18, 1 Кор 9:6","u":"https://zeno.fm/bible/DDNBIV/1CO/9/"},{"t":"NT18, Ин 4:44","u":"https://zeno.fm/bible/DDNBIV/JHN/4/"},{"t":"NT18, Мф 15:16","u":"https://zeno.fm/bible/DDNBIV/MAT/15/"},{"t":"NT18, 2 Кор 9:15","u":"https://zeno.fm/bible/DDNBIV/2CO/9/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Не сводить к частице si. Может обозначать отсутствие предмета, права, почёта или качества."},{"n":168,"title":"Небо","letter":"Н","variants":[{"label":"","form":"bɛɛnɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 6","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=6"},{"t":"NT18, Мф 3:16","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Мк 13:31","u":"https://zeno.fm/bible/DDNBIV/MRK/13/"},{"t":"NT18, Откр 12:8","u":"https://zeno.fm/bible/DDNBIV/REV/12/"},{"t":"NT18, Еф 2:6","u":"https://zeno.fm/bible/DDNBIV/EPH/2/"},{"t":"NT18, Ин 6:50","u":"https://zeno.fm/bible/DDNBIV/JHN/6/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":162,"sci":"H, §E №115, с. 37. Практическая орфография и контекст требуют сверки."},{"n":169,"title":"Невисокосный (в названии года)","letter":"Н","variants":[{"label":"","form":"kubantɛ","notes":["Засвидетельствовано в jiiri kubantɛ — невисокосный год. За пределами этого сочетания значение «обычный» не обобщено."],"full":1,"status":"","examples":[{"k":1,"pid":"П47","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri kubantɛ gonda jibiri 365.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Невисокосный год имеет 365 дней.","parse":"Jiiri — год; kubantɛ — невисокосный; значение в сочетании jiiri kubantɛ; gonda — иметь; jibiri — день; 365 — триста шестьдесят пять; цифровая запись источника.","note":"Предложение входит в противопоставление обычного и високосного года. Kubantɛ не объявляется универсальным переводом прилагательного «обычный» вне календарного сочетания. Цифра сохранена; дендийское словесное название числа не восстановлено по догадке."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":170,"title":"Неделя","letter":"Н","variants":[{"label":"","form":"azuma","notes":["Azuma обозначает неделю в календарных строках П38–П40; внутри перечня дней в П48 то же написание обозначает пятницу. См. также статью «Пятница»."],"full":4,"status":"","examples":[{"k":1,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":2,"pid":"П39","head":"AL65, PDF с. 70","rst":false,"dendi":"Handu fɔ́ gonda azuma 4.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Один месяц имеет четыре недели.","parse":"Handu — месяц; fɔ́ — один; gonda — иметь; azuma — неделя; 4 — четыре; цифровая запись.","note":"Это приближённая учебная схема, а не утверждение, что каждый календарный месяц длится ровно четыре недели. Цифра не заменяется неподтверждённым дендийским названием числа."},{"k":3,"pid":"П40","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ kuna, jibiri 7 ya goono.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"В одной неделе имеются семь дней.","parse":"Azuma — неделя; fɔ́ — один; kuna — внутри; в; jibiri — день в календарной строке; 7 — семь; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Jibiri сохранено как в пособии; не исправлено автоматически на jiribi из иных текстов. Другие варианты статьи «День» не объявлены взаимозаменяемыми во всех сочетаниях."},{"k":4,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":171,"title":"Некоторые","letter":"Н","variants":[{"label":"","form":"afɔ yom","notes":["Сочетание, не простая лексема."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 22","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=22"},{"t":"NT18, Мф 13:8","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, 1 Тим 5:15","u":"https://zeno.fm/bible/DDNBIV/1TI/5/"},{"t":"NT18, Деян 2:13","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Рим 11:14","u":"https://zeno.fm/bible/DDNBIV/ROM/11/"},{"t":"NT18, Евр 11:35","u":"https://zeno.fm/bible/DDNBIV/HEB/11/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":19,"meaning":"afɔ yom — сочетание с показателем множественного числа."},{"n":172,"title":"Нет: слово ответа","letter":"Н","variants":[{"label":"","form":"Awo","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке.","Полная вопросно-ответная пара приведена в банке; ответная форма не вырвана из контекста. Эти положительные вопросы не доказывают правила реакции на отрицательный вопрос."],"full":1,"status":"","examples":[{"k":1,"pid":"П44","head":"NT95, Ин 1:21, PDF с. 60","rst":true,"dendi":"Ǹ cii: Ni no andebi di? À tu ka cii. Awo.","source":"NT95, Ин 1:21, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"Пророк? Он отвечал: нет.","lit":"Они сказали: ты — тот пророк? Он ответил: нет.","parse":"Ǹ — они; cii — сказать; Ni — ты; no — предикативный элемент; andebi — пророк; di — определительный элемент; À — он; tu — ответить; ka — связь действий; Awo — нет.","note":"Вопрос без ba и dee; ответ Awo приведён вместе с вопросом. Перед Awo в издании напечатана точка после cii; она сохранена, хотя русский перевод оформляет ответ двоеточием. Cii во второй части также означает «сказать». Полный русский стих включает предшествующий вопрос об Илии; здесь приведена соответствующая часть."}],"refs":[{"t":"NT18, Ин 1:21","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT95, Ин 1:21, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"}]}],"extra_refs":[{"t":"NT18, 1 Кор 10:19","u":"https://zeno.fm/bible/DDNBIV/1CO/10/"},{"t":"NT18, 1 Кор 6:15","u":"https://zeno.fm/bible/DDNBIV/1CO/6/"},{"t":"NT18, Деян 16:37","u":"https://zeno.fm/bible/DDNBIV/ACT/16/"},{"t":"NT18, Гал 3:21","u":"https://zeno.fm/bible/DDNBIV/GAL/3/"}],"linked":[],"stray":[],"kind":"extra","meaning":"Отрицательное слово ответа; не заменяет отрицательные показатели внутри сказуемого."},{"n":173,"title":"Но","letter":"Н","variants":[{"label":"","form":"Amma","notes":["Противительный связующий элемент."],"full":1,"status":"","examples":[{"k":1,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."}],"refs":[{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П90","head":"","rst":true,"dendi":"À goono handunya. Nga mo ya na handunya tɛ amma handunya mana à bei.","source":"NT18, Ин 1:10","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"В мире был, и мир чрез Него на́чал быть, и мир Его не познал.","lit":"Он был в мире. Он же сотворил мир, но мир его не знал.","parse":"À — он, отсылка к действующему лицу пролога; goono — находиться, быть; handunya — мир; Nga — он, самостоятельная форма; mo — также, же; ya — выделение; na — показатель переходного действия; handunya — мир; tɛ — делать, здесь сотворить; amma — но; handunya — мир; mana — отрицание; à — он, здесь его; bei — знать.","note":"Весь стих состоит из двух законченных предложений и приведён целиком. Отсылку À следует читать в контексте пролога о Слове и свете. «Мир не знал» — переносное обозначение людей мира. Прошедшее время перевода не объявлено значением goono."},{"k":2,"pid":"П91","head":"","rst":true,"dendi":"À kaa nga ŋmɔne yom dɔ amma ǹ mana à ta.","source":"NT18, Ин 1:11","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Пришел к своим, и свои Его не приняли.","lit":"Он пришёл к своим, но они его не приняли.","parse":"À — он; kaa — приходить; nga — он, здесь притяжательная отсылка; ŋmɔne — собственный, свой; yom — показатель множественности; dɔ — к, в сфере указанного лица или группы; amma — но; ǹ — они; mana — отрицание; à — он, здесь его; ta — принимать.","note":"Полное предложение. nga ŋmɔne yom — «свои» как группа людей; слово «люди» отдельно не выражено. kaa здесь глагол прихода, в отличие от предглагольного употребления в П88. dɔ разбирается как послелог этой конструкции."}],"stray":[],"kind":"extra"},{"n":174,"title":"Новый","letter":"Н","variants":[{"label":"","form":"teji","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"},{"t":"NT18, Мф 9:16","u":"https://zeno.fm/bible/DDNBIV/MAT/9/"},{"t":"NT18, Мк 14:24","u":"https://zeno.fm/bible/DDNBIV/MRK/14/"},{"t":"NT18, 2 Кор 5:17","u":"https://zeno.fm/bible/DDNBIV/2CO/5/"},{"t":"NT18, Лк 5:38","u":"https://zeno.fm/bible/DDNBIV/LUK/5/"},{"t":"NT18, Евр 8:13","u":"https://zeno.fm/bible/DDNBIV/HEB/8/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":183,"sci":"AT, №96. Практическая орфография и контекст требуют сверки."},{"n":175,"title":"Нога","letter":"Н","variants":[{"label":"","form":"cee","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":2,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."}],"refs":[{"t":"NT18, Ин 19:32","u":"https://zeno.fm/bible/DDNBIV/JHN/19/"},{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"NT18, Рим 3:15","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, Деян 2:35","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":81,"meaning":"cee — та же форма в контексте переламывания ног.","sci":"H, §E №103, с. 37. Практическая орфография и контекст требуют сверки."},{"n":176,"title":"Ноготь","letter":"Н","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":79,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию.","sci":"AZ, №45. Практическая орфография и контекст требуют сверки."},{"n":177,"title":"Нос","letter":"Н","variants":[{"label":"I","form":"nune","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, 1 Кор 12:17","u":"https://zeno.fm/bible/DDNBIV/1CO/12/"}]},{"label":"II","form":"ninɛ","notes":["В перечне органов головы; написание отличается от nune NT."],"full":1,"status":"","examples":[{"k":1,"pid":"П46","head":"AL65, PDF с. 29","rst":false,"dendi":"Bom gonda hangayo, mɔɔize, ninɛ, mɛɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Голова имеет уши, глаза, нос, рот.","parse":"Bom — голова; gonda — иметь; hangayo — уши; форма источника с -yo; mɔɔize — глаза в данном перечислении органов головы; ninɛ — нос; mɛɛ — рот.","note":"Полное предложение из учебного описания тела. Число органов в русском переводе следует анатомическому перечислению; оно не приписывается единому суффиксу у всех дендийских слов. Здесь mɔɔize названо в ряду органов головы; специальное различие «глаз / зрачок» этим предложением отдельно не устанавливается."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]},{"label":"III","form":"nunɛ","notes":["Нос в рекомендациях не трогать лицо."],"full":1,"status":"","examples":[{"k":1,"pid":"П71","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo mɛɛ nna noo nunɛ daabu, de noo go tɔkɔɔ au noo go tisã.","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Прикрывайте ваши рот и нос, если [когда] вы кашляете или чихаете.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь «ваши»; mɛɛ — рот; nna — и; noo — форма адресата, здесь «ваш»; nunɛ — нос; daabu — закрывать, прикрывать; de — если, в этом контексте также «когда»; noo — форма адресата, субъект придаточной части; go — предглагольный показатель; tɔkɔɔ — кашлять; au — или; noo — форма адресата, субъект; go — предглагольный показатель; tisã — чихать.","note":"Полная фраза с придаточной частью после запятой. Текст памятки сохраняет повтор noo. В переводе показаны условное и временное прочтения de; из этого примера не выводится тождество de и всех слов «когда»."}],"refs":[{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"}]},{"label":"IV","form":"nunɛ̀","notes":["Нос, с низким тоном на последней гласной."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=3"}]},{"label":"V","form":"nùnɛ","notes":["Нос, с низким тоном на u; запись «заложенный нос»."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":75,"meaning":"nune — орган обоняния в ряду частей тела; самостоятельное словарное определение требует сверки.","sci":"H, §E №96, с. 36. Практическая орфография и контекст требуют сверки."},{"n":178,"title":"Ночь","letter":"Н","variants":[{"label":"I","form":"ciini","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мф 28:13","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"},{"t":"NT18, Ин 13:30","u":"https://zeno.fm/bible/DDNBIV/JHN/13/"}]},{"label":"II","form":"wiciri","notes":["В перечислении времени суток; дополнительная сверка контекста.","В повествовании П68 wiciri переводится «вечером». Диапазон «вечер/ночь» уточняется по контексту, не задаётся одной русской меткой."],"full":1,"status":"","examples":[{"k":1,"pid":"П68","head":"AL65, PDF и печ. с. 104","rst":false,"dendi":"Wiciri, à nɛɛra gunguriyo 65.","source":"AL65, PDF и печ. с. 104","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104","lit":"Вечером она продала 65 яиц.","parse":"Wiciri — вечером, контекстное время действия; à — она, Дама из предыдущего предложения; nɛɛra — продавать; gunguriyo — яйца, форма источника; 65 — число 65, цифровая запись.","note":"Полное предложение из задачи о торговке Даме (Dama). Значение wiciri уточняется как вечернее время в повествовании; не создаётся дублирующая статья к уже имеющемуся варианту wiciri. Число сохранено цифрами, его чтение на денди не реконструируется."}],"refs":[{"t":"AL65, PDF с. 87","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=87"},{"t":"AL65, PDF с. 104","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104"},{"t":"AL65, PDF с. 94","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=94"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":177,"meaning":"wiciri в торговых задачах — вечернее время; не универсальный эквивалент «ночь».","sci":"H, §E №121, с. 38. Практическая орфография и контекст требуют сверки."},{"n":179,"title":"Нюхать; чувствовать запах","letter":"Н","variants":[{"label":"","form":"mani","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, 1 Кор 12:17","u":"https://zeno.fm/bible/DDNBIV/1CO/12/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":105,"meaning":"mani — воспринимать запах; отличать от одноимённого вопросительного слова «где».","sci":"H, §E №202, с. 44. Практическая орфография и контекст требуют сверки."},{"n":180,"title":"О; об (тема речи)","letter":"О","variants":[{"label":"","form":"bɔm","notes":["В Baaba bɔm — об Отце. Не переведено «голова»: одно написание имеет разные функции в зависимости от конструкции."],"full":1,"status":"","examples":[{"k":1,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."}],"refs":[{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":181,"title":"Облако","letter":"О","variants":[{"label":"I","form":"buru","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 175","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=175"},{"t":"NT18, Откр 14:14","u":"https://zeno.fm/bible/DDNBIV/REV/14/"},{"t":"NT18, Мк 13:26","u":"https://zeno.fm/bible/DDNBIV/MRK/13/"}]},{"label":"II","form":"cinijibomyo","notes":["Облака, накапливающие воду; форма с -yo, сложное наименование."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL65, PDF с. 53","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=53"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":160,"sci":"H, §E №130, с. 38. Практическая орфография и контекст требуют сверки."},{"n":182,"title":"Огонь","letter":"О","variants":[{"label":"","form":"nini","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 108","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=108"},{"t":"NT18, Мф 3:11","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Евр 12:29","u":"https://zeno.fm/bible/DDNBIV/HEB/12/"},{"t":"NT18, Откр 20:14","u":"https://zeno.fm/bible/DDNBIV/REV/20/"},{"t":"NT18, 1 Кор 3:15","u":"https://zeno.fm/bible/DDNBIV/1CO/3/"},{"t":"NT18, Деян 2:3","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":167,"sci":"H, §E №125, с. 38. Практическая орфография и контекст требуют сверки."},{"n":183,"title":"Один","letter":"О","variants":[{"label":"I","form":"fɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:3","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"}]},{"label":"II","form":"fɔ́","notes":["Тоновая запись; встречается в сочетаниях с числительным и показателем определения."],"full":4,"status":"","examples":[{"k":1,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":2,"pid":"П39","head":"AL65, PDF с. 70","rst":false,"dendi":"Handu fɔ́ gonda azuma 4.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Один месяц имеет четыре недели.","parse":"Handu — месяц; fɔ́ — один; gonda — иметь; azuma — неделя; 4 — четыре; цифровая запись.","note":"Это приближённая учебная схема, а не утверждение, что каждый календарный месяц длится ровно четыре недели. Цифра не заменяется неподтверждённым дендийским названием числа."},{"k":3,"pid":"П40","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ kuna, jibiri 7 ya goono.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"В одной неделе имеются семь дней.","parse":"Azuma — неделя; fɔ́ — один; kuna — внутри; в; jibiri — день в календарной строке; 7 — семь; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Jibiri сохранено как в пособии; не исправлено автоматически на jiribi из иных текстов. Другие варианты статьи «День» не объявлены взаимозаменяемыми во всех сочетаниях."},{"k":4,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 31","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=31"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=100"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]},{"label":"III","form":"fo","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П42","head":"CAL, PDF с. 22","rst":false,"dendi":"Sooro fo ga, tuurinya 55 ya goono.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","lit":"В одном ряду имеются 55 деревянных элементов.","parse":"Sooro — ряд; fo — один; написание CAL; ga — в; пространственный элемент; tuurinya — деревянный элемент в строительной задаче; 55 — пятьдесят пять; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Печатная с. 41: задача о древесине для строительства. Здесь речь о строительных элементах, поэтому перевод «55 растущих деревьев» не используется. Форма tuurinya совпадает графически с вариантами растительного термина; значение устанавливается контекстом."}],"refs":[{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]},{"label":"IV","form":"fɔlɔnku","notes":["В религиозном перечислении: один/единый Господь, одна вера, одно крещение. Это не автоматическая замена fɔ во всех контекстах."],"full":1,"status":"","examples":[{"k":1,"pid":"П34","head":"NT95, Еф 4:5, PDF с. 127","rst":true,"dendi":"Kpe fɔlɔnku ya goono nda naane fɔlɔnku nda mirandiyom fɔlɔnku.","source":"NT95, Еф 4:5, PDF с. 127","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127","pub":"один Господь, одна вера, одно крещение,","lit":"Есть один Господь, одна вера и одно крещение.","parse":"Kpe — Господь; fɔlɔnku — один; единственный в данном перечислении; ya — выделительный элемент; goono — быть в наличии; nda — и; связь перечисления; naane — вера; mirandiyom — крещение; производная форма в религиозном контексте.","note":"Naane здесь существительное, как показывают параллельные именные группы. Mirandiyom не переведено как обычное мытьё. Fɔlɔnku не заменено редактором на fɔ."}],"refs":[{"t":"NT95, Еф 4:5, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П9","head":"","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."},{"k":2,"pid":"П63","head":"","rst":false,"dendi":"Iyaali fɔ́ bara nɔ̀ baabɛ, nyaa nda koo au kooyo.","source":"AL65, PDF и печ. с. 56","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56","lit":"Одна семья — это отец, мать и ребёнок или дети.","parse":"Iyaali — семья; fɔ́ — один, одна; bara — компонент связочной конструкции bara nɔ̀; nɔ̀ — компонент той же связочной конструкции; baabɛ — отец; nyaa — мать; nda — и; koo — ребёнок; au — или; kooyo — дети, форма источника.","note":"Полное определение из урока о семье; это учебное описание конкретного состава семьи, не универсальное этнографическое определение. Нетонированное bara сохранено. kooyo передано как форма множественного числа в этом контексте без самостоятельного обобщения правил суффиксации."},{"k":3,"pid":"П75","head":"","rst":false,"dendi":"Cìnɛ̀ kulu ga, kabuyom azansi zeenɔ fɔ́ goono.","source":"AL65, PDF и печ. с. 33","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=33","lit":"В каждом языке есть один старый [традиционный] способ счёта.","parse":"Cìnɛ̀ — язык общения; kulu — каждый, весь; ga — на, в; послелог; kabuyom — счёт, действие счёта; azansi — способ; zeenɔ — старый, здесь традиционный; fɔ́ — один, некий; goono — имеется.","note":"Полное утверждение из раздела о традиционном счёте. «Традиционный» уточняет контекст zeenɔ. Тоновое написание Cìnɛ̀ не подменено cinɛ; kabuyom — название действия, не глагол kabu."},{"k":4,"pid":"П84","head":"","rst":false,"dendi":"Ali nà mɔnturu fɔ́ dei F 8500 magazɛ̃ kuna.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али купил одни часы за 8500 франков в магазине.","parse":"Ali — Али, имя персонажа; nà — показатель переходного действия; mɔnturu — часы, прибор; fɔ́ — один; dei — покупать; F — обозначение франка в источнике; 8500 — цифровая запись числа 8500; magazɛ̃ — магазин; kuna — внутри, в.","note":"Полное первое предложение задачи о прибыли. mɔnturu соотносится по значению с agogo в CAL, сохраняя свою запись. Русское «одни часы» не означает множественное число слова денди. F — условное обозначение валюты, не реконструированное слово."},{"k":5,"pid":"П89","head":"","rst":true,"dendi":"Ikpɛ na bɔrɔ fɔ dɔntɔm, à maa no Yohana.","source":"NT18, Ин 1:6","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Был человек, посланный от Бога; имя ему Иоанн.","lit":"Бог послал одного человека, его имя — Иоанн.","parse":"Ikpɛ — Бог; na — показатель переходного действия; bɔrɔ — человек; fɔ — один, некий; dɔntɔm — посылать; à — он, здесь его; maa —
