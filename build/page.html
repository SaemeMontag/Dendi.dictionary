ated":"П88."},{"n":238,"title":"Презирать","letter":"П","variants":[{"label":"","form":"fɛntɛ","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П58","head":"NT18, 1 Фес 5:20","rst":true,"dendi":"Wa si andebitɛrɛ fɛntɛ.","source":"NT18, 1 Фес 5:20","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Пророчества не уничижайте.","lit":"Не презирайте пророчество.","parse":"Wa — побуждение к адресатам; si — отрицание; andebitɛrɛ — пророчество, пророческое высказывание; fɛntɛ — презирать, пренебрегать.","note":"Целое отрицательное побуждение. andebitɛrɛ — отвлечённое/деятельностное название, не andebi «пророк». Множественное число русского параллельного текста не переносится на форму денди."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Презирать, пренебрегать; глагол в отрицательном побуждении.","related":"П58."},{"n":239,"title":"Прекращение","letter":"П","variants":[{"label":"","form":"cɛyom","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П57","head":"NT18, 1 Фес 5:17","rst":true,"dendi":"Wo ka aduwa tɛ, cɛyom si.","source":"NT18, 1 Фес 5:17","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Непрестанно молитесь.","lit":"Совершайте молитву, прекращения нет.","parse":"Wo — побуждение к адресатам; ka — связующий элемент при действии; aduwa — молитва; tɛ — делать, совершать; cɛyom — прекращение, перерыв; si — отрицание наличия, здесь «нет».","note":"Полная фраза включает обе части, разделённые запятой. aduwa tɛ буквально «делать молитву», по-русски «молиться». Постпозиционное si в cɛyom si отличается от позиции si перед глаголом; здесь не следует восстанавливать несуществующее слово «непрестанно»."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Прекращение, перерыв; контекст cɛyom si «прекращения нет». Значение ограничено подтверждённым сочетанием.","related":"П57."},{"n":240,"title":"Препарат","letter":"П","variants":[{"label":"","form":"safari","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П70","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Средство, препарат; в П70 средство, содержащее спирт. Само слово не означает исключительно спиртовой антисептик.","related":"П70."},{"n":241,"title":"При","letter":"П","variants":[{"label":"I","form":"gaa","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 28:3","u":"https://zeno.fm/bible/DDNBIV/ACT/28/"}]},{"label":"II","form":"ga","notes":["Послелог: на/при; контекстное соответствие."],"full":1,"status":"","examples":[{"k":1,"pid":"П73","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Lamba 12 ya goono agogo ga","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Двенадцать чисел находятся на часах [циферблате].","parse":"Lamba — число, номер; 12 — число 12, цифровая запись; ya — выделительный элемент; goono — находиться, быть в наличии; agogo — часы; ga — на, при; послелог.","note":"Самостоятельное утверждение в описании циферблата; в источнике строка без конечной точки. Значение lamba относится к числам/номерам на циферблате. ga здесь послелог после существительного, не предглагольный показатель ga. Чтение цифрового 12 не подставлено."}],"refs":[{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"AL65, PDF с. 102","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=102"}]},{"label":"III","form":"gà","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П75","head":"","rst":false,"dendi":"Cìnɛ̀ kulu ga, kabuyom azansi zeenɔ fɔ́ goono.","source":"AL65, PDF и печ. с. 33","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=33","lit":"В каждом языке есть один старый [традиционный] способ счёта.","parse":"Cìnɛ̀ — язык общения; kulu — каждый, весь; ga — на, в; послелог; kabuyom — счёт, действие счёта; azansi — способ; zeenɔ — старый, здесь традиционный; fɔ́ — один, некий; goono — имеется.","note":"Полное утверждение из раздела о традиционном счёте. «Традиционный» уточняет контекст zeenɔ. Тоновое написание Cìnɛ̀ не подменено cinɛ; kabuyom — название действия, не глагол kabu."}],"stray":[],"kind":"swadesh","swadesh":201,"meaning":"gaa — на/при; постпозиционное употребление зависит от конструкции."},{"n":242,"title":"Признак; симптом","letter":"П","variants":[{"label":"","form":"màanayo","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П20","head":"COV, PDF с. 2","rst":false,"dendi":"Ifɔ̀yo ya ci COFID-19 màanayo?","source":"COV, PDF с. 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2","lit":"Какие [вещи] являются признаками COVID-19?","parse":"Ifɔ̀yo — какие?; форма с -yo сохранена; ya — выделительный элемент; ci — являться; COFID-19 — COVID-19; màanayo — признаки / симптомы в данном контексте.","note":"Русский буквальный перевод сохраняет вопросительную именную конструкцию; естественный смысл — «Каковы симптомы COVID-19?». Морфологическая классификация -yo отдельно не завершена; не смешивать этот пример с нейтральной словарной основой."}],"refs":[{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Контекстная форма с -yo из памятки. Самостоятельная нетонированная основа и разложение не восстановлены по догадке."},{"n":243,"title":"Прикрывать","letter":"П","variants":[{"label":"","form":"daabu; banda daabu","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П64","head":"AL65, PDF и печ. с. 13","rst":false,"dendi":"Iri mà iri ŋwaariyo banda daabu.","source":"AL65, PDF и печ. с. 13","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=13","lit":"Давайте прикроем нашу пищу.","parse":"Iri — мы; mà — побудительный показатель; iri — наш, буквально «мы» в определении; ŋwaariyo — пища, еда; banda — компонент сочетания banda daabu «прикрыть»; daabu — закрывать, прикрывать.","note":"Полное заглавие учебного занятия о защите пищи; оно имеет форму побуждения. banda daabu переведено как сочетание. Отдельное пространственное значение banda здесь не установлено и не подменено «спиной». Словоразделы нормализованы без изменения букв и тонов."},{"k":2,"pid":"П71","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo mɛɛ nna noo nunɛ daabu, de noo go tɔkɔɔ au noo go tisã.","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Прикрывайте ваши рот и нос, если [когда] вы кашляете или чихаете.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь «ваши»; mɛɛ — рот; nna — и; noo — форма адресата, здесь «ваш»; nunɛ — нос; daabu — закрывать, прикрывать; de — если, в этом контексте также «когда»; noo — форма адресата, субъект придаточной части; go — предглагольный показатель; tɔkɔɔ — кашлять; au — или; noo — форма адресата, субъект; go — предглагольный показатель; tisã — чихать.","note":"Полная фраза с придаточной частью после запятой. Текст памятки сохраняет повтор noo. В переводе показаны условное и временное прочтения de; из этого примера не выводится тождество de и всех слов «когда»."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Закрывать, прикрывать. daabu употреблено с частями лица (П71), сочетание banda daabu — с пищей (П64). banda здесь имеет ссылку на конструкцию, без неподтверждённого перевода отдельной морфемы.","related":"П64, П71."},{"n":244,"title":"Принимать","letter":"П","variants":[{"label":"","form":"ta","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П91","head":"NT18, Ин 1:11","rst":true,"dendi":"À kaa nga ŋmɔne yom dɔ amma ǹ mana à ta.","source":"NT18, Ин 1:11","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Пришел к своим, и свои Его не приняли.","lit":"Он пришёл к своим, но они его не приняли.","parse":"À — он; kaa — приходить; nga — он, здесь притяжательная отсылка; ŋmɔne — собственный, свой; yom — показатель множественности; dɔ — к, в сфере указанного лица или группы; amma — но; ǹ — они; mana — отрицание; à — он, здесь его; ta — принимать.","note":"Полное предложение. nga ŋmɔne yom — «свои» как группа людей; слово «люди» отдельно не выражено. kaa здесь глагол прихода, в отличие от предглагольного употребления в П88. dɔ разбирается как послелог этой конструкции."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Принимать кого-либо; отрицательное употребление в П91.","related":"П91."},{"n":245,"title":"Приносить","letter":"П","variants":[{"label":"I","form":"kaanda","notes":["Переносно: приносить терпение, давать результат. Не kaa «приходить»."],"full":1,"status":"","examples":[{"k":1,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."}],"refs":[{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]},{"label":"II","form":"kanda","notes":["В AL65 с. 51 kanda с одним a; долгота не достраивается по kaanda из NT95. Различие источниковых записей сохранено."],"full":1,"status":"","examples":[{"k":1,"pid":"П77","head":"AL65, PDF и печ. с. 51","rst":false,"dendi":"Sambɔ kanda gunguriyo 224, Ruga kanda 144.","source":"AL65, PDF и печ. с. 51","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51","lit":"Самбо принёс 224 яйца, Руга принёс 144 [яйца].","parse":"Sambɔ — Самбо, имя персонажа; kanda — приносить; gunguriyo — яйца; 224 — цифровая запись числа 224; Ruga — Руга, имя персонажа; kanda — приносить; 144 — цифровая запись числа 144.","note":"Целое предложение с обеими частями. По соседней фразе персонажи пришли на рынок; предмет второго действия восстанавливается из первой части. kanda с одним a не исправлено в kaanda из П35. Чтение чисел не реконструируется."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":246,"title":"Приходить","letter":"П","variants":[{"label":"I","form":"kaa","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П91","head":"NT18, Ин 1:11","rst":true,"dendi":"À kaa nga ŋmɔne yom dɔ amma ǹ mana à ta.","source":"NT18, Ин 1:11","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Пришел к своим, и свои Его не приняли.","lit":"Он пришёл к своим, но они его не приняли.","parse":"À — он; kaa — приходить; nga — он, здесь притяжательная отсылка; ŋmɔne — собственный, свой; yom — показатель множественности; dɔ — к, в сфере указанного лица или группы; amma — но; ǹ — они; mana — отрицание; à — он, здесь его; ta — принимать.","note":"Полное предложение. nga ŋmɔne yom — «свои» как группа людей; слово «люди» отдельно не выражено. kaa здесь глагол прихода, в отличие от предглагольного употребления в П88. dɔ разбирается как послелог этой конструкции."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:1","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Ин 14:18","u":"https://zeno.fm/bible/DDNBIV/JHN/14/"},{"t":"NT18, Лк 23:52","u":"https://zeno.fm/bible/DDNBIV/LUK/23/"},{"t":"NT18, Мк 13:36","u":"https://zeno.fm/bible/DDNBIV/MRK/13/"}]},{"label":"II","form":"kàà","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П82","head":"AL65, PDF и печ. с. 70","rst":false,"dendi":"Jiiri nuusamtɛ cin kàà nɔ̀ jiiri 4 kulu nga à gonda jibiri 366.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Високосный год приходит каждые четыре года, и в нём 366 дней.","parse":"Jiiri — год; nuusamtɛ — високосный; cin — показатель обычного повторяющегося действия в этом контексте; kàà — приходить; nɔ̀ — предикативно-выделительный элемент; jiiri — год; 4 — цифровая запись числа 4; kulu — каждый, весь; nga — связь частей, здесь «и»; à — он, год; gonda — иметь; jibiri — день; 366 — цифровая запись числа 366.","note":"Полное утверждение из календарного урока. Это упрощённая формулировка учебника: исключения календарного правила цитата не описывает. На с. 76 в упражнении встречается перестановка подписей; она не используется для переопределения nuusamtɛ и kubantɛ. nga здесь связывает части, а à занимает позицию субъекта."}],"refs":[{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=100"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":122,"sci":"H, §E №174, с. 41. Практическая орфография и контекст требуют сверки."},{"n":247,"title":"Проверять","letter":"П","variants":[{"label":"","form":"yaase guna","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П59","head":"NT18, 1 Фес 5:21","rst":true,"dendi":"Wa hɛ kulu yaase guna, ka ihinnɔ dii ka jɛ.","source":"NT18, 1 Фес 5:21","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Все испытывайте, хорошего держитесь.","lit":"Всё проверьте, а хорошее возьмите и удерживайте.","parse":"Wa — побуждение к адресатам; hɛ — вещь, нечто; kulu — всё; yaase — проверить, испытать в сочетании yaase guna; guna — смотреть, в сочетании «проверить»; ka — связь действий; ihinnɔ — хорошее; dii — взять, ухватить; ka — связь действий; jɛ — держать, сохранять.","note":"Взято всё предложение, а не его часть до запятой. yaase guna рассматривается совместно как «проверить»; отдельные оттенки yaase не объявляются исчерпывающе установленными. dii здесь не di «видеть» и не dii «гореть». ihinnɔ — субстантивированное «хорошее», без подстановки иной записи hinno."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Проверять, испытывать; сочетание двух слов. В П59 yaase разбирается внутри сочетания, самостоятельный диапазон его значений не установлен.","related":"П59."},{"n":248,"title":"Продавать","letter":"П","variants":[{"label":"","form":"nɛɛra","notes":[],"full":4,"status":"","examples":[{"k":1,"pid":"П68","head":"AL65, PDF и печ. с. 104","rst":false,"dendi":"Wiciri, à nɛɛra gunguriyo 65.","source":"AL65, PDF и печ. с. 104","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104","lit":"Вечером она продала 65 яиц.","parse":"Wiciri — вечером, контекстное время действия; à — она, Дама из предыдущего предложения; nɛɛra — продавать; gunguriyo — яйца, форма источника; 65 — число 65, цифровая запись.","note":"Полное предложение из задачи о торговке Даме (Dama). Значение wiciri уточняется как вечернее время в повествовании; не создаётся дублирующая статья к уже имеющемуся варианту wiciri. Число сохранено цифрами, его чтение на денди не реконструируется."},{"k":2,"pid":"П78","head":"AL65, PDF и печ. с. 51","rst":false,"dendi":"Handu wɔ̀ kuna, à nɛɛra 340.","source":"AL65, PDF и печ. с. 51","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51","lit":"В этом месяце он [комитет] продал 340 [килограммов хлопка].","parse":"Handu — месяц; wɔ̀ — этот; kuna — в, внутри; à — он, отсылка к комитету; nɛɛra — продавать; 340 — цифровая запись числа 340.","note":"Целое предложение из задачи о деревенском комитете Бирини-Лафиа. В предыдущем предложении названы хлопок и kg 250 за прошлый месяц. После 340 в цитате нет ни kg, ни слова «хлопок»: они добавлены только в квадратных скобках перевода."},{"k":3,"pid":"П79","head":"AL65, PDF и печ. с. 55","rst":false,"dendi":"Susuba à nà 48 nɛɛra.","source":"AL65, PDF и печ. с. 55","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=55","lit":"Утром он продал 48 [книг].","parse":"Susuba — утром; à — он, продавец книг; nà — показатель переходного действия; 48 — цифровая запись числа 48; nɛɛra — продавать.","note":"Законченное предложение в задаче о магазине книг, где первоначально было 68 книг. «Книг» восстановлено из предыдущего предложения. Отсутствие пробела после точки в печати не меняет границу предложения."},{"k":4,"pid":"П85","head":"AL65, PDF и печ. с. 106","rst":false,"dendi":"Ali nà mɔnturu di yeti ka nɛɛra F 9300.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али затем перепродал эти часы за 9300 франков.","parse":"Ali — Али; nà — показатель переходного действия; mɔnturu — часы; di — определительный элемент; yeti — снова, повторно в сочетании yeti ka; ka — связь действий; nɛɛra — продавать; F — обозначение франка; 9300 — цифровая запись числа 9300.","note":"Полное второе предложение той же задачи; П84 сообщает о покупке. yeti ka nɛɛra в этом контексте передано как «перепродать». Из одного примера не выводится самостоятельное значение yeti «возвращать» во всех контекстах."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Продавать; в задаче о продаже яиц. Долгота ɛɛ сохранена.","related":"П68."},{"n":249,"title":"Пророк","letter":"П","variants":[{"label":"","form":"Andebi, andebi","notes":["В П29 Andebi hinka обозначает двух пророков; в П44 andebi di относится к одному ожидаемому пророку. Написание подтверждено обоими полными контекстами, а не реконструировано.","В П44 andebi di относится к одному ожидаемому пророку, в П29 Andebi hinka — к нескольким. Базовое написание andebi теперь подтверждено полным вопросом, а не восстановлено по догадке."],"full":2,"status":"","examples":[{"k":1,"pid":"П29","head":"NT95, 1 Кор 14:29, PDF с. 114","rst":true,"dendi":"Andebi hinka wala ihinza mo ma sendi.","source":"NT95, 1 Кор 14:29, PDF с. 114","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114","pub":"И пророки пусть говорят двое или трое, а прочие пусть рассуждают.","lit":"Двое пророков или трое также пусть говорят.","parse":"Andebi — пророки; hinka — два; wala — или; ihinza — трое; форма при обозначении людей; mo — также; ma — побудительный/желательный показатель; sendi — говорить.","note":"Это полное первое предложение дендийского стиха. Русский параллельный стих также включает указание прочим слушателям; оно не добавлено в дословный перевод отсутствующей здесь второй фразы."},{"k":2,"pid":"П44","head":"NT95, Ин 1:21, PDF с. 60","rst":true,"dendi":"Ǹ cii: Ni no andebi di? À tu ka cii. Awo.","source":"NT95, Ин 1:21, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"Пророк? Он отвечал: нет.","lit":"Они сказали: ты — тот пророк? Он ответил: нет.","parse":"Ǹ — они; cii — сказать; Ni — ты; no — предикативный элемент; andebi — пророк; di — определительный элемент; À — он; tu — ответить; ka — связь действий; Awo — нет.","note":"Вопрос без ba и dee; ответ Awo приведён вместе с вопросом. Перед Awo в издании напечатана точка после cii; она сохранена, хотя русский перевод оформляет ответ двоеточием. Cii во второй части также означает «сказать». Полный русский стих включает предшествующий вопрос об Илии; здесь приведена соответствующая часть."}],"refs":[{"t":"NT95, 1 Кор 14:29, PDF с. 114","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114"},{"t":"NT95, Ин 1:21, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":250,"title":"Пророчество","letter":"П","variants":[{"label":"","form":"andebitɛrɛ","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П58","head":"NT18, 1 Фес 5:20","rst":true,"dendi":"Wa si andebitɛrɛ fɛntɛ.","source":"NT18, 1 Фес 5:20","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Пророчества не уничижайте.","lit":"Не презирайте пророчество.","parse":"Wa — побуждение к адресатам; si — отрицание; andebitɛrɛ — пророчество, пророческое высказывание; fɛntɛ — презирать, пренебрегать.","note":"Целое отрицательное побуждение. andebitɛrɛ — отвлечённое/деятельностное название, не andebi «пророк». Множественное число русского параллельного текста не переносится на форму денди."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Пророчество, пророческая речь. Сопоставляется с andebi «пророк», но не подменяется этим словом.","related":"П58."},{"n":251,"title":"Проходить","letter":"П","variants":[{"label":"","form":"bisa","notes":["Движение мимо/через место; не приравнено ко всем значениям «ходить»."],"full":1,"status":"","examples":[{"k":1,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."}],"refs":[{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":252,"title":"Прямой","letter":"П","variants":[{"label":"","form":"cɛandi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 3:4","u":"https://zeno.fm/bible/DDNBIV/LUK/3/"},{"t":"NT18, Лк 3:5","u":"https://zeno.fm/bible/DDNBIV/LUK/3/"},{"t":"NT18, Мф 3:3","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Мк 1:3","u":"https://zeno.fm/bible/DDNBIV/MRK/1/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":189,"meaning":"cɛandi — сделать прямым; не самостоятельное прилагательное.","sci":"H, §E №160, с. 41. Практическая орфография и контекст требуют сверки."},{"n":253,"title":"Птица","letter":"П","variants":[{"label":"","form":"ciro","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 27","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=27"},{"t":"NT18, Мф 10:29","u":"https://zeno.fm/bible/DDNBIV/MAT/10/"},{"t":"NT18, Лк 12:7","u":"https://zeno.fm/bible/DDNBIV/LUK/12/"},{"t":"NT18, Рим 1:23","u":"https://zeno.fm/bible/DDNBIV/ROM/1/"},{"t":"NT18, Мк 4:4","u":"https://zeno.fm/bible/DDNBIV/MRK/4/"},{"t":"NT18, Деян 10:12","u":"https://zeno.fm/bible/DDNBIV/ACT/10/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":46,"sci":"H, §E №72, с. 35. Практическая орфография и контекст требуют сверки."},{"n":254,"title":"Пыль","letter":"П","variants":[{"label":"","form":"kuso","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 10:11","u":"https://zeno.fm/bible/DDNBIV/LUK/10/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":158,"meaning":"kuso — пыль на ногах.","sci":"H, §E №133, с. 38. Практическая орфография и контекст требуют сверки."},{"n":255,"title":"Пятница","letter":"П","variants":[{"label":"","form":"azuma","notes":["Название дня в полном недельном перечне AL65. Тон в этой записи не обозначен."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":256,"title":"Пять","letter":"П","variants":[{"label":"I","form":"gu","notes":["Печатная с. 46: dala gu = d.5; числительное подтверждено числовой подписью."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 172","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=172"},{"t":"NT18, Откр 9:10","u":"https://zeno.fm/bible/DDNBIV/REV/9/"},{"t":"CAL, PDF с. 25","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=25"},{"t":"NT18, Мк 6:44","u":"https://zeno.fm/bible/DDNBIV/MRK/6/"},{"t":"NT18, Лк 19:19","u":"https://zeno.fm/bible/DDNBIV/LUK/19/"}]},{"label":"II","form":"gúú","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL64, PDF с. 10","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=10"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":26,"meaning":"Среди примеров встречаются сложные слова и числительные с данным компонентом; значение целого шире значения основы.","sci":"H, §E №215, с. 45. Практическая орфография и контекст требуют сверки."},{"n":257,"title":"Работа","letter":"Р","variants":[{"label":"","form":"gwei","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П81","head":"AL65, PDF и печ. с. 61","rst":false,"dendi":"Cìi gwei ka n go tɛɛ.","source":"AL65, PDF и печ. с. 61","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=61","lit":"Скажи, какую работу ты делаешь.","parse":"Cìi — сказать, скажи; gwei — работа, действие; ka — относительная связь; n — ты; go — предглагольный показатель; tɛɛ — делать.","note":"Полный самостоятельный пункт упражнения. Буквальная структура: «назови работу, которую ты делаешь». Относительное ka не становится вопросительной частицей от русского перевода «какую». Долгое ɛɛ сохранено."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Работа, выполняемое действие; gwei tɛɛ «делать работу». Не смешивается автоматически с иной записью gbei.","related":"П81."},{"n":258,"title":"Радоваться","letter":"Р","variants":[{"label":"","form":"farihã","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П56","head":"NT18, 1 Фес 5:16","rst":true,"dendi":"Wo farihã saa kulu.","source":"NT18, 1 Фес 5:16","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Всегда радуйтесь.","lit":"Радуйтесь во всякое время.","parse":"Wo — побуждение к адресатам, написание этого стиха; farihã — радоваться; saa — время; kulu — всё, всякое.","note":"Самостоятельное наставление среди заключительных призывов послания. saa kulu — «во всякое время, всегда». Wo сохранено по источнику, не исправлено в Wa и не смешивается с указательным wo из П43."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Радоваться; глагольное употребление в наставлении. Носовой гласный ã сохранён.","related":"П56."},{"n":259,"title":"Расщеплять","letter":"Р","variants":[{"label":"","form":"ceeri","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 19:32","u":"https://zeno.fm/bible/DDNBIV/JHN/19/"},{"t":"NT18, Ин 19:33","u":"https://zeno.fm/bible/DDNBIV/JHN/19/"},{"t":"NT18, Ин 19:31","u":"https://zeno.fm/bible/DDNBIV/JHN/19/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":115,"meaning":"ceeri — сломать/разделить, о ногах. Не точное подтверждение расщепления дерева."},{"n":260,"title":"Рвать (испытывать рвоту)","letter":"Р","variants":[{"label":"","form":"yeeri","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Откр 3:16","u":"https://zeno.fm/bible/DDNBIV/REV/3/"},{"t":"NT18, 2 Пет 2:22","u":"https://zeno.fm/bible/DDNBIV/2PE/2/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":97,"sci":"H, §E №205, с. 44. Практическая орфография и контекст требуют сверки."},{"n":261,"title":"Ребёнок","letter":"Р","variants":[{"label":"I","form":"ize","notes":["Здесь подтверждено «сын/потомок»; универсальный эквивалент «ребёнок» требует отдельного подтверждения."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 5","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=5"},{"t":"NT18, Мф 3:9","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"}]},{"label":"II","form":"koo","notes":["В П63 также kooyo «дети» — форма того же слова в источнике."],"full":1,"status":"","examples":[{"k":1,"pid":"П63","head":"AL65, PDF и печ. с. 56","rst":false,"dendi":"Iyaali fɔ́ bara nɔ̀ baabɛ, nyaa nda koo au kooyo.","source":"AL65, PDF и печ. с. 56","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56","lit":"Одна семья — это отец, мать и ребёнок или дети.","parse":"Iyaali — семья; fɔ́ — один, одна; bara — компонент связочной конструкции bara nɔ̀; nɔ̀ — компонент той же связочной конструкции; baabɛ — отец; nyaa — мать; nda — и; koo — ребёнок; au — или; kooyo — дети, форма источника.","note":"Полное определение из урока о семье; это учебное описание конкретного состава семьи, не универсальное этнографическое определение. Нетонированное bara сохранено. kooyo передано как форма множественного числа в этом контексте без самостоятельного обобщения правил суффиксации."}],"refs":[{"t":"NT18, Мф 23:37","u":"https://zeno.fm/bible/DDNBIV/MAT/23/"},{"t":"AL65, PDF с. 23","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=23"},{"t":"AL65, PDF с. 99","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=99"},{"t":"AL65, PDF с. 98","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=98"},{"t":"AL65, PDF с. 95","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=95"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П8","head":"","rst":true,"dendi":"À na ci Dafidi ize di dee?","source":"NT95, MAT 12:23, PDF с. 12","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12","pub":"не это ли Христос, сын Давидов?","lit":"Не является ли он тем сыном Давида?","parse":"À — он; na — отрицательная функция в данном сочетании; не смешивать с показателем переходного действия; ci — являться; Dafidi — Давид; ize — сын / потомок; di — определительный элемент; dee — вопросительная частица.","note":"В опубликованном русском тексте добавлено именование «Христос»; в этой дендийской фразе слова Mɛsiya нет."}],"stray":[],"kind":"swadesh","swadesh":39,"meaning":"koo подтверждено о детях; ize — также «сын, потомок»."},{"n":262,"title":"Регулярно","letter":"Р","variants":[{"label":"","form":"sãasãa","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П70","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Регулярно, часто; обстоятельственная характеристика мытья рук. Носовые гласные сохраняются.","related":"П70."},{"n":263,"title":"Резать","letter":"Р","variants":[{"label":"I","form":"dumbu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 112","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=112"},{"t":"NT18, Мк 9:43","u":"https://zeno.fm/bible/DDNBIV/MRK/9/"},{"t":"AL65, PDF с. 78","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=78"},{"t":"AL65, PDF с. 55","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=55"},{"t":"NT18, Деян 27:32","u":"https://zeno.fm/bible/DDNBIV/ACT/27/"}]},{"label":"II","form":"zenji-zenji","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 26:26","u":"https://zeno.fm/bible/DDNBIV/MAT/26/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":114,"sci":"H, §E №179, с. 42. Практическая орфография и контекст требуют сверки."},{"n":264,"title":"Результат","letter":"Р","variants":[{"label":"","form":"nufi","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П66","head":"AL65, PDF и печ. с. 66","rst":false,"dendi":"N mà nufi hantum ka cou.","source":"AL65, PDF и печ. с. 66","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=66","lit":"Запиши результат и прочитай [его].","parse":"N — ты; mà — побудительный показатель; nufi — результат; hantum — писать, записывать; ka — связь действий; cou — читать.","note":"Полная инструкция к арифметическому заданию. Дополнение «его» в русском восстановлено из контекста и заключено в скобки: отдельного местоимения после cou нет."},{"k":2,"pid":"П83","head":"AL65, PDF и печ. с. 78","rst":false,"dendi":"Nufi di hantum ka cii.","source":"AL65, PDF и печ. с. 78","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=78","lit":"Запиши этот результат и назови [его].","parse":"Nufi — результат; di — определительный элемент, этот; hantum — записывать; ka — связь действий; cii — сказать, назвать.","note":"Полная инструкция после задачи о делении; в печати hantumka без пробела — словораздел нормализован. Соседняя формула содержит несовпадающие 249 и 239: числовая опечатка не исправляется и не переносится в выбранную словесную инструкцию."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Результат; в инструкции к арифметическому заданию.","related":"П66."},{"n":265,"title":"Река","letter":"Р","variants":[{"label":"","form":"isa","notes":["В контексте реки; варианты isayo имеют -yo."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 173","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=173"},{"t":"NT18, Мф 3:5","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 17","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17"},{"t":"AL65, PDF с. 69","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=69"},{"t":"NT18, Откр 16:4","u":"https://zeno.fm/bible/DDNBIV/REV/16/"}]}],"extra_refs"
