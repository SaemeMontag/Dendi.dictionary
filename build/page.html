ll":1,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."}],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"}]},{"label":"III","form":"hinnɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 13:8","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, Мф 7:17","u":"https://zeno.fm/bible/DDNBIV/MAT/7/"}]},{"label":"IV","form":"hɛnnɔ","notes":["О чистой/доброкачественной воде и пище; не универсальная замена boori."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"AL65, PDF с. 99","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=99"},{"t":"AL65, PDF с. 93","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=93"},{"t":"AL65, PDF с. 91","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=91"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":185,"meaning":"boori — быть хорошим; hinnɔ — хороший, о плодах и почве. Различается грамматика."},{"n":295,"title":"Царапать","letter":"Ц","variants":[],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":117,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":296,"title":"Цветок","letter":"Ц","variants":[{"label":"","form":"boosi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Иак 1:10","u":"https://zeno.fm/bible/DDNBIV/JAS/1/"},{"t":"NT18, 1 Пет 1:24","u":"https://zeno.fm/bible/DDNBIV/1PE/1/"},{"t":"NT18, Иак 1:11","u":"https://zeno.fm/bible/DDNBIV/JAS/1/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":59,"sci":"H, §E №58, с. 34. Практическая орфография и контекст требуют сверки."},{"n":297,"title":"Частица вопроса: ba","letter":"Ч","variants":[{"label":"","form":"ba","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке."],"full":null,"status":"","examples":[{"k":1,"pid":"П1","head":"NT18, 1CO 7:27","rst":true,"dendi":"N gunda wɛndɛ ba?","source":"NT18, 1CO 7:27","source_url":"https://zeno.fm/bible/DDNBIV/1CO/7/","pub":"Соединен ли ты с женою?","lit":"Ты имеешь жену?","parse":"N — ты; gunda — иметь; wɛndɛ — жена; ba — вопросительная частица."},{"k":2,"pid":"П2","head":"NT18, 1CO 7:27","rst":true,"dendi":"N sinda wɛndɛ ba?","source":"NT18, 1CO 7:27","source_url":"https://zeno.fm/bible/DDNBIV/1CO/7/","pub":"Остался ли без жены?","lit":"Ты не имеешь жены?","parse":"N — ты; sinda — не иметь; wɛndɛ — жена; ba — вопросительная частица."},{"k":3,"pid":"П3","head":"NT18, MRK 15:4","rst":true,"dendi":"N si tu ba?","source":"NT18, MRK 15:4","source_url":"https://zeno.fm/bible/DDNBIV/MRK/15/","pub":"Ты ничего не отвечаешь?","lit":"Ты не отвечаешь?","parse":"N — ты; si — отрицание; tu — отвечать; ba — вопросительная частица."},{"k":4,"pid":"П4","head":"NT18, 2CO 11:22","rst":true,"dendi":"Eburu yom no ba?","source":"NT18, 2CO 11:22","source_url":"https://zeno.fm/bible/DDNBIV/2CO/11/","pub":"Они Евреи?","lit":"[Они] евреи?","parse":"Eburu — еврей; yom — показатель множественности; no — предикативный элемент; ba — вопросительная частица.","note":"Отдельного подлежащего «они» в этой фразе нет; оно восстановлено в русском переводе по контексту."},{"k":5,"pid":"П5","head":"NT18, ROM 14:22","rst":true,"dendi":"N gunda naane ba?","source":"NT18, ROM 14:22","source_url":"https://zeno.fm/bible/DDNBIV/ROM/14/","pub":"Ты имеешь веру?","lit":"Ты имеешь веру?","parse":"N — ты; gunda — иметь; naane — вера; ba — вопросительная частица."},{"k":6,"pid":"П10","head":"NT18, ACT 21:37","rst":true,"dendi":"N ŋmaani Garɛku cine ba?","source":"NT18, ACT 21:37","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"ты знаешь по‐гречески?","lit":"Ты владеешь греческим языком?","parse":"N — ты; ŋmaani — владеть языком / говорить на языке в этом употреблении; Garɛku — греческий; cine — язык; ba — вопросительная частица.","note":"Омографическое ŋmaani «иной» в других местах не смешано с этим употреблением. В NT95, PDF с. 92, в том же вопросе напечатано cinɛ. Это два издания одного контекста."}],"refs":[{"t":"NT18, 1 Кор 7:27","u":"https://zeno.fm/bible/DDNBIV/1CO/7/"},{"t":"NT18, Мк 15:4","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"}]}],"extra_refs":[{"t":"NT18, 2 Кор 11:22","u":"https://zeno.fm/bible/DDNBIV/2CO/11/"},{"t":"NT18, Рим 14:22","u":"https://zeno.fm/bible/DDNBIV/ROM/14/"}],"stray":[],"kind":"extra","meaning":"Следует за основной предикацией в проверенных вопросах. Отличие от dee по ожиданию ответа не установлено."},{"n":298,"title":"Частица вопроса: dee","letter":"Ч","variants":[{"label":"","form":"dee","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке."],"full":4,"status":"","examples":[{"k":1,"pid":"П6","head":"NT95, JHN 11:26, PDF с. 68","rst":true,"dendi":"N go cimandi nga di gaa dee?","source":"NT95, JHN 11:26, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"Веришь ли сему?","lit":"Ты считаешь это истинным?","parse":"N — ты; go — предглагольный показатель; cimandi — признавать истинным / верить; nga — то / оно; di — указательный элемент; gaa — послелог объекта отношения; dee — вопросительная частица.","note":"Сочетание nga di gaa передаёт объект веры; послелог не имеет здесь отдельного русского «на»."},{"k":2,"pid":"П7","head":"NT95, JHN 4:29, PDF с. 62","rst":true,"dendi":"À mana ci Mɛsiya dee?","source":"NT95, JHN 4:29, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"не Он ли Христос?","lit":"Не является ли он Мессией?","parse":"À — он; mana — отрицательное предикативное употребление; ci — являться; Mɛsiya — Мессия; dee — вопросительная частица.","note":"Ожидание подтверждения возможно по контексту, но не объявляется значением dee во всех вопросах."},{"k":3,"pid":"П8","head":"NT95, MAT 12:23, PDF с. 12","rst":true,"dendi":"À na ci Dafidi ize di dee?","source":"NT95, MAT 12:23, PDF с. 12","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12","pub":"не это ли Христос, сын Давидов?","lit":"Не является ли он тем сыном Давида?","parse":"À — он; na — отрицательная функция в данном сочетании; не смешивать с показателем переходного действия; ci — являться; Dafidi — Давид; ize — сын / потомок; di — определительный элемент; dee — вопросительная частица.","note":"В опубликованном русском тексте добавлено именование «Христос»; в этой дендийской фразе слова Mɛsiya нет."},{"k":4,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."}],"refs":[{"t":"NT95, Ин 11:26, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"},{"t":"NT95, Мк 12:14, PDF с. 33","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=33"}]}],"extra_refs":[{"t":"NT95, Ин 4:29, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT95, Мф 12:23, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT95, Ин 1:46, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"},{"t":"NT95 — полный PDF","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf"},{"t":"AL64 — PDF, с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"}],"stray":[],"kind":"extra","meaning":"Может стоять перед продолжением и союзом альтернативы; не всегда последнее слово. Не переводится неизменно как «разве»."},{"n":299,"title":"Часть","letter":"Ч","variants":[{"label":"","form":"safu","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"В П15 — часть тела; другие значения не установлены."},{"n":300,"title":"Человек","letter":"Ч","variants":[{"label":"I","form":"bɔrɔ","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":2,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, PDF с. 22","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=22"},{"t":"NT18, Мф 3:5","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"AL65, PDF с. 108","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=108"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]},{"label":"II","form":"adam-ize","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Еф 6:12","u":"https://zeno.fm/bible/DDNBIV/EPH/6/"}]},{"label":"III","form":"bɔrɔ̀","notes":["Печатная с. 9, правая половина разворота: сохранён тоновый знак."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"CFA, PDF с. 8","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=8"}]},{"label":"IV","form":"boro","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]},{"label":" язки приведены ниже.","examples":[],"refs":[{"t":"NT18, Откр 6:5","u":"https://zeno.fm/bible/DDNBIV/REV/6/"},{"t":"AL64, PDF с. 11","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=11"},{"t":"AL64, PDF с. 12","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=12"}]},{"label":"IV","form":"harri bi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"SM19, § 2, печ. с. 1","u":"https://journals.openedition.org/ethnoecologie/4356"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":176,"meaning":"ibi, bii и bi — записи разных контекстов/изданий; не сведены к одному написанию. Отдельно приведено выражение из этнографической статьи SM19 в авторском написании; оно не считается установленной самостоятельной словарной формой.","sci":"H, §E №137, с. 39. Практическая орфография и контекст требуют сверки."},{"n":303,"title":"Четверг","letter":"Ч","variants":[{"label":"","form":"alamisi","notes":["Название дня в полном недельном перечне AL65. Тон в этой записи не обозначен."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":304,"title":"Четыре","letter":"Ч","variants":[{"label":"","form":"taaci","notes":["Четыре подхода в описании структуры пособия."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 171","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=171"},{"t":"NT18, Откр 4:8","u":"https://zeno.fm/bible/DDNBIV/REV/4/"},{"t":"AL65, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=5"},{"t":"AL64, PDF с. 10","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=10"},{"t":"AL65, PDF с. 83","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=83"},{"t":"AL64, PDF с. 11","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=11"},{"t":"AL65, PDF с. 74","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=74"},{"t":"AL65, PDF с. 72","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=72"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":25,"meaning":"Среди примеров встречаются сложные слова и числительные с данным компонентом; значение целого шире значения основы.","sci":"H, §E №214, с. 45. Практическая орфография и контекст требуют сверки."},{"n":305,"title":"Что","letter":"Ч","variants":[{"label":"","form":"ifɔ","notes":["Вопросительное слово."],"full":2,"status":"","examples":[{"k":1,"pid":"П11","head":"NT95, JHN 1:38, PDF с. 60","rst":true,"dendi":"Ifɔ wom go ceeci?","source":"NT95, JHN 1:38, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"что вам надобно?","lit":"Что вы ищете?","parse":"Ifɔ — что?; wom — вы; go — предглагольный показатель; ceeci — искать.","note":"Параллельный Синодальный перевод передаёт вопрос иначе; дословный дендийский перевод не подменён им."},{"k":2,"pid":"П16","head":"AL64, PDF с. 20","rst":false,"dendi":"Ifɔ nɔ noo dendeni?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Что именно [адресат вопроса] изучил?","parse":"Ifɔ — что?; nɔ — выделительный/предикативный элемент; noo — форма адресата в пособии; лицо и число отдельно не установлены; dendeni — изучать / учиться.","note":"Дословная глосса намеренно содержит квадратные скобки: лицо и число адресата не подтверждены отдельным описанием местоименной системы. Это полный пример с незавершённой грамматической интерпретацией, а не образец для самостоятельного составления фраз."}],"refs":[{"t":"NT95, PDF с. 29","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=29"},{"t":"NT18, Мф 6:31","u":"https://zeno.fm/bible/DDNBIV/MAT/6/"},{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"},{"t":"AL65, PDF с. 89","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=89"},{"t":"NT18, Мк 9:16","u":"https://zeno.fm/bible/DDNBIV/MRK/9/"},{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 6:28","u":"https://zeno.fm/bible/DDNBIV/JHN/6/"},{"t":"NT18, Мк 10:36","u":"https://zeno.fm/bible/DDNBIV/MRK/10/"},{"t":"NT18, Ин 20:15","u":"https://zeno.fm/bible/DDNBIV/JHN/20/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":12,"meaning":"Сочетание ifɔ sɛ спрашивает о причине («почему?»); ifɔ bɔm — о предмете речи («о чём?»). Это составные конструкции, не единое неизменное значение одного слова.","sci":"AZ, №7. Практическая орфография и контекст требуют сверки."},{"n":306,"title":"Шея","letter":"Ш","variants":[{"label":"","form":"jinde","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 18:6","u":"https://zeno.fm/bible/DDNBIV/MAT/18/"},{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"NT18, Деян 15:10","u":"https://zeno.fm/bible/DDNBIV/ACT/15/"},{"t":"NT18, Мк 9:42","u":"https://zeno.fm/bible/DDNBIV/MRK/9/"},{"t":"NT18, Лк 17:2","u":"https://zeno.fm/bible/DDNBIV/LUK/17/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":87,"meaning":"jinde имеет также значения «голос/звук»; здесь отобраны только употребления о шее.","sci":"H, §E №105, с. 37. Практическая орфография и контекст требуют сверки."},{"n":307,"title":"Широкий","letter":"Ш","variants":[{"label":"","form":"hɛantɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 7:13","u":"https://zeno.fm/bible/DDNBIV/MAT/7/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":29,"meaning":"hɛantɛ — «широкий», о входе; причастная форма."},{"n":308,"title":"Шить","letter":"Ш","variants":[],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":138,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":309,"title":"Этот","letter":"Э","variants":[{"label":"I","form":"wɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:3","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"}]},{"label":"II","form":"wɔne","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT18, Мф 26:26","u":"https://zeno.fm/bible/DDNBIV/MAT/26/"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]},{"label":"III","form":"wɔ̀","notes":["Форма с низким тоном в письменном тексте."],"full":1,"status":"","examples":[{"k":1,"pid":"П49","head":"AL65, PDF с. 70","rst":false,"dendi":"Alaama wɔ̀ gùna.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Посмотри на это изображение.","parse":"Alaama — изображение; иллюстрация в учебнике; wɔ̀ — этот; gùna — посмотри; побудительное употребление.","note":"Буквальная именная группа — «это изображение». Полная инструкция перед заданием о календаре. Порядок: объект перед глаголом. Тоны wɔ̀ и gùna сохранены именно по этой странице; они не переносятся автоматически на нетонированное Guna в NT95."}],"refs":[{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]},{"label":"IV","form":"wo","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П43","head":"CAL, PDF с. 22","rst":false,"dendi":"Iri ma gweiyo wo te.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Пусть мы выполним это упражнение.","parse":"Iri — мы; ma — побудительный показатель; gweiyo — упражнение; форма источника; wo — этот; te — делать; выполнить.","note":"Печатная с. 40: полная инструкция перед арифметическими действиями. Te оставлено в написании CAL, не превращено механически в tɛ. Цитата не реконструирована из словаря."}],"refs":[{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":7,"meaning":"Дейктическое значение зависит от конструкции."},{"n":310,"title":"Я","letter":"Я","variants":[{"label":"I","form":"a","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П23","head":"NT95, Мф 24:25, PDF с. 20","rst":true,"dendi":"Guna, a jina ka cii wom sɛ kɔ.","source":"NT95, Мф 24:25, PDF с. 20","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20","pub":"Вот, Я наперед сказал вам.","lit":"Посмотри, я уже заранее сказал вам.","parse":"Guna — посмотри; a — я; jina — предшествовать; здесь заранее; ka — связующий элемент; cii — сказать; wom — вы; sɛ — адресат: кому; kɔ — уже.","note":"Jina ka cii передаёт предварительное предупреждение; jina здесь не переводится как отдельное физическое движение."},{"k":2,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."}],"refs":[{"t":"NT18, Мф 5:17","u":"https://zeno.fm/bible/DDNBIV/MAT/5/"},{"t":"NT18, Ин 10:30","u":"https://zeno.fm/bible/DDNBIV/JHN/10/"},{"t":"NT18, 2 Тим 4:12","u":"https://zeno.fm/bible/DDNBIV/2TI/4/"},{"t":"NT18, Гал 1:24","u":"https://zeno.fm/bible/DDNBIV/GAL/1/"},{"t":"NT18, 1 Ин 2:26","u":"https://zeno.fm/bible/DDNBIV/1JN/2/"},{"t":"NT95, Мф 24:25, PDF с. 20","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20"},{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"}]},{"label":"II","form":"Hɛɛ","notes":["Эмфатическое представление говорящего в Hɛɛ no. Не hɛ «вещь»; различается длина гласного."],"full":1,"status":"","examples":[{"k":1,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."}],"refs":[{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":1,"sci":"AT, №1. Практическая орфография и контекст требуют сверки."},{"n":311,"title":"Являться; быть кем-либо","letter":"Я","variants":[{"label":"","form":"ci","notes":["Глагольная / связочная функция."],"full":4,"status":"","examples":[{"k":1,"pid":"П7","head":"NT95, JHN 4:29, PDF с. 62","rst":true,"dendi":"À mana ci Mɛsiya dee?","source":"NT95, JHN 4:29, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"не Он ли Христос?","lit":"Не является ли он Мессией?","parse":"À — он; mana — отрицательное предикативное употребление; ci — являться; Mɛsiya — Мессия; dee — вопросительная частица.","note":"Ожидание подтверждения возможно по контексту, но не объявляется значением dee во всех вопросах."},{"k":2,"pid":"П8","head":"NT95, MAT 12:23, PDF с. 12","rst":true,"dendi":"À na ci Dafidi ize di dee?","source":"NT95, MAT 12:23, PDF с. 12","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12","pub":"не это ли Христос, сын Давидов?","lit":"Не является ли он тем сыном Давида?","parse":"À — он; na — отрицательная функция в данном сочетании; не смешивать с показателем переходного действия; ci — являться; Dafidi — Давид; ize — сын / потомок; di — определительный элемент; dee — вопросительная частица.","note":"В опубликованном русском тексте добавлено именование «Христос»; в этой дендийской фразе слова Mɛsiya нет."},{"k":3,"pid":"П19","head":"COV, PDF с. 2","rst":false,"dendi":"Ifɔ̀ ya ci KOFID-19?","source":"COV, PDF с. 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Что является COVID-19?","parse":"Ifɔ̀ — что?; ya — выделительный элемент; ci — являться; KOFID-19 — COVID-19.","note":"Форма названия сохранена по заголовку; в других местах памятки есть COFID-19. Историческая памятка здесь используется как языковой материал, не как медицинское руководство. Тон вопросительного слова сохранён."},{"k":4,"pid":"П20","head":"COV, PDF с. 2","rst":false,"dendi":"Ifɔ̀yo ya ci COFID-19 màanayo?","source":"COV, PDF с. 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Какие [вещи] являются признаками COVID-19?","parse":"Ifɔ̀yo — какие?; форма с -yo сохранена; ya — выделительный элемент; ci — являться; COFID-19 — COVID-19; màanayo — признаки / симптомы в данном контексте.","note":"Русский буквальный перевод сохраняет вопросительную именную конструкцию; естественный смысл — «Каковы симптомы COVID-19?». Морфологическая классификация -yo отдельно не завершена; не смешивать этот пример с нейтральной словарной основой."}],"refs":[{"t":"NT18, Ин 11:27","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Ин 6:48","u":"https://zeno.fm/bible/DDNBIV/JHN/6/"},{"t":"NT18, Лк 24:48","u":"https://zeno.fm/bible/DDNBIV/LUK/24/"},{"t":"NT18, Мф 12:8","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"},{"t":"NT18, Ин 1:20","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Отличается от cii «сказать» длиной гласной. Не является универсальным эквивалентом русского «быть»: пребывание и наличие могут выражаться иначе."},{"n":312,"title":"Являться; появляться","letter":"Я","variants":[{"label":"","form":"hunutɛrɛ","notes":["Появиться перед наблюдателем. Не связка ci «являться кем-либо»."],"full":1,"status":"","examples":[{"k":1,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."}],"refs":[{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":313,"title":"Язык (орган)","letter":"Я","variants":[{"label":"","form":"dɛɛnɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мк 7:33","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Рим 3:13","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, Деян 2:3","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Иак 3:8","u":"https://zeno.fm/bible/DDNBIV/JAS/3/"},{"t":"NT18, Откр 10:11","u":"https://zeno.fm/bible/DDNBIV/REV/10/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":78,"sci":"H, §E №101, с. 37. Практическая орфография и контекст требуют сверки."},{"n":314,"title":"Язык (речь, система общения)","letter":"Я","variants":[{"label":"I","form":"cine, cinɛ, ciineyo","notes":["Существительные и формы из опубликованных контекстов.","NT95 также содержит cinɛ; AL64 использует cinɛ и ciineyo. П30–П31 дают язык речевого действия, П41 — языки как учебную цель. Написания cine/cinɛ/ciineyo сохраняются источниково, -yo не отбрасывается автоматически."],"full":null,"status":"","examples":[{"k":1,"pid":"П10","head":"NT18, ACT 21:37","rst":true,"dendi":"N ŋmaani Garɛku cine ba?","source":"NT18, ACT 21:37","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"ты знаешь по‐гречески?","lit":"Ты владеешь греческим языком?","parse":"N — ты; ŋmaani — владеть языком / говорить на языке в этом употреблении; Garɛku — греческий; cine — язык; ba — вопросительная частица.","note":"Омографическое ŋmaani «иной» в других местах не смешано с этим употреблением. В NT95, PDF с. 92, в том же вопросе напечатано cinɛ. Это два издания одного контекста."},{"k":2,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":3,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":4,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":5,"pid":"П41","head":"AL64, PDF с. 3","rst":false,"dendi":"Gandà ciineyo ga nda bature cinɛ ga sènnìyom nda mɛɛ ;","source":"AL64, PDF с. 3","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Устное говорение на языках страны и на языке европейца.","parse":"Gandà — страна; местная языковая среда в этом пункте; ciineyo — языки; форма с -yo; ga — на; элемент конструкции сферы/языка; nda — и; далее посредством; bature — европеец; cinɛ — язык; sènnìyom — говорение; контекстная производная форма; mɛɛ — рот; здесь устный способ.","note":"Полный именной пункт списка учебных целей; личного сказуемого в нём нет. Слово bature не подменено без доказательства названием конкретного языка. Морфологическое разложение sènnìyom пока не установлено. Тоны и точка с запятой сохранены."}],"refs":[{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"NT18, Деян 2:8","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Деян 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT18, Деян 22:2","u":"https://zeno.fm/bible/DDNBIV/ACT/22/"},{"t":"NT95, Деян. 21:37, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]},{"label":"II","form":"dɛɛnɛ","notes":["Существительные и формы из опубликованных контекстов."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Откр 5:9","u":"https://zeno.fm/bible/DDNBIV/REV/5/"},{"t":"NT18, Откр 17:15","u":"https://zeno.fm/bible/DDNBIV/REV/17/"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Cine в NT18 обозначает язык в языковых сочетаниях; не все его омографы имеют это значение. Dɛɛnɛ — также орган речи; в перечислении народов и языков употреблено метонимически. Cinɛ и ciineyo — формы AL64, сохранённые как в источнике; форму с -yo нельзя выдавать за автоматически равнозначную словарную основу."},{"n":315,"title":"Яйцо","letter":"Я","variants":[{"label":"","form":"gunguri","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 11:12","u":"https://zeno.fm/bible/DDNBIV/LUK/11/"},{"t":"AL65, PDF с. 104","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104"},{"t":"AL65, PDF с. 51","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51"},{"t":"AL65, PDF с. 50","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=50"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":67,"sci":"H, §E №85, с. 36. Практическая орфография и контекст требуют сверки."}],"sources":[{"code":"AL65","desc":"Dendi cinɛ couyo nda à hantum dendenikɔ tila. Bugu 1, Waati 1. Manuel de l’apprenant en AEA, Niveau 1 du cycle 1, Bénin. Полный PDF, 114 с. Учебник грамотности для носителей языка: буквы, чтение, письмо, счёт, здоровье, быт и гражданская тематика. Это не русско-дендийский разговорник. Год выпуска на просмотренной обложке не указан. Даты внутри упражнений не приняты за дату издания. Главный новый источник практических написаний.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf"},{"code":"AL64","desc":"Пособие для преподавателя AEA, Бенин. Полный PDF, 60 с. Методика и планы занятий; просмотрено для уточнения функций учебных примеров и письменной системы. Во второй части извлечение текста имеет повреждённые глифы; такие автоматические записи не использованы как новые лексические варианты. Самостоятельных новых форм без проверки значения не добавлено.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf"},{"code":"COV","desc":"ACALAN–UA. COVID-19, Songhay-dendi. Перевод Roukéiyath Alaza Sani и Mama Yola Kpara. Полный PDF, 4 с. Практический санитарный текст с тоновыми знаками. Подтверждает варианты руки, носа, рта, глаза, мытья и названий дыхания. Сохранены расхождения внутри самого буклета: hinazebu / hinanzebu. Дата выпуска не устанавливается по одному упоминанию 2019 года в описании эпидемии.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf"},{"code":"ANT","desc":"Benin: дендийский перевод национального гимна. Traduction de Azaratou Sanny Alaza et Roukéiyath Alaza Sani Bassabitchire. Полный PDF, 1 с. Поэтический текст с элизиями и вариантами в скобках; автоматическое извлечение теряет часть букв. Поэтому ненадёжные фрагменты не использованы для заполнения базовой лексики.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_8.pdf"},{"code":"CAL","desc":"Kilee Dendeniyo Tila / Livret de Calcul en Dendi. DNAEA, C3A / Coop-Suisse. Июнь 2001, дата на обложке. Полный скан, 38 страниц PDF, с разворотами. Пособие по арифметике: операции, деньги, измерения, строительные задачи. Подтверждает gu «пять», hinka «два» по цифровым подписям и tuurinya в подсчёте древесины. Книжная орфография не уравнена автоматически с NT18.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf"},{"code":"CFA","desc":"Бенинский дендийский текст о девальвации франка CFA. На обложке: Cotonou, 23 janvier 1994; 10 страниц PDF с разворотами. Публицистический экономический материал, а не грамматика. Подтверждает тоновую запись kàmmɛ̀, bɔrɔ̀ и союз nna. Сложная финансовая лексика за пределами 207 значений не включена.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf"},{"code":"T68/72","desc":"Nicole Tersis. Le dendi (Niger): phonologie, lexique dendi-français, emprunts (arabe, hausa, français, anglais). Bulletin de la SELAF 10. Полный скан, 48 страниц PDF. Наружная обложка имеет 1972; внутренняя титульная страница — Décembre 1968, и раздел фонологии подписан Paris, décembre 1968. Поэтому это не следует безоговорочно считать другой работой, отличной от Tersis 1968. Научное описание и словарь нигерского денди; полезны для значения и частей речи, но запись не равна практической орфографии учебника Бенина. В словаре формы могут включать артикль, множественное число и тон; варианты не сведены механически к одной основе.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_15.pdf"},{"code":"N78","desc":"Robert Nicolaï. Les parlers dendi. African Languages 4, 1978, печ. с. 47–79. Полный скан, 17 страниц PDF; первая половина первого разворота относится к предыдущей статье. Описание прежде всего Канди, с сопоставлением Джугу и Параку, а также ссылкой на Гая–Маланвиль. Различает регистр полной формы и разговорные сокращения; это одна из причин, почему разные записи не обязательно противоречат друг другу. Примеры в научной транскрипции не выданы за нормативные слова современного учебника.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_16.pdf"},{"code":"SM19","desc":"Lucie Smolderen. Des graines, des fibres et des bobines. Mémoire d’une filière textile artisanale dans le Dendi (Nord Bénin). Revue d’ethnoécologie 15, 2019, DOI 10.4000/ethnoecologie.4356. Этнографическая статья о хлопковой цепочке. Проверены доступные фрагменты первичной публикации, в частности § 2 и § 28; полный PDF при повторном обращении закрыт автоматической проверкой сайта. Поэтому полный текст статьи не объявлен исчерпывающе проанализированным. Записи harri kware, harri bi и habou sando рассматриваются ниже в авторской латинской записи.","url":"https://journals.openedition.org/ethnoecologie/4356"},{"code":"N89","desc":"Robert Nicolaï. Revernacularisation et déterminismes évolutifs: Songhay septentrional et dendi. Current Approaches to African Linguistics VI, 1989, с. 100–114. DOI 10.1515/9783110884890-008. Тематика — история изменения языка и контакт. Подтверждена авторская запись HAL hal-05506021; она не содержит доступного файла полного текста. Издательская страница не открылась. Новые лексические формы на основании одной библиографии не приписаны статье.","url":"https://hal.science/hal-05506021v1"},{"code":"G88","desc":"Euphrasie Moudachirou & Michelle Dossou. Le guide pratique de transcription de la langue dendi. Cotonou, 1988. Подтверждена каталоговая запись WorldCat; полный текст не получен. По назначению это важный источник правил письма, но конкретные правила и слова без страниц ему не приписаны.","url":"https://search.worldcat.org/fr/title/guide-pratique-de-transcription-de-la-langue-dendi/oclc/32453905"},{"code":"GYK","desc":"Mama Yola Kpara. Guide de transcription et de lecture du dendi cine. 53 с., ISBN 978-99919-0-031-5. Подтверждена карточка Национальной библиотеки Бенина; PDF книги не получен. Каталожная карточка не подтверждает год: упоминавшийся ранее 2014 не принят как установленная дата. Ссылка на GUIDE D’APPRENTISSAGE DENDI в ALPHA возвращает двухстраничную служебную выгрузку сайта, а не текст руководства.","url":"https://bibliographie.bnb.bj/resources/book_details/3825/"},{"code":"NT18","desc":"Dendi New Testament, отметка © 2018 Bibles International; DDNBIV на Zeno. Использован ранее собранный текст 27 книг, 260 глав; новые учебные формы сопоставлены с ним. Дата © не доказывает сама по себе степень переработки перевода 1995 года.","url":"https://zeno.fm/bible/DDNBIV/"},{"code":"NT95","desc":"The New Testament in Dendi, © 1995 Bibles International. Digital Bible Society; 179 с. PDF. Примеры снабжены номерами страниц PDF. Написания NT95 и NT18 приводятся раздельно при наличии различий.","url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf"},{"code":"H","desc":"Harrison, Harrison & Rueck. Southern Songhay Speech Varieties in Niger. SIL Electronic Survey Reports 1999-004; полевые работы 1997. Используется дендийская строка TAN (Танда), а не соседние разновидности сонгай. Полевая фонетическая запись сохранена как указатель для сверки.","url":"https://media.corban.edu/hydra/media/files/2019/09/10/southern-songhay-silesr1999_004-1.pdf"},{"code":"AT / AZ","desc":"ASJP: Dendi (Tersis 1968) и Dendi 2 (Zima 1994, Джугу). Это сокращённые кодированные выборки, не практическая орфография. Полный словарь Zima 1994 не проверен по полному тексту; данные ASJP не объявлены чтением всей книги.","url":"https://asjp.clld.org/languages/DENDI_2"}],"rst":{"title":"Опубликованный русский параллельный текст","desc":"Синодальный перевод RST. Строки одного стиха объединены полностью; параллельный перевод отделён от авторского буквального перевода денди.","label":"RST: исходные файлы Синодального текста","url":"https://github.com/bibleonline/rst"},"built":"12.10.2026"}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const E = D.entries;
const byN = {}; E.forEach(e => byN[e.n] = e);
const ALPHA = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ'.split('');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const foldRu = s => s.toLowerCase().replace(/ё/g, 'е');
const foldDn = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/ɛ/g,'e').replace(/ɔ/g,'o').replace(/ŋ/g,'n').replace(/ɲ/g,'ny').replace(/[‹›«»"'’.,;:!?()\/]/g,'').replace(/[\s-]+/g,'');
const fold = s => foldDn(foldRu(s));
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; }

// варианты, формы, примеры
const variantForms = v => v.form.split(/[;,]\s+/).map(f => f.replace(/\s*\(.*?\)\s*/g, ' ').trim()).filter(Boolean);
const allForms = e => [...new Set(e.variants.flatMap(variantForms))];
const examplesOf = e => e.variants.flatMap(v => v.examples);
const PID = {};   // П → { ex, entries[] }
E.forEach(e => examplesOf(e).forEach(x => { (PID[x.pid] = PID[x.pid] || { ex: x, entries: [] }); if (!PID[x.pid].entries.includes(e)) PID[x.pid].entries.push(e); }));
const PIDS = Object.keys(PID).sort((a, b) => +a.slice(1) - +b.slice(1));
const ST = {
  all: E.length, sw: E.filter(e => e.kind === 'swadesh').length, extra: E.filter(e => e.kind === 'extra').length,
  ex: PIDS.length, withEx: E.filter(e => examplesOf(e).length).length, unest: E.filter(e => e.unestablished).length
};

// источники → якоря
const SRC_IDS = {};
D.sources.forEach((s, i) => {
  s.id = 'src' + i;
  s.code.split(/[ \/—]+/).filter(c => /^[A-Z0-9]+$/.test(c)).forEach(c => SRC_IDS[c] = s.id);
  if (s.code.startsWith('T68')) SRC_IDS['T68/72'] = s.id;
});
if (D.rst) SRC_IDS['RST'] = 'srcrst';
const CODE_RE = /\b(T68\/72|NT18|NT95|AL\d+|COV|CAL|CFA|ANT|SM19|N78|N89|G88|GYK|RST|AT|AZ|H)\b/g;
const rich = s => esc(s)
  .replace(CODE_RE, m => SRC_IDS[m] ? `<a class="code" href="#${SRC_IDS[m]}" title="Описание источника">${m}</a>` : m)
  .replace(/П(\d+)/g, (m, d) => PID['П' + d] ? `<a class="pid" href="#p${d}" title="Полный пример ${m}">${m}</a>` : m);
const extLink = (text, url) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);

const formIndex = {};
E.forEach(e => allForms(e).forEach(ff => { const k = foldDn(ff); (formIndex[k] = formIndex[k] || []).push({ e, form: ff }); }));
const lettersPresent = new Set(E.map(e => e.letter));
const tagsFor = e => {
  const t = [];
  if (e.kind === 'extra') t.push('<span class="tag info">доп.</span>');
  if (e.unestablished) t.push('<span class="tag warn">написание не установлено</span>');
  return t.join(' ');
};
const wordLink = e => `<a href="#w${e.n}">${esc(e.title)}</a>`;
const primaryForms = e => e.variants.slice(0, 2).map(v => v.form).join(', ');

function drawAbc(active) {
  document.getElementById('abc').innerHTML = ALPHA.map((L, i) =>
    lettersPresent.has(L) ? `<a href="#l${i}" class="${L === active ? 'on' : ''}">${L}</a>` : `<span aria-hidden="true">${L}</span>`).join('');
}
const inLetter = L => E.filter(e => e.letter === L);

function letterGroup(L) {

const IDX = E.map(e => ({

  forms: allForms(e).map(ff => ({ raw: ff, k: foldDn(ff) })),
  ex: examplesOf(e).map(x => ({ x, k: fold([x.dendi, x.lit, x.pub].join(' ')) }))

let query = '', inEx = false;
try { inEx = localStorage.getItem('dn-inex') === '1'; } catch (_) {}
document.getElementById('inex').checked = inEx;
function hlDn(text, q) {
  const qk = foldDn(q); if (!qk) return esc(text);
  return text.split(/(\s+)/).map(w => foldDn(w).includes(qk) && qk.length > 1 ? `<mark>${esc(w)}</mark>` : esc(w)).join('');
}
function vSearch() {
  const q = query.trim();
  if (!q) return vHome();
  const qr = foldRu(q), qk = fold(q);
  const out = [];
  IDX.forEach(r => {
    let score = 0, hitForm = null; const hitEx = [];
    if (r.t === qr) score = 100; else if (r.t.startsWith(qr)) score = 80; else if (r.t.includes(qr)) score = 60;
    r.forms.forEach(f => {
      let s = 0;
      if (f.k === qk) s = 95; else if (f.k.startsWith(qk)) s = 75; else if (qk.length > 2 && f.k.includes(qk)) s = 50;
      if (s > score) { score = s; hitForm = f.raw; } else if (s && !hitForm) hitForm = f.raw;
    });
    if (inEx && qk.length > 1) {
      r.ex.forEach(x => { if (x.k.includes(qk) && !hitEx.includes(x.x)) hitEx.push(x.x); });
      if (hitEx.length && !score) score = 20;
    }
    if (score) out.push({ r, score, hitForm, hitEx });
  });
  out.sort((a, b) => b.score - a.score || a.r.e.n - b.r.e.n);
  if (!out.length) return `<div class="stack"><h1>Ничего не найдено</h1><p>По запросу «${esc(q)}» нет ни русских заголовков, ни дендийских форм${inEx ? ', ни примеров' : ''}. ${inEx ? '' : 'Попробуйте включить «искать в примерах».'} Тон и долготу можно не набирать.</p></div>`;
  return `<div class="stack"><h1>Поиск: «${esc(q)}»</h1><p class="muted">${out.length} ${plural(out.length, 'статья', 'статьи', 'статей')}</p>
    <ul class="res">${out.slice(0, 150).map(o => {
      const e = o.r.e;
      const forms = e.variants.map(v => variantForms(v).includes(o.hitForm) ? `<mark>${esc(v.form)}</mark>` : esc(v.form)).join(' · ');
      const exs = o.hitEx.slice(0, 2).map(x => `<span class="rx"><span class="dn">${hlDn(x.dendi, q)}</span> — ${esc(x.lit)}</span>`).join('');
      return `<li><span class="rt">${wordLink(e)} ${tagsFor(e)}</span>${e.variants.length ? `<span class="rf">${forms}</span>` : '<span class="rx">Практическое написание не установлено</span>'}${exs}${o.hitEx.length > 2 ? `<span class="rx">и ещё ${o.hitEx.length - 2} в примерах</span>` : ''}</li>`;
    }).join('')}</ul></div>`;

// разбор фразы: только то, что есть в словаре и в разборах П; связного перевода не строим
const tokenize = s => s.normalize('NFC').split(/[\s.,;:!?«»“”„"()\[\]…—–]+/).map(t => t.replace(/^['‹›’]+|['‹›’]+$/g, '')).filter(Boolean);
const sameSpelling = (a, b) => a.normalize('NFC').toLowerCase() === b.normalize('NFC').toLowerCase();
const FORM_IDX = new Map();
E.forEach(e => e.variants.forEach(v => variantForms(v).forEach(f => {
  const k = foldDn(f); if (!k) return;
  if (!FORM_IDX.has(k)) FORM_IDX.set(k, []);
  const arr = FORM_IDX.get(k); if (!arr.some(x => x.e === e && x.form === f)) arr.push({ e, v, form: f });
})));
const GLOSS_IDX = new Map();
PIDS.forEach(p => parseItems(PID[p].ex.parse).forEach(({ w, g }) => w.split(/\s*\/\s*/).forEach(raw => {
  const k = foldDn(raw); if (!k || !w) return;
  if (!GLOSS_IDX.has(k)) GLOSS_IDX.set(k, new Map());
  const m = GLOSS_IDX.get(k), key = g.toLowerCase();
  if (!m.has(key)) m.set(key, { gloss: g, raw, pids: [] });
  if (!m.get(key).pids.includes(p)) m.get(key).pids.push(p);
})));
const lookup = k => ({ forms: FORM_IDX.get(k) || [], gloss: GLOSS_IDX.has(k) ? [...GLOSS_IDX.get(k).values()] : [] });
function analyze(text) {
  const toks = tokenize(text), out = [];
  let i = 0;
  while (i < toks.length) {
    let hit = null;
    for (let n = Math.min(4, toks.length - i); n >= 2 && !hit; n--) {
      const words = toks.slice(i, i + n), k = foldDn(words.join(' ')), r = lookup(k);
      if (r.forms.length || r.gloss.length) hit = { words, k, ...r };
    }
    if (!hit) { const words = [toks[i]], k = foldDn(toks[i]); hit = { words, k, ...lookup(k) }; }
    if (!hit.forms.length && !hit.gloss.length) {
      for (const suf of ['yom', 'yo']) {
        if (hit.k.length > suf.length + 1 && hit.k.endsWith(suf)) {
          const r = lookup(hit.k.slice(0, -suf.length));
          if (r.forms.length || r.gloss.length) { hit.guess = { suf, ...r }; break; }
        }
      }
    }
    out.push(hit); i += hit.words.length;
  }
  return out;
}
function similarExamples(text) {
  const q = new Set(tokenize(text).map(foldDn).filter(Boolean));
  return PIDS.map(p => {
    const x = PID[p].ex, ws = tokenize(x.dendi).map(foldDn);
    const common = [...new Set(ws.filter(w => q.has(w)))];
    return { p, x, common, score: common.reduce((s, w) => s + Math.min(w.length, 5), 0) / Math.sqrt(ws.length + 1) };
  }).filter(r => r.common.length).sort((a, b) => b.score - a.score).slice(0, 4);
}
const approx = (word, form) => sameSpelling(word, form) ? '' : ` <span class="tag warn" title="Совпадает без учёта тона, долготы или дефиса">≈ <span class="dn">${esc(form)}</span></span>`;
function tokCard(h) {
  const word = h.words.join(' ');
  const block = (r, title) => {
    const parts = [], forms = [];
    r.forms.forEach(f => {
      const j = forms.findIndex(u => u.e === f.e);
      if (j < 0) forms.push(f); else if (!sameSpelling(word, forms[j].form) && sameSpelling(word, f.form)) forms[j] = f;
    });
    r = { ...r, forms };
    if (r.forms.length) parts.push(`<div class="pblk"><span class="plab">${title ? title + ' · ' : ''}В словаре</span><ul>${r.forms.slice(0, 5).map(f => `<li>${wordLink(f.e)}${f.v.label ? ` <span class="muted small">вар. ${f.v.label}</span>` : ''}${approx(word, f.form)}</li>`).join('')}${r.forms.length > 5 ? `<li class="muted small">и ещё ${r.forms.length - 5}</li>` : ''}</ul></div>`);
    if (r.gloss.length) parts.push(`<div class="pblk"><span class="plab">В разборах примеров</span><ul>${r.gloss.slice(0, 4).map(g => `<li>${esc(g.gloss)} <span class="small">${g.pids.slice(0, 4).map(p => `<a class="pid" href="#p${p.slice(1)}">${p}</a>`).join(' ')}${g.pids.length > 4 ? ' …' : ''}</span>${approx(word, g.raw)}</li>`).join('')}${r.gloss.length > 4 ? `<li class="muted small">и ещё ${r.gloss.length - 4}</li>` : ''}</ul></div>`);
    return parts.join('');
  };
