Говорить»."},{"n":267,"title":"Рог","letter":"Р","variants":[{"label":"","form":"hilli","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 173","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=173"},{"t":"NT18, Откр 9:13","u":"https://zeno.fm/bible/DDNBIV/REV/9/"},{"t":"NT18, Откр 13:11","u":"https://zeno.fm/bible/DDNBIV/REV/13/"},{"t":"NT18, Откр 12:3","u":"https://zeno.fm/bible/DDNBIV/REV/12/"},{"t":"NT18, Откр 17:16","u":"https://zeno.fm/bible/DDNBIV/REV/17/"},{"t":"NT18, Откр 17:7","u":"https://zeno.fm/bible/DDNBIV/REV/17/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":68,"meaning":"Контекст — рога алтаря.","sci":"H, §E №84, с. 36. Практическая орфография и контекст требуют сверки."},{"n":268,"title":"Рот","letter":"Р","variants":[{"label":"I","form":"mee","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"}]},{"label":"II","form":"me","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 17:27","u":"https://zeno.fm/bible/DDNBIV/MAT/17/"}]},{"label":"III","form":"mɛɛ","notes":["В перечне органов головы; отличается от mee/me NT."],"full":3,"status":"","examples":[{"k":1,"pid":"П41","head":"AL64, PDF с. 3","rst":false,"dendi":"Gandà ciineyo ga nda bature cinɛ ga sènnìyom nda mɛɛ ;","source":"AL64, PDF с. 3","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3","lit":"Устное говорение на языках страны и на языке европейца.","parse":"Gandà — страна; местная языковая среда в этом пункте; ciineyo — языки; форма с -yo; ga — на; элемент конструкции сферы/языка; nda — и; далее посредством; bature — европеец; cinɛ — язык; sènnìyom — говорение; контекстная производная форма; mɛɛ — рот; здесь устный способ.","note":"Полный именной пункт списка учебных целей; личного сказуемого в нём нет. Слово bature не подменено без доказательства названием конкретного языка. Морфологическое разложение sènnìyom пока не установлено. Тоны и точка с запятой сохранены."},{"k":2,"pid":"П46","head":"AL65, PDF с. 29","rst":false,"dendi":"Bom gonda hangayo, mɔɔize, ninɛ, mɛɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Голова имеет уши, глаза, нос, рот.","parse":"Bom — голова; gonda — иметь; hangayo — уши; форма источника с -yo; mɔɔize — глаза в данном перечислении органов головы; ninɛ — нос; mɛɛ — рот.","note":"Полное предложение из учебного описания тела. Число органов в русском переводе следует анатомическому перечислению; оно не приписывается единому суффиксу у всех дендийских слов. Здесь mɔɔize названо в ряду органов головы; специальное различие «глаз / зрачок» этим предложением отдельно не устанавливается."},{"k":3,"pid":"П71","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo mɛɛ nna noo nunɛ daabu, de noo go tɔkɔɔ au noo go tisã.","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Прикрывайте ваши рот и нос, если [когда] вы кашляете или чихаете.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь «ваши»; mɛɛ — рот; nna — и; noo — форма адресата, здесь «ваш»; nunɛ — нос; daabu — закрывать, прикрывать; de — если, в этом контексте также «когда»; noo — форма адресата, субъект придаточной части; go — предглагольный показатель; tɔkɔɔ — кашлять; au — или; noo — форма адресата, субъект; go — предглагольный показатель; tisã — чихать.","note":"Полная фраза с придаточной частью после запятой. Текст памятки сохраняет повтор noo. В переводе показаны условное и временное прочтения de; из этого примера не выводится тождество de и всех слов «когда»."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"AL65, PDF с. 93","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=93"},{"t":"COV, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=3"},{"t":"AL65, PDF с. 77","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=77"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":76,"sci":"H, §E №99, с. 37. Практическая орфография и контекст требуют сверки."},{"n":269,"title":"Руга","letter":"Р","variants":[{"label":"","form":"Ruga","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П77","head":"AL65, PDF и печ. с. 51","rst":false,"dendi":"Sambɔ kanda gunguriyo 224, Ruga kanda 144.","source":"AL65, PDF и печ. с. 51","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51","lit":"Самбо принёс 224 яйца, Руга принёс 144 [яйца].","parse":"Sambɔ — Самбо, имя персонажа; kanda — приносить; gunguriyo — яйца; 224 — цифровая запись числа 224; Ruga — Руга, имя персонажа; kanda — приносить; 144 — цифровая запись числа 144.","note":"Целое предложение с обеими частями. По соседней фразе персонажи пришли на рынок; предмет второго действия восстанавливается из первой части. kanda с одним a не исправлено в kaanda из П35. Чтение чисел не реконструируется."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Собственное имя участника той же задачи; русская передача Руга.","related":"П77."},{"n":270,"title":"Рука","letter":"Р","variants":[{"label":"I","form":"kambɛ","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":2,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."}],"refs":[{"t":"NT95, PDF с. 22","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=22"},{"t":"NT18, Мф 3:12","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"AL65, PDF с. 102","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=102"},{"t":"AL65, PDF с. 87","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=87"},{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"}]},{"label":"II","form":"kammɛ̀","notes":["Тоновая запись «рука», отличается от kambɛ NT/AL65."],"full":1,"status":"","examples":[{"k":1,"pid":"П70","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."}],"refs":[{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"}]},{"label":"III","form":"kàmmɛ̀","notes":["Печатная с. 8; рука в выражении о продажах. Тоновая запись и удвоенное m, отличающиеся от kambɛ."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"CFA, PDF с. 8","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=8"}]},{"label":"IV","form":"kammɛ","notes":["Рука, запись без тонового знака в этом предложении."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=3"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":83,"sci":"H, §E №102, с. 37. Практическая орфография и контекст требуют сверки."},{"n":271,"title":"Рыба","letter":"Р","variants":[{"label":"","form":"ciifi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мф 12:40","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"},{"t":"NT18, Лк 24:42","u":"https://zeno.fm/bible/DDNBIV/LUK/24/"},{"t":"NT18, Ин 21:13","u":"https://zeno.fm/bible/DDNBIV/JHN/21/"},{"t":"NT18, Мк 8:7","u":"https://zeno.fm/bible/DDNBIV/MRK/8/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":45,"sci":"H, §E №82, с. 36. Практическая орфография и контекст требуют сверки."},{"n":272,"title":"Рынок","letter":"Р","variants":[{"label":"","form":"hebu","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П67","head":"AL65, PDF и печ. с. 96","rst":false,"dendi":"Hawau kwei hebu.","source":"AL65, PDF и печ. с. 96","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=96","lit":"Хавау пошла на рынок.","parse":"Hawau — Хавау, имя персонажа; kwei — идти; hebu — рынок.","note":"Целое первое предложение задачи о покупке помидоров. Женский род русского перевода согласован с иллюстрацией и контекстом. Прошедшее время — повествовательная интерпретация; отдельного показателя прошедшего в этой фразе не выделено."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Рынок; место назначения при kwei в П67.","related":"П67."},{"n":273,"title":"Ряд","letter":"Р","variants":[{"label":"","form":"Sooro","notes":["Ряд строительных деревянных элементов; иные значения не установлены."],"full":1,"status":"","examples":[{"k":1,"pid":"П42","head":"CAL, PDF с. 22","rst":false,"dendi":"Sooro fo ga, tuurinya 55 ya goono.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","lit":"В одном ряду имеются 55 деревянных элементов.","parse":"Sooro — ряд; fo — один; написание CAL; ga — в; пространственный элемент; tuurinya — деревянный элемент в строительной задаче; 55 — пятьдесят пять; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Печатная с. 41: задача о древесине для строительства. Здесь речь о строительных элементах, поэтому перевод «55 растущих деревьев» не используется. Форма tuurinya совпадает графически с вариантами растительного термина; значение устанавливается контекстом."}],"refs":[{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":274,"title":"С","letter":"С","variants":[{"label":"","form":"nda","notes":["Также союз «и»."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 128","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=128"},{"t":"NT18, Мф 3:11","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=100"},{"t":"AL65, PDF с. 102","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=102"},{"t":"NT18, Мк 1:36","u":"https://zeno.fm/bible/DDNBIV/MRK/1/"},{"t":"NT18, Ин 14:25","u":"https://zeno.fm/bible/DDNBIV/JHN/14/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":203,"meaning":"nda — с/посредством, зависит от конструкции."},{"n":275,"title":"Самбо","letter":"С","variants":[{"label":"","form":"Sambɔ","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П77","head":"AL65, PDF и печ. с. 51","rst":false,"dendi":"Sambɔ kanda gunguriyo 224, Ruga kanda 144.","source":"AL65, PDF и печ. с. 51","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51","lit":"Самбо принёс 224 яйца, Руга принёс 144 [яйца].","parse":"Sambɔ — Самбо, имя персонажа; kanda — приносить; gunguriyo — яйца; 224 — цифровая запись числа 224; Ruga — Руга, имя персонажа; kanda — приносить; 144 — цифровая запись числа 144.","note":"Целое предложение с обеими частями. По соседней фразе персонажи пришли на рынок; предмет второго действия восстанавливается из первой части. kanda с одним a не исправлено в kaanda из П35. Чтение чисел не реконструируется."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Собственное имя участника учебной задачи о продаже яиц. Конечное ɔ сохранено.","related":"П77."},{"n":276,"title":"Связка и выделение: no / nɔ","letter":"С","variants":[{"label":"I","form":"no","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке."],"full":null,"status":"","examples":[{"k":1,"pid":"П4","head":"NT18, 2CO 11:22","rst":true,"dendi":"Eburu yom no ba?","source":"NT18, 2CO 11:22","source_url":"https://zeno.fm/bible/DDNBIV/2CO/11/","pub":"Они Евреи?","lit":"[Они] евреи?","parse":"Eburu — еврей; yom — показатель множественности; no — предикативный элемент; ba — вопросительная частица.","note":"Отдельного подлежащего «они» в этой фразе нет; оно восстановлено в русском переводе по контексту."},{"k":2,"pid":"П14","head":"NT18, JHN 1:21","rst":true,"dendi":"Ni no Eli?","source":"NT18, JHN 1:21","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"ты Илия?","lit":"Ты — Илия?","parse":"Ni — ты, самостоятельная форма; no — предикативный элемент; Eli — Илия.","note":"Вопрос без ba и dee: по письменному тексту нельзя установить точную вопросительную интонацию."},{"k":3,"pid":"П21","head":"NT95, JHN 21:12, PDF с. 75","rst":true,"dendi":"Ni no mee?","source":"NT95, JHN 21:12, PDF с. 75","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=75","pub":"кто Ты?","lit":"Ты — кто?","parse":"Ni — ты; no — предикативный элемент; mee — кто?.","note":"Полный вопрос, который ученики не решаются задать; это не вопрос на да/нет."},{"k":4,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."},{"k":5,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."}],"refs":[{"t":"NT18, 2 Кор 11:22","u":"https://zeno.fm/bible/DDNBIV/2CO/11/"},{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"}]},{"label":"II","form":"nɔ","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке."],"full":1,"status":"","examples":[{"k":1,"pid":"П16","head":"AL64, PDF с. 20","rst":false,"dendi":"Ifɔ nɔ noo dendeni?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","lit":"Что именно [адресат вопроса] изучил?","parse":"Ifɔ — что?; nɔ — выделительный/предикативный элемент; noo — форма адресата в пособии; лицо и число отдельно не установлены; dendeni — изучать / учиться.","note":"Дословная глосса намеренно содержит квадратные скобки: лицо и число адресата не подтверждены отдельным описанием местоименной системы. Это полный пример с незавершённой грамматической интерпретацией, а не образец для самостоятельного составления фраз."}],"refs":[{"t":"NT18, 2 Кор 11:22","u":"https://zeno.fm/bible/DDNBIV/2CO/11/"},{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"}]},{"label":"III","form":"nɔ̀","notes":["Тонированная форма AL65. В П53 — именная предикация; фонетическая и функциональная тождественность другим написаниям во всех контекстах не утверждается. Полных примеров: 1."],"full":null,"status":"","examples":[{"k":1,"pid":"П53","head":"AL65, PDF и печ. с. 52","rst":false,"dendi":"Ciniji nɔ̀.","source":"AL65, PDF и печ. с. 52.","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52","lit":"[Это] дождь.","parse":"Ciniji — дождь; nɔ̀ — предикативный элемент, представляет названное явление. Указательное слово «это» отдельно не выражено и добавлено в русском переводе в квадратных скобках.","note":"Это отдельное законченное предложение внутри объяснения круговорота воды, после описания падающих капель. Ciniji обозначает здесь дождь; равнозначность во всех контекстах с hari и bɛɛnɛ-hari не установлена. Низкий тон nɔ̀ сохранён по источнику. Краткость предложения не означает, что цитата обрезана."}],"refs":[]}],"extra_refs":[{"t":"NT18, Ин 1:21","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 16:31","u":"https://zeno.fm/bible/DDNBIV/JHN/16/"},{"t":"NT18, Деян 22:27","u":"https://zeno.fm/bible/DDNBIV/ACT/22/"}],"linked":[{"k":1,"pid":"П30","head":"","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":2,"pid":"П44","head":"","rst":true,"dendi":"Ǹ cii: Ni no andebi di? À tu ka cii. Awo.","source":"NT95, Ин 1:21, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"Пророк? Он отвечал: нет.","lit":"Они сказали: ты — тот пророк? Он ответил: нет.","parse":"Ǹ — они; cii — сказать; Ni — ты; no — предикативный элемент; andebi — пророк; di — определительный элемент; À — он; tu — ответить; ka — связь действий; Awo — нет.","note":"Вопрос без ba и dee; ответ Awo приведён вместе с вопросом. Перед Awo в издании напечатана точка после cii; она сохранена, хотя русский перевод оформляет ответ двоеточием. Cii во второй части также означает «сказать». Полный русский стих включает предшествующий вопрос об Илии; здесь приведена соответствующая часть."},{"k":3,"pid":"П63","head":"","rst":false,"dendi":"Iyaali fɔ́ bara nɔ̀ baabɛ, nyaa nda koo au kooyo.","source":"AL65, PDF и печ. с. 56","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56","lit":"Одна семья — это отец, мать и ребёнок или дети.","parse":"Iyaali — семья; fɔ́ — один, одна; bara — компонент связочной конструкции bara nɔ̀; nɔ̀ — компонент той же связочной конструкции; baabɛ — отец; nyaa — мать; nda — и; koo — ребёнок; au — или; kooyo — дети, форма источника.","note":"Полное определение из урока о семье; это учебное описание конкретного состава семьи, не универсальное этнографическое определение. Нетонированное bara сохранено. kooyo передано как форма множественного числа в этом контексте без самостоятельного обобщения правил суффиксации."},{"k":4,"pid":"П69","head":"","rst":false,"dendi":"Sigiri barà nɔ̀ hanuyo beiyom azansi.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Календарь — средство узнавания дней.","parse":"Sigiri — календарь; barà — компонент связочной конструкции barà nɔ̀; nɔ̀ — компонент той же связочной конструкции; hanuyo — дни; beiyom — знание, узнавание; производное от bei; azansi — средство, способ.","note":"Полное определение из календарного урока. barà nɔ̀ здесь связывает тему с определением, а не вводит список, как в П48. beiyom — именное производное, не голая глагольная форма bei."},{"k":5,"pid":"П82","head":"","rst":false,"dendi":"Jiiri nuusamtɛ cin kàà nɔ̀ jiiri 4 kulu nga à gonda jibiri 366.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Високосный год приходит каждые четыре года, и в нём 366 дней.","parse":"Jiiri — год; nuusamtɛ — високосный; cin — показатель обычного повторяющегося действия в этом контексте; kàà — приходить; nɔ̀ — предикативно-выделительный элемент; jiiri — год; 4 — цифровая запись числа 4; kulu — каждый, весь; nga — связь частей, здесь «и»; à — он, год; gonda — иметь; jibiri — день; 366 — цифровая запись числа 366.","note":"Полное утверждение из календарного урока. Это упрощённая формулировка учебника: исключения календарного правила цитата не описывает. На с. 76 в упражнении встречается перестановка подписей; она не используется для переопределения nuusamtɛ и kubantɛ. nga здесь связывает части, а à занимает позицию субъекта."},{"k":6,"pid":"П86","head":"","rst":false,"dendi":"Sana keena go guuru cabe no","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Маленькая стрелка показывает часы.","parse":"Sana — стрелка часов; keena — маленький; go — предглагольный показатель; guuru — час, единица времени; cabe — показывать; no — предикативно-выделительный элемент.","note":"Самостоятельная строка описания стрелок, без конечной точки в печати. Это часовая стрелка; слово «часовая» непосредственно не вставлено в цитату. keena не исправлено в cɛna или cɛɛnɛ."},{"k":7,"pid":"П89","head":"","rst":true,"dendi":"Ikpɛ na bɔrɔ fɔ dɔntɔm, à maa no Yohana.","source":"NT18, Ин 1:6","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Был человек, посланный от Бога; имя ему Иоанн.","lit":"Бог послал одного человека, его имя — Иоанн.","parse":"Ikpɛ — Бог; na — показатель переходного действия; bɔrɔ — человек; fɔ — один, некий; dɔntɔm — посылать; à — он, здесь его; maa — имя; no — связочный элемент; Yohana — Иоанн.","note":"Полное предложение, включая часть об имени. maa здесь «имя», не «слышать». Активная конструкция денди сохранена в авторском переводе, несмотря на страдательный оборот русского параллельного текста."}],"stray":[],"kind":"extra","meaning":"Функции устанавливаются по конструкции; no/nɔ не объявляются взаимозаменяемыми написаниями или переводом «ли»."},{"n":277,"title":"Связующий элемент: ka / Ka","letter":"С","variants":[{"label":"I","form":"ka","notes":[],"full":null,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."},{"k":2,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":3,"pid":"П23","head":"NT95, Мф 24:25, PDF с. 20","rst":true,"dendi":"Guna, a jina ka cii wom sɛ kɔ.","source":"NT95, Мф 24:25, PDF с. 20","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20","pub":"Вот, Я наперед сказал вам.","lit":"Посмотри, я уже заранее сказал вам.","parse":"Guna — посмотри; a — я; jina — предшествовать; здесь заранее; ka — связующий элемент; cii — сказать; wom — вы; sɛ — адресат: кому; kɔ — уже.","note":"Jina ka cii передаёт предварительное предупреждение; jina здесь не переводится как отдельное физическое движение."},{"k":4,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."},{"k":5,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":6,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":7,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":8,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."},{"k":9,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."},{"k":10,"pid":"П51","head":"AL65, PDF и печ. с. 31","rst":false,"dendi":"Kabu zǎ 1 ka kwei 9.","source":"AL65, PDF и печ. с. 31.","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=31","lit":"Считай начиная с 1, продвигаясь до 9.","parse":"Kabu — считай; побуждение без отдельного местоимения; zǎ — начиная с, от; 1 — число 1, записанное цифрой; ka — связывает действие с последующим kwei; kwei — идти, продвигаться; в данном задании обозначает достижение верхней границы счёта; 9 — число 9, записанное цифрой.","note":"Полная инструкция перед рядом 1–9. Естественный русский перевод: «Считай от одного до девяти». Цифры не заменены дендийскими словами: их произношение эта цитата не удостоверяет. Сочетание ka kwei передаёт здесь предел «до»; отдельное kwei не объявляется универсальным предлогом «до»."},{"k":11,"pid":"П52","head":"AL65, PDF и печ. с. 32","rst":false,"dendi":"Kabu zǎ 20 nda 20, zǎ 20 ka kwei 100.","source":"AL65, PDF и печ. с. 32.","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=32","lit":"Считай по 20, начиная с 20 и продвигаясь до 100.","parse":"Kabu — считай; zǎ — от, начиная с; в первом сочетании zǎ 20 nda 20 участвует в указании шага; 20 — число 20 (три употребления); nda — связующий элемент в конструкции шага 20 nda 20; повторное zǎ — начало диапазона; ka — связь с kwei; kwei — идти, продвигаться, здесь до указанного предела; 100 — число 100.","note":"Полное задание на счёт с постоянным шагом. Сочетание zǎ 20 nda 20 в этом арифметическом контексте означает счёт двадцатками; это не сложение 20 + 20. Ожидаемый ряд: 20, 40, 60, 80, 100. Функция nda устанавливается для этой конструкции и не подменяется механически переводом «и» или «с»."}],"refs":[{"t":"NT95, JHN 1:46, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"},{"t":"NT18, ACT 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT95, Мф 24:25, PDF с. 20","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20"},{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"},{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]},{"label":"II","form":"Ka","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."},{"k":2,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."}],"refs":[{"t":"NT95, JHN 1:46, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"},{"t":"NT18, ACT 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П44","head":"","rst":true,"dendi":"Ǹ cii: Ni no andebi di? À tu ka cii. Awo.","source":"NT95, Ин 1:21, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"Пророк? Он отвечал: нет.","lit":"Они сказали: ты — тот пророк? Он ответил: нет.","parse":"Ǹ — они; cii — сказать; Ni — ты; no — предикативный элемент; andebi — пророк; di — определительный элемент; À — он; tu — ответить; ka — связь действий; Awo — нет.","note":"Вопрос без ba и dee; ответ Awo приведён вместе с вопросом. Перед Awo в издании напечатана точка после cii; она сохранена, хотя русский перевод оформляет ответ двоеточием. Cii во второй части также означает «сказать». Полный русский стих включает предшествующий вопрос об Илии; здесь приведена соответствующая часть."},{"k":2,"pid":"П45","head":"","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."},{"k":3,"pid":"П50","head":"","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."},{"k":4,"pid":"П57","head":"","rst":true,"dendi":"Wo ka aduwa tɛ, cɛyom si.","source":"NT18, 1 Фес 5:17","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Непрестанно молитесь.","lit":"Совершайте молитву, прекращения нет.","parse":"Wo — побуждение к адресатам; ka — связующий элемент при действии; aduwa — молитва; tɛ — делать, совершать; cɛyom — прекращение, перерыв; si — отрицание наличия, здесь «нет».","note":"Полная фраза включает обе части, разделённые запятой. aduwa tɛ буквально «делать молитву», по-русски «молиться». Постпозиционное si в cɛyom si отличается от позиции si перед глаголом; здесь не следует восстанавливать несуществующее слово «непрестанно»."},{"k":5,"pid":"П59","head":"","rst":true,"dendi":"Wa hɛ kulu yaase guna, ka ihinnɔ dii ka jɛ.","source":"NT18, 1 Фес 5:21","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Все испытывайте, хорошего держитесь.","lit":"Всё проверьте, а хорошее возьмите и удерживайте.","parse":"Wa — побуждение к адресатам; hɛ — вещь, нечто; kulu — всё; yaase — проверить, испытать в сочетании yaase guna; guna — смотреть, в сочетании «проверить»; ka — связь действий; ihinnɔ — хорошее; dii — взять, ухватить; ka — связь действий; jɛ — держать, сохранять.","note":"Взято всё предложение, а не его часть до запятой. yaase guna рассматривается совместно как «проверить»; отдельные оттенки yaase не объявляются исчерпывающе установленными. dii здесь не di «видеть» и не dii «гореть». ihinnɔ — субстантивированное «хорошее», без подстановки иной записи hinno."},{"k":6,"pid":"П66","head":"","rst":false,"dendi":"N mà nufi hantum ka cou.","source":"AL65, PDF и печ. с. 66","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=66","lit":"Запиши результат и прочитай [его].","parse":"N — ты; mà — побудительный показатель; nufi — результат; hantum — писать, записывать; ka — связь действий; cou — читать.","note":"Полная инструкция к арифметическому заданию. Дополнение «его» в русском восстановлено из контекста и заключено в скобки: отдельного местоимения после cou нет."},{"k":7,"pid":"П70","head":"","rst":false,"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."},{"k":8,"pid":"П80","head":"","rst":false,"dendi":"Nɔɔru ka à cindi kɛ̀ɛsu kuna kabu.","source":"AL65, PDF и печ. с. 59","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=59","lit":"Посчитай деньги, которые остались в кассе.","parse":"Nɔɔru — деньги; ka — относительная связь; à — оно, отсылка к оставшейся сумме; cindi — оставаться; kɛ̀ɛsu — касса, денежный ящик; kuna — внутри, в; kabu — считать, посчитай.","note":"Целая инструкция в задаче о школьной кассе. Требуется остаток после покупки. Денди использует à, хотя естественный русский перевод «деньги» требует множественного числа."},{"k":9,"pid":"П81","head":"","rst":false,"dendi":"Cìi gwei ka n go tɛɛ.","source":"AL65, PDF и печ. с. 61","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=61","lit":"Скажи, какую работу ты делаешь.","parse":"Cìi — сказать, скажи; gwei — работа, действие; ka — относительная связь; n — ты; go — предглагольный показатель; tɛɛ — делать.","note":"Полный самостоятельный пункт упражнения. Буквальная структура: «назови работу, которую ты делаешь». Относительное ka не становится вопросительной частицей от русского перевода «какую». Долгое ɛɛ сохранено."},{"k":10,"pid":"П83","head":"","rst":false,"dendi":"Nufi di hantum ka cii.","source":"AL65, PDF и печ. с. 78","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=78","lit":"Запиши этот результат и назови [его].","parse":"Nufi — результат; di — определительный элемент, этот; hantum — записывать; ka — связь действий; cii — сказать, назвать.","note":"Полная инструкция после задачи о делении; в печати hantumka без пробела — словораздел нормализован. Соседняя формула содержит несовпадающие 249 и 239: числовая опечатка не исправляется и не переносится в выбранную словесную инструкцию."},{"k":11,"pid":"П85","head":"","rst":false,"dendi":"Ali nà mɔnturu di yeti ka nɛɛra F 9300.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али затем перепродал эти часы за 9300 франков.","parse":"Ali — Али; nà — показатель переходного действия; mɔnturu — часы; di — определительный элемент; yeti — снова, повторно в сочетании yeti ka; ka — связь действий; nɛɛra — продавать; F — обозначение франка; 9300 — цифровая запись числа 9300.","note":"Полное второе предложение той же задачи; П84 сообщает о покупке. yeti ka nɛɛra в этом контексте передано как «перепродать». Из одного примера не выводится самостоятельное значение yeti «возвращать» во всех контекстах."}],"stray":[],"kind":"extra","meaning":"В П9 связывает зависимый глагол; в П13 вводит обстоятельственную часть. Разные функции выделены отдельно."},{"n":278,"title":"Связующий элемент: ko","letter":"С","variants":[{"label":"","form":"ko","notes":["Вводит следующее действие. Точная аспектуальная/синтаксическая классификация здесь не установлена; перевод связи действий контекстный."],"full":2,"status":"","examples":[{"k":1,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":2,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":279,"title":"Связующий элемент: nga","letter":"С","variants":[{"label":"","form":"nga","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П82","head":"AL65, PDF и печ. с. 70","rst":false,"dendi":"Jiiri nuusamtɛ cin kàà nɔ̀ jiiri 4 kulu nga à gonda jibiri 366.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Високосный год приходит каждые четыре года, и в нём 366 дней.","parse":"Jiiri — год; nuusamtɛ — високосный; cin — показатель обычного повторяющегося действия в этом контексте; kàà — приходить; nɔ̀ — предикативно-выделительный элемент; jiiri — год; 4 — цифровая запись числа 4; kulu — каждый, весь; nga — связь частей, здесь «и»; à — он, год; gonda — иметь; jibiri — день; 366 — цифровая запись числа 366.","note":"Полное утверждение из календарного урока. Это упрощённая формулировка учебника: исключения календарного правила цитата не описывает. На с. 76 в упражнении встречается перестановка подписей; она не используется для переопределения nuusamtɛ и kubantɛ. nga здесь связывает части, а à занимает позицию субъекта."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"В П82 связывает части предложения, приблизительно «и / а». По позиции отличается от местоименного nga из статьи «Он».","related":"П82."},{"n":280,"title":"Связывать","letter":"С","variants":[{"label":"","form":"hɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 23","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=23"},{"t":"NT18, Ин 13:5","u":"https://zeno.fm/bible/DDNBIV/JHN/13/"},{"t":"NT18, Евр 11:36","u":"https://zeno.fm/bible/DDNBIV/HEB/11/"},{"t":"NT18, Мф 27:2","u":"https://zeno.fm/bible/DDNBIV/MAT/27/"},{"t":"NT18, Мк 5:3","u":"https://zeno.fm/bible/DDNBIV/MRK/5/"},{"t":"NT18, Рим 7:2","u":"https://zeno.fm/bible/DDNBIV/ROM/7/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":137,"sci":"H, §E №199, с. 43. Практическая орфография и контекст требуют сверки."},{"n":281,"title":"Святой Дух","letter":"С","variants":[{"label":"","form":"Biya Halaala","notes":["Полное составное именование; не выводится автоматически общее прилагательное «святой» для любой сочетаемости."],"full":1,"status":"","examples":[{"k":1,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":282,"title":"Семья","letter":"С","variants":[{"label":"","form":"iyaali, Iyaali","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П63","head":"AL65, PDF и печ. с. 56","rst":false,"dendi":"Iyaali fɔ́ bara nɔ̀ baabɛ, nyaa nda koo au kooyo.","source":"AL65, PDF и печ. с. 56","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56","lit":"Одна семья — это отец, мать и ребёнок или дети.","parse":"Iyaali — семья; fɔ́ — один, одна; bara — компонент связочной конструкции bara nɔ̀; nɔ̀ — компонент той же связочной конструкции; baabɛ — отец; nyaa — мать; nda — и; koo — ребёнок; au — или; kooyo — дети, форма источника.","note":"Полное определение из урока о семье; это учебное описание конкретного состава семьи, не универсальное этнографическое определение. Нетонированное bara сохранено. kooyo передано как форма множественного числа в этом контексте без самостоятельного обобщения правил суффиксации."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Семья; в определении из учебного пособия. Заглавная буква обусловлена началом предложения.","related":"П63."},{"n":283,"title":"Семя","letter":"С","variants":[{"label":"I","form":"dimiize","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 27","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=27"}]},{"label":"II","form":"dimi-ize","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 13:4","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, Лк 8:11","u":"https://zeno.fm/bible/DDNBIV/LUK/8/"},{"t":"NT18, 1 Кор 15:38","u":"https://zeno.fm/bible/DDNBIV/1CO/15/"}]},{"label":"III","form":"dimi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 13:31","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":55,"meaning":"dimi — зерно/семя; dimi-ize — семя, в том числе в притче о сеятеле."},{"n":284,"title":"Сердце","letter":"С","variants":[{"label":"","form":"bine","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мф 15:19","u":"https://zeno.fm/bible/DDNBIV/MAT/15/"},{"t":"NT18, 2 Кор 6:12","u":"https://zeno.fm/bible/DDNBIV/2CO/6/"},{"t":"NT18, Лк 12:34","u":"https://zeno.fm/bible/DDNBIV/LUK/12/"},{"t":"NT18, Рим 9:2","u":"https://zeno.fm/bible/DDNBIV/ROM/9/"},{"t":"NT18, Деян 7:54","u":"https://zeno.fm/bible/DDNBIV/ACT/7/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":90,"sci":"H, §E №107, с. 37. Практическая орфография и контекст требуют сверки."},{"n":285,"title":"Сестра","letter":"С","variants":[{"label":"","form":"cɛɛnɛ","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П54","head":"NT18, Ин 11:5","rst":true,"dendi":"Yesu go baa Marata nda à cɛɛnɛ nda Lazaa.","source":"NT18, Ин 11:5","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус же любил Марфу и сестру ее и Лазаря.","lit":"Иисус любит Марфу, её младшую сестру и Лазаря.","parse":"Yesu — Иисус; go — предглагольный показатель; baa — любить; Marata — Марфа; nda — и; à — она, здесь её; cɛɛnɛ — младшая сестра в этом контексте; nda — и; Lazaa — Лазарь.","note":"Полное повествовательное предложение. В Ин 11:1 и 11:28 сестра Марфы названа Mariyama. Слово cɛɛnɛ не ограничено мужским полом: сравните П32 в статье «Брат». Русское прошедшее время параллельного перевода не является отдельным значением go."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Младшая сестра в контексте П54; та же форма в П32 соответствует «брат». Пол устанавливается по референту, не только по слову.","related":"П54."},{"n":286,"title":"Сжимать","letter":"С","variants":[{"label":"","form":"kankam","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 6:38","u":"https://zeno.fm/bible/DDNBIV/LUK/6/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":130,"meaning":"kankam — утрамбовать/сжать, в описании меры."},{"n":287,"title":"Сидеть","letter":"С","variants":[{"label":"","form":"gɔrɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 28:2","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"},{"t":"AL65, PDF с. 87","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=87"},{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"AL65, PDF с. 47","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=47"},{"t":"NT18, Еф 3:17","u":"https://zeno.fm/bible/DDNBIV/EPH/3/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":124,"sci":"H, §E №191, с. 43. Практическая орфография и контекст требуют сверки."},{"n":288,"title":"Следовать","letter":"С","variants":[{"label":"","form":"gana","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П92","head":"NT18, Ин 1:37","rst":true,"dendi":"Coobaaba-ize hinka di maa Yohana go sendi ya di. Ǹ na Yesu gana.","source":"NT18, Ин 1:37","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Услышав от него сии слова, оба ученика пошли за Иисусом.","lit":"Те два ученика услышали, как Иоанн говорит так. Они последовали за Иисусом.","parse":"Coobaaba-ize — ученик, сложное слово; hinka — два; di — определительный элемент; maa — слышать; Yohana — Иоанн; go — предглагольный показатель; sendi — говорить; ya — компонент сочетания ya di «так»; di — компонент сочетания ya di; Ǹ — они; na — показатель переходного действия; Yesu — Иисус; gana — следовать за.","note":"Приведены оба предложения стиха. ya di после глагола речи передаёт «так»: его нельзя механически разобрать как выделительное ya из П19. Coobaaba-ize сохранено с дефисом. maa здесь «слышать», не «имя»."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Следовать за кем-либо; ученики следуют за Иисусом в П92.","related":"П92."},{"n":289,"title":"Слышать","letter":"С","variants":[{"label":"","form":"maa","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":2,"pid":"П92","head":"NT18, Ин 1:37","rst":true,"dendi":"Coobaaba-ize hinka di maa Yohana go sendi ya di. Ǹ na Yesu gana.","source":"NT18, Ин 1:37","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Услышав от него сии слова, оба ученика пошли за Иисусом.","lit":"Те два ученика услышали, как Иоанн говорит так. Они последовали за Иисусом.","parse":"Coobaaba-ize — ученик, сложное слово; hinka — два; di — определительный элемент; maa — слышать; Yohana — Иоанн; go — предглагольный показатель; sendi — говорить; ya — компонент сочетания ya di «так»; di — компонент сочетания ya di; Ǹ — они; na — показатель переходного действия; Yesu — Иисус; gana — следовать за.","note":"Приведены оба предложения стиха. ya di после глагола речи передаёт «так»: его нельзя механически разобрать как выделительное ya из П19. Coobaaba-ize сохранено с дефисом. maa здесь «слышать», не «имя»."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Ин 3:8","u":"https://zeno.fm/bible/DDNBIV/JHN/3/"},{"t":"NT18, Откр 13:9","u":"https://zeno.fm/bible/DDNBIV/REV/13/"},{"t":"NT18, Мф 22:33","u":"https://zeno.fm/bible/DDNBIV/MAT/22/"},{"t":"NT18, Мк 4:18","u":"https://zeno.fm/bible/DDNBIV/MRK/4/"},{"t":"NT18, Лк 4:28","u":"https://zeno.fm/bible/DDNBIV/LUK/4/"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":102,"sci":"AT, №58. Практическая орфография и контекст требуют сверки."},{"n":290,"title":"Смеяться","letter":"С","variants":[{"label":"","form":"haaru","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 6:21","u":"https://zeno.fm/bible/DDNBIV/LUK/6/"},{"t":"NT18, Мф 9:24","u":"https://zeno.fm/bible/DDNBIV/MAT/9/"},{"t":"NT18, Деян 17:32","u":"https://zeno.fm/bible/DDNBIV/ACT/17/"},{"t":"NT18, Мк 15:20","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"},{"t":"NT18, Лк 23:11","u":"https://zeno.fm/bible/DDNBIV/LUK/23/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":100},{"n":291,"title":"Смотреть; посмотри","letter":"С","variants":[{"label":"I","form":"Guna","notes":["Побудительная форма «посмотри»; выделение самостоятельной основы и тоновой парадигмы не выполнено."],"full":1,"status":"","examples":[{"k":1,"pid":"П23","head":"NT95, Мф 24:25, PDF с. 20","rst":true,"dendi":"Guna, a jina ka cii wom sɛ kɔ.","source":"NT95, Мф 24:25, PDF с. 20","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20","pub":"Вот, Я наперед сказал вам.","lit":"Посмотри, я уже заранее сказал вам.","parse":"Guna — посмотри; a — я; jina — предшествовать; здесь заранее; ka — связующий элемент; cii — сказать; wom — вы; sɛ — адресат: кому; kɔ — уже.","note":"Jina ka cii передаёт предварительное предупреждение; jina здесь не переводится как отдельное физическое движение."}],"refs":[{"t":"NT95, Мф 24:25, PDF с. 20","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20"}]},{"label":"II","form":"gùna","notes":["Побудительное употребление после объекта; тон сохранён по AL65. Сопоставляйте с Guna в П23, не исправляя написание источника."],"full":2,"status":"","examples":[{"k":1,"pid":"П49","head":"AL65, PDF с. 70","rst":false,"dendi":"Alaama wɔ̀ gùna.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Посмотри на это изображение.","parse":"Alaama — изображение; иллюстрация в учебнике; wɔ̀ — этот; gùna — посмотри; побудительное употребление.","note":"Буквальная именная группа — «это изображение». Полная инструкция перед заданием о календаре. Порядок: объект перед глаголом. Тоны wɔ̀ и gùna сохранены именно по этой странице; они не переносятся автоматически на нетонированное Guna в NT95."},{"k":2,"pid":"П74","head":"AL65, PDF и печ. с. 13","rst":false,"dendi":"N mà alaama wɔ̀ gùna.","source":"AL65, PDF и печ. с. 13","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=13","lit":"Посмотри на это изображение.","parse":"N — ты; mà — побудительный показатель; alaama — изображение; wɔ̀ — этот; gùna — смотреть, посмотри.","note":"Целая инструкция перед изображением приготовления пищи. В отличие от П49, здесь выражены N и mà. В печати màalaama слито: нормализован только пробел между показателем и существительным; буквы и тоны сохранены."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П59","head":"","rst":true,"dendi":"Wa hɛ kulu yaase guna, ka ihinnɔ dii ka jɛ.","source":"NT18, 1 Фес 5:21","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Все испытывайте, хорошего держитесь.","lit":"Всё проверьте, а хорошее возьмите и удерживайте.","parse":"Wa — побуждение к адресатам; hɛ — вещь, нечто; kulu — всё; yaase — проверить, испытать в сочетании yaase guna; guna — смотреть, в сочетании «проверить»; ka — связь действий; ihinnɔ — хорошее; dii — взять, ухватить; ka — связь действий; jɛ — держать, сохранять.","note":"Взято всё предложение, а не его часть до запятой. yaase guna рассматривается совместно как «проверить»; отдельные оттенки yaase не объявляются исчерпывающе установленными. dii здесь не di «видеть» и не dii «гореть». ihinnɔ — субстантивированное «хорошее», без подстановки иной записи hinno."},{"k":2,"pid":"П62","head":"","rst":false,"dendi":"Fotoo wɔ guna.","source":"AL65, PDF и печ. с. 56","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56","lit":"Посмотри на это изображение.","parse":"Fotoo — изображение, фотография; wɔ — этот; guna — смотри, посмотри.","note":"Полная инструкция к рисунку семьи. Нетонированное wɔ сохранено именно как на этой странице; не заменено wɔ̀ из других инструкций. Повелительный смысл задаётся учебной ситуацией."}],"stray":[],"kind":"extra"},{"n":292,"title":"Снег","letter":"С","variants":[{"label":"","form":"nɛzi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 28:3","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":164,"meaning":"nɛzi — снег в сравнении с белой одеждой."},{"n":293,"title":"Снова (в сочетаниях ye ka и yeti ka)","letter":"С","variants":[{"label":"I","form":"ye ka","notes":["Повторность события в ye ka maa jo. Самостоятельные значения ye за пределами сочетания здесь не обобщены."],"full":1,"status":"","examples":[{"k":1,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]},{"label":"II","form":"yeti ka","notes":["Сочетание в AL65 с. 106 при повторном переходе к продаже. Не исправляется в ye ka из NT95."],"full":1,"status":"","examples":[{"k":1,"pid":"П85","head":"AL65, PDF и печ. с. 106","rst":false,"dendi":"Ali nà mɔnturu di yeti ka nɛɛra F 9300.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али затем перепродал эти часы за 9300 франков.","parse":"Ali — Али; nà — показатель переходного действия; mɔnturu — часы; di — определительный элемент; yeti — снова, повторно в сочетании yeti ka; ka — связь действий; nɛɛra — продавать; F — обозначение франка; 9300 — цифровая запись числа 9300.","note":"Полное второе предложение той же задачи; П84 сообщает о покупке. yeti ka nɛɛra в этом контексте передано как «перепродать». Из одного примера не выводится самостоятельное значение yeti «возвращать» во всех контекстах."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":294,"title":"Собака","letter":"С","variants":[{"label":"","form":"hansi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 8","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=8"},{"t":"NT18, Мк 7:27","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Мф 15:27","u":"https://zeno.fm/bible/DDNBIV/MAT/15/"},{"t":"NT18, Откр 22:15","u":"https://zeno.fm/bible/DDNBIV/REV/22/"},{"t":"NT18, 2 Пет 2:22","u":"https://zeno.fm/bible/DDNBIV/2PE/2/"},{"t":"NT18, Лк 16:21","u":"https://zeno.fm/bible/DDNBIV/LUK/16/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":47,"sci":"H, §E №65, с. 35. Практическая орфография и контекст требуют сверки."},{"n":295,"title":"Собственный","letter":"С","variants":[{"label":"","form":"ŋmɔne","notes":["Значение ограничено a ŋmɔne Ikpɛ; не универсальный эквивалент «сам»."],"full":2,"status":"","examples":[{"k":1,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."},{"k":2,"pid":"П91","head":"NT18, Ин 1:11","rst":true,"dendi":"À kaa nga ŋmɔne yom dɔ amma ǹ mana à ta.","source":"NT18, Ин 1:11","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Пришел к своим, и свои Его не приняли.","lit":"Он пришёл к своим, но они его не приняли.","parse":"À — он; kaa — приходить; nga — он, здесь притяжательная отсылка; ŋmɔne — собственный, свой; yom — показатель множественности; dɔ — к, в сфере указанного лица или группы; amma — но; ǹ — они; mana — отрицание; à — он, здесь его; ta — принимать.","note":"Полное предложение. nga ŋmɔne yom — «свои» как группа людей; слово «люди» отдельно не выражено. kaa здесь глагол прихода, в отличие от предглагольного употребления в П88. dɔ разбирается как послелог этой конструкции."}],"refs":[{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":296,"title":"Совершенно (в сочетании о молчании)","letter":"С","variants":[{"label":"","form":"sakai","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."}],"refs":[{"t":"NT18, ACT 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Перевод подтверждён только сочетанием в П13; универсальный русский эквивалент не установлен."},{"n":297,"title":"Совещаться; решать","letter":"С","variants":[{"label":"","form":"saawara","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П93","head":"NT18, Ин 11:53","rst":true,"dendi":"Za hanu nga di ǹ saawara ngei ma à wi.","source":"NT18, Ин 11:53","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"С этого дня положили убить Его.","lit":"С того дня они решили, чтобы они убили его.","parse":"Za — с, начиная с; hanu — день; nga — указательная отсылка в сочетании nga di; di — определительный элемент; ǹ — они; saawara — совещаться, принять решение в контексте; ngei — они, самостоятельная форма; ma — модально-побудительный показатель зависимого действия; à — он, здесь его; wi — убивать.","note":"Полное предложение после совещания, описанного в Ин 11:47–52. Решение — убить Иисуса — выражено зависимой частью. Saawara не получает отдельного значения «убивать». В отличие от русского параллельного текста, денди явно выражает субъект ngei зависимой части."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Совещаться, принять решение; П93 следует за описанием совета. Решение выражено зависимой частью ngei ma … .","related":"П93."},{"n":298,"title":"Солнце","letter":"С","variants":[{"label":"","form":"weenu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 27","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=27"},{"t":"NT18, Мф 13:6","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL64, PDF с. 10","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=10"},{"t":"AL65, PDF с. 99","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=99"},{"t":"AL65, PDF с. 73","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=73"},{"t":"AL65, PDF с. 72","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=72"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":147,"sci":"H, §E №116, с. 38. Практическая орфография и контекст требуют сверки."},{"n":299,"title":"Соль","letter":"С","variants":[{"label":"","form":"ciiri","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 7","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=7"},{"t":"NT18, Лк 14:34","u":"https://zeno.fm/bible/DDNBIV/LUK/14/"},{"t":"NT18, Мк 9:49","u":"https://zeno.fm/bible/DDNBIV/MRK/9/"},{"t":"NT18, Кол 4:6","u":"https://zeno.fm/bible/DDNBIV/COL/4/"},{"t":"NT18, Мф 5:13","u":"https://zeno.fm/bible/DDNBIV/MAT/5/"},{"t":"NT18, М
