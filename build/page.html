vue d’ethnoécologie 15, 2019, DOI 10.4000/ethnoecologie.4356. Получен полный HTML статьи. Обзор посвящён хлопку, прядению, ткачеству и истории местного производства. Французское изложение содержит отдельные денди-наименования, в том числе harri kware, harri bi и habou sando, в авторской записи. Эти формы не превращаются в полные фразы денди; французские свидетельства не объявляются опубликованным русским переводом.","url":"https://journals.openedition.org/ethnoecologie/4356"},{"code":"N89","desc":"Robert Nicolaï. Revernacularisation et déterminismes évolutifs: Songhay septentrional et dendi. Current Approaches to African Linguistics VI, 1989, с. 100–114. DOI 10.1515/9783110884890-008. Тематика — история изменения языка и контакт. Подтверждена авторская запись HAL hal-05506021; она не содержит доступного файла полного текста. Издательская страница не открылась. Новые лексические формы на основании одной библиографии не приписаны статье.","url":"https://hal.science/hal-05506021v1"},{"code":"G88","desc":"Euphrasie Moudachirou & Michelle Dossou. Le guide pratique de transcription de la langue dendi. Cotonou, 1988. Подтверждена каталоговая запись WorldCat; полный текст не получен. По назначению это важный источник правил письма, но конкретные правила и слова без страниц ему не приписаны.","url":"https://search.worldcat.org/fr/title/guide-pratique-de-transcription-de-la-langue-dendi/oclc/32453905"},{"code":"GYK","desc":"Mama Yola Kpara. Guide de transcription et de lecture du dendi cine. 53 с., ISBN 978-99919-0-031-5. Подтверждена карточка Национальной библиотеки Бенина; PDF книги не получен. Каталожная карточка не подтверждает год: упоминавшийся ранее 2014 не принят как установленная дата. Ссылка на GUIDE D’APPRENTISSAGE DENDI в ALPHA возвращает двухстраничную служебную выгрузку сайта, а не текст руководства.","url":"https://bibliographie.bnb.bj/resources/book_details/3825/"},{"code":"NT18","desc":"Dendi New Testament, отметка © 2018 Bibles International; DDNBIV на Zeno. Использован ранее собранный текст 27 книг, 260 глав; новые учебные формы сопоставлены с ним. Дата © не доказывает сама по себе степень переработки перевода 1995 года.","url":"https://zeno.fm/bible/DDNBIV/"},{"code":"NT95","desc":"The New Testament in Dendi, © 1995 Bibles International. Digital Bible Society; 179 с. PDF. Примеры снабжены номерами страниц PDF. Написания NT95 и NT18 приводятся раздельно при наличии различий.","url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf"},{"code":"H","desc":"Harrison, Harrison & Rueck. Southern Songhay Speech Varieties in Niger. SIL Electronic Survey Reports 1999-004; полевые работы 1997. Используется дендийская строка TAN (Танда), а не соседние разновидности сонгай. Полевая фонетическая запись сохранена как указатель для сверки.","url":"https://media.corban.edu/hydra/media/files/2019/09/10/southern-songhay-silesr1999_004-1.pdf"},{"code":"AT / AZ","desc":"ASJP: Dendi (Tersis 1968) и Dendi 2 (Zima 1994, Джугу). Это сокращённые кодированные выборки, не практическая орфография. Полный словарь Zima 1994 не проверен по полному тексту; данные ASJP не объявлены чтением всей книги.","url":"https://asjp.clld.org/languages/DENDI_2"}],"rst":{"title":"Опубликованный русский параллельный текст","desc":"Синодальный перевод RST. Строки одного стиха объединены полностью; параллельный перевод отделён от авторского буквального перевода денди.","label":"RST: исходные файлы Синодального текста","url":"https://github.com/bibleonline/rst"},"plinks":{"П2":[["N",336],["sinda",167],["wɛndɛ",77],["ba",362]],"П45":[["Yesu",99],["cii",40],["ǹ / Ǹ",186],["sɛ",229],["sɛ",229],["Wom",32],["faham",227],["nda",228],["hɛ",18],["yom",216],["wɔ",379],["kulu",29],["tu",191],["ka",277],["à",185],["Oò",49],["Kpe",45]],"П79":[["Susuba",347],["à",185],["nà",217],["48",372],["48",372],["nɛɛra",248]],"П65":[["Couniji",318],["wɔ̀",379],["cou",373]],"П19":[["Ifɔ̀",375],["ya",33],["ci",381],["KOFID-19",1]],"П27":[["Cɔfɔ",325],["Moisi",150],["nda",228],["Eli",101],["hunutɛr ,й,ю,я,ям,ями,ях","широкий":"|наиширочайшая,наиширочайшего,наиширочайшее,наиширочайшей,наиширочайшем,наиширочайшему,наиширочайшею,наиширочайшие,наиширочайший,наиширочайшим,наиширочайшими,наиширочайших,наиширочайшую,пошире,шире,широк,широка,широкая,широки,широкие,широкий,широким,широкими,широких,широко,широкого,широкое,широкой,широком,широкому,широкою,широкую,широчайшая,широчайшего,широчайшее,широчайшей,широчайшем,широчайшему,широчайшею,широчайшие,широчайший,широчайшим,широчайшими,широчайших,широчайшую,ширше","шить":"ш|ей,ейте,ил,ила,или,ило,ить,ьем,ьет,ьете,ьешь,ью,ьют","элемент":"элемент|,а,ам,ами,ах,е,ов,ом,у,ы","это":"эт|им,о,ого,ом,ому","этот":"|ета,ети,етим,етими,етих,ето,етого,етой,етом,етому,етот,ету,эта,эти,этим,этими,этих,это,этого,этой,этом,этому,этот,эту","я":"|меня,мне,мной,мною,я","явиться":"яв|ившись,илась,ились,илось,ился,имся,имтесь,ись,итесь,ится,иться,ишься,люсь,ясь,ятся","являться":"явля|вшись,емся,етесь,ется,ешься,йся,йтесь,лась,лись,лось,лся,ться,юсь,ются,ясь","язык":"язы|к,ка,кам,ками,ках,ке,ки,ков,ком,ку,цех","яйцо":"я|иц,йца,йцам,йцами,йцах,йце,йцо,йцом,йцу"},"built":"14.10.2026"}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const E = D.entries;
const byN = {}; E.forEach(e => byN[e.n] = e);
const ALPHA = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ'.split('');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const foldRu = s => s.toLowerCase().replace(/ё/g, 'е');
const foldDn = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/ɛ/g,'e').replace(/ɔ/g,'o').replace(/ŋ/g,'n').replace(/ɲ/g,'ny').replace(/[‹›«»"'’.,;:!?()\/]/g,'').replace(/[\s-]+/g,'');
const fold = s => foldDn(foldRu(s));
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; }

// варианты, формы, примеры
const variantForms = v => v.form.split(/[;,]\s+/).map(f => f.replace(/\s*\(.*?\)\s*/g, ' ').trim()).filter(Boolean);
const allForms = e => [...new Set(e.variants.flatMap(variantForms))];
const examplesOf = e => [...e.variants.flatMap(v => v.examples), ...(e.linked || [])];
const PID = {};   // П → { ex, entries[] }
E.forEach(e => examplesOf(e).forEach(x => { (PID[x.pid] = PID[x.pid] || { ex: x, entries: [] }); if (!PID[x.pid].entries.includes(e)) PID[x.pid].entries.push(e); }));
const PIDS = Object.keys(PID).sort((a, b) => +a.slice(1) - +b.slice(1));
const ST = {
  all: E.length, sw: E.filter(e => e.kind === 'swadesh').length, extra: E.filter(e => e.kind === 'extra').length,
  ex: PIDS.length, withEx: E.filter(e => examplesOf(e).length).length, unest: E.filter(e => e.unestablished).length
};

// источники → якоря
const SRC_IDS = {};
D.sources.forEach((s, i) => {
  s.id = 'src' + i;
  s.code.split(/[ \/—]+/).filter(c => /^[A-Z0-9]+$/.test(c)).forEach(c => SRC_IDS[c] = s.id);
  if (s.code.startsWith('T68')) SRC_IDS['T68/72'] = s.id;
});
if (D.rst) SRC_IDS['RST'] = 'srcrst';
const CODE_RE = /\b(T68\/72|NT18|NT95|AL\d+|COV|CAL|CFA|ANT|SM19|N78|N89|G88|GYK|RST|AT|AZ|H)\b/g;
const rich = s => esc(s)
  .replace(CODE_RE, m => SRC_IDS[m] ? `<a class="code" href="#${SRC_IDS[m]}" title="Описание источника">${m}</a>` : m)
  .replace(/П(\d+)/g, (m, d) => PID['П' + d] ? `<a class="pid" href="#p${d}" title="Полный пример ${m}">${m}</a>` : m);
const extLink = (text, url) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);

const formIndex = {};
E.forEach(e => allForms(e).forEach(ff => { const k = foldDn(ff); (formIndex[k] = formIndex[k] || []).push({ e, form: ff }); }));
const lettersPresent = new Set(E.map(e => e.letter));
const tagsFor = e => {
  const t = [];
  if (e.kind === 'extra') t.push('<span class="tag info">доп.</span>');
  if (e.unestablished) t.push('<span class="tag warn">написание не установлено</span>');
  return t.join(' ');
};
const wordLink = e => `<a href="#w${e.n}">${esc(e.title)}</a>`;
const primaryForms = e => e.variants.slice(0, 2).map(v => v.form).join(', ');

function drawAbc(active) {
  document.getElementById('abc').innerHTML = ALPHA.map((L, i) =>
    lettersPresent.has(L) ? `<a href="#l${i}" class="${L === active ? 'on' : ''}">${L}</a>` : `<span aria-hidden="true">${L}</span>`).join('');
}
const inLetter = L => E.filter(e => e.letter === L);

function letterGroup(L) {
  const items = inLetter(L).map(e => `<li>${wordLink(e)}${e.unestablished && !e.variants.length ? '<span class="none">—</span>' : `<span class="f">${esc(primaryForms(e))}</span>`}${e.kind === 'extra' ? ' <span class="tag info">доп.</span>' : ''}</li>`).join('');
  return `<section class="lgroup" id="g${ALPHA.indexOf(L)}"><div class="L">${L}</div><ul class="wl">${items}</ul></section>`;
}

const V = document.getElementById('view');
function vHome() {
  return `<div class="stack">
    <h1>Русско-дендийский словарь</h1>
    <p class="lead">Денди — сонгайский язык северного Бенина и приграничья с Нигером и Нигерией. Словарь объединяет базовую лексику списка Сводеша и слова, нужные для чтения дендийских текстов: варианты письма с источниками и полные примеры с двумя переводами и разбором по словам.</p>
    <div class="statline"><span><b>${ST.all}</b> ${plural(ST.all, 'статья', 'статьи', 'статей')}</span><span><b>${ST.sw}</b> из списка Сводеша</span><span><b>${ST.extra}</b> ${plural(ST.extra, 'дополнительная', 'дополнительные', 'дополнительных')}</span><span><b>${ST.ex}</b> <a href="#examples">${plural(ST.ex, 'полный пример', 'полных примера', 'полных примеров')}</a></span><span><b>${ST.unest}</b> без установленного написания</span></div>
    <p class="small muted"><a href="#about">Как пользоваться словарём</a></p>
    <div class="letters">${ALPHA.filter(L => lettersPresent.has(L)).map(letterGroup).join('')}</div>
  </div>`;
}

function vLetter(i) {
  const L = ALPHA[i];
  if (!lettersPresent.has(L)) return vHome();
  const list = inLetter(L);
  return `<div class="stack">
    <div class="crumbs"><a href="#home">Словник</a><span>›</span><span>${L}</span></div>
    <h1>${L}</h1>
    <p class="muted">${list.length} ${plural(list.length, 'статья', 'статьи', 'статей')}</p>
    <ul class="res">${list.map(e => `<li><span class="rt">${wordLink(e)} ${tagsFor(e)}</span>${e.variants.length ? `<span class="rf">${esc(e.variants.map(v => v.form).join(' · '))}</span>` : '<span class="rx">Практическое написание не установлено</span>'}</li>`).join('')}</ul>
  </div>`;
}

// пример
function parseItems(p) {
  const items = [];
  p.replace(/\.$/, '').split(/;\s*/).forEach(seg => {
    const m = seg.match(/^(.+?) — (.+)$/);
    if (m) items.push({ w: m[1], g: m[2] }); else if (items.length) items[items.length - 1].g += '; ' + seg; else items.push({ w: '', g: seg });
  });
  return items;
}
function parseChips(p, pid) {
  const items = parseItems(p);
  const links = (D.plinks && D.plinks[pid]) || [];
  items.forEach(it => { const hit = links.find(([w, n]) => n && w === it.w); if (hit) it.n = hit[1]; });
  return `<div class="gloss">${items.map(i => `<span>${i.w ? `<span class="gw">${i.n && byN[i.n] ? `<a href="#w${i.n}" title="${esc(byN[i.n].title)}">${esc(i.w)}</a>` : esc(i.w)}</span>` : ''}<span class="gg">${esc(i.g)}</span></span>`).join('')}</div>`;
}
function exCard(x, here, num) {
  const others = (PID[x.pid]?.entries || []).filter(e => e !== here);
  return `${here && x.lead ? x.lead.map(t => `<p class="small">${rich(t)}</p>`).join('') : ''}<article class="exc">
    <div class="exh"><span class="pidtag">${num ? `Пример ${num} · ` : ''}${x.pid}</span><span class="src">${extLink(x.source, x.source_url)}</span></div>
    <p class="dsent">${esc(x.dendi)}</p>
    <dl class="exf">
      <dt>Опубликованный перевод${x.rst ? ' <span class="tag info">Синодальный</span>' : ''}</dt><dd>${x.pub ? esc(x.pub) : '<span class="muted">Опубликованного русского перевода нет.</span>'}</dd>
      <dt>Дословный перевод</dt><dd>${esc(x.lit)}</dd>
      <dt>Разбор по словам</dt><dd>${parseChips(x.parse, x.pid)}</dd>
      ${x.note ? `<dt>Примечание</dt><dd>${rich(x.note)}</dd>` : ''}
    </dl>
    ${others.length ? `<p class="small muted">Этот пример есть и в ${plural(others.length, 'статье', 'статьях', 'статьях')}: ${others.map(wordLink).join(', ')}</p>` : ''}
  </article>`;
}
const refList = refs => `<ul class="refs">${refs.map(r => `<li>${extLink(r.t, r.u)}</li>`).join('')}</ul>`;

function vWord(n) {
  const e = byN[n]; if (!e) return vHome();
  const idx = E.indexOf(e), prev = E[idx - 1], next = E[idx + 1];
  const nEx = new Set(examplesOf(e).map(x => x.pid)).size;
  const meta = `<span>№ ${e.n}</span>${e.kind === 'swadesh' ? `<span>Сводеш № ${e.swadesh}</span>` : '<span class="tag info">дополнительная лексика</span>'}`
    + (e.variants.length > 1 ? `<span>${e.variants.length} ${plural(e.variants.length, 'вариант', 'варианта', 'вариантов')}</span>` : '')
    + `<span>${nEx ? `${nEx} ${plural(nEx, 'полный пример', 'полных примера', 'полных примеров')}` : 'полных примеров пока нет'}</span>`;
  const vars = e.variants.map(v => `<section class="variant">
      <div class="vh">${v.label ? `<span class="vl">${v.label}</span>` : ''}<span class="vf">${esc(v.form)}</span></div>
      ${v.notes.map(p => `<p>${rich(p)}</p>`).join('')}
      ${v.examples.length ? `<div class="exs">${v.examples.map(x => exCard(x, e, x.k)).join('')}</div>` : (v.status ? `<p class="small muted">${esc(v.status)}</p>` : '')}
      ${v.refs.length ? `<div class="stack" style="gap:4px"><span class="label">Источники формы и дополнительные контексты · ${v.refs.length}</span>${refList(v.refs)}</div>` : ''}
    </section>`).join('');
  const rel = new Map();
  allForms(e).forEach(ff => (formIndex[foldDn(ff)] || []).forEach(x => { if (x.e !== e) rel.set(x.e.n, x); }));
  const relHtml = rel.size ? `<section class="stack"><span class="label">То же написание в других статьях</span><div class="related">${[...rel.values()].map(x => `<span><span class="dn">${esc(x.form)}</span> → ${wordLink(x.e)}</span>`).join('')}</div></section>` : '';
  return `<article class="stack" style="gap:22px">
    <div class="crumbs"><a href="#home">Словник</a><span>›</span><a href="#l${ALPHA.indexOf(e.letter)}">${e.letter}</a></div>
    <div class="entry-head"><h1>${esc(e.title)}</h1><div class="meta">${meta}</div></div>
    ${e.unestablished ? `<div class="box warn"><span class="label">Написание не установлено</span>${esc(e.unestablished)}</div>` : ''}
    ${e.meaning ? `<div class="box"><span class="label">Значение и употребление</span>${rich(e.meaning)}</div>` : ''}
    ${vars}
    ${(e.linked || []).length ? `<section class="variant"><div class="vh"><span class="vf" style="font-family:var(--f-display);font-size:1.15rem">Другие полные примеры с этим словом</span></div><p class="small muted">Примеры, в разборе которых есть ссылка на эту статью.</p><div class="exs">${e.linked.map(x => exCard(x, e)).join('')}</div></section>` : ''}
    ${e.related ? `<p class="small"><span class="muted">Связанные примеры:</span> ${rich(e.related)}</p>` : ''}
    ${e.extra_refs.length ? `<section class="stack" style="gap:4px"><span class="label">Дополнительные источниковые привязки</span>${refList(e.extra_refs)}</section>` : ''}
    ${relHtml}
    ${e.sci ? `<section class="stack small"><span class="label">Для сверки</span><p><span class="muted">Научный указатель.</span> ${rich(e.sci)}</p></section>` : ''}
    <nav class="pager">${prev ? `<a href="#w${prev.n}"><small>← предыдущая</small>${esc(prev.title)}</a>` : ''}${next ? `<a class="next" href="#w${next.n}"><small>следующая →</small>${esc(next.title)}</a>` : ''}</nav>
  </article>`;
}

function vExamples(focus) {
  return `<div class="stack" style="gap:22px">

  if (gs.length) parts.push(`<div class="pblk"><span class="plab">В разборах примеров</span><ul>${gs.slice(0, 4).map(g => `<li><span class="dn">${esc(g.w)}</span> — ${esc(g.gloss)} <span class="small">${g.pids.slice(0, 3).map(p => `<a class="pid" href="#p${p.slice(1)}">${p}</a>`).join(' ')}${g.pids.length > 3 ? ' …' : ''}</span></li>`).join('')}${gs.length > 4 ? `<li class="muted small">и ещё ${gs.length - 4}</li>` : ''}</ul></div>`);
  const found = parts.length > 0, hint = lemmaHint(word);
  return { found, html: `<div class="ptok${found ? '' : ' unk'}"><span class="ptw ru">${esc(word)}</span>${hint ? `<span class="small muted">начальная форма: ${esc(hint)}</span>` : ''}${found ? parts.join('') : '<p class="small muted">Этого слова нет ни в заголовках статей, ни в разборах примеров.</p>'}</div>` };
}
function ruResults(text) {
  const words = ruWords(text);
  if (!words.length) return '<p class="muted">В тексте нет русских слов.</p>';
  const cards = words.map(ruTokCard), ok = cards.filter(c => c.found).length;
  const fq = fold(text);
  const exact = PIDS.find(p => fold(PID[p].ex.lit || '') === fq || (PID[p].ex.pub && fold(PID[p].ex.pub) === fq));
  const qw = words.map(w => ({ w, keys: ruKeys(w, false) }));
  const allQ = new Set(qw.flatMap(q => q.keys));
  const sim = exact ? [] : RU_EX.map(r => {
    const hit = qw.filter(q => q.keys.some(k => r.keys.has(k)));
    return { ...r, hit, score: hit.reduce((s, q) => s + (q.w.length <= 2 ? 0.3 : Math.min(q.w.length, 5)), 0) / Math.sqrt(r.keys.size + 1) };
  }).filter(r => r.hit.length).sort((a, b) => b.score - a.score).slice(0, 5);
  const hlRu = t => t.replace(/[а-яё]+/gi, w => ruKeys(w, false).some(k => allQ.has(k)) ? `<mark>${w}</mark>` : w);
  return `<p class="statline"><span>Найдено: <b>${ok}</b> из ${words.length}</span>${words.length - ok ? `<span>не найдено: <b>${words.length - ok}</b></span>` : ''}</p>
    ${exact ? `<div class="box"><span class="label">Эта фраза есть в словаре целиком</span>Ниже её полный пример на денди с переводами и разбором.</div>${exCard(PID[exact].ex, null)}` : ''}
    ${sim.length ? `<section class="stack"><h2>Как это сказано в примерах</h2><p class="small muted">Полные фразы на денди, в переводе которых есть ваши слова в любой форме. Это проверенные цитаты, а не перевод вашей фразы.</p>
      <ul class="res">${sim.map(r => `<li><span class="rt"><a class="pid" href="#p${r.p.slice(1)}">${r.p}</a> <span class="dn">${esc(r.x.dendi)}</span></span><span class="rx">${hlRu(esc(r.x.lit))}</span></li>`).join('')}</ul></section>` : ''}
    <section class="stack"><h2>Слова</h2><div class="ptoks">${cards.map(c => c.html).join('')}</div></section>`;
}

// ---------- страница ----------
let parseText = '', parseDir = 'auto';
try { parseText = localStorage.getItem('dn-parse') || ''; parseDir = localStorage.getItem('dn-pdir') || 'auto'; } catch (_) {}
if (!['auto', 'dn', 'ru'].includes(parseDir)) parseDir = 'auto';
if (!parseText && PIDS.length) parseText = PID[PIDS[0]].ex.dendi;
const dirOf = text => parseDir === 'auto' ? (isRu(text) ? 'ru' : 'dn') : parseDir;
function parseResults(text) {
  if (!text.trim()) return '<p class="muted">Вставьте фразу на денди или по-русски и нажмите «Найти».</p>';
  const dir = dirOf(text);
  const head = `<p class="small muted">${dir === 'ru' ? 'Русский → денди' : 'Денди → русский'}${parseDir === 'auto' ? ' · язык определён автоматически' : ''}</p>`;
  return head + (dir === 'ru' ? ruResults(text) : dnResults(text));
}
function dnResults(text) {
  const toks = analyze(text);
  if (!toks.length) return '<p class="muted">В тексте нет слов на денди.</p>';
  const n = toks.length, ok = toks.filter(t => t.forms.length || t.gloss.length).length, guess = toks.filter(t => t.guess).length;
  const exact = PIDS.find(p => foldDn(PID[p].ex.dendi) === foldDn(text));
  const sim = exact ? [] : similarExamples(text);
  return `<p class="statline"><span>Найдено: <b>${ok}</b> из ${n}</span>${guess ? `<span>предположений: <b>${guess}</b></span>` : ''}${n - ok - guess ? `<span>нет в словаре: <b>${n - ok - guess}</b></span>` : ''}</p>
    ${exact ? `<div class="box"><span class="label">Эта фраза есть в словаре целиком</span>Ниже её полный пример с переводами и разбором.</div>${exCard(PID[exact].ex, null)}` : ''}
    <div class="ptoks">${toks.map(tokCard).join('')}</div>
    ${sim.length ? `<section class="stack"><h2>Похожие полные примеры</h2><p class="small muted">Фразы из словаря с теми же словами. Их переводы проверены; сравните конструкцию со своей.</p>
      <ul class="res">${sim.map(r => `<li><span class="rt"><a class="pid" href="#p${r.p.slice(1)}">${r.p}</a> <span class="dn">${hlWords(r.x.dendi, r.common)}</span></span><span class="rx">${esc(r.x.lit)}</span></li>`).join('')}</ul></section>` : ''}`;
}
const hlWords = (text, keys) => text.split(/(\s+)/).map(w => keys.includes(foldDn(w.replace(/[.,;:!?«»"()]/g, ''))) ? `<mark>${esc(w)}</mark>` : esc(w)).join('');
function vParse() {
  const step = Math.max(1, Math.floor(PIDS.length / 4));
  const samples = PIDS.filter((p, i) => i % step === 0).slice(0, 4);
  const ruSamples = PIDS.filter((p, i) => i % step === Math.floor(step / 2)).slice(0, 3);
  const dirBtn = (v, label) => `<button type="button" class="pdir${parseDir === v ? ' on' : ''}" data-dir="${v}" aria-pressed="${parseDir === v}">${label}</button>`;
  return `<div class="stack" style="gap:18px">
    <h1>Перевод фразы</h1>
    <p>Вставьте предложение на денди или по-русски. Для каждого слова сайт найдёт статьи словаря и значения из разборов полных примеров, а ниже покажет похожие фразы с готовым проверенным переводом. На денди тон и долготу можно не набирать.</p>
    <div class="box warn"><span class="label">Как это работает</span>Сайт показывает только то, что уже есть в словаре, и ничего не достраивает. Слово может иметь несколько значений, а грамматика денди описана не полностью, поэтому смысл фразы определяет читатель. Для русской фразы сайт не составляет предложение на денди: он показывает слова и проверенные примеры, из которых его можно собрать.</div>
    <form id="pform" class="stack" style="gap:8px">
      <div class="prow"><label for="ptext" class="label">Фраза</label><div class="pdirs" role="group" aria-label="Направление">${dirBtn('auto', 'Авто')}${dirBtn('dn', 'С денди')}${dirBtn('ru', 'С русского')}</div></div>
      <textarea id="ptext" rows="3" class="dn" spellcheck="false" placeholder="N gunda wɛndɛ ba?  или:  У тебя есть жена?">${esc(parseText)}</textarea>
      <div class="prow"><div class="chars pchars" aria-label="Вставить букву"><button type="button" data-ch="ɛ">ɛ</button><button type="button" data-ch="ɔ">ɔ</button><button type="button" data-ch="ŋ">ŋ</button></div><button type="submit" class="btn">Найти</button></div>
      <div class="psamples"><span class="small muted">На денди:</span>${samples.map(p => `<button type="button" class="psample dn" data-p="${p}" data-f="dendi">${esc(PID[p].ex.dendi)}</button>`).join('')}</div>
      <div class="psamples"><span class="small muted">По-русски:</span>${ruSamples.map(p => `<button type="button" class="psample" data-p="${p}" data-f="lit">${esc(PID[p].ex.lit)}</button>`).join('')}</div>
    </form>
    <div id="pres" class="stack" style="gap:16px" aria-live="polite">${parseResults(parseText)}</div>
  </div>`;
}
function runParse(text) {
  parseText = text;
  try { localStorage.setItem('dn-parse', text); localStorage.setItem('dn-pdir', parseDir); } catch (_) {}
  const el = document.getElementById('pres'); if (el) el.innerHTML = parseResults(text);
}
if (document.addEventListener) {
  document.addEventListener('submit', ev => { if (ev.target.id === 'pform') { ev.preventDefault(); runParse(document.getElementById('ptext').value); } });
  document.addEventListener('keydown', ev => { if (ev.target.id === 'ptext' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); runParse(ev.target.value); } });
  document.addEventListener('click', ev => {
    const s = ev.target.closest && ev.target.closest('.psample');
    if (s) { const t = PID[s.dataset.p].ex[s.dataset.f]; document.getElementById('ptext').value = t; runParse(t); return; }
    const d = ev.target.closest && ev.target.closest('.pdir');
    if (d) {
      parseDir = d.dataset.dir;
      document.querySelectorAll('.pdir').forEach(x => { x.classList.toggle('on', x === d); x.setAttribute('aria-pressed', x === d); });
      runParse(document.getElementById('ptext').value); return;
    }
    const b = ev.target.closest && ev.target.closest('.pchars button');
    if (b) { const ta = document.getElementById('ptext'); const a = ta.selectionStart ?? ta.value.length, z = ta.selectionEnd ?? a; ta.value = ta.value.slice(0, a) + b.dataset.ch + ta.value.slice(z); ta.focus(); ta.setSelectionRange(a + 1, a + 1); }
  });
}

// маршрутизация
const PAGES = { parse: ['Перевод фразы', vParse], dendi: ['Денди → русский', vDendi], examples: ['Примеры', vExamples], grammar: ['Грамматика', vGrammar], sources: ['Источники', vSources], about: ['Как пользоваться', vAbout] };
function route() {
  const h = location.hash.slice(1) || 'home';
  let html, nav = '', L = null, scrollTo = null, title = 'Словарь денди', m;
  if ((m = h.match(/^w(\d+)$/)) && byN[+m[1]]) {
    const e = byN[+m[1]]; html = vWord(+m[1]); L = e.letter;
    title = `${e.title} — ${e.variants.length ? e.variants[0].form + ' · ' : ''}Словарь денди`;
  }
  else if ((m = h.match(/^l(\d+)$/))) { html = vLetter(+m[1]); L = ALPHA[+m[1]]; }
  else if ((m = h.match(/^g(\d+)$/))) { html = vHome(); nav = 'home'; scrollTo = h; L = ALPHA[+m[1]]; }
  else if ((m = h.match(/^p(\d+)$/))) { html = vExamples(h); nav = 'examples'; scrollTo = h; title = `П${m[1]} · Словарь денди`; }
  else if ((m = h.match(/^src(\d+|rst)$/))) { html = vSources(h); nav = 'sources'; scrollTo = h; }
  else if (h === 'search') { html = vSearch(); }
  else if (PAGES[h]) { html = PAGES[h][1](); nav = h; title = PAGES[h][0] + ' · Словарь денди'; }
  else { html = vHome(); nav = 'home'; }
  V.innerHTML = html;
  document.title = title;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === nav));
  drawAbc(L);
  if (scrollTo) { const el = document.getElementById(scrollTo); if (el) { el.scrollIntoView({ block: 'start' }); return; } }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

const qEl = document.getElementById('q');
let tmr;
qEl.addEventListener('input', () => {
  clearTimeout(tmr);
  tmr = setTimeout(() => {
    query = qEl.value;
    if (query.trim()) { if (location.hash !== '#search') location.hash = 'search'; else { V.innerHTML = vSearch(); drawAbc(null); document.querySelectorAll('#nav a').forEach(a => a.classList.remove('on')); } }
    else if (location.hash === '#search') location.hash = 'home';
  }, 150);
});
document.getElementById('sform').addEventListener('submit', ev => {
  ev.preventDefault(); query = qEl.value;
  const res = query.trim() ? IDX.find(r => r.t === foldRu(query.trim())) : null;
  if (res) location.hash = 'w' + res.e.n; else if (location.hash !== '#search') location.hash = 'search'; else route();
});
document.querySelectorAll('.chars button').forEach(b => b.addEventListener('click', () => {
  const s = qEl.selectionStart ?? qEl.value.length, e2 = qEl.selectionEnd ?? s;
  qEl.value = qEl.value.slice(0, s) + b.dataset.ch + qEl.value.slice(e2);
  qEl.focus(); qEl.setSelectionRange(s + 1, s + 1); qEl.dispatchEvent(new Event('input'));
}));
document.getElementById('inex').addEventListener('change', ev => {
  inEx = ev.target.checked; try { localStorage.setItem('dn-inex', inEx ? '1' : '0'); } catch (_) {}
  if (location.hash === '#search') route();
});
document.getElementById('foot').textContent = `Свод не является нормативным словарём языка.${D.built ? ' Данные документа на ' + D.built + '.' : ''}`;
route();
</script>
