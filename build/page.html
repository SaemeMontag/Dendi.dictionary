<title>Словарь денди</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: справочник — шапка с полосой тканого узора, липкий алфавит, одна колонка чтения ~68ch, статьи как карточки словаря без лишних рамок */
:root {
  --bg: #f5f6f9;          /* небелёный хлопок с холодным индиго-оттенком */
  --paper: #ffffff;
  --ink: #1b2145;         /* индиго-чернила */
  --muted: #5d6384;
  --line: #dde0ea;
  --accent: #2c3f9b;      /* индиго */
  --accent-soft: #e7eaf7;
  --ochre: #a2621b;       /* пометки: мало примеров, написание не установлено */
  --ochre-soft: #f6ecdc;
  --weave-a: #2c3f9b;
  --weave-b: #f5f6f9;
  --f-display: "Alegreya", "PT Serif", Georgia, serif;
  --f-body: "Alegreya Sans", "PT Sans", "Segoe UI", system-ui, sans-serif;
  --f-dendi: "Gentium Book Plus", "Gentium Plus", "Noto Serif", "Charis SIL", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12152a; --paper: #1a1e38; --ink: #e6e8f4; --muted: #a2a7c6; --line: #2d3254;
    --accent: #9fb0ff; --accent-soft: #252c55; --ochre: #e0a65e; --ochre-soft: #3a2d1c;
    --weave-a: #6f82e0; --weave-b: #12152a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12152a; --paper: #1a1e38; --ink: #e6e8f4; --muted: #a2a7c6; --line: #2d3254;
  --accent: #9fb0ff; --accent-soft: #252c55; --ochre: #e0a65e; --ochre-soft: #3a2d1c;
  --weave-a: #6f82e0; --weave-b: #12152a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.dn { font-family: var(--f-dendi); }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; }

header.top { background: var(--paper); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 18px 14px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand a { color: var(--ink); }
.brand .name { font-family: var(--f-display); font-weight: 700; font-size: 2rem; line-height: 1; letter-spacing: .01em; }
.brand .sub { color: var(--muted); font-size: .95rem; margin-top: 4px; }
nav.main { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .98rem; margin-left: auto; }
nav.main a { color: var(--muted); padding: 2px 0; border-bottom: 2px solid transparent; }
nav.main a.on { color: var(--ink); border-bottom-color: var(--accent); text-decoration: none; }
.weave { height: 8px; background:
  repeating-linear-gradient(90deg, var(--weave-a) 0 6px, var(--weave-b) 6px 9px, var(--weave-a) 9px 11px, var(--weave-b) 11px 18px); opacity: .85; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-direction: column; gap: 8px; padding-block: 10px; }
.search { display: flex; gap: 8px; align-items: center; }
.search input[type=search] { flex: 1; min-width: 0; font: inherit; font-family: var(--f-dendi); font-size: 1.05rem; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.search input[type=search]:focus { outline: 2px solid var(--accent); border-color: transparent; }
.chk { display: flex; align-items: center; gap: 6px; font-size: .88rem; color: var(--muted); white-space: nowrap; }
.chars { display: flex; gap: 4px; }
.chars button { font-family: var(--f-dendi); font-size: 1rem; width: 32px; height: 34px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 6px; cursor: pointer; }
.chars button:hover { border-color: var(--accent); }
.abc { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.abc a, .abc span { flex: 0 0 auto; min-width: 30px; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; padding: 3px 4px; border-radius: 5px; }
.abc a { color: var(--accent); }
.abc a:hover { background: var(--accent-soft); text-decoration: none; }
.abc a.on { background: var(--accent); color: var(--paper); }
.abc span { color: var(--line); }

main { padding-block: 24px 64px; }
.page { max-width: 760px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: 2.3rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.lead { font-size: 1.1rem; color: var(--ink); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.code { font-family: var(--f-mono); font-size: .82em; }
.statline { display: flex; flex-wrap: wrap; gap: 6px 18px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; }
.statline b { color: var(--ink); font-weight: 700; }

/* словник */
.letters { display: flex; flex-direction: column; gap: 22px; margin-top: 8px; }
.lgroup { display: grid; grid-template-columns: 52px 1fr; gap: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.lgroup .L { font-family: var(--f-display); font-weight: 700; font-size: 2rem; line-height: 1; color: var(--accent); }
.wl { list-style: none; margin: 0; padding: 0; columns: 3 200px; column-gap: 24px; }
.wl li { break-inside: avoid; padding: 2px 0; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.wl .f { font-family: var(--f-dendi); color: var(--muted); font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.wl .none { color: var(--ochre); font-size: .85rem; }
.tag { display: inline-block; font-size: .72rem; letter-spacing: .04em; padding: 1px 7px; border-radius: 99px; white-space: nowrap; font-weight: 500; vertical-align: 2px; }
.tag.warn { background: var(--ochre-soft); color: var(--ochre); }
.tag.info { background: var(--accent-soft); color: var(--accent); }

/* статья */
.crumbs { font-size: .9rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.entry-head { display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.entry-head .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .95rem; }
.forms { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
.forms li { display: grid; grid-template-columns: minmax(0, 13rem) 1fr; gap: 4px 16px; align-items: baseline; }
.forms .fw { font-family: var(--f-dendi); font-weight: 700; font-size: 1.45rem; line-height: 1.2; overflow-wrap: anywhere; }
.forms .fs { font-size: .9rem; color: var(--muted); min-width: 0; }
.forms .fn { grid-column: 2; font-size: .95rem; min-width: 0; }
.box { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.box.warn { background: var(--ochre-soft); border-color: transparent; }
.box .label { display: block; margin-bottom: 4px; }
.ex { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ex li { display: grid; grid-template-columns: 2.2rem 1fr; gap: 2px 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.ex li:first-child { border-top: 0; }
.ex .k { font-variant-numeric: tabular-nums; color: var(--muted); font-family: var(--f-mono); font-size: .85rem; padding-top: 4px; }
.ex .body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ex .dt { font-family: var(--f-dendi); font-size: 1.15rem; font-style: italic; overflow-wrap: anywhere; }
.ex .gl { font-size: 1rem; }
.ex .gl .gt { color: var(--muted); font-size: .82rem; margin-right: 6px; }
.ex .src { font-size: .85rem; color: var(--muted); }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; font-style: normal; }
.related { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.pager { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; font-size: .98rem; }
.pager a { display: flex; flex-direction: column; min-width: 0; }
.pager a.next { text-align: right; margin-left: auto; }
.pager small { color: var(--muted); font-size: .8rem; }

/* поиск */
.res { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.res li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.res .rt { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.res .rf { font-family: var(--f-dendi); color: var(--muted); overflow-wrap: anywhere; }
.res .rx { font-size: .92rem; color: var(--muted); overflow-wrap: anywhere; }
.res .rx .dn { font-style: italic; color: var(--ink); }

/* денди → русский */
.rev { display: flex; flex-direction: column; gap: 18px; }
.rev .grp { display: grid; grid-template-columns: 52px 1fr; gap: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.rev .grp .L { font-family: var(--f-dendi); font-weight: 700; font-size: 1.8rem; line-height: 1; color: var(--accent); }
.rev dl { margin: 0; display: grid; grid-template-columns: minmax(0, max-content) 1fr; gap: 3px 16px; }
.rev dt { font-family: var(--f-dendi); font-weight: 700; overflow-wrap: anywhere; }
.rev dd { margin: 0; min-width: 0; }

/* грамматика */
.rules { counter-reset: r; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.rules li { display: grid; grid-template-columns: 2rem 1fr; gap: 8px; }
.rules .n { font-family: var(--f-display); font-weight: 700; color: var(--accent); font-size: 1.15rem; }
.gex { display: flex; flex-direction: column; gap: 12px; }
.gex .box { display: flex; flex-direction: column; gap: 4px; }
.gex .id { font-family: var(--f-mono); font-size: .8rem; color: var(--accent); }
.gex .d { font-family: var(--f-dendi); font-size: 1.3rem; font-style: italic; }
.gex .r { font-weight: 500; }
.gloss { display: flex; flex-wrap: wrap; gap: 6px 4px; margin-top: 4px; }
.gloss span { display: inline-flex; flex-direction: column; align-items: flex-start; padding: 3px 8px; background: var(--bg); border-radius: 6px; }
.gloss .gw { font-family: var(--f-dendi); font-style: italic; }
.gloss .gw a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.gloss .gg { font-size: .78rem; color: var(--muted); }

/* источники */
.bars { display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums; }
.brow { display: grid; grid-template-columns: 4.2rem 1fr 6.5rem; gap: 10px; align-items: center; font-size: .92rem; }
.brow .track { height: 14px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
.brow .fill { height: 100%; background: var(--accent); }
.brow .v { text-align: right; color: var(--muted); }
.srcs { display: flex; flex-direction: column; gap: 16px; }
.srcs article { display: grid; grid-template-columns: 6rem 1fr; gap: 4px 14px; scroll-margin-top: 140px; }
.srcs .c { font-family: var(--f-mono); font-weight: 500; color: var(--accent); overflow-wrap: anywhere; }
.srcs .t { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.srcs .u { font-size: .85rem; overflow-wrap: anywhere; }
.srcs article.hl { background: var(--accent-soft); border-radius: 8px; }
footer { border-top: 1px solid var(--line); padding-block: 18px 28px; color: var(--muted); font-size: .88rem; }

@media (max-width: 560px) {
  body { font-size: 16px; }
  h1 { font-size: 1.9rem; }
  .brand .name { font-size: 1.7rem; }
  nav.main { margin-left: 0; }
  .forms li { grid-template-columns: 1fr; }
  .forms .fn { grid-column: 1; }
  .lgroup, .rev .grp { grid-template-columns: 1fr; gap: 4px; }
  .srcs article { grid-template-columns: 1fr; }
  .brow { grid-template-columns: 3.6rem 1fr 5.6rem; }
  .chk span.long { display: none; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
/* варианты и полные примеры */
.variant { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.vh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.vl { font-family: var(--f-display); font-weight: 700; color: var(--accent); font-size: 1.05rem; min-width: 1.6rem; }
.vf { font-family: var(--f-dendi); font-weight: 700; font-size: 1.5rem; line-height: 1.2; overflow-wrap: anywhere; }
.exs { display: flex; flex-direction: column; gap: 12px; }
.exc { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.exh { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; font-size: .88rem; color: var(--muted); }
.pidtag { font-family: var(--f-mono); font-size: .8rem; color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.dsent { font-family: var(--f-dendi); font-size: 1.25rem; line-height: 1.4; overflow-wrap: anywhere; }
.exf { margin: 0; display: grid; grid-template-columns: 11rem 1fr; gap: 6px 14px; }
.exf dt { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 3px; }
.exf dd { margin: 0; min-width: 0; }
.refs { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: .9rem; }
.refs li { white-space: nowrap; }
a.pid { font-family: var(--f-mono); font-size: .88em; }
.focus .exc { outline: 2px solid var(--accent); }
/* разбор фразы */
#ptext { font: inherit; font-family: var(--f-dendi); font-size: 1.2rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); width: 100%; resize: vertical; }
#ptext:focus { outline: 2px solid var(--accent); border-color: transparent; }
.prow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 500; padding: 8px 18px; border-radius: 8px; border: 0; background: var(--accent); color: var(--paper); cursor: pointer; }
.btn:hover { filter: brightness(1.1); }
.psamples { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.psample { font: inherit; font-family: var(--f-dendi); font-size: .92rem; padding: 3px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--paper); color: var(--ink); cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.psample:hover { border-color: var(--accent); }
.ptoks { display: flex; flex-wrap: wrap; gap: 10px; }
.ptok { flex: 1 1 13rem; min-width: 0; max-width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.ptok.unk { border-style: dashed; background: transparent; }
.ptok.guess { border-color: var(--ochre); }
.ptw { font-family: var(--f-dendi); font-weight: 700; font-size: 1.3rem; overflow-wrap: anywhere; }
.pblk ul { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: .95rem; }
.pdirs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pdir { font: inherit; font-size: .88rem; padding: 5px 12px; border: 0; background: var(--paper); color: var(--muted); cursor: pointer; }
.pdir + .pdir { border-left: 1px solid var(--line); }
.pdir.on { background: var(--accent); color: var(--paper); }
.ptw.ru { font-family: var(--f-body); }
.plab { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#view [id^="p"] { scroll-margin-top: 140px; }
@media (max-width: 560px) { .exf { grid-template-columns: 1fr; gap: 2px; } .exf dd { margin-bottom: 6px; } .refs li { white-space: normal; } }
</style>

  <div class="wrap">
    <div class="brand"><a href="#home"><span class="name">Денди</span></a><span class="sub">Русско-дендийский словарь · сонгай северного Бенина</span></div>

<div class="bar">

<script type="application/json" id="data">{"meta":{"title":"Денди — русско-дендийский словарь и грамматика","intro":["Словарь объединяет базовую лексику списка Сводеша и дополнительные слова и конструкции, необходимые для чтения дендийских текстов. Статьи расположены по русскому алфавиту. Варианты практического письма приводятся с указанием источника; одинаковое написание не гарантирует одинакового значения.","Внутри статьи после формы и пояснений следуют полные примеры. Метки П1–П93 обозначают уникальные контексты и сохраняются при их повторении в разных статьях. Опубликованный русский перевод и авторский дословный перевод имеют разные задачи: первый представляет русский параллельный текст, второй поясняет именно приведённую дендийскую фразу. Квадратные скобки и примечания отмечают восстановленные по контексту или неустановленные элементы.","Материал имеет неодинаковую полноту. Ссылка без полной цитаты называется источниковой привязкой и не считается готовым примером. Отсутствие полного примера или установленного практического написания обозначается явно. Сокращения источников раскрыты в библиографии."]},"grammar":{"title":"Грамматика: вопросы на «да/нет»","intro":["Правила описывают засвидетельствованные письменные конструкции источников библиографии. Полные предложения, два перевода, разбор и ограничения приведены в соответствующих словарных статьях. Интонационные правила и точное прагматическое различие ba/dee по этим текстам не установлены."],"rules":[{"n":1,"title":"Основное высказывание и порядок слов","paras":["В П1–П5 вопросительная ba следует за построенной предикацией. Обязательной перестановки подлежащего и сказуемого эти примеры не показывают. Рабочая схема для данных употреблений: подлежащее + сказуемое и зависимые слова + ba? П4 содержит именную предикацию с no; остальные — глагольную. Это наблюдение по корпусу, не универсальный запрет других порядков."],"refs":[]},{"n":2,"title":"Ba после предикации","paras":["П1: обладание с gunda; П2: отсутствие с sinda; П3: отрицание si и глагол tu; П4: Eburu yom no; П5: gunda naane. Во всех пяти полных вопросах ba конечна. Начальное Ba в П32 означает «даже», поэтому совпадение написания само по себе не доказывает вопросительную функцию."],"refs":[]},{"n":3,"title":"Dee и продолжение вопроса","paras":["П6–П9 содержат dee после основной предикации. Из этого не следует, что dee обязана быть последним словом любого вопроса: в NT95, Ин 1:50 после неё продолжается объяснение причины веры; в Мк 12:14 — альтернативная конструкция с wala. Эти дополнительные контексты пока приводятся как источниковые привязки, а не как готовые полные примеры с дословным разбором."],"refs":[{"t":"NT95: Ин 1:50, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"},{"t":"NT95: Мк 12:14, PDF с. 33","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=33"}]},{"n":4,"title":"Вопросы без ba и dee","paras":["П14, П44 и П45 показывают вопросы на «да/нет» без обеих частиц. П44 и П45 содержат также полные ответные реплики. По письменному тексту нельзя определить, какой именно интонационный контур отличает такое предложение от утверждения. Не всякий вопрос без ba/dee является вопросом на «да/нет»: П21 содержит вопросительное mee «кто?»."],"refs":[]},{"n":5,"title":"Отрицательный вопрос","paras":["Отрицание входит в предикацию, вопросительность выражается отдельно: sinda в П2, si в П3, mana в П7, na перед ci в П8. Одинаковое написание na в П8 не делает его показателем переходного действия, как nà в П17. Различные отрицательные конструкции не сведены к одному обязательному ожиданию ответа."],"refs":[]},{"n":6,"title":"Go и na не создают вопрос сами","paras":["Go встречается в П6, П11, П22 и в невопросительных П24, П28, П35; оно не эквивалент «ли». В П1–П5 go отсутствует. Na/nà также требует проверки конкретной конструкции. Нельзя добавлять эти элементы лишь потому, что фраза является вопросом, или механически удалять их из утверждений."],"refs":[]},{"n":7,"title":"No/nɔ и ya","paras":["No в П14, П21, П44 участвует в именной предикации, ya в П24, П34, П38, П40, П42 — в выделении и невопросительных конструкциях. Ни один элемент не равен неизменно русскому «ли». Глагольное no «дать» в П30 — другое употребление. Источниковое nɔ в П16 не нормализовано автоматически в no."],"refs":[]},{"n":8,"title":"Альтернатива с wala","paras":["Wala соединяет варианты. П29 — полное невопросительное предложение с альтернативой «двое или трое». Для вопросительной конструкции имеется привязка NT95, Мк 12:14; полный надёжный дословный разбор этого длинного вопроса ещё требуется. Наличие союза не доказывает обязательность отдельной частицы после каждого варианта."],"refs":[]},{"n":9,"title":"Короткие ответы в полном контексте","paras":["П44: Awo отвергает предположение «ты — тот пророк?». П45: Oò подтверждает понимание всего сказанного. Это полные вопросно-ответные пары; Oò сохраняет источниковый тон. Они не устанавливают правила ответа на отрицательный вопрос. Русскую логику «да/нет» нельзя автоматически переносить без контекстной проверки."],"refs":[]},{"n":10,"title":"Что остаётся неустановленным","paras":["Точные смысловые оттенки ba и dee, их взаимозаменяемость, интонация, диалектные ограничения и полный перечень вопросительных средств пока не доказаны. Конечные hɛ и na из отдельных записей не добавлены как вопросительные частицы без достаточного грамматического подтверждения."],"refs":[]}]},"entries":[{"n":1,"title":"COVID-19","letter":"C","variants":[{"label":"I","form":"KOFID-19","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П19","head":"COV, PDF с. 2","rst":false,"dendi":"Ifɔ̀ ya ci KOFID-19?","source":"COV, PDF с. 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2","lit":"Что является COVID-19?","parse":"Ifɔ̀ — что?; ya — выделительный элемент; ci — являться; KOFID-19 — COVID-19.","note":"Форма названия сохранена по заголовку; в других местах памятки есть COFID-19. Историческая памятка здесь используется как языковой материал, не как медицинское руководство. Тон вопросительного слова сохранён."}],"refs":[{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"}]},{"label":"II","form":"COFID-19","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П20","head":"COV, PDF с. 2","rst":false,"dendi":"Ifɔ̀yo ya ci COFID-19 màanayo?","source":"COV, PDF с. 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2","lit":"Какие [вещи] являются признаками COVID-19?","parse":"Ifɔ̀yo — какие?; форма с -yo сохранена; ya — выделительный элемент; ci — являться; COFID-19 — COVID-19; màanayo — признаки / симптомы в данном контексте.","note":"Русский буквальный перевод сохраняет вопросительную именную конструкцию; естественный смысл — «Каковы симптомы COVID-19?». Морфологическая классификация -yo отдельно не завершена; не смешивать этот пример с нейтральной словарной основой."}],"refs":[{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Название заболевания в памятке; варианты написания сохранены, медицинские рекомендации из примера не выводятся."},{"n":2,"title":"Али","letter":"А","variants":[{"label":"","form":"Ali","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П84","head":"AL65, PDF и печ. с. 106","rst":false,"dendi":"Ali nà mɔnturu fɔ́ dei F 8500 magazɛ̃ kuna.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али купил одни часы за 8500 франков в магазине.","parse":"Ali — Али, имя персонажа; nà — показатель переходного действия; mɔnturu — часы, прибор; fɔ́ — один; dei — покупать; F — обозначение франка в источнике; 8500 — цифровая запись числа 8500; magazɛ̃ — магазин; kuna — внутри, в.","note":"Полное первое предложение задачи о прибыли. mɔnturu соотносится по значению с agogo в CAL, сохраняя свою запись. Русское «одни часы» не означает множественное число слова денди. F — условное обозначение валюты, не реконструированное слово."},{"k":2,"pid":"П85","head":"AL65, PDF и печ. с. 106","rst":false,"dendi":"Ali nà mɔnturu di yeti ka nɛɛra F 9300.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али затем перепродал эти часы за 9300 франков.","parse":"Ali — Али; nà — показатель переходного действия; mɔnturu — часы; di — определительный элемент; yeti — снова, повторно в сочетании yeti ka; ka — связь действий; nɛɛra — продавать; F — обозначение франка; 9300 — цифровая запись числа 9300.","note":"Полное второе предложение той же задачи; П84 сообщает о покупке. yeti ka nɛɛra в этом контексте передано как «перепродать». Из одного примера не выводится самостоятельное значение yeti «возвращать» во всех контекстах."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Собственное имя персонажа задачи о покупке и продаже часов.","related":"П84, П85."},{"n":3,"title":"Белый","letter":"Б","variants":[{"label":"I","form":"kparɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 175","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=175"}]},{"label":"II","form":"ikpaarɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 5:36","u":"https://zeno.fm/bible/DDNBIV/MAT/5/"}]},{"label":"III","form":"kpaarɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Откр 14:14","u":"https://zeno.fm/bible/DDNBIV/REV/14/"},{"t":"AL64, PDF с. 11","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=11"},{"t":"AL64, PDF с. 12","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=12"}]},{"label":"IV","form":"harri kware","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"SM19, § 2, печ. с. 1","u":"https://journals.openedition.org/ethnoecologie/4356"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":175,"meaning":"Формы с i- сохраняют грамматическое оформление источника; kpaarɛ — форма без него. Отдельно приведено выражение из этнографической статьи SM19 в авторском написании; оно не считается установленной самостоятельной словарной формой.","sci":"H, §E №136, с. 39. Практическая орфография и контекст требуют сверки."},{"n":4,"title":"Близкий","letter":"Б","variants":[{"label":"I","form":"maani","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 3:2","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL64, PDF с. 14","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=14"},{"t":"AL65, PDF с. 60","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=60"},{"t":"NT18, Еф 2:17","u":"https://zeno.fm/bible/DDNBIV/EPH/2/"}]},{"label":"II","form":"màani","notes":["Ближайший медицинский пункт."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 11","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=11"}]},{"label":"III","form":"mààni","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 93","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=93"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":197,"meaning":"maani — приблизиться/быть близко.","sci":"H, §E №156, с. 40. Практическая орфография и контекст требуют сверки."},{"n":5,"title":"Бог","letter":"Б","variants":[{"label":"","form":"Ikpɛ","notes":["Именование в религиозном обращении."],"full":2,"status":"","examples":[{"k":1,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."},{"k":2,"pid":"П89","head":"NT18, Ин 1:6","rst":true,"dendi":"Ikpɛ na bɔrɔ fɔ dɔntɔm, à maa no Yohana.","source":"NT18, Ин 1:6","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Был человек, посланный от Бога; имя ему Иоанн.","lit":"Бог послал одного человека, его имя — Иоанн.","parse":"Ikpɛ — Бог; na — показатель переходного действия; bɔrɔ — человек; fɔ — один, некий; dɔntɔm — посылать; à — он, здесь его; maa — имя; no — связочный элемент; Yohana — Иоанн.","note":"Полное предложение, включая часть об имени. maa здесь «имя», не «слышать». Активная конструкция денди сохранена в авторском переводе, несмотря на страдательный оборот русского параллельного текста."}],"refs":[{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":6,"title":"Большой","letter":"Б","variants":[{"label":"I","form":"beeri","notes":["В сочетании taabi beeri «большие трудности»."],"full":1,"status":"","examples":[{"k":1,"pid":"П87","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Sana beeri go mintiyo cabe","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Большая стрелка показывает минуты.","parse":"Sana — стрелка часов; beeri — большой; go — предглагольный показатель; mintiyo — минуты, форма источника; cabe — показывать.","note":"Полная параллельная строка после П86, без конечной точки. no из предыдущей строки не дописано. mintiyo соотносится с minti на этой же печатной странице; различие формы сохранено."}],"refs":[{"t":"NT95, PDF с. 171","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=171"},{"t":"NT18, Мф 28:12","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"},{"t":"AL65, PDF с. 25","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=25"},{"t":"CFA, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=5"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"},{"t":"AL65, PDF с. 112","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=112"}]},{"label":"II","form":"bambata","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 12:40","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"}]},{"label":"III","form":"bèèri","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"}]},{"label":"IV","form":"bèeri","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 108","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=108"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":27,"sci":"H, §E №143, с. 39. Практическая орфография и контекст требуют сверки."},{"n":7,"title":"Бороться","letter":"Б","variants":[{"label":"","form":"guruje","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Еф 6:12","u":"https://zeno.fm/bible/DDNBIV/EPH/6/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":111,"meaning":"guruje — бороться/вести борьбу; контекст переносный."},{"n":8,"title":"Бояться","letter":"Б","variants":[{"label":"","form":"hamburu","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."}],"refs":[{"t":"NT95, PDF с. 104","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=104"},{"t":"NT18, Мф 28:5","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"},{"t":"AL65, PDF с. 76","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=76"},{"t":"NT18, Евр 10:31","u":"https://zeno.fm/bible/DDNBIV/HEB/10/"},{"t":"NT18, Ин 19:8","u":"https://zeno.fm/bible/DDNBIV/JHN/19/"},{"t":"NT18, Лк 1:50","u":"https://zeno.fm/bible/DDNBIV/LUK/1/"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":106},{"n":9,"title":"Брат","letter":"Б","variants":[{"label":"I","form":"cɛɛnɛ","notes":["В cɛɛnɛ yom — братья; показатель yom приведён отдельно."],"full":1,"status":"","examples":[{"k":1,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."}],"refs":[{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"}]},{"label":"II","form":"harume","notes":["В Ин 11:23 о Лазаре. Родственные значения harume и cɛɛnɛ сопоставлены только в засвидетельствованных контекстах; полная синонимия не установлена."],"full":1,"status":"","examples":[{"k":1,"pid":"П88","head":"NT18, Ин 11:23","rst":true,"dendi":"Yesu cii à sɛ: «N harume di kaa tunu kpɛɛnɛ.»","source":"NT18, Ин 11:23","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус говорит ей: воскреснет брат твой.","lit":"Иисус сказал ей: «Твой брат снова встанет [воскреснет]».","parse":"Yesu — Иисус; cii — сказать; à — она, Марфа; sɛ — послелог адресата; N — ты, здесь твой; harume — брат; di — определительный элемент; kaa — показатель предстоящего действия в этом контексте; tunu — встать, здесь воскреснуть; kpɛɛnɛ — ещё, снова.","note":"Сохранены вводная часть и целая реплика. Речь о Лазаре, брате Марфы; отсюда контекстное «воскреснуть». kaa перед tunu не переводится вторым глаголом «приходить». harume добавлено к статье «Брат», без утверждения о полном тождестве cɛɛnɛ."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":10,"title":"Брать","letter":"Б","variants":[{"label":"","form":"dii","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П59","head":"NT18, 1 Фес 5:21","rst":true,"dendi":"Wa hɛ kulu yaase guna, ka ihinnɔ dii ka jɛ.","source":"NT18, 1 Фес 5:21","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Все испытывайте, хорошего держитесь.","lit":"Всё проверьте, а хорошее возьмите и удерживайте.","parse":"Wa — побуждение к адресатам; hɛ — вещь, нечто; kulu — всё; yaase — проверить, испытать в сочетании yaase guna; guna — смотреть, в сочетании «проверить»; ka — связь действий; ihinnɔ — хорошее; dii — взять, ухватить; ka — связь действий; jɛ — держать, сохранять.","note":"Взято всё предложение, а не его часть до запятой. yaase guna рассматривается совместно как «проверить»; отдельные оттенки yaase не объявляются исчерпывающе установленными. dii здесь не di «видеть» и не dii «гореть». ihinnɔ — субстантивированное «хорошее», без подстановки иной записи hinno."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Взять, ухватить; в dii ka jɛ «взять и удерживать». Не смешивать по внешнему сходству с di «видеть» или dii «гореть».","related":"П59."},{"n":11,"title":"Братья по общине","letter":"Б","variants":[{"label":"","form":"nya-izei, Nya-izei","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П61","head":"NT18, 1 Фес 5:25","rst":true,"dendi":"Nya-izei, wa aduwa tɛ i sɛ.","source":"NT18, 1 Фес 5:25","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Братия! молитесь о нас.","lit":"Братья [по общине], совершайте молитву за нас.","parse":"Nya-izei — братья, обращение к членам общины; wa — побуждение к адресатам; aduwa — молитва; tɛ — делать, совершать; i — мы, здесь нас; sɛ — для, в пользу адресата молитвы.","note":"Обращение входит в полное предложение. Сложное Nya-izei сохранено с дефисом и не объявляется точным синонимом cɛɛnɛ во всех родственных отношениях. aduwa tɛ — «молиться»; i sɛ указывает, за кого просят."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Обращение к членам религиозной общины. Передано отдельной статьёй, поскольку значение не сводится к биологическому родству cɛɛnɛ.","related":"П61."},{"n":12,"title":"Бросать","letter":"Б","variants":[{"label":"I","form":"cetu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 71","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=71"},{"t":"NT18, Мк 7:27","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Откр 2:22","u":"https://zeno.fm/bible/DDNBIV/REV/2/"},{"t":"NT18, Лк 3:9","u":"https://zeno.fm/bible/DDNBIV/LUK/3/"}]},{"label":"II","form":"furu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 17:27","u":"https://zeno.fm/bible/DDNBIV/MAT/17/"},{"t":"NT18, Деян 27:19","u":"https://zeno.fm/bible/DDNBIV/ACT/27/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":136,"sci":"H, §E №193, с. 43. Практическая орфография и контекст требуют сверки."},{"n":13,"title":"В","letter":"В","variants":[{"label":"","form":"kuna","notes":["Постпозиция; соответствие зависит от конструкции."],"full":2,"status":"","examples":[{"k":1,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":2,"pid":"П40","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ kuna, jibiri 7 ya goono.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"В одной неделе имеются семь дней.","parse":"Azuma — неделя; fɔ́ — один; kuna — внутри; в; jibiri — день в календарной строке; 7 — семь; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Jibiri сохранено как в пособии; не исправлено автоматически на jiribi из иных текстов. Другие варианты статьи «День» не объявлены взаимозаменяемыми во всех сочетаниях."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:1","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"},{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=100"},{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"AL64, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=5"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П70","head":"","rst":false,"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."},{"k":2,"pid":"П76","head":"","rst":false,"dendi":"N mà nn maayo hantum n tira kuna.","source":"AL65, PDF и печ. с. 43","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=43","lit":"Запиши их названия в своей тетради.","parse":"N — ты; mà — побудительный показатель; nn — они, здесь их; maayo — имена, названия; hantum — записывать; n — ты, здесь твоя; tira — тетрадь, письменная книга; kuna — внутри, в.","note":"Полное второе предложение учебного пункта. В предыдущем предложении названы известные учащемуся коммуны: nn отсылает к ним. В последней строке tirakuna напечатано слитно; пробел нормализован без изменения букв."},{"k":3,"pid":"П78","head":"","rst":false,"dendi":"Handu wɔ̀ kuna, à nɛɛra 340.","source":"AL65, PDF и печ. с. 51","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51","lit":"В этом месяце он [комитет] продал 340 [килограммов хлопка].","parse":"Handu — месяц; wɔ̀ — этот; kuna — в, внутри; à — он, отсылка к комитету; nɛɛra — продавать; 340 — цифровая запись числа 340.","note":"Целое предложение из задачи о деревенском комитете Бирини-Лафиа. В предыдущем предложении названы хлопок и kg 250 за прошлый месяц. После 340 в цитате нет ни kg, ни слова «хлопок»: они добавлены только в квадратных скобках перевода."},{"k":4,"pid":"П80","head":"","rst":false,"dendi":"Nɔɔru ka à cindi kɛ̀ɛsu kuna kabu.","source":"AL65, PDF и печ. с. 59","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=59","lit":"Посчитай деньги, которые остались в кассе.","parse":"Nɔɔru — деньги; ka — относительная связь; à — оно, отсылка к оставшейся сумме; cindi — оставаться; kɛ̀ɛsu — касса, денежный ящик; kuna — внутри, в; kabu — считать, посчитай.","note":"Целая инструкция в задаче о школьной кассе. Требуется остаток после покупки. Денди использует à, хотя естественный русский перевод «деньги» требует множественного числа."},{"k":5,"pid":"П84","head":"","rst":false,"dendi":"Ali nà mɔnturu fɔ́ dei F 8500 magazɛ̃ kuna.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али купил одни часы за 8500 франков в магазине.","parse":"Ali — Али, имя персонажа; nà — показатель переходного действия; mɔnturu — часы, прибор; fɔ́ — один; dei — покупать; F — обозначение франка в источнике; 8500 — цифровая запись числа 8500; magazɛ̃ — магазин; kuna — внутри, в.","note":"Полное первое предложение задачи о прибыли. mɔnturu соотносится по значению с agogo в CAL, сохраняя свою запись. Русское «одни часы» не означает множественное число слова денди. F — условное обозначение валюты, не реконструированное слово."}],"stray":[],"kind":"swadesh","swadesh":202,"meaning":"kuna — внутри/в; послелог."},{"n":14,"title":"Вера","letter":"В","variants":[{"label":"","form":"naane","notes":["Существительное; омограф глагола «верить».","П34: именная группа с fɔlɔnku; П35: притяжательная группа wom naane. Контексты подтверждают существительное, не глагол."],"full":3,"status":"","examples":[{"k":1,"pid":"П5","head":"NT18, ROM 14:22","rst":true,"dendi":"N gunda naane ba?","source":"NT18, ROM 14:22","source_url":"https://zeno.fm/bible/DDNBIV/ROM/14/","pub":"Ты имеешь веру?","lit":"Ты имеешь веру?","parse":"N — ты; gunda — иметь; naane — вера; ba — вопросительная частица."},{"k":2,"pid":"П34","head":"NT95, Еф 4:5, PDF с. 127","rst":true,"dendi":"Kpe fɔlɔnku ya goono nda naane fɔlɔnku nda mirandiyom fɔlɔnku.","source":"NT95, Еф 4:5, PDF с. 127","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127","pub":"один Господь, одна вера, одно крещение,","lit":"Есть один Господь, одна вера и одно крещение.","parse":"Kpe — Господь; fɔlɔnku — один; единственный в данном перечислении; ya — выделительный элемент; goono — быть в наличии; nda — и; связь перечисления; naane — вера; mirandiyom — крещение; производная форма в религиозном контексте.","note":"Naane здесь существительное, как показывают параллельные именные группы. Mirandiyom не переведено как обычное мытьё. Fɔlɔnku не заменено редактором на fɔ."},{"k":3,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."}],"refs":[{"t":"NT18, Рим 14:22","u":"https://zeno.fm/bible/DDNBIV/ROM/14/"},{"t":"NT18, Евр 11:2","u":"https://zeno.fm/bible/DDNBIV/HEB/11/"},{"t":"NT18, 2 Кор 5:7","u":"https://zeno.fm/bible/DDNBIV/2CO/5/"},{"t":"NT18, Иак 2:17","u":"https://zeno.fm/bible/DDNBIV/JAS/2/"},{"t":"NT18, Иак 2:26","u":"https://zeno.fm/bible/DDNBIV/JAS/2/"},{"t":"NT95, Еф 4:5, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"},{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Часть речи определяется окружением. В конструкции gunda naane это объект обладания. Не все употребления naane следует переводить существительным."},{"n":15,"title":"Верёвка","letter":"В","variants":[{"label":"","form":"kɔrɔfɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 2:15","u":"https://zeno.fm/bible/DDNBIV/JHN/2/"},{"t":"NT18, Деян 27:32","u":"https://zeno.fm/bible/DDNBIV/ACT/27/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":61,"sci":"H, §E №34, с. 32. Практическая орфография и контекст требуют сверки."},{"n":16,"title":"Верить; считать истинным","letter":"В","variants":[{"label":"I","form":"naane","notes":["Глаголы.","Глагол с объектом à gaa: вера/доверие к лицу. П32 отрицательное, П33 утвердительное употребление. Это не имя «вера» из П5, П34, П35. Два новых примера принадлежат одной переводческой традиции."],"full":2,"status":"","examples":[{"k":1,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."},{"k":2,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."}],"refs":[{"t":"NT18, Ин 7:5","u":"https://zeno.fm/bible/DDNBIV/JHN/7/"},{"t":"NT18, Ин 10:42","u":"https://zeno.fm/bible/DDNBIV/JHN/10/"},{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"}]},{"label":"II","form":"cimandi","notes":["Глаголы."],"full":1,"status":"","examples":[{"k":1,"pid":"П6","head":"NT95, JHN 11:26, PDF с. 68","rst":true,"dendi":"N go cimandi nga di gaa dee?","source":"NT95, JHN 11:26, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"Веришь ли сему?","lit":"Ты считаешь это истинным?","parse":"N — ты; go — предглагольный показатель; cimandi — признавать истинным / верить; nga — то / оно; di — указательный элемент; gaa — послелог объекта отношения; dee — вопросительная частица.","note":"Сочетание nga di gaa передаёт объект веры; послелог не имеет здесь отдельного русского «на»."}],"refs":[{"t":"NT18, Ин 11:26","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Ин 5:47","u":"https://zeno.fm/bible/DDNBIV/JHN/5/"},{"t":"NT18, 2 Тим 3:14","u":"https://zeno.fm/bible/DDNBIV/2TI/3/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Naane и cimandi не объявляются взаимозаменяемыми во всех конструкциях. В приведённых случаях объект веры может вводиться послелогом gaa; cimandi связано с признанием истинности сообщения."},{"n":17,"title":"Ветер","letter":"В","variants":[{"label":"I","form":"hɛo","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 172","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=172"}]},{"label":"II","form":"heo","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 3:8","u":"https://zeno.fm/bible/DDNBIV/JHN/3/"}]},{"label":"III","form":"heu","notes":["Солнце и ветер в описании круговорота воды."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL64, PDF с. 10","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=10"},{"t":"ANT, PDF с. 1","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_8.pdf#page=1"},{"t":"AL65, PDF с. 103","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=103"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":163,"meaning":"heo — орфография NT18, hɛo — запись NT95.","sci":"H, §E №124, с. 38. Практическая орфография и контекст требуют сверки."},{"n":18,"title":"Вещь; нечто","letter":"В","variants":[{"label":"I","form":"hɛ","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."},{"k":2,"pid":"П45","head":"NT95, Мф 13:51, PDF с. 13","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."}],"refs":[{"t":"NT95, JHN 1:46, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"},{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"NT95, Мф 13:51, PDF с. 13","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13"}]},{"label":"II","form":"hɛi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П22","head":"","rst":false,"dendi":"Cìi hɛika n go dia.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Скажи вещи, которые ты видишь.","parse":"Cìi — сказать, здесь побуждение; hɛika — вещи, которые; слитная запись в пособии; n — ты; go — предглагольный показатель; dia — видеть.","note":"Тон Cìi сохранён. Компактная запись hɛika не раздвинута пробелами под видом оригинальной цитаты; пословный разбор поясняет её функцию."},{"k":2,"pid":"П59","head":"","rst":true,"dendi":"Wa hɛ kulu yaase guna, ka ihinnɔ dii ka jɛ.","source":"NT18, 1 Фес 5:21","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Все испытывайте, хорошего держитесь.","lit":"Всё проверьте, а хорошее возьмите и удерживайте.","parse":"Wa — побуждение к адресатам; hɛ — вещь, нечто; kulu — всё; yaase — проверить, испытать в сочетании yaase guna; guna — смотреть, в сочетании «проверить»; ka — связь действий; ihinnɔ — хорошее; dii — взять, ухватить; ka — связь действий; jɛ — держать, сохранять.","note":"Взято всё предложение, а не его часть до запятой. yaase guna рассматривается совместно как «проверить»; отдельные оттенки yaase не объявляются исчерпывающе установленными. dii здесь не di «видеть» и не dii «гореть». ihinnɔ — субстантивированное «хорошее», без подстановки иной записи hinno."},{"k":3,"pid":"П60","head":"","rst":true,"dendi":"Wa fee nda hɛ laalɔ dimi kulu.","source":"NT18, 1 Фес 5:22","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Удерживайтесь от всякого рода зла.","lit":"Отдаляйтесь от всякого вида плохого.","parse":"Wa — побуждение к адресатам; fee — отдаляться, держаться в стороне; nda — связь с тем, от чего отдаляются; hɛ — вещь, нечто; laalɔ — плохой; dimi — вид, род; kulu — всякий, весь.","note":"Контекст наставления задаёт значение fee nda «держаться в стороне от». Нельзя переводить nda одним неизменным русским предлогом. dimi здесь «вид/род», не автоматически dimi «семя»."}],"stray":[],"kind":"extra","meaning":"В П9 — hɛ fɔ «что-либо»; в П22 hɛika обозначает вещи в относительной группе. Разложение компактной учебной записи оговорено."},{"n":19,"title":"Вид; род","letter":"В","variants":[{"label":"","form":"dimi","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П60","head":"NT18, 1 Фес 5:22","rst":true,"dendi":"Wa fee nda hɛ laalɔ dimi kulu.","source":"NT18, 1 Фес 5:22","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Удерживайтесь от всякого рода зла.","lit":"Отдаляйтесь от всякого вида плохого.","parse":"Wa — побуждение к адресатам; fee — отдаляться, держаться в стороне; nda — связь с тем, от чего отдаляются; hɛ — вещь, нечто; laalɔ — плохой; dimi — вид, род; kulu — всякий, весь.","note":"Контекст наставления задаёт значение fee nda «держаться в стороне от». Нельзя переводить nda одним неизменным русским предлогом. dimi здесь «вид/род», не автоматически dimi «семя»."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Вид, род, разновидность; в П60 о плохом. Не объединяется автоматически с одноимённой формой статьи «Семя».","related":"П60."},{"n":20,"title":"Видеть","letter":"В","variants":[{"label":"I","form":"di","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П22","head":"AL65, PDF с. 29","rst":false,"dendi":"Cìi hɛika n go dia.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Скажи вещи, которые ты видишь.","parse":"Cìi — сказать, здесь побуждение; hɛika — вещи, которые; слитная запись в пособии; n — ты; go — предглагольный показатель; dia — видеть.","note":"Тон Cìi сохранён. Компактная запись hɛika не раздвинута пробелами под видом оригинальной цитаты; пословный разбор поясняет её функцию."}],"refs":[{"t":"NT95, PDF с. 112","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=112"},{"t":"NT18, Мф 28:6","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"},{"t":"NT18, Лк 2:30","u":"https://zeno.fm/bible/DDNBIV/LUK/2/"}]},{"label":"II","form":"dia","notes":["В конструкции «не видит»; отличается от diyom и иных форм по грамматике."],"full":1,"status":"","examples":[{"k":1,"pid":"П22","head":"AL65, PDF с. 29","rst":false,"dendi":"Cìi hɛika n go dia.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Скажи вещи, которые ты видишь.","parse":"Cìi — сказать, здесь побуждение; hɛika — вещи, которые; слитная запись в пособии; n — ты; go — предглагольный показатель; dia — видеть.","note":"Тон Cìi сохранён. Компактная запись hɛika не раздвинута пробелами под видом оригинальной цитаты; пословный разбор поясняет её функцию."}],"refs":[{"t":"AL65, PDF с. 21","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=21"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"},{"t":"AL65, PDF с. 104","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104"},{"t":"AL64, PDF с. 6","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=6"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":101,"sci":"H, §E №166, с. 41. Практическая орфография и контекст требуют сверки."},{"n":21,"title":"Високосный","letter":"В","variants":[{"label":"","form":"nuusamtɛ","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П82","head":"AL65, PDF и печ. с. 70","rst":false,"dendi":"Jiiri nuusamtɛ cin kàà nɔ̀ jiiri 4 kulu nga à gonda jibiri 366.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Високосный год приходит каждые четыре года, и в нём 366 дней.","parse":"Jiiri — год; nuusamtɛ — високосный; cin — показатель обычного повторяющегося действия в этом контексте; kàà — приходить; nɔ̀ — предикативно-выделительный элемент; jiiri — год; 4 — цифровая запись числа 4; kulu — каждый, весь; nga — связь частей, здесь «и»; à — он, год; gonda — иметь; jibiri — день; 366 — цифровая запись числа 366.","note":"Полное утверждение из календарного урока. Это упрощённая формулировка учебника: исключения календарного правила цитата не описывает. На с. 76 в упражнении встречается перестановка подписей; она не используется для переопределения nuusamtɛ и kubantɛ. nga здесь связывает части, а à занимает позицию субъекта."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"В сочетании jiiri nuusamtɛ — високосный год. Значение подтверждено календарным определением AL65 с. 70.","related":"П82."},{"n":22,"title":"Владеть языком; говорить на языке","letter":"В","variants":[{"label":"","form":"ŋmaani","notes":["Глагольное употребление в вопросе о греческом."],"full":1,"status":"","examples":[{"k":1,"pid":"П10","head":"NT18, ACT 21:37","rst":true,"dendi":"N ŋmaani Garɛku cine ba?","source":"NT18, ACT 21:37","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"ты знаешь по‐гречески?","lit":"Ты владеешь греческим языком?","parse":"N — ты; ŋmaani — владеть языком / говорить на языке в этом употреблении; Garɛku — греческий; cine — язык; ba — вопросительная частица.","note":"Омографическое ŋmaani «иной» в других местах не смешано с этим употреблением. В NT95, PDF с. 92, в том же вопросе напечатано cinɛ. Это два издания одного контекста."}],"refs":[{"t":"NT18, Деян 21:37","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT95, Деян. 21:37, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Подтверждён один контекст, Деян. 21:37. Параллель NT95 не создаёт второго независимого примера. В других местах графическое ŋmaani обозначает «другой / иной»; эти места не свидетельствуют о значении владения языком. Отношение омографии, тонов и этимологии здесь не установлено."},{"n":23,"title":"Внутренности","letter":"В","variants":[{"label":"I","form":"gunde kuna jiine yom","notes":["Описательное сочетание «вещи внутри живота», а не отдельная лексема."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]},{"label":"II","form":"gunde kuna jiine","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 1:18","u":"https://zeno.fm/bible/DDNBIV/ACT/1/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":86,"meaning":"Описательное сочетание «вещи внутри живота», не отдельная лексема."},{"n":24,"title":"Вода","letter":"В","variants":[{"label":"I","form":"hari","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П36","head":"AL65, PDF с. 17","rst":false,"dendi":"Iri ma sí hari ziibandi.","source":"AL65, PDF с. 17","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17","lit":"Пусть мы не загрязняем воду.","parse":"Iri — мы; ma — побудительный показатель; sí — отрицание; тон источника сохранён; hari — вода; ziibandi — загрязнять.","note":"Учебная фраза о сохранении чистоты воды. Ziibandi — глагол изменения состояния, а не прилагательное «грязный»."},{"k":2,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:11","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL64, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=22"},{"t":"AL65, PDF с. 95","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=95"},{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"AL64, PDF с. 23","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=23"},{"t":"AL65, PDF с. 17","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]},{"label":"II","form":"harri kware","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"SM19, § 2, печ. с. 1","u":"https://journals.openedition.org/ethnoecologie/4356"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П70","head":"","rst":false,"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."}],"stray":[],"kind":"swadesh","swadesh":150,"meaning":"Отдельно приведено выражение из этнографической статьи SM19 в авторском написании; оно не считается установленной самостоятельной словарной формой.","sci":"H, §E №127, с. 38. Практическая орфография и контекст требуют сверки."},{"n":25,"title":"Волосы","letter":"В","variants":[{"label":"I","form":"bɔm hamini","notes":["Сочетание «волосы головы», а не единый корень."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 112","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=112"}]},{"label":"II","form":"hamini","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 3:4","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Мф 10:30","u":"https://zeno.fm/bible/DDNBIV/MAT/10/"},{"t":"NT18, Лк 21:18","u":"https://zeno.fm/bible/DDNBIV/LUK/21/"},{"t":"NT18, Ин 11:2","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"}]},{"label":"III","form":"bɔm-hamini","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 10:30","u":"https://zeno.fm/bible/DDNBIV/MAT/10/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":71,"meaning":"hamini — волос/шерсть; bɔm-hamini — волосы головы.","sci":"H, §E №95, с. 36. Практическая орфография и контекст требуют сверки."},{"n":26,"title":"Воскресенье","letter":"В","variants":[{"label":"","form":"alaadi","notes":["Название дня в полном недельном перечне AL65. Тон в этой записи не обозначен."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":27,"title":"Вошь","letter":"В","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":48,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию.","sci":"AZ, №22. Практическая орфография и контекст требуют сверки."},{"n":28,"title":"Время","letter":"В","variants":[{"label":"","form":"saa","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П56","head":"NT18, 1 Фес 5:16","rst":true,"dendi":"Wo farihã saa kulu.","source":"NT18, 1 Фес 5:16","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Всегда радуйтесь.","lit":"Радуйтесь во всякое время.","parse":"Wo — побуждение к адресатам, написание этого стиха; farihã — радоваться; saa — время; kulu — всё, всякое.","note":"Самостоятельное наставление среди заключительных призывов послания. saa kulu — «во всякое время, всегда». Wo сохранено по источнику, не исправлено в Wa и не смешивается с указательным wo из П43."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Время; в saa kulu «во всякое время», в saa ka «когда». Последнее сочетание уже представлено в П31; отдельное значение «когда» не приписывается saa без ka.","related":"П31, П56."},{"n":29,"title":"Все","letter":"В","variants":[{"label":"","form":"kulu","notes":[],"full":3,"status":"","examples":[{"k":1,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":2,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."},{"k":3,"pid":"П45","head":"NT95, Мф 13:51, PDF с. 13","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:5","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"},{"t":"AL65, PDF с. 103","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=103"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"},{"t":"AL65, PDF с. 105","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=105"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П56","head":"","rst":true,"dendi":"Wo farihã saa kulu.","source":"NT18, 1 Фес 5:16","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Всегда радуйтесь.","lit":"Радуйтесь во всякое время.","parse":"Wo — побуждение к адресатам, написание этого стиха; farihã — радоваться; saa — время; kulu — всё, всякое.","note":"Самостоятельное наставление среди заключительных призывов послания. saa kulu — «во всякое время, всегда». Wo сохранено по источнику, не исправлено в Wa и не смешивается с указательным wo из П43."},{"k":2,"pid":"П59","head":"","rst":true,"dendi":"Wa hɛ kulu yaase guna, ka ihinnɔ dii ka jɛ.","source":"NT18, 1 Фес 5:21","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Все испытывайте, хорошего держитесь.","lit":"Всё проверьте, а хорошее возьмите и удерживайте.","parse":"Wa — побуждение к адресатам; hɛ — вещь, нечто; kulu — всё; yaase — проверить, испытать в сочетании yaase guna; guna — смотреть, в сочетании «проверить»; ka — связь действий; ihinnɔ — хорошее; dii — взять, ухватить; ka — связь дей
