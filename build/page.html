"k":3,"text":"yom jinde gaa","gloss":"… Бога, желая возложить на выи учеников иго, которого не могли понести ни отцы …","gloss_type":"rst","source":"NT18, Деян 15:10; русский текст: RST, тот же стих"},{"k":4,"text":"akpɛ jinde gaa","gloss":"… ему жерновный камень на шею и бросили его в море.","gloss_type":"rst","source":"NT18, Мк 9:42; русский текст: RST, тот же стих"},{"k":5,"text":"à jinde gaa","gloss":"… жернов повесили ему на шею и бросили его в море, нежели чтобы он …","gloss_type":"rst","source":"NT18, Лк 17:2; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":87,"count":5,"few":false,"meaning":"jinde имеет также значения «голос/звук»; здесь отобраны только употребления о шее.","index_extra":"H, §E №105, с. 37. Исходная запись требует орфографической сверки."},{"n":202,"title":"Широкий","letter":"Ш","forms":[{"form":"hɛantɛ","sources":"NT18, Мф 7:13","note":""}],"notes":[],"examples":[{"k":1,"text":"Me hɛantɛ nda","gloss":"… тесными вратами, потому что широки врата и пространен путь, ведущие в погибель, и …","gloss_type":"rst","source":"NT18, Мф 7:13; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":29,"count":1,"few":true,"meaning":"hɛantɛ — «широкий», о входе; причастная форма."},{"n":203,"title":"Шить","letter":"Ш","forms":[],"notes":[],"examples":[],"suppl":false,"swadesh":138,"count":0,"few":false,"unestablished":"Практическое написание не установлено. Проверенного письменного эквивалента и примеров пока нет. Это не означает, что в языке отсутствует такое слово.","index_sci":"T68/72, печ. с. 57 (PDF с. 32): «il a cousu», «action de coudre». AL65, PDF с. 92: dɔu-dɔuyom mansin — контекст приобретения машины; самостоятельный глагол этим не установлен."},{"n":204,"title":"Этот","letter":"Э","forms":[{"form":"wɔ","sources":"NT95, PDF с. 62; NT18, Мф 3:3; AL64, PDF с. 3; COV, PDF с. 2; AL64, PDF с. 4","note":"Дейктическое значение зависит от конструкции."},{"form":"wɔne","sources":"NT18, Мф 26:26","note":""},{"form":"wɔ̀","sources":"AL65, PDF с. 7; AL65, PDF с. 101","note":"Форма с низким тоном в письменном тексте."},{"form":"wo","sources":"CAL, PDF с. 22","note":""}],"notes":[],"examples":[{"k":1,"text":"laakali cendiyom Wɔ di bara","gloss":"Контекст: предисловие и назначение руководства. Употребление формы «Wɔ» при значении «этот»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL64, PDF с. 3"},{"k":2,"text":"gweiyo wo te","gloss":"Указание на данное упражнение: «это/эти»; написание wo в скане, не замена буквы ɔ по предположению. Печатная с. 40.","gloss_type":"note","source":"CAL, PDF с. 22"},{"k":3,"text":"ka bɔnijiyo wɔ̀ yeti ka","gloss":"Контекст: расчёт расходов на товар. Употребление формы «wɔ̀» при значении «этот»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 101"},{"k":4,"text":"gà, seedayo wɔ, yɛbɛrɛkɛ (cɛɛnɛcɛɛnɛ","gloss":"Контекст: сведения об инфекции и её симптомах. Употребление формы «wɔ» при значении «этот»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"COV, PDF с. 2"},{"k":5,"text":"Tɛɛyom gbeiyo wɔ bara nɔ","gloss":"Контекст: педагогические определения. Употребление формы «wɔ» при значении «этот»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL64, PDF с. 4"},{"k":6,"text":"ŋmaa. Wɔne ya","gloss":"И когда они ели, Иисус взял хлеб и, благословив, преломил и, раздавая ученикам, сказал: приимите, ядите: сие есть Тело Мое.","gloss_type":"rst","source":"NT18, Мф 26:26; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":7,"count":6,"few":false,"meaning":"Дейктическое значение зависит от конструкции."},{"n":205,"title":"Я","letter":"Я","forms":[{"form":"a","sources":"NT18, Мф 5:17","note":""}],"notes":[],"examples":[{"k":1,"text":"tamma a kaa","gloss":"Не думайте, что Я пришел нарушить закон или пророков: не нарушить пришел …","gloss_type":"rst","source":"NT18, Мф 5:17; русский текст: RST, тот же стих"},{"k":2,"text":"nda a Baaba","gloss":"Я и Отец — одно.","gloss_type":"rst","source":"NT18, Ин 10:30; русский текст: RST, тот же стих"},{"k":3,"text":"A na","gloss":"Тихика я послал в Ефес.","gloss_type":"rst","source":"NT18, 2 Тим 4:12; русский текст: RST, тот же стих"},{"k":4,"text":"bɛɛrandi a sabu","gloss":"и прославляли за меня Бога.","gloss_type":"rst","source":"NT18, Гал 1:24; русский текст: RST, тот же стих"},{"k":5,"text":"A na","gloss":"Это я написал вам об обольщающих вас.","gloss_type":"rst","source":"NT18, 1 Ин 2:26; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":1,"count":5,"few":false,"index_extra":"AT, №1. Исходная запись требует орфографической сверки."},{"n":206,"title":"Язык (орган)","letter":"Я","forms":[{"form":"dɛɛnɛ","sources":"NT18, Мк 7:33","note":""}],"notes":[],"examples":[{"k":1,"text":"à dɛɛnɛ haama","gloss":"… ему и, плюнув, коснулся языка его;","gloss_type":"rst","source":"NT18, Мк 7:33; русский текст: RST, тот же стих"},{"k":2,"text":"Ǹ dɛɛnɛ yom","gloss":"… их — открытый гроб; языком своим обманывают; яд аспидов на губах их».","gloss_type":"rst","source":"NT18, Рим 3:13; русский текст: RST, тот же стих"},{"k":3,"text":"Dɛɛnɛ yom","gloss":"И явились им разделяющиеся языки, как бы огненные, и почили по одному на …","gloss_type":"rst","source":"NT18, Деян 2:3; русский текст: RST, тот же стих"},{"k":4,"text":"Amma dɛɛnɛ wɔ","gloss":"а язык укротить никто из людей не может: это — …","gloss_type":"rst","source":"NT18, Иак 3:8; русский текст: RST, тот же стих"},{"k":5,"text":"nda dɛɛnɛ yom","gloss":"… народах, и племенах, и языках, и царях многих.","gloss_type":"rst","source":"NT18, Откр 10:11; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":78,"count":5,"few":false,"index_extra":"H, §E №101, с. 37. Исходная запись требует орфографической сверки."},{"n":207,"title":"Яйцо","letter":"Я","forms":[{"form":"gunguri","sources":"NT18, Лк 11:12; AL65, PDF с. 104; AL65, PDF с. 51; AL65, PDF с. 50","note":""}],"notes":[],"examples":[{"k":1,"text":"nɛɛrakwɛ. À gunguri cila fɔ́","gloss":"Контекст: продажа яиц и выручка. Употребление формы «gunguri» при значении «яйцо»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 104"},{"k":2,"text":"maraguntɛ. Kabu gunguri hɛika Ahmadu","gloss":"Контекст: арифметические задачи о яйцах и торговле. Употребление формы «gunguri» при значении «яйцо»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 51"},{"k":3,"text":"ka gɔrɔngɔ gunguri káá. Fiti","gloss":"Контекст: сбор и продажа яиц. Употребление формы «gunguri» при значении «яйцо»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 50"},{"k":4,"text":"ŋmaarɛ gunguri à","gloss":"Или, если попросит яйца, подаст ему скорпиона?","gloss_type":"rst","source":"NT18, Лк 11:12; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":67,"count":4,"few":true,"index_extra":"H, §E №85, с. 36. Исходная запись требует орфографической сверки."},{"n":208,"title":"Выделение: ya","letter":"В","forms":[{"form":"ya","sources":"","note":"Выделительный/фокусный элемент в некоторых конструкциях."}],"notes":[],"examples":[{"k":1,"text":"","gloss":"Выделение «ты» в вопросе о римском гражданстве.","gloss_type":"note","source":"NT18, Деян 22:27"},{"k":2,"text":"","gloss":"Выделение говорящего в утверждении о голосе в пустыне.","gloss_type":"note","source":"NT18, Ин 1:23"},{"k":3,"text":"","gloss":"Выделение адресата в утверждении о Сыне Божием.","gloss_type":"note","source":"NT18, Ин 1:49"},{"k":4,"text":"","gloss":"Вопрос о том, что означает происходящее; частный вопрос, не «да/нет».","gloss_type":"note","source":"NT18, Деян 2:12"},{"k":5,"text":"","gloss":"Вопрос о том, что есть истина; также не вопрос «да/нет».","gloss_type":"note","source":"NT18, Ин 18:38"}],"suppl":true,"count":5,"label":"Дополнение; вне списка Сводеша · Контекстов: 5","meaning":"Не вопросительная частица. В Деян. 22:27 выделяет адресата в конструкции с no; употребляется также в утвердительных фразах. Не все графические ya имеют эту функцию: возможны сокращённые местоименно-глагольные сочетания. Формы нужно разбирать по контексту."},{"n":209,"title":"Да: слово ответа","letter":"Д","forms":[{"form":"Oò","sources":"","note":"Слово утвердительного ответа; также подтверждение/усиление вне отдельного ответа."}],"notes":[],"examples":[{"k":1,"text":"","gloss":"Ученики подтверждают, что поняли сказанное.","gloss_type":"note","source":"NT18, Мф 13:51"},{"k":2,"text":"","gloss":"Павел подтверждает римское гражданство.","gloss_type":"note","source":"NT18, Деян 22:27"},{"k":3,"text":"","gloss":"Подтверждение названной суммы продажи земли.","gloss_type":"note","source":"NT18, Деян 5:8"},{"k":4,"text":"","gloss":"Марфа отвечает утвердительно и затем развёртывает своё исповедание.","gloss_type":"note","source":"NT18, Ин 11:27"},{"k":5,"text":"","gloss":"Подтверждение того, что написанное относится к людям; не отдельный бытовой ответ.","gloss_type":"note","source":"NT18, 1 Кор 9:10"}],"suppl":true,"count":5,"label":"Дополнение; вне списка Сводеша · Контекстов: 5","meaning":"Тон сохранён по тексту. Не обозначать эту форму как универсальную вопросительную частицу. Ответ на отрицательный вопрос лучше уточнять полным утверждением: соответствие русских «да», «нет», «нет, отвечаю» нельзя установить механически."},{"n":210,"title":"Или: союз альтернативного вопроса","letter":"И","forms":[{"form":"wala","sources":"","note":"Разделительный союз. Сам по себе не является показателем вопроса."}],"notes":[],"examples":[{"k":1,"text":"","gloss":"Платить налог или не платить? См. Д5; встречаются две конструкции выбора внутри стиха.","gloss_type":"note","source":"NT18, Мк 12:14"},{"k":2,"text":"","gloss":"Пророк говорит о себе или о другом человеке?","gloss_type":"note","source":"NT18, Деян 8:34"},{"k":3,"text":"","gloss":"Праведность была вменена после обрезания или до него?","gloss_type":"note","source":"NT18, Рим 4:10"},{"k":4,"text":"","gloss":"От вас вышло слово Божие или только до вас дошло?","gloss_type":"note","source":"NT18, 1 Кор 14:36"},{"k":5,"text":"","gloss":"Притча обращена к ученикам или ко всем?","gloss_type":"note","source":"NT18, Лк 12:41"}],"suppl":true,"count":5,"label":"Дополнение; вне списка Сводеша · Контекстов: 5","meaning":"Может соединять два варианта, в том числе положительное действие и его отрицание. В примере Д5 вопросительная частица стоит до союза. Нельзя вводить правило обязательного повторения одной и той же частицы после каждого варианта."},{"n":211,"title":"Нет: слово ответа","letter":"Н","forms":[{"form":"Awo","sources":"","note":"Отрицательное слово ответа; в полемическом контексте — категорическое отклонение."}],"notes":[],"examples":[{"k":1,"text":"","gloss":"Иоанн отвергает предположение о том, что он ожидаемый пророк.","gloss_type":"note","source":"NT18, Ин 1:21"},{"k":2,"text":"","gloss":"Отрицание того, что идол сам по себе имеет значение.","gloss_type":"note","source":"NT18, 1 Кор 10:19"},{"k":3,"text":"","gloss":"Отказ от возможности сделать члены Христа членами блудницы.","gloss_type":"note","source":"NT18, 1 Кор 6:15"},{"k":4,"text":"","gloss":"Отказ Павла от тайного освобождения; дальше следует объяснение.","gloss_type":"note","source":"NT18, Деян 16:37"},{"k":5,"text":"","gloss":"Отрицание противоречия между законом и Божиими обещаниями.","gloss_type":"note","source":"NT18, Гал 3:21"}],"suppl":true,"count":5,"label":"Дополнение; вне списка Сводеша · Контекстов: 5","meaning":"Встречается как самостоятельный ответ и перед пояснением. Не заменяет отрицательные показатели внутри сказуемого. В одном ответе после Awo может следовать отрицательная фраза."},{"n":212,"title":"Связка и выделение: no / nɔ","letter":"С","forms":[{"form":"no; nɔ","sources":"","note":"Предикативные и выделительные употребления; точная единая классификация по этому корпусу не установлена."}],"notes":[],"examples":[{"k":1,"text":"","gloss":"Именной вопрос об этнической принадлежности: Б4.","gloss_type":"note","source":"NT18, 2 Кор 11:22"},{"k":2,"text":"","gloss":"Вопрос об отождествлении с Илиёй; частицы ba/dee нет.","gloss_type":"note","source":"NT18, Ин 1:21"},{"k":3,"text":"","gloss":"Выделяется время: теперь ли ученики веруют? Вопрос заканчивается глаголом.","gloss_type":"note","source":"NT18, Ин 16:31"},{"k":4,"text":"","gloss":"Вопрос о римском гражданстве; рядом стоит выделительное ya.","gloss_type":"note","source":"NT18, Деян 22:27"},{"k":5,"text":"","gloss":"Вопрос преподавателя о том, что учащийся изучил; в пособии напечатано nɔ.","gloss_type":"note","source":"AL64, PDF с. 20"}],"suppl":true,"count":5,"label":"Дополнение; вне списка Сводеша · Контекстов: 5","meaning":"Не переводить автоматически как «ли». No встречается в утверждениях и вопросах, после именной части и при выделении обстоятельства. Nɔ в пособии сохранено отдельно; различие no/nɔ не объявляется свободным орфографическим варьированием."},{"n":213,"title":"Частица вопроса: ba","letter":"Ч","forms":[{"form":"ba","sources":"","note":"Вопросительная частица после предикации."}],"notes":[],"examples":[{"k":1,"text":"","gloss":"См. Б1: У тебя есть супруг / супруга? Вопрос о наличии брачного партнёра; состояние выражено без go.","gloss_type":"note","source":"NT18, 1 Кор 7:27"},{"k":2,"text":"","gloss":"См. Б2: У тебя нет супруга / супруги? Отрицательный вопрос рядом с Б1. Отрицание входит в sinda; частица остаётся той же.","gloss_type":"note","source":"NT18, 1 Кор 7:27"},{"k":3,"text":"","gloss":"См. Б3: Ты не отвечаешь? Вопрос Пилата к молчащему Иисусу. Русское «разве» возможно по контексту, но не является постоянным переводом ba.","gloss_type":"note","source":"NT18, Мк 15:4"},{"k":4,"text":"","gloss":"См. Б4: Они евреи? Именной вопрос: нет глагола действия и нет go.","gloss_type":"note","source":"NT18, 2 Кор 11:22"},{"k":5,"text":"","gloss":"См. Б5: У тебя есть вера? Вопрос о наличии веры; сочетание с тем же глаголом состояния, что в Б1.","gloss_type":"note","source":"NT18, Рим 14:22"}],"suppl":true,"count":5,"label":"Дополнение; вне списка Сводеша · Контекстов: 5","meaning":"Вопросы с ba охватывают обладание, отсутствие, действие и именное сказуемое. Не смешивать с одноимёнными словами и элементами сложных форм. Отличие по тону и прагматике от dee не установлено. Вариант ba не заменён механически на dee."},{"n":214,"title":"Частица вопроса: dee","letter":"Ч","forms":[{"form":"dee","sources":"","note":"Вопросительная частица после основной предикации; может предшествовать продолжению."}],"notes":[],"examples":[{"k":1,"text":"","gloss":"См. Д1: Ты веришь этому? Полный вопрос. Сочетание nga di gaa передаётся целиком как «этому»; буквальные значения отдельных элементов не равны русскому порядку слов.","gloss_type":"note","source":"NT95, Ин 11:26, PDF с. 68"},{"k":2,"text":"","gloss":"См. Д2: … Христос / Мессия? Короткий фрагмент. Полный вопрос отрицательный по форме: не является ли этот человек Мессией? Возможное ожидание положительного ответа выводится из контекста, не из одной частицы.","gloss_type":"note","source":"NT95, Ин 4:29, PDF с. 62"},{"k":3,"text":"","gloss":"См. Д3: … тот сын? Короткий фрагмент вопроса толпы о том, не является ли Иисус сыном Давида. Сам фрагмент не переводится как полное предложение.","gloss_type":"note","source":"NT95, Мф 12:23, PDF с. 12"},{"k":4,"text":"","gloss":"См. Д4: … происходить из Назарета? Короткий фрагмент вопроса о возможности происхождения чего-либо хорошего из Назарета.","gloss_type":"note","source":"NT95, Ин 1:46, PDF с. 60"},{"k":5,"text":"","gloss":"См. Д5: … платить, или… Короткий фрагмент альтернативного вопроса: платить налог или не платить? Dee находится перед wala и не завершает всё предложение.","gloss_type":"note","source":"NT95, Мк 12:14, PDF с. 33"}],"suppl":true,"count":5,"label":"Дополнение; вне списка Сводеша · Контекстов: 5","meaning":"В разных контекстах участвует в вопросах о вере, отождествлении, возможности и выборе. Нельзя переводить во всех случаях как «разве» или «неужели». Не устанавливается свободная замена на ba. Пять свидетельств ниже происходят из одного переводческого проекта и не равны пяти независимым источникам."}],"sources_intro":"Код источника рядом со словом или примером ведёт к первоисточнику. «PDF с.» — номер страницы файла с обложкой; печатная страница, если установлена, указана отдельно. NT18 имеет ссылки на главу и точный номер стиха в подписи. Дата © 2018 сама по себе не доказывает, насколько перевод переработан относительно 1995 года.","sources":[{"code":"AL65","desc":"Dendi cinɛ couyo nda à hantum dendenikɔ tila. Bugu 1, Waati 1. Manuel de l’apprenant en AEA, Niveau 1 du cycle 1, Bénin. Полный PDF, 114 с. Учебник грамотности для носителей языка: буквы, чтение, письмо, счёт, здоровье, быт и гражданская тематика. Это не русско-дендийский разговорник. Год выпуска на просмотренной обложке не указан. Даты внутри упражнений не приняты за дату издания. Главный новый источник практических написаний.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf"},{"code":"AL64","desc":"Пособие для преподавателя AEA, Бенин. Полный PDF, 60 с. Педагогические определения, методика, планы занятий, вопросы к учащимся и перечни материалов. Для новых примеров проверены читаемые места преимущественно с. 3–25, а также заголовок темы на с. 41. Повреждённые глифы поздних страниц не исправлены по догадке; сомнительные фрагменты исключены. Учебник и пособие принадлежат одной образовательной программе: это разные тексты, но их не следует считать полностью независимыми традициями письма.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf"},{"code":"COV","desc":"ACALAN–UA. COVID-19, Songhay-dendi. Перевод Roukéiyath Alaza Sani и Mama Yola Kpara. Полный PDF, 4 с. Практический санитарный текст с тоновыми знаками. Подтверждает варианты руки, носа, рта, глаза, мытья и названий дыхания. Сохранены расхождения внутри самого буклета: hinazebu / hinanzebu. Дата выпуска не устанавливается по одному упоминанию 2019 года в описании эпидемии.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf"},{"code":"ANT","desc":"Benin: дендийский перевод национального гимна. Traduction de Azaratou Sanny Alaza et Roukéiyath Alaza Sani Bassabitchire. Полный PDF, 1 с. Поэтический текст с элизиями. В этой версии по изображению проверены четыре коротких фрагмента о песне, ветре, горах и повседневности; остальные повреждённые места автоматического извлечения не использованы. Поэтические формы не объявляются универсальной нормой.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_8.pdf"},{"code":"CAL","desc":"Kilee Dendeniyo Tila / Livret de Calcul en Dendi. DNAEA, C3A / Coop-Suisse. Июнь 2001, дата на обложке. Полный скан, 38 страниц PDF, с разворотами. Пособие по арифметике: операции, деньги, измерения, строительные задачи. Подтверждает gu «пять», hinka «два» по цифровым подписям и tuurinya в подсчёте древесины. Книжная орфография не уравнена автоматически с NT18. В этой версии дополнительно сверены примеры о рыбе, автомобиле, времени и строительной древесине на PDF с. 22 (печ. с. 40–41). Записи fo, boro, wo сохранены по изображению; o не заменено на ɔ механически.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf"},{"code":"CFA","desc":"Бенинский дендийский текст о девальвации франка CFA. На обложке: Cotonou, 23 janvier 1994; 10 страниц PDF с разворотами. Публицистический экономический материал, а не грамматика. Подтверждает тоновую запись kàmmɛ̀, bɔrɔ̀ и союз nna. Сложная финансовая лексика за пределами 207 значений не включена. Дополнительно использованы проверенные места PDF с. 5 (печ. с. 2–3): календарный срок, наименование Всемирного банка и публицистические связующие слова.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf"},{"code":"T68/72","desc":"Nicole Tersis. Le dendi (Niger): phonologie, lexique dendi-français, emprunts (arabe, hausa, français, anglais). Bulletin de la SELAF 10. Полный скан, 48 страниц PDF. Наружная обложка имеет 1972; внутренняя титульная страница — Décembre 1968, и раздел фонологии подписан Paris, décembre 1968. Поэтому это не следует безоговорочно считать другой работой, отличной от Tersis 1968. Научное описание и словарь нигерского денди; полезны для значения и частей речи, но запись не равна практической орфографии учебника Бенина. В словаре формы могут включать артикль, множественное число и тон; варианты не сведены механически к одной основе.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_15.pdf"},{"code":"N78","desc":"Robert Nicolaï. Les parlers dendi. African Languages 4, 1978, печ. с. 47–79. Полный скан, 17 страниц PDF; первая половина первого разворота относится к предыдущей статье. Описание прежде всего Канди, с сопоставлением Джугу и Параку, а также ссылкой на Гая–Маланвиль. Различает регистр полной формы и разговорные сокращения; это одна из причин, почему разные записи не обязательно противоречат друг другу. Примеры в научной транскрипции не выданы за нормативные слова современного учебника.","url":"https://alpha.educmaster.bj/assets/images/documents/alpha_16.pdf"},{"code":"SM19","desc":"Lucie Smolderen. Des graines, des fibres et des bobines. Mémoire d’une filière textile artisanale dans le Dendi (Nord Bénin). Revue d’ethnoécologie 15, 2019, DOI 10.4000/ethnoecologie.4356. Этнографическая статья о хлопковой цепочке. Проверены доступные фрагменты первичной публикации, в частности § 2 и § 28; полный PDF при повторном обращении закрыт автоматической проверкой сайта. Поэтому полный текст статьи не объявлен исчерпывающе проанализированным. Записи harri kware, harri bi и habou sando рассматриваются ниже в авторской латинской записи.","url":"https://journals.openedition.org/ethnoecologie/4356"},{"code":"N89","desc":"Robert Nicolaï. Revernacularisation et déterminismes évolutifs: Songhay septentrional et dendi. Current Approaches to African Linguistics VI, 1989, с. 100–114. DOI 10.1515/9783110884890-008. Тематика — история изменения языка и контакт. Подтверждена авторская запись HAL hal-05506021; она не содержит доступного файла полного текста. Издательская страница не открылась. Новые лексические формы на основании одной библиографии не приписаны статье.","url":"https://hal.science/hal-05506021v1"},{"code":"G88","desc":"Euphrasie Moudachirou & Michelle Dossou. Le guide pratique de transcription de la langue dendi. Cotonou, 1988. Подтверждена каталоговая запись WorldCat; полный текст не получен. По назначению это важный источник правил письма, но конкретные правила и слова без страниц ему не приписаны.","url":"https://search.worldcat.org/fr/title/guide-pratique-de-transcription-de-la-langue-dendi/oclc/32453905"},{"code":"GYK","desc":"Mama Yola Kpara. Guide de transcription et de lecture du dendi cine. 53 с., ISBN 978-99919-0-031-5. Подтверждена карточка Национальной библиотеки Бенина; PDF книги не получен. Каталожная карточка не подтверждает год: упоминавшийся ранее 2014 не принят как установленная дата. Ссылка на GUIDE D’APPRENTISSAGE DENDI в ALPHA возвращает двухстраничную служебную выгрузку сайта, а не текст руководства.","url":"https://bibliographie.bnb.bj/resources/book_details/3825/"},{"code":"NT18","desc":"Dendi New Testament, отметка © 2018 Bibles International; DDNBIV на Zeno. Использован ранее собранный текст 27 книг, 260 глав; новые учебные формы сопоставлены с ним. Дата © не доказывает сама по себе степень переработки перевода 1995 года.","url":"https://zeno.fm/bible/DDNBIV/"},{"code":"NT95","desc":"The New Testament in Dendi, © 1995 Bibles International. Digital Bible Society; 179 с. PDF. Сохранены прежние проверенные записи с цифровыми страницами; отличие от NT18 не замаскировано исправлениями.","url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf"},{"code":"H","desc":"Harrison, Harrison & Rueck. Southern Songhay Speech Varieties in Niger. SIL Electronic Survey Reports 1999-004; полевые работы 1997. Используется дендийская строка TAN (Танда), а не соседние разновидности сонгай. Полевая фонетическая запись сохранена как указатель для сверки.","url":"https://media.corban.edu/hydra/media/files/2019/09/10/southern-songhay-silesr1999_004-1.pdf"},{"code":"AT / AZ","desc":"ASJP: Dendi (Tersis 1968) и Dendi 2 (Zima 1994, Джугу). Это сокращённые кодированные выборки, не практическая орфография. Полный словарь Zima 1994 по-прежнему не получен; данные ASJP не объявлены чтением всей книги.","url":"https://asjp.clld.org/languages/DENDI_2"},{"code":"RST — русский параллельный текст","desc":"Синодальный перевод Нового Завета из открытого набора bibleonline/rst, формат parsed66. Набор заявлен как Public Domain; он используется лишь для ориентира по содержанию стиха. Русский фрагмент не является авторским буквальным переводом дендийского текста.","url":"https://github.com/bibleonline/rst"}],"few":["бороться (1); верёвка (2); внутренности (2); вошь (0); гладкий (0); жёлтый (0); жир (0); замерзать (0); зола (4); играть (1); колено (3); колоть; протыкать (4); копать (1); кора дерева (0); короткий (1); круглый (0); кусать (0); лёд (0); летать (4); мало (2); мокрый (0); ноготь (0); нюхать; чувствовать запах (1); опухать (1); охотиться (0); перо (0); песок (3); печень (0); плавать (1); плыть (держаться на поверхности) (0); прямой (4); пыль (1); расщеплять (3); рвать (испытывать рвоту) (2); сжимать (1); снег (1); сосать (3); спина (2); тёплый; горячий (3); тереть (1); толкать (1); толстый (0); тонкий (0); туман (0); тупой (0); узкий (3); хвост (4); холодный (4); царапать (0); цветок (3); червь (3); широкий (1); шить (0); яйцо (4)","Числа обозначают количество представленных примеров, а не количество употреблений слова во всём языке. Там, где сохранилось только написание или научный указатель, примеры не восстановлены по предположению."],"grammar":{"subtitle":"Грамматическое дополнение к словарю","date":"12 октября 2026 года · 207 статей Сводеша + 7 дополнительных словарных статей","intro":["Это дополнение входит в тот же словарь. Основная часть сохранена в редакции от 9 октября; её 874 примера и прежняя таблица источников относятся к 207 статьям Сводеша. Новые материалы здесь учитываются отдельно. Статьи дополнения идут по русскому алфавиту, имеют номера 208–214 и не получают номеров Сводеша.","Правила основаны на проверенных письменных употреблениях NT18, сверке NT95 и вопросах пособия AL64. Грамматическое объяснение и русские переводы подготовлены для этого дополнения. Оно не заменяет нормативную грамматику и не устанавливает интонационные нормы по письменному тексту.","Примеры Б1–Б5 — полные короткие вопросы NT18. Д1 — полный вопрос NT95; Д2–Д5 — короткие фрагменты с русским объяснением полного контекста. В статьях служебных элементов даны также ссылочные контексты без повторного воспроизведения длинных цитат. Повтор того же места не считается новым независимым источником."],"correction":"Неверно сводить вопросы на «да/нет» к обязательному dee. Засвидетельствованы ba, dee и вопросы без обеих частиц. Нельзя по этим примерам установить, что ba всегда нейтрально, а dee обязательно выражает сомнение или ожидание «да». Такие оттенки в отдельных стихах могут зависеть от контекста.","rules":[{"n":1,"title":"Сначала строится основное высказывание","text":"Обязательной инверсии подлежащего и сказуемого в приведённых вопросах нет. Ba следует за уже построенной предикацией: глагольной (Б1–Б3, Б5) или именной (Б4). Для вопроса об обладании употреблён gunda, для отсутствия — sinda."},{"n":2,"title":"Ba после предикации","text":"В Б1–Б5 ba стоит последним. Рабочая схема: [подлежащее + сказуемое и зависимые слова] + ba? Однако это правило описывает данные примеры, а не доказывает, что после ba нигде не бывает продолжения. При именном сказуемом перед ba может стоять no."},{"n":3,"title":"Dee после основной части вопроса","text":"В Д1 dee замыкает вопрос; в Д5 после него следует союз альтернативы. В Ин. 1:50 за dee следует объяснение причины веры: частица расположена после основной части, но не в конце всей конструкции. Следовательно, «dee всегда последнее слово» — неверное обобщение. NT18, Ин 1:50"},{"n":4,"title":"Вопрос без ba и dee","text":"В Ин. 1:21 спрашивают, является ли адресат Илиёй; ни ba, ни dee нет. В Мф. 13:51 спрашивают, поняли ли ученики сказанное; также без этих частиц. Эти употребления показывают необязательность отдельной вопросительной частицы. Какой тон или контур интонации делает такую фразу вопросом, по письменному тексту не определяется. NT18, Ин 1:21; NT18, Мф 13:51"},{"n":5,"title":"Отрицательный вопрос","text":"Отрицание относится к сказуемому, а вопросительность выражается отдельно. Б2 содержит sinda «не иметь», Б3 — si перед глаголом. В Ин. 4:29 есть mana; в Мф. 12:23 — na перед ci. Эти отрицательные формы нельзя смешивать с омографическим na, показателем переходного действия, или автоматически считать все отрицательные вопросы выражением одного ожидания. NT18, Ин 4:29; NT18, Мф 12:23"},{"n":6,"title":"Go и na не образуют вопрос сами","text":"Go — предглагольный показатель, связанный с типом предикации и аспектом; здесь не устанавливается его полная система значений. Na в переходной конструкции предшествует дополнению и глаголу; в иных конструкциях одинаковая запись может иметь другую функцию. В Б1–Б5 go отсутствует. Не добавляйте go к каждому глаголу только ради вопроса."},{"n":7,"title":"No/nɔ и ya не равны «ли»","text":"No может связывать или выделять именную часть, а также следовать за выделенным обстоятельством; ya имеет выделительные употребления. Оба встречаются вне вопросов. Вопрос в Деян. 22:27 соединяет ya и no, но не содержит ba/dee. Форма nɔ в AL64 сохранена как в источнике; её нельзя механически уравнять с no. NT18, Деян 22:27"},{"n":8,"title":"Альтернатива с wala","text":"Wala связывает варианты: делать или не делать, один участник или другой. В Мк. 12:14 dee стоит перед wala. Из этого не следует, что в альтернативном вопросе частица обязательна после каждого варианта. NT18, Мк 12:14"},{"n":9,"title":"Ответы","text":"Oò — подтверждение, Awo — отрицание/отклонение. В Мф. 13:51 и Деян. 22:27 дан короткий утвердительный ответ; в Ин. 1:21 — отрицательный. На отрицательный вопрос не переносите русскую логику одного «да/нет» без проверки. Для однозначности разумно повторить утверждаемое или отрицаемое содержание; это практический совет, не засвидетельствованное обязательное правило."},{"n":10,"title":"Что ещё не установлено","text":"Не установлены: точное прагматическое различие ba/dee, их свободная взаимозаменяемость, правила интонации и ограничения по диалектам. Конечные hɛ и na из отдельных записей не внесены как дополнительные вопросительные частицы без надёжной грамматической проверки: hɛ имеет и лексические употребления. Этот раздел содержит подтверждённый минимум, а не полный инвентарь языка."}],"examples":[{"id":"Б1","dendi":"N gunda wɛndɛ ba?","ru":"У тебя есть супруг / супруга?","comment":"Вопрос о наличии брачного партнёра; состояние выражено без go.","parse":"Разбор по порядку слов: 1: ты; 2: иметь; 3: супруг / супруга; 4: вопросительная частица.","source":"NT18, 1 Кор 7:27"},{"id":"Б2","dendi":"N sinda wɛndɛ ba?","ru":"У тебя нет супруга / супруги?","comment":"Отрицательный вопрос рядом с Б1. Отрицание входит в sinda; частица остаётся той же.","parse":"Разбор по порядку слов: 1: ты; 2: не иметь; 3: супруг / супруга; 4: вопросительная частица.","source":"NT18, 1 Кор 7:27"},{"id":"Б3","dendi":"N si tu ba?","ru":"Ты не отвечаешь?","comment":"Вопрос Пилата к молчащему Иисусу. Русское «разве» возможно по контексту, но не является постоянным переводом ba.","parse":"Разбор по порядку слов: 1: ты; 2: отрицательный показатель; 3: отвечать; 4: вопросительная частица.","source":"NT18, Мк 15:4"},{"id":"Б4","dendi":"Eburu yom no ba?","ru":"Они евреи?","comment":"Именной вопрос: нет глагола действия и нет go.","parse":"Разбор по порядку слов: 1: еврей / евреи; 2: показатель множественности; 3: предикативная связка; 4: вопросительная частица.","source":"NT18, 2 Кор 11:22"},{"id":"Б5","dendi":"N gunda naane ba?","ru":"У тебя есть вера?","comment":"Вопрос о наличии веры; сочетание с тем же глаголом состояния, что в Б1.","parse":"Разбор по порядку слов: 1: ты; 2: иметь; 3: вера; 4: вопросительная частица.","source":"NT18, Рим 14:22"},{"id":"Д1","dendi":"N go cimandi nga di gaa dee?","ru":"Ты веришь этому?","comment":"Полный вопрос. Сочетание nga di gaa передаётся целиком как «этому»; буквальные значения отдельных элементов не равны русскому порядку слов.","parse":"Разбор по порядку слов: 1: ты; 2: предглагольный показатель; 3: считать истинным / верить; 4: это / то; 5: указательный элемент; 6: послелог: к этому / относительно этого; 7: вопросительная частица.","source":"NT95, Ин 11:26, PDF с. 68"},{"id":"Д2","dendi":"ci Mɛsiya dee","ru":"… Христос / Мессия?","comment":"Короткий фрагмент. Полный вопрос отрицательный по форме: не является ли этот человек Мессией? Возможное ожидание положительного ответа выводится из контекста, не из одной частицы.","parse":"Разбор фрагмента по порядку: 1: быть / являться; 2: Мессия; 3: вопросительная частица.","source":"NT95, Ин 4:29, PDF с. 62"},{"id":"Д3","dendi":"ize di dee","ru":"… тот сын?","comment":"Короткий фрагмент вопроса толпы о том, не является ли Иисус сыном Давида. Сам фрагмент не переводится как полное предложение.","parse":"Разбор фрагмента по порядку: 1: сын; 2: указательное / определительное слово; 3: вопросительная частица.","source":"NT95, Мф 12:23, PDF с. 12"},{"id":"Д4","dendi":"hunu Nazarɛtu dee","ru":"… происходить из Назарета?","comment":"Короткий фрагмент вопроса о возможности происхождения чего-либо хорошего из Назарета.","parse":"Разбор фрагмента по порядку: 1: происходить / выходить; 2: Назарет; 3: вопросительная частица.","source":"NT95, Ин 1:46, PDF с. 60"},{"id":"Д5","dendi":"bana dee wala","ru":"… платить, или…","comment":"Короткий фрагмент альтернативного вопроса: платить налог или не платить? Dee находится перед wala и не завершает всё предложение.","parse":"Разбор фрагмента по порядку: 1: платить; 2: вопросительная частица; 3: или.","source":"NT95, Мк 12:14, PDF с. 33"}],"sources":["NT18: дендийский Новый Завет с отметкой © 2018 Bibles International, ранее сохранённые тексты глав Zeno.FM. NT95: PDF с отметкой © 1995. Совпадения подтверждают наличие конструкций в двух изданиях, но не независимую переводческую традицию. Прямая доступность отдельных веб-страниц при этой проверке нестабильна; примеры проверены по сохранённым полным текстам и PDF, а не восстановлены по русскому переводу.","NT95 — полный PDF","AL64: Guide du facilitateur pour l’animation des centres d’AEA suivant l’approche Passerelle / Bénin; PDF с. 20 сверена по изображению страницы. Пример nɔ относится к частному вопросу: он использован для разграничения функций, а не как доказательство частицы «да/нет».","AL64 — PDF, с. 20","Статистика дополнения: 7 новых статей; 35 ссылочных контекстов, из них 10 коротких цитат/фрагментов в блоке Б/Д. Один стих может служить свидетельством разных элементов. Эти количества не прибавляются к прежним 874 примерам как к независимым употреблениям. Основная часть сохраняет все 207 статей, примечания и источники; навигация доступна по заголовкам.","Дендийские слова при разборе не изменены. Для экономии повторов глоссы пронумерованы по порядку слов исходной строки. Короткие фрагменты Д2–Д5 не представлены как самостоятельные полные вопросы. Составленные ранее в чате вопросы о владении денди не использованы как цитаты первоисточников."]}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const E = D.entries;
const byN = {}; E.forEach(e => byN[e.n] = e);
const MAIN = E.filter(e => !e.suppl);
const ST = { main: MAIN.length, suppl: E.length - MAIN.length, ex: MAIN.reduce((s, e) => s + e.examples.length, 0),
  five: MAIN.filter(e => e.examples.length >= 5).length, unest: MAIN.filter(e => e.unestablished).length };
const ALPHA = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ'.split('');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const foldRu = s => s.toLowerCase().replace(/ё/g, 'е');
const foldDn = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/ɛ/g,'e').replace(/ɔ/g,'o').replace(/ŋ/g,'n').replace(/ɲ/g,'ny').replace(/[‹›«»"'’.,;:!?()\/]/g,'').replace(/[\s-]+/g,'');
const fold = s => foldDn(foldRu(s));

// источники → якоря
const SRC_IDS = {};
D.sources.forEach((s, i) => {
  const codes = s.code.split(/[ \/—]+/).filter(c => /^[A-Z0-9]+$/.test(c));
  s.id = 'src' + i; codes.forEach(c => SRC_IDS[c] = s.id);
  if (s.code.startsWith('T68')) SRC_IDS['T68/72'] = s.id;
  if (s.code.startsWith('RST')) SRC_IDS['RST'] = s.id;
});
const linkSrc = s => esc(s).replace(/\b(T68\/72|NT18|NT95|AL65|AL64|COV|CAL|CFA|ANT|SM19|N78|N89|G88|GYK|RST|AT|AZ|H)\b/g,
  m => SRC_IDS[m] ? `<a class="code" href="#${SRC_IDS[m]}" title="Описание источника">${m}</a>` : m);

// формы: одинаковое написание в разных статьях
const formIndex = {};
E.forEach(e => e.forms.forEach(f => {
  f.form.split(/;\s*/).forEach(ff => {
    const k = foldDn(ff); (formIndex[k] = formIndex[k] || []).push({e, form: ff});
  });
}));
const lettersPresent = new Set(E.map(e => e.letter));
const tagsFor = e => {
  const t = [];
  if (e.suppl) t.push('<span class="tag info">дополнение</span>');
  if (e.unestablished) t.push('<span class="tag warn">написание не установлено</span>');
  else if (!e.suppl && e.few) t.push(`<span class="tag warn">примеров: ${e.count}</span>`);
  return t.join(' ');
};
const wordLink = e => `<a href="#w${e.n}">${esc(e.title)}</a>`;
const primaryForms = e => e.forms.slice(0, 2).map(f => f.form).join(', ');

// алфавит
function drawAbc(active) {
  document.getElementById('abc').innerHTML = ALPHA.map((L, i) =>
    lettersPresent.has(L) ? `<a href="#l${i}" class="${L === active ? 'on' : ''}">${L}</a>` : `<span aria-hidden="true">${L}</span>`).join('');
}

function sortedIn(L) { return E.filter(e => e.letter === L).sort((a, b) => (a.suppl - b.suppl) || foldRu(a.title).localeCompare(foldRu(b.title), 'ru')); }

function letterGroup(L) {
  const items = sortedIn(L).map(e => `<li>${wordLink(e)}${e.unestablished ? '<span class="none">—</span>' : `<span class="f">${esc(primaryForms(e))}</span>`}${e.suppl ? ' <span class="tag info">доп.</span>' : ''}</li>`).join('');
  return `<section class="lgroup" id="g${ALPHA.indexOf(L)}"><div class="L">${L}</div><ul class="wl">${items}</ul></section>`;
}

const V = document.getElementById('view');
function vHome() {
  const m = D.meta;
  return `<div class="stack">
    <h1>Русско-дендийский словарь</h1>
    <p class="lead">Денди — сонгайский язык северного Бенина и приграничья с Нигером и Нигерией. Словарь охватывает ${ST.main} ${plural(ST.main, 'значение', 'значения', 'значений')} списка Сводеша: у каждого слова указаны письменные варианты с источником и короткие засвидетельствованные примеры употребления.</p>
    <div class="statline"><span><b>${ST.main}</b> ${plural(ST.main, 'статья', 'статьи', 'статей')} Сводеша</span><span><b>${ST.suppl}</b> ${plural(ST.suppl, 'дополнительная', 'дополнительных', 'дополнительных')}</span><span><b>${ST.ex}</b> ${plural(ST.ex, 'пример', 'примера', 'примеров')}</span><span><b>${ST.five}</b> ${plural(ST.five, 'статья', 'статьи', 'статей')} с пятью и более примерами</span><span><b>${ST.unest}</b> без установленного написания</span></div>
    <p class="small muted">${esc(m.updated)} <a href="#about">Как пользоваться словарём</a></p>
    <div class="letters">${ALPHA.filter(L => lettersPresent.has(L)).map(letterGroup).join('')}</div>
  </div>`;
}

function vLetter(i) {
  const L = ALPHA[i];
  if (!lettersPresent.has(L)) return vHome();
  const list = sortedIn(L);
  return `<div class="stack">
    <div class="crumbs"><a href="#home">Словник</a><span>›</span><span>${L}</span></div>
    <h1>${L}</h1>
    <p class="muted">${list.length} ${plural(list.length, 'статья', 'статьи', 'статей')}</p>
    <ul class="res">${list.map(e => `<li><span class="rt">${wordLink(e)} ${tagsFor(e)}</span>${e.unestablished ? '<span class="rx">Практическое написание не установлено</span>' : `<span class="rf">${esc(e.forms.map(f => f.form).join(' · '))}</span>`}</li>`).join('')}</ul>
  </div>`;
}

function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; }

function vWord(n) {
  const e = byN[n]; if (!e) return vHome();
  const idx = E.indexOf(e), prev = E[idx - 1], next = E[idx + 1];
  const forms = e.forms.length ? `<section class="stack"><span class="label">${e.suppl ? 'Форма' : 'Письменные варианты'}</span><ul class="forms">${e.forms.map(f =>
    `<li><span class="fw">${esc(f.form)}</span><span class="fs">${f.sources ? linkSrc(f.sources) : ''}</span>${f.note ? `<span class="fn">${esc(f.note)}</span>` : ''}</li>`).join('')}</ul></section>` : '';
  const rel = new Map();
  e.forms.forEach(f => f.form.split(/;\s*/).forEach(ff => (formIndex[foldDn(ff)] || []).forEach(x => { if (x.e !== e) rel.set(x.e.n, x); })));
  const relHtml = rel.size ? `<section class="stack"><span class="label">То же написание в других статьях</span><div class="related">${[...rel.values()].map(x => `<span><span class="dn">${esc(x.form)}</span> → ${wordLink(x.e)}</span>`).join('')}</div></section>` : '';
  const ex = e.examples.length ? `<section class="stack"><span class="label">${e.suppl ? 'Контексты' : 'Примеры'} · ${e.examples.length}</span><ol class="ex">${e.examples.map(x => `<li><span class="k">${x.k})</span><div class="body">
      ${x.text ? `<span class="dt">${esc(x.text)}</span>` : ''}
      ${x.gloss ? `<span class="gl">${x.text ? `<span class="gt">${x.gloss_type === 'rst' ? 'Рус. параллельный контекст' : 'Пояснение'}</span>` : ''}${esc(x.gloss)}</span>` : ''}
      <span class="src">${linkSrc(x.source)}</span></div></li>`).join('')}</ol></section>` : '';
  const meta = e.suppl ? `<span>№ ${e.n}</span><span>${esc(e.label)}</span>`
    : `<span>№ ${e.n}</span><span>Сводеш № ${e.swadesh}</span><span>Примеров: ${e.count}</span>${tagsFor(e)}`;
  return `<article class="stack" style="gap:22px">
    <div class="crumbs"><a href="#home">Словник</a><span>›</span><a href="#l${ALPHA.indexOf(e.letter)}">${e.letter}</a></div>
    <div class="entry-head"><h1>${esc(e.title)}</h1><div class="meta">${meta}</div></div>
    ${e.unestablished ? `<div class="box warn"><span class="label">Написание не установлено</span>${esc(e.unestablished)}</div>` : ''}
    ${forms}
    ${e.meaning ? `<div class="box"><span class="label">Значение и ограничения</span>${esc(e.meaning)}</div>` : ''}
    ${ex}
    ${relHtml}
    ${e.index_sci || e.index_extra ? `<section class="stack small"><span class="label">Указатели для сверки</span>
      ${e.index_sci ? `<p><span class="muted">Научный указатель.</span> ${linkSrc(e.index_sci)}</p>` : ''}
      ${e.index_extra ? `<p><span class="muted">Дополнительный указатель.</span> ${linkSrc(e.index_extra)}</p>` : ''}</section>` : ''}
    <nav class="pager">${prev ? `<a href="#w${prev.n}"><small>← предыдущая</small>${esc(prev.title)}</a>` : ''}${next ? `<a class="next" href="#w${next.n}"><small>следующая →</small>${esc(next.title)}</a>` : ''}</nav>
  </article>`;
}

function vDendi() {
  const rows = [];
  E.forEach(e => e.forms.forEach(f => f.form.split(/;\s*/).forEach(ff => rows.push({ form: ff, k: foldDn(ff), e }))));
  const map = new Map();
  rows.forEach(r => { const key = r.form; if (!map.has(key)) map.set(key, { form: r.form, k: r.k, es: [] }); const m = map.get(key); if (!m.es.includes(r.e)) m.es.push(r.e); });
  const all = [...map.values()].sort((a, b) => a.k.localeCompare(b.k) || a.form.localeCompare(b.form));
  const groups = new Map();
  all.forEach(r => { const g = (r.k[0] || '?').toUpperCase(); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(r); });
  return `<div class="stack">
    <h1>Денди → русский</h1>
    <p class="muted">Все ${all.length} письменных вариантов из статей, по алфавиту. Знаки тона и долготы не влияют на порядок; ɛ стоит при e, ɔ — при o, ŋ — при n.</p>
    <div class="rev">${[...groups].map(([g, rs]) => `<section class="grp"><div class="L">${g.toLowerCase()}</div><dl>${rs.map(r => `<dt>${esc(r.form)}</dt><dd>${r.es.map(wordLink).join(', ')}</dd>`).join('')}</dl></section>`).join('')}</div>
  </div>`;
}

function vGrammar() {
  const G = D.grammar;
  const suppl = E.filter(e => e.suppl);
  const glossOf = (x) => {
    const words = x.dendi.replace(/[?…]/g, '').trim().split(/\s+/);
    const parts = x.parse.replace(/^[^:]+:\s*/, '').split(/;\s*(?=\d+:)/).map(p => p.replace(/^\d+:\s*/, '').replace(/\.$/, ''));
    if (words.length !== parts.length) return `<p class="small muted">${esc(x.parse)}</p>`;
    return `<div class="gloss">${words.map((w, i) => `<span><span class="gw">${esc(w)}</span><span class="gg">${esc(parts[i])}</span></span>`).join('')}</div>`;
  };
  return `<div class="stack" style="gap:22px">
    <div class="stack"><span class="label">${esc(G.subtitle)}</span><h1>Вопросы на «да/нет»</h1><p class="muted small">${esc(G.date)}</p></div>
    ${G.intro.map(p => `<p>${esc(p)}</p>`).join('')}
    ${G.correction ? `<div class="box warn"><span class="label">Исправление прежнего объяснения</span>${esc(G.correction)}</div>` : ''}
    <h2>Правила и порядок слов</h2>
    <ol class="rules">${G.rules.map(r => `<li><span class="n">${r.n}</span><div class="stack" style="gap:4px"><h3>${esc(r.title)}</h3><p>${linkSrc(r.text)}</p></div></li>`).join('')}</ol>
    <h2>Примеры с разбором по словам</h2>
    <p class="small muted">Б — вопросы с частицей ba, Д — с частицей dee. Под каждым словом дана его глосса по порядку исходной строки.</p>
    <div class="gex">${G.examples.map(x => `<div class="box"><span class="id">${x.id}</span><span class="d">${esc(x.dendi)}</span><span class="r">${esc(x.ru)}</span>${glossOf(x)}<p class="small">${esc(x.comment)}</p><span class="small muted">${linkSrc(x.source)}</span></div>`).join('')}</div>
    <h2>Дополнительные статьи</h2>
    <ul class="res">${suppl.map(e => `<li><span class="rt">${wordLink(e)}</span><span class="rf">${esc(e.forms[0].form)} — ${esc(e.forms[0].note)}</span></li>`).join('')}</ul>
    <h2>Источники и проверка</h2>
    ${G.sources.map(p => `<p class="small">${linkSrc(p)}</p>`).join('')}
  </div>`;
}

function vSources(hl) {
  const dist = D.meta.distribution;
  const max = Math.max(70, Math.ceil(Math.max(0, ...dist.map(d => parseFloat(d.pct.replace(',', '.')))) / 10) * 10);
  return `<div class="stack" style="gap:22px">
    <h1>Источники</h1>
    <p>${esc(D.sources_intro)}</p>
    <section class="stack"><h2>Распределение примеров</h2>
      <div class="bars" role="img" aria-label="Доля примеров по источникам">${dist.map(d => `<div class="brow"><a class="code" href="#${SRC_IDS[d.code]}">${d.code}</a><div class="track" title="${esc(d.label)}"><div class="fill" style="width:${(parseFloat(d.pct.replace(',', '.')) / max * 100).toFixed(1)}%"></div></div><span class="v">${d.n} · ${d.pct}%</span></div>`).join('')}</div>
      <p class="small muted">Шкала 0–${max}% от ${ST.ex} примеров основной части. ${dist.map(d => `${d.code} — ${esc(d.label)}`).join('; ')}.</p>
      ${D.meta.distribution_notes.map(p => `<p class="small">${esc(p)}</p>`).join('')}
    </section>
    <section class="stack"><h2>Библиография</h2>
      <div class="srcs">${D.sources.map(s => `<article id="${s.id}" class="${s.id === hl ? 'hl' : ''}"><span class="c">${esc(s.code)}</span><div class="t"><p>${esc(s.desc)}</p>${s.url ? `<a class="u" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a>` : ''}</div></article>`).join('')}</div>
    </section>
    <section class="stack"><h2>Статьи с менее чем пятью примерами</h2>
      <p class="small">${fewLinks(D.few[0] || '')}</p>
      ${D.few.slice(1).map(p => `<p class="small muted">${esc(p)}</p>`).join('')}
    </section>
  </div>`;
}
function fewLinks(text) {
  return [...text.matchAll(/(.+?) \((\d+)\)(?:; |$)/g)].map(m => {
    const e = E.find(x => !x.suppl && foldRu(x.title) === foldRu(m[1]));
    return e ? `<a href="#w${e.n}">${esc(m[1])}</a> (${m[2]})` : `${esc(m[1])} (${m[2]})`;
  }).join('; ');
}

function vAbout() {
  const m = D.meta;
  return `<div class="stack" style="gap:18px">
    <h1>Как пользоваться</h1>
    ${m.howto.map(p => `<p>${linkSrc(p)}</p>`).join('')}
    <div class="box"><span class="label">Поиск</span>Ищите по русскому слову или по дендийской форме. Знаки тона и долготы можно не набирать: <span class="dn">kpaare</span> найдёт <span class="dn">kpaarɛ</span>, а <span class="dn">beeri</span> найдёт и <span class="dn">bèèri</span>, и <span class="dn">bèeri</span>. Буквы ɛ, ɔ, ŋ можно вставить кнопками рядом с полем. Отметка «искать в примерах» включает поиск по фрагментам и пояснениям.</div>
    <div class="box"><span class="label">Пометки</span><p><span class="tag warn">примеров: 3</span> — в статье меньше пяти примеров.</p><p style="margin-top:6px"><span class="tag warn">написание не установлено</span> — проверенного письменного эквивалента пока нет; это не означает, что в языке нет такого слова.</p><p style="margin-top:6px"><span class="tag info">дополнение</span> — служебные слова и ответы вне списка Сводеша, № 208–214.</p></div>
    <p class="small muted">Под формами слов на сайте опущена повторяющаяся помета документа: «Засвидетельствованная форма в данном контексте. См. пояснение к примеру; грамматические показатели и тон сохранены». Она относится ко всем формам с примерами из учебных текстов.</p>
    <h2>История обновлений</h2>
    ${m.history.map(p => `<p>${esc(p)}</p>`).join('')}
    <p class="muted small">${esc(m.stats)}</p>
  </div>`;
}

// поиск
const IDX = E.map(e => ({
  e, t: foldRu(e.title), tf: fold(e.title),
  forms: e.forms.map(f => ({ raw: f.form, k: foldDn(f.form) })),
  ex: e.examples.map(x => ({ x, k: fold(x.text + ' ' + x.gloss), kd: foldDn(x.text) }))
}));
let query = '', inEx = false;
try { inEx = localStorage.getItem('dn-inex') === '1'; } catch (_) {}
document.getElementById('inex').checked = inEx;

function hlDn(text, q) {
  // подсветка с учётом свёртки диакритики: ищем по словам
  const qk = foldDn(q); if (!qk) return esc(text);
  return text.split(/(\s+)/).map(w => foldDn(w).includes(qk) && qk.length > 1 ? `<mark>${esc(w)}</mark>` : esc(w)).join('');
}
function vSearch() {
  const q = query.trim();
  if (!q) return vHome();
  const qr = foldRu(q), qk = fold(q);
  const out = [];
  IDX.forEach(r => {
    let score = 0, hitForm = null, hitEx = [];
    if (r.t === qr) score = 100; else if (r.t.startsWith(qr)) score = 80; else if (r.t.includes(qr)) score = 60;
    r.forms.forEach(f => {
      let s = 0;
      if (f.k === qk) s = 95; else if (f.k.startsWith(qk)) s = 75; else if (qk.length > 2 && f.k.includes(qk)) s = 50;
      if (s > score) { score = s; hitForm = f.raw; } else if (s && !hitForm) hitForm = f.raw;
    });
    if (inEx && qk.length > 1) {
      r.ex.forEach(x => { if (x.k.includes(qk)) hitEx.push(x.x); });
      if (hitEx.length && !score) score = 20;
    }
    if (score) out.push({ r, score, hitForm, hitEx });
  });
  out.sort((a, b) => b.score - a.score || a.r.e.n - b.r.e.n);
  if (!out.length) return `<div class="stack"><h1>Ничего не найдено</h1><p>По запросу «${esc(q)}» нет ни русских заголовков, ни дендийских форм${inEx ? ', ни примеров' : ''}. ${inEx ? '' : 'Попробуйте включить «искать в примерах».'} Тон и долготу можно не набирать.</p></div>`;
  return `<div class="stack"><h1>Поиск: «${esc(q)}»</h1><p class="muted">${out.length} ${plural(out.length, 'статья', 'статьи', 'статей')}</p>
    <ul class="res">${out.slice(0, 120).map(o => {
      const e = o.r.e;
      const forms = e.forms.map(f => f.form === o.hitForm ? `<mark>${esc(f.form)}</mark>` : esc(f.form)).join(' · ');
      const exs = o.hitEx.slice(0, 3).map(x => `<span class="rx">${x.text ? `<span class="dn">${hlDn(x.text, q)}</span> — ` : ''}${esc(x.gloss)}</span>`).join('');
      return `<li><span class="rt">${wordLink(e)} ${tagsFor(e)}</span>${e.unestablished ? '<span class="rx">Практическое написание не установлено</span>' : `<span class="rf">${forms}</span>`}${exs}${o.hitEx.length > 3 ? `<span class="rx">и ещё ${o.hitEx.length - 3} в примерах</span>` : ''}</li>`;
    }).join('')}</ul></div>`;
}

// маршрутизация
function route() {
  const h = location.hash.slice(1) || 'home';
  let html, nav = '', L = null, scrollTo = null;
  let m;
  if ((m = h.match(/^w(\d+)$/))) { html = vWord(+m[1]); L = byN[+m[1]]?.letter; }
  else if ((m = h.match(/^l(\d+)$/))) { html = vLetter(+m[1]); L = ALPHA[+m[1]]; }
  else if ((m = h.match(/^g(\d+)$/))) { html = vHome(); nav = 'home'; scrollTo = h; L = ALPHA[+m[1]]; }
  else if ((m = h.match(/^src\d+$/))) { html = vSources(h); nav = 'sources'; scrollTo = h; }
  else if (h === 'search') { html = vSearch(); }
  else if (['dendi', 'grammar', 'sources', 'about'].includes(h)) { html = { dendi: vDendi, grammar: vGrammar, sources: vSources, about: vAbout }[h](); nav = h; }
  else { html = vHome(); nav = 'home'; }
  V.innerHTML = html;
  const we = (m = h.match(/^w(\d+)$/)) ? byN[+m[1]] : null;
  document.title = we ? `${we.title} — ${we.forms.length ? we.forms[0].form + ' · ' : ''}Словарь денди`
    : ({ dendi: 'Денди → русский', grammar: 'Грамматика', sources: 'Источники', about: 'Как пользоваться' }[h] || 'Словарь денди') + (['dendi', 'grammar', 'sources', 'about'].includes(h) ? ' · Словарь денди' : '');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === nav));
  drawAbc(L);
  if (scrollTo) { const el = document.getElementById(scrollTo); if (el) { el.scrollIntoView({ block: 'start' }); return; } }
  window.scrollTo(0, 0);
  if (h !== 'search' && query) { /* оставляем текст в поле */ }
}
window.addEventListener('hashchange', route);

const qEl = document.getElementById('q');
let tmr;
qEl.addEventListener('input', () => {
  clearTimeout(tmr);
  tmr = setTimeout(() => {
    query = qEl.value;
    if (query.trim()) { if (location.hash !== '#search') location.hash = 'search'; else { V.innerHTML = vSearch(); drawAbc(null); document.querySelectorAll('#nav a').forEach(a => a.classList.remove('on')); } }
    else if (location.hash === '#search') location.hash = 'home';
  }, 150);
});
document.getElementById('sform').addEventListener('submit', ev => {
  ev.preventDefault(); query = qEl.value;
  const res = query.trim() ? IDX.find(r => r.t === foldRu(query.trim())) : null;
  if (res) location.hash = 'w' + res.e.n; else if (location.hash !== '#search') location.hash = 'search'; else route();
});
document.querySelectorAll('.chars button').forEach(b => b.addEventListener('click', () => {
  const s = qEl.selectionStart ?? qEl.value.length, e2 = qEl.selectionEnd ?? s;
  qEl.value = qEl.value.slice(0, s) + b.dataset.ch + qEl.value.slice(e2);
  qEl.focus(); qEl.setSelectionRange(s + 1, s + 1); qEl.dispatchEvent(new Event('input'));
}));
document.getElementById('inex').addEventListener('change', ev => {
  inEx = ev.target.checked; try { localStorage.setItem('dn-inex', inEx ? '1' : '0'); } catch (_) {}
  if (location.hash === '#search') route();
});
document.getElementById('foot').textContent = `Свод не является нормативным словарём языка. ${D.meta.updated}`;
route();
</script>
