 PDF с. 93","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=93"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":89,"sci":"H, §E №106, с. 37. Практическая орфография и контекст требуют сверки."},{"n":41,"title":"Грязный","letter":"Г","variants":[{"label":"I","form":"ziibi","notes":["В том числе моральная нечистота; употребление о физической грязи нужно проверить отдельно.","Грязь/загрязнение воды; существительное."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 179","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=179"},{"t":"NT18, Мф 23:27","u":"https://zeno.fm/bible/DDNBIV/MAT/23/"},{"t":"AL65, PDF с. 17","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17"},{"t":"NT18, 1 Фес 4:7","u":"https://zeno.fm/bible/DDNBIV/1TH/4/"},{"t":"NT18, Гал 5:19","u":"https://zeno.fm/bible/DDNBIV/GAL/5/"}]},{"label":"II","form":"ziibɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мк 7:2","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":188,"meaning":"ziibɔ — грязный; ziibi — нечистота/грязь, существительное.","sci":"H, §E №158, с. 40. Практическая орфография и контекст требуют сверки."},{"n":42,"title":"Да: слово ответа","letter":"Д","variants":[{"label":"","form":"Oò","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке.","Полная вопросно-ответная пара приведена в банке; ответная форма не вырвана из контекста. Эти положительные вопросы не доказывают правила реакции на отрицательный вопрос."],"full":1,"status":"","examples":[{"k":1,"pid":"П45","head":"NT95, Мф 13:51, PDF с. 13","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."}],"refs":[{"t":"NT18, Мф 13:51","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT95, Мф 13:51, PDF с. 13","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13"}]}],"extra_refs":[{"t":"NT18, Деян 22:27","u":"https://zeno.fm/bible/DDNBIV/ACT/22/"},{"t":"NT18, Деян 5:8","u":"https://zeno.fm/bible/DDNBIV/ACT/5/"},{"t":"NT18, Ин 11:27","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, 1 Кор 9:10","u":"https://zeno.fm/bible/DDNBIV/1CO/9/"}],"stray":[],"kind":"extra","meaning":"Утвердительный ответ. Не устанавливается механическое соответствие русским «да/нет» после отрицательного вопроса."},{"n":43,"title":"Давать","letter":"Д","variants":[{"label":"I","form":"no","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 27:34","u":"https://zeno.fm/bible/DDNBIV/MAT/27/"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]},{"label":"II","form":"nɔɔ","notes":["В формулировке «фото показывает тебе»; конструкция «давать/показывать»."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 95","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=95"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"},{"t":"AL65, PDF с. 93","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=93"}]},{"label":"III","form":"nɔ̀ɔ̀","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 102","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=102"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":128,"sci":"H, §E №169, с. 41. Практическая орфография и контекст требуют сверки."},{"n":44,"title":"Давид","letter":"Д","variants":[{"label":"","form":"Dafidi","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П8","head":"NT95, MAT 12:23, PDF с. 12","rst":true,"dendi":"À na ci Dafidi ize di dee?","source":"NT95, MAT 12:23, PDF с. 12","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12","pub":"не это ли Христос, сын Давидов?","lit":"Не является ли он тем сыном Давида?","parse":"À — он; na — отрицательная функция в данном сочетании; не смешивать с показателем переходного действия; ci — являться; Dafidi — Давид; ize — сын / потомок; di — определительный элемент; dee — вопросительная частица.","note":"В опубликованном русском тексте добавлено именование «Христос»; в этой дендийской фразе слова Mɛsiya нет."}],"refs":[{"t":"NT95, MAT 12:23, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Имя собственное; в П8 входит в именную группу «сын Давида»."},{"n":45,"title":"Даже","letter":"Д","variants":[{"label":"","form":"Ba","notes":["Начальное употребление; не конечная вопросительная частица ba."],"full":1,"status":"","examples":[{"k":1,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."}],"refs":[{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":46,"title":"Далёкий","letter":"Д","variants":[ tus":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 20:6","u":"https://zeno.fm/bible/DDNBIV/MAT/20/"},{"t":"AL65, PDF с. 92","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=92"},{"t":"ANT, PDF с. 1","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_8.pdf#page=1"}]},{"label":"III","form":"jibiri","notes":["Календарное употребление в AL65. Форма сохранена без автоматической перестановки букв в jiribi; её отношение к zaari и hanu не сведено к полной взаимозаменяемости."],"full":2,"status":"","examples":[{"k":1,"pid":"П40","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ kuna, jibiri 7 ya goono.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одной неделе имеются семь дней.","parse":"Azuma — неделя; fɔ́ — один; kuna — внутри; в; jibiri — день в календарной строке; 7 — семь; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Jibiri сохранено как в пособии; не исправлено автоматически на jiribi из иных текстов. Другие варианты статьи «День» не объявлены взаимозаменяемыми во всех сочетаниях."},{"k":2,"pid":"П47","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri kubantɛ gonda jibiri 365.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Невисокосный год имеет 365 дней.","parse":"Jiiri — год; kubantɛ — невисокосный; значение в сочетании jiiri kubantɛ; gonda — иметь; jibiri — день; 365 — триста шестьдесят пять; цифровая запись источника.","note":"Предложение входит в противопоставление обычного и високосного года. Kubantɛ не объявляется универсальным переводом прилагательного «обычный» вне календарного сочетания. Цифра сохранена; дендийское словесное название числа не восстановлено по догадке."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]},{"label":"IV","form":"hanuyo","notes":["Форма при перечислении дней недели; источниковое -yo сохранено. Не объявляется самостоятельной универсальной формой единственного числа."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":178,"sci":"H, §E №120, с. 38. Практическая орфография и контекст требуют сверки."},{"n":51,"title":"Дерево","letter":"Д","variants":[{"label":"I","form":"tuuri","notes":["В корпусе встречаются простая и сложная формы; часть контекстов относится к растениям вообще."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 71","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=71"},{"t":"NT18, Мф 3:10","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"}]},{"label":"II","form":"tuurinya","notes":["В корпусе встречаются простая и сложная формы; часть контекстов относится к растениям вообще.","Печатная с. 41: подсчёт древесины для строительных работ. Слитное написание, подтверждающее вариант NT95.","В строительной задаче — деревянные элементы; не живые деревья. Совпадение графической формы не оправдывает один перевод во всех жанрах."],"full":1,"status":"","examples":[{"k":1,"pid":"П42","head":"CAL, PDF с. 22","rst":false,"dendi":"Sooro fo ga, tuurinya 55 ya goono.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном ряду имеются 55 деревянных элементов.","parse":"Sooro — ряд; fo — один; написание CAL; ga — в; пространственный элемент; tuurinya — деревянный элемент в строительной задаче; 55 — пятьдесят пять; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Печатная с. 41: задача о древесине для строительства. Здесь речь о строительных элементах, поэтому перевод «55 растущих деревьев» не используется. Форма tuurinya совпадает графически с вариантами растительного термина; значение устанавливается контекстом."}],"refs":[{"t":"NT95, PDF с. 71","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=71"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]},{"label":"III","form":"tuuri-nya","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 13:32","u":"https://zeno.fm/bible/DDNBIV/MA я функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"NT95, PDF с. 108","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=108"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]},{"label":"II","form":"afɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, 1 Кор 15:41","u":"https://zeno.fm/bible/DDNBIV/1CO/15/"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"}]},{"label":"III","form":"afɔ́","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"AL64, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=7"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":21,"meaning":"afɔ — «другой/отличный» в сравнении видов славы; ŋmani засвидетельствовано в NT95; точное отношение вариантов требует сопоставления контекстов."},{"n":57,"title":"Думать","letter":"Д","variants":[{"label":"I","form":"miila","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 1:19","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"}]},{"label":"II","form":"lasabu","notes":[],"full":null,"status":"Полный пример с дословным sci":"H, §E №126, с. 38. Практическая орфография и контекст требуют сверки."},{"n":61,"title":"Дышать","letter":"Д","variants":[{"label":"I","form":"hinazebu","notes":["Название дыхания в сочетании «затруднение дыхания»; не самостоятельный глагол «дышать»."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"},{"t":"COV, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=3"}]},{"label":"II","form":"hunanzebu","notes":["Название дыхания/дыхательной функции в тексте о коже; существительное, не глагол."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 77","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=77"},{"t":"AL65, PDF с. 64","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=64"}]},{"label":"III","form":"hinanzebu","notes":["В том же COVID-буклете встречаются hinazebu и hinanzebu; сохранены обе записи."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":99,"meaning":"Подтверждены названия дыхания hinazebu / hinanzebu (COV) и hunanzebu (AL65). Это существительные в описаниях дыхательной функции и затруднения дыхания. Общий глагол «дышать» в практическом написании не установлен. Funsu относится к дуновению; см. статью «Дуть». Терсис отдельно различает дуть, дышать и опухать."},{"n":62,"title":"Еврейский; еврей","letter":"Е","variants":[{"label":"I","form":"Eburu","notes":["Название народа и языка в переводе NT."],"full":2,"status":"","examples":[{"k":1,"pid":"П4","head":"NT18, 2CO 11:22","rst":true,"dendi":"Eburu yom no ba?","source":"NT18, 2CO 11:22","source_url":"https://zeno.fm/bible/DDNBIV/2CO/11/","pub":"Они Евреи?","lit":"[Они] евреи?","parse":"Eburu — еврей; yom — показатель множественности; no — предикативный элемент; ba — вопросительная частица.","note":"Отдельного подлежащего «они» в этой фразе нет; оно восстановлено в русском переводе по контексту."},{"k":2,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."}],"refs":[{"t":"NT18, Деян 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT18, Деян 22:2","u":"https://zeno.fm/bible/DDNBIV/ACT/22/"},{"t":"NT18, Ин 20:16","u":"https://zeno.fm/bible/DDNBIV/JHN/20/"},{"t":"NT18, Откр 16:16","u":"https://zeno.fm/bible/DDNBIV/REV/16/"},{"t":"NT18, 2 Кор 11:22","u":"https://zeno.fm/bible/DDNBIV/2CO/11/"}]},{"label":"II","form":"Ebulu","notes":["Иное засвидетельствованное написание NT95. Не исправлено на Eburu и не объявлено свободно взаимозаменяемым с ним."],"full":1,"status":"","examples":[{"k":1,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Перед cine обозначает язык; с yom — людей. Это словоупотребление переводчика; оно само по себе не решает исторический вопрос об арамейском или древнееврейском в отдельных библейских сценах."},{"n":63,"title":"Европеец","letter":"Е","variants":[{"label":"","form":"bature","notes":["В сочетании bature cinɛ. Название конкретного европейского языка не приписано этому слову без дополнительных доказательств."],"full":1,"status":"","examples":[{"k":1,"pid":"П41","head":"AL64, PDF с. 3","rst":false,"dendi":"Gandà ciineyo ga nda bature cinɛ ga sènnìyom nda mɛɛ ;","source":"AL64, PDF с. 3","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Устное говорение на языках страны и на языке европейца.","parse":"Gandà — страна; местная языковая среда в этом пункте; ciineyo — языки; форма с -yo; ga — на; элемент конструкции сферы/языка; nda — и; далее посредством; bature — европеец; cinɛ — язык; sènnìyom — говорение; контекстная производная форма; mɛɛ — рот; здесь устный способ.","note":"Полный именной пункт списка учебных целей; личного сказуемого в нём нет. Слово bature не подменено без доказательства названием конкретного языка. Морфологическое разложение sènnìyom пока не установлено. Тоны и точка с запятой сохранены."}],"refs":[{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":64,"title":"Если","letter":"Е","variants":[{"label":"","form":"de","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мк 7:3","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL65, PDF с. 104","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"},{"t":"AL65, PDF с. 105","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=105"},{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"AL65, PDF с. 107","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=107"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":205,"meaning":"de — условный показатель; в Мк 7:3 конструкция «если не»."},{"n":65,"title":"Есть","letter":"Е","variants":[{"label":"I","form":"ŋmaa","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT18, Мк 7:2","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Лк 24:43","u":"https://zeno.fm/bi рник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мф 3:5","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL64, PDF с. 1","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=1"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]},{"label":"II","form":"nna","notes":["Письменное расхождение с nda; различать функцию и окружение.","Печатная с. 8–9: запись союза в тексте 1994 года."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"CFA, PDF с. 8","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=8"},{"t":"CFA, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=5"},{"t":"COV, AL64, PDF с. 20","rst":false,"dendi":"Ifɔ nɔ noo dendeni?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Что именно [адресат вопроса] изучил?","parse":"Ifɔ — что?; nɔ — выделительный/предикативный элемент; noo — форма адресата в пособии; лицо и число отдельно не установлены; dendeni — изучать / учиться.","note":"Дословная глосса намеренно содержит квадратные скобки: лицо и число адресата не подтверждены отдельным описанием местоименной системы. Это полный пример с незавершённой грамматической интерпретацией, а не образец для самостоятельного составления фраз."},{"k":2,"pid":"П17","head":"AL64, PDF с. 20","rst":false,"dendi":"Mɛtɛ noo nà à dendeni nda?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Каким способом [адресат вопроса] изучил это?","parse":"Mɛtɛ — как?; noo — форма адресата; лицо и число не установлены; nà — показатель переходного действия; à — это, дополнение; dendeni — изучать; nda — элемент конструкции способа.","note":"Тон nà сохранён по источнику. Классификация конечного nda предварительная; это ограничение относится и к статье nda. Перевод не выдаётся за полностью завершённый разбор."},{"k":3,"pid":"П18","head":"CAL, PDF с. 9, печ. с. 14–15","rst":false,"dendi":"Iri ma dendeni:","source":"CAL, PDF с. 9, печ. с. 14–15","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=9","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Пусть мы учимся:","parse":"Iri — мы; ma — побудительный/желательный показатель в данном сочетании; dendeni — учиться.","note":"Полная вводная фраза перед учебной таблицей; двоеточие сохранено. Таблица задаёт контекст обучения арифметике. Это не выдуманный разговорный вопрос."}],"refs":[{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"},{"t":"NT18, 1 Тим 2:11","u":"https://zeno.fm/bible/DDNBIV/1TI/2/"},{"t":"NT18, 2 Тим 3:7","u":"https://zeno.fm/bible/DDNBIV/2TI/3/"},{"t":"NT18, 2 Тим 3:14","u":"https://zeno.fm/bible/DDNBIV/2TI/3/"},{"t":"NT18, Еф 5:1","u":"https://zeno.fm/bible/DDNBIV/EPH/5/"},{"t":"NT18, Иак 5:10","u":"https://zeno.fm/bible/DDNBIV/JAS/5/"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"В учебных вопросах — учиться / изучать. Другие контексты допускают следование образцу; не заменять эти оттенки одним русским глаголом."},{"n":90,"title":"Иисус","letter":"И","variants":[{"label":"","form":"Yesu","notes":["Имя собственное; практическое написание из NT95."],"full":4,"status":"","examples":[{"k":1,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."},{"k":2,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."},{"k":3,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":4,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"},{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":91,"title":"Или: союз альтернативного вопроса","letter":"И","variants":[{"label":"","form":"wala","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, Мк 12:14, PDF с. 33","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=33"}]}],"extra_refs":[{"t":"NT18, Мк 12:14","u":"https://zeno.fm/bible/DDNBIV/MRK/12/"},{"t":"NT18, Деян 8:34","u":"https://zeno.fm/bible/DDNBIV/ACT/8/"},{"t":"NT18, Рим 4:10","u":"https://zeno.fm/bible/DDNBIV/ROM/4/"},{"t":"NT18, 1 Кор 14:36","u":"https://zeno.fm/bible/DDNBIV/1CO/14/"},{"t":"NT18, Лк 12:41","u":"https://zeno.fm/bible/DDNBIV/LUK/12/"}],"stray":[],"kind":"extra","meaning":"Разделительный союз. Полный вопросительный контекст требует отдельного дословного разбора; невопросительная альтернатива представлена в П29."},{"n":92,"title":"Илия","letter":"И","variants":[{"label":"","form":"Eli","notes":["Имя собственное."],"full":2,"status":"","examples":[{"k":1,"pid":"П14","head":"NT18, JHN 1:21","rst":true,"dendi":"Ni no Eli?","source":"NT18, JHN 1:21","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"ты Илия?","lit":"Ты — Илия?","parse":"Ni — ты, самостоятельная форма; no — предикативный элемент; Eli — Илия.","note":"Вопрос без ba и dee: по письменному тексту нельзя установить точную вопросительную интонацию."},{"k":2,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."}],"refs":[{"t":"NT18, Ин 1:21","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Мф 17:3","u":"https://zeno.fm/bible/DDNBIV/MAT/17/"},{"t":"NT18, Мк 9:4","u":"https://zeno.fm/bible/DDNBIV/MRK/9/"},{"t":"NT18, Лк 9:30","u":"https://zeno.fm/bible/DDNBIV/LUK/9/"},{"t":"NT18, Мф 27:49","u":"https://zeno.fm/bible/DDNBIV/MAT/27/"},{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"В вопросе «ты Илия?» перед именем стоит no. Имя не является вопросительным словом."},{"n":93,"title":"Иметь","letter":"И","variants":[{"label":"I","form":"gunda","notes":["Глагол состояния."],"full":2,"status":"","examples":[{"k":1,"pid":"П1","head":"NT18, 1CO 7:27","rst":true,"dendi":"N gunda wɛndɛ ba?","source":"NT18, 1CO 7:27","source_url":"https://zeno.fm/bible/DDNBIV/1CO/7/","pub":"Соединен ли ты с женою?","lit":"Ты имеешь жену?","parse":"N — ты; gunda — иметь; wɛndɛ — жена; ba — вопросительная частица."},{"k":2,"pid":"П5","head":"NT18, ROM 14:22","rst":true,"dendi":"N gunda naane ba?","source":"NT18, ROM 14:22","source_url":"https://zeno.fm/bible/DDNBIV/ROM/14/","pub":"Ты имеешь веру?","lit":"Ты имеешь веру?","parse":"N — ты; gunda — иметь; naane — вера; ba — вопросительная частица."}],"refs":[{"t":"NT18, 1 Кор 7:27","u":"https://zeno.fm/bible/DDNBIV/1CO/7/"},{"t":"NT18, Рим 14:22","u":"https://zeno.fm/bible/DDNBIV/ROM/14/"},{"t":"NT18, Мф 11:15","u":"https://zeno.fm/bible/DDNBIV/MAT/11/"},{"t":"NT18, 1 Кор 9:4","u":"https://zeno.fm/bible/DDNBIV/1CO/9/"}]},{"label":"II","form":"gonda","notes":["Глагол состояния."],"full":null,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":2,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."},{"k":3,"pid":"П39","head":"AL65, PDF с. 70","rst":false,"dendi":"Handu fɔ́ gonda azuma 4.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Один месяц имеет четыре недели.","parse":"Handu — месяц; fɔ́ — один; gonda — иметь; azuma — неделя; 4 — четыре; цифровая запись.","note":"Это приближённая учебная схема, а не утверждение, что каждый календарный месяц длится ровно четыре недели. Цифра не заменяется неподтверждённым дендийским названием числа."},{"k":4,"pid":"П46","head":"AL65, PDF с. 29","rst":false,"dendi":"Bom gonda hangayo, mɔɔize, ninɛ, mɛɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Голова имеет уши, глаза, нос, рот.","parse":"Bom — голова; gonda — иметь; hangayo — уши; форма источника с -yo; mɔɔize — глаза в данном перечислении органов головы; ninɛ — нос; mɛɛ — рот.","note":"Полное предложение из учебного описания тела. Число органов в русском переводе следует анатомическому перечислению; оно не приписывается единому суффиксу у всех дендийских слов. Здесь mɔɔize названо в ряду органов головы; специальное различие «глаз / зрачок» этим предложением отдельно не устанавливается."},{"k":5,"pid":"П47","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri kubantɛ gonda jibiri 365.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Невисокосный год имеет 365 дней.","parse":"Jiiri — год; kubantɛ — невисокосный; значение в сочетании jiiri kubantɛ; gonda — иметь; jibiri — день; 365 — триста шестьдесят пять; цифровая запись источника.","note":"Предложение входит в противопоставление обычного и високосного года. Kubantɛ не объявляется универсальным переводом прилагательного «обычный» вне календарного сочетания. Цифра сохранена; дендийское словесное название числа не восстановлено по догадке."}],"refs":[{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"},{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Gunda подтверждено NT18; gonda — учебным пособием AL65. Это засвидетельствованные варианты в разных текстах; свободная взаимозаменяемость не установлена. Go в приведённых конструкциях обладания не обязателен."},{"n":94,"title":"Имя","letter":"И","variants":[{"label":"","form":"maa","notes":["Позиция имени передаётся словом maa в корпусе."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 38","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=38"},{"t":"NT18, Мф 1:21","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"NT18, Лк 21:17","u":"https://zeno.fm/bible/DDNBIV/LUK/21/"},{"t":"NT18, Ин 14:14","u":"https://zeno.fm/bible/DDNBIV/JHN/14/"},{"t":"NT18, 1 Кор 1:15","u":"https://zeno.fm/bible/DDNBIV/1CO/1/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":207,"meaning":"maa — имя; омограф глагола «слышать».","sci":"AZ, №100. Практическая орфография и контекст требуют сверки."},{"n":95,"title":"Искать","letter":"И","variants":[{"label":"","form":"ceeci","notes":["Глагол."],"full":1,"status":"","examples":[{"k":1,"pid":"П11","head":"NT95, JHN 1:38, PDF с. 60","rst":true,"dendi":"Ifɔ wom go ceeci?","source":"NT95, JHN 1:38, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"что вам надобно?","lit":"Что вы ищете?","parse":"Ifɔ — что?; wom — вы; go — предглагольный показатель; ceeci — искать.","note":"Параллельный Синодальный перевод передаёт вопрос иначе; дословный дендийский перевод не подменён им."}],"refs":[{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Мк 1:37","u":"https://zeno.fm/bible/DDNBIV/MRK/1/"},{"t":"NT18, Лк 19:10","u":"https://zeno.fm/bible/DDNBIV/LUK/19/"},{"t":"NT18, Рим 3:11","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, Еф 5:10","u":"https://zeno.fm/bible/DDNBIV/EPH/5/"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Объект поиска может быть человеком, предметом, знанием или желаемым результатом. Значение «испытывать / выяснять» устанавливается по контексту, не переносится на каждое употребление."},{"n":96,"title":"Испытание","letter":"И","variants":[{"label":"","form":"bubureyom","notes":["Испытание веры; производная форма сохранена без неподтверждённого разложения."],"full":1,"status":"","examples":[{"k":1,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."}],"refs":[{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":97,"title":"Испытывать жажду","letter":"И","variants":[{"label":"","form":"maa jo","notes":["Устойчивое сочетание в контексте питья. Maa здесь передаёт ощущение; буквальная подстановка «слышать» неверна."],"full":1,"status":"","examples":[{"k":1,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":98,"title":"Как","letter":"К","variants":[{"label":"","form":"mɛtɛ","notes":["Вопросительное слово."],"full":1,"status":"","examples":[{"k":1,"pid":"П17","head":"AL64, PDF с. 20","rst":false,"dendi":"Mɛtɛ noo nà à dendeni nda?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Каким способом [адресат вопроса] изучил это?","parse":"Mɛtɛ — как?; noo — форма адресата; лицо и число не установлены; nà — показатель переходного действия; à — это, дополнение; dendeni — изучать; nda — элемент конструкции способа.","note":"Тон nà сохранён по источнику. Классификация конечного nda предварительная; это ограничение относится и к статье nda. Перевод не выдаётся за полностью завершённый разбор."}],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Лк 16:3","u":"https://zeno.fm/bible/DDNBIV/LUK/16/"},{"t":"AL64, PDF с. 19","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=19"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"},{"t":"AL65, PDF с. 73","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=73"},{"t":"AL65, PDF с. 53","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=53"},{"t":"NT18, Ин 9:10","u":"https://zeno.fm/bible/DDNBIV/JHN/9/"},{"t":"NT18, Деян 2:8","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Мф 22:45","u":"https://zeno.fm/bible/DDNBIV/MAT/22/"},{"t":"NT18, Лк 20:44","u":"https://zeno.fm/bible/DDNBIV/LUK/20/"},{"t":"NT18, Мк 8:21","u":"https://zeno.fm/bible/DDNBIV/MRK/8/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":15,"meaning":"Спрашивает о способе или объяснении; конкретная конструкция может передавать русское «как же?». Не объявляется частицей вопросов на да/нет."},{"n":99,"title":"Камень","letter":"К","variants":[{"label":"","form":"tondi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 176","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=176"},{"t":"NT18, Мф 3:9","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Ин 10:31","u":"https://zeno.fm/bible/DDNBIV/JHN/10/"},{"t":"NT18, Мк 16:4","u":"https://zeno.fm/bible/DDNBIV/MRK/16/"},{"t":"NT18, Лк 22:41","u":"https://zeno.fm/bible/DDNBIV/LUK/22/"},{"t":"NT18, 1 Пет 2:4","u":"https://zeno.fm/bible/DDNBIV/1PE/2/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":156,"sci":"H, §E №131, с. 38. Практическая орфография и контекст требуют сверки."},{"n":100,"title":"Когда","letter":"К","variants":[{"label":"","form":"saa","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT18, Мф 24:3","u":"https://zeno.fm/bible/DDNBIV/MAT/24/"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/docu  с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."}],"refs":[{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":129,"title":"Месяц","letter":"М","variants":[{"label":"","form":"handu","notes":["Календарная единица. Небесное тело handu представлено в статье «Луна»; общность написания не стирает разные значения."],"full":2,"status":"","examples":[{"k":1,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":2,"pid":"П39","head":"AL65, PDF с. 70","rst":false,"dendi":"Handu fɔ́ gonda azuma 4.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Один месяц имеет четыре недели.","parse":"Handu — месяц; fɔ́ — один; gonda — иметь; azuma — неделя; 4 — четыре; цифровая запись.","note":"Это приближённая учебная схема, а не утверждение, что каждый календарный месяц длится ровно четыре недели. Цифра не заменяется неподтверждённым дендийским названием числа."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":130,"title":"Много","letter":"М","variants":[{"label":"I","form":"boobo","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."}],"refs":[{"t":"NT95, PDF с. 22","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=22"},{"t":"NT18, Мф 3:7","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Мк 15:3","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"},{"t":"NT18, Лк 3:18","u":"https://zeno.fm/bible/DDNBIV/LUK/3/"},{"t":"NT18, 1 Кор 16:9","u":"https://zeno.fm/bible/DDNBIV/1CO/16/"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"}]},{"label":"II","form":"bayom","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 7:13","u":"https://zeno.fm/bible/DDNBIV/MAT/7/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":18,"meaning":"bayom дано в значении множества людей; словообразовательный вариант.","sci":"H, §E №209, с. 44. Практическая орфография и контекст требуют сверки."},{"n":131,"title":"Моисей","letter":"М","variants":[{"label":"","form":"Moisi","notes":["Имя собственное."],"full":1,"status":"","examples":[{"k":1,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."}],"refs":[{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":132,"title":"Мокрый","letter":"М","variants":[],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":194,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":133,"title":"Молчать; замолчать","letter":"М","variants":[{"label":"","form":"dɛnjɛ","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":2,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT18, ACT 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"В П13 — наступление молчания перед речью."},{"n":134,"title":"Море","letter":"М","variants":[{"label":"I","form":"tɛku","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 153","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=153"}]},{"label":"II","form":"tɛɛku","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 12:40","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"}]},{"label":"III","form":"buula","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 18:6","u":"https://zeno.fm/bible/DDNBIV/MAT/18/"}]},{"label":"IV","form":"tenku","notes":["Море в перечислении водоёмов, участвующих в круговороте воды."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL65, PDF с. 72","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=72"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":154,"meaning":"tɛɛku и buula — употреблены о море; buula также об озере."},{"n":135,"title":"Мочь; быть способным","letter":"М","variants":[{"label":"","form":"hini","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."}],"refs":[{"t":"NT95, JHN 1:46, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Модальное употребление перед зависимым глаголом."},{"n":136,"title":"Муж","letter":"М","variants":[{"label":"I","form":"kunye","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 1:16","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"},{"t":"NT18, Еф 5:22","u":"https://zeno.fm/bible/DDNBIV/EPH/5/"},{"t":"NT18, Кол 3:19","u":"https://zeno.fm/bible/DDNBIV/COL/3/"},{"t":"NT18, Тит 2:4","u":"https://zeno.fm/bible/DDNBIV/TIT/2/"}]},{"label":"II","form":"sɔgɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 1:19","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":41,"meaning":"sɔgɔ в Мф 1:19 — будущий супруг; вместе с kunye не считать свободными синонимами.","sci":"H, §E №4, с. 30. Практическая орфография и контекст требуют сверки."},{"n":137,"title":"Мужчина","letter":"М","variants":[{"label":"I","form":"haibɔrɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 112","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=112"}]},{"label":"II","form":"harubɔrɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 1:21","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"},{"t":"AL65, PDF с. 21","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=21"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"AL65, PDF с. 79","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=79"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Пусть мы выполним это упражнение.","parse":"Iri — мы; ma — побудительный показатель; gweiyo — упражнение; форма источника; wo — этот; te — делать; выполнить.","note":"Печатная с. 40: полная инструкция перед арифметическими действиями. Te оставлено в написании CAL, не превращено механически в tɛ. Цитата не реконструирована из словаря."}],"refs":[{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"},{"t":"AL65, PDF с. 111","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=111"},{"t":"AL65, PDF с. 112","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=112"},{"t":"AL65, PDF с. 17","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17"}]},{"label":"III","form":"irì","notes":["Форма с низким тоном."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":4,"sci":"AZ, №3. Практическая орфография и контекст требуют сверки."},{"n":139,"title":"Мыть","letter":"М","variants":[{"label":"I","form":"nyunu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 29","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=29"},{"t":"NT18, Мф 27:24","u":"https://zeno.fm/bible/DDNBIV/MAT/27/"}]},{"label":"II","form":"hinu","notes":["Мыть руки водой с мылом; самостоятельный глагол."],"full":null,"status":"Полный пример с дословным разбо
