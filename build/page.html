<style>
/* Layout: справочник — шапка с полосой тканого узора, липкий алфавит, одна колонка чтения ~68ch, статьи как карточки словаря без лишних рамок */
:root {

  --weave-a: #2c3f9b;
  --weave-b: #f5f6f9;
  --f-display: "Alegreya", "PT Serif", Georgia, serif;

}

  }
}

}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }

nav.main a { color: var(--muted); padding: 2px 0; border-bottom: 2px solid transparent; }
nav.main a.on { color: var(--ink); border-bottom-color: var(--accent); text-decoration: none; }
.weave { height: 8px; background:
  repeating-linear-gradient(90deg, var(--weave-a) 0 6px, var(--weave-b) 6px 9px, var(--weave-a) 9px 11px, var(--weave-b) 11px 18px); opacity: .85; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-direction: column; gap: 8px; padding-block: 10px; }
.search { display: flex; gap: 8px; align-items: center; }
.search input[type=search] { flex: 1; min-width: 0; font: inherit; font-family: var(--f-dendi); font-size: 1.05rem; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.search input[type=search]:focus { outline: 2px solid var(--accent); border-color: transparent; }

/* словник */
.letters { display: flex; flex-direction: column; gap: 22px; margin-top: 8px; }

.gloss .gg { font-size: .78rem; color: var(--muted); }

/* источники */
.bars { display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums; }

.brow .track { height: 14px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }

.srcs .t { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.srcs .u { font-size: .85rem; overflow-wrap: anywhere; }

<script type="application/json" id="data">{"meta":{"title":"Денди — русско-дендийский словарь и грамматика","updated":"Обновлено 12 октября 2026 года. 207 статей Сводеша и 7 дополнительных статей о служебных словах и ответах.","about":"Это основной редактируемый документ. Новые дополнения и исправления вносятся сюда с сохранением ссылки. Дата и краткое описание изменений указаны ниже. Навигация доступна через структуру документа по заголовкам.","history":["12.10.2026 — перенесены все 207 статей, варианты написания, 874 примера основной части, библиография; включены правила вопросов на «да/нет», 10 примеров с разбором и 7 дополнительных статей. Различия ba/dee, не установленные по источникам, помечены."],"stats":"207 статей · 874 примеров · 153 статей с пятью и более примерами. Для 21 значений практическое написание пока не установлено. Эти статьи сохранены с пометками и доступными научными указателями.","howto":["Русские значения расположены по алфавиту; «ё» сортируется вместе с «е». Номер перед заголовком — номер статьи в этом словаре; «Сводеш №» сохраняет номер прежней таблицы. Заголовки документа ведут к буквам и отдельным статьям.","У каждой дендийской формы указан источник. Расхождения в длине гласного, тоне, дефисах и показателях вроде -yo сохранены. Используется ny, а также ɔ, ɛ и ŋ. Научная транскрипция не превращена автоматически в практическое письмо.","Примеры — короткие засвидетельствованные фрагменты, обычно 2–4 слова, а не полные предложения. Они показывают окружение слова. После библейского фрагмента дан русский параллельный контекст Синодального перевода: это отдельный перевод того же стиха, не буквальный перевод дендийской цитаты. Для учебных и иных текстов дана русская пояснительная глосса; она не выдаётся за дословный перевод.","Пять примеров — цель подбора, а не повод дописывать непроверенные фразы. Количество указано в каждой статье. Иногда разные источники подтверждают один и тот же контекст; это свидетельство разных написаний, а не новый смысл. Формы местоимений в косвенных конструкциях, сложные числительные, метафоры и существительные вместо искомого глагола требуют внимания к примечаниям.","В этой версии расширены примеры из AL65, AL64, COV, CAL и CFA; короткие фрагменты ANT сверены по изображению. Употребления из учебных текстов получили приоритет при подборе. NT18 сохранён для дополнительных смыслов и статей с недостатком иных свидетельств. Из SM19 приведены только ранее проверенные выражения. Свод имеет оставшиеся пробелы и не является нормативным словарём языка."],"distribution":[{"code":"AL65","label":"учебник для учащегося","n":197,"pct":"22,5"},{"code":"AL64","label":"пособие преподавателю","n":65,"pct":"7,4"},{"code":"COV","label":"санитарная памятка","n":36,"pct":"4,1"},{"code":"CAL","label":"пособие по арифметике","n":15,"pct":"1,7"},{"code":"CFA","label":"экономическая публикация","n":8,"pct":"0,9"},{"code":"ANT","label":"перевод гимна","n":4,"pct":"0,5"},{"code":"SM19","label":"этнографическая статья","n":3,"pct":"0,3"},{"code":"NT95","label":"Новый Завет, © 1995","n":21,"pct":"2,4"},{"code":"NT18","label":"Новый Завет, отметка © 2018","n":525,"pct":"60,1"}],"distribution_notes":["NT18: 525 из 874, 60,1% (в прежней версии — 797 из 873, 91,3%). Все небиблейские источники вместе: 328 примеров, 37,5%; ранее — 55 примеров. Доли считаются по представленным примерам, а не по всем ссылкам внутри документа.","Сохранены все 207 статей и прежние номера Сводеша. Небиблейские употребления представлены в 103 статьях. При наличии нескольких источников отданы предпочтения разным текстам и контекстам; совпадающие короткие фрагменты одной страницы не добавлены только ради количества.","В ряде статей пока доступны только библейские употребления. Отсутствующие примеры не восстановлены по аналогии. NT95 и NT18 — два издания одного переводческого проекта; их доли приведены отдельно, но замена NT18 на NT95 не считалась расширением небиблейской базы.","Новые примеры могут содержать производные существительные, сложные названия или переносное значение. Их функция пояснена под фрагментом. Употребление нового написания в одном контексте не означает, что оно заменяет остальные варианты во всех фразах."]},"entries":[{"n":1,"title":"Белый","letter":"Б","forms":[{"form":"kparɛ","sources":"NT95, PDF с. 175","note":""},{"form":"ikpaarɛ","sources":"NT18, Мф 5:36","note":""},{"form":"kpaarɛ","sources":"NT18, Откр 14:14; AL64, PDF с. 11; AL64, PDF с. 12","note":""},{"form":"harri kware","sources":"SM19, § 2, печ. с. 1","note":""}],"notes":[],"examples":[{"k":1,"text":"Kilɛ kpaarɛ nda harikpɛ","gloss":"Белый мел среди учебных принадлежностей.","gloss_type":"note","source":"AL64, PDF с. 11"},{"k":2,"text":"buru kparɛ fɔ","gloss":"Белое облако.","gloss_type":"note","source":"NT95, PDF с. 175"},{"k":3,"text":"harri kware","gloss":"«Белая вода»: название первого паводка. Написание автора; не приравнивается автоматически к kpaarɛ. § 2, печ. с. 1.","gloss_type":"note","source":"SM19, § 2, печ. с. 1"},{"k":4,"text":"Kirɛ kpaarɛ nda kirɛ","gloss":"Белый мел в перечне материалов для занятия.","gloss_type":"note","source":"AL64, PDF с. 12"},{"k":5,"text":"bɛrɛ ikpaarɛ wala","gloss":"… ни одного волоса сделать белым или черным.","gloss_type":"rst","source":"NT18, Мф 5:36; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":175,"count":5,"few":false,"meaning":"Формы с i- сохраняют грамматическое оформление источника; kpaarɛ — форма без него. Отдельно приведено выражение из этнографической статьи SM19 в авторском написании; оно не считается установленной самостоятельной словарной формой.","index_extra":"H, §E №136, с. 39. Исходная запись требует орфографической сверки."},{"n":2,"title":"Близкий","letter":"Б","forms":[{"form":"maani","sources":"NT18, Мф 3:2; AL64, PDF с. 14; AL65, PDF с. 60","note":""},{"form":"màani","sources":"AL65, PDF с. 11","note":"Ближайший медицинский пункт."},{"form":"mààni","sources":"AL65, PDF с. 93","note":""}],"notes":[],"examples":[{"k":1,"text":"à ma maani nda bɔrɔ","gloss":"Обращение/контакт с людьми при подготовке занятия; не только пространственная близость.","gloss_type":"note","source":"AL64, PDF с. 14"},{"k":2,"text":"mà cin mààni lokotoro jɛrɛ","gloss":"Приближаться/обращаться к врачу.","gloss_type":"note","source":"AL65, PDF с. 93"},{"k":3,"text":"Saaka jingaruyo maani, à go","gloss":"Приближение праздника во времени.","gloss_type":"note","source":"AL65, PDF с. 60"},{"k":4,"text":"kpetɛrɛ maani","gloss":"и говорит: покайтесь, ибо приблизилось Царство Небесное.","gloss_type":"rst","source":"NT18, Мф 3:2; русский текст: RST, тот же стих"},{"k":5,"text":"ǹ maani Ikpɛ","gloss":"… мир вам, дальним и близким,","gloss_type":"rst","source":"NT18, Еф 2:17; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":197,"count":5,"few":false,"meaning":"maani — приблизиться/быть близко.","index_extra":"H, §E №156, с. 40. Исходная запись требует орфографической сверки."},{"n":3,"title":"Большой","letter":"Б","forms":[{"form":"beeri","sources":"NT95, PDF с. 171; NT18, Мф 28:12; AL65, PDF с. 25; CFA, PDF с. 5; COV, PDF с. 2; AL65, PDF с. 112","note":"В сочетании taabi beeri «большие трудности»."},{"form":"bambata","sources":"NT18, Мф 12:40","note":""},{"form":"bèèri","sources":"AL64, PDF с. 3","note":""},{"form":"bèeri","sources":"AL65, PDF с. 108","note":""}],"notes":[],"examples":[{"k":1,"text":"nda beiyom bèèri cibayom ga","gloss":"Контекст: предисловие и назначение руководства. Употребление формы «bèèri» при значении «большой»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL64, PDF с. 3"},{"k":2,"text":"Banki beeri","gloss":"Слово «большой/великий» в названии Всемирного банка; это институциональное наименование. Печатная с. 3.","gloss_type":"note","source":"CFA, PDF с. 5"},{"k":3,"text":"maragu kumbayom bèeri nà fasara","gloss":"Контекст: права женщин и насилие. Употребление формы «bèeri» при значении «большой»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 108"},{"k":4,"text":"Anduniya maraga beeri ka à","gloss":"Контекст: сведения об инфекции и её симптомах. Употребление формы «beeri» при значении «большой»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"COV, PDF с. 2"},{"k":5,"text":"simba hɛika beeri cirici nda","gloss":"Контекст: история африканских государств. Употребление формы «beeri» при значении «большой»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 112"},{"k":6,"text":"nooru beeri no","gloss":"И сии, собравшись со старейшинами и сделав совещание, довольно денег дали воинам,","gloss_type":"rst","source":"NT18, Мф 28:12; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":27,"count":6,"few":false,"index_extra":"H, §E №143, с. 39. Исходная запись требует орфографической сверки."},{"n":4,"title":"Бороться","letter":"Б","forms":[{"form":"guruje","sources":"NT18, Еф 6:12","note":""}],"notes":[],"examples":[{"k":1,"text":"si guruje nda","gloss":"потому что наша брань не против крови и плоти, но против начальств, против властей, против мироправителей тьмы века сего, против духов злобы поднебесных.","gloss_type":"rst","source":"NT18, Еф 6:12; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":111,"count":1,"few":true,"meaning":"guruje — бороться/вести борьбу; контекст переносный."},{"n":5,"title":"Бояться","letter":"Б","forms":[{"form":"hamburu","sources":"NT95, PDF с. 104; NT18, Мф 28:5; AL65, PDF с. 76","note":""}],"notes":[],"examples":[{"k":1,"text":"binɛsari, dòori, hamburu, binɛtɔɔyom, sariya","gloss":"Страх в перечне чувств, которые выражаются пунктуацией; существительное, не глагол.","gloss_type":"note","source":"AL65, PDF с. 76"},{"k":2,"text":"si hamburu, zama","gloss":"Ангел же, обратив речь к женщинам, сказал: не бойтесь, ибо знаю, что вы ищете Иисуса распятого;","gloss_type":"rst","source":"NT18, Мф 28:5; русский текст: RST, тот же стих"},{"k":3,"text":"kamyom, hamburu hɛ","gloss":"Страшно впасть в руки Бога живого!","gloss_type":"rst","source":"NT18, Евр 10:31; русский текст: RST, тот же стих"},{"k":4,"text":"à hamburu ka","gloss":"… услышав это слово, больше убоялся.","gloss_type":"rst","source":"NT18, Ин 19:8; русский текст: RST, тот же стих"},{"k":5,"text":"go hamburu Ikpɛ","gloss":"… в роды родов к боящимся Его;","gloss_type":"rst","source":"NT18, Лк 1:50; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":106,"count":5,"few":false},{"n":6,"title":"Бросать","letter":"Б","forms":[{"form":"cetu","sources":"NT95, PDF с. 71; NT18, Мк 7:27","note":""},{"form":"furu","sources":"NT18, Мф 17:27","note":""}],"notes":[],"examples":[{"k":1,"text":"ka cetu hansi-ize","gloss":"… хлеб у детей и бросить псам.","gloss_type":"rst","source":"NT18, Мк 7:27; русский текст: RST, тот же стих"},{"k":2,"text":"fasa furu. Ciifi","gloss":"… их, пойди на море, брось уду, и первую рыбу, которая попадется, возьми, и, …","gloss_type":"rst","source":"NT18, Мф 17:27; русский текст: RST, тот же стих"},{"k":3,"text":"ka furu","gloss":"… третий мы своими руками побросали с корабля вещи.","gloss_type":"rst","source":"NT18, Деян 27:19; русский текст: RST, тот же стих"},{"k":4,"text":"à cetu daari","gloss":"Вот, Я повергаю ее на одр и любодействующих с нею в …","gloss_type":"rst","source":"NT18, Откр 2:22; русский текст: RST, тот же стих"},{"k":5,"text":"ko cetu nini","gloss":"… доброго плода, срубают и бросают в огонь.","gloss_type":"rst","source":"NT18, Лк 3:9; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":136,"count":5,"few":false,"index_extra":"H, §E №193, с. 43. Исходная запись требует орфографической сверки."},{"n":7,"title":"В","letter":"В","forms":[{"form":"kuna","sources":"NT95, PDF с. 62; NT18, Мф 3:1; AL65, PDF с. 7; AL64, PDF с. 3; CAL, PDF с. 22; AL65, PDF с. 100; COV, PDF с. 4; AL64, PDF с. 5","note":"Постпозиция; соответствие зависит от конструкции."}],"notes":[],"examples":[{"k":1,"text":"zaamaani hunayom kuna hinsayom. Beiyom","g риала. Употребление формы «mɛtɛ» при значении «как»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL64, PDF с. 19"},{"k":2,"text":"go bei mɛtɛ à ba","gloss":"Контекст: расчёт расходов на товар. Употребление формы «mɛtɛ» при значении «как»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 101"},{"k":3,"text":"Mɛtɛ noo nà","gloss":"Контекст: вопросы к учащимся. Употребление формы «Mɛtɛ» при значении «как»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL64, PDF с. 20"},{"k":4,"text":"Kookari 1.Cii mɛtɛ ka n","gloss":"Контекст: ориентирование и положение солнца. Употребление формы «mɛtɛ» при значении «как»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 73"},{"k":5,"text":"Cìi zanga mɛtɛ nɔ̀ tuuriyo","gloss":"Контекст: вопросы о круговороте воды и деревьях. Употребление формы «mɛtɛ» при значении «как»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 53"},{"k":6,"text":"kuna: ‹Mɛtɛ a","gloss":"Тогда управитель сказал сам в себе: «что мне делать? господин мой отнимает у меня управление домом; копать не могу, просить стыжусь;","gloss_type":"rst","source":"NT18, Лк 16:3; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":15,"count":6,"few":false},{"n":65,"title":"Камень","letter":"К","forms":[{"form":"tondi","sources":"NT95, PDF с. 176; NT18, Мф 3:9","note":""}],"notes":[],"examples":[{"k":1,"text":"ka tondi yom","gloss":"… что Бог может из камней сих воздвигнуть детей Аврааму.","gloss_type":"rst","source":"NT18, Мф 3:9; русский текст: RST, тот же стих"},{"k":2,"text":"ka tondi yom","gloss":"Тут опять Иудеи схватили каменья, чтобы побить Его.","gloss_type":"rst","source":"NT18, Ин 10:31; русский текст: RST, тот же стих"},{"k":3,"text":"Tondi di","gloss":"И, взглянув, видят, что камень отвален; а он был весьма велик.","gloss_type":"rst" ource":"NT18, Флп 2:10; русский текст: RST, тот же стих"},{"k":2,"text":"wom cɛnjɛ hinabunu","gloss":"… опустившиеся руки и ослабевшие колени","gloss_type":"rst","source":"NT18, Евр 12:12; русский текст: RST, тот же стих"},{"k":3,"text":"huna. Cɛnjɛ kulu","gloss":"… предо Мною преклонится всякое колено, и всякий язык будет исповедовать Бога».","gloss_type":"rst","source":"NT18, Рим 14:11; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":82,"count":3,"few":true,"meaning":"cɛnjɛ в Флп 2:10 — колено; в иных контекстах слово может иметь другие значения. cɛntɛ из AL65 не добавлено как «колено»: в NT18 эта форма обозначает место, где носят пояс/перевязь (Ин 13:4), а не то же значение, что cɛnjɛ.","index_extra":"AZ, №47. Исходная запись требует орфографической сверки."},{"n":69,"title":"Колоть; протыкать","letter":"К","forms":[{"form":"gooru","sources":"NT18, Евр 4:12","note":""}],"notes":[],"examples":[{"k":1,"text":"bɔrɔ gooru ka","gloss":"… и острее всякого меча обоюдоострого: оно проникает до разделения души и духа, составов …","gloss_type":"rst","source":"NT18, Евр 4:12; русский текст: RST, тот же стих"},{"k":2,"text":"cɛrɔ gooru nda","gloss":"… один из воинов копьем пронзил Ему ребра, и тотчас истекла кровь и вода.","gloss_type":"rst","source":"NT18, Ин 19:34; русский текст: RST, тот же стих"},{"k":3,"text":"à gooru. Ganda","gloss":"… око и те, которые пронзили Его; и возрыдают пред Ним все племена земные. …","gloss_type":"rst","source":"NT18, Откр 1:7; русский текст: RST, тот же стих"},{"k":4,"text":"ǹ gooru","gloss":"… «воззрят на Того, Которого пронзили».","gloss_type":"rst","source":"NT18, Ин 19:37; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":116,"count":4,"few":true,"meaning":"gooru — пронзить/проникнуть; переносный контекст."},{"n":70,"title":"Копать","letter":"К","forms":[{"form":"farimi","sources":"NT18, Лк 16:3","note":""}],"notes":[],"examples":[{"k":1,"text":"hini farimi mo","gloss":"… у меня управление домом; копать не могу, проси ","source":"AL65, PDF с. 87"},{"k":4,"text":"nɔɔni cɛɛnɛ fɔ́","gloss":"Маленький/мельчайший, о возбудителе болезни; отличать от cɛna NT.","gloss_type":"note","source":"AL65, PDF с. 9"},{"k":5,"text":"ya cɛna ka","gloss":"которое, хотя меньше всех семян, но, когда вырастет, бывает больше всех …","gloss_type":"rst","source":"NT18, Мф 13:32; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":32,"count":5,"few":false,"index_extra":"H, §E №144, с. 39. Исходная запись требует орфографической сверки."},{"n":89,"title":"Мало","letter":"М","forms":[{"form":"fɔ-fɔ","sources":"NT18, Мф 7:14","note":""},{"form":"fɔ́-fɔ́","sources":"AL64, PDF с. 21","note":""}],"notes":[],"examples":[{"k":1,"text":"ŋwɛnɛ bɔrɔ fɔ́-fɔ́ kokariyo tɛɛyom","gloss":"Небольшое число участников: выражение bɔrɔ fɔ́-fɔ́ в описании групповой работы.","gloss_type":"note","source":"AL64, PDF с. 21"},{"k":2,"text":"Bɔrɔ fɔ-fɔ ya","gloss":"… ведущие в жизнь, и немногие находят их.","gloss_type":"rst","source":"NT18, Мф 7:14; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":20,"count":2,"few":true,"meaning":"fɔ-fɔ — контекстное «немногие/некоторые», не универсальный эквивалент «мало».","index_extra":"H, §E №210, с. 44. Исходная запись требует орфографической сверки."},{"n":90,"title":"Мать","letter":"М","forms":[{"form":"nya","sources":"NT95, PDF с. 12; NT18, Мф 1:18","note":""},{"form":"nyaa","sources":"AL65, PDF с. 95; AL65, PDF с. 57; AL65, PDF с. 56","note":"В тексте о кормящей матери; различается длина гласного с nya из NT."}],"notes":[],"examples":[{"k":1,"text":"himaa kaà nyaa fafa fɔ́rɔnku","gloss":"Контекст: кормление грудью. Употребление формы «nyaa» при значении «мать»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 95"},{"k":2,"text":"baabɛ nda nyaa binni","gloss":"Мать в грамматическом разборе семейной фразы.","gloss_type":"note","source":"AL65, PDF с. 57"},{"k":3,"text":"nɔ̀ baabɛ, nyaa nda koo","gloss":"Мать среди членов семьи: нного письменного эквивалента и примеров пока нет. Это не означает, что в языке отсутствует такое слово.","index_sci":"T68/72, печ. с. 57 (PDF с. 32) и с. 85 (PDF с. 46): словарные записи «mouillé». Наличие понятия подтверждено, практическое написание не установлено."},{"n":93,"title":"Море","letter":"М","forms":[{"form":"tɛku","sources":"NT95, PDF с. 153","note":""},{"form":"tɛɛku","sources":"NT18, Мф 12:40","note":""},{"form":"buula","sources":"NT18, Мф 18:6","note":""},{"form":"tenku","sources":"AL65, PDF с. 52; AL65, PDF с. 72","note":"Море в перечислении водоёмов, участвующих в круговороте воды."}],"notes":[],"examples":[{"k":1,"text":"ga, zuguzugukuna, tenku bom au","gloss":"Контекст: ориентирование по солнцу и сторонам света. Употребление формы «tenku» при значении «море»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 72"},{"k":2,"text":"zanga tɛku mee","gloss":"Море.","gloss_type":"note","source":"NT95, PDF с. 153"},{"k":3,"text":"cin isayo, tenku nda cinni","gloss":"Контекст: круговорот воды. Употребление формы «tenku» при значении «море»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 52"},{"k":4,"text":"hinza tɛɛku ciifi","gloss":"ибо как Иона был во чреве кита три дня и три ночи, так и Сын Человеческий будет в сердце земли три дня и три ночи.","gloss_type":"rst","source":"NT18, Мф 12:40; русский текст: RST, тот же стих"},{"k":5,"text":"cetu buula nungu","gloss":"А кто соблазнит одного из малых сих, верующих в Меня, тому лучше было бы, если бы повесили ему мельничный жернов на шею и потопили его во глубине морской.","gloss_type":"rst","source":"NT18, Мф 18:6; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":154,"count":5,"few":false,"meaning":"tɛɛku и buula — употреблены о море; buula также об озере."},{"n":94,"title":"Муж","letter":"М","forms":[{"form":"kunye","sources":"NT95, PDF с. 62; NT18, Мф 1:16","note":""},{"form":"sɔgɔ","sources":"NT18, Мф 1:19","note":""}],"notes":[],"examples":[{"k":1,"text":"Mariyama kunye Yosɛfu","gloss":"Иаков родил Иосифа, мужа Марии, от Которой родился Иисус, называемый Христос.","gloss_type":"rst","source":"NT18, Мф 1:16; русский текст: RST, тот же стих"},{"k":2,"text":"à sɔgɔ Yosɛfu","gloss":"Иосиф же, муж Ее, будучи праведен и не желая огласить Ее, …","gloss_type":"rst","source":"NT18, Мф 1:19; русский текст: RST, тот же стих"},{"k":3,"text":"wom kunye yom","gloss":"Жены, повинуйтесь своим мужьям, как Господу,","gloss_type":"rst","source":"NT18, Еф 5:22; русский текст: RST, тот же стих"},{"k":4,"text":"mo kunye yom","gloss":"Мужья, любите своих жен и не будьте к ним …","gloss_type":"rst","source":"NT18, Кол 3:19; русский текст: RST, тот же стих"},{"k":5,"text":"ngei kunye yom","gloss":"чтобы вразумляли молодых любить мужей, любить детей,","gloss_type":"rst","source":"NT18, Тит 2:4; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":41,"count":5,"few":false,"meaning":"sɔgɔ в Мф 1:19 — будущий супруг; вместе с kunye не считать свободными синонимами.","index_extra":"H, §E №4, с. 30. Исходная запись требует орфографической сверки."},{"n":95,"title":"Мужчина","letter":"М","forms":[{"form":"haibɔrɔ","sources":"NT95, PDF с. 112","note":""},{"form":"harubɔrɔ","sources":"NT18, Мф 1:21; AL65, PDF с. 21; AL64, PDF с. 3; AL65, PDF с. 79","note":""}],"notes":[],"examples":[{"k":1,"text":"faara ganna, harubɔrɔ maa barani","gloss":"Мужское наименование в пояснении, почему в руководстве используется один грамматический род.","gloss_type":"note","source":"AL64, PDF с. 3"},{"k":2,"text":"ci haibɔrɔ kulu","gloss":"Мужчина.","gloss_type":"note","source":"NT95, PDF с. 112"},{"k":3,"text":"se de harubɔrɔ ka à","gloss":"Контекст: брак и возраст. Употребление формы «harubɔrɔ» при значении «мужчина»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 79"},{"k":4,"text":"de weibɔrɔ, harubɔrɔ nda nn","gloss":"Контекст: право детей на обуче ":2,"text":"tuuri kɔgɔ yom","gloss":"Сухое дерево.","gloss_type":"note","source":"NT95, PDF с. 57"},{"k":3,"text":"kambɛ kɔɔgɔ fɔ","gloss":"Когда же Павел набрал множество хвороста и клал на огонь, тогда ехидна, выйдя от жара, повисла на руке его.","gloss_type":"rst","source":"NT18, Деян 28:3; русский текст: RST, тот же стих"},{"k":4,"text":"di kɔɔgu","gloss":"… вовек. И смоковница тотчас засохла.","gloss_type":"rst","source":"NT18, Мф 21:19; русский текст: RST, тот же стих"},{"k":5,"text":"ǹ kɔɔgu zama","gloss":"… на камень и, взойдя, засохло, потому что не имело влаги;","gloss_type":"rst","source":"NT18, Лк 8:6; русский текст: RST, тот же стих"}],"suppl":false,"swadesh":195,"count":5,"few":false,"meaning":"kɔɔgɔ — сухой; kɔɔgu — высохнуть. Варианты NT95 сохранены отдельно. kɔɔgɔ в учебнике встречается внутри названия кашля; это контекстный пример признака сухости.","index_extra":"H, §E №140, с. 39. Исходная запись требует орфографической сверки."},{"n":169,"title":"Считать","letter":"С","forms":[{"form":"kabu","sources":"NT95, PDF с. 76; NT18, Мф 10:30; AL65, PDF с. 31; AL65, PDF с. 100; AL65, PDF с. 101; AL65, PDF с. 103","note":"Считать числа."}],"notes":[],"examples":[{"k":1,"text":"deiyom nɔɔru kabu","gloss":"Контекст: торговая задача о стоимости покупки. Употребление формы «kabu» при значении «считать»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 100"},{"k":2,"text":"hunuyom nɔɔru kabu. 2. Kwááráku","gloss":"Контекст: расчёт расходов на товар. Употребление формы «kabu» при значении «считать»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 101"},{"k":3,"text":"sambayom ŋwɛnɛ. Kabu : a-","gloss":"Контекст: транспортные расходы и ремонт велосипеда. Употребление формы «Kabu» при значении «считать»; русский текст — пояснение, не дословный перевод фразы.","gloss_type":"note","source":"AL65, PDF с. 103"},{"k":4,"text":"kulu kabu no","gloss":"у вас же и волосы н
