T95 — мясо. Значения не полностью совпадают.","sci":"H, §E №87, с. 36. Практическая орфография и контекст требуют сверки."},{"n":141,"title":"Назарет","letter":"Н","variants":[{"label":"","form":"Nazarɛtu","notes":["Название населённого пункта."],"full":2,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."},{"k":2,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."}],"refs":[{"t":"NT18, Ин 1:46","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Лк 2:39","u":"https://zeno.fm/bible/DDNBIV/LUK/2/"},{"t":"NT18, Мф 21:11","u":"https://zeno.fm/bible/DDNBIV/MAT/21/"},{"t":"NT18, Мк 14:67","u":"https://zeno.fm/bible/DDNBIV/MRK/14/"},{"t":"NT18, Ин 18:7","u":"https://zeno.fm/bible/DDNBIV/JHN/18/"},{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Имя собственное. В сочетании с bɔrɔ может указывать на происхождение человека; не превращать имя места в отдельный глагол."},{"n":142,"title":"Наполняться","letter":"Н","variants":[{"label":"","form":"tɔ","notes":["Исполниться в религиозном контексте с nda Biya Halaala. Другие значения и переходность не обобщены по одному примеру."],"full":1,"status":"","examples":[{"k":1,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":143,"title":"Находиться; быть в наличии","letter":"Н","variants":[{"label":"","form":"goono","notes":["Предикативное / глагольное употребление."],"full":null,"status":"","examples":[{"k":1,"pid":"П12","head":"NT18, JHN 1:38","rst":true,"dendi":"Coobaaba, mani n goono nda gɔrɛ?","source":"NT18, JHN 1:38","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Равви́ (что значит: «учитель»), где живешь?","lit":"Учитель, где ты проживаешь?","parse":"Coobaaba — учитель; mani — где?; n — ты; goono — пребывать; nda — элемент глагольного сочетания; gɔrɛ — проживать.","note":"Goоno nda gɔrɛ разбирается как сочетание; nda не переводится механически русским «с». Синодальное «Равви» входит в опубликованный параллельный текст."},{"k":2,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."},{"k":3,"pid":"П34","head":"NT95, Еф 4:5, PDF с. 127","rst":true,"dendi":"Kpe fɔlɔnku ya goono nda naane fɔlɔnku nda mirandiyom fɔlɔnku.","source":"NT95, Еф 4:5, PDF с. 127","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127","pub":"один Господь, одна вера, одно крещение,","lit":"Есть один Господь, одна вера и одно крещение.","parse":"Kpe — Господь; fɔlɔnku — один; единственный в данном перечислении; ya — выделительный элемент; goono — быть в наличии; nda — и; связь перечисления; naane — вера; mirandiyom — крещение; производная форма в религиозном контексте.","note":"Naane здесь существительное, как показывают параллельные именные группы. Mirandiyom не переведено как обычное мытьё. Fɔlɔnku не заменено редактором на fɔ."},{"k":4,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":5,"pid":"П40","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ kuna, jibiri 7 ya goono.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одной неделе имеются семь дней.","parse":"Azuma — неделя; fɔ́ — один; kuna — внутри; в; jibiri — день в календарной строке; 7 — семь; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Jibiri сохранено как в пособии; не исправлено автоматически на jiribi из иных текстов. Другие варианты статьи «День» не объявлены взаимозаменяемыми во всех сочетаниях."},{"k":6,"pid":"П42","head":"CAL, PDF с. 22","rst":false,"dendi":"Sooro fo ga, tuurinya 55 ya goono.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном ряду имеются 55 деревянных элементов.","parse":"Sooro — ряд; fo — один; написание CAL; ga — в; пространственный элемент; tuurinya — деревянный элемент в строительной задаче; 55 — пятьдесят пять; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Печатная с. 41: задача о древесине для строительства. Здесь речь о строительных элементах, поэтому перевод «55 растущих деревьев» не используется. Форма tuurinya совпадает графически с вариантами растительного термина; значение устанавливается контекстом."}],"refs":[{"t":"NT18, Ин 1:2","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Рим 1:6","u":"https://zeno.fm/bible/DDNBIV/ROM/1/"},{"t":"NT18, Ин 10:42","u":"https://zeno.fm/bible/DDNBIV/JHN/10/"},{"t":"NT18, 1 Кор 16:23","u":"https://zeno.fm/bible/DDNBIV/1CO/16/"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"},{"t":"NT95, Еф 4:5, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Значение присутствия, пребывания или наличия устанавливается по окружению. Не объявляется простой полной формой go: это соотношение требует отдельного грамматического описания."},{"n":144,"title":"Начинать","letter":"Н","variants":[{"label":"","form":"sinti","notes":["Начать говорить: sinti ko sendi."],"full":1,"status":"","examples":[{"k":1,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":145,"title":"Не","letter":"Н","variants":[{"label":"I","form":"si","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 29","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=29"},{"t":"NT18, Мф 3:9","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL64, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=22"}]},{"label":"II","form":"mana","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 21:19","u":"https://zeno.fm/bible/DDNBIV/MAT/21/"},{"t":"AL64, PDF с. 10","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=10"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"}]},{"label":"III","form":"síi","notes":["Отрицательная форма; отличается от si/mana по конструкции."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 21","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=21"},{"t":"AL65, PDF с. 108","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=108"},{"t":"AL65, PDF с. 111","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=111"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":16,"meaning":"si и mana имеют разные грамматические функции; не свободные синонимы."},{"n":146,"title":"Не иметь; быть без","letter":"Н","variants":[{"label":"","form":"sinda","notes":["Отрицательный предикат обладания."],"full":1,"status":"","examples":[{"k":1,"pid":"П2","head":"NT18, 1CO 7:27","rst":true,"dendi":"N sinda wɛndɛ ba?","source":"NT18, 1CO 7:27","source_url":"https://zeno.fm/bible/DDNBIV/1CO/7/","pub":"Остался ли без жены?","lit":"Ты не имеешь жены?","parse":"N — ты; sinda — не иметь; wɛndɛ — жена; ba — вопросительная частица."}],"refs":[{"t":"NT18, 1 Кор 7:27","u":"https://zeno.fm/bible/DDNBIV/1CO/7/"},{"t":"NT18, 1 Кор 9:6","u":"https://zeno.fm/bible/DDNBIV/1CO/9/"},{"t":"NT18, Ин 4:44","u":"https://zeno.fm/bible/DDNBIV/JHN/4/"},{"t":"NT18, Мф 15:16","u":"https://zeno.fm/bible/DDNBIV/MAT/15/"},{"t":"NT18, 2 Кор 9:15","u":"https://zeno.fm/bible/DDNBIV/2CO/9/"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Не сводить к частице si. Может обозначать отсутствие предмета, права, почёта или качества."},{"n":147,"title":"Небо","letter":"Н","variants":[{"label":"","form":"bɛɛnɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 6","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=6"},{"t":"NT18, Мф 3:16","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Мк 13:31","u":"https://zeno.fm/bible/DDNBIV/MRK/13/"},{"t":"NT18, Откр 12:8","u":"https://zeno.fm/bible/DDNBIV/REV/12/"},{"t":"NT18, Еф 2:6","u":"https://zeno.fm/bible/DDNBIV/EPH/2/"},{"t":"NT18, Ин 6:50","u":"https://zeno.fm/bible/DDNBIV/JHN/6/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":162,"sci":"H, §E №115, с. 37. Практическая орфография и контекст требуют сверки."},{"n":148,"title":"Невисокосный (в названии года)","letter":"Н","variants":[{"label":"","form":"kubantɛ","notes":["Засвидетельствовано в jiiri kubantɛ — невисокосный год. За пределами этого сочетания значение «обычный» не обобщено."],"full":1,"status":"","examples":[{"k":1,"pid":"П47","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri kubantɛ gonda jibiri 365.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Невисокосный год имеет 365 дней.","parse":"Jiiri — год; kubantɛ — невисокосный; значение в сочетании jiiri kubantɛ; gonda — иметь; jibiri — день; 365 — триста шестьдесят пять; цифровая запись источника.","note":"Предложение входит в противопоставление обычного и високосного года. Kubantɛ не объявляется универсальным переводом прилагательного «обычный» вне календарного сочетания. Цифра сохранена; дендийское словесное название числа не восстановлено по догадке."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":149,"title":"Неделя","letter":"Н","variants":[{"label":"","form":"azuma","notes":["Azuma обозначает неделю в календарных строках П38–П40; внутри перечня дней в П48 то же написание обозначает пятницу. См. также статью «Пятница»."],"full":4,"status":"","examples":[{"k":1,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":2,"pid":"П39","head":"AL65, PDF с. 70","rst":false,"dendi":"Handu fɔ́ gonda azuma 4.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Один месяц имеет четыре недели.","parse":"Handu — месяц; fɔ́ — один; gonda — иметь; azuma — неделя; 4 — четыре; цифровая запись.","note":"Это приближённая учебная схема, а не утверждение, что каждый календарный месяц длится ровно четыре недели. Цифра не заменяется неподтверждённым дендийским названием числа."},{"k":3,"pid":"П40","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ kuna, jibiri 7 ya goono.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одной неделе имеются семь дней.","parse":"Azuma — неделя; fɔ́ — один; kuna — внутри; в; jibiri — день в календарной строке; 7 — семь; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Jibiri сохранено как в пособии; не исправлено автоматически на jiribi из иных текстов. Другие варианты статьи «День» не объявлены взаимозаменяемыми во всех сочетаниях."},{"k":4,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":150,"title":"Некоторые","letter":"Н","variants":[{"label":"","form":"afɔ yom","notes":["Сочетание, не простая лексема."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 22","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=22"},{"t":"NT18, Мф 13:8","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, 1 Тим 5:15","u":"https://zeno.fm/bible/DDNBIV/1TI/5/"},{"t":"NT18, Деян 2:13","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Рим 11:14","u":"https://zeno.fm/bible/DDNBIV/ROM/11/"},{"t":"NT18, Евр 11:35","u":"https://zeno.fm/bible/DDNBIV/HEB/11/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":19,"meaning":"afɔ yom — сочетание с показателем множественного числа."},{"n":151,"title":"Нет: слово ответа","letter":"Н","variants":[{"label":"","form":"Awo","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке.","Полная вопросно-ответная пара приведена в банке; ответная форма не вырвана из контекста. Эти положительные вопросы не доказывают правила реакции на отрицательный вопрос."],"full":1,"status":"","examples":[{"k":1,"pid":"П44","head":"NT95, Ин 1:21, PDF с. 60","rst":true,"dendi":"Ǹ cii: Ni no andebi di? À tu ka cii. Awo.","source":"NT95, Ин 1:21, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"Пророк? Он отвечал: нет.","lit":"Они сказали: ты — тот пророк? Он ответил: нет.","parse":"Ǹ — они; cii — сказать; Ni — ты; no — предикативный элемент; andebi — пророк; di — определительный элемент; À — он; tu — ответить; ka — связь действий; Awo — нет.","note":"Вопрос без ba и dee; ответ Awo приведён вместе с вопросом. Перед Awo в издании напечатана точка после cii; она сохранена, хотя русский перевод оформляет ответ двоеточием. Cii во второй части также означает «сказать». Полный русский стих включает предшествующий вопрос об Илии; здесь приведена соответствующая часть."}],"refs":[{"t":"NT18, Ин 1:21","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT95, Ин 1:21, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"}]}],"extra_refs":[{"t":"NT18, 1 Кор 10:19","u":"https://zeno.fm/bible/DDNBIV/1CO/10/"},{"t":"NT18, 1 Кор 6:15","u":"https://zeno.fm/bible/DDNBIV/1CO/6/"},{"t":"NT18, Деян 16:37","u":"https://zeno.fm/bible/DDNBIV/ACT/16/"},{"t":"NT18, Гал 3:21","u":"https://zeno.fm/bible/DDNBIV/GAL/3/"}],"stray":[],"kind":"extra","meaning":"Отрицательное слово ответа; не заменяет отрицательные показатели внутри сказуемого."},{"n":152,"title":"Но","letter":"Н","variants":[{"label":"","form":"Amma","notes":["Противительный связующий элемент."],"full":1,"status":"","examples":[{"k":1,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."}],"refs":[{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":153,"title":"Новый","letter":"Н","variants":[{"label":"","form":"teji","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"},{"t":"NT18, Мф 9:16","u":"https://zeno.fm/bible/DDNBIV/MAT/9/"},{"t":"NT18, Мк 14:24","u":"https://zeno.fm/bible/DDNBIV/MRK/14/"},{"t":"NT18, 2 Кор 5:17","u":"https://zeno.fm/bible/DDNBIV/2CO/5/"},{"t":"NT18, Лк 5:38","u":"https://zeno.fm/bible/DDNBIV/LUK/5/"},{"t":"NT18, Евр 8:13","u":"https://zeno.fm/bible/DDNBIV/HEB/8/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":183,"sci":"AT, №96. Практическая орфография и контекст требуют сверки."},{"n":154,"title":"Нога","letter":"Н","variants":[{"label":"","form":"cee","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":2,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."}],"refs":[{"t":"NT18, Ин 19:32","u":"https://zeno.fm/bible/DDNBIV/JHN/19/"},{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"NT18, Рим 3:15","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, Деян 2:35","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":81,"meaning":"cee — та же форма в контексте переламывания ног.","sci":"H, §E №103, с. 37. Практическая орфография и контекст требуют сверки."},{"n":155,"title":"Ноготь","letter":"Н","variants":[],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":79,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию.","sci":"AZ, №45. Практическая орфография и контекст требуют сверки."},{"n":156,"title":"Нос","letter":"Н","variants":[{"label":"I","form":"nune","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, 1 Кор 12:17","u":"https://zeno.fm/bible/DDNBIV/1CO/12/"}]},{"label":"II","form":"ninɛ","notes":["В перечне органов головы; написание отличается от nune NT."],"full":1,"status":"","examples":[{"k":1,"pid":"П46","head":"AL65, PDF с. 29","rst":false,"dendi":"Bom gonda hangayo, mɔɔize, ninɛ, mɛɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Голова имеет уши, глаза, нос, рот.","parse":"Bom — голова; gonda — иметь; hangayo — уши; форма источника с -yo; mɔɔize — глаза в данном перечислении органов головы; ninɛ — нос; mɛɛ — рот.","note":"Полное предложение из учебного описания тела. Число органов в русском переводе следует анатомическому перечислению; оно не приписывается единому суффиксу у всех дендийских слов. Здесь mɔɔize названо в ряду органов головы; специальное различие «глаз / зрачок» этим предложением отдельно не устанавливается."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]},{"label":"III","form":"nunɛ","notes":["Нос в рекомендациях не трогать лицо."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"}]},{"label":"IV","form":"nunɛ̀","notes":["Нос, с низким тоном на последней гласной."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=3"}]},{"label":"V","form":"nùnɛ","notes":["Нос, с низким тоном на u; запись «заложенный нос»."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":75,"meaning":"nune — орган обоняния в ряду частей тела; самостоятельное словарное определение требует сверки.","sci":"H, §E №96, с. 36. Практическая орфография и контекст требуют сверки."},{"n":157,"title":"Ночь","letter":"Н","variants":[{"label":"I","form":"ciini","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мф 28:13","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"},{"t":"NT18, Ин 13:30","u":"https://zeno.fm/bible/DDNBIV/JHN/13/"}]},{"label":"II","form":"wiciri","notes":["В перечислении времени суток; дополнительная сверка контекста."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 87","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=87"},{"t":"AL65, PDF с. 104","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104"},{"t":"AL65, PDF с. 94","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=94"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":177,"meaning":"wiciri в торговых задачах — вечернее время; не универсальный эквивалент «ночь».","sci":"H, §E №121, с. 38. Практическая орфография и контекст требуют сверки."},{"n":158,"title":"Нюхать; чувствовать запах","letter":"Н","variants":[{"label":"","form":"mani","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, 1 Кор 12:17","u":"https://zeno.fm/bible/DDNBIV/1CO/12/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":105,"meaning":"mani — воспринимать запах; отличать от одноимённого вопросительного слова «где».","sci":"H, §E №202, с. 44. Практическая орфография и контекст требуют сверки."},{"n":159,"title":"О; об (тема речи)","letter":"О","variants":[{"label":"","form":"bɔm","notes":["В Baaba bɔm — об Отце. Не переведено «голова»: одно написание имеет разные функции в зависимости от конструкции."],"full":1,"status":"","examples":[{"k":1,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."}],"refs":[{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":160,"title":"Облако","letter":"О","variants":[{"label":"I","form":"buru","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 175","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=175"},{"t":"NT18, Откр 14:14","u":"https://zeno.fm/bible/DDNBIV/REV/14/"},{"t":"NT18, Мк 13:26","u":"https://zeno.fm/bible/DDNBIV/MRK/13/"}]},{"label":"II","form":"cinijibomyo","notes":["Облака, накапливающие воду; форма с -yo, сложное наименование."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL65, PDF с. 53","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=53"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":160,"sci":"H, §E №130, с. 38. Практическая орфография и контекст требуют сверки."},{"n":161,"title":"Огонь","letter":"О","variants":[{"label":"","form":"nini","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 108","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=108"},{"t":"NT18, Мф 3:11","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Евр 12:29","u":"https://zeno.fm/bible/DDNBIV/HEB/12/"},{"t":"NT18, Откр 20:14","u":"https://zeno.fm/bible/DDNBIV/REV/20/"},{"t":"NT18, 1 Кор 3:15","u":"https://zeno.fm/bible/DDNBIV/1CO/3/"},{"t":"NT18, Деян 2:3","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":167,"sci":"H, §E №125, с. 38. Практическая орфография и контекст требуют сверки."},{"n":162,"title":"Один","letter":"О","variants":[{"label":"I","form":"fɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:3","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"}]},{"label":"II","form":"fɔ́","notes":["Тоновая запись; встречается в сочетаниях с числительным и показателем определения."],"full":4,"status":"","examples":[{"k":1,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":2,"pid":"П39","head":"AL65, PDF с. 70","rst":false,"dendi":"Handu fɔ́ gonda azuma 4.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Один месяц имеет четыре недели.","parse":"Handu — месяц; fɔ́ — один; gonda — иметь; azuma — неделя; 4 — четыре; цифровая запись.","note":"Это приближённая учебная схема, а не утверждение, что каждый календарный месяц длится ровно четыре недели. Цифра не заменяется неподтверждённым дендийским названием числа."},{"k":3,"pid":"П40","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ kuna, jibiri 7 ya goono.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одной неделе имеются семь дней.","parse":"Azuma — неделя; fɔ́ — один; kuna — внутри; в; jibiri — день в календарной строке; 7 — семь; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Jibiri сохранено как в пособии; не исправлено автоматически на jiribi из иных текстов. Другие варианты статьи «День» не объявлены взаимозаменяемыми во всех сочетаниях."},{"k":4,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 31","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=31"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=100"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]},{"label":"III","form":"fo","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П42","head":"CAL, PDF с. 22","rst":false,"dendi":"Sooro fo ga, tuurinya 55 ya goono.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном ряду имеются 55 деревянных элементов.","parse":"Sooro — ряд; fo — один; написание CAL; ga — в; пространственный элемент; tuurinya — деревянный элемент в строительной задаче; 55 — пятьдесят пять; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Печатная с. 41: задача о древесине для строительства. Здесь речь о строительных элементах, поэтому перевод «55 растущих деревьев» не используется. Форма tuurinya совпадает графически с вариантами растительного термина; значение устанавливается контекстом."}],"refs":[{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]},{"label":"IV","form":"fɔlɔnku","notes":["В религиозном перечислении: один/единый Господь, одна вера, одно крещение. Это не автоматическая замена fɔ во всех контекстах."],"full":1,"status":"","examples":[{"k":1,"pid":"П34","head":"NT95, Еф 4:5, PDF с. 127","rst":true,"dendi":"Kpe fɔlɔnku ya goono nda naane fɔlɔnku nda mirandiyom fɔlɔnku.","source":"NT95, Еф 4:5, PDF с. 127","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127","pub":"один Господь, одна вера, одно крещение,","lit":"Есть один Господь, одна вера и одно крещение.","parse":"Kpe — Господь; fɔlɔnku — один; единственный в данном перечислении; ya — выделительный элемент; goono — быть в наличии; nda — и; связь перечисления; naane — вера; mirandiyom — крещение; производная форма в религиозном контексте.","note":"Naane здесь существительное, как показывают параллельные именные группы. Mirandiyom не переведено как обычное мытьё. Fɔlɔnku не заменено редактором на fɔ."}],"refs":[{"t":"NT95, Еф 4:5, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":22,"sci":"H, §E №211, с. 44. Практическая орфография и контекст требуют сверки."},{"n":163,"title":"Озеро","letter":"О","variants":[{"label":"","form":"buula","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 8:22","u":"https://zeno.fm/bible/DDNBIV/LUK/8/"},{"t":"NT18, Откр 20:14","u":"https://zeno.fm/bible/DDNBIV/REV/20/"},{"t":"NT18, Лк 5:2","u":"https://zeno.fm/bible/DDNBIV/LUK/5/"},{"t":"NT18, Лк 5:1","u":"https://zeno.fm/bible/DDNBIV/LUK/5/"},{"t":"NT18, Лк 8:23","u":"https://zeno.fm/bible/DDNBIV/LUK/8/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":153,"meaning":"buula — озеро в Лк 8:22; в других местах море. Объём значения шире русского «озеро»."},{"n":164,"title":"Он","letter":"О","variants":[{"label":"I","form":"à","notes":["À в вводной части П50 относится к женщине и переводится «ей», далее — к обобщённому человеку. Русский мужской заголовок не означает, что дендийская форма обозначает только мужчин."],"full":null,"status":"","examples":[{"k":1,"pid":"П7","head":"NT95, JHN 4:29, PDF с. 62","rst":true,"dendi":"À mana ci Mɛsiya dee?","source":"NT95, JHN 4:29, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"не Он ли Христос?","lit":"Не является ли он Мессией?","parse":"À — он; mana — отрицательное предикативное употребление; ci — являться; Mɛsiya — Мессия; dee — вопросительная частица.","note":"Ожидание подтверждения возможно по контексту, но не объявляется значением dee во всех вопросах."},{"k":2,"pid":"П8","head":"NT95, MAT 12:23, PDF с. 12","rst":true,"dendi":"À na ci Dafidi ize di dee?","source":"NT95, MAT 12:23, PDF с. 12","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12","pub":"не это ли Христос, сын Давидов?","lit":"Не является ли он тем сыном Давида?","parse":"À — он; na — отрицательная функция в данном сочетании; не смешивать с показателем переходного действия; ci — являться; Dafidi — Давид; ize — сын / потомок; di — определительный элемент; dee — вопросительная частица.","note":"В опубликованном русском тексте добавлено именование «Христос»; в этой дендийской фразе слова Mɛsiya нет."},{"k":3,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":4,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."},{"k":5,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."},{"k":6,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":7,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":8,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."},{"k":9,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."},{"k":10,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT18, Мф 1:21","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"},{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=100"},{"t":"COV, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=3"},{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"},{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"},{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]},{"label":"II","form":"nga","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 1:21","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":3,"meaning":"à — краткая субъектная форма; nga — самостоятельная/эмфатическая; функции различаются."},{"n":165,"title":"Они","letter":"О","variants":[{"label":"I","form":"ngei","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":2,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT95, PDF с. 124","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=124"},{"t":"NT18, Мф 3:6","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, 1 Пет 4:5","u":"https://zeno.fm/bible/DDNBIV/1PE/4/"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]},{"label":"II","form":"ǹ, Ǹ","notes":[],"full":null,"status":"","examples":[{"k":1,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."},{"k":2,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."},{"k":3,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":4,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":5,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":6,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":7,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."}],"refs":[{"t":"NT18, Мф 3:6","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Рим 3:17","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, Деян 18:16","u":"https://zeno.fm/bible/DDNBIV/ACT/18/"},{"t":"NT18, Ин 16:31","u":"https://zeno.fm/bible/DDNBIV/JHN/16/"},{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"},{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":6,"meaning":"ǹ — краткая субъектная форма; ngei — самостоятельная форма."},{"n":166,"title":"Опухать","letter":"О","variants":[{"label":"","form":"funsu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 28:6","u":"https://zeno.fm/bible/DDNBIV/ACT/28/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":146,"meaning":"funsu — распухнуть; омограф формы в строке «дышать»."},{"n":167,"title":"Острый","letter":"О","variants":[{"label":"I","form":"me kaani","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Евр 4:12","u":"https://zeno.fm/bible/DDNBIV/HEB/4/"}]},{"label":"II","form":"mekaanɔ-kpɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Откр 14:14","u":"https://zeno.fm/bible/DDNBIV/REV/14/"},{"t":"NT18, Откр 14:17","u":"https://zeno.fm/bible/DDNBIV/REV/14/"},{"t":"NT18, Евр 11:34","u":"https://zeno.fm/bible/DDNBIV/HEB/11/"},{"t":"NT18, Откр 19:15","u":"https://zeno.fm/bible/DDNBIV/REV/19/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":191,"meaning":"me kaani — «острый край»; mekaanɔ-kpɛ — «с острым краем», о серпе.","sci":"H, §E №157, с. 40. Практическая орфография и контекст требуют сверки."},{"n":168,"title":"Отвечать; разрешать","letter":"О","variants":[{"label":"","form":"tu","notes":["Глагол; два контекстных значения."],"full":3,"status":"","examples":[{"k":1,"pid":"П3","head":"NT18, MRK 15:4","rst":true,"dendi":"N si tu ba?","source":"NT18, MRK 15:4","source_url":"https://zeno.fm/bible/DDNBIV/MRK/15/","pub":"Ты ничего не отвечаешь?","lit":"Ты не отвечаешь?","parse":"N — ты; si — отрицание; tu — отвечать; ba — вопросительная частица."},{"k":2,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."},{"k":3,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT18, Мк 15:4","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"},{"t":"NT18, Ин 20:28","u":"https://zeno.fm/bible/DDNBIV/JHN/20/"},{"t":"NT18, Лк 19:34","u":"https://zeno.fm/bible/DDNBIV/LUK/19/"},{"t":"NT18, Ин 16:31","u":"https://zeno.fm/bible/DDNBIV/JHN/16/"},{"t":"NT18, Евр 6:3","u":"https://zeno.fm/bible/DDNBIV/HEB/6/"},{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"При ответе на вопрос — «отвечать»; при предоставлении возможности — «разрешать». Эти значения различаются по контексту."},{"n":169,"title":"Отец","letter":"О","variants":[{"label":"I","form":"baaba, Baaba","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."}],"refs":[{"t":"NT95, PDF с. 29","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=29"},{"t":"NT18, Мф 3:9","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Ин 8:27","u":"https://zeno.fm/bible/DDNBIV/JHN/8/"},{"t":"NT18, Мк 10:7","u":"https://zeno.fm/bible/DDNBIV/MRK/10/"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"}]},{"label":"II","form":"baabɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 56","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56"},{"t":"AL65, PDF с. 57","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=57"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":43,"sci":"H, §E №6, с. 30. Практическая орфография и контекст требуют сверки."},{"n":170,"title":"Отрицание перед глаголом: si","letter":"О","variants":[{"label":"I","form":"si","notes":["Отрицательный показатель; также предикативные употребления."],"full":2,"status":"","examples":[{"k":1,"pid":"П3","head":"NT18, MRK 15:4","rst":true,"dendi":"N si tu ba?","source":"NT18, MRK 15:4","source_url":"https://zeno.fm/bible/DDNBIV/MRK/15/","pub":"Ты ничего не отвечаешь?","lit":"Ты не отвечаешь?","parse":"N — ты; si — отрицание; tu — отвечать; ba — вопросительная частица."},{"k":2,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."}],"refs":[{"t":"NT18, Мк 15:4","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"},{"t":"NT18, Ин 16:9","u":"https://zeno.fm/bible/DDNBIV/JHN/16/"},{"t":"NT18, Рим 3:11","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, 1 Кор 7:27","u":"https://zeno.fm/bible/DDNBIV/1CO/7/"},{"t":"NT18, 1 Кор 10:24","u":"https://zeno.fm/bible/DDNBIV/1CO/10/"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"}]},{"label":"II","form":"sí","notes":["Тон сохраняется по AL65, без переноса на нетонированные цитаты."],"full":1,"status":"","examples":[{"k":1,"pid":"П36","head":"AL65, PDF с. 17","rst":false,"dendi":"Iri ma sí hari ziibandi.","source":"AL65, PDF с. 17","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Пусть мы не загрязняем воду.","parse":"Iri — мы; ma — побудительный показатель; sí — отрицание; тон источника сохранён; hari — вода; ziibandi — загрязнять.","note":"Учебная фраза о сохранении чистоты воды. Ziibandi — глагол изменения состояния, а не прилагательное «грязный»."}],"refs":[{"t":"AL65, PDF с. 17","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"В приведённых сочетаниях отрицает действие. Не тождествен самостоятельному ответу Awo. Полная аспектно-модальная система не устанавливается по этим пяти местам."},{"n":171,"title":"Отрицание: mana","letter":"О","variants":[{"label":"","form":"mana","notes":["Отрицательный показатель / отрицательное предикативное употребление."],"full":3,"status":"","examples":[{"k":1,"pid":"П7","head":"NT95, JHN 4:29, PDF с. 62","rst":true,"dendi":"À mana ci Mɛsiya dee?","source":"NT95, JHN 4:29, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"не Он ли Христос?","lit":"Не является ли он Мессией?","parse":"À — он; mana — отрицательное предикативное употребление; ci — являться; Mɛsiya — Мессия; dee — вопросительная частица.","note":"Ожидание подтверждения возможно по контексту, но не объявляется значением dee во всех вопросах."},{"k":2,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":3,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."}],"refs":[{"t":"NT18, Ин 7:5","u":"https://zeno.fm/bible/DDNBIV/JHN/7/"},{"t":"NT18, Ин 4:29","u":"https://zeno.fm/bible/DDNBIV/JHN/4/"},{"t":"NT18, Лк 2:50","u":"https://zeno.fm/bible/DDNBIV/LUK/2/"},{"t":"NT18, 1 Кор 15:16","u":"https://zeno.fm/bible/DDNBIV/1CO/15/"},{"t":"NT18, Ин 1:20","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Встречается при отрицании события и отождествления. Не сводить к неизменному переводу «не в прошлом»: распределение с si и na требует отдельного анализа."},{"n":172,"title":"Охотиться","letter":"О","variants":[],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":112,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":173,"title":"Ощущать (в сочетании maa jo)","letter":"О","variants":[{"label":"","form":"maa","notes":["Контекстное чувственное восприятие: ощутить жажду. Не имя maa и не слуховое восприятие из статьи «Слышать»."],"full":1,"status":"","examples":[{"k":1,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":174,"title":"Падать","letter":"П","variants":[{"label":"I","form":"kam","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT18, Мк 7:28","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"NT18, Мф 13:7","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, Евр 11:30","u":"https://zeno.fm/bible/DDNBIV/HEB/11/"}]},{"label":"II","form":"kàm","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":127,"sci":"H, §E №200, с. 43. Практическая орфография и контекст
