 пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 96","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=96"},{"t":"NT18, Мф 10:16","u":"https://zeno.fm/bible/DDNBIV/MAT/10/"},{"t":"NT18, 1 Кор 10:9","u":"https://zeno.fm/bible/DDNBIV/1CO/10/"}]},{"label":"II","form":"gazama","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 28:3","u":"https://zeno.fm/bible/DDNBIV/ACT/28/"},{"t":"NT18, Рим 3:13","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, Лк 3:7","u":"https://zeno.fm/bible/DDNBIV/LUK/3/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":49,"sci":"H, §E №81, с. 36. Практическая орфография и контекст требуют сверки."},{"n":91,"title":"Знать","letter":"З","variants":[{"label":"","form":"bei","notes":["В вопросе «другие согласные, которые знаешь»; отличается от bay NT."],"full":3,"status":"","examples":[{"k":1,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."},{"k":2,"pid":"П69","head":"AL65, PDF и печ. с. 70","rst":false,"lead":["В П69 приведено именное производное beiyom «знание/узнавание», а не новая самостоятельная глагольная основа."],"dendi":"Sigiri barà nɔ̀ hanuyo beiyom azansi.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Календарь — средство узнавания дней.","parse":"Sigiri — календарь; barà — компонент связочной конструкции barà nɔ̀; nɔ̀ — компонент той же связочной конструкции; hanuyo — дни; beiyom — знание, узнавание; производное от bei; azansi — средство, способ.","note":"Полное определение из календарного урока. barà nɔ̀ здесь связывает тему с определением, а не вводит список, как в П48. beiyom — именное производное, не голая глагольная форма bei."},{"k":3,"pid":"П90","head":"NT18, Ин 1:10","rst":true,"dendi":"À goono handunya. Nga mo ya na handunya tɛ amma handunya mana à bei.","source":"NT18, Ин 1:10","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"В мире был, и мир чрез Него на́чал быть, и мир Его не познал.","lit":"Он был в мире. Он же сотворил мир, но мир его не знал.","parse":"À — он, отсылка к действующему лицу пролога; goono — находиться, быть; handunya — мир; Nga — он, самостоятельная форма; mo — также, же; ya — выделение; na — показатель переходного действия; handunya — мир; tɛ — делать, здесь сотворить; amma — но; handunya — мир; mana — отрицание; à — он, здесь его; bei — знать.","note":"Весь стих состоит из двух законченных предложений и приведён целиком. Отсылку À следует читать в контексте пролога о Слове и свете. «Мир не знал» — переносное обозначение людей мира. Прошедшее время перевода не объявлено значением goono."}],"refs":[{"t":"NT95, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT18, Мф 28:5","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"},{"t":"AL65, PDF с. 26","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=26"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"},{"t":"AL64, PDF с. 18","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=18"},{"t":"AL65, PDF с. 103","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=103"},{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":103,"sci":"H, §E №187, с. 42. Практическая орфография и контекст требуют сверки."},{"n":92,"title":"Зола","letter":"З","variants":[{"label":"","form":"boosu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 11:21","u":"https://zeno.fm/bible/DDNBIV/MAT/11/"},{"t":"NT18, Евр 9:13","u":"https://zeno.fm/bible/DDNBIV/HEB/9/"},{"t":"NT18, 2 Пет 2:6","u":"https://zeno.fm/bible/DDNBIV/2PE/2/"},{"t":"NT18, Лк 10:13","u":"https://zeno.fm/bible/DDNBIV/LUK/10/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":168,"sci":"AZ, №83. Практическая орфография и контекст требуют сверки."},{"n":93,"title":"Зуб","letter":"З","variants":[{"label":"","form":"hinje","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 21","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=21"},{"t":"NT18, Мф 13:42","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, Откр 9:8","u":"https://zeno.fm/bible/DDNBIV/REV/9/"},{"t":"NT18, Деян 7:54","u":"https://zeno.fm/bible/DDNBIV/ACT/7/"},{"t":"NT18, Мк 9:18","u":"https://zeno.fm/bible/DDNBIV/MRK/9/"},{"t":"NT18, Мф 5:38","u":"https://zeno.fm/bible/DDNBIV/MAT/5/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":77,"sci":"H, §E №100, с. 37. Практическая орфография и контекст требуют сверки."},{"n":94,"title":"И","letter":"И","variants":[{"label":"I","form":"nda","notes":["Также «с»."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мф 3:5","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL64, PDF с. 1","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=1"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]},{"label":"II","form":"nna","notes":["Письменное расхождение с nda; различать функцию и окружение.","Печатная с. 8–9: запись союза в тексте 1994 года."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"CFA, PDF с. 8","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=8"},{"t":"CFA, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=5"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"},{"t":"COV, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=3"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П54","head":"","rst":true,"dendi":"Yesu go baa Marata nda à cɛɛnɛ nda Lazaa.","source":"NT18, Ин 11:5","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус же любил Марфу и сестру ее и Лазаря.","lit":"Иисус любит Марфу, её младшую сестру и Лазаря.","parse":"Yesu — Иисус; go — предглагольный показатель; baa — любить; Marata — Марфа; nda — и; à — она, здесь её; cɛɛnɛ — младшая сестра в этом контексте; nda — и; Lazaa — Лазарь.","note":"Полное повествовательное предложение. В Ин 11:1 и 11:28 сестра Марфы названа Mariyama. Слово cɛɛnɛ не ограничено мужским полом: сравните П32 в статье «Брат». Русское прошедшее время параллельного перевода не является отдельным значением go."},{"k":2,"pid":"П63","head":"","rst":false,"dendi":"Iyaali fɔ́ bara nɔ̀ baabɛ, nyaa nda koo au kooyo.","source":"AL65, PDF и печ. с. 56","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56","lit":"Одна семья — это отец, мать и ребёнок или дети.","parse":"Iyaali — семья; fɔ́ — один, одна; bara — компонент связочной конструкции bara nɔ̀; nɔ̀ — компонент той же связочной конструкции; baabɛ — отец; nyaa — мать; nda — и; koo — ребёнок; au — или; kooyo — дети, форма источника.","note":"Полное определение из урока о семье; это учебное описание конкретного состава семьи, не универсальное этнографическое определение. Нетонированное bara сохранено. kooyo передано как форма множественного числа в этом контексте без самостоятельного обобщения правил суффиксации."},{"k":3,"pid":"П70","head":"","rst":false,"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."},{"k":4,"pid":"П71","head":"","rst":false,"dendi":"Wɔ̀ noo mɛɛ nna noo nunɛ daabu, de noo go tɔkɔɔ au noo go tisã.","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Прикрывайте ваши рот и нос, если [когда] вы кашляете или чихаете.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь «ваши»; mɛɛ — рот; nna — и; noo — форма адресата, здесь «ваш»; nunɛ — нос; daabu — закрывать, прикрывать; de — если, в этом контексте также «когда»; noo — форма адресата, субъект придаточной части; go — предглагольный показатель; tɔkɔɔ — кашлять; au — или; noo — форма адресата, субъект; go — предглагольный показатель; tisã — чихать.","note":"Полная фраза с придаточной частью после запятой. Текст памятки сохраняет повтор noo. В переводе показаны условное и временное прочтения de; из этого примера не выводится тождество de и всех слов «когда»."}],"stray":[],"kind":"swadesh","swadesh":204,"meaning":"nda — и; также «с»."},{"n":95,"title":"Играть","letter":"И","variants":[{"label":"","form":"hooru","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, 1 Кор 10:7","u":"https://zeno.fm/bible/DDNBIV/1CO/10/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":142,"meaning":"hooru — развлекаться/играть; употребление в данном переводе контекстное."},{"n":96,"title":"Идти; продвигаться к пределу","letter":"И","variants":[{"label":"","form":"kwei","notes":["В конструкции ka kwei + числовая граница: продвигаться до указанного числа. Значение удостоверено арифметическими инструкциями; описание всех употреблений глагола не предполагается. Полных примеров: 2."],"full":null,"status":"","examples":[{"k":1,"pid":"П51","head":"AL65, PDF и печ. с. 31","rst":false,"dendi":"Kabu zǎ 1 ka kwei 9.","source":"AL65, PDF и печ. с. 31.","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=31","lit":"Считай начиная с 1, продвигаясь до 9.","parse":"Kabu — считай; побуждение без отдельного местоимения; zǎ — начиная с, от; 1 — число 1, записанное цифрой; ka — связывает действие с последующим kwei; kwei — идти, продвигаться; в данном задании обозначает достижение верхней границы счёта; 9 — число 9, записанное цифрой.","note":"Полная инструкция перед рядом 1–9. Естественный русский перевод: «Считай от одного до девяти». Цифры не заменены дендийскими словами: их произношение эта цитата не удостоверяет. Сочетание ka kwei передаёт здесь предел «до»; отдельное kwei не объявляется универсальным предлогом «до»."},{"k":2,"pid":"П52","head":"AL65, PDF и печ. с. 32","rst":false,"dendi":"Kabu zǎ 20 nda 20, zǎ 20 ka kwei 100.","source":"AL65, PDF и печ. с. 32.","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=32","lit":"Считай по 20, начиная с 20 и продвигаясь до 100.","parse":"Kabu — считай; zǎ — от, начиная с; в первом сочетании zǎ 20 nda 20 участвует в указании шага; 20 — число 20 (три употребления); nda — связующий элемент в конструкции шага 20 nda 20; повторное zǎ — начало диапазона; ka — связь с kwei; kwei — идти, продвигаться, здесь до указанного предела; 100 — число 100.","note":"Полное задание на счёт с постоянным шагом. Сочетание zǎ 20 nda 20 в этом арифметическом контексте означает счёт двадцатками; это не сложение 20 + 20. Ожидаемый ряд: 20, 40, 60, 80, 100. Функция nda устанавливается для этой конструкции и не подменяется механически переводом «и» или «с»."}],"refs":[]}],"extra_refs":[],"linked":[{"k":1,"pid":"П67","head":"","rst":false,"dendi":"Hawau kwei hebu.","source":"AL65, PDF и печ. с. 96","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=96","lit":"Хавау пошла на рынок.","parse":"Hawau — Хавау, имя персонажа; kwei — идти; hebu — рынок.","note":"Целое первое предложение задачи о покупке помидоров. Женский род русского перевода согласован с иллюстрацией и контекстом. Прошедшее время — повествовательная интерпретация; отдельного показателя прошедшего в этой фразе не выделено."}],"stray":[],"kind":"extra"},{"n":97,"title":"Изображение; иллюстрация","letter":"И","variants":[{"label":"I","form":"Alaama","notes":["Объект учебной инструкции. Значение «знак» или «чудо» у сходных написаний в иных текстах сюда автоматически не переносится."],"full":2,"status":"","examples":[{"k":1,"pid":"П49","head":"AL65, PDF с. 70","rst":false,"dendi":"Alaama wɔ̀ gùna.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Посмотри на это изображение.","parse":"Alaama — изображение; иллюстрация в учебнике; wɔ̀ — этот; gùna — посмотри; побудительное употребление.","note":"Буквальная именная группа — «это изображение». Полная инструкция перед заданием о календаре. Порядок: объект перед глаголом. Тоны wɔ̀ и gùna сохранены именно по этой странице; они не переносятся автоматически на нетонированное Guna в NT95."},{"k":2,"pid":"П74","head":"AL65, PDF и печ. с. 13","rst":false,"dendi":"N mà alaama wɔ̀ gùna.","source":"AL65, PDF и печ. с. 13","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=13","lit":"Посмотри на это изображение.","parse":"N — ты; mà — побудительный показатель; alaama — изображение; wɔ̀ — этот; gùna — смотреть, посмотри.","note":"Целая инструкция перед изображением приготовления пищи. В отличие от П49, здесь выражены N и mà. В печати màalaama слито: нормализован только пробел между показателем и существительным; буквы и тоны сохранены."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]},{"label":"II","form":"fotoo, Fotoo","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П62","head":"AL65, PDF и печ. с. 56","rst":false,"dendi":"Fotoo wɔ guna.","source":"AL65, PDF и печ. с. 56","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56","lit":"Посмотри на это изображение.","parse":"Fotoo — изображение, фотография; wɔ — этот; guna — смотри, посмотри.","note":"Полная инструкция к рисунку семьи. Нетонированное wɔ сохранено именно как на этой странице; не заменено wɔ̀ из других инструкций. Повелительный смысл задаётся учебной ситуацией."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":98,"title":"Изучать; учиться; подражать","letter":"И","variants":[{"label":"","form":"dendeni","notes":["Глагол."],"full":3,"status":"","examples":[{"k":1,"pid":"П16","head":"AL64, PDF с. 20","rst":false,"dendi":"Ifɔ nɔ noo dendeni?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","lit":"Что именно [адресат вопроса] изучил?","parse":"Ifɔ — что?; nɔ — выделительный/предикативный элемент; noo — форма адресата в пособии; лицо и число отдельно не установлены; dendeni — изучать / учиться.","note":"Дословная глосса намеренно содержит квадратные скобки: лицо и число адресата не подтверждены отдельным описанием местоименной системы. Это полный пример с незавершённой грамматической интерпретацией, а не образец для самостоятельного составления фраз."},{"k":2,"pid":"П17","head":"AL64, PDF с. 20","rst":false,"dendi":"Mɛtɛ noo nà à dendeni nda?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","lit":"Каким способом [адресат вопроса] изучил это?","parse":"Mɛtɛ — как?; noo — форма адресата; лицо и число не установлены; nà — показатель переходного действия; à — это, дополнение; dendeni — изучать; nda — элемент конструкции способа.","note":"Тон nà сохранён по источнику. Классификация конечного nda предварительная; это ограничение относится и к статье nda. Перевод не выдаётся за полностью завершённый разбор."},{"k":3,"pid":"П18","head":"CAL, PDF с. 9, печ. с. 14–15","rst":false,"dendi":"Iri ma dendeni:","source":"CAL, PDF с. 9, печ. с. 14–15","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=9","lit":"Пусть мы учимся:","parse":"Iri — мы; ma — побудительный/желательный показатель в данном сочетании; dendeni — учиться.","note":"Полная вводная фраза перед учебной таблицей; двоеточие сохранено. Таблица задаёт контекст обучения арифметике. Это не выдуманный разговорный вопрос."}],"refs":[{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"},{"t":"NT18, 1 Тим 2:11","u":"https://zeno.fm/bible/DDNBIV/1TI/2/"},{"t":"NT18, 2 Тим 3:7","u":"https://zeno.fm/bible/DDNBIV/2TI/3/"},{"t":"NT18, 2 Тим 3:14","u":"https://zeno.fm/bible/DDNBIV/2TI/3/"},{"t":"NT18, Еф 5:1","u":"https://zeno.fm/bible/DDNBIV/EPH/5/"},{"t":"NT18, Иак 5:10","u":"https://zeno.fm/bible/DDNBIV/JAS/5/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"В учебных вопросах — учиться / изучать. Другие контексты допускают следование образцу; не заменять эти оттенки одним русским глаголом."},{"n":99,"title":"Иисус","letter":"И","variants":[{"label":"","form":"Yesu","notes":["Имя собственное; практическое написание из NT95."],"full":9,"status":"","examples":[{"k":1,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."},{"k":2,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."},{"k":3,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":4,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."},{"k":5,"pid":"П54","head":"NT18, Ин 11:5","rst":true,"dendi":"Yesu go baa Marata nda à cɛɛnɛ nda Lazaa.","source":"NT18, Ин 11:5","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус же любил Марфу и сестру ее и Лазаря.","lit":"Иисус любит Марфу, её младшую сестру и Лазаря.","parse":"Yesu — Иисус; go — предглагольный показатель; baa — любить; Marata — Марфа; nda — и; à — она, здесь её; cɛɛnɛ — младшая сестра в этом контексте; nda — и; Lazaa — Лазарь.","note":"Полное повествовательное предложение. В Ин 11:1 и 11:28 сестра Марфы названа Mariyama. Слово cɛɛnɛ не ограничено мужским полом: сравните П32 в статье «Брат». Русское прошедшее время параллельного перевода не является отдельным значением go."},{"k":6,"pid":"П55","head":"NT18, Ин 11:35","rst":true,"dendi":"Yesu hẽ.","source":"NT18, Ин 11:35","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус прослезился.","lit":"Иисус заплакал.","parse":"Yesu — Иисус; hẽ — плакать.","note":"Целое краткое предложение; перед ним описаны плач Марии и пришедших с ней людей. Назализация ẽ сохранена. Начинательное «заплакал» — контекстный русский перевод, не выделенная морфема денди."},{"k":7,"pid":"П88","head":"NT18, Ин 11:23","rst":true,"dendi":"Yesu cii à sɛ: «N harume di kaa tunu kpɛɛnɛ.»","source":"NT18, Ин 11:23","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус говорит ей: воскреснет брат твой.","lit":"Иисус сказал ей: «Твой брат снова встанет [воскреснет]».","parse":"Yesu — Иисус; cii — сказать; à — она, Марфа; sɛ — послелог адресата; N — ты, здесь твой; harume — брат; di — определительный элемент; kaa — показатель предстоящего действия в этом контексте; tunu — встать, здесь воскреснуть; kpɛɛnɛ — ещё, снова.","note":"Сохранены вводная часть и целая реплика. Речь о Лазаре, брате Марфы; отсюда контекстное «воскреснуть». kaa перед tunu не переводится вторым глаголом «приходить». harume добавлено к статье «Брат», без утверждения о полном тождестве cɛɛnɛ."},{"k":8,"pid":"П92","head":"NT18, Ин 1:37","rst":true,"dendi":"Coobaaba-ize hinka di maa Yohana go sendi ya di. Ǹ na Yesu gana.","source":"NT18, Ин 1:37","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Услышав от него сии слова, оба ученика пошли за Иисусом.","lit":"Те два ученика услышали, как Иоанн говорит так. Они последовали за Иисусом.","parse":"Coobaaba-ize — ученик, сложное слово; hinka — два; di — определительный элемент; maa — слышать; Yohana — Иоанн; go — предглагольный показатель; sendi — говорить; ya — компонент сочетания ya di «так»; di — компонент сочетания ya di; Ǹ — они; na — показатель переходного действия; Yesu — Иисус; gana — следовать за.","note":"Приведены оба предложения стиха. ya di после глагола речи передаёт «так»: его нельзя механически разобрать как выделительное ya из П19. Coobaaba-ize сохранено с дефисом. maa здесь «слышать», не «имя»."},{"k":9,"pid":"П45","head":"NT95, Мф 13:51, PDF с. 13","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."}],"refs":[{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"},{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":100,"title":"Или: союз альтернативного вопроса","letter":"И","variants":[{"label":"I","form":"wala","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, Мк 12:14, PDF с. 33","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=33"}]},{"label":"II","form":"au","notes":["Союз невопросительной альтернативы в AL65 и COV. Статья включает «или» как в вопросах, так и в невопросительных фразах."],"full":2,"status":"","examples":[{"k":1,"pid":"П63","head":"AL65, PDF и печ. с. 56","rst":false,"dendi":"Iyaali fɔ́ bara nɔ̀ baabɛ, nyaa nda koo au kooyo.","source":"AL65, PDF и печ. с. 56","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56","lit":"Одна семья — это отец, мать и ребёнок или дети.","parse":"Iyaali — семья; fɔ́ — один, одна; bara — компонент связочной конструкции bara nɔ̀; nɔ̀ — компонент той же связочной конструкции; baabɛ — отец; nyaa — мать; nda — и; koo — ребёнок; au — или; kooyo — дети, форма источника.","note":"Полное определение из урока о семье; это учебное описание конкретного состава семьи, не универсальное этнографическое определение. Нетонированное bara сохранено. kooyo передано как форма множественного числа в этом контексте без самостоятельного обобщения правил суффиксации."},{"k":2,"pid":"П71","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo mɛɛ nna noo nunɛ daabu, de noo go tɔkɔɔ au noo go tisã.","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Прикрывайте ваши рот и нос, если [когда] вы кашляете или чихаете.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь «ваши»; mɛɛ — рот; nna — и; noo — форма адресата, здесь «ваш»; nunɛ — нос; daabu — закрывать, прикрывать; de — если, в этом контексте также «когда»; noo — форма адресата, субъект придаточной части; go — предглагольный показатель; tɔkɔɔ — кашлять; au — или; noo — форма адресата, субъект; go — предглагольный показатель; tisã — чихать.","note":"Полная фраза с придаточной частью после запятой. Текст памятки сохраняет повтор noo. В переводе показаны условное и временное прочтения de; из этого примера не выводится тождество de и всех слов «когда»."}],"refs":[]}],"extra_refs":[{"t":"NT18, Мк 12:14","u":"https://zeno.fm/bible/DDNBIV/MRK/12/"},{"t":"NT18, Деян 8:34","u":"https://zeno.fm/bible/DDNBIV/ACT/8/"},{"t":"NT18, Рим 4:10","u":"https://zeno.fm/bible/DDNBIV/ROM/4/"},{"t":"NT18, 1 Кор 14:36","u":"https://zeno.fm/bible/DDNBIV/1CO/14/"},{"t":"NT18, Лк 12:41","u":"https://zeno.fm/bible/DDNBIV/LUK/12/"}],"linked":[{"k":1,"pid":"П29","head":"","rst":true,"dendi":"Andebi hinka wala ihinza mo ma sendi.","source":"NT95, 1 Кор 14:29, PDF с. 114","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114","pub":"И пророки пусть говорят двое или трое, а прочие пусть рассуждают.","lit":"Двое пророков или трое также пусть говорят.","parse":"Andebi — пророки; hinka — два; wala — или; ihinza — трое; форма при обозначении людей; mo — также; ma — побудительный/желательный показатель; sendi — говорить.","note":"Это полное первое предложение дендийского стиха. Русский параллельный стих также включает указание прочим слушателям; оно не добавлено в дословный перевод отсутствующей здесь второй фразы."},{"k":2,"pid":"П70","head":"","rst":false,"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."}],"stray":[],"kind":"extra","meaning":"Разделительный союз. Полный вопросительный контекст требует отдельного дословного разбора; невопросительная альтернатива представлена в П29."},{"n":101,"title":"Илия","letter":"И","variants":[{"label":"","form":"Eli","notes":["Имя собственное."],"full":2,"status":"","examples":[{"k":1,"pid":"П14","head":"NT18, JHN 1:21","rst":true,"dendi":"Ni no Eli?","source":"NT18, JHN 1:21","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"ты Илия?","lit":"Ты — Илия?","parse":"Ni — ты, самостоятельная форма; no — предикативный элемент; Eli — Илия.","note":"Вопрос без ba и dee: по письменному тексту нельзя установить точную вопросительную интонацию."},{"k":2,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."}],"refs":[{"t":"NT18, Ин 1:21","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Мф 17:3","u":"https://zeno.fm/bible/DDNBIV/MAT/17/"},{"t":"NT18, Мк 9:4","u":"https://zeno.fm/bible/DDNBIV/MRK/9/"},{"t":"NT18, Лк 9:30","u":"https://zeno.fm/bible/DDNBIV/LUK/9/"},{"t":"NT18, Мф 27:49","u":"https://zeno.fm/bible/DDNBIV/MAT/27/"},{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"В вопросе «ты Илия?» перед именем стоит no. Имя не является вопросительным словом."},{"n":102,"title":"Иметь","letter":"И","variants":[{"label":"I","form":"gunda","notes":["Глагол состояния."],"full":2,"status":"","examples":[{"k":1,"pid":"П1","head":"NT18, 1CO 7:27","rst":true,"dendi":"N gunda wɛndɛ ba?","source":"NT18, 1CO 7:27","source_url":"https://zeno.fm/bible/DDNBIV/1CO/7/","pub":"Соединен ли ты с женою?","lit":"Ты имеешь жену?","parse":"N — ты; gunda — иметь; wɛndɛ — жена; ba — вопросительная частица."},{"k":2,"pid":"П5","head":"NT18, ROM 14:22","rst":true,"dendi":"N gunda naane ba?","source":"NT18, ROM 14:22","source_url":"https://zeno.fm/bible/DDNBIV/ROM/14/","pub":"Ты имеешь веру?","lit":"Ты имеешь веру?","parse":"N — ты; gunda — иметь; naane — вера; ba — вопросительная частица."}],"refs":[{"t":"NT18, 1 Кор 7:27","u":"https://zeno.fm/bible/DDNBIV/1CO/7/"},{"t":"NT18, Рим 14:22","u":"https://zeno.fm/bible/DDNBIV/ROM/14/"},{"t":"NT18, Мф 11:15","u":"https://zeno.fm/bible/DDNBIV/MAT/11/"},{"t":"NT18, 1 Кор 9:4","u":"https://zeno.fm/bible/DDNBIV/1CO/9/"}]},{"label":"II","form":"gonda","notes":["Глагол состояния."],"full":null,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":2,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."},{"k":3,"pid":"П39","head":"AL65, PDF с. 70","rst":false,"dendi":"Handu fɔ́ gonda azuma 4.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Один месяц имеет четыре недели.","parse":"Handu — месяц; fɔ́ — один; gonda — иметь; azuma — неделя; 4 — четыре; цифровая запись.","note":"Это приближённая учебная схема, а не утверждение, что каждый календарный месяц длится ровно четыре недели. Цифра не заменяется неподтверждённым дендийским названием числа."},{"k":4,"pid":"П46","head":"AL65, PDF с. 29","rst":false,"dendi":"Bom gonda hangayo, mɔɔize, ninɛ, mɛɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Голова имеет уши, глаза, нос, рот.","parse":"Bom — голова; gonda — иметь; hangayo — уши; форма источника с -yo; mɔɔize — глаза в данном перечислении органов головы; ninɛ — нос; mɛɛ — рот.","note":"Полное предложение из учебного описания тела. Число органов в русском переводе следует анатомическому перечислению; оно не приписывается единому суффиксу у всех дендийских слов. Здесь mɔɔize названо в ряду органов головы; специальное различие «глаз / зрачок» этим предложением отдельно не устанавливается."},{"k":5,"pid":"П47","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri kubantɛ gonda jibiri 365.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Невисокосный год имеет 365 дней.","parse":"Jiiri — год; kubantɛ — невисокосный; значение в сочетании jiiri kubantɛ; gonda — иметь; jibiri — день; 365 — триста шестьдесят пять; цифровая запись источника.","note":"Предложение входит в противопоставление обычного и високосного года. Kubantɛ не объявляется универсальным переводом прилагательного «обычный» вне календарного сочетания. Цифра сохранена; дендийское словесное название числа не восстановлено по догадке."},{"k":6,"pid":"П82","head":"AL65, PDF и печ. с. 70","rst":false,"dendi":"Jiiri nuusamtɛ cin kàà nɔ̀ jiiri 4 kulu nga à gonda jibiri 366.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Високосный год приходит каждые четыре года, и в нём 366 дней.","parse":"Jiiri — год; nuusamtɛ — високосный; cin — показатель обычного повторяющегося действия в этом контексте; kàà — приходить; nɔ̀ — предикативно-выделительный элемент; jiiri — год; 4 — цифровая запись числа 4; kulu — каждый, весь; nga — связь частей, здесь «и»; à — он, год; gonda — иметь; jibiri — день; 366 — цифровая запись числа 366.","note":"Полное утверждение из календарного урока. Это упрощённая формулировка учебника: исключения календарного правила цитата не описывает. На с. 76 в упражнении встречается перестановка подписей; она не используется для переопределения nuusamtɛ и kubantɛ. nga здесь связывает части, а à занимает позицию субъекта."}],"refs":[{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"},{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Gunda подтверждено NT18; gonda — учебным пособием AL65. Это засвидетельствованные варианты в разных текстах; свободная взаимозаменяемость не установлена. Go в приведённых конструкциях обладания не обязателен."},{"n":103,"title":"Имя","letter":"И","variants":[{"label":"","form":"maa","notes":["Позиция имени передаётся словом maa в корпусе.","В П76 maayo — контекстная форма «имена/названия», соотнесённая с maa; морфология окончания по одной форме не обобщается."],"full":2,"status":"","examples":[{"k":1,"pid":"П76","head":"AL65, PDF и печ. с. 43","rst":false,"dendi":"N mà nn maayo hantum n tira kuna.","source":"AL65, PDF и печ. с. 43","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=43","lit":"Запиши их названия в своей тетради.","parse":"N — ты; mà — побудительный показатель; nn — они, здесь их; maayo — имена, названия; hantum — записывать; n — ты, здесь твоя; tira — тетрадь, письменная книга; kuna — внутри, в.","note":"Полное второе предложение учебного пункта. В предыдущем предложении названы известные учащемуся коммуны: nn отсылает к ним. В последней строке tirakuna напечатано слитно; пробел нормализован без изменения букв."},{"k":2,"pid":"П89","head":"NT18, Ин 1:6","rst":true,"dendi":"Ikpɛ na bɔrɔ fɔ dɔntɔm, à maa no Yohana.","source":"NT18, Ин 1:6","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Был человек, посланный от Бога; имя ему Иоанн.","lit":"Бог послал одного человека, его имя — Иоанн.","parse":"Ikpɛ — Бог; na — показатель переходного действия; bɔrɔ — человек; fɔ — один, некий; dɔntɔm — посылать; à — он, здесь его; maa — имя; no — связочный элемент; Yohana — Иоанн.","note":"Полное предложение, включая часть об имени. maa здесь «имя», не «слышать». Активная конструкция денди сохранена в авторском переводе, несмотря на страдательный оборот русского параллельного текста."}],"refs":[{"t":"NT95, PDF с. 38","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=38"},{"t":"NT18, Мф 1:21","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"NT18, Лк 21:17","u":"https://zeno.fm/bible/DDNBIV/LUK/21/"},{"t":"NT18, Ин 14:14","u":"https://zeno.fm/bible/DDNBIV/JHN/14/"},{"t":"NT18, 1 Кор 1:15","u":"https://zeno.fm/bible/DDNBIV/1CO/1/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":207,"meaning":"maa — имя; омограф глагола «слышать».","sci":"AZ, №100. Практическая орфография и контекст требуют сверки."},{"n":104,"title":"Иоанн","letter":"И","variants":[{"label":"","form":"Yohana","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П89","head":"NT18, Ин 1:6","rst":true,"dendi":"Ikpɛ na bɔrɔ fɔ dɔntɔm, à maa no Yohana.","source":"NT18, Ин 1:6","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Был человек, посланный от Бога; имя ему Иоанн.","lit":"Бог послал одного человека, его имя — Иоанн.","parse":"Ikpɛ — Бог; na — показатель переходного действия; bɔrɔ — человек; fɔ — один, некий; dɔntɔm — посылать; à — он, здесь его; maa — имя; no — связочный элемент; Yohana — Иоанн.","note":"Полное предложение, включая часть об имени. maa здесь «имя», не «слышать». Активная конструкция денди сохранена в авторском переводе, несмотря на страдательный оборот русского параллельного текста."},{"k":2,"pid":"П92","head":"NT18, Ин 1:37","rst":true,"dendi":"Coobaaba-ize hinka di maa Yohana go sendi ya di. Ǹ na Yesu gana.","source":"NT18, Ин 1:37","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Услышав от него сии слова, оба ученика пошли за Иисусом.","lit":"Те два ученика услышали, как Иоанн говорит так. Они последовали за Иисусом.","parse":"Coobaaba-ize — ученик, сложное слово; hinka — два; di — определительный элемент; maa — слышать; Yohana — Иоанн; go — предглагольный показатель; sendi — говорить; ya — компонент сочетания ya di «так»; di — компонент сочетания ya di; Ǹ — они; na — показатель переходного действия; Yesu — Иисус; gana — следовать за.","note":"Приведены оба предложения стиха. ya di после глагола речи передаёт «так»: его нельзя механически разобрать как выделительное ya из П19. Coobaaba-ize сохранено с дефисом. maa здесь «слышать», не «имя»."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Собственное имя Иоанн. В П89 и П92 — Иоанн Креститель; имя само по себе не отождествляет разных носителей.","related":"П89, П92."},{"n":105,"title":"Искать","letter":"И","variants":[{"label":"","form":"ceeci","notes":["Глагол."],"full":1,"status":"","examples":[{"k":1,"pid":"П11","head":"NT95, JHN 1:38, PDF с. 60","rst":true,"dendi":"Ifɔ wom go ceeci?","source":"NT95, JHN 1:38, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"что вам надобно?","lit":"Что вы ищете?","parse":"Ifɔ — что?; wom — вы; go — предглагольный показатель; ceeci — искать.","note":"Параллельный Синодальный перевод передаёт вопрос иначе; дословный дендийский перевод не подменён им."}],"refs":[{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Мк 1:37","u":"https://zeno.fm/bible/DDNBIV/MRK/1/"},{"t":"NT18, Лк 19:10","u":"https://zeno.fm/bible/DDNBIV/LUK/19/"},{"t":"NT18, Рим 3:11","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, Еф 5:10","u":"https://zeno.fm/bible/DDNBIV/EPH/5/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Объект поиска может быть человеком, предметом, знанием или желаемым результатом. Значение «испытывать / выяснять» устанавливается по контексту, не переносится на каждое употребление."},{"n":106,"title":"Испытание","letter":"И","variants":[{"label":"","form":"bubureyom","notes":["Испытание веры; производная форма сохранена без неподтверждённого разложения."],"full":1,"status":"","examples":[{"k":1,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."}],"refs":[{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":107,"title":"Испытывать жажду","letter":"И","variants":[{"label":"","form":"maa jo","notes":["Устойчивое сочетание в контексте питья. Maa здесь передаёт ощущение; буквальная подстановка «слышать» неверна."],"full":1,"status":"","examples":[{"k":1,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":108,"title":"Как","letter":"К","variants":[{"label":"","form":"mɛtɛ","notes":["Вопросительное слово."],"full":1,"status":"","examples":[{"k":1,"pid":"П17","head":"AL64, PDF с. 20","rst":false,"dendi":"Mɛtɛ noo nà à dendeni nda?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","lit":"Каким способом [адресат вопроса] изучил это?","parse":"Mɛtɛ — как?; noo — форма адресата; лицо и число не установлены; nà — показатель переходного действия; à — это, дополнение; dendeni — изучать; nda — элемент конструкции способа.","note":"Тон nà сохранён по источнику. Классификация конечного nda предварительная; это ограничение относится и к статье nda. Перевод не выдаётся за полностью завершённый разбор."}],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Лк 16:3","u":"https://zeno.fm/bible/DDNBIV/LUK/16/"},{"t":"AL64, PDF с. 19","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=19"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"},{"t":"AL65, PDF с. 73","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=73"},{"t":"AL65, PDF с. 53","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=53"},{"t":"NT18, Ин 9:10","u":"https://zeno.fm/bible/DDNBIV/JHN/9/"},{"t":"NT18, Деян 2:8","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Мф 22:45","u":"https://zeno.fm/bible/DDNBIV/MAT/22/"},{"t":"NT18, Лк 20:44","u":"https://zeno.fm/bible/DDNBIV/LUK/20/"},{"t":"NT18, Мк 8:21","u":"https://zeno.fm/bible/DDNBIV/MRK/8/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":15,"meaning":"Спрашивает о способе или объяснении; конкретная конструкция может передавать русское «как же?». Не объявляется частицей вопросов на да/нет."},{"n":109,"title":"Календарь","letter":"К","variants":[{"label":"","form":"sigiri, Sigiri","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П69","head":"AL65, PDF и печ. с. 70","rst":false,"dendi":"Sigiri barà nɔ̀ hanuyo beiyom azansi.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Календарь — средство узнавания дней.","parse":"Sigiri — календарь; barà — компонент связочной конструкции barà nɔ̀; nɔ̀ — компонент той же связочной конструкции; hanuyo — дни; beiyom — знание, узнавание; производное от bei; azansi — средство, способ.","note":"Полное определение из календарного урока. barà nɔ̀ здесь связывает тему с определением, а не вводит список, как в П48. beiyom — именное производное, не голая глагольная форма bei."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Календарь; определение в учебном календарном разделе.","related":"П69."},{"n":110,"title":"Камень","letter":"К","variants":[{"label":"","form":"tondi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 176","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=176"},{"t":"NT18, Мф 3:9","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Ин 10:31","u":"https://zeno.fm/bible/DDNBIV/JHN/10/"},{"t":"NT18, Мк 16:4","u":"https://zeno.fm/bible/DDNBIV/MRK/16/"},{"t":"NT18, Лк 22:41","u":"https://zeno.fm/bible/DDNBIV/LUK/22/"},{"t":"NT18, 1 Пет 2:4","u":"https://zeno.fm/bible/DDNBIV/1PE/2/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":156,"sci":"H, §E №131, с. 38. Практическая орфография и контекст требуют сверки."},{"n":111,"title":"Касса","letter":"К","variants":[{"label":"","form":"kɛ̀ɛsu","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П80","head":"AL65, PDF и печ. с. 59","rst":false,"dendi":"Nɔɔru ka à cindi kɛ̀ɛsu kuna kabu.","source":"AL65, PDF и печ. с. 59","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=59","lit":"Посчитай деньги, которые остались в кассе.","parse":"Nɔɔru — деньги; ka — относительная связь; à — оно, отсылка к оставшейся сумме; cindi — оставаться; kɛ̀ɛsu — касса, денежный ящик; kuna — внутри, в; kabu — считать, посчитай.","note":"Целая инструкция в задаче о школьной кассе. Требуется остаток после покупки. Денди использует à, хотя естественный русский перевод «деньги» требует множественного числа."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Касса, денежный ящик; тоновая запись по AL65 с. 59.","related":"П80."},{"n":112,"title":"Кашлять","letter":"К","variants":[{"label":"","form":"tɔkɔɔ","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П71","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo mɛɛ nna noo nunɛ daabu, de noo go tɔkɔɔ au noo go tisã.","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Прикрывайте ваши рот и нос, если [когда] вы кашляете или чихаете.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь «ваши»; mɛɛ — рот; nna — и; noo — форма адресата, здесь «ваш»; nunɛ — нос; daabu — закрывать, прикрывать; de — если, в этом контексте также «когда»; noo — форма адресата, субъект придаточной части; go — предглагольный показатель; tɔkɔɔ — кашлять; au — или; noo — форма адресата, субъект; go — предглагольный показатель; tisã — чихать.","note":"Полная фраза с придаточной частью после запятой. Текст памятки сохраняет повтор noo. В переводе показаны условное и временное прочтения de; из этого примера не выводится тождество de и всех слов «когда»."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Кашлять; глагольное употребление после go. Долгота конечного ɔɔ сохранена.","related":"П71."},{"n":113,"title":"Когда","letter":"К","variants":[{"label":"","form":"saa","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT18, Мф 24:3","u":"https://zeno.fm/bible/DDNBIV/MAT/24/"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"},{"t":"AL65, PDF с. 109","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=109"},{"t":"AL64, PDF с. 6","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=6"},{"t":"AL65, PDF с. 96","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=96"},{"t":"AL65, PDF с. 91","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=91"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П13","head":"","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."}],"stray":[],"kind":"swadesh","swadesh":14,"meaning":"saa — «время; когда» в конструкции. Не единственный способ выразить вопрос «когда»."},{"n":114,"title":"Кожа","letter":"К","variants":[{"label":"I","form":"kuuru","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 3:4","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, 2 Тим 4:13","u":"https://zeno.fm/bible/DDNBIV/2TI/4/"}]},{"label":"II","form":"gaakuuru","notes":["Кожа тела: обсуждаются поры кожи и гигиена; отличается от куuru в кожаном поясе NT."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t"
