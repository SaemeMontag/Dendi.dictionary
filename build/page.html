йтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."}],"refs":[{"t":"NT95, PDF с. 104","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=104"},{"t":"NT18, Мф 28:5","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"},{"t":"AL65, PDF с. 76","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=76"},{"t":"NT18, Евр 10:31","u":"https://zeno.fm/bible/DDNBIV/HEB/10/"},{"t":"NT18, Ин 19:8","u":"https://zeno.fm/bible/DDNBIV/JHN/19/"},{"t":"NT18, Лк 1:50","u":"https://zeno.fm/bible/DDNBIV/LUK/1/"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":106},{"n":8,"title":"Брат","letter":"Б","variants":[{"label":"","form":"cɛɛnɛ","notes":["В cɛɛnɛ yom — братья; показатель yom приведён отдельно."],"full":1,"status":"","examples":[{"k":1,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."}],"refs":[{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":9,"title":"Бросать","letter":"Б","variants":[{"label":"I","form":"cetu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 71","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=71"},{"t":"NT18, Мк 7:27","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Откр 2:22","u":"https://zeno.fm/bible/DDNBIV/REV/2/"},{"t":"NT18, Лк 3:9","u":"https://zeno.fm/bible/DDNBIV/LUK/3/"}]},{"label":"II","form":"furu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 17:27","u":"https://zeno.fm/bible/DDNBIV/MAT/17/"},{"t":"NT18, Деян 27:19","u":"https://zeno.fm/bible/DDNBIV/ACT/27/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":136,"sci":"H, §E №193, с. 43. Практическая орфография и контекст требуют сверки."},{"n":10,"title":"В","letter":"В","variants":[{"label":"","form":"kuna","notes":["Постпозиция; соответствие зависит от конструкции."],"full":2,"status":"","examples":[{"k":1,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":2,"pid":"П40","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ kuna, jibiri 7 ya goono.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одной неделе имеются семь дней.","parse":"Azuma — неделя; fɔ́ — один; kuna — внутри; в; jibiri — день в календарной строке; 7 — семь; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Jibiri сохранено как в пособии; не исправлено автоматически на jiribi из иных текстов. Другие варианты статьи «День» не объявлены взаимозаменяемыми во всех сочетаниях."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:1","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"},{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=100"},{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"AL64, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=5"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":202,"meaning":"kuna — внутри/в; послелог."},{"n":11,"title":"Вера","letter":"В","variants":[{"label":"","form":"naane","notes":["Существительное; омограф глагола «верить».","П34: именная группа с fɔlɔnku; П35: притяжательная группа wom naane. Контексты подтверждают существительное, не глагол."],"full":3,"status":"","examples":[{"k":1,"pid":"П5","head":"NT18, ROM 14:22","rst":true,"dendi":"N gunda naane ba?","source":"NT18, ROM 14:22","source_url":"https://zeno.fm/bible/DDNBIV/ROM/14/","pub":"Ты имеешь веру?","lit":"Ты имеешь веру?","parse":"N — ты; gunda — иметь; naane — вера; ba — вопросительная частица."},{"k":2,"pid":"П34","head":"NT95, Еф 4:5, PDF с. 127","rst":true,"dendi":"Kpe fɔlɔnku ya goono nda naane fɔlɔnku nda mirandiyom fɔlɔnku.","source":"NT95, Еф 4:5, PDF с. 127","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127","pub":"один Господь, одна вера, одно крещение,","lit":"Есть один Господь, одна вера и одно крещение.","parse":"Kpe — Господь; fɔlɔnku — один; единственный в данном перечислении; ya — выделительный элемент; goono — быть в наличии; nda — и; связь перечисления; naane — вера; mirandiyom — крещение; производная форма в религиозном контексте.","note":"Naane здесь существительное, как показывают параллельные именные группы. Mirandiyom не переведено как обычное мытьё. Fɔlɔnku не заменено редактором на fɔ."},{"k":3,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."}],"refs":[{"t":"NT18, Рим 14:22","u":"https://zeno.fm/bible/DDNBIV/ROM/14/"},{"t":"NT18, Евр 11:2","u":"https://zeno.fm/bible/DDNBIV/HEB/11/"},{"t":"NT18, 2 Кор 5:7","u":"https://zeno.fm/bible/DDNBIV/2CO/5/"},{"t":"NT18, Иак 2:17","u":"https://zeno.fm/bible/DDNBIV/JAS/2/"},{"t":"NT18, Иак 2:26","u":"https://zeno.fm/bible/DDNBIV/JAS/2/"},{"t":"NT95, Еф 4:5, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"},{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Часть речи определяется окружением. В конструкции gunda naane это объект обладания. Не все употребления naane следует переводить существительным."},{"n":12,"title":"Верёвка","letter":"В","variants":[{"label":"","form":"kɔrɔfɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 2:15","u":"https://zeno.fm/bible/DDNBIV/JHN/2/"},{"t":"NT18, Деян 27:32","u":"https://zeno.fm/bible/DDNBIV/ACT/27/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":61,"sci":"H, §E №34, с. 32. Практическая орфография и контекст требуют сверки."},{"n":13,"title":"Верить; считать истинным","letter":"В","variants":[{"label":"I","form":"naane","notes":["Глаголы.","Глагол с объектом à gaa: вера/доверие к лицу. П32 отрицательное, П33 утвердительное употребление. Это не имя «вера» из П5, П34, П35. Два новых примера принадлежат одной переводческой традиции."],"full":2,"status":"","examples":[{"k":1,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."},{"k":2,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."}],"refs":[{"t":"NT18, Ин 7:5","u":"https://zeno.fm/bible/DDNBIV/JHN/7/"},{"t":"NT18, Ин 10:42","u":"https://zeno.fm/bible/DDNBIV/JHN/10/"},{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"}]},{"label":"II","form":"cimandi","notes":["Глаголы."],"full":1,"status":"","examples":[{"k":1,"pid":"П6","head":"NT95, JHN 11:26, PDF с. 68","rst":true,"dendi":"N go cimandi nga di gaa dee?","source":"NT95, JHN 11:26, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"Веришь ли сему?","lit":"Ты считаешь это истинным?","parse":"N — ты; go — предглагольный показатель; cimandi — признавать истинным / верить; nga — то / оно; di — указательный элемент; gaa — послелог объекта отношения; dee — вопросительная частица.","note":"Сочетание nga di gaa передаёт объект веры; послелог не имеет здесь отдельного русского «на»."}],"refs":[{"t":"NT18, Ин 11:26","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Ин 5:47","u":"https://zeno.fm/bible/DDNBIV/JHN/5/"},{"t":"NT18, 2 Тим 3:14","u":"https://zeno.fm/bible/DDNBIV/2TI/3/"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Naane и cimandi не объявляются взаимозаменяемыми во всех конструкциях. В приведённых случаях объект веры может вводиться послелогом gaa; cimandi связано с признанием истинности сообщения."},{"n":14,"title":"Ветер","letter":"В","variants":[{"label":"I","form":"hɛo","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 172","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=172"}]},{"label":"II","form":"heo","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 3:8","u":"https://zeno.fm/bible/DDNBIV/JHN/3/"}]},{"label":"III","form":"heu","notes":["Солнце и ветер в описании круговорота воды."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL64, PDF с. 10","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=10"},{"t":"ANT, PDF с. 1","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_8.pdf#page=1"},{"t":"AL65, PDF с. 103","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=103"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":163,"meaning":"heo — орфография NT18, hɛo — запись NT95.","sci":"H, §E №124, с. 38. Практическая орфография и контекст требуют сверки."},{"n":15,"title":"Вещь; нечто","letter":"В","variants":[{"label":"I","form":"hɛ","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."},{"k":2,"pid":"П45","head":"NT95, Мф 13:51, PDF с. 13","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."}],"refs":[{"t":"NT95, JHN 1:46, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"},{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"NT95, Мф 13:51, PDF с. 13","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13"}]},{"label":"II","form":"hɛi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"В П9 — hɛ fɔ «что-либо»; в П22 hɛika обозначает вещи в относительной группе. Разложение компактной учебной записи оговорено."},{"n":16,"title":"Видеть","letter":"В","variants":[{"label":"I","form":"di","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П22","head":"AL65, PDF с. 29","rst":false,"dendi":"Cìi hɛika n go dia.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Скажи вещи, которые ты видишь.","parse":"Cìi — сказать, здесь побуждение; hɛika — вещи, которые; слитная запись в пособии; n — ты; go — предглагольный показатель; dia — видеть.","note":"Тон Cìi сохранён. Компактная запись hɛika не раздвинута пробелами под видом оригинальной цитаты; пословный разбор поясняет её функцию."}],"refs":[{"t":"NT95, PDF с. 112","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=112"},{"t":"NT18, Мф 28:6","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"},{"t":"NT18, Лк 2:30","u":"https://zeno.fm/bible/DDNBIV/LUK/2/"}]},{"label":"II","form":"dia","notes":["В конструкции «не видит»; отличается от diyom и иных форм по грамматике."],"full":1,"status":"","examples":[{"k":1,"pid":"П22","head":"AL65, PDF с. 29","rst":false,"dendi":"Cìi hɛika n go dia.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Скажи вещи, которые ты видишь.","parse":"Cìi — сказать, здесь побуждение; hɛika — вещи, которые; слитная запись в пособии; n — ты; go — предглагольный показатель; dia — видеть.","note":"Тон Cìi сохранён. Компактная запись hɛika не раздвинута пробелами под видом оригинальной цитаты; пословный разбор поясняет её функцию."}],"refs":[{"t":"AL65, PDF с. 21","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=21"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"},{"t":"AL65, PDF с. 104","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104"},{"t":"AL64, PDF с. 6","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=6"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":101,"sci":"H, §E №166, с. 41. Практическая орфография и контекст требуют сверки."},{"n":17,"title":"Владеть языком; говорить на языке","letter":"В","variants":[{"label":"","form":"ŋmaani","notes":["Глагольное употребление в вопросе о греческом."],"full":1,"status":"","examples":[{"k":1,"pid":"П10","head":"NT18, ACT 21:37","rst":true,"dendi":"N ŋmaani Garɛku cine ba?","source":"NT18, ACT 21:37","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"ты знаешь по‐гречески?","lit":"Ты владеешь греческим языком?","parse":"N — ты; ŋmaani — владеть языком / говорить на языке в этом употреблении; Garɛku — греческий; cine — язык; ba — вопросительная частица.","note":"Омографическое ŋmaani «иной» в других местах не смешано с этим употреблением. В NT95, PDF с. 92, в том же вопросе напечатано cinɛ. Это два издания одного контекста."}],"refs":[{"t":"NT18, Деян 21:37","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT95, Деян. 21:37, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Подтверждён один контекст, Деян. 21:37. Параллель NT95 не создаёт второго независимого примера. В других местах графическое ŋmaani обозначает «другой / иной»; эти места не свидетельствуют о значении владения языком. Отношение омографии, тонов и этимологии здесь не установлено."},{"n":18,"title":"Внутренности","letter":"В","variants":[{"label":"I","form":"gunde kuna jiine yom","notes":["Описательное сочетание «вещи внутри живота», а не отдельная лексема."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]},{"label":"II","form":"gunde kuna jiine","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 1:18","u":"https://zeno.fm/bible/DDNBIV/ACT/1/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":86,"meaning":"Описательное сочетание «вещи внутри живота», не отдельная лексема."},{"n":19,"title":"Вода","letter":"В","variants":[{"label":"I","form":"hari","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П36","head":"AL65, PDF с. 17","rst":false,"dendi":"Iri ma sí hari ziibandi.","source":"AL65, PDF с. 17","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Пусть мы не загрязняем воду.","parse":"Iri — мы; ma — побудительный показатель; sí — отрицание; тон источника сохранён; hari — вода; ziibandi — загрязнять.","note":"Учебная фраза о сохранении чистоты воды. Ziibandi — глагол изменения состояния, а не прилагательное «грязный»."},{"k":2,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:11","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL64, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=22"},{"t":"AL65, PDF с. 95","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=95"},{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"},{"t":"AL64, PDF с. 23","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=23"},{"t":"AL65, PDF с. 17","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]},{"label":"II","form":"harri kware","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"SM19, § 2, печ. с. 1","u":"https://journals.openedition.org/ethnoecologie/4356"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":150,"meaning":"Отдельно приведено выражение из этнографической статьи SM19 в авторском написании; оно не считается установленной самостоятельной словарной формой.","sci":"H, §E №127, с. 38. Практическая орфография и контекст требуют сверки."},{"n":20,"title":"Волосы","letter":"В","variants":[{"label":"I","form":"bɔm hamini","notes":["Сочетание «волосы головы», а не единый корень."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 112","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=112"}]},{"label":"II","form":"hamini","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 3:4","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Мф 10:30","u":"https://zeno.fm/bible/DDNBIV/MAT/10/"},{"t":"NT18, Лк 21:18","u":"https://zeno.fm/bible/DDNBIV/LUK/21/"},{"t":"NT18, Ин 11:2","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"}]},{"label":"III","form":"bɔm-hamini","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 10:30","u":"https://zeno.fm/bible/DDNBIV/MAT/10/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":71,"meaning":"hamini — волос/шерсть; bɔm-hamini — волосы головы.","sci":"H, §E №95, с. 36. Практическая орфография и контекст требуют сверки."},{"n":21,"title":"Воскресенье","letter":"В","variants":[{"label":"","form":"alaadi","notes":["Название дня в полном недельном перечне AL65. Тон в этой записи не обозначен."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":22,"title":"Вошь","letter":"В","variants":[],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":48,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию.","sci":"AZ, №22. Практическая орфография и контекст требуют сверки."},{"n":23,"title":"Все","letter":"В","variants":[{"label":"","form":"kulu","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":2,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:5","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 7","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=7"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"},{"t":"AL65, PDF с. 103","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=103"},{"t":"AL64, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=4"},{"t":"AL65, PDF с. 105","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=105"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":17},{"n":24,"title":"Вторник","letter":"В","variants":[{"label":"","form":"atalaata","notes":["Название дня в полном недельном перечне AL65. Тон в этой записи не обозначен."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":25,"title":"Вы","letter":"В","variants":[{"label":"I","form":"wom","notes":[],"full":3,"status":"","examples":[{"k":1,"pid":"П11","head":"NT95, JHN 1:38, PDF с. 60","rst":true,"dendi":"Ifɔ wom go ceeci?","source":"NT95, JHN 1:38, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"что вам надобно?","lit":"Что вы ищете?","parse":"Ifɔ — что?; wom — вы; go — предглагольный показатель; ceeci — искать.","note":"Параллельный Синодальный перевод передаёт вопрос иначе; дословный дендийский перевод не подменён им."},{"k":2,"pid":"П23","head":"NT95, Мф 24:25, PDF с. 20","rst":true,"dendi":"Guna, a jina ka cii wom sɛ kɔ.","source":"NT95, Мф 24:25, PDF с. 20","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20","pub":"Вот, Я наперед сказал вам.","lit":"Посмотри, я уже заранее сказал вам.","parse":"Guna — посмотри; a — я; jina — предшествовать; здесь заранее; ka — связующий элемент; cii — сказать; wom — вы; sɛ — адресат: кому; kɔ — уже.","note":"Jina ka cii передаёт предварительное предупреждение; jina здесь не переводится как отдельное физическое движение."},{"k":3,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:7","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Лк 24:48","u":"https://zeno.fm/bible/DDNBIV/LUK/24/"},{"t":"NT95, Мф 24:25, PDF с. 20","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20"},{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]},{"label":"II","form":"wa","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 3:2","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"}]},{"label":"III","form":"wɔ̀","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":5,"meaning":"wom — местоимение; wa — краткая форма в повелительной конструкции. В COV побудительное обращение к читателям имеет форму wɔ̀; это не самостоятельная форма wom."},{"n":26,"title":"Выделение: ya","letter":"В","variants":[{"label":"","form":"ya","notes":["Различие употреблений подтверждается только конкретными контекстами; нетонированная запись не получает тон по догадке."],"full":null,"status":"","examples":[{"k":1,"pid":"П19","head":"COV, PDF с. 2","rst":false,"dendi":"Ifɔ̀ ya ci KOFID-19?","source":"COV, PDF с. 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Что является COVID-19?","parse":"Ifɔ̀ — что?; ya — выделительный элемент; ci — являться; KOFID-19 — COVID-19.","note":"Форма названия сохранена по заголовку; в других местах памятки есть COFID-19. Историческая памятка здесь используется как языковой материал, не как медицинское руководство. Тон вопросительного слова сохранён."},{"k":2,"pid":"П20","head":"COV, PDF с. 2","rst":false,"dendi":"Ifɔ̀yo ya ci COFID-19 màanayo?","source":"COV, PDF с. 2","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Какие [вещи] являются признаками COVID-19?","parse":"Ifɔ̀yo — какие?; форма с -yo сохранена; ya — выделительный элемент; ci — являться; COFID-19 — COVID-19; màanayo — признаки / симптомы в данном контексте.","note":"Русский буквальный перевод сохраняет вопросительную именную конструкцию; естественный смысл — «Каковы симптомы COVID-19?». Морфологическая классификация -yo отдельно не завершена; не смешивать этот пример с нейтральной словарной основой."},{"k":3,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."},{"k":4,"pid":"П34","head":"NT95, Еф 4:5, PDF с. 127","rst":true,"dendi":"Kpe fɔlɔnku ya goono nda naane fɔlɔnku nda mirandiyom fɔlɔnku.","source":"NT95, Еф 4:5, PDF с. 127","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127","pub":"один Господь, одна вера, одно крещение,","lit":"Есть один Господь, одна вера и одно крещение.","parse":"Kpe — Господь; fɔlɔnku — один; единственный в данном перечислении; ya — выделительный элемент; goono — быть в наличии; nda — и; связь перечисления; naane — вера; mirandiyom — крещение; производная форма в религиозном контексте.","note":"Naane здесь существительное, как показывают параллельные именные группы. Mirandiyom не переведено как обычное мытьё. Fɔlɔnku не заменено редактором на fɔ."},{"k":5,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":6,"pid":"П40","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ kuna, jibiri 7 ya goono.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одной неделе имеются семь дней.","parse":"Azuma — неделя; fɔ́ — один; kuna — внутри; в; jibiri — день в календарной строке; 7 — семь; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Jibiri сохранено как в пособии; не исправлено автоматически на jiribi из иных текстов. Другие варианты статьи «День» не объявлены взаимозаменяемыми во всех сочетаниях."},{"k":7,"pid":"П42","head":"CAL, PDF с. 22","rst":false,"dendi":"Sooro fo ga, tuurinya 55 ya goono.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном ряду имеются 55 деревянных элементов.","parse":"Sooro — ряд; fo — один; написание CAL; ga — в; пространственный элемент; tuurinya — деревянный элемент в строительной задаче; 55 — пятьдесят пять; цифровая запись; ya — выделительный элемент; goono — быть в наличии.","note":"Печатная с. 41: задача о древесине для строительства. Здесь речь о строительных элементах, поэтому перевод «55 растущих деревьев» не используется. Форма tuurinya совпадает графически с вариантами растительного термина; значение устанавливается контекстом."}],"refs":[{"t":"NT18, Деян. 22:27","u":"https://zeno.fm/bible/DDNBIV/ACT/22/"},{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"},{"t":"NT95, Еф 4:5, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"},{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]}],"extra_refs":[{"t":"NT18, Ин 1:23","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 1:49","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Деян 2:12","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Ин 18:38","u":"https://zeno.fm/bible/DDNBIV/JHN/18/"}],"stray":[],"kind":"extra","meaning":"Выделительный элемент в выбранных конструкциях; не универсальная вопросительная частица. Не все графические ya имеют одну функцию."},{"n":27,"title":"Вытирать","letter":"В","variants":[{"label":"I","form":"haabu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 13:5","u":"https://zeno.fm/bible/DDNBIV/JHN/13/"},{"t":"NT18, Лк 15:8","u":"https://zeno.fm/bible/DDNBIV/LUK/15/"},{"t":"NT18, Ин 11:2","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Лк 7:38","u":"https://zeno.fm/bible/DDNBIV/LUK/7/"}]},{"label":"II","form":"háábu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 98","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=98"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":133},{"n":28,"title":"Выходить; происходить из","letter":"В","variants":[{"label":"","form":"hunu","notes":["Глагол."],"full":1,"status":"","examples":[{"k":1,"pid":"П9","head":"NT95, JHN 1:46, PDF с. 60","rst":true,"dendi":"Hɛ fɔ hinno hini ka hunu Nazarɛtu dee?","source":"NT95, JHN 1:46, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"из Назарета может ли быть что доброе?","lit":"Может ли что-либо хорошее происходить из Назарета?","parse":"Hɛ — вещь / нечто; fɔ — некий / один; hinno — хороший; hini — мочь; ka — связующий элемент перед зависимым глаголом; hunu — выходить / происходить; Nazarɛtu — Назарет; dee — вопросительная частица.","note":"Hɛ fɔ передано вместе как «что-либо»; hunu здесь означает происхождение, а не прибытие."}],"refs":[{"t":"NT18, Деян 17:33","u":"https://zeno.fm/bible/DDNBIV/ACT/17/"},{"t":"NT18, Лк 22:62","u":"https://zeno.fm/bible/DDNBIV/LUK/22/"},{"t":"NT18, Мк 11:19","u":"https://zeno.fm/bible/DDNBIV/MRK/11/"},{"t":"NT18, Ин 4:30","u":"https://zeno.fm/bible/DDNBIV/JHN/4/"},{"t":"NT18, Ин 1:46","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"}]}],"extra_refs":[],"stray":[],"kind":"extra","meaning":"Значения движения наружу и происхождения различаются по контексту; это не универсальный эквивалент русского «приходить»."},{"n":29,"title":"Где","letter":"Г","variants":[{"label":"","form":"mani","notes":["Вопросительное слово."],"full":1,"status":"","examples":[{"k":1,"pid":"П12","head":"NT18, JHN 1:38","rst":true,"dendi":"Coobaaba, mani n goono nda gɔrɛ?","source":"NT18, JHN 1:38","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Равви́ (что значит: «учитель»), где живешь?","lit":"Учитель, где ты проживаешь?","parse":"Coobaaba — учитель; mani — где?; n — ты; goono — пребывать; nda — элемент глагольного сочетания; gɔrɛ — проживать.","note":"Goоno nda gɔrɛ разбирается как сочетание; nda не переводится механически русским «с». Синодальное «Равви» входит в опубликованный параллельный текст."}],"refs":[{"t":"NT95, PDF с. 22","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=22"},{"t":"NT18, Мф 2:2","u":"https://zeno.fm/bible/DDNBIV/MAT/2/"},{"t":"NT18, 1 Кор 15:55","u":"https://zeno.fm/bible/DDNBIV/1CO/15/"},{"t":"NT18, Ин 9:12","u":"https://zeno.fm/bible/DDNBIV/JHN/9/"},{"t":"NT18, Иак 4:1","u":"https://zeno.fm/bible/DDNBIV/JAS/4/"},{"t":"NT18, Рим 3:27","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Ин 7:11","u":"https://zeno.fm/bible/DDNBIV/JHN/7/"},{"t":"NT18, Лк 22:9","u":"https://zeno.fm/bible/DDNBIV/LUK/22/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":13,"meaning":"Сочетается с указанием места и источника. После za может спрашивать «откуда?». Не смешивать с одноимённым глагольным употреблением, отмеченным в статье об обонянии."},{"n":30,"title":"Гладкий","letter":"Г","variants":[],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":193,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":31,"title":"Глаз","letter":"Г","variants":[{"label":"I","form":"moo","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 31","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=31"},{"t":"NT18, Мф 18:9","u":"https://zeno.fm/bible/DDNBIV/MAT/18/"},{"t":"NT18, Лк 2:30","u":"https://zeno.fm/bible/DDNBIV/LUK/2/"},{"t":"NT18, Мк 8:18","u":"https://zeno.fm/bible/DDNBIV/MRK/8/"}]},{"label":"II","form":"mɔɔize","notes":["В перечне частей головы; сложное наименование глаза/его части. Не приравнивать безоговорочно к общему moo."],"full":1,"status":"","examples":[{"k":1,"pid":"П46","head":"AL65, PDF с. 29","rst":false,"dendi":"Bom gonda hangayo, mɔɔize, ninɛ, mɛɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Голова имеет уши, глаза, нос, рот.","parse":"Bom — голова; gonda — иметь; hangayo — уши; форма источника с -yo; mɔɔize — глаза в данном перечислении органов головы; ninɛ — нос; mɛɛ — рот.","note":"Полное предложение из учебного описания тела. Число органов в русском переводе следует анатомическому перечислению; оно не приписывается единому суффиксу у всех дендийских слов. Здесь mɔɔize названо в ряду органов головы; специальное различие «глаз / зрачок» этим предложением отдельно не устанавливается."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]},{"label":"III","form":"mɔ̀ɔyo","notes":["Глаз/глаза; форма с -yo и тоном."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"COV, PDF с. 4","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":74,"sci":"H, §E №98, с. 36. Практическая орфография и контекст требуют сверки."},{"n":32,"title":"Гнилой","letter":"Г","variants":[{"label":"I","form":"fumbɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Еф 4:29","u":"https://zeno.fm/bible/DDNBIV/EPH/4/"},{"t":"AL64, PDF с. 11","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=11"}]},{"label":"II","form":"fumbɔyo","notes":["О застойной/испорченной воде; форма с -yo, не подтверждение общего прилагательного «гнилой»."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 9","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=9"},{"t":"AL65, PDF с. 98","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=98"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":187,"meaning":"fumbɔ — «гнилой/дурной», о речи; физическое гниение отдельно не подтверждено.","sci":"H, §E №159, с. 41. Практическая орфография и контекст требуют сверки."},{"n":33,"title":"Говорить","letter":"Г","variants":[{"label":"I","form":"cii, cìi","notes":["Cii/Cìi употреблено при передаче сказанного и в учебном побуждении. Тон Cìi не перенесён механически на нетонированные записи NT. Полный учебный пример — П22.","Передача сообщения, ответная реплика и предупреждение подтверждены П23–П26; учебное побуждение — П22. Предикат cii вводит сказанное с адресатом sɛ. Это наблюдение о выбранных конструкциях, не запрет иной сочетаемости."],"full":null,"status":"","examples":[{"k":1,"pid":"П22","head":"AL65, PDF с. 29","rst":false,"dendi":"Cìi hɛika n go dia.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Скажи вещи, которые ты видишь.","parse":"Cìi — сказать, здесь побуждение; hɛika — вещи, которые; слитная запись в пособии; n — ты; go — предглагольный показатель; dia — видеть.","note":"Тон Cìi сохранён. Компактная запись hɛika не раздвинута пробелами под видом оригинальной цитаты; пословный разбор поясняет её функцию."},{"k":2,"pid":"П23","head":"NT95, Мф 24:25, PDF с. 20","rst":true,"dendi":"Guna, a jina ka cii wom sɛ kɔ.","source":"NT95, Мф 24:25, PDF с. 20","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20","pub":"Вот, Я наперед сказал вам.","lit":"Посмотри, я уже заранее сказал вам.","parse":"Guna — посмотри; a — я; jina — предшествовать; здесь заранее; ka — связующий элемент; cii — сказать; wom — вы; sɛ — адресат: кому; kɔ — уже.","note":"Jina ka cii передаёт предварительное предупреждение; jina здесь не переводится как отдельное физическое движение."},{"k":3,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."},{"k":4,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."},{"k":5,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."},{"k":6,"pid":"П44","head":"NT95, Ин 1:21, PDF с. 60","rst":true,"dendi":"Ǹ cii: Ni no andebi di? À tu ka cii. Awo.","source":"NT95, Ин 1:21, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"Пророк? Он отвечал: нет.","lit":"Они сказали: ты — тот пророк? Он ответил: нет.","parse":"Ǹ — они; cii — сказать; Ni — ты; no — предикативный элемент; andebi — пророк; di — определительный элемент; À — он; tu — ответить; ka — связь действий; Awo — нет.","note":"Вопрос без ba и dee; ответ Awo приведён вместе с вопросом. Перед Awo в издании напечатана точка после cii; она сохранена, хотя русский перевод оформляет ответ двоеточием. Cii во второй части также означает «сказать». Полный русский стих включает предшествующий вопрос об Илии; здесь приведена соответствующая часть."},{"k":7,"pid":"П45","head":"NT95, Мф 13:51, PDF с. 13","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."},{"k":8,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:2","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"AL65, PDF с. 21","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=21"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"AL64, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=5"},{"t":"AL65, PDF с. 108","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=108"},{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=100"},{"t":"AL65, PDF с. 103","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=103"},{"t":"NT95, Мф 24:25, PDF с. 20","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20"},{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"},{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"},{"t":"NT95, Ин 1:21, PDF с. 60","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60"},{"t":"NT95, Мф 13:51, PDF с. 13","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]},{"label":"II","form":"sendi","notes":["Sendi описывает речевое действие; в П13 указаны адресаты и язык. В других местах sendi — существительное «слово/сообщение». Различие cii/sendi подтверждено выбранными конструкциями, но универсальный запрет взаимозамены не установлен.","П27: беседа с собеседником nda; П28: тема bɔm и адресат sɛ; П29: регулируемая речь; П30–П31: указание языка nda cinɛ. Значение глагольное. Все шесть полных примеров этого подраздела принадлежат одной библейской традиции: независимое жанровое разнообразие здесь пока недостаточно."],"full":null,"status":"","examples":[{"k":1,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":2,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":3,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":4,"pid":"П29","head":"NT95, 1 Кор 14:29, PDF с. 114","rst":true,"dendi":"Andebi hinka wala ihinza mo ma sendi.","source":"NT95, 1 Кор 14:29, PDF с. 114","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114","pub":"И пророки пусть говорят двое или трое, а прочие пусть рассуждают.","lit":"Двое пророков или трое также пусть говорят.","parse":"Andebi — пророки; hinka — два; wala — или; ihinza — трое; форма при обозначении людей; mo — также; ma — побудительный/желательный показатель; sendi — говорить.","note":"Это полное первое предложение дендийского стиха. Русский параллельный стих также включает указание прочим слушателям; оно не добавлено в дословный перевод отсутствующей здесь второй фразы."},{"k":5,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":6,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT18, Деян. 21:40","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT18, Деян. 22:2","u":"https://zeno.fm/bible/DDNBIV/ACT/22/"},{"t":"NT18, Мк 7:35","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, 1 Кор 14:29, PDF с. 114","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[{"t":"NT18, Деян 2:4","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, 1 Кор 14:2","u":"https://zeno.fm/bible/DDNBIV/1CO/14/"}],"stray":[],"kind":"swadesh","swadesh":140,"sci":"H, §E №181, с. 42. Практическая орфография и контекст требуют сверки."},{"n":34,"title":"Год","letter":"Г","variants":[{"label":"","form":"jiiri","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П38","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri fɔ́ kuna, handu 12 ya goono nda azuma 52.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"В одном году имеются 12 месяцев и 52 недели.","parse":"Jiiri — год; fɔ́ — один; kuna — внутри; в; handu — месяц в календарном контексте; 12 — двенадцать; цифровая запись источника; ya — выделительный элемент; goono — быть в наличии; nda — и; azuma — неделя; 52 — пятьдесят два; цифровая запись.","note":"Упрощённая учебная модель календаря: 52 недели не равны точно продолжительности любого года. Handu здесь календарный месяц, не небесное тело «луна». Тон fɔ́ сохранён."},{"k":2,"pid":"П47","head":"AL65, PDF с. 70","rst":false,"dendi":"Jiiri kubantɛ gonda jibiri 365.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Невисокосный год имеет 365 дней.","parse":"Jiiri — год; kubantɛ — невисокосный; значение в сочетании jiiri kubantɛ; gonda — иметь; jibiri — день; 365 — триста шестьдесят пять; цифровая запись источника.","note":"Предложение входит в противопоставление обычного и високосного года. Kubantɛ не объявляется универсальным переводом прилагательного «обычный» вне календарного сочетания. Цифра сохранена; дендийское словесное название числа не восстановлено по догадке."}],"refs":[{"t":"NT95, PDF с. 91","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=91"},{"t":"NT18, Мф 9:20","u":"https://zeno.fm/bible/DDNBIV/MAT/9/"},{"t":"AL65, PDF с. 25","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=25"},{"t":"AL64, PDF с. 10","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=10"},{"t":"AL65, PDF с. 109","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=109"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"},{"t":"AL65, PDF с. 81","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=81"},{"t":"AL65, PDF с. 79","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=79"},{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":179,"sci":"H, §E №123, с. 38. Практическая орфография и контекст требуют сверки."},{"n":35,"title":"Голова","letter":"Г","variants":[{"label":"I","form":"bɔm","notes":["Также «сам; собственная личность» в других конструкциях."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 112","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=112"},{"t":"NT18, Мф 10:30","u":"https://zeno.fm/bible/DDNBIV/MAT/10/"},{"t":"NT18, Лк 21:18","u":"https://zeno.fm/bible/DDNBIV/LUK/21/"}]},{"label":"II","form":"bom","notes":["В описании частей тела."],"full":3,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":2,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","pub":"Готовый официальный/опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."},{"k":3,"pid":"П46","head":"AL65, PDF с. 29","rst":false,"dendi":"Bom gonda hangayo, mɔɔize, ninɛ, mɛɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","pub":"Опубликованный русский перевод этой фразы в доступных источниках не найден.","lit":"Голова имеет уши, глаза, нос, рот.","parse":"Bom — голова; gonda — иметь; hangayo — уши; форма источника с -yo; mɔɔize — глаза в данном перечислении органов головы; ninɛ — нос; mɛɛ — рот.","note":"Полное предложение из учебного описания тела. Число органов в русском переводе следует анатомическому перечислению; оно не приписывается единому суффиксу у всех дендийских слов. Здесь mɔɔize названо в ряду органов головы; специальное различие «глаз / зрачок» этим предложением отдельно не устанавливается."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":72,"meaning":"Среди примеров встречаются сложные слова и числительные с данным компонентом; значение целого шире значения основы.","sci":"H, §E №92, с. 36. Практическая орфография и контекст требуют сверки."},{"n":36,"title":"Гора","letter":"Г","variants":[{"label":"I","form":"gure","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 57","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=57"},{"t":"NT18, Лк 3:5","u":"https://zeno.fm/bible/DDNBIV/LUK/3/"},{"t":"ANT, PDF с. 1","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_8.pdf#page=1"}]},{"label":"II","form":"tondi-kuuku","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 4:29","u":"https://zeno.fm/bible/DDNBIV/LUK/4/"},{"t":"NT18, Ин 8:1","u":"https://zeno.fm/bible/DDNBIV/JHN/8/"},{"t":"NT18, Мк 5:11","u":"https://zeno.fm/bible/DDNBIV/MRK/5/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":171,"meaning":"tondi-kuuku — гора/возвышенность; gure — гора/холм, различие требует словаря.","sci":"AZ, №86. Практическая орфография и контекст требуют сверки."},{"n":37,"title":"Гореть","letter":"Г","variants":[{"label":"I","form":"tɔnu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 3:10","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, 1 Тим 4:2","u":"https://zeno.fm/bible/DDNBIV/1TI/4/"},{"t":"NT18, 1 Кор 3:15","u":"https://zeno.fm/bible/DDNBIV/1CO/3/"}]},{"label":"II","form":"dii","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Откр 8:7","u":"https://zeno.fm/bible/DDNBIV/REV/8/"},{"t":"NT18, Евр 12:18","u":"https://zeno.fm/bible/DDNBIV/HEB/12/"}]}],"extra_refs":[],"stray":[],"kind":"swadesh","swadesh":169,"meaning":"tɔnu — жечь/сжечь (переходный глагол); dii — гореть/сгореть в Откр 8:7.","sci":"AZ, №84. Практическая орфография и контекст требуют сверки."},{"n":38,"title":"Господь","letter":"Г","variants":[{"label":"","form":"Kpe","notes":["Религиозное обращение/именование; светское значение «хозяин» этими примерами отдельно не подтверждено."],"full":2,"status":"","examples":[{"k":1,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."},{"k":2,"pid":"П34","head":"NT95, Еф 4:5, PDF с. 127","rst":true,"dendi":"Kpe fɔlɔnku ya goono nda naane fɔlɔnku nda mirandiyom fɔlɔnku.","source":"NT95, Еф 4:5, PDF с. 127","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127","pub":"один Господь, одна вера, одно крещение,","lit":"Есть один Господь, одна вера и одно крещение.","parse":"Kpe — Господь; fɔlɔnku — один; единственный в данном перечислении; ya — выделительный элемент; goono — быть в наличии; nda — и; связь перечисления; naane — вера; mirandiyom — крещение; производная форма в религиозном контексте.","note":"Naane здесь существительное, как показывают параллельные именные группы. Mirandiyom не переведено как обычное мытьё. Fɔlɔnku не заменено редактором на fɔ."}],"refs":[{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"},{"t":"NT95, Еф 4:5, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"}]}],"extra_refs":[],"stray":[],"kind":"extra"},{"n":39,"title":"Греческий; грек","letter":"Г","variants":[{"label":"","form":"Garɛku","notes":["Название народа; определение при названии языка."],"full":1,"status":"","examples":[{"k":1,"pid":"П10","head":"NT18, ACT 21:37","rst":true,"dendi":"N ŋmaani Garɛku cine ba?","source":"NT18, ACT 21:37","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"ты знаешь по‐гречески?","lit":"Ты владеешь греческим языком?","parse":"N — ты; ŋmaa
