ACT/20/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":107,"sci":"AZ, №60. Практическая орфография и контекст требуют сверки."},{"n":302,"title":"Спина","letter":"С","variants":[{"label":"I","form":"banda-daari","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Рим 11:10","u":"https://zeno.fm/bible/DDNBIV/ROM/11/"}]},{"label":"II","form":"bandadaari","notes":["Слитное написание, в отличие от banda-daari NT18."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":88,"sci":"H, §E №111, с. 37. Практическая орфография и контекст требуют сверки."},{"n":303,"title":"Спирт","letter":"С","variants":[{"label":"","form":"alkɔɔlu","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П70","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Спирт; название компонента средства в П70.","related":"П70."},{"n":304,"title":"Среда","letter":"С","variants":[{"label":"","form":"alaruba","notes":["Название дня в полном недельном перечне AL65. Тон в этой записи не обозначен."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":305,"title":"Средство; способ","letter":"С","variants":[{"label":"","form":"azansi","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П69","head":"AL65, PDF и печ. с. 70","rst":false,"dendi":"Sigiri barà nɔ̀ hanuyo beiyom azansi.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Календарь — средство узнавания дней.","parse":"Sigiri — календарь; barà — компонент связочной конструкции barà nɔ̀; nɔ̀ — компонент той же связочной конструкции; hanuyo — дни; beiyom — знание, узнавание; производное от bei; azansi — средство, способ.","note":"Полное определение из календарного урока. barà nɔ̀ здесь связывает тему с определением, а не вводит список, как в П48. beiyom — именное производное, не голая глагольная форма bei."},{"k":2,"pid":"П75","head":"AL65, PDF и печ. с. 33","rst":false,"dendi":"Cìnɛ̀ kulu ga, kabuyom azansi zeenɔ fɔ́ goono.","source":"AL65, PDF и печ. с. 33","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=33","lit":"В каждом языке есть один старый [традиционный] способ счёта.","parse":"Cìnɛ̀ — язык общения; kulu — каждый, весь; ga — на, в; послелог; kabuyom — счёт, действие счёта; azansi — способ; zeenɔ — старый, здесь традиционный; fɔ́ — один, некий; goono — имеется.","note":"Полное утверждение из раздела о традиционном счёте. «Традиционный» уточняет контекст zeenɔ. Тоновое написание Cìnɛ̀ не подменено cinɛ; kabuyom — название действия, не глагол kabu."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Средство, способ; в определении календаря. Не смешивается с safari «препарат».","related":"П69."},{"n":306,"title":"Старый","letter":"С","variants":[{"label":"I","form":"zeenɔ","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П75","head":"AL65, PDF и печ. с. 33","rst":false,"dendi":"Cìnɛ̀ kulu ga, kabuyom azansi zeenɔ fɔ́ goono.","source":"AL65, PDF и печ. с. 33","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=33","lit":"В каждом языке есть один старый [традиционный] способ счёта.","parse":"Cìnɛ̀ — язык общения; kulu — каждый, весь; ga — на, в; послелог; kabuyom — счёт, действие счёта; azansi — способ; zeenɔ — старый, здесь традиционный; fɔ́ — один, некий; goono — имеется.","note":"Полное утверждение из раздела о традиционном счёте. «Традиционный» уточняет контекст zeenɔ. Тоновое написание Cìnɛ̀ не подменено cinɛ; kabuyom — название действия, не глагол kabu."}],"refs":[{"t":"NT95, PDF с. 127","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=127"},{"t":"NT18, Мф 9:16","u":"https://zeno.fm/bible/DDNBIV/MAT/9/"},{"t":"AL64, PDF с. 18","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=18"},{"t":"AL65, PDF с. 33","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=33"},{"t":"NT18, Кол 3:9","u":"https://zeno.fm/bible/DDNBIV/COL/3/"}]},{"label":"II","form":"zeenɔ̀","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 103","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=103"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":184,"sci":"H, §E №162, с. 41. Практическая орфография и контекст требуют сверки."},{"n":307,"title":"Стоять","letter":"С","variants":[{"label":"","form":"cɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 81","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=81"},{"t":"NT18, Мф 20:6","u":"https://zeno.fm/bible/DDNBIV/MAT/20/"},{"t":"NT18, Деян 10:26","u":"https://zeno.fm/bible/DDNBIV/ACT/10/"},{"t":"NT18, Мк 3:25","u":"https://zeno.fm/bible/DDNBIV/MRK/3/"},{"t":"NT18, Лк 23:10","u":"https://zeno.fm/bible/DDNBIV/LUK/23/"},{"t":"NT18, Откр 11:4","u":"https://zeno.fm/bible/DDNBIV/REV/11/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":125,"sci":"H, §E №206, с. 44. Практическая орфография и контекст требуют сверки."},{"n":308,"title":"Страна","letter":"С","variants":[{"label":"","form":"Gandà","notes":["В образовательном пункте — местная языковая среда/страна. Тон сохранён по источнику."],"full":1,"status":"","examples":[{"k":1,"pid":"П41","head":"AL64, PDF с. 3","rst":false,"dendi":"Gandà ciineyo ga nda bature cinɛ ga sènnìyom nda mɛɛ ;","source":"AL64, PDF с. 3","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3","lit":"Устное говорение на языках страны и на языке европейца.","parse":"Gandà — страна; местная языковая среда в этом пункте; ciineyo — языки; форма с -yo; ga — на; элемент конструкции сферы/языка; nda — и; далее посредством; bature — европеец; cinɛ — язык; sènnìyom — говорение; контекстная производная форма; mɛɛ — рот; здесь устный способ.","note":"Полный именной пункт списка учебных целей; личного сказуемого в нём нет. Слово bature не подменено без доказательства названием конкретного языка. Морфологическое разложение sènnìyom пока не установлено. Тоны и точка с запятой сохранены."}],"refs":[{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":309,"title":"Стрелка часов","letter":"С","variants":[{"label":"","form":"sana, Sana","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П86","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Sana keena go guuru cabe no","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Маленькая стрелка показывает часы.","parse":"Sana — стрелка часов; keena — маленький; go — предглагольный показатель; guuru — час, единица времени; cabe — показывать; no — предикативно-выделительный элемент.","note":"Самостоятельная строка описания стрелок, без конечной точки в печати. Это часовая стрелка; слово «часовая» непосредственно не вставлено в цитату. keena не исправлено в cɛna или cɛɛnɛ."},{"k":2,"pid":"П87","head":"CAL, PDF с. 28, печ. с. 52","rst":false,"dendi":"Sana beeri go mintiyo cabe","source":"CAL, PDF с. 28, печ. с. 52","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=28","lit":"Большая стрелка показывает минуты.","parse":"Sana — стрелка часов; beeri — большой; go — предглагольный показатель; mintiyo — минуты, форма источника; cabe — показывать.","note":"Полная параллельная строка после П86, без конечной точки. no из предыдущей строки не дописано. mintiyo соотносится с minti на этой же печатной странице; различие формы сохранено."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Стрелка часов; в CAL маленькая указывает часы, большая — минуты. Не расширяется до стрелы или любого указателя.","related":"П86, П87."},{"n":310,"title":"Ступня","letter":"С","variants":[{"label":"","form":"cee","notes":["В сочетании «ноги и руки»; точное разграничение ступни/ноги в данном уроке не задано."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 13:5","u":"https://zeno.fm/bible/DDNBIV/JHN/13/"},{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"NT18, Деян 2:35","u":"https://zeno.fm/bible/DDNBIV/ACT/2/"},{"t":"NT18, Лк 17:16","u":"https://zeno.fm/bible/DDNBIV/LUK/17/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":80,"meaning":"cee — форма в сочетании cee yom «ступни/ноги», при мытье ног."},{"n":311,"title":"Суббота","letter":"С","variants":[{"label":"","form":"asibiti","notes":["Название дня в полном недельном перечне AL65. Тон в этой записи не обозначен."],"full":1,"status":"","examples":[{"k":1,"pid":"П48","head":"AL65, PDF с. 70","rst":false,"dendi":"Azuma fɔ́ hanuyo barà nɔ̀: atinni, atalaata, alaruba, alamisi, azuma, asibiti nda alaadi.","source":"AL65, PDF с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Дни одной недели таковы: понедельник, вторник, среда, четверг, пятница, суббота и воскресенье.","parse":"Azuma — неделя; первое употребление; fɔ́ — один; hanuyo — дни; форма источника; barà nɔ̀ — представляет следующий перечень: таковы / вот; совместная функция в данном контексте; atinni — понедельник; atalaata — вторник; alaruba — среда; alamisi — четверг; azuma — пятница; употребление внутри списка дней; asibiti — суббота; nda — и; alaadi — воскресенье.","note":"Одно предложение наглядно различает два календарных значения azuma: неделю и пятницу. Форма hanuyo сохранена, не подменена hanu или jibiri. Для barà nɔ̀ дано контекстное значение сочетания; независимая грамматическая классификация каждого компонента не объявляется установленной. Тоны сохранены по пособию."}],"refs":[{"t":"AL65, PDF с. 70","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":312,"title":"Сухой","letter":"С","variants":[{"label":"I","form":"kɔgɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 57","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=57"}]},{"label":"II","form":"kɔɔgɔ","notes":["О сухом кашле; сочетание, не характеристика предмета."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 28:3","u":"https://zeno.fm/bible/DDNBIV/ACT/28/"},{"t":"AL65, PDF с. 98","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=98"}]},{"label":"III","form":"kɔɔgu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 21:19","u":"https://zeno.fm/bible/DDNBIV/MAT/21/"},{"t":"NT18, Лк 8:6","u":"https://zeno.fm/bible/DDNBIV/LUK/8/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":195,"meaning":"kɔɔgɔ — сухой; kɔɔgu — высохнуть. Варианты NT95 сохранены отдельно. kɔɔgɔ в учебнике встречается внутри названия кашля; это контекстный пример признака сухости.","sci":"H, §E №140, с. 39. Практическая орфография и контекст требуют сверки."},{"n":313,"title":"Счёт","letter":"С","variants":[{"label":"","form":"kabuyom","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П75","head":"AL65, PDF и печ. с. 33","rst":false,"dendi":"Cìnɛ̀ kulu ga, kabuyom azansi zeenɔ fɔ́ goono.","source":"AL65, PDF и печ. с. 33","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=33","lit":"В каждом языке есть один старый [традиционный] способ счёта.","parse":"Cìnɛ̀ — язык общения; kulu — каждый, весь; ga — на, в; послелог; kabuyom — счёт, действие счёта; azansi — способ; zeenɔ — старый, здесь традиционный; fɔ́ — один, некий; goono — имеется.","note":"Полное утверждение из раздела о традиционном счёте. «Традиционный» уточняет контекст zeenɔ. Тоновое написание Cìnɛ̀ не подменено cinɛ; kabuyom — название действия, не глагол kabu."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Счёт как действие. Производное соотносится с kabu «считать», но не подменяет глагольную форму.","related":"П75."},{"n":314,"title":"Считать","letter":"С","variants":[{"label":"","form":"kabu","notes":["Считать числа."],"full":3,"status":"","examples":[{"k":1,"pid":"П51","head":"AL65, PDF и печ. с. 31","rst":false,"dendi":"Kabu zǎ 1 ka kwei 9.","source":"AL65, PDF и печ. с. 31.","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=31","lit":"Считай начиная с 1, продвигаясь до 9.","parse":"Kabu — считай; побуждение без отдельного местоимения; zǎ — начиная с, от; 1 — число 1, записанное цифрой; ka — связывает действие с последующим kwei; kwei — идти, продвигаться; в данном задании обозначает достижение верхней границы счёта; 9 — число 9, записанное цифрой.","note":"Полная инструкция перед рядом 1–9. Естественный русский перевод: «Считай от одного до девяти». Цифры не заменены дендийскими словами: их произношение эта цитата не удостоверяет. Сочетание ka kwei передаёт здесь предел «до»; отдельное kwei не объявляется универсальным предлогом «до»."},{"k":2,"pid":"П52","head":"AL65, PDF и печ. с. 32","rst":false,"dendi":"Kabu zǎ 20 nda 20, zǎ 20 ka kwei 100.","source":"AL65, PDF и печ. с. 32.","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=32","lit":"Считай по 20, начиная с 20 и продвигаясь до 100.","parse":"Kabu — считай; zǎ — от, начиная с; в первом сочетании zǎ 20 nda 20 участвует в указании шага; 20 — число 20 (три употребления); nda — связующий элемент в конструкции шага 20 nda 20; повторное zǎ — начало диапазона; ka — связь с kwei; kwei — идти, продвигаться, здесь до указанного предела; 100 — число 100.","note":"Полное задание на счёт с постоянным шагом. Сочетание zǎ 20 nda 20 в этом арифметическом контексте означает счёт двадцатками; это не сложение 20 + 20. Ожидаемый ряд: 20, 40, 60, 80, 100. Функция nda устанавливается для этой конструкции и не подменяется механически переводом «и» или «с»."},{"k":3,"pid":"П80","head":"AL65, PDF и печ. с. 59","rst":false,"dendi":"Nɔɔru ka à cindi kɛ̀ɛsu kuna kabu.","source":"AL65, PDF и печ. с. 59","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=59","lit":"Посчитай деньги, которые остались в кассе.","parse":"Nɔɔru — деньги; ka — относительная связь; à — оно, отсылка к оставшейся сумме; cindi — оставаться; kɛ̀ɛsu — касса, денежный ящик; kuna — внутри, в; kabu — считать, посчитай.","note":"Целая инструкция в задаче о школьной кассе. Требуется остаток после покупки. Денди использует à, хотя естественный русский перевод «деньги» требует множественного числа."}],"refs":[{"t":"NT95, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT18, Мф 10:30","u":"https://zeno.fm/bible/DDNBIV/MAT/10/"},{"t":"AL65, PDF с. 31","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=31"},{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=100"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"},{"t":"AL65, PDF с. 103","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=103"},{"t":"NT18, Деян 1:17","u":"https://zeno.fm/bible/DDNBIV/ACT/1/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":139,"sci":"H, §E №168, с. 41. Практическая орфография и контекст требуют сверки."},{"n":315,"title":"Так: ya di","letter":"Т","variants":[{"label":"","form":"ya di","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П92","head":"NT18, Ин 1:37","rst":true,"dendi":"Coobaaba-ize hinka di maa Yohana go sendi ya di. Ǹ na Yesu gana.","source":"NT18, Ин 1:37","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Услышав от него сии слова, оба ученика пошли за Иисусом.","lit":"Те два ученика услышали, как Иоанн говорит так. Они последовали за Иисусом.","parse":"Coobaaba-ize — ученик, сложное слово; hinka — два; di — определительный элемент; maa — слышать; Yohana — Иоанн; go — предглагольный показатель; sendi — говорить; ya — компонент сочетания ya di «так»; di — компонент сочетания ya di; Ǹ — они; na — показатель переходного действия; Yesu — Иисус; gana — следовать за.","note":"Приведены оба предложения стиха. ya di после глагола речи передаёт «так»: его нельзя механически разобрать как выделительное ya из П19. Coobaaba-ize сохранено с дефисом. maa здесь «слышать», не «имя»."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Так; указательное сочетание после глагола речи в П92. Оба компонента ссылаются на конструкцию; их функции не приравнены к выделительному ya и всякому di.","related":"П92."},{"n":316,"title":"Также","letter":"Т","variants":[{"label":"","form":"mo","notes":["Добавочный элемент перед побудительным ma."],"full":1,"status":"","examples":[{"k":1,"pid":"П29","head":"NT95, 1 Кор 14:29, PDF с. 114","rst":true,"dendi":"Andebi hinka wala ihinza mo ma sendi.","source":"NT95, 1 Кор 14:29, PDF с. 114","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114","pub":"И пророки пусть говорят двое или трое, а прочие пусть рассуждают.","lit":"Двое пророков или трое также пусть говорят.","parse":"Andebi — пророки; hinka — два; wala — или; ihinza — трое; форма при обозначении людей; mo — также; ma — побудительный/желательный показатель; sendi — говорить.","note":"Это полное первое предложение дендийского стиха. Русский параллельный стих также включает указание прочим слушателям; оно не добавлено в дословный перевод отсутствующей здесь второй фразы."}],"refs":[{"t":"NT95, 1 Кор 14:29, PDF с. 114","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П90","head":"","rst":true,"dendi":"À goono handunya. Nga mo ya na handunya tɛ amma handunya mana à bei.","source":"NT18, Ин 1:10","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"В мире был, и мир чрез Него на́чал быть, и мир Его не познал.","lit":"Он был в мире. Он же сотворил мир, но мир его не знал.","parse":"À — он, отсылка к действующему лицу пролога; goono — находиться, быть; handunya — мир; Nga — он, самостоятельная форма; mo — также, же; ya — выделение; na — показатель переходного действия; handunya — мир; tɛ — делать, здесь сотворить; amma — но; handunya — мир; mana — отрицание; à — он, здесь его; bei — знать.","note":"Весь стих состоит из двух законченных предложений и приведён целиком. Отсылку À следует читать в контексте пролога о Слове и свете. «Мир не знал» — переносное обозначение людей мира. Прошедшее время перевода не объявлено значением goono."}],"stray":[],"kind":"extra"},{"n":317,"title":"Там","letter":"Т","variants":[{"label":"","form":"noodi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 19:29","u":"https://zeno.fm/bible/DDNBIV/JHN/19/"},{"t":"NT18, Мф 19:15","u":"https://zeno.fm/bible/DDNBIV/MAT/19/"},{"t":"NT18, Лк 2:6","u":"https://zeno.fm/bible/DDNBIV/LUK/2/"},{"t":"NT18, 2 Кор 3:17","u":"https://zeno.fm/bible/DDNBIV/2CO/3/"},{"t":"NT18, Откр 21:25","u":"https://zeno.fm/bible/DDNBIV/REV/21/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":10},{"n":318,"title":"Текст","letter":"Т","variants":[{"label":"","form":"couniji, Couniji","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П65","head":"AL65, PDF и печ. с. 62","rst":false,"dendi":"Couniji wɔ̀ cou.","source":"AL65, PDF и печ. с. 62","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=62","lit":"Прочитай этот текст.","parse":"Couniji — текст для чтения; wɔ̀ — этот; cou — читать, прочитай.","note":"Самостоятельная учебная инструкция перед текстом. Cou сохранено в написании страницы. Не следует смешивать эту инструкцию с повреждённой при извлечении PDF соседней строкой."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Текст для чтения; засвидетельствованное учебное употребление.","related":"П65."},{"n":319,"title":"Тело","letter":"Т","variants":[{"label":"I","form":"gàà","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]},{"label":"II","form":"gaaham","notes":["Именное название тела в AL65. Отличается написанием от gàà в П15; точное отношение вариантов не реконструировано."],"full":1,"status":"","examples":[{"k":1,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."}],"refs":[{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Именное употребление в сочетании bɔrɔ gàà; не послелог gaa. Тоны сохранены по AL65."},{"n":320,"title":"Тёплый; горячий","letter":"Т","variants":[{"label":"","form":"dungu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 13:6","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, Откр 3:15","u":"https://zeno.fm/bible/DDNBIV/REV/3/"},{"t":"NT18, Откр 3:16","u":"https://zeno.fm/bible/DDNBIV/REV/3/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":180,"meaning":"dungu — горячий/нагретый; форма в NT18 также глагольная.","sci":"H, §E №138, с. 39. Практическая орфография и контекст требуют сверки."},{"n":321,"title":"Тереть","letter":"Т","variants":[{"label":"","form":"wɔɔrɔ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 6:1","u":"https://zeno.fm/bible/DDNBIV/LUK/6/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":131,"meaning":"wɔɔrɔ — тереть зерно руками."},{"n":322,"title":"Терпение","letter":"Т","variants":[{"label":"","form":"suuru","notes":["Качество, возникающее через испытание веры; иные оттенки отдельно не доказаны."],"full":1,"status":"","examples":[{"k":1,"pid":"П35","head":"NT95, Иак 1:3, PDF с. 155","rst":true,"dendi":"Wom ma bei ka wom naane bubureyom go kaanda suuru.","source":"NT95, Иак 1:3, PDF с. 155","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155","pub":"зная, что испытание вашей веры производит терпение;","lit":"Вы должны знать, что испытание вашей веры приносит терпение.","parse":"Wom / wom — вы; в именной группе ваш; ma — побудительный/модальный показатель; bei — знать; ka — что; зависимая часть; naane — вера; bubureyom — испытание; контекстная производная форма; go — предглагольный показатель; kaanda — приносить; производная форма; suuru — терпение.","note":"Каанда не отождествляется с kaa «приходить». Производные bubureyom и kaanda получают отдельные статьи с оговоркой о незавершённом морфологическом анализе."}],"refs":[{"t":"NT95, Иак 1:3, PDF с. 155","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=155"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":323,"title":"Тетрадь; книга","letter":"Т","variants":[{"label":"","form":"tira","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П76","head":"AL65, PDF и печ. с. 43","rst":false,"dendi":"N mà nn maayo hantum n tira kuna.","source":"AL65, PDF и печ. с. 43","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=43","lit":"Запиши их названия в своей тетради.","parse":"N — ты; mà — побудительный показатель; nn — они, здесь их; maayo — имена, названия; hantum — записывать; n — ты, здесь твоя; tira — тетрадь, письменная книга; kuna — внутри, в.","note":"Полное второе предложение учебного пункта. В предыдущем предложении названы известные учащемуся коммуны: nn отсылает к ним. В последней строке tirakuna напечатано слитно; пробел нормализован без изменения букв."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Письменная книга, тетрадь; в П76 — тетрадь учащегося. Значение определяется учебным контекстом.","related":"П76."},{"n":324,"title":"Течь","letter":"Т","variants":[{"label":"I","form":"dooru","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 13:5","u":"https://zeno.fm/bible/DDNBIV/JHN/13/"},{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL65, PDF с. 44","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=44"},{"t":"NT18, Мк 5:25","u":"https://zeno.fm/bible/DDNBIV/MRK/5/"}]},{"label":"II","form":"dòoru","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 11","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=11"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":144,"meaning":"dooru в учебных примерах встречается переходно: лить/доливать."},{"n":325,"title":"Тогда","letter":"Т","variants":[{"label":"","form":"Cɔfɔ, cɔfɔ","notes":["Связь событий; тон отсутствует в этих записях."],"full":3,"status":"","examples":[{"k":1,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":2,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":3,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":326,"title":"Толкать","letter":"Т","variants":[{"label":"","form":"jindo","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 4:29","u":"https://zeno.fm/bible/DDNBIV/LUK/4/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":135,"sci":"H, §E №192, с. 43. Практическая орфография и контекст требуют сверки."},{"n":327,"title":"Толпа","letter":"Т","variants":[{"label":"","form":"jama","notes":["Совокупность слушающих людей; не механическое тождество bɔrɔ «человек»."],"full":1,"status":"","examples":[{"k":1,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":328,"title":"Толстый","letter":"Т","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":30,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":329,"title":"Тонкий","letter":"Т","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":35,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию.","sci":"H, §E №152, с. 40. Практическая орфография и контекст требуют сверки."},{"n":330,"title":"Тот","letter":"Т","variants":[{"label":"","form":"di","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 28:5","u":"https://zeno.fm/bible/DDNBIV/MAT/28/"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/imag часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."}],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Мф 12:40","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"},{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"AL65, PDF с. 103","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=103"},{"t":"AL65, PDF с. 109","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=109"},{"t":"AL65, PDF с. 111","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=111"}]},{"label":"II","form":"hinzà","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"CFA, PDF с. 5","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_175.pdf#page=5"}]},{"label":"III","form":"ihinza","notes":["Форма для счёта людей в сочетании о пророках; не приведена под видом неизменяемой общей основы hinza."],"full":1,"status":"","examples":[{"k":1,"pid":"П29","head":"NT95, 1 Кор 14:29, PDF с. 114","rst":true,"dendi":"Andebi hinka wala ihinza mo ma sendi.","source":"NT95, 1 Кор 14:29, PDF с. 114","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114","pub":"И пророки пусть говорят двое или трое, а прочие пусть рассуждают.","lit":"Двое пророков или трое также пусть говорят.","parse":"Andebi — пророки; hinka — два; wala — или; ihinza — трое; форма при обозначении людей; mo — также; ma — побудительный/желательный показатель; sendi — говорить.","note":"Это полное первое предложение дендийского стиха. Русский параллельный стих также включает указание прочим слушателям; оно не добавлено в дословный перевод отсутствующей здесь второй фразы."}],"refs":[{"t":"NT95, 1 Кор 14:29, PDF с. 114","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=114"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":24,"sci":"H, §E №213, с. 44. Практическая орфография и контекст требуют сверки."},{"n":333,"title":"Туловище","letter":"Т","variants":[{"label":"I","form":"gaa bindi","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]},{"label":"II","form":"gaabindi","notes":["Слитное написание AL65, с. 30; на с. 29 приведено gaa bindi. Различие записи сохранено, значение устанавливается перечислением частей тела."],"full":1,"status":"","examples":[{"k":1,"pid":"П37","head":"AL65, PDF с. 30","rst":false,"dendi":"Bɔrɔ gaaham gonda cee nda kambɛ, gaabindi nda bom.","source":"AL65, PDF с. 30","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30","lit":"Тело человека имеет ноги и руки, туловище и голову.","parse":"Bɔrɔ — человек; gaaham — тело; gonda — иметь; cee — нога; здесь ноги; nda — и; kambɛ — рука; здесь руки; gaabindi — туловище; bom — голова.","note":"Предложение дано в упражнении на оценку утверждений, а не как новое грамматическое правило. Gaabindi здесь напечатано слитно, gaa bindi в П15 раздельно. Перечень совместим с тремя группами частей в П15: ноги и руки там образуют одну группу."}],"refs":[{"t":"AL65, PDF с. 30","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=30"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Составное название средней части тела из AL65; не сведено к слову «живот»."},{"n":334,"title":"Туман","letter":"Т","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":161,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":335,"title":"Тупой","letter":"Т","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":192,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":336,"title":"Ты","letter":"Т","variants":[{"label":"I","form":"ni","notes":["Самостоятельная форма; краткая форма n зависит от позиции."],"full":2,"status":"","examples":[{"k":1,"pid":"П14","head":"NT18, JHN 1:21","rst":true,"dendi":"Ni no Eli?","source":"NT18, JHN 1:21","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"ты Илия?","lit":"Ты — Илия?","parse":"Ni — ты, самостоятельная форма; no — предикативный элемент; Eli — Илия.","note":"Вопрос без ba и dee: по письменному тексту нельзя установить точную вопросительную интонацию."},{"k":2,"pid":"П21","head":"NT95, JHN 21:12, PDF с. 75","rst":true,"dendi":"Ni no mee?","source":"NT95, JHN 21:12, PDF с. 75","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=75","pub":"кто Ты?","lit":"Ты — кто?","parse":"Ni — ты; no — предикативный элемент; mee — кто?.","note":"Полный вопрос, который ученики не решаются задать; это не вопрос на да/нет."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 3:14","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Рим 2:21","u":"https://zeno.fm/bible/DDNBIV/ROM/2/"},{"t":"NT18, 1 Кор 14:17","u":"https://zeno.fm/bible/DDNBIV/1CO/14/"},{"t":"NT18, Лк 19:19","u":"https://zeno.fm/bible/DDNBIV/LUK/19/"},{"t":"NT18, Тит 2:1","u":"https://zeno.fm/bible/DDNBIV/TIT/2/"}]},{"label":"II","form":"n, N","notes":["Краткая форма перед сказуемым; не смешивать с другими графическими n в учебных текстах."],"full":null,"status":"","examples":[{"k":1,"pid":"П1","head":"NT18, 1CO 7:27","rst":true,"dendi":"N gunda wɛndɛ ba?","source":"NT18, 1CO 7:27","source_url":"https://zeno.fm/bible/DDNBIV/1CO/7/","pub":"Соединен ли ты с женою?","lit":"Ты имеешь жену?","parse":"N — ты; gunda — иметь; wɛndɛ — жена; ba — вопросительная частица."},{"k":2,"pid":"П2","head":"NT18, 1CO 7:27","rst":true,"dendi":"N sinda wɛndɛ ba?","source":"NT18, 1CO 7:27","source_url":"https://zeno.fm/bible/DDNBIV/1CO/7/","pub":"Остался ли без жены?","lit":"Ты не имеешь жены?","parse":"N — ты; sinda — не иметь; wɛndɛ — жена; ba — вопросительная частица."},{"k":3,"pid":"П3","head":"NT18, MRK 15:4","rst":true,"dendi":"N si tu ba?","source":"NT18, MRK 15:4","source_url":"https://zeno.fm/bible/DDNBIV/MRK/15/","pub":"Ты ничего не отвечаешь?","lit":"Ты не отвечаешь?","parse":"N — ты; si — отрицание; tu — отвечать; ba — вопросительная частица."},{"k":4,"pid":"П5","head":"NT18, ROM 14:22","rst":true,"dendi":"N gunda naane ba?","source":"NT18, ROM 14:22","source_url":"https://zeno.fm/bible/DDNBIV/ROM/14/","pub":"Ты имеешь веру?","lit":"Ты имеешь веру?","parse":"N — ты; gunda — иметь; naane — вера; ba — вопросительная частица."},{"k":5,"pid":"П6","head":"NT95, JHN 11:26, PDF с. 68","rst":true,"dendi":"N go cimandi nga di gaa dee?","source":"NT95, JHN 11:26, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"Веришь ли сему?","lit":"Ты считаешь это истинным?","parse":"N — ты; go — предглагольный показатель; cimandi — признавать истинным / верить; nga — то / оно; di — указательный элемент; gaa — послелог объекта отношения; dee — вопросительная частица.","note":"Сочетание nga di gaa передаёт объект веры; послелог не имеет здесь отдельного русского «на»."},{"k":6,"pid":"П10","head":"NT18, ACT 21:37","rst":true,"dendi":"N ŋmaani Garɛku cine ba?","source":"NT18, ACT 21:37","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"ты знаешь по‐гречески?","lit":"Ты владеешь греческим языком?","parse":"N — ты; ŋmaani — владеть языком / говорить на языке в этом употреблении; Garɛku — греческий; cine — язык; ba — вопросительная частица.","note":"Омографическое ŋmaani «иной» в других местах не смешано с этим употреблением. В NT95, PDF с. 92, в том же вопросе напечатано cinɛ. Это два издания одного контекста."},{"k":7,"pid":"П12","head":"NT18, JHN 1:38","rst":true,"dendi":"Coobaaba, mani n goono nda gɔrɛ?","source":"NT18, JHN 1:38","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Равви́ (что значит: «учитель»), где живешь?","lit":"Учитель, где ты проживаешь?","parse":"Coobaaba — учитель; mani — где?; n — ты; goono — пребывать; nda — элемент глагольного сочетания; gɔrɛ — проживать.","note":"Goоno nda gɔrɛ разбирается как сочетание; nda не переводится механически русским «с». Синодальное «Равви» входит в опубликованный параллельный текст."},{"k":8,"pid":"П22","head":"AL65, PDF с. 29","rst":false,"dendi":"Cìi hɛika n go dia.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Скажи вещи, которые ты видишь.","parse":"Cìi — сказать, здесь побуждение; hɛika — вещи, которые; слитная запись в пособии; n — ты; go — предглагольный показатель; dia — видеть.","note":"Тон Cìi сохранён. Компактная запись hɛika не раздвинута пробелами под видом оригинальной цитаты; пословный разбор поясняет её функцию."}],"refs":[{"t":"NT18, Деян. 21:37","u":"https://zeno.fm/bible/DDNBIV/ACT/21/"},{"t":"NT18, 1 Кор. 7:27","u":"https://zeno.fm/bible/DDNBIV/1CO/7/"}]}],"extra_refs":[{"t":"NT18, Рим 14:22","u":"https://zeno.fm/bible/DDNBIV/ROM/14/"},{"t":"NT18, Мк 15:4","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"},{"t":"NT18, Ин 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"}],"linked":[{"k":1,"pid":"П44","head":"","rst":true,"dendi":"Ǹ cii: Ni no andebi di? À tu ka cii. Awo.","source":"NT95, Ин 1:21, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"Пророк? Он отвечал: нет.","lit":"Они сказали: ты — тот пророк? Он ответил: нет.","parse":"Ǹ — они; cii — сказать; Ni — ты; no — предикативный элемент; andebi — пророк; di — определительный элемент; À — он; tu — ответить; ka — связь действий; Awo — нет.","note":"Вопрос без ba и dee; ответ Awo приведён вместе с вопросом. Перед Awo в издании напечатана точка после cii; она сохранена, хотя русский перевод оформляет ответ двоеточием. Cii во второй части также означает «сказать». Полный русский стих включает предшествующий вопрос об Илии; здесь приведена соответствующая часть."},{"k":2,"pid":"П66","head":"","rst":false,"dendi":"N mà nufi hantum ka cou.","source":"AL65, PDF и печ. с. 66","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=66","lit":"Запиши результат и прочитай [его].","parse":"N — ты; mà — побудительный показатель; nufi — результат; hantum — писать, записывать; ka — связь действий; cou — читать.","note":"Полная инструкция к арифметическому заданию. Дополнение «его» в русском восстановлено из контекста и заключено в скобки: отдельного местоимения после cou нет."},{"k":3,"pid":"П74","head":"","rst":false,"dendi":"N mà alaama wɔ̀ gùna.","source":"AL65, PDF и печ. с. 13","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=13","lit":"Посмотри на это изображение.","parse":"N — ты; mà — побудительный показатель; alaama — изображение; wɔ̀ — этот; gùna — смотреть, посмотри.","note":"Целая инструкция перед изображением приготовления пищи. В отличие от П49, здесь выражены N и mà. В печати màalaama слито: нормализован только пробел между показателем и существительным; буквы и тоны сохранены."},{"k":4,"pid":"П76","head":"","rst":false,"dendi":"N mà nn maayo hantum n tira kuna.","source":"AL65, PDF и печ. с. 43","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=43","lit":"Запиши их названия в своей тетради.","parse":"N — ты; mà — побудительный показатель; nn — они, здесь их; maayo — имена, названия; hantum — записывать; n — ты, здесь твоя; tira — тетрадь, письменная книга; kuna — внутри, в.","note":"Полное второе предложение учебного пункта. В предыдущем предложении названы известные учащемуся коммуны: nn отсылает к ним. В последней строке tirakuna напечатано слитно; пробел нормализован без изменения букв."},{"k":5,"pid":"П81","head":"","rst":false,"dendi":"Cìi gwei ka n go tɛɛ.","source":"AL65, PDF и печ. с. 61","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=61","lit":"Скажи, какую работу ты делаешь.","parse":"Cìi — сказать, скажи; gwei — работа, действие; ka — относительная связь; n — ты; go — предглагольный показатель; tɛɛ — делать.","note":"Полный самостоятельный пункт упражнения. Буквальная структура: «назови работу, которую ты делаешь». Относительное ka не становится вопросительной частицей от русского перевода «какую». Долгое ɛɛ сохранено."},{"k":6,"pid":"П88","head":"","rst":true,"dendi":"Yesu cii à sɛ: «N harume di kaa tunu kpɛɛnɛ.»","source":"NT18, Ин 11:23","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус говорит ей: воскреснет брат твой.","lit":"Иисус сказал ей: «Твой брат снова встанет [воскреснет]».","parse":"Yesu — Иисус; cii — сказать; à — она, Марфа; sɛ — послелог адресата; N — ты, здесь твой; harume — брат; di — определительный элемент; kaa — показатель предстоящего действия в этом контексте; tunu — встать, здесь воскреснуть; kpɛɛnɛ — ещё, снова.","note":"Сохранены вводная часть и целая реплика. Речь о Лазаре, брате Марфы; отсюда контекстное «воскреснуть». kaa перед tunu не переводится вторым глаголом «приходить». harume добавлено к статье «Брат», без утверждения о полном тождестве cɛɛnɛ."}],"stray":[],"kind":"swadesh","swadesh":2,"sci":"AT, №2. Практическая орфография и контекст требуют сверки."},{"n":337,"title":"Тяжёлый","letter":"Т","variants":[{"label":"I","form":"tim","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 11:30","u":"https://zeno.fm/bible/DDNBIV/MAT/11/"},{"t":"AL65, PDF с. 108","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=108"},{"t":"NT18, 1 Ин 5:3","u":"https://zeno.fm/bible/DDNBIV/1JN/5/"},{"t":"NT18, Мк 14:40","u":"https://zeno.fm/bible/DDNBIV/MRK/14/"}]},{"label":"II","form":"timmɛ","notes":["Вес мешка в кг; существительное «вес», не прилагательное «тяжёлый»."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 47","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=47"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":31,"meaning":"tim употреблено в отрицании: бремя «не тяжело».","sci":"H, §E №153, с. 40. Практическая орфография и контекст требуют сверки."},{"n":338,"title":"Тянуть","letter":"Т","variants":[{"label":"","form":"cendi","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 21:11","u":"https://zeno.fm/bible/DDNBIV/JHN/21/"},{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"NT18, Мф 13:48","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, Мф 12:11","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"},{"t":"NT18, Ин 21:6","u":"https://zeno.fm/bible/DDNBIV/JHN/21/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":134,"meaning":"cendi — тянуть сеть.","sci":"H, §E №188, с. 42. Практическая орфография и контекст требуют сверки."},{"n":339,"title":"Убивать","letter":"У","variants":[{"label":"I","form":"wi","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П93","head":"NT18, Ин 11:53","rst":true,"dendi":"Za hanu nga di ǹ saawara ngei ma à wi.","source":"NT18, Ин 11:53","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"С этого дня положили убить Его.","lit":"С того дня они решили, чтобы они убили его.","parse":"Za — с, начиная с; hanu — день; nga — указательная отсылка в сочетании nga di; di — определительный элемент; ǹ — они; saawara — совещаться, принять решение в контексте; ngei — они, самостоятельная форма; ma — модально-побудительный показатель зависимого действия; à — он, здесь его; wi — убивать.","note":"Полное предложение после совещания, описанного в Ин 11:47–52. Решение — убить Иисуса — выражено зависимой частью. Saawara не получает отдельного значения «убивать». В отличие от русского параллельного текста, денди явно выражает субъект ngei зависимой части."}],"refs":[{"t":"NT95, PDF с. 23","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=23"},{"t":"NT18, Мк 7:10","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Ин 11:53","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Лк 23:32","u":"https://zeno.fm/bible/DDNBIV/LUK/23/"},{"t":"NT18, Деян 12:2","u":"https://zeno.fm/bible/DDNBIV/ACT/12/"}]},{"label":"II","form":"boro","notes":["Комары уничтожают/убивают людей; не путать с «человек» bɔrɔ."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"AL65, PDF с. 9","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=9"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":110,"sci":"H, §E №180, с. 42. Практическая орфография и контекст требуют сверки."},{"n":340,"title":"Ударять","letter":"У","variants":[{"label":"I","form":"sam","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Ин 18:22","u":"https://zeno.fm/bible/DDNBIV/JHN/18/"}]},{"label":"II","form":"sɔɔtɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мк 15:19","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"}]},{"label":"III","form":"karu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 12:23","u":"https://zeno.fm/bible/DDNBIV/ACT/12/"},{"t":"NT18, Мф 24:49","u":"https://zeno.fm/bible/DDNBIV/MAT/24/"},{"t":"NT18, Лк 18:13","u":"https://zeno.fm/bible/DDNBIV/LUK/18/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":113,"meaning":"sam — ударить по лицу; sɔɔtɛ — бить палкой; karu — поразить. Разные типы действия.","sci":"H, §E №177, с. 42. Практическая орфография и контекст требуют сверки."},{"n":341,"title":"Уже","letter":"У","variants":[{"label":"","form":"kɔ","notes":["В конце предварительного предупреждения. Полная аспектуальная система здесь не описана."],"full":1,"status":"","examples":[{"k":1,"pid":"П23","head":"NT95, Мф 24:25, PDF с. 20","rst":true,"dendi":"Guna, a jina ka cii wom sɛ kɔ.","source":"NT95, Мф 24:25, PDF с. 20","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20","pub":"Вот, Я наперед сказал вам.","lit":"Посмотри, я уже заранее сказал вам.","parse":"Guna — посмотри; a — я; jina — предшествовать; здесь заранее; ka — связующий элемент; cii — сказать; wom — вы; sɛ — адресат: кому; kɔ — уже.","note":"Jina ka cii передаёт предварительное предупреждение; jina здесь не переводится как отдельное физическое движение."}],"refs":[{"t":"NT95, Мф 24:25, PDF с. 20","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=20"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":342,"title":"Узкий","letter":"У","variants":[{"label":"I","form":"kankamantɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 7:13","u":"https://zeno.fm/bible/DDNBIV/MAT/7/"},{"t":"NT18, Лк 13:24","u":"https://zeno.fm/bible/DDNBIV/LUK/13/"}]},{"label":"II","form":"mariyo","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 7:14","u":"https://zeno.fm/bible/DDNBIV/MAT/7/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":34,"meaning":"kankamantɛ — узкий вход; mariyo — тесный/трудный путь. Контекстные соответствия."},{"n":343,"title":"Указательный / определительный элемент: di","letter":"У","variants":[{"label":"","form":"di","notes":["Постпозитивный элемент в выбранных конструкциях."],"full":3,"status":"","examples":[{"k":1,"pid":"П6","head":"NT95, JHN 11:26, PDF с. 68","rst":true,"dendi":"N go cimandi nga di gaa dee?","source":"NT95, JHN 11:26, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"Веришь ли сему?","lit":"Ты считаешь это истинным?","parse":"N — ты; go — предглагольный показатель; cimandi — признавать истинным / верить; nga — то / оно; di — указательный элемент; gaa — послелог объекта отношения; dee — вопросительная частица.","note":"Сочетание nga di gaa передаёт объект веры; послелог не имеет здесь отдельного русского «на»."},{"k":2,"pid":"П8","head":"NT95, MAT 12:23, PDF с. 12","rst":true,"dendi":"À na ci Dafidi ize di dee?","source":"NT95, MAT 12:23, PDF с. 12","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12","pub":"не это ли Христос, сын Давидов?","lit":"Не является ли он тем сыном Давида?","parse":"À — он; na — отрицательная функция в данном сочетании; не смешивать с показателем переходного действия; ci — являться; Dafidi — Давид; ize — сын / потомок; di — определительный элемент; dee — вопросительная частица.","note":"В опубликованном русском тексте добавлено именование «Христос»; в этой дендийской фразе слова Mɛsiya нет."},{"k":3,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."}],"refs":[{"t":"NT18, Ин 11:26","u":"https://zeno.fm/bible/DDNBIV/JHN/11/"},{"t":"NT18, Ин 1:21","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT18, Мф 12:23","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"},{"t":"NT18, Ин 9:12","u":"https://zeno.fm/bible/DDNBIV/JHN/9/"},{"t":"NT18, Ин 18:7","u":"https://zeno.fm/bible/DDNBIV/JHN/18/"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П44","head":"","rst":true,"dendi":"Ǹ cii: Ni no andebi di? À tu ka cii. Awo.","source":"NT95, Ин 1:21, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"Пророк? Он отвечал: нет.","lit":"Они сказали: ты — тот пророк? Он ответил: нет.","parse":"Ǹ — они; cii — сказать; Ni — ты; no — предикативный элемент; andebi — пророк; di — определительный элемент; À — он; tu — ответить; ka — связь действий; Awo — нет.","note":"Вопрос без ba и dee; ответ Awo приведён вместе с вопросом. Перед Awo в издании напечатана точка после cii; она сохранена, хотя русский перевод оформляет ответ двоеточием. Cii во второй части также означает «сказать». Полный русский стих включает предшествующий вопрос об Илии; здесь приведена соответствующая часть."},{"k":2,"pid":"П83","head":"","rst":false,"dendi":"Nufi di hantum ka cii.","source":"AL65, PDF и печ. с. 78","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=78","lit":"Запиши этот результат и назови [его].","parse":"Nufi — результат; di — определительный элемент, этот; hantum — записывать; ka — связь действий; cii — сказать, назвать.","note":"Полная инструкция после задачи о делении; в печати hantumka без пробела — словораздел нормализован. Соседняя формула содержит несовпадающие 249 и 239: числовая опечатка не исправляется и не переносится в выбранную словесную инструкцию."},{"k":3,"pid":"П85","head":"","rst":false,"dendi":"Ali nà mɔnturu di yeti ka nɛɛra F 9300.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али затем перепродал эти часы за 9300 франков.","parse":"Ali — Али; nà — показатель переходного действия; mɔnturu — часы; di — определительный элемент; yeti — снова, повторно в сочетании yeti ka; ka — связь действий; nɛɛra — продавать; F — обозначение франка; 9300 — цифровая запись числа 9300.","note":"Полное второе предложение той же задачи; П84 сообщает о покупке. yeti ka nɛɛra в этом контексте передано как «перепродать». Из одного примера не выводится самостоятельное значение yeti «возвращать» во всех контекстах."},{"k":4,"pid":"П88","head":"","rst":true,"dendi":"Yesu cii à sɛ: «N harume di kaa tunu kpɛɛnɛ.»","source":"NT18, Ин 11:23","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус говорит ей: воскреснет брат твой.","lit":"Иисус сказал ей: «Твой брат снова встанет [воскреснет]».","parse":"Yesu — Иисус; cii — сказать; à — она, Марфа; sɛ — послелог адресата; N — ты, здесь твой; harume — брат; di — определительный элемент; kaa — показатель предстоящего действия в этом контексте; tunu — встать, здесь воскреснуть; kpɛɛnɛ — ещё, снова.","note":"Сохранены вводная часть и целая реплика. Речь о Лазаре, брате Марфы; отсюда контекстное «воскреснуть». kaa перед tunu не переводится вторым глаголом «приходить». harume добавлено к статье «Брат», без утверждения о полном тождестве cɛɛnɛ."},{"k":5,"pid":"П92","head":"","rst":true,"dendi":"Coobaaba-ize hinka di maa Yohana go sendi ya di. Ǹ na Yesu gana.","source":"NT18, Ин 1:37","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Услышав от него сии слова, оба ученика пошли за Иисусом.","lit":"Те два ученика услышали, как Иоанн говорит так. Они последовали за Иисусом.","parse":"Coobaaba-ize — ученик, сложное слово; hinka — два; di — определительный элемент; maa — слышать; Yohana — Иоанн; go — предглагольный показатель; sendi — говорить; ya — компонент сочетания ya di «так»; di — компонент сочетания ya di; Ǹ — они; na — показатель переходного действия; Yesu — Иисус; gana — следовать за.","note":"Приведены оба предложения стиха. ya di после глагола речи передаёт «так»: его нельзя механически разобрать как выделительное ya из П19. Coobaaba-ize сохранено с дефисом. maa здесь «слышать», не «имя»."},{"k":6,"pid":"П93","head":"","rst":true,"dendi":"Za hanu nga di ǹ saawara ngei ma à wi.","source":"NT18, Ин 11:53","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"С этого дня положили убить Его.","lit":"С того дня они решили, чтобы они убили его.","parse":"Za — с, начиная с; hanu — день; nga — указательная отсылка в сочетании nga di; di — определительный элемент; ǹ — они; saawara — совещаться, принять решение в контексте; ngei — они, самостоятельная форма; ma — модально-побудительный показатель зависимого действия; à — он, здесь его; wi — убивать.","note":"Полное предложение после совещания, описанного в Ин 11:47–52. Решение — убить Иисуса — выражено зависимой частью. Saawara не получает отдельного значения «убивать». В отличие от русского параллельного текста, денди явно выражает субъект ngei зависимой части."}],"stray":[],"kind":"extra","meaning":"Связан с уже обозначенным предметом: после имени или местоименного сочетания. Не смешивать с глагольным di «видеть», который уже есть в основной части."},{"n":344,"title":"Умирать","letter":"У","variants":[{"label":"","form":"bu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT18, Мф 9:18","u":"https://zeno.fm/bible/DDNBIV/MAT/9/"},{"t":"NT18, Лк 20:32","u":"https://zeno.fm/bible/DDNBIV/LUK/20/"},{"t":"NT18, Рим 6:7","u":"https://zeno.fm/bible/DDNBIV/ROM/6/"},{"t":"NT18, 1 Кор 15:18","u":"https://zeno.fm/bible/DDNBIV/1CO/15/"},{"t":"NT18, Ин 6:49","u":"https://zeno.fm/bible/DDNBIV/JHN/6/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":109,"sci":"AZ, №61. Практическая орфография и контекст требуют сверки."},{"n":345,"title":"Упражнение","letter":"У","variants":[{"label":"","form":"gweiyo","notes":["Контекстная форма из инструкции к арифметическим действиям; точное разложение -yo не завершено."],"full":1,"status":"","examples":[{"k":1,"pid":"П43","head":"CAL, PDF с. 22","rst":false,"dendi":"Iri ma gweiyo wo te.","source":"CAL, PDF с. 22","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22","lit":"Пусть мы выполним это упражнение.","parse":"Iri — мы; ma — побудительный показатель; gweiyo — упражнение; форма источника; wo — этот; te — делать; выполнить.","note":"Печатная с. 40: полная инструкция перед арифметическими действиями. Te оставлено в написании CAL, не превращено механически в tɛ. Цитата не реконструирована из словаря."}],"refs":[{"t":"CAL, PDF с. 22","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_109.pdf#page=22"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":346,"title":"Усиливать; увеличивать","letter":"У","variants":[{"label":"","form":"hinsa","notes":["Здесь усиление молчания: hinsa ka dɛnjɛ. Это не физическое увеличение размера."],"full":1,"status":"","examples":[{"k":1,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":347,"title":"Утром","letter":"У","variants":[{"label":"","form":"susuba, Susuba","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П79","head":"AL65, PDF и печ. с. 55","rst":false,"dendi":"Susuba à nà 48 nɛɛra.","source":"AL65, PDF и печ. с. 55","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=55","lit":"Утром он продал 48 [книг].","parse":"Susuba — утром; à — он, продавец книг; nà — показатель переходного действия; 48 — цифровая запись числа 48; nɛɛra — продавать.","note":"Законченное предложение в задаче о магазине книг, где первоначально было 68 книг. «Книг» восстановлено из предыдущего предложения. Отсутствие пробела после точки в печати не меняет границу предложения."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Утром, в начале дня; обстоятельство времени в повествовании.","related":"П79."},{"n":348,"title":"Ухо","letter":"У","variants":[{"label":"I","form":"hanga","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 23","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=23"},{"t":"NT18, Мк 7:33","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Откр 13:9","u":"https://zeno.fm/bible/DDNBIV/REV/13/"},{"t":"NT18, Мф 13:18","u":"https://zeno.fm/bible/DDNBIV/MAT/13/"},{"t":"NT18, 2 Тим 4:4","u":"https://zeno.fm/bible/DDNBIV/2TI/4/"}]},{"label":"II","form":"hangayo","notes":["В перечне органов головы; форма с -yo."],"full":1,"status":"","examples":[{"k":1,"pid":"П46","head":"AL65, PDF с. 29","rst":false,"dendi":"Bom gonda hangayo, mɔɔize, ninɛ, mɛɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Голова имеет уши, глаза, нос, рот.","parse":"Bom — голова; gonda — иметь; hangayo — уши; форма источника с -yo; mɔɔize — глаза в данном перечислении органов головы; ninɛ — нос; mɛɛ — рот.","note":"Полное предложение из учебного описания тела. Число органов в русском переводе следует анатомическому перечислению; оно не приписывается единому суффиксу у всех дендийских слов. Здесь mɔɔize названо в ряду органов головы; специальное различие «глаз / зрачок» этим предложением отдельно не устанавливается."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":73,"sci":"H, §E №97, с. 36. Практическая орфография и контекст требуют сверки."},{"n":349,"title":"Ученик","letter":"У","variants":[{"label":"","form":"coobaaba-ize, Coobaaba-ize","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П92","head":"NT18, Ин 1:37","rst":true,"dendi":"Coobaaba-ize hinka di maa Yohana go sendi ya di. Ǹ na Yesu gana.","source":"NT18, Ин 1:37","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Услышав от него сии слова, оба ученика пошли за Иисусом.","lit":"Те два ученика услышали, как Иоанн говорит так. Они последовали за Иисусом.","parse":"Coobaaba-ize — ученик, сложное слово; hinka — два; di — определительный элемент; maa — слышать; Yohana — Иоанн; go — предглагольный показатель; sendi — говорить; ya — компонент сочетания ya di «так»; di — компонент сочетания ya di; Ǹ — они; na — показатель переходного действия; Yesu — Иисус; gana — следовать за.","note":"Приведены оба предложения стиха. ya di после глагола речи передаёт «так»: его нельзя механически разобрать как выделительное ya из П19. Coobaaba-ize сохранено с дефисом. maa здесь «слышать», не «имя»."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Ученик; сложное слово с дефисом. В П92 обозначает учеников Иоанна, затем следующих за Иисусом.","related":"П92."},{"n":350,"title":"Учитель","letter":"У","variants":[{"label":"","form":"Coobaaba","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П12","head":"NT18, JHN 1:38","rst":true,"dendi":"Coobaaba, mani n goono nda gɔrɛ?","source":"NT18, JHN 1:38","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Равви́ (что значит: «учитель»), где живешь?","lit":"Учитель, где ты проживаешь?","parse":"Coobaaba — учитель; mani — где?; n — ты; goono — пребывать; nda — элемент глагольного сочетания; gɔrɛ — проживать.","note":"Goоno nda gɔrɛ разбирается как сочетание; nda не переводится механически русским «с». Синодальное «Равви» входит в опубликованный параллельный текст."}],"refs":[{"t":"NT18, JHN 1:38","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Обращение из П12; значение подтверждено пояснением того же стиха."},{"n":351,"title":"Фома","letter":"Ф","variants":[{"label":"","form":"Toma","notes":["Имя собственное."],"full":1,"status":"","examples":[{"k":1,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."}],"refs":[{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":352,"title":"Форма адресата в пособии: noo","letter":"Ф","variants":[{"label":"","form":"noo","notes":[],"full":4,"status":"","examples":[{"k":1,"pid":"П16","head":"AL64, PDF с. 20","rst":false,"dendi":"Ifɔ nɔ noo dendeni?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","lit":"Что именно [адресат вопроса] изучил?","parse":"Ifɔ — что?; nɔ — выделительный/предикативный элемент; noo — форма адресата в пособии; лицо и число отдельно не установлены; dendeni — изучать / учиться.","note":"Дословная глосса намеренно содержит квадратные скобки: лицо и число адресата не подтверждены отдельным описанием местоименной системы. Это полный пример с незавершённой грамматической интерпретацией, а не образец для самостоятельного составления фраз."},{"k":2,"pid":"П17","head":"AL64, PDF с. 20","rst":false,"dendi":"Mɛtɛ noo nà à dendeni nda?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","lit":"Каким способом [адресат вопроса] изучил это?","parse":"Mɛtɛ — как?; noo — форма адресата; лицо и число не установлены; nà — показатель переходного действия; à — это, дополнение; dendeni — изучать; nda — элемент конструкции способа.","note":"Тон nà сохранён по источнику. Классификация конечного nda предварительная; это ограничение относится и к статье nda. Перевод не выдаётся за полностью завершённый разбор."},{"k":3,"pid":"П70","head":"COV, PDF с. 4","rst":false,"lead":["В COV noo встречается и как притяжательный элемент, и как субъект. Русское множественное обращение передаёт жанр инструкции; вопрос о точном лице и числе noo в AL64 остаётся открытым."],"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."},{"k":4,"pid":"П71","head":"COV, PDF с. 4","rst":false,"dendi":"Wɔ̀ noo mɛɛ nna noo nunɛ daabu, de noo go tɔkɔɔ au noo go tisã.","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Прикрывайте ваши рот и нос, если [когда] вы кашляете или чихаете.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь «ваши»; mɛɛ — рот; nna — и; noo — форма адресата, здесь «ваш»; nunɛ — нос; daabu — закрывать, прикрывать; de — если, в этом контексте также «когда»; noo — форма адресата, субъект придаточной части; go — предглагольный показатель; tɔkɔɔ — кашлять; au — или; noo — форма адресата, субъект; go — предглагольный показатель; tisã — чихать.","note":"Полная фраза с придаточной частью после запятой. Текст памятки сохраняет повтор noo. В переводе показаны условное и временное прочтения de; из этого примера не выводится тождество de и всех слов «когда»."}],"refs":[{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"},{"t":"AL64, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Лицо и число не установлены отдельно; употребление не нормализовано в n или wom. Не использовать для самостоятельных фраз как подтверждённую форму «вы»."},{"n":353,"title":"Франк: обозначение F","letter":"Ф","variants":[{"label":"","form":"F","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П84","head":"AL65, PDF и печ. с. 106","rst":false,"dendi":"Ali nà mɔnturu fɔ́ dei F 8500 magazɛ̃ kuna.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али купил одни часы за 8500 франков в магазине.","parse":"Ali — Али, имя персонажа; nà — показатель переходного действия; mɔnturu — часы, прибор; fɔ́ — один; dei — покупать; F — обозначение франка в источнике; 8500 — цифровая запись числа 8500; magazɛ̃ — магазин; kuna — внутри, в.","note":"Полное первое предложение задачи о прибыли. mɔnturu соотносится по значению с agogo в CAL, сохраняя свою запись. Русское «одни часы» не означает множественное число слова денди. F — условное обозначение валюты, не реконструированное слово."},{"k":2,"pid":"П85","head":"AL65, PDF и печ. с. 106","rst":false,"dendi":"Ali nà mɔnturu di yeti ka nɛɛra F 9300.","source":"AL65, PDF и печ. с. 106","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=106","lit":"Али затем перепродал эти часы за 9300 франков.","parse":"Ali — Али; nà — показатель переходного действия; mɔnturu — часы; di — определительный элемент; yeti — снова, повторно в сочетании yeti ka; ka — связь действий; nɛɛra — продавать; F — обозначение франка; 9300 — цифровая запись числа 9300.","note":"Полное второе предложение той же задачи; П84 сообщает о покупке. yeti ka nɛɛra в этом контексте передано как «перепродать». Из одного примера не выводится самостоятельное значение yeti «возвращать» во всех контекстах."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Печатное обозначение франка в денежных суммах учебника. Это условный знак, не полная словарная форма денди и не указание на современный курс.","related":"П84, П85."},{"n":354,"title":"Хавау","letter":"Х","variants":[{"label":"","form":"Hawau","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П67","head":"AL65, PDF и печ. с. 96","rst":false,"dendi":"Hawau kwei hebu.","source":"AL65, PDF и печ. с. 96","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=96","lit":"Хавау пошла на рынок.","parse":"Hawau — Хавау, имя персонажа; kwei — идти; hebu — рынок.","note":"Целое первое предложение задачи о покупке помидоров. Женский род русского перевода согласован с иллюстрацией и контекстом. Прошедшее время — повествовательная интерпретация; отдельного показателя прошедшего в этой фразе не выделено."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Собственное имя героини учебной задачи о по
