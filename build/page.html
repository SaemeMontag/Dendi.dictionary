 имя; no — связочный элемент; Yohana — Иоанн.","note":"Полное предложение, включая часть об имени. maa здесь «имя», не «слышать». Активная конструкция денди сохранена в авторском переводе, несмотря на страдательный оборот русского параллельного текста."}],"stray":[],"kind":"swadesh","swadesh":22,"sci":"H, §E №211, с. 44. Практическая орфография и контекст требуют сверки."},{"n":184,"title":"Озеро","letter":"О","variants":[{"label":"","form":"buula","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Лк 8:22","u":"https://zeno.fm/bible/DDNBIV/LUK/8/"},{"t":"NT18, Откр 20:14","u":"https://zeno.fm/bible/DDNBIV/REV/20/"},{"t":"NT18, Лк 5:2","u":"https://zeno.fm/bible/DDNBIV/LUK/5/"},{"t":"NT18, Лк 5:1","u":"https://zeno.fm/bible/DDNBIV/LUK/5/"},{"t":"NT18, Лк 8:23","u":"https://zeno.fm/bible/DDNBIV/LUK/8/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":153,"meaning":"buula — озеро в Лк 8:22; в других местах море. Объём значения шире русского «озеро»."},{"n":185,"title":"Он","letter":"О","variants":[{"label":"I","form":"à","notes":["À в вводной части П50 относится к женщине и переводится «ей», далее — к обобщённому человеку. Русский мужской заголовок не означает, что дендийская форма обозначает только мужчин."],"full":null,"status":"","examples":[{"k":1,"pid":"П7","head":"NT95, JHN 4:29, PDF с. 62","rst":true,"dendi":"À mana ci Mɛsiya dee?","source":"NT95, JHN 4:29, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"не Он ли Христос?","lit":"Не является ли он Мессией?","parse":"À — он; mana — отрицательное предикативное употребление; ci — являться; Mɛsiya — Мессия; dee — вопросительная частица.","note":"Ожидание подтверждения возможно по контексту, но не объявляется значением dee во всех вопросах."},{"k":2,"pid":"П8","head":"NT95, MAT 12:23, PDF с. 12","rst":true,"dendi":"À na ci Dafidi ize di dee?","source":"NT95, MAT 12:23, PDF с. 12","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12","pub":"не это ли Христос, сын Давидов?","lit":"Не является ли он тем сыном Давида?","parse":"À — он; na — отрицательная функция в данном сочетании; не смешивать с показателем переходного действия; ci — являться; Dafidi — Давид; ize — сын / потомок; di — определительный элемент; dee — вопросительная частица.","note":"В опубликованном русском тексте добавлено именование «Христос»; в этой дендийской фразе слова Mɛsiya нет."},{"k":3,"pid":"П13","head":"NT18, ACT 21:40","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":4,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."},{"k":5,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."},{"k":6,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":7,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":8,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."},{"k":9,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."},{"k":10,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT18, Мф 1:21","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"},{"t":"AL64, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=3"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"},{"t":"AL65, PDF с. 100","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=100"},{"t":"COV, PDF с. 3","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=3"},{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"},{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"},{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]},{"label":"II","form":"nga","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 1:21","u":"https://zeno.fm/bible/DDNBIV/MAT/1/"},{"t":"AL65, PDF с. 101","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=101"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П6","head":"","rst":true,"dendi":"N go cimandi nga di gaa dee?","source":"NT95, JHN 11:26, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"Веришь ли сему?","lit":"Ты считаешь это истинным?","parse":"N — ты; go — предглагольный показатель; cimandi — признавать истинным / верить; nga — то / оно; di — указательный элемент; gaa — послелог объекта отношения; dee — вопросительная частица.","note":"Сочетание nga di gaa передаёт объект веры; послелог не имеет здесь отдельного русского «на»."},{"k":2,"pid":"П17","head":"","rst":false,"dendi":"Mɛtɛ noo nà à dendeni nda?","source":"AL64, PDF с. 20","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_64.pdf#page=20","lit":"Каким способом [адресат вопроса] изучил это?","parse":"Mɛtɛ — как?; noo — форма адресата; лицо и число не установлены; nà — показатель переходного действия; à — это, дополнение; dendeni — изучать; nda — элемент конструкции способа.","note":"Тон nà сохранён по источнику. Классификация конечного nda предварительная; это ограничение относится и к статье nda. Перевод не выдаётся за полностью завершённый разбор."},{"k":3,"pid":"П44","head":"","rst":true,"dendi":"Ǹ cii: Ni no andebi di? À tu ka cii. Awo.","source":"NT95, Ин 1:21, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"Пророк? Он отвечал: нет.","lit":"Они сказали: ты — тот пророк? Он ответил: нет.","parse":"Ǹ — они; cii — сказать; Ni — ты; no — предикативный элемент; andebi — пророк; di — определительный элемент; À — он; tu — ответить; ka — связь действий; Awo — нет.","note":"Вопрос без ba и dee; ответ Awo приведён вместе с вопросом. Перед Awo в издании напечатана точка после cii; она сохранена, хотя русский перевод оформляет ответ двоеточием. Cii во второй части также означает «сказать». Полный русский стих включает предшествующий вопрос об Илии; здесь приведена соответствующая часть."},{"k":4,"pid":"П45","head":"","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."},{"k":5,"pid":"П54","head":"","rst":true,"dendi":"Yesu go baa Marata nda à cɛɛnɛ nda Lazaa.","source":"NT18, Ин 11:5","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус же любил Марфу и сестру ее и Лазаря.","lit":"Иисус любит Марфу, её младшую сестру и Лазаря.","parse":"Yesu — Иисус; go — предглагольный показатель; baa — любить; Marata — Марфа; nda — и; à — она, здесь её; cɛɛnɛ — младшая сестра в этом контексте; nda — и; Lazaa — Лазарь.","note":"Полное повествовательное предложение. В Ин 11:1 и 11:28 сестра Марфы названа Mariyama. Слово cɛɛnɛ не ограничено мужским полом: сравните П32 в статье «Брат». Русское прошедшее время параллельного перевода не является отдельным значением go."},{"k":6,"pid":"П68","head":"","rst":false,"dendi":"Wiciri, à nɛɛra gunguriyo 65.","source":"AL65, PDF и печ. с. 104","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=104","lit":"Вечером она продала 65 яиц.","parse":"Wiciri — вечером, контекстное время действия; à — она, Дама из предыдущего предложения; nɛɛra — продавать; gunguriyo — яйца, форма источника; 65 — число 65, цифровая запись.","note":"Полное предложение из задачи о торговке Даме (Dama). Значение wiciri уточняется как вечернее время в повествовании; не создаётся дублирующая статья к уже имеющемуся варианту wiciri. Число сохранено цифрами, его чтение на денди не реконструируется."},{"k":7,"pid":"П70","head":"","rst":false,"dendi":"Wɔ̀ noo kammɛ̀ hinu sãasãa nna safari ka à kuna alkɔɔlu gono au nna hari nna saafunu","source":"COV, PDF с. 4","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=4","lit":"Регулярно мойте ваши руки средством, внутри которого есть спирт, или водой с мылом.","parse":"Wɔ̀ — обращённое к читателям побуждение; noo — форма адресата, здесь притяжательное «ваши»; kammɛ̀ — руки; hinu — мыть; sãasãa — регулярно, часто; nna — с, при помощи; safari — средство, препарат; ka — относительная связь; à — он, оно; отсылка к средству; kuna — внутри; alkɔɔlu — спирт; gono — есть, имеется; написание памятки; au — или; nna — с, при помощи; hari — вода; nna — с; saafunu — мыло.","note":"Взята полная инструкция одной ячейки памятки; конечная точка в источнике отсутствует. gono не исправлено в goono. Русское «ваши» передаёт обращение этой инструкции, но само по себе не разрешает лицо и число noo в П16–П17 из другого пособия. Исторический санитарный текст используется как языковой источник."},{"k":8,"pid":"П78","head":"","rst":false,"dendi":"Handu wɔ̀ kuna, à nɛɛra 340.","source":"AL65, PDF и печ. с. 51","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=51","lit":"В этом месяце он [комитет] продал 340 [килограммов хлопка].","parse":"Handu — месяц; wɔ̀ — этот; kuna — в, внутри; à — он, отсылка к комитету; nɛɛra — продавать; 340 — цифровая запись числа 340.","note":"Целое предложение из задачи о деревенском комитете Бирини-Лафиа. В предыдущем предложении названы хлопок и kg 250 за прошлый месяц. После 340 в цитате нет ни kg, ни слова «хлопок»: они добавлены только в квадратных скобках перевода."},{"k":9,"pid":"П79","head":"","rst":false,"dendi":"Susuba à nà 48 nɛɛra.","source":"AL65, PDF и печ. с. 55","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=55","lit":"Утром он продал 48 [книг].","parse":"Susuba — утром; à — он, продавец книг; nà — показатель переходного действия; 48 — цифровая запись числа 48; nɛɛra — продавать.","note":"Законченное предложение в задаче о магазине книг, где первоначально было 68 книг. «Книг» восстановлено из предыдущего предложения. Отсутствие пробела после точки в печати не меняет границу предложения."},{"k":10,"pid":"П80","head":"","rst":false,"dendi":"Nɔɔru ka à cindi kɛ̀ɛsu kuna kabu.","source":"AL65, PDF и печ. с. 59","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=59","lit":"Посчитай деньги, которые остались в кассе.","parse":"Nɔɔru — деньги; ka — относительная связь; à — оно, отсылка к оставшейся сумме; cindi — оставаться; kɛ̀ɛsu — касса, денежный ящик; kuna — внутри, в; kabu — считать, посчитай.","note":"Целая инструкция в задаче о школьной кассе. Требуется остаток после покупки. Денди использует à, хотя естественный русский перевод «деньги» требует множественного числа."},{"k":11,"pid":"П82","head":"","rst":false,"dendi":"Jiiri nuusamtɛ cin kàà nɔ̀ jiiri 4 kulu nga à gonda jibiri 366.","source":"AL65, PDF и печ. с. 70","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=70","lit":"Високосный год приходит каждые четыре года, и в нём 366 дней.","parse":"Jiiri — год; nuusamtɛ — високосный; cin — показатель обычного повторяющегося действия в этом контексте; kàà — приходить; nɔ̀ — предикативно-выделительный элемент; jiiri — год; 4 — цифровая запись числа 4; kulu — каждый, весь; nga — связь частей, здесь «и»; à — он, год; gonda — иметь; jibiri — день; 366 — цифровая запись числа 366.","note":"Полное утверждение из календарного урока. Это упрощённая формулировка учебника: исключения календарного правила цитата не описывает. На с. 76 в упражнении встречается перестановка подписей; она не используется для переопределения nuusamtɛ и kubantɛ. nga здесь связывает части, а à занимает позицию субъекта."},{"k":12,"pid":"П88","head":"","rst":true,"dendi":"Yesu cii à sɛ: «N harume di kaa tunu kpɛɛnɛ.»","source":"NT18, Ин 11:23","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус говорит ей: воскреснет брат твой.","lit":"Иисус сказал ей: «Твой брат снова встанет [воскреснет]».","parse":"Yesu — Иисус; cii — сказать; à — она, Марфа; sɛ — послелог адресата; N — ты, здесь твой; harume — брат; di — определительный элемент; kaa — показатель предстоящего действия в этом контексте; tunu — встать, здесь воскреснуть; kpɛɛnɛ — ещё, снова.","note":"Сохранены вводная часть и целая реплика. Речь о Лазаре, брате Марфы; отсюда контекстное «воскреснуть». kaa перед tunu не переводится вторым глаголом «приходить». harume добавлено к статье «Брат», без утверждения о полном тождестве cɛɛnɛ."},{"k":13,"pid":"П89","head":"","rst":true,"dendi":"Ikpɛ na bɔrɔ fɔ dɔntɔm, à maa no Yohana.","source":"NT18, Ин 1:6","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Был человек, посланный от Бога; имя ему Иоанн.","lit":"Бог послал одного человека, его имя — Иоанн.","parse":"Ikpɛ — Бог; na — показатель переходного действия; bɔrɔ — человек; fɔ — один, некий; dɔntɔm — посылать; à — он, здесь его; maa — имя; no — связочный элемент; Yohana — Иоанн.","note":"Полное предложение, включая часть об имени. maa здесь «имя», не «слышать». Активная конструкция денди сохранена в авторском переводе, несмотря на страдательный оборот русского параллельного текста."},{"k":14,"pid":"П90","head":"","rst":true,"dendi":"À goono handunya. Nga mo ya na handunya tɛ amma handunya mana à bei.","source":"NT18, Ин 1:10","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"В мире был, и мир чрез Него на́чал быть, и мир Его не познал.","lit":"Он был в мире. Он же сотворил мир, но мир его не знал.","parse":"À — он, отсылка к действующему лицу пролога; goono — находиться, быть; handunya — мир; Nga — он, самостоятельная форма; mo — также, же; ya — выделение; na — показатель переходного действия; handunya — мир; tɛ — делать, здесь сотворить; amma — но; handunya — мир; mana — отрицание; à — он, здесь его; bei — знать.","note":"Весь стих состоит из двух законченных предложений и приведён целиком. Отсылку À следует читать в контексте пролога о Слове и свете. «Мир не знал» — переносное обозначение людей мира. Прошедшее время перевода не объявлено значением goono."},{"k":15,"pid":"П91","head":"","rst":true,"dendi":"À kaa nga ŋmɔne yom dɔ amma ǹ mana à ta.","source":"NT18, Ин 1:11","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Пришел к своим, и свои Его не приняли.","lit":"Он пришёл к своим, но они его не приняли.","parse":"À — он; kaa — приходить; nga — он, здесь притяжательная отсылка; ŋmɔne — собственный, свой; yom — показатель множественности; dɔ — к, в сфере указанного лица или группы; amma — но; ǹ — они; mana — отрицание; à — он, здесь его; ta — принимать.","note":"Полное предложение. nga ŋmɔne yom — «свои» как группа людей; слово «люди» отдельно не выражено. kaa здесь глагол прихода, в отличие от предглагольного употребления в П88. dɔ разбирается как послелог этой конструкции."},{"k":16,"pid":"П93","head":"","rst":true,"dendi":"Za hanu nga di ǹ saawara ngei ma à wi.","source":"NT18, Ин 11:53","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"С этого дня положили убить Его.","lit":"С того дня они решили, чтобы они убили его.","parse":"Za — с, начиная с; hanu — день; nga — указательная отсылка в сочетании nga di; di — определительный элемент; ǹ — они; saawara — совещаться, принять решение в контексте; ngei — они, самостоятельная форма; ma — модально-побудительный показатель зависимого действия; à — он, здесь его; wi — убивать.","note":"Полное предложение после совещания, описанного в Ин 11:47–52. Решение — убить Иисуса — выражено зависимой частью. Saawara не получает отдельного значения «убивать». В отличие от русского параллельного текста, денди явно выражает субъект ngei зависимой части."}],"stray":[],"kind":"swadesh","swadesh":3,"meaning":"à — краткая субъектная форма; nga — самостоятельная/эмфатическая; функции различаются."},{"n":186,"title":"Они","letter":"О","variants":[{"label":"I","form":"ngei","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":2,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."}],"refs":[{"t":"NT95, PDF с. 124","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=124"},{"t":"NT18, Мф 3:6","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, 1 Пет 4:5","u":"https://zeno.fm/bible/DDNBIV/1PE/4/"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"}]},{"label":"II","form":"ǹ, Ǹ","notes":[],"full":null,"status":"","examples":[{"k":1,"pid":"П24","head":"NT95, Лк 18:37, PDF с. 53","rst":true,"dendi":"Ǹ cii à sɛ: Yesu Nazarɛtu ya go bisa.","source":"NT95, Лк 18:37, PDF с. 53","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53","pub":"Ему сказали, что Иисус Назорей идет.","lit":"Они сказали ему: Иисус из Назарета проходит.","parse":"Ǹ — они; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; Yesu — Иисус; Nazarɛtu — Назарет; здесь указание происхождения; ya — выделительный элемент; go — предглагольный показатель; bisa — проходить.","note":"Слова персонажей после двоеточия приведены полностью. Ya не переводится вопросительной частицей."},{"k":2,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."},{"k":3,"pid":"П27","head":"NT95, Мф 17:3, PDF с. 15","rst":true,"dendi":"Cɔfɔ Moisi nda Eli hunutɛrɛ ǹ sɛ ko sendi nda Yesu.","source":"NT95, Мф 17:3, PDF с. 15","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15","pub":"И вот, явились им Моисей и Илия, с Ним беседующие.","lit":"Тогда Моисей и Илия явились им и беседовали с Иисусом.","parse":"Cɔfɔ — тогда; Moisi — Моисей; nda — и; далее с; Eli — Илия; hunutɛrɛ — явиться; показаться; ǹ — они; здесь им; sɛ — адресат; ko — связующий элемент перед следующим действием; точная классификация не завершена; sendi — говорить; беседовать; Yesu — Иисус.","note":"Первое nda соединяет имена; второе обозначает собеседника. Hunutɛrɛ — явление/появление, а не связка ci «быть кем-либо»."},{"k":4,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":5,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."},{"k":6,"pid":"П31","head":"NT95, Деян 22:2, PDF с. 92","rst":true,"dendi":"Saa ka jama maa à sendi ngei sɛ nda Ebulu cinɛ cɔfɔ ǹ hinsa ka dɛnjɛ kpɛɛnɛ.","source":"NT95, Деян 22:2, PDF с. 92","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92","pub":"Услышав же, что он заговорил с ними на еврейском языке, они еще более утихли. Он сказал:","lit":"Когда толпа услышала, что он говорит им на еврейском языке, они ещё больше замолчали.","parse":"Saa ka — когда; jama — толпа; maa — услышать; à — он; sendi — говорить; ngei — они; здесь им; sɛ — адресат; nda — на; обозначает язык речи; Ebulu — еврейский, написание NT95; cinɛ — язык; cɔfɔ — тогда; ǹ — они; hinsa — увеличить; здесь усиление; ka — связующий элемент; dɛnjɛ — замолчать; kpɛɛnɛ — ещё; в данном сочетании.","note":"В NT95 напечатано Ebulu, в других приведённых примерах — Eburu; оба написания сохранены с источниками. Их свободная взаимозаменяемость не доказана. Русское «Он сказал» относится к продолжению стиха, а не к приведённому дендийскому предложению."},{"k":7,"pid":"П33","head":"NT95, Ин 10:42, PDF с. 68","rst":true,"dendi":"Bɔrɔ boobo ka ǹ goono nungu di naane à gaa.","source":"NT95, Ин 10:42, PDF с. 68","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68","pub":"И многие там уверовали в Него.","lit":"Многие люди, которые находились в том месте, верили ему.","parse":"Bɔrɔ — человек; в сочетании люди; boobo — много; ka — вводит относительную часть; ǹ — они; goono — находиться; nungu — место; di — определительный элемент; naane — верить; à — он; здесь ему; gaa — послелог объекта веры.","note":"Ka ǹ goono nungu di уточняет людей, а не вводит самостоятельное новое событие. Форма naane здесь глагол с объектом à gaa."}],"refs":[{"t":"NT18, Мф 3:6","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Рим 3:17","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, Деян 18:16","u":"https://zeno.fm/bible/DDNBIV/ACT/18/"},{"t":"NT18, Ин 16:31","u":"https://zeno.fm/bible/DDNBIV/JHN/16/"},{"t":"NT95, Лк 18:37, PDF с. 53","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=53"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"},{"t":"NT95, Мф 17:3, PDF с. 15","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=15"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"},{"t":"NT95, Деян 22:2, PDF с. 92","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=92"},{"t":"NT95, Ин 10:42, PDF с. 68","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=68"}]},{"label":"III","form":"nn","notes":["Запись AL65 без тонового знака. В П76 nn обозначает упомянутые ранее коммуны; число и притяжательное употребление установлены по контексту."],"full":1,"status":"","examples":[{"k":1,"pid":"П76","head":"AL65, PDF и печ. с. 43","rst":false,"dendi":"N mà nn maayo hantum n tira kuna.","source":"AL65, PDF и печ. с. 43","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=43","lit":"Запиши их названия в своей тетради.","parse":"N — ты; mà — побудительный показатель; nn — они, здесь их; maayo — имена, названия; hantum — записывать; n — ты, здесь твоя; tira — тетрадь, письменная книга; kuna — внутри, в.","note":"Полное второе предложение учебного пункта. В предыдущем предложении названы известные учащемуся коммуны: nn отсылает к ним. В последней строке tirakuna напечатано слитно; пробел нормализован без изменения букв."}],"refs":[]}],"extra_refs":[],"linked":[{"k":1,"pid":"П13","head":"","rst":true,"dendi":"Ka beerem dɛnjɛ sakai, à sendi ǹ sɛ nda Eburu cine.","source":"NT18, ACT 21:40","source_url":"https://zeno.fm/bible/DDNBIV/ACT/21/","pub":"и, когда сделалось глубокое молчание, начал говорить на еврейском языке так:","lit":"Когда люди совершенно замолчали, он говорил им на еврейском языке.","parse":"Ka — когда; beerem — люди; dɛnjɛ — замолчать; sakai — совершенно; à — он; sendi — говорить; ǹ — они / их; sɛ — адресат действия: им; nda — средство / язык речи; Eburu — еврейский; cine — язык.","note":"Сохранены условие и главная часть последнего предложения стиха. Название языка передано по переводчику; историческая идентификация языка отдельно не устанавливается."},{"k":2,"pid":"П44","head":"","rst":true,"dendi":"Ǹ cii: Ni no andebi di? À tu ka cii. Awo.","source":"NT95, Ин 1:21, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"Пророк? Он отвечал: нет.","lit":"Они сказали: ты — тот пророк? Он ответил: нет.","parse":"Ǹ — они; cii — сказать; Ni — ты; no — предикативный элемент; andebi — пророк; di — определительный элемент; À — он; tu — ответить; ka — связь действий; Awo — нет.","note":"Вопрос без ba и dee; ответ Awo приведён вместе с вопросом. Перед Awo в издании напечатана точка после cii; она сохранена, хотя русский перевод оформляет ответ двоеточием. Cii во второй части также означает «сказать». Полный русский стих включает предшествующий вопрос об Илии; здесь приведена соответствующая часть."},{"k":3,"pid":"П45","head":"","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."},{"k":4,"pid":"П91","head":"","rst":true,"dendi":"À kaa nga ŋmɔne yom dɔ amma ǹ mana à ta.","source":"NT18, Ин 1:11","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Пришел к своим, и свои Его не приняли.","lit":"Он пришёл к своим, но они его не приняли.","parse":"À — он; kaa — приходить; nga — он, здесь притяжательная отсылка; ŋmɔne — собственный, свой; yom — показатель множественности; dɔ — к, в сфере указанного лица или группы; amma — но; ǹ — они; mana — отрицание; à — он, здесь его; ta — принимать.","note":"Полное предложение. nga ŋmɔne yom — «свои» как группа людей; слово «люди» отдельно не выражено. kaa здесь глагол прихода, в отличие от предглагольного употребления в П88. dɔ разбирается как послелог этой конструкции."},{"k":5,"pid":"П92","head":"","rst":true,"dendi":"Coobaaba-ize hinka di maa Yohana go sendi ya di. Ǹ na Yesu gana.","source":"NT18, Ин 1:37","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Услышав от него сии слова, оба ученика пошли за Иисусом.","lit":"Те два ученика услышали, как Иоанн говорит так. Они последовали за Иисусом.","parse":"Coobaaba-ize — ученик, сложное слово; hinka — два; di — определительный элемент; maa — слышать; Yohana — Иоанн; go — предглагольный показатель; sendi — говорить; ya — компонент сочетания ya di «так»; di — компонент сочетания ya di; Ǹ — они; na — показатель переходного действия; Yesu — Иисус; gana — следовать за.","note":"Приведены оба предложения стиха. ya di после глагола речи передаёт «так»: его нельзя механически разобрать как выделительное ya из П19. Coobaaba-ize сохранено с дефисом. maa здесь «слышать», не «имя»."},{"k":6,"pid":"П93","head":"","rst":true,"dendi":"Za hanu nga di ǹ saawara ngei ma à wi.","source":"NT18, Ин 11:53","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"С этого дня положили убить Его.","lit":"С того дня они решили, чтобы они убили его.","parse":"Za — с, начиная с; hanu — день; nga — указательная отсылка в сочетании nga di; di — определительный элемент; ǹ — они; saawara — совещаться, принять решение в контексте; ngei — они, самостоятельная форма; ma — модально-побудительный показатель зависимого действия; à — он, здесь его; wi — убивать.","note":"Полное предложение после совещания, описанного в Ин 11:47–52. Решение — убить Иисуса — выражено зависимой частью. Saawara не получает отдельного значения «убивать». В отличие от русского параллельного текста, денди явно выражает субъект ngei зависимой части."}],"stray":[],"kind":"swadesh","swadesh":6,"meaning":"ǹ — краткая субъектная форма; ngei — самостоятельная форма."},{"n":187,"title":"Опухать","letter":"О","variants":[{"label":"","form":"funsu","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 28:6","u":"https://zeno.fm/bible/DDNBIV/ACT/28/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":146,"meaning":"funsu — распухнуть; омограф формы в строке «дышать»."},{"n":188,"title":"Оставаться","letter":"О","variants":[{"label":"","form":"cindi","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П80","head":"AL65, PDF и печ. с. 59","rst":false,"dendi":"Nɔɔru ka à cindi kɛ̀ɛsu kuna kabu.","source":"AL65, PDF и печ. с. 59","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=59","lit":"Посчитай деньги, которые остались в кассе.","parse":"Nɔɔru — деньги; ka — относительная связь; à — оно, отсылка к оставшейся сумме; cindi — оставаться; kɛ̀ɛsu — касса, денежный ящик; kuna — внутри, в; kabu — считать, посчитай.","note":"Целая инструкция в задаче о школьной кассе. Требуется остаток после покупки. Денди использует à, хотя естественный русский перевод «деньги» требует множественного числа."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Оставаться; в П80 об остатке денег. Не объявляется тождественным cindi «и прочее» без проверки.","related":"П80."},{"n":189,"title":"Острый","letter":"О","variants":[{"label":"I","form":"me kaani","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Евр 4:12","u":"https://zeno.fm/bible/DDNBIV/HEB/4/"}]},{"label":"II","form":"mekaanɔ-kpɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Откр 14:14","u":"https://zeno.fm/bible/DDNBIV/REV/14/"},{"t":"NT18, Откр 14:17","u":"https://zeno.fm/bible/DDNBIV/REV/14/"},{"t":"NT18, Евр 11:34","u":"https://zeno.fm/bible/DDNBIV/HEB/11/"},{"t":"NT18, Откр 19:15","u":"https://zeno.fm/bible/DDNBIV/REV/19/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":191,"meaning":"me kaani — «острый край»; mekaanɔ-kpɛ — «с острым краем», о серпе.","sci":"H, §E №157, с. 40. Практическая орфография и контекст требуют сверки."},{"n":190,"title":"От; начиная с","letter":"О","variants":[{"label":"I","form":"zǎ","notes":["Начальная граница числового диапазона. В zǎ X nda X — компонент конструкции шага счёта. Тоновый знак сохранён по AL65; произношение не реконструировано. Полных примеров: 2."],"full":null,"status":"","examples":[{"k":1,"pid":"П51","head":"AL65, PDF и печ. с. 31","rst":false,"dendi":"Kabu zǎ 1 ka kwei 9.","source":"AL65, PDF и печ. с. 31.","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=31","lit":"Считай начиная с 1, продвигаясь до 9.","parse":"Kabu — считай; побуждение без отдельного местоимения; zǎ — начиная с, от; 1 — число 1, записанное цифрой; ka — связывает действие с последующим kwei; kwei — идти, продвигаться; в данном задании обозначает достижение верхней границы счёта; 9 — число 9, записанное цифрой.","note":"Полная инструкция перед рядом 1–9. Естественный русский перевод: «Считай от одного до девяти». Цифры не заменены дендийскими словами: их произношение эта цитата не удостоверяет. Сочетание ka kwei передаёт здесь предел «до»; отдельное kwei не объявляется универсальным предлогом «до»."},{"k":2,"pid":"П52","head":"AL65, PDF и печ. с. 32","rst":false,"dendi":"Kabu zǎ 20 nda 20, zǎ 20 ka kwei 100.","source":"AL65, PDF и печ. с. 32.","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=32","lit":"Считай по 20, начиная с 20 и продвигаясь до 100.","parse":"Kabu — считай; zǎ — от, начиная с; в первом сочетании zǎ 20 nda 20 участвует в указании шага; 20 — число 20 (три употребления); nda — связующий элемент в конструкции шага 20 nda 20; повторное zǎ — начало диапазона; ka — связь с kwei; kwei — идти, продвигаться, здесь до указанного предела; 100 — число 100.","note":"Полное задание на счёт с постоянным шагом. Сочетание zǎ 20 nda 20 в этом арифметическом контексте означает счёт двадцатками; это не сложение 20 + 20. Ожидаемый ряд: 20, 40, 60, 80, 100. Функция nda устанавливается для этой конструкции и не подменяется механически переводом «и» или «с»."}],"refs":[]},{"label":"II","form":"Za","notes":["Нетонированное Za из NT18 при временной отправной точке. Тон из учебного zǎ не переносится по аналогии."],"full":1,"status":"","examples":[{"k":1,"pid":"П93","head":"NT18, Ин 11:53","rst":true,"dendi":"Za hanu nga di ǹ saawara ngei ma à wi.","source":"NT18, Ин 11:53","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"С этого дня положили убить Его.","lit":"С того дня они решили, чтобы они убили его.","parse":"Za — с, начиная с; hanu — день; nga — указательная отсылка в сочетании nga di; di — определительный элемент; ǹ — они; saawara — совещаться, принять решение в контексте; ngei — они, самостоятельная форма; ma — модально-побудительный показатель зависимого действия; à — он, здесь его; wi — убивать.","note":"Полное предложение после совещания, описанного в Ин 11:47–52. Решение — убить Иисуса — выражено зависимой частью. Saawara не получает отдельного значения «убивать». В отличие от русского параллельного текста, денди явно выражает субъект ngei зависимой части."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":191,"title":"Отвечать; разрешать","letter":"О","variants":[{"label":"","form":"tu","notes":["Глагол; два контекстных значения."],"full":4,"status":"","examples":[{"k":1,"pid":"П3","head":"NT18, MRK 15:4","rst":true,"dendi":"N si tu ba?","source":"NT18, MRK 15:4","source_url":"https://zeno.fm/bible/DDNBIV/MRK/15/","pub":"Ты ничего не отвечаешь?","lit":"Ты не отвечаешь?","parse":"N — ты; si — отрицание; tu — отвечать; ba — вопросительная частица."},{"k":2,"pid":"П26","head":"NT95, Ин 20:28, PDF с. 74","rst":true,"dendi":"Toma tu ka cii à sɛ: A Kpe, a ŋmɔne Ikpɛ.","source":"NT95, Ин 20:28, PDF с. 74","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74","pub":"Фома сказал Ему в ответ: Господь мой и Бог мой!","lit":"Фома ответил и сказал ему: мой Господь, мой собственный Бог.","parse":"Toma — Фома; tu — ответить; ka — связь действий; cii — сказать; à — он; здесь ему; sɛ — адресат: кому; A / a — я; здесь мой; Kpe — Господь; ŋmɔne — собственный, в данном притяжательном сочетании; Ikpɛ — Бог.","note":"Tu ka cii вводит ответную реплику. Значение ŋmɔne ограничено этим проверенным сочетанием; универсальное соответствие русскому «сам» не установлено."},{"k":3,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."},{"k":4,"pid":"П45","head":"NT95, Мф 13:51, PDF с. 13","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."}],"refs":[{"t":"NT18, Мк 15:4","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"},{"t":"NT18, Ин 20:28","u":"https://zeno.fm/bible/DDNBIV/JHN/20/"},{"t":"NT18, Лк 19:34","u":"https://zeno.fm/bible/DDNBIV/LUK/19/"},{"t":"NT18, Ин 16:31","u":"https://zeno.fm/bible/DDNBIV/JHN/16/"},{"t":"NT18, Евр 6:3","u":"https://zeno.fm/bible/DDNBIV/HEB/6/"},{"t":"NT95, Ин 20:28, PDF с. 74","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=74"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П44","head":"","rst":true,"dendi":"Ǹ cii: Ni no andebi di? À tu ka cii. Awo.","source":"NT95, Ин 1:21, PDF с. 60","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=60","pub":"Пророк? Он отвечал: нет.","lit":"Они сказали: ты — тот пророк? Он ответил: нет.","parse":"Ǹ — они; cii — сказать; Ni — ты; no — предикативный элемент; andebi — пророк; di — определительный элемент; À — он; tu — ответить; ka — связь действий; Awo — нет.","note":"Вопрос без ba и dee; ответ Awo приведён вместе с вопросом. Перед Awo в издании напечатана точка после cii; она сохранена, хотя русский перевод оформляет ответ двоеточием. Cii во второй части также означает «сказать». Полный русский стих включает предшествующий вопрос об Илии; здесь приведена соответствующая часть."}],"stray":[],"kind":"extra","meaning":"При ответе на вопрос — «отвечать»; при предоставлении возможности — «разрешать». Эти значения различаются по контексту."},{"n":192,"title":"Отдаляться","letter":"О","variants":[{"label":"","form":"fee","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П60","head":"NT18, 1 Фес 5:22","rst":true,"dendi":"Wa fee nda hɛ laalɔ dimi kulu.","source":"NT18, 1 Фес 5:22","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Удерживайтесь от всякого рода зла.","lit":"Отдаляйтесь от всякого вида плохого.","parse":"Wa — побуждение к адресатам; fee — отдаляться, держаться в стороне; nda — связь с тем, от чего отдаляются; hɛ — вещь, нечто; laalɔ — плохой; dimi — вид, род; kulu — всякий, весь.","note":"Контекст наставления задаёт значение fee nda «держаться в стороне от». Нельзя переводить nda одним неизменным русским предлогом. dimi здесь «вид/род», не автоматически dimi «семя»."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Держаться в стороне, отдаляться; с nda в П60. Направление связи определяется конструкцией.","related":"П60."},{"n":193,"title":"Отец","letter":"О","variants":[{"label":"I","form":"baaba, Baaba","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."}],"refs":[{"t":"NT95, PDF с. 29","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=29"},{"t":"NT18, Мф 3:9","u":"https://zeno.fm/bible/DDNBIV/MAT/3/"},{"t":"NT18, Ин 8:27","u":"https://zeno.fm/bible/DDNBIV/JHN/8/"},{"t":"NT18, Мк 10:7","u":"https://zeno.fm/bible/DDNBIV/MRK/10/"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"}]},{"label":"II","form":"baabɛ","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П63","head":"AL65, PDF и печ. с. 56","rst":false,"dendi":"Iyaali fɔ́ bara nɔ̀ baabɛ, nyaa nda koo au kooyo.","source":"AL65, PDF и печ. с. 56","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56","lit":"Одна семья — это отец, мать и ребёнок или дети.","parse":"Iyaali — семья; fɔ́ — один, одна; bara — компонент связочной конструкции bara nɔ̀; nɔ̀ — компонент той же связочной конструкции; baabɛ — отец; nyaa — мать; nda — и; koo — ребёнок; au — или; kooyo — дети, форма источника.","note":"Полное определение из урока о семье; это учебное описание конкретного состава семьи, не универсальное этнографическое определение. Нетонированное bara сохранено. kooyo передано как форма множественного числа в этом контексте без самостоятельного обобщения правил суффиксации."}],"refs":[{"t":"AL65, PDF с. 56","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=56"},{"t":"AL65, PDF с. 57","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=57"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":43,"sci":"H, §E №6, с. 30. Практическая орфография и контекст требуют сверки."},{"n":194,"title":"Отрицание перед глаголом: si","letter":"О","variants":[{"label":"I","form":"si","notes":["Отрицательный показатель; также предикативные употребления."],"full":2,"status":"","examples":[{"k":1,"pid":"П3","head":"NT18, MRK 15:4","rst":true,"dendi":"N si tu ba?","source":"NT18, MRK 15:4","source_url":"https://zeno.fm/bible/DDNBIV/MRK/15/","pub":"Ты ничего не отвечаешь?","lit":"Ты не отвечаешь?","parse":"N — ты; si — отрицание; tu — отвечать; ba — вопросительная частица."},{"k":2,"pid":"П25","head":"NT95, Ин 6:20, PDF с. 63","rst":true,"dendi":"Amma Yesu cii ǹ sɛ: Hɛɛ no. Wa si hamburu.","source":"NT95, Ин 6:20, PDF с. 63","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63","pub":"Но Он сказал им: это Я; не бойтесь.","lit":"Но Иисус сказал им: это я. Не бойтесь.","parse":"Amma — но; Yesu — Иисус; cii — сказать; ǹ — они; здесь им; sɛ — адресат: кому; Hɛɛ — я, эмфатическая форма в этом ответе; no — предикативный элемент; Wa — побуждение к нескольким адресатам; si — отрицание; hamburu — бояться.","note":"Три предложения составляют одну полную реплику с вводной частью. Hɛɛ не отождествляется с hɛ «вещь»: различается длина гласного."}],"refs":[{"t":"NT18, Мк 15:4","u":"https://zeno.fm/bible/DDNBIV/MRK/15/"},{"t":"NT18, Ин 16:9","u":"https://zeno.fm/bible/DDNBIV/JHN/16/"},{"t":"NT18, Рим 3:11","u":"https://zeno.fm/bible/DDNBIV/ROM/3/"},{"t":"NT18, 1 Кор 7:27","u":"https://zeno.fm/bible/DDNBIV/1CO/7/"},{"t":"NT18, 1 Кор 10:24","u":"https://zeno.fm/bible/DDNBIV/1CO/10/"},{"t":"NT95, Ин 6:20, PDF с. 63","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=63"}]},{"label":"II","form":"sí","notes":["Тон сохраняется по AL65, без переноса на нетонированные цитаты."],"full":1,"status":"","examples":[{"k":1,"pid":"П36","head":"AL65, PDF с. 17","rst":false,"dendi":"Iri ma sí hari ziibandi.","source":"AL65, PDF с. 17","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17","lit":"Пусть мы не загрязняем воду.","parse":"Iri — мы; ma — побудительный показатель; sí — отрицание; тон источника сохранён; hari — вода; ziibandi — загрязнять.","note":"Учебная фраза о сохранении чистоты воды. Ziibandi — глагол изменения состояния, а не прилагательное «грязный»."}],"refs":[{"t":"AL65, PDF с. 17","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П57","head":"","rst":true,"dendi":"Wo ka aduwa tɛ, cɛyom si.","source":"NT18, 1 Фес 5:17","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Непрестанно молитесь.","lit":"Совершайте молитву, прекращения нет.","parse":"Wo — побуждение к адресатам; ka — связующий элемент при действии; aduwa — молитва; tɛ — делать, совершать; cɛyom — прекращение, перерыв; si — отрицание наличия, здесь «нет».","note":"Полная фраза включает обе части, разделённые запятой. aduwa tɛ буквально «делать молитву», по-русски «молиться». Постпозиционное si в cɛyom si отличается от позиции si перед глаголом; здесь не следует восстанавливать несуществующее слово «непрестанно»."},{"k":2,"pid":"П58","head":"","rst":true,"dendi":"Wa si andebitɛrɛ fɛntɛ.","source":"NT18, 1 Фес 5:20","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Пророчества не уничижайте.","lit":"Не презирайте пророчество.","parse":"Wa — побуждение к адресатам; si — отрицание; andebitɛrɛ — пророчество, пророческое высказывание; fɛntɛ — презирать, пренебрегать.","note":"Целое отрицательное побуждение. andebitɛrɛ — отвлечённое/деятельностное название, не andebi «пророк». Множественное число русского параллельного текста не переносится на форму денди."}],"stray":[],"kind":"extra","meaning":"В приведённых сочетаниях отрицает действие. Не тождествен самостоятельному ответу Awo. Полная аспектно-модальная система не устанавливается по этим пяти местам."},{"n":195,"title":"Отрицание: mana","letter":"О","variants":[{"label":"","form":"mana","notes":["Отрицательный показатель / отрицательное предикативное употребление."],"full":3,"status":"","examples":[{"k":1,"pid":"П7","head":"NT95, JHN 4:29, PDF с. 62","rst":true,"dendi":"À mana ci Mɛsiya dee?","source":"NT95, JHN 4:29, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"не Он ли Христос?","lit":"Не является ли он Мессией?","parse":"À — он; mana — отрицательное предикативное употребление; ci — являться; Mɛsiya — Мессия; dee — вопросительная частица.","note":"Ожидание подтверждения возможно по контексту, но не объявляется значением dee во всех вопросах."},{"k":2,"pid":"П28","head":"NT95, Ин 8:27, PDF с. 66","rst":true,"dendi":"Ǹ mana faham ka Baaba bɔm no à go sendi ngei sɛ.","source":"NT95, Ин 8:27, PDF с. 66","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66","pub":"Не поняли, что Он говорил им об Отце.","lit":"Они не поняли, что он говорит им об Отце.","parse":"Ǹ — они; mana — отрицание; faham — понять; ka — что; связь зависимой части; Baaba — отец; bɔm — об; о; no — выделительный элемент; à — он; go — предглагольный показатель; sendi — говорить; ngei — они; косвенная форма в этом контексте; sɛ — адресат.","note":"Baaba bɔm — тема речи, ngei sɛ — адресат. В дословном переводе go sendi не превращается автоматически в русское прошедшее время."},{"k":3,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."}],"refs":[{"t":"NT18, Ин 7:5","u":"https://zeno.fm/bible/DDNBIV/JHN/7/"},{"t":"NT18, Ин 4:29","u":"https://zeno.fm/bible/DDNBIV/JHN/4/"},{"t":"NT18, Лк 2:50","u":"https://zeno.fm/bible/DDNBIV/LUK/2/"},{"t":"NT18, 1 Кор 15:16","u":"https://zeno.fm/bible/DDNBIV/1CO/15/"},{"t":"NT18, Ин 1:20","u":"https://zeno.fm/bible/DDNBIV/JHN/1/"},{"t":"NT95, Ин 8:27, PDF с. 66","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=66"},{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П90","head":"","rst":true,"dendi":"À goono handunya. Nga mo ya na handunya tɛ amma handunya mana à bei.","source":"NT18, Ин 1:10","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"В мире был, и мир чрез Него на́чал быть, и мир Его не познал.","lit":"Он был в мире. Он же сотворил мир, но мир его не знал.","parse":"À — он, отсылка к действующему лицу пролога; goono — находиться, быть; handunya — мир; Nga — он, самостоятельная форма; mo — также, же; ya — выделение; na — показатель переходного действия; handunya — мир; tɛ — делать, здесь сотворить; amma — но; handunya — мир; mana — отрицание; à — он, здесь его; bei — знать.","note":"Весь стих состоит из двух законченных предложений и приведён целиком. Отсылку À следует читать в контексте пролога о Слове и свете. «Мир не знал» — переносное обозначение людей мира. Прошедшее время перевода не объявлено значением goono."},{"k":2,"pid":"П91","head":"","rst":true,"dendi":"À kaa nga ŋmɔne yom dɔ amma ǹ mana à ta.","source":"NT18, Ин 1:11","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Пришел к своим, и свои Его не приняли.","lit":"Он пришёл к своим, но они его не приняли.","parse":"À — он; kaa — приходить; nga — он, здесь притяжательная отсылка; ŋmɔne — собственный, свой; yom — показатель множественности; dɔ — к, в сфере указанного лица или группы; amma — но; ǹ — они; mana — отрицание; à — он, здесь его; ta — принимать.","note":"Полное предложение. nga ŋmɔne yom — «свои» как группа людей; слово «люди» отдельно не выражено. kaa здесь глагол прихода, в отличие от предглагольного употребления в П88. dɔ разбирается как послелог этой конструкции."}],"stray":[],"kind":"extra","meaning":"Встречается при отрицании события и отождествления. Не сводить к неизменному переводу «не в прошлом»: распределение с si и na требует отдельного анализа."},{"n":196,"title":"Охотиться","letter":"О","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":112,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":197,"title":"Ощущать (в сочетании maa jo)","letter":"О","variants":[{"label":"","form":"maa","notes":["Контекстное чувственное восприятие: ощутить жажду. Не имя maa и не слуховое восприятие из статьи «Слышать»."],"full":1,"status":"","examples":[{"k":1,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra"},{"n":198,"title":"Падать","letter":"П","variants":[{"label":"I","form":"kam","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.p ","letter":"П","variants":[{"label":"","form":"hantum","notes":[],"full":3,"status":"","examples":[{"k":1,"pid":"П66","head":"AL65, PDF и печ. с. 66","rst":false,"dendi":"N mà nufi hantum ka cou.","source":"AL65, PDF и печ. с. 66","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=66","lit":"Запиши результат и прочитай [его].","parse":"N — ты; mà — побудительный показатель; nufi — результат; hantum — писать, записывать; ka — связь действий; cou — читать.","note":"Полная инструкция к арифметическому заданию. Дополнение «его» в русском восстановлено из контекста и заключено в скобки: отдельного местоимения после cou нет."},{"k":2,"pid":"П76","head":"AL65, PDF и печ. с. 43","rst":false,"dendi":"N mà nn maayo hantum n tira kuna.","source":"AL65, PDF и печ. с. 43","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=43","lit":"Запиши их названия в своей тетради.","parse":"N — ты; mà — побудительный показатель; nn — они, здесь их; maayo — имена, названия; hantum — записывать; n — ты, здесь твоя; tira — тетрадь, письменная книга; kuna — внутри, в.","note":"Полное второе предложение учебного пункта. В предыдущем предложении названы известные учащемуся коммуны: nn отсылает к ним. В последней строке tirakuna напечатано слитно; пробел нормализован без изменения букв."},{"k":3,"pid":"П83","head":"AL65, PDF и печ. с. 78","rst":false,"dendi":"Nufi di hantum ka cii.","source":"AL65, PDF и печ. с. 78","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=78","lit":"Запиши этот результат и назови [его].","parse":"Nufi — результат; di — определительный элемент, этот; hantum — записывать; ka — связь действий; cii — сказать, назвать.","note":"Полная инструкция после задачи о делении; в печати hantumka без пробела — словораздел нормализован. Соседняя формула содержит несовпадающие 249 и 239: числовая опечатка не исправляется и не переносится в выбранную словесную инструкцию."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Писать, записывать; в учебной инструкции П66.","related":"П66."},{"n":205,"title":"Пить","letter":"П","variants":[{"label":"","form":"ham","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П50","head":"NT95, Ин 4:13, PDF с. 62","rst":true,"dendi":"Yesu tu à sɛ ka cii: Bɔrɔ kulu ka à na hari wɔne ham, à ye ka maa jo.","source":"NT95, Ин 4:13, PDF с. 62","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62","pub":"Иисус сказал ей в ответ: всякий, пьющий воду сию, возжаждет опять,","lit":"Иисус ответил ей и сказал: каждый человек, который выпьет этой воды, снова почувствует жажду.","parse":"Yesu — Иисус; tu — ответить; à — она; адресат, затем он — обобщённый человек; sɛ — адресат; ka — связь действий; перед à na — относительная связь; cii — сказать; Bɔrɔ — человек; kulu — все; в bɔrɔ kulu — каждый человек; na — показатель переходной конструкции; hari — вода; wɔne — этот; ham — пить; ye — снова; повторность в ye ka; maa — ощутить в сочетании maa jo; jo — жажда.","note":"Реплика относится к воде из колодца, о котором говорят собеседники; в следующем стихе развивается иное, образное употребление воды. Maa jo — «испытывать жажду», а не «слышать жажду». Перевод à как «она» в вводной реплике определяется адресатом-женщиной; местоимение не является исключительно мужским. Синодальная запятая в конце сохранена как граница части русского стиха; дендийское предложение закончено."}],"refs":[{"t":"NT95, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"},{"t":"NT18, Мф 27:34","u":"https://zeno.fm/bible/DDNBIV/MAT/27/"},{"t":"AL65, PDF с. 81","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=81"},{"t":"AL65, PDF с. 63","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=63"},{"t":"NT18, Деян 9:9","u":"https://zeno.fm/bible/DDNBIV/ACT/9/"},{"t":"NT18, Мк 14:23","u":"https://zeno.fm/bible/DDNBIV/MRK/14/"},{"t":"NT95, Ин 4:13, PDF с. 62","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=62"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":92,"meaning":"AL65 употребляет ham также о приёме лекарства и потреблении топлива; переносное употребление не смешано с буквальным питьём.","sci":"H, §E №165, с. 41. Практическая орфография и контекст требуют сверки."},{"n":206,"title":"Пища","letter":"П","variants":[{"label":"","form":"ŋwaariyo","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П64","head":"AL65, PDF и печ. с. 13","rst":false,"dendi":"Iri mà iri ŋwaariyo banda daabu.","source":"AL65, PDF и печ. с. 13","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=13","lit":"Давайте прикроем нашу пищу.","parse":"Iri — мы; mà — побудительный показатель; iri — наш, буквально «мы» в определении; ŋwaariyo — пища, еда; banda — компонент сочетания banda daabu «прикрыть»; daabu — закрывать, прикрывать.","note":"Полное заглавие учебного занятия о защите пищи; оно имеет форму побуждения. banda daabu переведено как сочетание. Отдельное пространственное значение banda здесь не установлено и не подменено «спиной». Словоразделы нормализованы без изменения букв и тонов."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Пища, еда; форма непосредственно засвидетельствована в П64. Предполагаемая основа и морфологическое членение не восстанавливаются по одной форме.","related":"П64."},{"n":207,"title":"Плавать","letter":"П","variants":[{"label":"","form":"ziyom","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 27:43","u":"https://zeno.fm/bible/DDNBIV/ACT/27/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":119,"meaning":"ziyom — название действия «плавание» в конструкции «уметь плавать», не подтверждённый инфинитив.","sci":"AZ, №63. Практическая орфография и контекст требуют сверки."},{"n":208,"title":"Плакать","letter":"П","variants":[{"label":"","form":"hẽ","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П55","head":"NT18, Ин 11:35","rst":true,"dendi":"Yesu hẽ.","source":"NT18, Ин 11:35","source_url":"https://zeno.fm/bible/DDNBIV/JHN/11/","pub":"Иисус прослезился.","lit":"Иисус заплакал.","parse":"Yesu — Иисус; hẽ — плакать.","note":"Целое краткое предложение; перед ним описаны плач Марии и пришедших с ней людей. Назализация ẽ сохранена. Начинательное «заплакал» — контекстный русский перевод, не выделенная морфема денди."}],"refs":[]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Плакать. Носовой гласный ẽ сохранён по NT18.","related":"П55."},{"n":209,"title":"Платить; воздавать","letter":"П","variants":[{"label":"","form":"bana","notes":["Глагол."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мк 12:14","u":"https://zeno.fm/bible/DDNBIV/MRK/12/"},{"t":"NT18, Лк 20:22","u":"https://zeno.fm/bible/DDNBIV/LUK/20/"},{"t":"NT18, Мф 18:30","u":"https://zeno.fm/bible/DDNBIV/MAT/18/"},{"t":"NT18, Рим 12:17","u":"https://zeno.fm/bible/DDNBIV/ROM/12/"},{"t":"NT18, Рим 2:6","u":"https://zeno.fm/bible/DDNBIV/ROM/2/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"Платёж, возвращение долга и воздаяние различаются по объекту и окружению."},{"n":210,"title":"Плевать","letter":"П","variants":[{"label":"","form":"tufa","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мк 7:33","u":"https://zeno.fm/bible/DDNBIV/MRK/7/"},{"t":"NT18, Мф 27:30","u":"https://zeno.fm/bible/DDNBIV/MAT/27/"},{"t":"NT18, Ин 9:6","u":"https://zeno.fm/bible/DDNBIV/JHN/9/"},{"t":"NT18, Мф 26:67","u":"https://zeno.fm/bible/DDNBIV/MAT/26/"},{"t":"NT18, Мк 14:65","u":"https://zeno.fm/bible/DDNBIV/MRK/14/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":96},{"n":211,"title":"Плод","letter":"П","variants":[{"label":"I","form":"ize","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 71","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=71"},{"t":"NT18, Мф 12:33","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"},{"t":"NT18, Ин 15:8","u":"https://zeno.fm/bible/DDNBIV/JHN/15/"},{"t":"NT18, Мк 12:2","u":"https://zeno.fm/bible/DDNBIV/MRK/12/"},{"t":"NT18, Иуд 1:12","u":"https://zeno.fm/bible/DDNBIV/JUD/1/"},{"t":"NT18, Ин 12:24","u":"https://zeno.fm/bible/DDNBIV/JHN/12/"}]},{"label":"II","form":"tuuri-ize","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Мф 12:33","u":"https://zeno.fm/bible/DDNBIV/MAT/12/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":54,"meaning":"ize — также «ребёнок»; tuuri-ize — плод дерева.","sci":"H, §E №59, с. 34. Практическая орфография и контекст требуют сверки."},{"n":212,"title":"Плохой","letter":"П","variants":[{"label":"I","form":"lalɔ","notes":["Варианты не считаются полными синонимами без дальнейшей проверки."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"}]},{"label":"II","form":"futu","notes":["Варианты не считаются полными синонимами без дальнейшей проверки."],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT95, PDF с. 12","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=12"},{"t":"NT18, Лк 8:23","u":"https://zeno.fm/bible/DDNBIV/LUK/8/"}]},{"label":"III","form":"laalɔ","notes":[],"full":1,"status":"","examples":[{"k":1,"pid":"П60","head":"NT18, 1 Фес 5:22","rst":true,"dendi":"Wa fee nda hɛ laalɔ dimi kulu.","source":"NT18, 1 Фес 5:22","source_url":"https://zeno.fm/bible/DDNBIV/1TH/5/","pub":"Удерживайтесь от всякого рода зла.","lit":"Отдаляйтесь от всякого вида плохого.","parse":"Wa — побуждение к адресатам; fee — отдаляться, держаться в стороне; nda — связь с тем, от чего отдаляются; hɛ — вещь, нечто; laalɔ — плохой; dimi — вид, род; kulu — всякий, весь.","note":"Контекст наставления задаёт значение fee nda «держаться в стороне от». Нельзя переводить nda одним неизменным русским предлогом. dimi здесь «вид/род», не автоматически dimi «семя»."}],"refs":[{"t":"NT18, Мф 15:19","u":"https://zeno.fm/bible/DDNBIV/MAT/15/"},{"t":"AL65, PDF с. 11","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=11"},{"t":"AL65, PDF с. 79","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=79"},{"t":"COV, PDF с. 2","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_7.pdf#page=2"},{"t":"AL65, PDF с. 20","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=20"},{"t":"AL65, PDF с. 17","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=17"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":186,"meaning":"laalɔ и futu — разные лексемы отрицательной оценки, не свободные синонимы."},{"n":213,"title":"Плыть (держаться на поверхности)","letter":"П","variants":[],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":143,"unestablished":"Практическое написание не установлено. Ниже сохранён научный указатель; фонетическая запись требует проверки перед переносом в практическую орфографию."},{"n":214,"title":"Поворачивать","letter":"П","variants":[{"label":"","form":"bɛrɛ","notes":[],"full":null,"status":"Полный пример с дословным разбором отсутствует. Источниковые привязки приведены ниже.","examples":[],"refs":[{"t":"NT18, Деян 9:40","u":"https://zeno.fm/bible/DDNBIV/ACT/9/"},{"t":"AL65, PDF с. 109","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=109"},{"t":"AL65, PDF с. 52","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=52"},{"t":"AL65, PDF с. 19","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=19"},{"t":"NT18, Лк 2:45","u":"https://zeno.fm/bible/DDNBIV/LUK/2/"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"swadesh","swadesh":126,"meaning":"bɛrɛ в учебных примерах также обозначает превращение/переработку."},{"n":215,"title":"Подобно; как (сравнение)","letter":"П","variants":[{"label":"","form":"zanga","notes":[],"full":2,"status":"","examples":[{"k":1,"pid":"П15","head":"AL65, PDF с. 29","rst":false,"dendi":"Bɔrɔ gàà gonda safu hinza zanga: bom, gaa bindi nda cee nda kambɛ.","source":"AL65, PDF с. 29","source_url":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29","lit":"Тело человека имеет три части: голову, туловище и ноги с руками.","parse":"Bɔrɔ — человек; gàà — тело в данном именном сочетании, не послелог; gonda — иметь; safu — часть; hinza — три; zanga — как / такие как; bom — голова; gaa bindi — средняя часть тела / туловище; nda — и / с; cee — ноги / стопы; nda — и / с; kambɛ — руки.","note":"Составная группа cee nda kambɛ составляет третью часть деления в учебном тексте, поэтому перечисление не исправлено на «четыре части». Типографическое ɑ в PDF передано обычным a; тоновые знаки не добавлены по догадке."},{"k":2,"pid":"П30","head":"NT95, Деян 2:4, PDF с. 76","rst":true,"dendi":"Cɔfɔ ǹ kulu tɔ nda Biya Halaala. Ǹ sinti ko sendi nda cinɛ ŋmani ŋmani zanga Biya ga ka ǹ no ǹ ma sendi.","source":"NT95, Деян 2:4, PDF с. 76","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76","pub":"И исполнились все Духа Святого, и начали говорить на иных языках, как Дух давал им провещевать.","lit":"Тогда они все исполнились Святым Духом. Они начали говорить на иных языках, как Дух дал им говорить.","parse":"Cɔfɔ — тогда; ǹ — они / им; kulu — все; tɔ — наполниться; nda — с; в конструкции с языком — на; Biya Halaala — Святой Дух; составное именование; sinti — начать; ko — связующий элемент; классификация предварительная; sendi — говорить; cinɛ — язык речи; ŋmani ŋmani — иные; повторённая форма; zanga — как; согласно; Biya — дух; ga — показатель; его точная функция здесь отдельно не установлена; ka — связующий элемент; no — дать; в данном глагольном окружении; ma — показатель зависимого побуждения.","note":"Оба предложения приведены для сохранения референта Biya. Ŋmani здесь означает «иной», а не владение языком. No после местоименного объекта здесь глагол «дать», а не предикативное no в П14. Значения ko и ga не подменены уверенной классификацией."}],"refs":[{"t":"AL65, PDF с. 29","u":"https://alpha.educmaster.bj/assets/images/documents/alpha_65.pdf#page=29"},{"t":"NT95, Деян 2:4, PDF с. 76","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=76"}]}],"extra_refs":[],"linked":[],"stray":[],"kind":"extra","meaning":"В П15 вводит перечисление частей. Не вопросительное mɛtɛ."},{"n":216,"title":"Показатель множественности: yom","letter":"П","variants":[{"label":"","form":"yom","notes":["В Eburu yom и cɛɛnɛ yom. Не выводится механическое тождество отдельного yom всем окончаниям -yom."],"full":3,"status":"","examples":[{"k":1,"pid":"П4","head":"NT18, 2CO 11:22","rst":true,"dendi":"Eburu yom no ba?","source":"NT18, 2CO 11:22","source_url":"https://zeno.fm/bible/DDNBIV/2CO/11/","pub":"Они Евреи?","lit":"[Они] евреи?","parse":"Eburu — еврей; yom — показатель множественности; no — предикативный элемент; ba — вопросительная частица.","note":"Отдельного подлежащего «они» в этой фразе нет; оно восстановлено в русском переводе по контексту."},{"k":2,"pid":"П32","head":"NT95, Ин 7:5, PDF с. 64","rst":true,"dendi":"Ba à cɛɛnɛ yom mana naane à gaa.","source":"NT95, Ин 7:5, PDF с. 64","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64","pub":"Ибо и братья Его не веровали в Него.","lit":"Даже его братья не верили ему.","parse":"Ba — даже; à — он; здесь его / ему; cɛɛnɛ — брат; yom — показатель множественности; mana — отрицание; naane — верить; gaa — послелог объекта веры.","note":"Начальное Ba — «даже», не конечная вопросительная ba. Значение наане здесь глагольное; статья «Вера» не заменяет статью «Верить»."},{"k":3,"pid":"П45","head":"NT95, Мф 13:51, PDF с. 13","rst":true,"dendi":"Yesu cii ǹ sɛ: Wom faham nda hɛ yom wɔ kulu? Ǹ tu ka cii à sɛ: Oò, Kpe.","source":"NT95, Мф 13:51, PDF с. 13","source_url":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13","pub":"И спросил их Иисус: поняли ли вы всё это? Они говорят Ему: та́к, Господи!","lit":"Иисус сказал им: вы поняли все эти вещи? Они ответили ему: да, Господь.","parse":"Yesu — Иисус; cii — сказать; ǹ / Ǹ — они; после sɛ — им; sɛ — адресат; Wom — вы; faham — понять; nda — элемент при объекте понимания; hɛ — вещь; yom — показатель множественности; wɔ — этот; kulu — все; tu — ответить; ka — связь действий; à — он; здесь ему; Oò — да; утвердительный ответ; Kpe — Господь; обращение.","note":"Вопрос также не содержит ba/dee. Oò относится к положительному вопросу о понимании; этот пример не устанавливает правило ответа на отрицательные вопросы. Тон Oò сохранён. Синодальное «спросил» передаёт речевое действие, тогда как буквальная глосса cii — «сказал»."}],"refs":[{"t":"NT18, 2CO 11:22","u":"https://zeno.fm/bible/DDNBIV/2CO/11/"},{"t":"NT95, Ин 7:5, PDF с. 64","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=64"},{"t":"NT95, Мф 13:51, PDF с. 13","u":"https://bibles.dbs.org/DDNBIV/pdf/DDNBIV.pdf#page=13"}]}],"extra_refs":[],"linked":[{"k":1,"pid":"П91","head":"","rst":true,"dendi":"À kaa nga ŋmɔne yom dɔ amma ǹ mana à ta.","source":"NT18, Ин 1:11","source_url":"https://zeno.fm/bible/DDNBIV/JHN/1/","pub":"Пришел к своим, и свои Его не приняли.","lit":"Он пришёл к своим, но они его не приняли.","parse":"À — он; kaa — приходить; nga — он, здесь притяжательная отсылка; ŋmɔne — собственный, свой; yom — показатель множественности; dɔ — к, в сфере указанного лица или груп
